 ### IO Parliament Agendas ###
 #HRE
 pa_hre_lessen_tax_burden: "Zmniejszenie obciążeń podatkowych"
 pa_hre_lessen_tax_burden_simple: "$pa_hre_lessen_tax_burden$"
 pa_hre_lessen_tax_burden_desc: "Obiecujemy obniżyć ich wymagany [ShowPaymentName('imperial_contribution')|l] w zamian za poparcie."
 pa_hre_elevate_prussia_to_kingdom: "[GetCountry('PRU').GetNameWithNoTooltip]: awans na [ShowCountryRankNameWithNoTooltip('rank_kingdom')|l]"
 pa_hre_elevate_prussia_to_kingdom_simple: "Awans Prus"
 pa_hre_elevate_prussia_to_kingdom_desc: "Władcy pruscy od zawsze z ambicją dążyli do władzy i chwały, formalnie żądając nawet tytułu królewskiego, musieli jednak zadowolić się mianem „królów Prus”. Jeśli podniesiemy status ich państwa, tak aby było to teraz [ShowCountryRankName('rank_kingdom')|l], możemy zyskać z ich strony nieco przychylności..."
 pa_hre_elevate_prussia_to_kingdom_tt: "[GetCountry('PRU').GetName] zyskują [event|el] związane z naszą decyzją."
 pa_hre_grant_imperial_titles: "Przyznanie tytułów cesarskich"
 pa_hre_grant_imperial_titles_simple: "$pa_hre_grant_imperial_titles$"
 pa_hre_grant_imperial_titles_desc: "$elector_plural$ z pewnością mocno docenią dodatkowe tytuły oraz prestiż ze strony korony."
 pa_hre_affirmation_of_free_city_rights: "Potwierdzenie praw wolnych miast"
 pa_hre_affirmation_of_free_city_rights_desc: "Jeśli odnowimy prawa i zabezpieczenia, jakimi cieszą się wolne miasta, zapewnimy im stabilność oraz dobrobyt w cesarstwie."
 opinion_hre_pa_supports_free_cities: "Kraj ten popiera [ShowSpecialStatusNamePluralWithNoTooltip('free_city')|l]"
 pa_hre_affirmation_of_free_city_rights_tt: "Każde niezależne [ShowSpecialStatusName('free_city')|l] zyskuje [ShowNamedValue('stability_mild_bonus')|+=2] pkt. [Concept('stability','stabilności')|e], podczas gdy każdy kraj toczący z nim wojnę traci [ShowBiasValue('opinion_hre_pa_supports_free_cities')|+] pkt. opinii, jaką ma o nim [GetUniqueInternationalOrganization('hre').GetLeaderTitle|l] organizacji [GetUniqueInternationalOrganization('hre').GetName]."
 ### New Generic Parliament Issues – 1.2 Expansion ###
 ## Crown
 royal_monopoly_on_trade: "Królewski monopol na handel"
 royal_monopoly_on_trade_desc: "Kupcy w naszym kraju zbyt długo czerpali ogromne zyski z handlu. Wprowadzając królewski monopol na kluczowe towary, przekazujemy te dochody w ręce korony, gdzie mogą przysłużyć się całemu państwu."
 charter_subject_governors: "Ustanowienie poddanych gubernatorów"
 charter_subject_governors_desc: "Nasze odległe ziemie wymagają uwagi, na którą korona nie może sobie pozwolić. Powołując urzędowych namiestników obdarzonych władzą administracyjną, umacniamy naszą kontrolę nad tymi terytoriami i zapewniamy, że dochody z nich trafiają zgodnie z przeznaczeniem do naszych skarbców."
 establish_colonial_administration: "Ustanowienie administracji kolonialnej"
 establish_colonial_administration_desc: "Kolonie, które założyliśmy za granicą, muszą być zarządzane jak pełnoprawne terytoria naszego królestwa – nie możemy pozostawić ich na łasce poszukiwaczy fortuny. Aby to osiągnąć, musimy stworzyć odpowiednie struktury administracyjne."
 reform_the_royal_treasury: "Reforma królewskiego skarbca"
 reform_the_royal_treasury_desc: "Niekontrolowana emisja monet spowodowała wzrost cen i osłabiła wartość naszej waluty. Dokładny nadzór nad finansami królestwa oraz reforma praktyk skarbowych przywróciłyby krajowi stabilność monetarną."
 issue_royal_censure: "Wydanie królewskiej nagany"
 issue_royal_censure_desc: "Nasi wrogowie podjęli działania, które nie mogą pozostać bez formalnego potępienia. Królewska nagana, poparta autorytetem parlamentu, dałaby wszystkim jasno do zrozumienia, że nie będziemy tolerować takiego postępowania."
 mandate_emergency_levies: "Nakaz nadzwyczajnego poboru"
 mandate_emergency_levies_desc: "Nasze wysiłki wojenne wymagają większego wsparcia ze wszystkich zakątków kraju. Korona musi wezwać wszystkie stany i poddanych, by zrobili wszystko, co w ich mocy, aby pomóc nam przetrwać tę ciężką próbę."
 fund_royal_art_patronage: "Ufundowanie królewskiego patronatu sztuki"
 fund_royal_art_patronage_desc: "Wielkość królestwa mierzy się nie tylko liczbą wojsk i bogactwem, ale także dziełami sztuki i kulturą, które tworzy. Powinniśmy wspierać artystów i rzemieślników, którzy uwiecznią chwałę naszej dynastii."
 ## Nobles
 institute_feudal_levies: "Wprowadzenie poboru feudalnego"
 institute_feudal_levies_desc: "Podstawą każdej potężnej armii jest konnica złożona ze szlachty. Ustanawiając formalne obowiązki wojskowe naszych rodów szlacheckich – a zwłaszcza nałożenie na nie obowiązku wystawiania ciężkiej kawalerii – wzmacniamy nasze siły na polu bitwy."
 establish_military_exercises: "Ustanowienie wojskowych ćwiczeń"
 establish_military_exercises_desc: "W czasach pokoju nasze oddziały szlachty stają się ospałe. Nakazując regularne ćwiczenia w terenie i turnieje dbamy o to, by nasi wojownicy pozostawali w doskonałej formie, a nasze armie były gotowe, gdy rozpocznie się walka."
 establish_heralds_college: "Stworzenie Szkoły Herbowej"
 establish_heralds_college_desc: "Kolejność tytułów, prawa do herbu oraz hierarchia szlachecka to sprawy o ogromnym znaczeniu. Szkoła Herbowa zaprowadziłaby porządek w tych kwestiach i wzmocniłaby prestiż naszego państwa za granicą."
 promote_chivalric_orders: "Promocja zakonów rycerskich"
 promote_chivalric_orders_desc: "Nasze zakony rycerskie są ucieleśnieniem szlachetnych wojskowych cnót. Przyznając im królewskie uznanie i wsparcie finansowe, umacniamy więzi między koroną a jej najlepszymi wojownikami."
 license_noble_privateers: "Zezwolenia dla korsarzy szlacheckich"
 license_noble_privateers_desc: "Morza obfitują w bogactwa dla odważnych, a szlacheckie rody mają doskonałe możliwości wyposażania okrętów wojennych w zamian za część dochodów. Wydając listy kaperskie, nadajemy ich przedsięwzięciom formę i legitymizację, a korona czerpie korzyści z wynikającego handlowego chaosu."
 monopolize_land_trade_routes: "Monopolizacja lądowych szlaków handlowych"
 monopolize_land_trade_routes_desc: "Nasza szlachta sprawuje kontrolę nad drogami, przełęczami i mostami, przez które musi przebiegać cały handel lądowy. Przyznając jej formalne prawa do pobierania opłat od kupców podróżujących lądem, kierujemy te zyski w ręce naszych najbardziej lojalnych poddanych."
 fund_noble_colonization: "Finansowanie kolonizacji szlacheckiej"
 fund_noble_colonization_desc: "Wielkie rody szlacheckie naszego królestwa dysponują środkami i ambicjami niezbędnymi do finansowania wypraw kolonialnych. Powinniśmy wspierać i zachęcać do podejmowania takich przedsięwzięć, aby rozszerzyć nasze wpływy poza horyzont."
 grant_exclusive_hunting_rights: "Przyznanie wyłącznych praw łowieckich"
 grant_exclusive_hunting_rights_desc: "Lasy i zwierzyna łowna w kraju stanowią naturalną domenę szlachty. Przyznając jej wyłączne prawa do polowań i zarządzania tymi terenami, umacniamy jej więź z majątkami ziemskimi oraz lojalność wobec korony."
 establish_noble_garrison_law: "Ustanowienie praw garnizonów szlacheckich"
 establish_noble_garrison_law_desc: "Niepokoje zagrażają naszemu państwu i nie zdołamy ich stłumić bez silnych lokalnych garnizonów. Niech prawo nakłada na rody szlacheckie obowiązek utrzymywania na swoich ziemiach ufortyfikowanych pozycji, gotowych do obrony korony i ojczyzny."
 ## Clergy
 establish_clergy_charity: "Utworzenie organizacji charytatywnej duchowieństwa"
 establish_clergy_charity_desc: "Nasi ludzie głodują, gdy spichlerze wielkich panów są pełne. Powinnością kościoła jest organizowanie pomocy dla ubogich i głodujących – obowiązek ten musimy teraz sformalizować i zapewnić mu odpowiednie środki."
 launch_religious_missions: "Rozpoczęcie misji religijnych"
 launch_religious_missions_desc: "Znaczna część naszego państwa pozostaje wciąż poza zasięgiem światła prawdziwej wiary. Kościół musi zorganizować i wysłać misjonarzy, aby sprowadzili te zagubione dusze do owczarni, a my zapewnimy im wsparcie niezbędne do osiągnięcia sukcesu."
 institute_canonical_law: "Wprowadzenie prawa kanonicznego"
 institute_canonical_law_desc: "Królestwo podzielone w wierze jest królestwem podzielonym w duchu. Poprzez kodyfikację prawa kościelnego i egzekwowanie jego jednolitego stosowania we wszystkich naszych prowincjach umacniamy więzi wiary łączące nasz lud."
 establish_inquisition_courts: "Utworzenie sądów inkwizycyjnych"
 establish_inquisition_courts_desc: "Nasiona herezji zapuściły już korzenie i tylko systematyczne działania sądów kościelnych mogą je wyplenić. Musimy działać szybko, zanim zaraza rozprzestrzeni się jeszcze bardziej."
 promote_religious_tolerance: "Promocja tolerancji religijnej"
 promote_religious_tolerance_desc: "W naszym królestwie mieszka wielu ludzi, którzy nie podzielają naszej wiary, a ich niezadowolenie rodzi niepokój. Mądrością kościoła jest uznanie, że tolerancja lepiej służy pokojowi niż nieustanne konflikty."
 fund_monastery_network: "Ufundowanie sieci klasztorów"
 fund_monastery_network_desc: "Klasztory w naszym kraju są ośrodkami nauki, dobroczynności i porządku. Powinniśmy rozbudować ich sieć i zapewnić im odpowiednie wsparcie, aby ich dobre uczynki dotarły do każdego zakątka królestwa."
 establish_pilgrimage_routes: "Ustanowienie szlaków pielgrzymek"
 establish_pilgrimage_routes_desc: "Święte miejsca naszej wiary przyciągają wiernych z bliska i z daleka. Poprzez formalną ochronę i utrzymanie dróg prowadzących do tych sanktuariów okazujemy naszą pobożność oraz zapewniamy naszemu krajowi uznanie i prestiż."
 regulate_tithe_collection: "Regulacja poboru dziesięciny"
 regulate_tithe_collection_desc: "Pobieranie dziesięciny stało się nieregularne i wzbudzało kontrowersje. Dzięki ujednoliceniu udziału kościoła w zyskach w całym królestwie zapewniamy duchowieństwu sprawiedliwe i pewne dochody, jednocześnie uwalniając naszych wiernych od ciężaru niepewności."
 sponsor_theological_seminaries: "Sponsorowanie seminariów teologicznych"
 sponsor_theological_seminaries_desc: "Wykształcone duchowieństwo stanowi fundament społeczeństwa zdrowego duchowo. Musimy wspierać finansowo tworzenie i rozbudowę seminariów, aby kształcić nowe pokolenie wykształconych kapłanów."
 ## Burghers
 promote_export_trade: "Promocja eksportu"
 promote_export_trade_desc: "Nasi kupcy są gotowi dostarczać nasze towary do najodleglejszych zakątków świata, ale aby rozbudować swoje sieci handlowe, potrzebują wsparcia parlamentu. Zaangażowanie w handel eksportowy wzbogaci królestwo i wzmocni naszą pozycję za granicą."
 establish_import_controls: "Wprowadzenie kontroli importu"
 establish_import_controls_desc: "Nie możemy pozwolić, by zalew zagranicznych towarów osłabił pozycję naszych producentów. Wprowadzając formalne kontrole tego, co trafia na nasze rynki, chronimy gałęzie przemysłu i zapewniamy konkurencyjność kupcom."
 fund_trade_expeditions: "Finansowanie ekspedycji handlowych"
 fund_trade_expeditions_desc: "Gildie kupieckie są gotowe połączyć swoje kapitały na potrzeby zagranicznych rejsów handlowych, jednak takie przedsięwzięcia wymagają oparcia na prawie oraz pewności wynikającej ze wsparcia parlamentu."
 establish_commodity_exchange: "Utworzenie giełdy towarowej"
 establish_commodity_exchange_desc: "Na naszych targowiskach panuje ożywiony ruch, brakuje jednak formalnej giełdy, na której można w uporządkowany sposób handlować towarami hurtowo. Dzięki dobrze zorganizowanej giełdzie towarowej sąsiedzi pozazdroszczą nam naszych rynków."
 promote_maritime_trade: "Promocja handlu morskiego"
 promote_maritime_trade_desc: "Szlaki morskie są drogami do bogactwa dla tych, którzy mają odwagę z nich korzystać. Powinniśmy inwestować w infrastrukturę i instytucje wspierające handel morski oraz zadbać o to, by nasi kupcy panowali na wodach."
 license_trading_companies: "Uprawnienia kompanii handlowych"
 license_trading_companies_desc: "Ryzyko i korzyści związane z handlem zagranicznym są zbyt duże, by mógł je ponosić samodzielnie pojedynczy kupiec. Powinniśmy udzielać uprawnień formalnym kompaniom handlowym, by mogły one łączyć zasoby i dzielić się tym ryzykiem, z korzyścią dla całego kraju."
 establish_customs_houses: "Utworzenie urzędów celnych"
 establish_customs_houses_desc: "Nasze granice są nieszczelne, a zagraniczni kupcy czerpią zyski z towarów, które trafiają do naszego królestwa bez odpowiedniej ewidencji. Budując urzędy celne, wprowadzamy porządek w imporcie i dbamy o to, by korona oraz nasi kupcy otrzymywali należną im część zysków."
 fund_artisan_guilds: "Finansowanie gildii rzemieślniczych"
 fund_artisan_guilds_desc: "Wykwalifikowani rzemieślnicy z naszego królestwa wytwarzają wyroby o niezwykłej jakości, ale brakuje im odpowiedniej organizacji i wsparcia, by w pełni wykorzystać ten potencjał. Powinniśmy finansować i chronić cechy, które ich reprezentują."
 establish_trade_insurance: "Utworzenie ubezpieczeń handlowych"
 establish_trade_insurance_desc: "Ryzyko związane z handlem – katastrofy okrętów, bandytyzm, wojny – powstrzymuje wielu kupców przed podejmowaniem przedsięwzięć, które mogłyby wzbogacić kraj. Tworząc formalne systemy ubezpieczeniowe, umożliwiamy naszym kupcom prowadzenie interesów z większym poczuciem bezpieczeństwa."
 expand_postal_relay_network: "Rozwój sieci pocztowych"
 expand_postal_relay_network_desc: "Niezawodna komunikacja to siła napędowa handlu. Nasze domy kupieckie są gotowe sfinansować sieć stacji pocztowych, które będą dostarczać wiadomości i towary szybciej niż kiedykolwiek wcześniej – to inwestycja, która zwróci się wielokrotnie."
 ## Peasants
 establish_common_food_stores: "Utworzenie wspólnych magazynów żywności"
 establish_common_food_stores_desc: "Nasi ludzie są narażeni na okrutne skutki nieurodzaju, a głód rodzi rozpacz. Tworząc wspólnych magazyny zbożowe, dbamy o to, by żadna klęska głodu, bez względu na to, jak dotkliwa, nie pozostawiła naszych ludzi bez pomocy."
 promote_farming_innovation: "Promowanie rolniczych innowacji"
 promote_farming_innovation_desc: "Nowe metody płodozmianu i uprawy przyniosły znakomite rezultaty na innych ziemiach. Powinniśmy wspierać ich wprowadzanie w całym naszym państwie, aby nasze pola rodziły obfitsze plony, a nasz lud mniej cierpiał z powodu niedostatku."
 sponsor_irrigation_projects: "Finansowanie projektów nawadniających"
 sponsor_irrigation_projects_desc: "Wiele terenów w naszym kraju mogłoby przynosić znacznie obfitsze plony, gdyby tylko udało się doprowadzić do nich wodę. Powinniśmy sfinansować budowę dróg wodnych i systemów nawadniających, które przekształcą jałowe tereny w urodzajne pola uprawne."
 reduce_serfdom: "Zmniejszenie poddaństwa"
 reduce_serfdom_desc: "Pęta niewoli ciążą na zwykłych ludziach, przywiązując ich do ziemi i hamując pracę, która stanowi źródło utrzymania nas wszystkich. Zmniejszając te obciążenia i zapewniając większą swobodę przemieszczania się, wzmacniamy lojalność i produktywność naszych poddanych."
 establish_village_councils: "Utworzenie rad wiejskich"
 establish_village_councils_desc: "Nasze wiejskie społeczności są rządzone przez odległych władców, którzy nie znają lokalnych potrzeb i nie dbają o nie. Tworząc rady wiejskie uprawnione do zarządzania miejscowymi sprawami, dajemy naszym mieszkańcom możliwość wypowiedzenia się i zaprowadzamy porządek w ich domach."
 charter_artisan_guilds: "Utworzenie cechów rzemieślniczych"
 charter_artisan_guilds_desc: "Mistrzowie i czeladnicy z naszych zakładów pracują ciężko, nie otrzymując za to żadnej oficjalnej pochwały ze strony korony. Przyznając przywileje cechowe bractwom rzemieślniczym w królestwie, wprowadzamy porządek prawny w ich działalności i zyskujemy przychylność tych, których ręce są podstawą naszego dobrobytu."
 subsidize_grain_imports: "Subwencje na import zboża"
 subsidize_grain_imports_desc: "Nasze rynki są w stanie wyżywić obywateli, ale tylko wtedy, gdy ceny zbóż pozostaną na poziomie dostępnym dla zwykłych ludzi. Dzięki dotowaniu importu zbóż dbamy o to, by niedobory i niedostatek nie doprowadzały naszych obywateli do rozpaczy."
 rural_crafts_charter: "Utworzenie wiejskiego rzemiosła"
 rural_crafts_charter_desc: "Monopole cechowe w naszych miastach niszczą rzemiosło domowe, które pozwala rodzinom na wsi przetrwać trudne okresy. Powinniśmy wspierać i chronić wiejskich rzemieślników przed takimi problemami, zapewniając zwykłym ludziom wolność gospodarczą, na którą zasługują."
 prevent_noble_enclosure: "Zapobieganie izolacji przez szlachtę"
 prevent_noble_enclosure_desc: "Wielcy panowie zbyt długo zagarniali wspólne ziemie, od których zależy przetrwanie naszych chłopów. Musimy podjąć działania, by chronić tę odrobinę, która im jeszcze pozostała, zanim niepokoje przerodzą się w coś znacznie groźniejszego."
 ## Wartime
 declare_war_taxes: "Wypowiedzenie wojny – podatki"
 declare_war_taxes_desc: "Nasze działania wojenne wymagają środków wykraczających poza to, co mogą zapewnić zwykłe dochody. Parlament musi zatwierdzić nadzwyczajne opłaty nakładane na wszystkie majątki – to obciążenie, które wszyscy ponoszą wspólnie dla przetrwania i chwały kraju."
 wartime_cavalry_reserve: "Wojenna rezerwa kawalerii"
 wartime_cavalry_reserve_desc: "Decydująca bitwa może rozegrać się w każdej chwili, dlatego musimy zadbać o to, by nasza ciężka kawaleria była w pełnej gotowości. Niech szlacheckie rody utrzymują swoich najlepszych wojowników konnych w ciągłej mobilizacji, aż do zwycięstwa w wojnie."
 fortify_frontier_passes: "Umocnienie przejść granicznych"
 fortify_frontier_passes_desc: "O sile naszych granic świadczy trudność, z jaką muszą się borykać wrogowie, by je przekroczyć. Powinniśmy przeznaczyć środki na wzmocnienie każdego podatnego na atak przesmyku – zamieniając naturalne bariery w śmiercionośną pułapkę dla każdego, kto odważy się nas zaatakować."
 military_chaplaincy: "Duszpasterstwo wojskowe"
 military_chaplaincy_desc: "Nasze armie walczą nie tylko w imię korony i ojczyzny, ale także w imię wiary i obowiązku. Dzięki włączeniu duchownych do naszych sił zbrojnych w roli kapelanów podtrzymujemy morale naszych żołnierzy w trudnych warunkach wojennych."
 establish_field_hospitals: "Utworzenie szpitali polowych"
 establish_field_hospitals_desc: "Zbyt wielu naszych żołnierzy ginie nie od ciosów wroga, lecz z powodu ran, które można wyleczyć, i chorób, którym można zapobiec. Niech kościół zorganizuje polowe szpitale, które będą towarzyszyć naszym armiom i ratować życie tych, którzy za nas walczą."
 naval_supply_contracts: "Kontrakty na zaopatrzenie floty"
 naval_supply_contracts_desc: "Nasza flota nie może pozostać na morzu bez niezawodnych dostaw, a cechy kupieckie dysponują możliwościami, dzięki którym taka aprowizacja jest możliwa. Zawierając z nimi formalne umowy na zaopatrzenie floty, gwarantujemy, że nasze okręty będą mogły walczyć bez obawy o wyczerpanie zapasów."
 fund_siege_engineers: "Finansowanie inżynierów oblężniczych"
 fund_siege_engineers_desc: "Mury naszych wrogów nie upadną bez specjalistycznej wiedzy niezbędnej do ich zburzenia. Nasze cechy rzemieślnicze mogą sfinansować zatrudnienie doświadczonych inżynierów oraz zakup sprzętu oblężniczego potrzebnego do zdobycia nawet najsilniejszych fortyfikacji."
 wartime_harvest_pooling: "Wojenne gromadzenie plonów"
 wartime_harvest_pooling_desc: "Żołnierze potrzebują prowiantu, a głodna armia nie walczy skutecznie. Dzięki zorganizowaniu gromadzenia nadwyżek plonów w regionalnych magazynach nasi ludzie mogą bezpośrednio wspierać broniące ich siły."
 supply_line_labor_draft: "Pobór pracowników linii zaopatrzeniowych"
 supply_line_labor_draft_desc: "Drogi, którymi dostarczamy zaopatrzenie na front, muszą być utrzymywane w dobrym stanie, a transport materiałów nie może się zatrzymać. Nasi obywatele mogą wesprzeć wysiłek wojenny, pracując na liniach zaopatrzeniowych – jest to wkład równie istotny jak każdy żołnierz walczący na froncie."
 ## Proximity
 royal_road_commission: "Królewska komisja dróg"
 royal_road_commission_desc: "Drogi wiodące przez nasze królestwo są tętnicami, którymi przepływają władza i handel. Tworząc odpowiednią sieć zadbanych szlaków królewskich, zapewniamy, że nasza władza szybko dociera do każdego zakątka naszych ziem."
 mountain_pass_charters: "Uprawnienia do przełączy górskich"
 mountain_pass_charters_desc: "Nasze szlacheckie rody strzegą przełęczy górskich dzielących nasze królestwo. Powierzając im zadanie utrzymania i obsadzenia tych przejść, dbamy o to, by odległość i ukształtowanie terenu nie izolowały już naszych prowincji od korony."
 establish_parish_waypoints: "Utworzenie postojów parafialnych"
 establish_parish_waypoints_desc: "Drogi naszego królestwa są długie, a pokonywane odległości męczące zarówno dla posłańców, jak i podróżnych. Tworząc postoje parafialne wzdłuż głównych szlaków, kościół może zapewnić odpoczynek, wskazówki i wsparcie wszystkim, którzy przemierzają nasze ziemie."
 coastal_trading_post_network: "Sieć przybrzeżnych punktów handlowych"
 coastal_trading_post_network_desc: "Nasze wybrzeża posiadają naturalne porty i punkty postojowe, które pozostają niewykorzystane z powodu braku odpowiedniej infrastruktury. Sieć nadmorskich placówek handlowych finansowana przez kupców pozwoliłaby obniżyć koszty i ryzyko związane z handlem morskim oraz zbliżyć odległe prowincje do stolicy."
 rural_road_upkeep_corvee: "Wspólne prace przy utrzymaniu dróg wiejskich"
 rural_road_upkeep_corvee_desc: "Nasze wiejskie drogi niszczeją z powodu braku systematycznej konserwacji. Wymagając od chłopskich gospodarstw niewielkiego wkładu pracy w utrzymanie lokalnych dróg w stanie przejezdnym, dbamy o to, by żadna część kraju nie została odcięta od centrum władzy."
