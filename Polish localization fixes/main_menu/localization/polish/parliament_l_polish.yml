 STATIC_MODIFIER_NAME_parl_wartime_officer_corps_mod: "Wzmocniony korpus oficerski"
 establish_standing_regiments: "Utwórz stałe pułki"
 establish_standing_regiments_desc: "Epoka werbowania żołnierzy w razie potrzeby minęła. Nasze rody szlacheckie powinny zapewniać wyszkolonych oficerów, którzy dowodziliby pułkami pozostającymi w stałej służbie królewskiej – siłę bojową, którą dysponuje korona, a nie ich pan."
 mandate_wartime_conscription: "Przeprowadź pobór wojenny"
 mandate_wartime_conscription_desc: "Nasi wrogowie gromadzą armie poborowych. Musimy zrobić to samo. Pozyskiwanie rezerw i rekrutów z parafii wypełnią nasze wojska w godzinie próby."
 promote_industrial_workshops: "Promuj warsztaty przemysłowe"
 promote_industrial_workshops_desc: "Bractwa rzemieślnicze, które niegdyś utrzymywały nasze miasta, nie są już w stanie sprostać wymogom produkcji naszej epoki. Powinniśmy inwestować w nowe manufaktury i zmechanizowane warsztaty, które produkują dużo więcej i znacznie szybciej, by nasze zawody mogły być na czasie."
 wartime_officer_corps: "Wzmocnij korpus oficerski"
 wartime_officer_corps_desc: "Szarża kawalerii już nie wystarcza. Teraz bitwy wygrywają umiejętności dowódców. Parlament powinien mieć wpływ na wybór najlepiej wyszkolonych i przygotowanych, zanim armia zacznie kampanię."
 pa_accept_estate_culture: "Zaakceptuj kulturę stanu"
 pa_accept_estate_culture_simple: "Przekup stan"
 pa_accept_estate_culture_desc: "[estate|e] żąda, by dominująca [culture|el] jego społeczności uzyskała oficjalną akceptację."
 pa_convert_to_estate_religion: "Nawróć się na religię stanu"
 pa_convert_to_estate_religion_simple: "Przekup stan"
 pa_convert_to_estate_religion_desc: "[estate|e] żąda, by kraj nawrócił się na [Concept('religion','religię')|e] jego społeczności."
 pa_change_court_language_to_estate_language: "Zmień język dworu"
 pa_change_court_language_to_estate_language_simple: "Przekup stan"
 pa_change_court_language_to_estate_language_desc: "[estate|e] żąda, by zmienić [court_language|el] na taki, który lepiej odpowiada tożsamości dworu."
 iw_militarize_country: "Militaryzuj naród"
 iw_militarize_country_desc: "Zwołaj [parliament|el], by wsparł awaryjną militaryzację, która przyzna [Concept('army_tradition','tradycję armii')|e] i wzmocni naszą najbardziej doświadczoną [Concept('army','armię')|e]."
