 #aristocracy_vs_plutocracy
 pa_push_towards_aristocracy: "Ruch na rzecz arystokracji"
 pa_push_towards_aristocracy_simple: "Pomoc dla arystokracji"
 pa_push_towards_aristocracy_desc: "$push_towards_desc$ akceptację szlachty jako najwyższej warstwy społecznej."
 pa_move_towards_aristocracy: "Poparcie dla arystokracji"
 pa_move_towards_aristocracy_simple: "Poparcie dla arystokracji"
 pa_move_towards_aristocracy_desc: "$entrench_desc$ wynieść szlachtę do statusu najwyższej warstwy społecznej."
