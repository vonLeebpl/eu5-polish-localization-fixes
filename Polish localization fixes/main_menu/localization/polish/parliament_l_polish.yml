 pa_push_towards_decentralized: "Ruch na rzecz autonomii"
 pa_push_towards_decentralized_simple: "Pomoc na rzecz autonomii"
 pa_push_towards_decentralized_desc: "$push_towards_desc$ akceptację szlachty jako autonomicznych władców ziem."
 pa_move_towards_decentralized: "Poparcie dla autonomii"
 pa_move_towards_decentralized_simple: "Poparcie dla autonomii"
 pa_move_towards_decentralized_desc: "$entrench_desc$ umożliwić szlachcie autonomiczną władzę nad ziemiami."
