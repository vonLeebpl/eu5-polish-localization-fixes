 TRADE_ORDER_MIN_PROFIT_TT: "Zamówienie nie będzie mogło realizować [Concept('trades','transakcji')] poniżej tego progu, zapewniając jej zyskowność.\n\nJeśli wartość jest ujemna lub niezaznaczona, [trade_order|l] będzie w stanie realizować [trades|l] ze stratą, w praktyce subsydiując [trade|l].\n\nIm bliższy jest zysk z najlepszej [Concept('trade','transakcji')] towaru, tym wolniej i oszczędniej wydawana jest wydajność handlowa oraz może jej nie zużywać, zamiast powodować załamanie ceny towary, a im dalej od progu, tym szybciej i bardziej się skaluje."
