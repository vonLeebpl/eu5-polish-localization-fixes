 TRADE_ORDER_MODE_PROFIT_TT: "Zlecenie wyda [merchant_capacity|el] na najbardziej dochodowe [Concept('trades','transakcje handlowe')|e], jakie może znaleźć dla wybranych towarów na określonych rynkach."
 TRADE_ORDER_MODE_FOOD_TT: "Zlecenie wyda [merchant_capacity|el] na [Concept('trades','transakcje handlowe')|e] pozyskujące najwięcej [Concept('food','żywności')|e] dla rynków, które tracą żywność i mają mniej niż [GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%] [Concept('food_stockpile','zapasów żywności')|e]."
 TRADE_ORDER_MODE_NEEDS_TT: "Zlecenie wyda [merchant_capacity|el] na pokrywające braki [Concept('goods','towary')|e] na wskazanych rynkach po kolei. Uwzględniane są tylko towary, których [Concept('stockpile','zapasy')|e] są mniejsze niż [GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%]."
 TRADE_ORDER_MODE_PROFIT_INFO: "W tym zleceniu najważniejszy jest #italic zysk#!: wydaje swoją [merchant_capacity|el] na najbardziej dochodowe [Concept('trades','transakcje handlowe')|e] dla wybranych towarów na wybranych rynkach."
 TRADE_ORDER_MODE_FOOD_INFO: "W tym zleceniu najważniejsza jest #italic żywność#!: wydaje swoją [merchant_capacity|e] na [Concept('trades','transakcje handlowe')|e] pozyskujące najwięcej [Concept('food','żywności')|e] dla rynków w potrzebie.\n\nRynek może liczyć na pomoc tylko wtedy, gdy bez tego zlecenia traciłby żywność, a jego [food_stockpile|el] są mniejsze niż [GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%]. Poniżej [GetDefine('NAI','TRADE_ORDER_FOOD_GROWTH_STOCKPILE_FRACTION')|V0%] zlecenie uzupełnia zapasy o [GetDefine('NAI','TRADE_ORDER_FOOD_MONTHLY_STOCKPILE_GAIN')|V0%] jego maksimum co miesiąc. Rynek powyżej [GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%] uznaje się za zaopatrzony i niczego nie otrzymuje.\n\nEksport zostaje wstrzymany, gdy rynek zlecenia ma mniej niż [GetDefine('NAI','TRADE_ORDER_FOOD_EXPORT_SELF_STOP_FRACTION')|V0%] [Concept('food_stockpile','zapasów żywności')], i jest anulowany, gdy ma mniej niż [GetDefine('NAI','TRADE_ORDER_FOOD_EXPORT_SELF_CANCEL_FRACTION')|V0%]."
 TRADE_ORDER_MODE_NEEDS_INFO: "W tym zleceniu najważniejsze są #italic potrzeby#!: wydaje swoją [merchant_capacity|e], by pokryć wszystkie towary na liście w kolejności od najwcześniejszych.\n\nTowar jest zaopatrywany tylko wtedy, gdy wskazany rynek zużywa go więcej, niż lokalnie wytwarza, a jego [Concept('stockpile','zapasy')|e] są poniżej [GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%]. Zlecenie obejmuje wartości, które zerują ten bilans, uwzględniając pomoc od innych i ignorując braki powodowane tylko przez eksport.\n\nGdy [Concept('stockpile','zapasy')|e] są poniżej[GetDefine('NAI','TRADE_ORDER_NEEDS_GROWTH_STOCKPILE_FRACTION')|V0%], zlecenie uzupełnia też je o [GetDefine('NAI','TRADE_ORDER_NEEDS_MONTHLY_STOCKPILE_GAIN')|V1%] ich maksimum co miesiąc, a [GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%] jedynie dba o bilans."
