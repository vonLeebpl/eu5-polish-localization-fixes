l_polish:
 spread_philhellenism: "Szerzenie filhellenizmu"
 spread_philhellenism_desc: "Propagując greckie nauczanie, sztukę i filozofię, chcemy kształtować, w jaki sposób nasz kraj jest postrzegany zarówno w domu, jak i za granicą. Ściągają do nas uczeni, artyści oraz zwolennicy kultury greckiej, wzmacniając nasz splendor i wpływy wskutek podziwu zamiast siły."
 spread_philhellenism_action: "$spread_philhellenism$"
 spread_philhellenism_active: "Polityka szerzenia filhellenizmu"
 spread_philhellenism_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')]"
 spread_philhellenism_action_progress_wordier: "[SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')]"
 spread_philhellenism_action_progress_tooltip: "[research_progress|e]: [SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')] \n\n[cultural_influence|e]: [SCOPE.sCountry('actor').GetModifierValue('cultural_influence_modifier')]"
 spread_philhellenism_action_progress_long_wordier: "@research_progress! [SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')] \n\n@cultural_influence! [SCOPE.sCountry('actor').GetModifierValue('cultural_influence_modifier')]"
 encourage_latin_militarism: "Zachęta do militaryzmu [ShowLanguageNameWithNoTooltip('latin_language')]ego"
 encourage_latin_militarism_desc: "Nasz kraj będzie spełniać łacińskie ideały uporządkowanej wojny: wymuszonych kontraktów, ustandaryzowanych ćwiczeń i rutynowych ciężarów wojennych. Taka dyscyplina bez wątpienia zmniejszy koszty utrzymania żołnierzy w polu oraz zadba o tradycję służby zawodowej."
 encourage_latin_militarism_action: "Zachęta do militaryzmu łacińskiego"
 encourage_latin_militarism_active: "Zachęcanie do militaryzmu łacińskiego"
 encourage_latin_militarism_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('army_maintenance_efficiency')]"
 encourage_latin_militarism_action_progress_wordier: "[army_maintenance|e]: [SCOPE.sCountry('actor').GetModifierValue('army_maintenance_efficiency')]"
 encourage_latin_militarism_action_progress_long_wordier: "@army_maintenance! [SCOPE.sCountry('actor').GetModifierValue('army_maintenance_efficiency')] \n\n@army_tradition! [SCOPE.sCountry('actor').GetModifierValue('monthly_army_tradition')]"
 encourage_latin_militarism_action_progress_tooltip: "[army_maintenance|e]: [SCOPE.sCountry('actor').GetModifierValue('army_maintenance_efficiency')] \n\n[army_tradition|e]: [SCOPE.sCountry('actor').GetModifierValue('monthly_army_tradition')]"
 AUTO_MODIFIER_NAME_bureaucracy_nomos_empsychos_high_legitimacy: "$nomos_empsychos_bureaucracy$"
 AUTO_MODIFIER_NAME_bureaucracy_nomos_empsychos_low_legitimacy: "$nomos_empsychos_bureaucracy$"
 cb_restore_roman_borders: "Przywrócenie romańskich granic"
 cb_restore_roman_borders_desc: "Wzywa nas splendor starego cesarstwa. Już czas, by feniks rozpostarł skrzydła. Niech przepadną ci, którzy ośmielają się stawać pomiędzy nami a naszą ambicją, by odtworzyć dawne [ShowScriptedGeographyName('roman_borders_geography')|l]."
 roman_borders_geography: "$ROM_ADJ$skie granice"
 epic_hellenic_history: "Epos historii helleńskiej"
 epic_hellenic_history_desc: "Nowa wersja znakomitej historii starożytnego świata greckiego na złoconych stronach zdobionych kaligrafią. To dzieło sztuki jest wyrazem uznania dla naszego bogactwa oraz wielkich osobowości, które mamy szczęście zwać swymi przodkami. Kronika ta zawiera zbiór opowieści m.in. o zniszczeniu Troi, gdzie dokonał się los wspaniałego Achillesa, podróżach legendarnego Odyseusza oraz wyprawach Jazona i jego Argonautów."
 nomos_empsychos_bureaucracy: "Nómos Émpsychos"
 nomos_empsychos_bureaucracy_desc: "Czerpiąc z idei żywego prawa (#italic Nómos Émpsychos#!), cesarz tworzy fundamentalny filar naszej administracji i uosabia samą suwerenną władzę. Zasada ta, wyrażona po raz pierwszy za panowania Justyniana, łączy ustawodawstwo, sądownictwo oraz dowodzenie w osobie cesarskiej, tworząc z głowy państwa sam trzon państwa rzymskiego."
 honorary_titles_bureaucracy: "Tytuły honorowe"
 honorary_titles_bureaucracy_desc: "#italic Patrikios#! i #italic Anthypatos#!, #italic Magistros#! i #italic Kouropalatēs#! – nasz dwór zarządza ambicjami poprzez szacunek, a nie rozkazy.\n\nTen złożony system, oparty na przyznawaniu honorowych rang, tytułów oraz przywilejów, pozwala cesarzowi przywiązywać generałów, senatorów i elity prowincji do tronu, wynagradzając lojalność, zniechęcając rywali oraz zmieniając sam prestiż w narzędzie władzy."
 court_eunuchs_bureaucracy: "Eunuchowie dworscy"
 court_eunuchs_bureaucracy_desc: "Wykształceni, lokalni i wyłączeni z ambicji dynastycznych eunuchowie dworscy tworzą zaufaną kadrę administracyjną. Ich bliskość z cesarzem oraz odporność na władzę krewnych czynią z nich idealnych powierników zarządzania pałacem, finansami i korespondencją cesarską."
 ritualistic_court_bureaucracy: "Dwór rytualistyczny"
 ritualistic_court_bureaucracy_desc: "Ceremoniał to rządzenie, które widać. Za sprawą regulowanych rytuałów, precedencji i widowiska dwór cesarski przekształca władzę w sakralny spektakl, który porządkuje hierarchię w kraju oraz onieśmiela cudzoziemskich posłów majestatem naszej wspaniałej stolicy, postrzeganej jako centrum cywilizowanego świata."
 sixty_books_of_the_basilika_bureaucracy: "Księgi Basiliká"
 HAS_SIXTY_BOOKS_OF_THE_BASILIKA_TRIGGER: "Posiada: $sixty_books_of_the_basilika_bureaucracy$"
 THIRD_HAS_SIXTY_BOOKS_OF_THE_BASILIKA_TRIGGER: "Posiada: $sixty_books_of_the_basilika_bureaucracy$"
 FATE_OF_THE_PHOENIX_DISASTER_ACTIVE_TRIGGER: "[disaster|e] „$fate_of_the_phoenix$” jest aktywna"
 THIRD_FATE_OF_THE_PHOENIX_DISASTER_ACTIVE_TRIGGER: "[disaster|e] „$fate_of_the_phoenix$” jest aktywna"
 sixty_books_basilika_satisfaction_scale_tt: "Kara za [estate_satisfaction|e] chłopstwa skaluje się wraz z suwakiem utrzymania wartości „$sixty_books_of_the_basilika_bureaucracy$”. (#R -5%#! przy pełnym utrzymaniu i #R -20%#! przy zerowym utrzymaniu)"
 sixty_books_of_the_basilika_bureaucracy_desc: "$sixty_books_of_the_basilika_bureaucracy$ oparte na #italic Corpus Juris Civilis#! Justyniana reorganizują prawo rzymskie w spójny [ShowLanguageName('greek_language')|l] korpus prawny. Tłumacząc, standaryzując i ujednolicając stulecia jurysprudencji, sprawiają, że prawo Cesarza jest niekwestionowane, ostateczne oraz uniwersalne."
 variable_tt_reformed_imperial_code_flag_via_flavor_byz_52: "$flavor_byz.52.title$"
 basilika_bigger_positive_tt: "[bureaucracy|e] [ShowBureaucracyTypeName('sixty_books_of_the_basilika_bureaucracy')] podwoi swój modyfikator #G pozytywny#!"
 romanitas_bureaucracy: "Romanitas"
 romanitas_bureaucracy_desc: "$romanitas_bureaucracy$ uznaje nieprzerwaną państwowość rzymską. Cesarz rządzi nie wskutek podbojów czy pochodzenia etnicznego, ale jako prawowity spadkobierca władzy, prawa oraz tradycji liczących ponad tysiąc lat. Ta tożsamość spaja cesarstwo i wiarę, ukazując władzę rzymską jako niebiańsko sankcjonowaną oraz moralnie najwyższą."
 imperial_senate_bureaucracy: "Senat cesarski"
 imperial_senate_bureaucracy_desc: "Senat złożony z wyższych dygnitarzy z nadania władzy cesarskiej służy jako organ zatwierdzający i doradczy. Jego zgoda uprawomocnia panowania, sukcesje oraz ważne działania, zachowując rzymską ciągłość, a także dbając, by niepodległość pozostawała w pełni cesarska."
 kephalai_bureaucracy: "Kephalai"
 kephalai_bureaucracy_desc: "#italic Kephalai#! to administracyjne i prawne kompendia stworzone, by ułatwić praktykę zarządzania cesarskiego. Zastępując starsze regionalne ustalenia, takie jak #italic Katepaníkion#!, destylują prawo, podatki i obowiązki wojskowe w standardowe dyrektywy, które ujednolicają rządy nad prowincjami."
 won_fate_of_the_phoenix_disaster_tt: "Jesteśmy zwycięzcami [Concept('disaster','katastrofy')|e] „[ShowDisasterName('fate_of_the_phoenix')]”"
 fop_renaissance_latin_merchants_tt: "Przyznaliśmy przywileje kupcom łacińskim"
 magister_militum_bureaucracy: "Strategarchia"
 magister_militum_bureaucracy_desc: "#italic Strategarchia#! uosabia instytucjonalne dowodzenie armią cesarską. Generałowie są przypisywani, zmieniani i ograniczani biurokracją, dzięki czemu władza wojskowa służy państwu zamiast osobistym ambicjom. Tym samym wojna staje się funkcją administracyjną, która jest zarządzana hierarchicznie, a nie lojalnościowo, co sprawia, że na szczyt trafiają tylko najlepsi."
 has_unlocked_bureaucracy_via_flavor_byz_31_tt: "Odblokowaliśmy tę [Concept('bureaucracy','biurokrację')|e] przez [event|el] „$flavor_byz.31.title$”, które może wystąpić po roku #Y 1400#!"
 themata_bureaucracy: "Thémata"
 themata_bureaucracy_desc: "Stworzone w odpowiedzi na presję egzystencjalną #italic Thémata#! dzielą cesarstwo na prowincjonalne dystrykty wojskowo-administracyjne. Każda z nich jest zarządzana przez #italic Strategósa#!, który łączy władzę cywilną z wojskową, umożliwiając sprawną obronę lokalną, a zarazem pozostaje formalnie podwładnym hierarchii cesarskiej."
 allelengyon_bureaucracy: "Allelengyon"
 allelengyon_bureaucracy_desc: "Pierwotnie utworzony za panowania cesarza Bazylego II (znanego także z przydomka #italic Bułgarobójcy#!) i zaczerpnięty z #L [ShowLanguageName('greek_language')|l]ego#! słowa #italic allilengýi#! (solidarność). #italic $allelengyon_bureaucracy$#! stanowił obowiązek podatkowy zaprojektowany do redystrybucji obciążenia podatkowego. Kiedy małorolni nie byli w stanie spełnić norm, odpowiedzialność przenosiła się prawnie na bogatszych właścicieli ziemskich dystryktu, co zapewniało przychody cesarstwu, zapobiegając zarazem zrujnowaniu i absorbcji ziem rolniczych. W ten sposób solidarność podatkowa stanowiła dźwignię stabilności oraz kontroli."
 katepanata: "Katepanáta"
 katepanata_desc: "Odpowiedzią na sąsiedzkie podżeganie do wojny jest konsolidacja nowo zdobytego terytorium poprzez zdecydowaną władzę wojskową. $katepanata$ wywodzący się ze słowa #italic katepánō#! – umieszczony na szczycie – stoją ponad standardem, grupując prowincje pod jednym dowódcą, który dysponuje władzą zarówno cywilną, jak i wojskową. Zyskały na znaczeniu w X i XI wieku za panowania m.in. cesarza Bazylego II w regionach takich jak [ShowRegionName('italy_region')] z siedzibą w [ShowLocationName('bari')] czy [ShowAreaNameWithNoTooltip('armenia_area')] stanowiąca niepewne pogranicze. Te wielkie dystrykty uniemożliwiały odległym, spornym ziemiom wpadnięcie w ręce rozproszonej władzy. Niechaj te bastiony naszej woli służą jako sztandar przeciwko wszystkim, którzy chcą odebrać nam koronę!"
 mos_maiorum: "Mōs Maiōrum"
 mos_maiorum_desc: "[ShowLanguageName('greek_language')] nie był jedynym językiem Rzymu. Nasze tytuły, prawa i pamięć o Wiecznym Mieście wykorzystuje [ShowLanguageName('latin_language')|l] oraz tradycje starsze niż nasz obecny język. $mos_maiorum$ formalizuje to dziedzictwo: urzędy pałacowe przyjmują precedensy starożytnego Rzymu, językiem dworskim staje się [ShowLanguageName('latin_language')|l], a praca naszych dyplomatów nagle okazuje się tańsza."
 has_completed_fate_of_the_phoenix_disaster: "Ukończyliśmy zwycięsko [Concept('disaster','katastrofę')|e] „[ShowDisasterName('fate_of_the_phoenix')]”"
