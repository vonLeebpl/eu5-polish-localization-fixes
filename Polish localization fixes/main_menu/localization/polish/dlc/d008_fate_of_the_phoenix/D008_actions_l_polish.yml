l_polish:
 loan_icon: "Pożyczenie ikony"
 loan_icon_desc: "Jedna [ShowWorkOfArtTypeName('icon')] zostanie pożyczona innemu [Concept('country','krajowi')|e] na #Y 10#! lat, za opłatą uzależnioną od poziomu [Concept('income','dochodów')|e] pożyczającego i [Concept('art_quality','jakości')|e] [Concept('work_of_art','dzieła sztuki')|e]. W ten sposób zwiększą się także [opinion|el] i [trust|el] pomiędzy dwoma krajami."
 loan_icon_tt_no_target: "Wyślemy ofertę wypożyczenia jednego z naszych [Concept('works_of_art','dzieł sztuki')|e] wybranemu [Concept('country','krajowi')|e] w zamian za [gold|el]. [Concept('gold','złota')|e]"
 loan_icon_tt: "Otrzymają naszą ofertę pożyczki dzieła „[SCOPE.sWorkOfArt('target').GetName]” w zamian za [SCOPE.GetValue('icon_price_value')|2] szt. [gold_i]."
 loan_icon_bad_economy_tt: "Są w kiepskiej sytuacji finansowej, więc #R mogą odmówić#!, jeśli ich [opinion|el] o nas jest zbyt słaba."
 loan_icon_choose_icon: "Wybierz, która [ShowWorkOfArtTypeName('icon')] zostanie pożyczona"
 not_already_receiving_icon_tt: "[ShowWorkOfArtTypeName('icon')] nie mogła być im już wypożyczona"
 icon_not_already_loaned_tt: "Nie możemy obecnie pożyczać tego dzieła sztuki typu [ShowWorkOfArtTypeName('icon')] od innego [Concept('country','państwa')|e]"
 mend_schism: "Naprawa schizmy"
 mend_schism_desc: "[ShowReligionGroupName('christian')] pozostaje podzielone od stuleci. Skoro wszystkie stolice pentarchii znajdują się pod naszą kontrolą, nadszedł czas, abyśmy wykorzystali nasze wpływy do zabliźnienia tej rany i pojednania kościołów."
 restore_rome_primacy: "Spraw, by [ShowLocationNameWithNoTooltip('rome')] odzyskał prymat"
 restore_rome_primacy_desc: "[ShowLocationName('rome')] był pierwszą stolicą Cesarstwa i nawet po podziale na część wschodnią i zachodnią pozostawał ważnym miastem aż do upadku zachodu. Teraz, gdy Wieczne Miasto znów znajduje się pod naszą kontrolą, możemy przywrócić mu dawną pozycję pierwotnej stolicy."
 patriarch_not_in_rome_tt: "Nasz [GetInternationalOrganizationType('autocephalous_patriarchate').GetName] nie może już mieć swojej głównej siedziby w mieście [ShowLocationName('rome')]"
 reestablish_hellenism: "Odtwórz [ShowReligionNameWithNoTooltip('hellenism_religion')|l]"
 reestablish_hellenism_desc: "Starożytna religia naszego ludu urzeka dworzan swoimi tradycjami i tajemniczością. Możemy przywrócić jej dawną świetność i sprawić, by znów stała się jednym z głównych wyznań."
 add_omen: "Dodaj omen"
 add_omen_god: "Wybierz bóstwo wskazujące omen"
 select_omen: "Wywołaj omen"
 select_omen_desc: "Nasza władza wywoła omen."
 select_omen_tt: "Zyskamy tymczasową premię dla naszego [Concept('country','kraju')|e]. Moc zależy od odpowiedniej [Concept('ability','zdolności')|e] [Concept('ruler','głowy państwa')|e]."
 select_omen_god_is_active_tt: "[target.GetName] zajmuje się już innym [Concept('omen','omenem')|e]."
 select_omen_god: "Wybierz omen"
 select_omen_god_desc: "Nasza najwyższa władza wybierze bóstwo, które wskaże nam [omen|el]."
 select_omen_god_tt: "Wybierz bóstwo, które wskaże [omen|el]."
 host_olympiad: "Organizacja olimpiady"
 host_olympiad_desc: "Nasza najwyższa władza zorganizuje zawody sportowe w [Concept('holy_site','świętym miejscu')|e] religii #L [ShowReligionAdjective('hellenism_religion')|l]kiej#!, by uczcić bogów."
 host_olympiad_location_tt: "Wybrana [location|el] zyskuje modyfikator „[ShowModifier('host_olympiad_location_modifier')]” na czas trwania olimpiady."
 host_olympiad_effect_tt_location: "Efekty zwiększą się proporcjonalnie do współczynnika [holy_site_importance_short|e] ([target.GetImportance]) jaki posiada [target.GetName]."
 host_olympiad_effect_tt_no_location: "Efekty zwiększą się proporcjonalnie do współczynnika [holy_site_importance_short|e] wybranego [Concept('holy_site','świętego miejsca')|e]."
 sponsor_troop_feast: "Sfinansowanie uczty dla wojska"
 sponsor_troop_feast_desc: "Organizując ucztę dla naszych żołnierzy, zadbamy o ich doskonałą kondycję i morale, dzięki czemu będą gotowi służyć naszemu krajowi."
 roman_festivals: "Organizacja rzymskiego festiwalu"
 roman_festivals_desc: "W każdym miesiącu odbywa się wiele świąt ku czci naszych licznych bogów, ale tym razem wykorzystamy władzę państwową, aby zorganizować wspaniałą uroczystość."
 explanation_roman_festivals_tt: "#L [ShowReligionAdjective('hellenism_religion')]cy#! wyznawcy obchodzą wiele świąt poświęconych swoim bóstwom. W każdym miesiącu uroczystości te mają inny charakter, a ich przebieg ma różne skutki."
 compitalia_tt: "Compitalia odbywają się ku czci #italic Lares Compitales#!, domowych bóstw skrzyżowań dróg."
 lupercalia_tt: "Lupercalia skupiają się na zdrowiu i płodności oraz na oczyszczeniu miasta."
 quinquatria_tt: "Quinquatria to święto, którego obiektem czci jest bogini [ShowGodName('athena_god')]."
 fordicidia_tt: "Fordicidia to święto poświęcone płodności, rolnictwu i hodowli zwierząt. Podczas tej uroczystości uczestnicy składają w ofierze#italic Tellus#!, bogini ziemi, ciężarną krowę."
 mercuralia_tt: "Mercuralia to święto upamiętniające wszystko to, z czym wiąże się bóg [ShowGodName('hermes_god')]."
 vestalia_tt: "Vestalia to święto ku czci bogini ogniska domowego, #italic Westy#!."
 neptunalia_tt: "Neptunalia to święto, podczas którego cześć otrzymuje [ShowGodName('poseidon_god')]."
 vinalia_rustica_tt: "Święto Vinalia Rustica poświęcone jest zbiorom winogron, uprawie warzyw i płodności. Podczas obchodów cześć otrzymują zarówno [ShowGodName('zeus_god')], jak i [ShowGodName('aphrodite_god')]."
 ludi_romani_tt: "Festiwal Ludi Romani obejmuje szereg gier i rozrywek, z którymi powinien zadowolić się [ShowGodName('zeus_god')]."
 equus_october_tt: "Październikowe obchody święta Equus obejmują festiwale wyścigów konnych oraz ofiarę z konia, którą przyjmie [ShowGodName('ares_god')] na zakończenie okresu zbiorów i kampanii wojennych."
 ludi_plebeii_tt: "Ludi Plebeii to święto obejmujące liczne przedstawienia teatralne i zawody sportowe poświęcone zwykłym ludziom."
 saturnalia_tt: "Saturnalia to święto ku czci boga czasu, #italic Saturna#!."
 greek_festivals: "Odrodzenie starożytnego greckiego święta"
 greek_festivals_desc: "Każdy region na naszym terytorium organizuje specjalne święto ku czci jednego lub kilku spośród naszych licznych bogów. Wykorzystamy potęgę państwa, aby wesprzeć każdy z tych regionów i wzmocnić wysiłki zmierzające do zorganizowania najwspanialszej uroczystości, jaką kiedykolwiek widziano."
 greek_festivals_tt: "Posiadamy co najmniej jedną z wymienionych prowincji: [ShowProvinceDefinitionName('laconia_province')], [ShowProvinceDefinitionName('achaea_province')], [ShowProvinceDefinitionName('arcadia_province')], [ShowProvinceDefinitionName('attica_province')], [ShowProvinceDefinitionName('smyrna_province')], [ShowProvinceDefinitionName('central_macedonia_province')], [ShowProvinceDefinitionName('lower_macedonia_province')], [ShowProvinceDefinitionName('aetolia_province')], [ShowProvinceDefinitionName('rodos_province')], [ShowProvinceDefinitionName('messenia_province')], [ShowProvinceDefinitionName('aydin_province')]."
 gymnopaedia_tt: "Święto Gymnopaedia obchodzone jest w #italic Sparcie#! na cześć boga #italic Apolla#!."
 gymnopaedia_tt_mod: "Otrzymamy modyfikator „[ShowModifier('gymnopaedia_modifier')]”."
 laphria_tt: "Święto Laphria obchodzi się w prowincji [ShowProvinceDefinitionName('achaea_province')] ku czci bogini #italic Artemidy#!."
 laphria_tt_mod: "Otrzymamy modyfikator „[ShowModifier('laphria_modifier')]”."
 lykaia_tt: "Święto Lykaia obchodzone jest w prowincji [ShowProvinceDefinitionName('arcadia_province')] jako rytuał przejścia dla dorastającej młodzieży oraz jako metoda obrony przed wilkołakami."
 lykaia_tt_mod: "Otrzymamy modyfikator „[ShowModifier('lykaia_modifier')]”."
 panathenaic_games_tt: "Igrzyska Panateńskie odbywają się w prowincji [ShowProvinceDefinitionName('attica_province')], a czczoną na nich boginią jest [ShowGodName('athena_god')]."
 panathenaic_games_tt_mod: "Otrzymamy modyfikator „[ShowModifier('panathenaic_games_modifier')]”."
 apaturia_tt: "Święto Apaturia obchodzone jest w prowincji [ShowProvinceDefinitionName('smyrna_province')], a czczonymi wówczas bóstwami są [ShowGodName('zeus_god')] i [ShowGodName('athena_god')]."
 apaturia_tt_mod: "Otrzymamy modyfikator „[ShowModifier('apaturia_modifier')]”."
 hetairideia_tt: "Święto Hetairideia obchodzone jest w prowincji [ShowProvinceDefinitionName('central_macedonia_province')], a uczczonym bogiem jest [ShowGodName('zeus_god')]."
 hetairideia_tt_mod: "Otrzymamy modyfikator „[ShowModifier('hetairideia_modifier')]”."
 apellai_tt: "Święto Apellai obchodzone jest w prowincji [ShowProvinceDefinitionName('aetolia_province')] ku czci boga #italic Apolla#!."
 apellai_tt_mod: "Otrzymamy modyfikator „[ShowModifier('apellai_modifier')]”."
 halieia_tt: "Święto Halieia obchodzone jest w prowincji [ShowProvinceDefinitionName('rodos_province')] ku czci boga #italic Heliosa#!."
 halieia_tt_mod: "Otrzymamy modyfikator „[ShowModifier('halieia_modifier')]”."
 heraclean_games_tt: "Igrzyska Heraklejskie odbywają się w prowincji [ShowProvinceDefinitionName('lower_macedonia_province')] ku czci herosa i boga, #italic Heraklesa#!."
 heraclean_games_tt_mod: "Otrzymamy modyfikator „[ShowModifier('heraclean_games_modifier')]”."
 carneia_tt: "Święto zwane Karneja obchodzone jest w prowincji [ShowProvinceDefinitionName('messenia_province')] ku czci boga #italic Apolla#!."
 carneia_tt_mod: "Otrzymamy modyfikator „[ShowModifier('carneia_modifier')]”."
 panionia_tt: "Święto Panionia obchodzone jest w prowincji [ShowProvinceDefinitionName('aydin_province')], a podczas obchodów hołd odbiera [ShowGodName('poseidon_god')]."
 panionia_tt_mod: "Otrzymamy modyfikator „[ShowModifier('panionia_modifier')]”."
 hire_advisor_eunuch_chance_tt: "10 – 100% szans na zatrudnienie [Concept('character','postaci')|e] z cechą „[ShowTraitName('castrated')]” z wyższymi średnimi [Concept('abilities','zdolnościami')|e], które skalują się z ugruntowaniem biurokracji „[ShowBureaucracyTypeName('court_eunuchs_bureaucracy')]” i modyfikatorem „[ShowModifierTypeName('eunuch_power')]”."
 grant_a_triumph: "Udzielenie triumfu"
 grant_a_triumph_desc: "Sukcesy należy świętować. Kompetentnego dowódcę wojskowego warto zatem zaprezentować ludowi jako zwycięzcę podczas spektakularnej triumfalnej parady."
 grant_a_triumph_tt: "W ciągu ostatnich 5 lat wygraliśmy wojnę."
 grant_a_triumph_triumphant_bonus_tt: "Wybrana [character|el] otrzyma cechę [ShowTraitName('triumphant')]"
