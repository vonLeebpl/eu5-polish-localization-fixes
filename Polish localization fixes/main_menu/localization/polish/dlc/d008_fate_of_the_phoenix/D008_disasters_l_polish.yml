l_polish:
 #Fate of the Phoenix
 fate_of_the_phoenix: "Losy Feniksa"
 fate_of_the_phoenix_desc: "W ostatnich stuleciach byliśmy świadkami powolnego upadku naszego wspaniałego państwa. Ciągłe walki wewnętrzne, niestabilność i trwający kryzys wywołany przez [ShowSituationName('rise_of_the_ottomans')] skazują nas i nasz lud na zagładę, zaś [GetCountry('SER').GetName] i [GetCountry('BUL').GetName] naruszają naszą północną granicę. Musimy położyć kres korupcji nieskrępowaną siłą i wytrwałością, by przywrócić autorytet korony, zanim będzie za późno..."
 remember_no_turk_tt: "Oprócz nas żaden inny [country|el] ze [Concept('capital','stolicą')|e] w regionie [ShowRegionName('anatolia_region')] nie posiada więcej niż #Y 100#! [Concept('locations','lokacji')|e] (wliczając [Concept('subjects','poddanych')|e]) i jest przedstawicielem kultury #L [ShowCultureName('turkish_culture')|l]kiej#! albo #L [ShowCultureName('turkoman_culture')|l]kiej#! lub ma [Concept('government_reform','reformę rządową')|e] „[ShowGovernmentReformName('anatolian_beylik')]”."
 #Fate of the Phoenix Events (to be moved)
 fate_of_the_phoenix.1.title: "Losy Feniksa"
 fate_of_the_phoenix.1.desc_a: "Niegdyś mury #L [ShowLocationName('constantinople')]a#! oznaczały centrum świata. Stamtąd płynęły prawo, wiara i ład cesarski – prawdziwe dziedzictwo samego $ROM$u. Teraz ten spadek stanowi dla nas ciężkie brzemię.\n\nLata intryg, wątpliwych zwycięstw oraz słabnącej władzy sprawiły, że [ROOT.GetCountry.GetFlavorRank|l] pozostaje nim już tylko z nazwy. Poza granicami gromadzą się nowe potęgi, które są cierpliwe i głodne, a w wewnątrz nich stare urzędy gniją z zaniedbania. Nasz lud zasługuje na lepszy los godzien splendoru i wpływów naszych wspaniałych przodków!"
 fate_of_the_phoenix.1.desc_b: "Dochodzą nas wieści z #L [ShowLocationName('constantinople')]a#! Wygląda na to, że starożytny tron cesarski jest zagrożony, a jego władza słabnie pod ciężarem sporów oraz zaniedbań. Przez pokolenia [target_location.GetRank.GetName|l] decyduje o losach ziem #L [ShowReligionGroupAdjective('christian')|l]ich#! w regionie [ShowRegionName('balkan_region')], jednocząc nasze historie wiarą i zwykle utrzymując miecze w pochwach.\n\nTeraz kontrola ta słabnie, a równowaga, która niegdyś strzegła naszych granic, staje się męcząco niepewna. Niektórzy spośród arystokratycznych rodów nakazują ostrożność, jako że upadek takiego filaru mógłby wstrząsnąć wszystkimi, którzy są na nim wsparci. Inni są bardziej bezpośredni, twierdząc, że stare gwarancje zanikają, a to, co niegdyś rozstrzygały tradycje, wkrótce będzie rozstrzygać siła. W tych niełatwych czasach obrany przez nas kurs dotknie nie tylko [ROOT.GetCountry.GetFlavorRank|l], ale odbije się głośnym echem także poza nim."
 fate_of_the_phoenix.1.desc_c: "Słabość cesarska rzadko manifestuje się z fanfarami. Powtarzające się przejawy słabości, niezdolność obrony granic oraz utrata prestiżu, jakim cieszyło się [GetCountry('BYZ').GetLongName], są oznakami, że ich czas świetności zbliża się ku raptownemu końcowi. Tym samym sytuacja na zachodzie nie wymaga już szacunku ani ostrożności, a jedynie kalkulacji. To my będziemy ucztować na ich szczątkach i zajmiemy ich miejsce."
 fate_of_the_phoenix.1.a: "Jest jeszcze nadzieja."
 fate_of_the_phoenix.1.b: "Zmiana to okrutna pani..."
 fop_parameters_a_tt: "Rezultat tej katastrofy zdecyduje o naszym losie. W tych trudnym czasie otrzymamy dostęp do unikatowych [Concept('actions','działań')|e] w panelu [Concept('disaster','katastrofy')|e]"
 fop_parameters_b_tt: "Jeśli zdołamy zakończyć [Concept('disaster','katastrofę')|e], powstrzymując upadek, na nowo napiszemy historię zwiastującą drugą złotą erę naszego ludu"
 fop_paramenters_bul_tur_ser_tt: "Podczas gdy [GetCountry('BYZ').GetLongName] przechodzi [Concept('disaster','katastrofę')|e] „[ShowDisasterName('fate_of_the_phoenix')]”, zyskamy możliwość wykorzystania jego słabości"
 fate_of_the_phoenix.2.title: "Odzyskano lokację [target_location.GetName]!"
 fate_of_the_phoenix.2.desc: "Sztandary, którymi chlubi się [ROOT.GetCountry.GetFlavorRank|l], znów powiewają nad miastem [target_location.GetName]. Ten ważny port egejski, z dawna atakowany przez tureckich wodzów, piratów i rywali, powraca w #L [ROOT.GetCountry.GetAdjective|l]kie#! ręce. Jego przystanie oraz rynki są zniszczone, ale wciąż istnieją. To, w jaki sposób postanowimy odbudować nasze nowe mienie, zdecyduje o naszej pozycji na wschodnich morzach na całe pokolenia."
 fate_of_the_phoenix.2.a: "Odbudujmy port."
 fate_of_the_phoenix.2.b: "Zamiast tego odnówmy rynki i magazyny."
 building_set_to_max_level_tt: "[building|e] będzie ustawiona na poziom maksymalny"
 fate_of_the_phoenix.3.title: "$fate_of_the_phoenix.2.title$"
 fate_of_the_phoenix.3.desc: "[target_location.GetName], niegdyś schronienie władców i siedziba władzy cesarskiej po katastrofie 1204 roku, znów znajduje się pod naszą kontrolą. W tych murach państwo przetrwało wygnanie, strzegło swych praw oraz zachowało prawo do powszechnej władzy. Jego odnowienie jest zatem czymś więcej niż zyskiem terytorialnym. W istocie to wybór drogi, jaką teraz będzie kroczyć [ROOT.GetCountry.GetFlavorRank|l]."
 fate_of_the_phoenix.3.a: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetNameWithNoTooltip] będzie osobiście nadzorować ten projekt!"
 fate_of_the_phoenix.3.b: "Oznaka powracającego cesarskiego splendoru!"
 fate_of_the_phoenix.3.c: "Czas odbudować administrację regionu [ShowRegionNameWithNoTooltip('anatolia_region')]!"
 fate_of_the_phoenix.4.title: "$fate_of_the_phoenix.2.title$"
 fate_of_the_phoenix.4.desc: "[target_location.GetName], niegdyś kolebka władzy #L [GetCountry('TUR').GetAdjective|l]kiej#!, jest w cesarskich rękach. Dawniej bejliki czerpały siłę, ambicje i dochody z tego miejsca. Jego przejęcie przekazuje jasny komunikat: [ShowRegionName('anatolia_region')] się zmieniła, a [ROOT.GetCountry.GetFlavorRank|l] nie będzie już tylko się bronić."
 fate_of_the_phoenix.4.a: "[ShowRegionNameWithNoTooltip('anatolia_region')] jest nasza!"
 unlocks_demand_beylik_tribute_disaster_action_tt: "Przyznaje dostęp do [Concept('action','działania')|e] „[ShowGenericActionName('demand_beylik_tribute')]” na czas trwania tej [Concept('disaster','katastrofy')|e]"
 fate_of_the_phoenix.5.title: "Zwycięstwo nad krajem [loser.GetNameWithNoTooltip]"
 fate_of_the_phoenix.5.desc: "Wzrastająca niestabilność powodowana waśniami bejlików sprawiła, że na znaczeniu zyskało państwo [loser.GetLongName]. Stosując siłę oraz umiejętną dyplomację, zaczęło stanowić ciągłe zagrożenie dla niepodległości państw, nie wyłączając nas samych. Jednak ostatnie zwycięstwa nad agresorami służą przypomnieniu, że nawet w tych burzliwych czasach $ROM$ walczy jak lew. Niechaj ta chwila stanie się przełomem – momentem nastania nowej ery, która cofnie upadek ostatnich lat!"
 fate_of_the_phoenix.5.a: "Wiatr się zmienia!"
 high_legitimacy_grants_extra_benefits_tt: "Zachowywanie powyżej #Y 50#! [Concept('legitimacy','prawomocności')|e] przez #Y 30#! lat znacząco zwiększy naszą [Concept('assimilation','asymilację')|e] i [Concept('integration','integrację')|e] [Concept('locations','lokacji')|e]"
 fate_of_the_phoenix.6.title: "Prowincja [target_province.GetNameWithNoTooltip] opiera się naszej władzy"
 fate_of_the_phoenix.6.desc: "Prowincja [target_province.GetName] odmawia współpracy w tym trudnym okresie. Jeśli nie spełnimy tamtejszych oczekiwań w kwestii autonomii, może wybuchnąć otwarty bunt. Nasi doradcy zalecają ustępstwa, ale [ROOT.GetCountry.GetFlavorRank|l] nie może sobie pozwolić na dalszą utratę autorytetu."
 fate_of_the_phoenix.6.a: "Feniks nie zajmuje się błahymi skargami."
 fate_of_the_phoenix.6.b: "Może [target_character.GetShortNameWithNoTooltip] się tym zajmie?"
 fate_of_the_phoenix.6.c: "Powinniśmy słuchać ludu!"
 target_character_goes_to_target_province_to_restore_order_tt: "[target_character.GetName] będzie nadzorować przywrócenie ładu w prowincji [target_province.GetName]. To oznacza, że będzie [Select_CString(target_character.IsFemale,'niedostępna','niedostępny')] przez #Y 2#! lata"
 fate_of_the_phoenix.7.title: "Słabość kraju [target_country.GetNameWithNoTooltip]"
 fate_of_the_phoenix.7.desc: "[target_country.GetName] wykazuje wyraźne oznaki słabości, a nasza bliskość geograficzna jest dla nas rzadką okazją. Jeśli mamy wysuwać żądania, musimy działać szybko, zanim [target_character.GetName] przywróci ład i siłę."
 fate_of_the_phoenix.7.a: "Nadszedł nasz czas."
 fate_of_the_phoenix.7.b: "Równowaga sił musi być zachowana!"
 we_may_have_another_chance_soon_tt: "#italic W przyszłości może się pojawić kolejna szansa na to...#!"
 fate_of_the_phoenix.8.title: "Wojny państwa [actor.GetNameWithNoTooltip]"
 fate_of_the_phoenix.8.desc: "[actor.GetName] toczy obecnie wojnę przeciwko tym, których ogłasza wrogami Prawdziwej Wiary. Jako że i oni, i my słuchamy tego, co ma do powiedzenia [GetInternationalOrganizationType('autocephalous_patriarchate').GetNameWithNoTooltip], domagają się teraz, abyśmy stanęli u ich boku z bronią w ręku przeciwko rzekomemu wspólnemu wrogowi. Jeśli odmówimy, grożą nam wykluczeniem z samego Patriarchatu, co stanowiłoby poważną zniewagę duchową, rzucającą długi cień na stosunki między naszymi królestwami."
 fate_of_the_phoenix.8.a: "A więc wojna!"
 fate_of_the_phoenix.8.b: "Nie traćmy na to czasu."
 fate_of_the_phoenix.9.title: "[target_army.GetNameWithNoTooltip] i dezerterzy"
 fate_of_the_phoenix.9.desc: "Docierają do nas głęboko niepokojące raporty, których tematem jest [target_army.GetName]. Kieruje nią [target_character.GetName], ale morale załamało się i mnożą się dezercje. Tego typu porażki kładą się cieniem na [ROOT.GetCountry.GetFlavorRank|l] oraz wzmacniają naszych wrogów."
 fate_of_the_phoenix.9.a: "Tchórze! Sami tchórze!"
 target_army_suffers_losses_tt: "[target_army.GetName] traci #R [ROOT.GetVariable('visual_strength_loss_variable').GetValue|V2]%#! [Concept('strength','sił')|e] wskutek dezercji"
 fate_of_the_phoenix.10.title: "Pojawienie się lojalnego stratega"
 fate_of_the_phoenix.10.desc: "Przez dziesięciolecia [target_character.GetName] i dowodzona przez [Select_CString(target_character.IsFemale,'nią','niego')] [target_unit.GetName] stanowią wzorce wiernej służby. Dzięki lojalności i zwycięstwom [Select_CString(target_character.IsFemale,'stała się','stał się')] dla ludzi symbolem dyscypliny oraz determinacji w czasach niepewności."
 fate_of_the_phoenix.10.a: "[target_character.GetNameWithNoTooltip] poprowadzi nas do zwycięstwa!"
 major_victories_enhance_stats_tt: "Jeśli [target_character.GetName] wygrywa główne [battles|el], [Select_CString(target_character.IsFemale,'jej','jego')] [abilities|el] mogą się polepszyć"
 fate_of_the_phoenix.11.title: "[target_character.GetNameWithNoTooltip] odnosi wielkie zwycięstwo"
 fate_of_the_phoenix.11.desc: "[target_unit.GetName] odnosi w lokacji [target_location.GetName] wspaniałe zwycięstwo nad armią kraju [target_losing_country.GetName]. Wiadomość o triumfie szybko się roznosi, przywracając wiarę w to, że Feniks wciąż walczy. [target_character.GetShortName] może stać się postacią legendarną."
 fate_of_the_phoenix.11.a: "Niech zawsze dowodzi naszymi armiami!"
 fate_of_the_phoenix.12.title: "[target_character.GetShortNameWithNoTooltip] ponosi porażkę"
 fate_of_the_phoenix.12.desc: "Czarny dzień pełen złych znaków! [target_character.GetName] [Select_CString(target_character.IsFemale,'poniosła','poniósł')] w lokacji [target_location.GetName] straszliwej porażki w starciu z armią, którą [Select_CString(target_character_2.IsFemale,'kierowała','kierował')] [target_character_2.GetName]. Przegrana jest sromotna, a rywale z pewnością wypatrują kolejnych oznak słabości. Czy to znak, że los obrócił się przeciwko nam? Walczymy o zwycięstwo w tej trwającej wojnie, więc miejmy nadzieję, że nie."
 fate_of_the_phoenix.12.a: "Haniebny pokaz!"
 fate_of_the_phoenix.13.title: "[target_character.GetNameWithNoTooltip] i administracja"
 fate_of_the_phoenix.13.desc: "[ROOT.GetCountry.GetFlavorRank] ma chyba swój moment przełomu. Długo znosiliśmy upadek, a niezgoda wewnętrzna, naciski zewnętrzne oraz powolna erozja władzy ciążyły na naszym ludzie. Dzięki nowym inicjatywom gabinetu możemy wreszcie zastąpić nieład porządkiem, przywrócić dyscyplinę w instytucjach i cel w rządzeniu krajem.\n\nTego typu reformy wymagają determinacji oraz poświęcenia, gdyż zwyczaje rozkładu są mocno zakorzenione, a opór jest nieunikniony. Jeśli jednak poświęcimy się temu w pełni, pozwolą nam ocalić [ROOT.GetCountry.GetFlavorRank|l] oraz położyć podwaliny pod odnowę, zanim wahanie skaże nas na dalszy rozpad i utratę znaczenia."
 fate_of_the_phoenix.13.a: "Powrót wspaniałego słońca wymaga poświęceń."
 enable_unlock_spread_philhellenism_and_encourage_latin_militarism_tt: "Odblokujemy [cabinet_actions|el] „[ShowCabinetActionName('spread_philhellenism')]” oraz „[ShowCabinetActionName('encourage_latin_militarism')]” na czas trwania [Concept('disaster','katastrofy')|e] [ShowDisasterName('fate_of_the_phoenix')]\n\nJeśli zdołamy zakończyć katastrofę zwycięsko, zyskamy dostęp do tych działań gabinetu #Y na stałe#!"
 fate_of_the_phoenix.14.title: "Odrodzenie Feniksa"
 fate_of_the_phoenix.14.desc: "Utracone niegdyś terytorium zostało odzyskane, a epoka upadku się oddala. Odrodzone państwo [ROOT.GetCountry.GetName] ma prawo, by mianować się jako [ROOT.GetCountry.GetFlavorRank|l] i znów może mierzyć się z wrogami. Teraz czas na [ShowLocationName('rome')]."
 fate_of_the_phoenix.14.a: "Dopilnujemy, by nasza władza nie zastygła!"
 maintain_cabinet_actions_tt: "Nasze udane zażegnanie [Concept('disaster','katastrofy')|e] pozwoliło zachować dostęp do obydwu [Concept('cabinet_actions','działań gabinetu')|e] – „[ShowCabinetActionName('spread_philhellenism')]” oraz „[ShowCabinetActionName('encourage_latin_militarism')]”"
 because_we_made_military_reforms_tt: "Wskutek tego, że wprowadziliśmy co najmniej jedną reformę wojskową poprzez [action|el] „[ShowGenericActionName('reform_imperial_armies')]”:"
 num_of_reforms_desc: "Liczba reform"
 unlock_allelengyon_bureaucracy_kephalai_bureaucracy_tt: "Odblokowuje [bureaucracies|el] „$allelengyon_bureaucracy$” oraz „$kephalai_bureaucracy$”"
 unlock_kritai_katholikoi_reformed_extra_effect: "Efekt modyfikatora „[ShowModifierTypeName('country_cabinet_efficiency')]” [Concept('government_reform','reformy rządowej')|e] „[ShowGovernmentReformName('kritai_katholikoi_reformed')]” będzie trwały"
 italian_wars_empowerment_if_latin_tt: "Gdybyśmy pokierowali organizacją [GetUniqueInternationalOrganization('foreign_league_balkan').GetName] w czasie nadchodzącej [Concept('situation','sytuacji')|e] „[GetSituationByKey('italian_wars').GetName]” [ShowCultureGroupName('italian_group')|l] grupa [Concept('countries','krajów')|e] miałaby ułatwione przystąpienie do ligi ze względu na to, jak przedstawia się nasza [ShowSocietyDirectionName('latinization')|l]."
 fate_of_the_phoenix.15.title: "Epoka rozpadu"
 fate_of_the_phoenix.15.desc: "Mimo starań utracone niedawno ziemie nie zostały odzyskane. Poczynania sąsiednich bejlików oraz wrogich sił zamieszkujących [ShowRegionName('balkan_region')] uniemożliwiły odwrócenie tej sytuacji. Ciągły rozpad wciąż trwa, a przyszłość kraju pozostaje niepewna."
 fate_of_the_phoenix.15.a: "Naszą przyszłość spowijają cienie i niepewność."
 no_longer_access_to_the_cabinet_actions_tt: "Nie będziemy mieć już dostępu do [Concept('cabinet_actions','działań gabinetu')|e] „[ShowCabinetActionName('spread_philhellenism')]” oraz „[ShowCabinetActionName('encourage_latin_militarism')]”"
 fate_of_the_phoenix.16.title: "[actor.GetNameWithNoTooltip] prosi o darowiznę"
 fate_of_the_phoenix.16.desc: "Dochodzą nas słuchy o chaosie, w jakim znajduje się kraj [actor.GetName]. Uciekając się do ostateczności, wysyła posłańców z prośbą o wsparcie finansowe. W zamian otrzymaliśmy obietnicę otwarcia swoich granic na nasze normy i zwyczaje. Taki gest nie ma precedensu i wyraźnie wskazuje, w jak fatalnej sytuacji jest tamtejsza stolica, [actor.GetCapital.GetName]."
 fate_of_the_phoenix.16.a: "Należy się niewielki gest symbolicznej pomocy."
 fate_of_the_phoenix.16.b: "Musimy wzmocnić obronę przed hordami z regionu [ShowRegionNameWithNoTooltip('anatolia_region')]."
 fate_of_the_phoenix.16.c: "Nie zapłacimy heretykom!"
 no_money_for_byz_tt: "[actor.GetName] nie otrzyma od nas żadnej pomocy."
 fate_of_the_phoenix.17.title: "[actor.GetNameWithNoTooltip] oferuje przywileje handlowe"
 fate_of_the_phoenix.17.desc: "Prowadzimy już wprawdzie biznesy w #L [ShowLocationName('constantinople')]u#!, ale teraz kraj [actor.GetName] złożył nam ofertę, byśmy w zamian za preferencyjne przywileje na rynkach ich stolicy zaopatrywali ich w materiały budowlane do rozbudowy floty."
 fate_of_the_phoenix.17.a: "[target_country.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip] po prostu dobija targu!"
 fate_of_the_phoenix.17.b: "Nie ma o czym mówić."
 selected_republic_may_donate_ships_to_our_cause_tt: "Wybrana $merchant_republic$ może oddać [ships|el] galery oraz [Concept('sailors','marynarzy')|e] w zamian za [merchant_power|el] w #L [ShowLocationName('constantinople')]u#!"
 byzantines_left_fend_themselves_tt: "Państwo [actor.GetLongName] zostało pozostawione samemu sobie"
 latin_merchant_privileges_key: "Przywileje kupców włoskich"
 fate_of_the_phoenix.18.title: "[target_character.GetNameWithNoTooltip] przybywa do miasta [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]"
 fate_of_the_phoenix.18.desc: "[target_character.GetName], [Select_CString(target_character.IsFemale,'którą','którego')] polecili nasi zaufani przyjaciele z kraju [target_country.GetName], [Select_CString(target_character.IsFemale,'opuściła','opuściła')] [target_location.GetRank.GetName] w lokacji [target_location.GetName], by do nas przybyć, niosąc umiejętności i wiedzę, z których słyną ziemie #L [target_culture.Custom('Culture_adj')|l]kie#!. Posiadając doświadczenie na cudzoziemskich dworach oraz dyscyplinę właściwą półwyspowi, oferuje nam teraz swoje usługi, co jest bardzo przyjaznym gestem.\n\nTaki nabytek obiecuje nie tylko praktyczne korzyści, ale także zacieśnia więzi z pobratymcami włoskimi, których wiedza oraz talent wciąż kształtują cechy tak książąt, jak i cesarzy."
 fate_of_the_phoenix.18.a: "Będziemy śledzić [target_character.GetHerHis|l] karierę z dużym zainteresowaniem!"
 fate_of_the_phoenix.19.title: "[target_god.GetNameWithNoTooltip] żąda daniny"
 fate_of_the_phoenix.19.desc: "Kiedy [ShowLocationName('bursa')] stała się częścią państwa [actor.GetName], władza, jaką posiada [target_character_1.GetName], jest odnowiona i niekwestionowana. Posłańcy z lokacji [target_location_1.GetName] przybywają z żądaniami, a nie uprzejmościami. Domagają się daniny jako ceny za nasze tak zwane pogańskie praktyki, a w ich słowach czai się niewypowiedziana groźba użycia siły. Będziemy musieli zapłacić – złotem, krwią albo oporem – a konsekwencje tego będzie dało się odczuć daleko poza naszymi granicami."
 fate_of_the_phoenix.19.a: "Nie mamy wyboru, jak tylko rozstać się z pieniędzmi."
 fate_of_the_phoenix.19.b: "Zamiast tego poślijmy tam zbrojnych."
 fate_of_the_phoenix.19.c: "Niczego nie dostaną!"
 fate_of_the_phoenix.20.title: "Reformacja wojska [actor.GetAdjectiveWithNoTooltip|l]kiego"
 fate_of_the_phoenix.20.desc_a: "Lata zaniedbań i trudności finansowych sprawiły, że krajowe armie są słabo przygotowane na czekające je wyzwania. Pod zwierzchnictwem kogoś tak zdolnego jak [target_character.GetName] można wydać nowe rozporządzenia, aby przywrócić dyscyplinę, zreorganizować dowództwo i ożywić tradycje, dzięki którym wojska maszerujące ze stolicy budziły niegdyś strach w całym kraju i poza jego granicami. Choć reformy te będą kosztowne, mogą powstrzymać długotrwały upadek naszej siły militarnej."
 fate_of_the_phoenix.20.desc_b: "Morza od dawna stanowią zarówno tarczę, jak i źródło utrzymania dla kraju, jednak nasze floty borykają się obecnie z przestarzałymi praktykami i zanikiem wiedzy specjalistycznej. [target_character.GetName] może podjąć wysiłki, by odświeżyć dowództwo marynarki wojennej, poprawić metody szkolenia i zmodernizować instytucje, które podtrzymują naszą potęgę morską. Jeśli się to uda, #L [ROOT.GetCountry.GetAdjective|l]ka#! flota może znów zabezpieczyć nasze wybrzeża i handel przed wszystkimi rywalami."
 fate_of_the_phoenix.20.a: "To krok konieczny w zwalczaniu rozkładu."
 fate_of_the_phoenix.20.b: "Może jeszcze nie teraz."
 reformation_of_the_school_of_admirals_better_stats_tt: "Tak długo, jak [modifier|el] jest aktywny, używanie [Concept('action','działania')|e] „[ShowGenericActionName('train_admiral')]” będzie dawać [characters|el] z ogólnie lepszymi [Concept('abilities','zdolnościami')|e]."
 better_stats_because_reformation_of_the_school_of_admirals_modifier_tt: "[abilities|eU] tego [Concept('admiral','admirała')|e] zostały ulepszone o #G +10#! ze względu na aktywny [modifier|el] „[ShowModifier('reformation_of_the_school_of_admirals_modifier')]”"
 because_we_reformed_our_navy_in_DHE_desc: "Wskutek tego, że zreformowaliśmy naszą [Concept('navy','marynarkę')|e] w [Concept('event','wydarzeniu')|e] „$flavor_byz.15.title$”"
 target_character_total_abilities: "[target_character.GetName] i [Select_CString(target_character.IsFemale,'jej','jego')] [abilities|el]"
 # Actions for Fate of the Phoenix Disaster
 selected_country_will_send_us_engineer_character_tt: "Wybrany [country|el] przyśle nam jedną ze swych najlepszych [Concept('characters','postaci')|e]"
 target_country_forced_to_give_tribute_tt: "Wybrany [country|el] może zostać przekonany do oddania nam [Concept('gold','złota')|e] lub [Concept('manpower','siły żywej')|e]"
 at_war_with_heathens_or_heretics_tt: "Jesteśmy obecnie liderami [Concept('war','wojny')|e] przeciwko [Concept('country','państwu')|e], w którym [actor.GetReligion.GetName|l] NIE jest religią"
 selected_country_may_join_every_ongoing_war_against_heathen_and_heretics_tt: "Wybrany [country|el] może dołączyć do naszych trwających [Concept('wars','wojen')|e], w których [war_leaders|el] to [heathens|el] albo [heretics|el]"
 pops_in_capital_province_convert_catholic_tt: "Niektóre z naszych [Concept('pops','społeczności')|e] wyznających [actor.GetReligion.GetName] w prowincji [actor.GetCapital.GetProvince.GetName] przyjmą [ShowReligionName('catholic')|l]"
 fate_of_phoenix_actions_price: "Koszt działania „$fate_of_the_phoenix$”"
 request_papal_donation: "Prośba o wsparcie papieskie"
 request_papal_donation_desc: "Gdy państwo [actor.GetFlavorRank] przechodzi napięcia, a jego skarbiec jest pusty, moglibyśmy wysłać poselstwo do papieża z prośbą o wsparcie zgodnie z tym, co głosi wiara #L [ShowReligionGroupName('christian')|l]a#!. Tego typu prośby zwykle mają konsekwencje, ale zdobyte złoto może kupić nam czas w godzinie próby."
 grant_latin_merchants_privileges: "Nadaj przywileje handlowe #L [ShowCultureGroupNameWithNoTooltip('italian_group')]kim#! kupcom"
 grant_latin_merchants_privileges_desc: "Rozszerzając specjalne prawa, jakimi cieszą się włoskie republiki kupieckie, mamy nadzieję ożywić handel i zabezpieczyć wsparcie floty. Ustępstwa te mają wzmocnić handel w mieście stołecznym [actor.GetCapital.GetName], ale istnieje ryzyko, że [actor.GetCapital.GetRank.GetName] ulegnie zwiększającym się wpływom cudzoziemskim."
 grant_latin_merchants_privileges_tooltip: "Żaden [country|el] w regionie [ShowRegionName('italy_region')] z reformą [ShowGovernmentReformName('merchant_republic')] nie jest naszym poddanym ani rywalem"
 accept_catholic_delegation: "Przyjmij delegację #L [ShowReligionAdjectiveWithNoTooltip('catholic')|l]ką#!"
 accept_catholic_delegation_desc: "Głosząca słowa pojednania i żywiąca nieśmiałą nadzieję na kompromis delegacja, jaką przysyła [GetUniqueInternationalOrganization('catholic_church').GetName|l], może zostać zaproszona do miasta stołecznego [actor.GetCapital.GetName]. Wielu naszych doradców uważa, że ugoszczenie delegatów może poprawić stosunki ze światem #L [ShowReligionAdjective('catholic')|l]kim#!, ale tego typu gesty mogą doprowadzić do napięć wewnętrznych."
 attract_italian_engineer: "Ściągnijmy inżyniera włoskiego"
 attract_italian_engineer_desc: "Poszukiwani są słynni włoscy inżynierowie do usprawnienia naszych fortyfikacji i prac wojskowych. Ich wiedza specjalistyczna daje nadzieję na nowoczesne rozwiązania odwiecznych problemów, choć może to wiązać się z uzależnieniem od zachodnich metod i wpływów."
 demand_beylik_tribute: "Żądanie daniny od bejlików"
 demand_beylik_tribute_desc: "[ShowRegionName('anatolia_region')] uznała naszą władzę, dzięki czemu ponownie możemy zmusić pobliskie bejliki do uznania #L [actor.GetAdjective|l]kiej#! kontroli. Dziś pobrana danina osłabi jutrzejszych rywali i przywróci zaufanie w potęgę, jaką dysponuje [actor.GetFlavorRank|l]."
 summon_patriarchate_member: "Wezwanie członka patriarchatu"
 summon_patriarchate_member_desc: "Reprezentując nasz [GetInternationalOrganizationType('autocephalous_patriarchate').GetNameWithNoTooltip], możemy wzywać innych przywódców #L [ShowReligionAdjective('orthodox')|l]ych#! do pomocy z wrogami wiary. Wezwania takie polegają na poczuciu wspólnoty religii, a nie obowiązku, i mogą ściągnąć miecze dla naszej sprawy."
 reform_imperial_armies: "Reforma wojska [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]kiego"
 reform_imperial_armies_desc: "Siły zbrojne, jakimi dysponuje państwo [actor.GetFlavorRank], cierpiały przez dekady wskutek zaniedbań i improwizacji. Kompleksowa reforma obiecuje odnowienie dyscypliny oraz struktur, ale wymaga stabilności, srebra i gotowości do zmiany utrwalonych zwyczajów."
 patronize_orthodox_monastery: "Obejmijmy patronatem $orthodox_monastery$"
 patronize_orthodox_monastery_desc: "Patronat, jakim objęty został lokalny [ShowBuildingTypeName('orthodox_monastery')|l], pozwala podkreślić nasze oddanie i wzmocnić lokalne życie religijne. Tego typu hojność bez wątpienia poprawi jakość życia w regionie, przypominając wiernym, że kraj [actor.GetLongName] pozostaje obrońcą prawdziwej wiary."
 reform_armed_forces_tt: "Będziemy w stanie zreformować naszą [Concept('army','armię')|e] lub [Concept('navy','flotę')|e], eliminując rozkład minionych stuleci"
 has_not_completed_all_six_reforms_tt: "Nie przeprowadziliśmy wszystkich #Y 6#! dostępnych reform"
 patronize_orth_monastery_tt: "Wybrana [location|el] otrzyma [modifier|el] „[ShowModifier('patronize_orthodox_monastery_modifier')]”, a wiele z naszych [Concept('pops','społeczności')|e] #L [ShowReligionAdjective('orthodox')|l]ych#! otrzyma [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [Concept('pop_satisfaction','satysfakcji społeczności')|e]"
