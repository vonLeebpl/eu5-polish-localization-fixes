l_polish:
 latinization_vs_hellenization.1.title: "[ShowCultureGroupNameWithNoTooltip('greek_group')] mądrość i jej echa"
 latinization_vs_hellenization.1.desc: "W klasztorach i audytoriach lokacji [target_location.GetName] kolekcje pism teologicznych i dzieł ojców kościoła krążą zarówno wśród wiernych, jak i wykształconych. Kazania oraz komentarze czerpią z głębokich studni wiedzy prawosławnej, a kopie tych tekstów zaczynają trafiać w ręce notabli niegreckich ku rosnącemu zaniepokojeniu dworzan, którzy wiążą naszą przyszłość z łacińskim zachodem."
 latinization_vs_hellenization.1.a: "Niechaj ich spostrzeżenia wzbogacą nasze ziemie."
 latinization_vs_hellenization.1.b: "Ta fascynacja starymi pergaminami zaszła za daleko."
 target_character_disappears_tt: "[target_character.GetName] zniknie"
 latinization_vs_hellenization.2.title: "Rosnąca przychylność wobec języka [ShowLanguageNameWithNoTooltip('latin_language')|l]ego"
 latinization_vs_hellenization.2.desc: "W salonach i dworach [ROOT.GetCountry.Custom('C_DOP')] występuje delikatny acz umacniający się prąd, który popiera #L [ShowLanguageName('latin_language')|l]e#! obyczaje, prawo i ceremoniał. Młodzi szlachcice ozdabiają swoje wypowiedzi cudzoziemskimi frazami, korespondują z [ShowLanguageNameWithNoTooltip('latin_language')|l]mi dworami oraz wzywają do reform, które wciągnęłyby nasze [ROOT.GetCountry.GetFlavorRank|l] na orbitę mód zachodnich, podczas gdy inni niepokoją się, jak szybko dezaktualizują się dawne pewniki."
 latinization_vs_hellenization.2.a: "Nic w tym złego."
 latinization_vs_hellenization.2.b: "Zawrócić kurs, już!"
 stability_scales_with_current_latinization_hellenization: "Zmiana [Concept('stability','stabilności')|e] będzie zależeć od obecnej wartości kierunku „[ShowSocietyDirectionName('latinization')]” lub „[ShowSocietyDirectionName('hellenization')]”"
 while_this_modifier_active_reduced_latinization_gain_from_events_tt: "Kiedy ten [country_modifier|el] jest aktywny, kolejne [events|el], które wzmacniają kierunek „[ShowSocietyDirectionName('latinization')]”, są znacząco osłabione, zmniejszając ich premie"
 bonus_weakened_because_of_suppressing_latinization_modifier: "Korzyści tego wyboru są zmniejszone ze względu na modyfikator „[ShowModifier('suppressing_latinization_modifier')]”"
 latinization_vs_hellenization.3.title: "[ShowSocietyDirectionNameWithNoTooltip('latinization')] kwitnie"
 latinization_vs_hellenization.3.desc: "Kupcy, prawnicy i uczeni donoszą, że obecny zwrot ku formom #L [ShowLanguageName('latin_language')|l]m#! zaczyna przynosić owoce. Spisywane umowy są jaśniejsze, cudzoziemscy partnerzy znają nasze zwyczaje, a energia reformy zdaje się wzmacniać państwo [ROOT.GetCountry.GetName]. Niektórzy szepczą jednak, że te korzyści spoczywają na fundamentach, które wciąż mogą ulec zachwianiu."
 latinization_vs_hellenization.3.a: "Pora zbierać korzyści dobrej polityki."
 latinization_vs_hellenization.3.b: "Mądry człowiek wybrałby naprawienie błędów przeszłości!"
 latinization_vs_hellenization.4.title: "[target_unit.GetNameWithNoTooltip] – chwała jej!"
 latinization_vs_hellenization.4.desc: "Na [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] dotarły raporty o wyjątkowej dyscyplinie i odwadze wykazanej w ostatnich kampaniach przez jednostkę [target_unit.GetName]. Jej szeregi trzymają się równo w marszu oraz podczas ćwiczeń, a o jej zachowaniu zaczęli mówić zarówno szeregowi, jak i [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], którzy stawiają ją za wzór dla legionów państwa [ROOT.GetCountry.GetName]."
 latinization_vs_hellenization.4.a: "Ich służba jest nam miła."
 target_character_will_receive_a_nickname_tt: "[target_character.GetName] otrzyma stosowny przydomek za przykładną służbę"
 latinization_vs_hellenization.5.title: "Tarcia o program w lokacji [target_location.GetNameWithNoTooltip]"
 latinization_vs_hellenization.5.desc: "[ShowBuildingTypeName('university')] w lokacji [target_location.GetName] rozbrzmiewa głosami kłótni uczonych o język właściwy dla szkolnictwa wyższego. Niektórzy twierdzą, że tylko #L [ShowLanguageName('latin_language')|l]#! może wynieść [ROOT.GetCountry.GetFlavorRank|l] na poziom mocarstw. Inni zaś uważają, że należy zachować tradycje Konstantynopola i Kościoła."
 latinization_vs_hellenization.5.a: "Uniwersytet będzie uczyć w języku [ShowLanguageNameWithNoTooltip('latin_language')|l]m"
 latinization_vs_hellenization.5.b: "Nie wolno porzucać tradycji Kościoła i Cesarstwa."
 pops_in_target_province_mild_bonus_satisfaction: "Nasze [pops|el] w prowincji [target_province.GetName] zyskają [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [Concept('pop_satisfaction','satysfakcji')|e]"
 pops_in_target_province_mild_penalty_satisfaction: "Nasze [pops|el] w prowincji [target_province.GetName] stracą [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][Concept('pop_satisfaction','satysfakcji')|e]"
 latinization_vs_hellenization.6.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] ostrzegają"
 latinization_vs_hellenization.6.desc: "[Select_CString(target_character.IsFemale,'Uznana przedstawicielka','Uznany przedstawiciel')] stanu [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] o imieniu [target_character.GetName] [Select_CString(target_character.IsFemale,'przybyła','przybył')] na nasz [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] z ważnym przesłaniem. Ostrzega, że #L [ShowLanguageName('latin_language')|l]e#! mody w doktrynie oraz zwyczajach podważają fundamenty naszej wiary i pewnego dnia zagrożą zarówno ołtarzowi, jak i tronowi."
 latinization_vs_hellenization.6.a: "Rozsądnie byłoby wysłuchać [Select_CString(target_character.IsFemale,'jej','jego')] rady."
 latinization_vs_hellenization.6.b: "Ludzie słabego ducha nie będą decydować o naszej polityce."
 latinization_vs_hellenization.7.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] testują cudzoziemskie zwyczaje"
 latinization_vs_hellenization.7.desc: "W komnatach całego państwa, od lokacji [target_location.GetName] po odległe posiadłości, nasi [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] chętnie naśladują zwyczaje, mody i język, jakie zrodziła kultura [target_culture.GetName|l]. Niektórzy przyjmują to za wyrafinowanie, zaś inni uważają, iż nasza arystokracja przestaje być #L [ROOT.GetCountry.GetAdjective|l]ka#!."
 latinization_vs_hellenization.7.a: "Niech biorą wszystko, co dobrego dała kultura [target_culture.GetNameWithNoTooltip|l]."
 latinization_vs_hellenization.7.b: "To zachłyśnięcie cudzoziemszczyzną zaszło za daleko."
 destabilize_our_realm: "Nasza postawa obronna wobec tych trendów destabilizuje nasze [ROOT.GetCountry.GetFlavorRank|l]"
 perceived_as_weakness: "Zakazanie testowania cudzoziemskich zwyczajów jest postrzegane jako słabość"
 latinization_vs_hellenization.8.title: "Uporządkowanie prowincji"
 latinization_vs_hellenization.8.desc: "Stołeczni urzędnicy wystąpili z propozycją kompleksowej reorganizacji prowincji, takich jak [target_province.GetName], której celem jest zbliżenie do siebie jurysdykcji i administracji z naszym centrum kulturowym oraz politycznym. Dzięki temu stolica [ROOT.GetCountry.GetCapital.GetName] ma mieć większą kontrolę, ale ryzykujemy naruszenie utrwalonej równowagi regionalnej."
 latinization_vs_hellenization.8.a: "Zaprowadźmy nowy ład bez względu na koszt."
 latinization_vs_hellenization.8.b: "Uszanujmy lokalne układy i rozwiejmy ich obawy."
 pops_in_selected_provinces_will_gain_mild_bonus_satisfaction_tt: "Nasze [pops|el] w dotkniętych [Concept('provinces','prowincjach')|e] zyskają [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]"
 latinization_vs_hellenization.9.title: "[target_character.GetShortNameWithNoTooltip] a edukacja"
 latinization_vs_hellenization.9.desc: "[target_character.GetName] przestaje być dzieckiem, a nauczyciele i dworzanie ścierają się o właściwy kierunek [Select_CString(target_character.IsFemale,'jej','jego')] studiów. Każdy wybór języka, tekstu i mentora grozi przekształceniem się w walkę o przyszłość ducha państwa #L [ROOT.GetCountry.GetAdjective|l]kiego#!."
 latinization_vs_hellenization.9.a: "[Select_CString(target_character.IsFemale,'Jej','Jego')] edukacja musi mieć jasno wyznaczony kierunek."
 latinization_vs_hellenization.9.b: "[Select_CString(target_character.IsFemale,'Jej','Jego')] wychowanie nie może być kwestią polityczną."
 refusal_to_politicize_tt: "Nasza niechęć do nadmiernego mieszania się w edukację, jaką pobiera [target_character.GetName], może być postrzegana przez [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] jako słabość."
 court_does_not_react: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] nie reaguje."
 latinization_vs_hellenization.10.title: "Kultura [ShowCultureNameWithNoTooltip('roman_culture')|l] – odnowienie wspaniałości"
 latinization_vs_hellenization.10.desc: "Architekci wprawni w nowych metodach rozkwitających w miastach włoskich proponują przekształcenie prowincji [target_province.GetName] w duchu renesansu: z szerokimi alejami, prostym planem i robotami publicznymi będącymi echem wspaniałości Rzymu w wyobrażeniu mistrzów łacińskiego Zachodu. Ci, którym podobają się tak wzniosłe plany, widzą odrodzenie godności. Być może tego typu odnowa wymaga pełnej otwartości na Zachód."
 latinization_vs_hellenization.10.a: "Niech [target_province.GetNameWithNoTooltip] znów kwitnie."
 latinization_vs_hellenization.10.b: "Niech osady funkcjonują w sposób naturalny."
 target_character_artist_skill: "[target_character.GetName]: [artistic_skill|e]"
 latinization_vs_hellenization.11.title: "Budowanie w duchu tradycji imperialnej w prowincji [target_province.GetNameWithNoTooltip]"
 latinization_vs_hellenization.11.desc: "Patroni sztuki i lokalne gildie namawiają do renowacji prowincji [target_province.GetName] w oparciu o świetne tradycje naszych miast cesarskich: z ulicami z arkadami, otwartymi placami oraz kamieniarstwem, które wyróżniały Konstantynopol i wieczne miasta rzymskiego Wschodu. Wielu z naszych doradców wierzy, że przywrócenie takich form przemawia dosadnie do godności niezłomnego dziedzictwa Rzymu."
 latinization_vs_hellenization.11.a: "Taka gracja i nasze [ROOT.GetCountry.GetFlavorRank|l] pasują do siebie."
 latinization_vs_hellenization.11.b: "$latinization_vs_hellenization.10.b$"
 latinization_vs_hellenization.12.title: "Debata nad nowym systemem podatkowym"
 latinization_vs_hellenization.12.desc: "Urzędnicy podatkowi zaprezentowali śmiały projekt zmian w kodeksie podatkowym, wzorując się na modelach zagranicznych w celu zaostrzenia zasad naliczania i poboru podatków. Ta radykalna propozycja obiecuje większy porządek oraz wyższy dochód, ale grozi zaostrzeniem relacji, co wpłynie na nasze [ROOT.GetCountry.GetFlavorRank|l]."
 latinization_vs_hellenization.12.a: "Wprowadźmy nowy system."
 latinization_vs_hellenization.12.b: "Porzućmy na razie ten pomysł."
 proposed_taxation_upsets_estates_tt: "Proponowany model podatkowy naruszy utrwalone przywileje kilku [Concept('estates','stanów')|e]"
 new_tax_code_will_destabilize_the_realm: "Zmieniony system podatkowy zdestabilizuje nasze [ROOT.GetCountry.GetFlavorRank|l]"
 latinization_vs_hellenization.13.title: "Lokacja [target_location.GetNameWithNoTooltip] domaga się własnej rady"
 latinization_vs_hellenization.13.desc: "Notable z lokacji [target_location.GetName] złożyli na [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] petycję o niezależną radę miejską, przywołując samorządne miasta włoskie jako dowód tego, że lokalna władza przynosi dobrobyt. Spełnienie ich prośby osłabi kontrolę centralną i sprawi, że [ROOT.GetCountry.GetFlavorRank|l] zbliży się do łacińskiego modelu sprawowania władzy, ale odmowa może rozgoryczyć wpływowe elity szukające inspiracji na zachodzie."
 latinization_vs_hellenization.13.a: "Dajmy im tę radę."
 latinization_vs_hellenization.13.b: "Pozostaną pod naszym ścisłą obserwacją."
 upper_class_pops_in_these_cities_angry: "Nasze [pops|el] z [Concept('upper_class','klasy wyższej')|e] w dotkniętych [Concept('locations','lokacjach')|e] będą niezadowolone odmowy i stracą [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction','satysfakcji społeczności')|e]"
 latinization_vs_hellenization.14.title: "Wielkie święto w prowincji [target_province.GetNameWithNoTooltip]"
 latinization_vs_hellenization.14.desc: "Lokalni przywódcy z prowincji [target_province.GetName] chcą zorganizować wielki festiwal, by wyrazić wdzięczność za tradycje i bogactwa tej ziemi. Tego typu uroczystość może złagodzić napięcia oraz wzmocnić poczucie wspólnoty, ale wymaga inwestycji zarówno ze strony prowincji, jak i skarbu państwa, co budzi zaniepokojenie doradców finansowych."
 latinization_vs_hellenization.14.a: "Święto będzie tylko w prowincji [target_province.GetNameWithNoTooltip]"
 latinization_vs_hellenization.14.b: "Niech sąsiednie prowincje przyłączą się do świętowania!"
 latinization_vs_hellenization.14.c: "Jeśli mają czas świętować, maja też czas pracować."
 pops_are_happier_tt: "Nasze [pops|el], które NIE są uznawane za część [Concept('upper_class','klasy wyższej')|e] w tej [Concept('province','prowincji')|e], zyskają [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [Concept('pop_satisfaction','satysfakcji społeczności')|e] ze względu na trwające święto"
 latinization_vs_hellenization.15.title: "Podręcznik metody łacińskiej"
 latinization_vs_hellenization.15.desc: "Wśród naszych oficerów zaczął krążyć szczegółowy podręcznik szkolenia oraz manewrów wzorowanych na metodach kapitanów najemników i zakonów wojskowych łacińskiego Zachodu. Jego diagramy i zalecenia obiecują wprowadzić ład do naszych szeregów, o ile zechcemy przyjąć go za oficjalną doktrynę."
 latinization_vs_hellenization.15.a: "Rozpowszechnić go!"
 latinization_vs_hellenization.15.b: "Nie potrzebujemy tego typu wpływów."
 latinization_vs_hellenization.16.title: "[target_character.GetShortNameWithNoTooltip] i [target_estate.GetNameWithNoTooltip|l] ścierają się"
 latinization_vs_hellenization.16.desc: "Niestety wybuchła gorzka kłótnia! [target_character.GetName] i czołowe postacie stanu [target_estate.GetName] wzajemnie oskarżali się o wchodzenie sobie w kompetencje. Ta dysputa zagraża pogorszeniem relacji, jakie ma korpus oficerski oraz [ROOT.GetCountry.GetFlavorRank|l]."
 latinization_vs_hellenization.16.a: "Mają rację, upominając [Select_CString(target_character.IsFemale,'ją','go')]."
 latinization_vs_hellenization.16.b: "[target_estate.GetNameWithNoTooltip] nie będą decydować w sprawach wojskowych!"
 court_faction_increases_influence: "Wroga frakcja dworska wzmocni swoje wpływy"
 our_authority_will_suffer_penalty: "Nasza władza ucierpi"
 latinization_vs_hellenization.17.title: "[target_character.GetShortNameWithNoTooltip] zgłasza się do służby"
 latinization_vs_hellenization.17.desc: "Dzięki naszym związkom z krajem [target_country.GetName] doświadczony żołnierz pochodzenia #L [target_culture.Custom('Culture_adj')|l]kiego#!, zachęcony coraz bliższymi więzami pomiędzy naszymi dworami, wyraził chęć służby pod naszym sztandarem. Sprowadza [target_character.GetSheHe|l] wiedzę o łacińskim Zachodzie i oferuje naszej sprawie swoje doświadczenie."
 latinization_vs_hellenization.17.a: "Mile widziany jest każdy przywódca [target_culture.Custom('Culture_adj')|l]ki!"
 latinization_vs_hellenization.18.title: "Niezgoda między przywódcami"
 latinization_vs_hellenization.18.desc: "Dwóch naszych dowódców, [target_character_1.GetName] i [target_character_2.GetName], popadło w otwarty konflikt o taktykę oraz trening. Ich rywalizacja grozi podziałem korpusu oficerskiego i dezorientuje żołnierzy w trakcie kampanii. Czy ten rozłam to tylko najnowszy symptom podzielonego wojska? Niezależnie od odpowiedzi, najlepiej zakończyć kłótnie w interesie naszego bezpieczeństwa państwowego."
 latinization_vs_hellenization.18.a: "Posłuchajmy rady, jaką daje [target_character_1.GetShortNameWithNoTooltip]."
 latinization_vs_hellenization.18.b: "[target_character_2.GetNameWithNoTooltip] ma rację!"
 latinization_vs_hellenization.19.title: "Prowincja [target_province.GetNameWithNoTooltip] przyciąga migrantów"
 latinization_vs_hellenization.19.desc: "Splendor i renoma prowincji [target_province_destination.GetName] przekonały ludność prowincji [target_province_origin.GetName] do podjęcia trudów podróży na nasze ziemie. Jeśli pochodzą z łacińskiego Zachodu, ich osadnictwo pogłębi nasze więzi z nim, a jeśli to sąsiedzi prawosławni, ich przybycie wzmocni starożytny charakter prowincji."
 latinization_vs_hellenization.19.a: "Ubogacą naszą społeczność!"
 latinization_vs_hellenization.19.b: "Nie są mile widziani."
 latinization_vs_hellenization.20.title: "[target_character.GetNameWithNoTooltip] i [Select_CString(target_character.IsFemale,'jej','jego')] lojalność"
 latinization_vs_hellenization.20.desc: "Krążą plotki, że [target_character.GetName] spotyka się z posłami i agentami, którzy są lojalni wobec innych. Bez względu na to, czy pogłoski rodzą się ze złej woli, czy wskutek niezrozumienia, naruszają zaufanie wobec dowództwa. Nasi szpiedzy donoszą o braku zaufania, ale trzeba ostrożnie rozważyć sytuację."
 latinization_vs_hellenization.20.a: "[target_character.GetSheHe|U] zasługuje na wakacje..."
 latinization_vs_hellenization.20.b: "Nie możemy wierzyć w czcze gadanie!"
 target_character_spills_the_beans: "[target_character.GetShortName] przekazuje nasze tajemnice [Concept('rivals','rywalom')|e] i [Concept('rival_enemies','wrogom')|e]"
 target_character_lips_shut: "[target_character.GetHerHis|U] usta pozostają zamknięte"
 latinization_vs_hellenization.21.title: "Polityka inflacyjna"
 latinization_vs_hellenization.21.desc: "Napływ zepsutej i podrobionej monety zaczął wpływać na ceny [ROOT.GetCountry.Custom('C_LOC')], a [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] podzielił się w opiniach, co z tym zrobić. Niektórzy doradcy zalecają natychmiastową interwencję, podczas gdy inni przekonują, że lekarstwo może się okazać równie groźne co choroba."
 latinization_vs_hellenization.21.a: "Wzmocnijmy kontrolę nad walutą."
 latinization_vs_hellenization.21.b: "Niech rynek sam się ureguluje."
 inflation_creeping_in_tt: "Jeśli [inflation|el] nie zostanie opanowana, może spowodować poważne problemy w przyszłości"
 burghers_pleased: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] są zadowoleni z naszego umiaru"
 burghers_upset: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] są wściekli na nasz brak działań"
 inflation_causes_instability: "Szalejąca [inflation|el] wpływa negatywnie na naszą [stability|el]"
 latinization_vs_hellenization.22.title: "[target_character_1.GetShortNameWithNoTooltip] i [Select_CString(target_character_1.IsFemale,'jej','jego')] nauczyciel-przyjaciel"
 latinization_vs_hellenization.22.desc: "[target_character_1.GetName] oraz [target_character_2.GetName] łączy szczególnie bliska więź, a ich lekcje wykraczają poza litery i liczby. Niektórzy twierdzą, że taka przyjaźń poszerza horyzonty, ale inni obawiają się, jak wpłynie na nasze [ROOT.GetCountry.GetFlavorRank|l] w przyszłości."
 latinization_vs_hellenization.22.a: "[target_character_1.GetShortNameWithNoTooltip] zasługuje na najlepsze!"
 latinization_vs_hellenization.22.b: "[target_character_1.GetSheHe|U] ma rządzić, a nie czytać!"
 heir_will_receive_more_tutoring_tt: "[Select_CString(target_character_1.IsFemale,'Nasza ukochana','Nasz ukochany')] [target_character_1.GetShortName] otrzyma dodatkowe nauczanie, które potencjalnie zwiększy [target_character_1.GetHerHis] [abilities|el]. Może to wpłynąć na [target_character_1.GetHerHis] politykę, gdy zajmie już tron."
 latinization_vs_hellenization.23.title: "[Select_CString(target_character.IsFemale,'Uczona','Uczony')] [target_character.GetWomanMan|l]"
 latinization_vs_hellenization.23.desc: "Wędrowny uczony #L [target_culture.Custom('Culture_adj')|l]ki#!, który szkolił się w humanistycznej tradycji miast włoskich, przybył na nasz [ROOT.GetCountry.GetGovernment.GetCourtTitle|l], niosąc łacińskie rękopisy, komentarze filozoficzne i idee czerpane z kwitnącej nauki Zachodu. Taka postać może okazać się cennym przekaźnikiem prądów intelektualnych świata łacińskiego. Musimy jednak uważać na cudzoziemskie sympatie, jakie może nieść."
 latinization_vs_hellenization.23.a: "Zostań z nami chwilę, zdrożony wędrowcze."
 latinization_vs_hellenization.23.b: "Nie obchodzą nas bajania wędrownych żebraków."
 latinization_vs_hellenization.24.title: "Mądry wędrowiec"
 latinization_vs_hellenization.24.desc: "Wykształcony [target_character.GetWomanMan|l], który zna pisma Ojców Kościoła i komentarze znakomitych teologów prawosławnych, poprosił o przyjęcie na nasz [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]. Oferuje dzielenie się rękopisami zgromadzonymi w monasterach Wschodu, jak również głęboką wiedzą prawa cesarskiego oraz doktryny prawosławnej. To, czy ta wiedza umocni nasze tradycje, czy jedynie doda kolejny głos na gwarnym dworze, zależy od nas."
 latinization_vs_hellenization.24.a: "Niech będzie. [target_character.GetShortNameWithNoTooltip] może zostać."
 latinization_vs_hellenization.24.b: "Nic specjalnego. [target_character.GetSheHe|l] to tylko kolejna osoba w okolicy."
 latinization_vs_hellenization.25.title: "Zanik kulturowy"
 latinization_vs_hellenization.25.desc: "Kronikarze lamentują, że zanika wigor kulturowy [ROOT.GetCountry.Custom('C_DOP')]. Patronat słabnie, tradycje są zapominane, a dzieła, które niegdyś inspirowały nasz lud, porastają kurzem w bibliotekach i skarbcach. Czy my, heroldowie wielkiej kultury, straciliśmy z nią kontakt?"
 latinization_vs_hellenization.25.a: "Musimy uznać, że nasze dziedzictwo zanikło."
 latinization_vs_hellenization.25.b: "Nie, mylą się wszyscy inni!"
 latinization_vs_hellenization.26.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|l] i moda wschodnia"
 latinization_vs_hellenization.26.desc: "Jedwabie, perfumy i zwyczaje kupców oraz posłanników dworów Wschodu rozpaliły ciekawość, jaką mają nasi [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]. Niektórzy postrzegają to jako naturalny bieg rzeczy dla cesarstwa, które długo stał pomiędzy Wschodem a Zachodem. Inni natomiast uważają, że należy upatrywać należy naszą przyszłość wśród potęg łacińskich i taka orientacja dworu tylko zniechęci naszych zachodnich sojuszników."
 latinization_vs_hellenization.26.a: "Wschód zawsze stanowił kawałek naszego świata"
 latinization_vs_hellenization.26.b: "Musimy spoglądać na zachód zamiast na wschód."
 latinization_vs_hellenization.27.title: "[ShowSocietyDirectionNameWithNoTooltip('hellenization')] zaczyna się opłacać"
 latinization_vs_hellenization.27.desc: "Przyjęta przez nas polityka kulturowa zaczyna przynosić owoce. Uczeni wychwalają odnowioną klarowność, admirałowie mówią o przywróconej pewności siebie, a lud czuje, że obrana przez nas droga, choć niełatwa, wiedzie do czegoś znaczącego."
 latinization_vs_hellenization.27.a: "Cieszmy się. Nasi przodkowie są z nas dumni."
 strength_of_hellenization_desc: "Siła naszego [Concept('country_modifier','modyfikatora krajowego')|e] „[ShowModifierTypeName('monthly_towards_hellenization')]”"
 latinization_vs_hellenization.28.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] opierają się obecnym trendom"
 latinization_vs_hellenization.28.desc: "Czołowe rody szlacheckie narzekają, że [ROOT.GetCountry.GetFlavorRank|l] zbyt mocno i szybko zmienia politykę kulturową. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] uważają, że tylko dzięki nim państwo [ROOT.GetCountry.GetName] nie straciło jeszcze zupełnie swojego charakteru."
 latinization_vs_hellenization.28.a: "Zgódźmy się na ich żądania."
 latinization_vs_hellenization.28.b: "Nie zmienimy kursu."
 latinization_vs_hellenization.29.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] opierają się obecnym trendom"
 latinization_vs_hellenization.29.desc: "Ku naszemu niezadowoleniu [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] zaczęli ostatnio wyrażać się niepewnie o naszym kierunku kulturowym. Niektórzy postrzegają go jako niszczący, a nawet niebezpieczny, ale wszyscy zgadzają się, że wiara musi być strzeżona przed tak niebezpiecznymi trendami."
 latinization_vs_hellenization.29.a: "Wysłuchajmy ich ostrzeżeń."
 latinization_vs_hellenization.29.b: "Doktryna nie będzie rządzić polityką."
 refusal_leads_instability: "Nasza odmowa dostosowania się prowadzi do niestabilności"
 situation_dissipates: "Gorączkowa wymiana nie eskaluje"
 latinization_vs_hellenization.30.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] opierają się obecnym trendom"
 latinization_vs_hellenization.30.desc: "Po polach i wsiach [ROOT.GetCountry.Custom('C_DOP')] wielu przedstawicieli klasy niższej narzeka, że odległe debaty nad pościgiem za wielkością oraz zwyczajami przynoszą jedynie nowe obowiązki i sprowadzają dziwnych urzędników. Ich cichy opór może stać się głośniejszy, jeśli nie znajdzie posłuchu."
 latinization_vs_hellenization.30.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] zostaną ugłaskani."
 latinization_vs_hellenization.30.b: "Wymuśmy dostosowanie się do obecnego trendu."
