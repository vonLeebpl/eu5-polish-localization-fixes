l_polish:
 contact_patriarch_of_constantinople: "Kontakt z patriarchą Konstantynopola"
 contact_patriarch_of_constantinople_desc: "Należy wysłać Melanchtona do Konstantynopola z naszym wyznaniem wiary, aby nawiązał dialog z patriarchatem #L [ShowReligionAdjective('orthodox')|l]ym#!."
 reformation.17.title: "List [GetCharacter('reformer_philip_melanchton').GetLastNameWithNoTooltip]a do Konstantynopola"
 reformation.17.desc: "[melanchthon.GetName], czołowy teolog w naszym królestwie, zaproponował śmiałe posunięcie: wysłanie posłańca do patriarchy Konstantynopola z naszym wyznaniem wiary. Chociaż wyznania #L [ShowReligionAdjective('orthodox')|l]e#! i #L [ShowReligionAdjective('lutheran')|l]kie#! pozostają podzielone w wielu kwestiach, łączy je wspólne odrzucenie zwierzchnictwa papieskiego. Być może patriarcha z zadowoleniem przyjąłby gest ze strony innych przeciwników Rzymu."
 reformation.17.a: "Niech [GetCharacter('reformer_philip_melanchton').GetLastNameWithNoTooltip] przekaże nasze wyznanie wiary."
 reformation.17.b: "To nie jest odpowiedni moment na takie propozycje."
 reformation.17.historical_info: "Filip Melanchthon (1497–1560), najbliższy współpracownik Lutra i autor „Wyznania augsburskiego” (1530), wyrażał głębokie zainteresowanie kościołem wschodnim jako potencjalnym sojusznikiem w walce z Rzymem. Jego korespondencja z greckimi uczonymi położyła podwaliny pod późniejsze gesty sympatii ze strony luteranów wobec Konstantynopola. W 1573 roku teologowie z Tybingi przesłali greckie tłumaczenie „Wyznania augsburskiego” do patriarchy Jeremiasza II, zapoczątkowując jedną z najdłuższych wymian teologicznych między luteranizmem a prawosławiem w epoce reformacji."
 reformation.18.title: "List od reformatorów luterańskich"
 reformation.18.desc: "Do Konstantynopola przybyła delegacja z [lutheran_country.Custom('C_DOP')], przywożąc ze sobą traktat teologiczny – wyznanie wiary. Wydaje się, że reformatorzy #L [ShowReligionAdjective('lutheran')|l]cy#! dążą do nawiązania dialogu z naszym patriarchatem, powołując się na podobieństwo naszych sporów z biskupem Rzymu. Czy ich intencje są szczere, czy też służą własnym interesom, dopiero się okaże."
 reformation.18.a: "Nawiążmy z tymi reformatorami ostrożny dialog teologiczny."
 reformation.18.b: "To heretycy. Odesłać ich."
 reformation.18.historical_info: "Patriarchat Ekumeniczny w Konstantynopolu nadal sprawował władzę duchową nad prawosławnymi chrześcijanami nawet po podboju osmańskim w 1453 roku. Patriarcha Jeremiasz II (urzędujący w latach 1572–1595) znany był ze swojej wiedzy teologicznej i poważnie podchodził do listów teologów z Tybingi, udzielając trzech szczegółowych odpowiedzi w latach 1576–1581. Odrzucił luterańską doktrynę dotyczącą usprawiedliwienia, wolnej woli i filioque, uznając jednocześnie szczerość pytań i potwierdził tym samym, że nie odrzuca całkowicie takich kontaktów."
 reformation.19.title: "Patriarcha odpowiada z zainteresowaniem"
 reformation.19.desc: "Patriarcha przyjął wizytę naszego wysłannika z umiarkowaną ciekawością. Chociaż nie osiągnięto porozumienia w kwestiach doktrynalnych, rozmowy te otworzyły kanał komunikacji między Konstantynopolem a naszym kościołem państwowym – jest to niewielki, ale znaczący krok w kierunku porozumienia między chrześcijaństwem #L [ShowReligionAdjective('lutheran')|l]kim#! a #L [ShowReligionAdjective('orthodox')|l]ym#!."
 reformation.19.a: "Nawet najwęższy most jest lepszy niż żaden."
 reformation.19.historical_info: "Korespondencja z Tybingą jest uznawana za kamień milowy we wczesnym dialogu ekumenicznym. Trzy odpowiedzi patriarchy Jeremiasza II (1576, 1579, 1581) stanowiły poważną refleksję nad teologią luterańską, nawet jeśli odrzucały jej główne tezy. Odniósł się on do kwestii sola fide, wolnej woli i filioque, posługując się szczegółową argumentacją patrystyczną. Ten poziom zaangażowania świadczył o intelektualnej żywotności patriarchatu pod panowaniem osmańskim. Obie strony starannie zarchiwizowały tę korespondencję."
 reformation.20.title: "Patriarcha odsyła delegację"
 reformation.20.desc: "Nasza delegacja spotkała się w Konstantynopolu z chłodnym przyjęciem. Patriarcha uznał nasze wyznanie za kolejną formę herezji, a nasz poseł został odesłany bez żadnych ceremonii. To przypomina nam, że [ShowReligionName('lutheran')|l] to inna wiara – zarówno od Rzymu, jak i od Konstantynopola."
 reformation.20.a: "Nasza wiara nie potrzebuje uznania żadnego patriarchatu."
 reformation.20.historical_info: "Korespondencja z Tybingą ostatecznie nie doprowadziła do porozumienia doktrynalnego: w trzech odpowiedziach patriarchy Jeremiasza II (z 1576, 1579 i 1581) odrzucono luterańskie stanowisko w sprawie sola fide, sola scriptura oraz filioque, podkreślając, że prawosławie nie może zaakceptować tego, co uważało za zbytnie odejście od tradycji. Luteranie doszli w końcu do wniosku, że dalsza korespondencja będzie bezowocna, i zakończyli wymianę listów w 1581 roku."
 reformation.21.title: "Przybycie uczonego prawosławnego"
 reformation.21.desc: "Wiadomość o naszej korespondencji z Konstantynopolem przyniosła nieoczekiwane owoce. Na nasz dwór przybył #L [ShowReligionAdjective('orthodox')|l]y#! uczony, [orthodox_scholar.GetName], pragnący kontynuować wymianę teologiczną zapoczątkowaną przez naszego wysłannika. Musimy delikatnie postępować z takim gościem – zbyt serdeczne przyjęcie może sprowokować nasze własne duchowieństwo, natomiast odrzucenie go mogłoby zniszczyć wpływy, jakie udało nam się zdobyć w Konstantynopolu."
 reformation.21.a: "Zorganizujmy dłuższą wymianę akademicką."
 reformation.21.b: "Podziękujmy uprzejmie, ale odmówmy dalszej rozmowy."
 reformation.21.historical_info: "Chociaż korespondencja z Tybingą nie doprowadziła do zjednoczenia doktrynalnego, wzbudziła ona znaczne zainteresowanie naukowe po obu stronach. Greccy intelektualiści prawosławni lepiej zapoznali się z teologią luterańską, natomiast uczeni luterańscy pogłębili swoją wiedzę na temat ojców kościoła i tradycji chrześcijaństwa wschodniego. Ta międzywyznaniowa wymiana przyczyniła się do rozwoju szerszego europejskiego humanizmu, który traktował starożytne chrześcijaństwo greckie jako źródło wiary niezależne od Rzymu."
