l_polish:
 d008_orthodox_events.1.title: "[actor.GetNameWithNoTooltip] przedstawia ofertę"
 d008_orthodox_events.1.desc: "Na nasz [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] przybyła delegacja państwa [actor.GetLongName] z ofertą wypożyczenia nam jednego z ich najwspanialszych dzieł ikonografii religijnej, jakim jest [target.GetName]. Naturalnie niezupełnie za darmo, ale przysłuży się to zbliżeniu naszych krajów."
 d008_orthodox_events.1.a: "Z radością."
 d008_orthodox_events.1.b: "Powiedzcie im, że już taką mamy."
 d008_orthodox_events.2.title: "Oferta przyjęta"
 d008_orthodox_events.2.desc: "Wspaniałe państwo [target_country.GetLongName] zgodziło się przyjąć naszą wspaniałomyślną ofertę, by wypożyczyć im ikonę [target.GetName]. Przysłali nam już finansowe zadośćuczynienie, co bez wątpienia dodatkowo zbliży nasze kraje. Miejmy nadzieję, że ją zwrócą, gdy nadejdzie właściwy czas."
 d008_orthodox_events.2.a: "Na razie dobrze się nią opiekujcie."
 d008_orthodox_events.3.title: "Oferta odrzucona"
 d008_orthodox_events.3.desc: "Bezbożni głupcy z państwa [target_country.GetName] odrzucili naszą ofertę wypożyczenia ikony [target.GetName]. Złożyliśmy ją w dobrej wierze, a oni, odrzucając ją, potwierdzili, że nie posiadają w sercach ni wiary, ni dobra. Tylko ktoś, kto odrzuca [ROOT.GetCountry.GetReligion.GetName|l], może ważyć się odrzucić ikonę."
 d008_orthodox_events.3.a: "Niech piekło ich pochłonie!"
 d008_orthodox_events.4.title: "Upłynął termin zwrotu ikony [target_art.GetNameWithNoTooltip]"
 d008_orthodox_events.4.desc: "Upłynął umówiony termin zwrotu. [ShowWorkOfArtTypeName('icon')] [target_art.GetName], wypożyczona nam przez kraj [origin_country.GetName], powinna wrócić do swojego właściciela, który oczywiście na to liczy. Możemy jednak stwierdzić, że „zapodziała się”, by wcale jej nie zwracać."
 d008_orthodox_events.4.desc_no_country: "Ikona [target_art.GetName] była w naszym posiadaniu od jakiegoś czasu. Pierwotnie ją nam wypożyczono, ale ponieważ wcześniejszy właściciel nie jest już niepodległym państwem, nie widzimy powodu, by komukolwiek ją oddawać."
 d008_orthodox_events.4.a: "Zwróćmy ją jak należy."
 d008_orthodox_events.4.b: "Jest już nasza!"
 d008_orthodox_events.5.title: "$d008_orthodox_events.4.title$"
 d008_orthodox_events.5.desc: "Wypożyczenie ikony [target_art.GetName] państwu [target_country.GetLongName] dobiegło końca. W rezultacie zwrócili ją ze stosowym ceremoniałem, wypełniając należycie warunki naszej umowy."
 d008_orthodox_events.5.a: "Tak właśnie powinien się zachowywać kraj [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip|l][Select_CString(Or(EndsWith(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'k'),Or(EndsWith(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'n'),EndsWith(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'ł'))),'y','ki')]."
 d008_orthodox_events.6.title: "$d008_orthodox_events.4.title$"
 d008_orthodox_events.6.desc: "Wypożyczenie ikony [target_art.GetName] dobiegło końca. Jednak [target_country.GetLongName] odmawia jej zwrotu. [target_country.GetName] przedstawia tylko słabe wymówki w próbie usprawiedliwienia tej skandalicznej odmowy."
 d008_orthodox_events.6.a: "Zapłacą za tę zniewagę!"
 d008_orthodox_events.7.title: "[target_pentarchy.GetNameWithNoTooltip] – zdobycie"
 d008_orthodox_events.7.desc: "Miasto [target_pentarchy.GetName], jedna z siedzib pentarchii, wielkich ośrodków świata #L [ShowReligionGroupAdjective('christian')|l]iego#!, trafiło w nasze ręce. [target_patriarch.GetName] zasiada teraz na tronie, a my głosimy chwałę religii #L [ShowReligionAdjective('orthodox')|l]ej#!."
 d008_orthodox_events.7.a: "Pentarchia będzie nasza!"
 d008_orthodox_events.8.title: "[target_pentarchy.GetNameWithNoTooltip] – utrata"
 d008_orthodox_events.8.desc: "Odebrano nam miasto [target_pentarchy.GetName], a wraz z nim władzę oraz respekt, jakie daje. Czy Bóg nas opuścił? Kościół #L [ShowReligionAdjective('orthodox')]y#! państwa [ROOT.GetCountry.GetName] z pewnością na tym ucierpi."
 d008_orthodox_events.8.desc_all_pentarchy: "Pentarchia została zniszczona wraz z utratą miasta [target_pentarchy.GetName], gdyż już nie kontrolujemy wszystkich jej siedzib. Jeśli mamy zapewnić wierze siłę, musimy ponownie zabezpieczyć pod naszym sztandarem wszystkie pięć siedzib."
 d008_orthodox_events.8.a: "Będziemy musieli je odzyskać!"
 downgrade_pentarchy_modifier_tt: "Nie będziemy już otrzymywać zwiększonych efektów dzięki kontrolowaniu siedzib pentarchii"
 d008_orthodox_events.9.title: "Pentarchia przywrócona"
 d008_orthodox_events.9.desc: "Dzięki temu, że [target_pentarchy.GetName] jest w naszych rękach, kontrolujemy wszystkie pięć siedzib pentarchii. To, co niegdyś było luźnym związkiem pomiędzy pięcioma tronami, teraz pozostaje zjednoczone pod naszą władzą. Nawet ci, którzy popadli w łapy pogan i heretyków, powrócili do stada z naszej łaski. Kościół raz jeszcze będzie zjednoczony, a nasi patriarchowie zadecydują o jego losie."
 d008_orthodox_events.9.a: "Kościół na powrót będzie zjednoczony."
 upgrade_pentarchy_modifier_tt: "Efekty kontrolowania siedzib pentarchii będą zwiększone"
 pentarchy_unlocked_abilities_tt: "Uzyskuje dostęp do [Concept('actions','działań')|e] [ShowGenericActionName('mend_schism')] oraz [ShowGenericActionName('restore_rome_primacy')]"
 d008_orthodox_events.10.title: "Naprawa schizmy"
 d008_orthodox_events.10.desc: "Już od czasów rozłamu patriarchów wieki temu niszcząca schizma #L [ShowLocationName('rome')]u#! i #L [ShowLocationName('constantinople')]a#! trawiła [ShowReligionGroupName('christian')|l]. Podział Kościoła Zachodniego służył wypaczaniu słowa Chrystusa, z czego cieszył się jedynie sam diabeł.\n\nTeraz, gdy wszystkie pięć siedzib pentarchii znalazło się pod naszą władzą, patriarchów wschodnich i zachodnich na powrót zjednoczyły te same poglądy oraz Kościół. Chociaż wciąż jest wielu heretyków, którzy odmawiają uznania Prawdziwego Kościoła, pozostaje tylko kwestią czasu, gdy wszystkie owieczki powrócą do swojego prawdziwego pasterza."
 d008_orthodox_events.10.a: "Jest tylko jeden Kościół [ShowReligionGroupAdjectiveWithNoTooltip('christian')]i."
 d008_orthodox_events.11.title: "Przywrócenie pierwszeństwa [ShowLocationNameWithNoTooltip('rome')]u"
 d008_orthodox_events.11.desc: "Wieczne Miasto, będące kolebką cesarstwa oraz światłem przewodnim kultury i cywilizacji od czasów starożytnych, już zbyt długo skrywała ciemność herezji i barbarzyństwa. Teraz, gdy znów znajduje się w prawowitych rękach, jego chwała zostanie przywrócona oraz ponownie zajmie miejsce w centrum świata.\n\nZ tej nowej #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]kiej#! stolicy nasze [ROOT.GetCountry.GetFlavorRank|l] będzie promieniować na wszystkie strony świata. Wszyscy ludzie na ziemi będą czuć jego obecność. Chwała #L [ShowLocationName('rome')]owi#!! Niech żyje [ROOT.GetCountry.GetLongName|l]!"
 d008_orthodox_events.11.a: "#italic Urbs aeterna restituta!#!"
 patriarchate_will_relocate_to_rome_tt: "Patriarcha #L [ShowLocationName('rome')]u#! będzie teraz głową organizacji [GetInternationalOrganizationType('autocephalous_patriarchate').GetName]"
 d008_orthodox_events.12.title: "Schizma uznana za naprawioną"
 d008_orthodox_events.12.desc: "[scope:actor.GetName] twierdzi, że naprawił Wielką Schizmę, jednocząc chrześcijaństwo pod władzą Konstantynopola."
 d008_orthodox_events.12.a: "Przyjmijmy wiarę prawosławną."
 d008_orthodox_events.12.b: "Naszym pasterzem jest Rzym."
 d008_orthodox_events.13.title: "Schizma uznana za naprawioną"
 d008_orthodox_events.13.desc: "[scope:actor.GetName] zdaje się twierdzić, że naprawił Schizmę na swoich warunkach."
 d008_orthodox_events.13.a: "Skandal."
 d008_orthodox_events.14.title: "Patriarcha przenosi się do Rzymu"
 d008_orthodox_events.14.desc: "[scope:actor.GetName] przenosi patriarchat ekumeniczny do Rzymu, wysuwając otwarte żądanie wobec naszego miasta."
 d008_orthodox_events.14.a: "Nigdy nie oddamy Rzymu."
