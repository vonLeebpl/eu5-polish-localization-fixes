l_polish:
 # Hellenism
 #Religious Aspects
 civic_religion_aspect: "Religia miejska"
 civic_religion_aspect_desc: "Honorowanie bogów jest tym samym, co zachowanie dobrostanu państwa. Tym samym praktyki i ceremonie religijne są obowiązkiem miasta, który trzeba wypełniać, aby zapewnić dostatek naszej polis."
 hero_cult_aspect: "Kulty bohaterów"
 hero_cult_aspect_desc: "Nasza historia pełna jest potężnych postaci, które kształtowały nasze społeczeństwo i charakter. Ci obdarzeni niezwykłymi zdolnościami śmiertelni synowie bogów, których często spotykał tragiczny los, a którzy chronili naszych przodków i prowadzili ich ku stworzeniu wspaniałego narodu, jakim dziś jesteśmy. Teraz naszym obowiązkiem jest oddawać im cześć oraz słuchać ich lekcji."
 dionysian_mysteries_aspect: "Misteria dionizyjskie"
 dionysian_mysteries_aspect_desc: "Rytuały, taniec i muzyka wtajemniczonych w misteria Dionizosa dają uczestnikom wolność oraz ulgę bez podziału na klasy społeczne. Śmierć i odrodzenie boga ukazuje cykl życia winogrona, które wyrasta z ziemi, staje się winem i jest ostatecznie wypijane przez akolitów chwały Dionizosa."
 eleusinian_mysteries_aspect: "Misteria eleuzyjskie"
 eleusinian_mysteries_aspect_desc: "Akolici Eleuzyni powtarzają mit o porwaniu Persefony od matki Demeter przez króla podziemi Hadesa, a następnie jej późniejszym uwolnieniu i oszukaniu. Dla wtajemniczonych mit przedstawia cykl wzrostu i odrodzenia całego świata roślinnego oraz nieskończoność życia, które przechodzi z pokolenia na pokolenie."
 samothracian_mysteries_aspect: "Misteria samotrackie"
 samothracian_mysteries_aspect_desc: "Na wyspie Samotraka kwitł w czasach wielkości hellenizmu tajemny kult. Rzekomo przyjmował każdego, kto chciał dołączyć, nie bacząc na klasę społeczną. Mówi się, że wielu mitologicznych herosów, w tym Herakles, Jazon i Orfeusz, byli wtajemniczeni na Samotrace. Możemy zebrać i zrekonstruować te misteria ze szczątków, by przywrócić kult do dawnej chwały."
 olympiad_aspect: "Igrzyska olimpijskie"
 olympiad_aspect_desc: "Te igrzyska olimpijskie są świętem bogów, jak również pokazem siły i jedności naszego państwa. Udział w nich jest obowiązkiem miasta, który przynosi chlubę atletom."
 mithraic_mysteries_aspect: "Misteria mitrajskie"
 mithraic_mysteries_aspect_desc: "Wtajemniczeni w misteria mitrajskie, którzy samych siebie zwali syndexioi, cieszyli się dużą popularnością w Rzymie oraz Cesarstwie Zachodniorzymskim w czasach największej świetności cesarstwa. Ich rytuały, spotkania oraz uczty miały miejsce w tajnych podziemnych świątyniach, ale możemy je wyprowadzić na światło dzienne i ożywić tradycje z korzyścią dla naszego ludu."
 imperial_cult_aspect: "Kult cesarski"
 imperial_cult_aspect_desc: "Tak jak starożytni cesarze Rzymu byli niegdyś postrzegani jako bóstwa przez lud i senat, również za takowe chce być uważana nasza głowa państwa i jej dynastia. Ich wielkość, majestat oraz władza jasno wskazują, że są naznaczeni nie tylko przez niebiosa, ale też samych bogów."
 dii_familiares_aspect: "Dii Familiares"
 dii_familiares_aspect_desc: "Bóstwa domowe i rodzinne odgrywają bardzo ważną rolę dla naszego państwa. Chronią oraz wpływają na wszystko, co dzieje się w sferze życia naszego ludu, co zwykle obejmuje domostwo, ale może też dotyczyć dróg, sąsiedztwa, a nawet całych miast."
 mos_maiorum_aspect: "Mos Maiorum"
 mos_maiorum_aspect_desc: "„Zwyczaje przodków” to niepisany kodeks rządzący życiem Rzymian od starożytności po szczyt cesarstwa. Ustala tradycje i praktyki, które decydują, co znaczy być Rzymianinem, a także jak należy się zachowywać zarówno prywatnie, jak i publicznie."
 monism_aspect: "Monizm"
 monism_aspect_desc: "Filozofowie naszego odrodzenia utrzymują, że cała egzystencja wywodzi się z Jedności – jedynej transcendentnej zasady, z której emanują wszystkie bóstwa i całe istnienie. Tradycyjny panteon staje się alegorią; bogowie są aspektami Jedności. Znaki tracą swoją szczególną moc, ale wiara w Jedność przenika każdy akt sprawowania władzy."
 #Omens
 #Zeus
 the_thunderer_omen: "Gromowładny"
 the_thunderer_omen_desc: "Niebo złości się błyskiem i grzmotem, strasząc wszystkich, którzy są przeciwko nam."
 supreme_of_gods_omen: "Największy z bogów"
 supreme_of_gods_omen_desc: "Jaśniejące słońce zwiastuje przychylność najpotężniejszego z bogów. Nikt nie podważy naszej chwały!"
 monarch_of_the_sky_omen: "Władca nieba"
 monarch_of_the_sky_omen_desc: "Stado ptaków zrywa się do lotu, gdyż tego właśnie chce [ShowGodName('zeus_god')]."
 omnipotence_of_heaven_omen: "Wszechmoc niebios"
 omnipotence_of_heaven_omen_desc: "[ShowGodName('zeus_god')] jest wśród nas. Czujemy jego moc i to, że nie ma dla niego rzeczy niemożliwych."
 the_liberator_omen: "Wyzwoliciel"
 the_liberator_omen_desc: "[ShowGodName('zeus_god')] pomagał naszym przodkom przeciw najeźdźcom z Persji. To on uwolni nas z okowów."
 the_bountiful_one_omen: "Szczodry"
 the_bountiful_one_omen_desc: "Ci, którym bliski jest [ShowGodName('zeus_god')], doznają jego chwały i szczodrości."
 the_holy_omen: "Święty"
 the_holy_omen_desc: "Nie ma nic świętszego niż obcować z największą świętością i mieć jej przychylność."
 king_of_all_omen: "Król wszystkiego"
 king_of_all_omen_desc: "[ShowGodName('zeus_god')] to najwyższa niebiańska władza. Podobnie jak głowa państwa góruje nad naszym ludem."
 immortal_omen: "Nieśmiertelny"
 immortal_omen_desc: "Czy można zabić boga? Kiedy chroni nas [ShowGodName('zeus_god')], nasze wojska są niepokonane!"
 splendor_omen: "Wspaniałość"
 splendor_omen_desc: "Czyste niebo pokazuje, że [ShowGodName('zeus_god')] i jego chwała są niepodważalne. Cały świat ujrzy przychylność, jaką nam okazuje."
 #Aphrodite
 mother_of_love_omen: "Matka miłości"
 mother_of_love_omen_desc: "[ShowGodName('aphrodite_god')] jest samą miłością, a nasza społeczność będzie się w niej pławić."
 the_foam_born_omen: "Zrodzona z piany"
 the_foam_born_omen_desc: "Piana morska, z której zrodziła się [ShowGodName('aphrodite_god')], obmywa nasze brzegi. Bogini zawsze dba, by przeprowadzić przez nią nasze statki."
 the_seductress_omen: "Kusicielka"
 the_seductress_omen_desc: "[ShowGodName('aphrodite_god')] włada miłością i flirtem. Jej sztuka i przychylność skłonią ku nam wielu."
 giver_of_joy_omen: "Dawczyni radości"
 giver_of_joy_omen_desc: "Nie ma cudowniejszej rzeczy niż obecność i przychylność bogini piękna."
 nurturer_of_children_omen: "Opiekunka dzieci"
 nurturer_of_children_omen_desc: "Nie ma doskonalszego wyrazu miłości bogini niż ta wobec dzieci, a jej matczyna miłość rozciąga się na nas wszystkich."
 the_beautiful_omen: "Piękna"
 the_beautiful_omen_desc: "Jako najpiękniejsza z bogiń [ShowGodName('aphrodite_god')] ma wielu wyznawców. Tak też będzie z nami dzięki jej przychylności."
 the_secretive_omen: "Tajemnicza"
 the_secretive_omen_desc: "Nie każda miłość powinna być publiczna. Dyskrecja i tajemniczość to także narzędzia bogini."
 the_harmonizer_omen: "Równająca"
 the_harmonizer_omen_desc: "[ShowGodName('aphrodite_god')] dzieli się miłością po równo i tak też będzie z miłością do naszego ludu."
 the_lover_of_laughter_omen: "Ulubienica śmiechu"
 the_lover_of_laughter_omen_desc: "[ShowGodName('aphrodite_god')] zawsze się uśmiecha i my też będziemy."
 the_desired_omen: "Pożądana"
 the_desired_omen_desc: "Jako najpiękniejsza bogini [ShowGodName('aphrodite_god')] budzi żądze. Jej przychylność tym samym skusi innych."
 #Poseidon
 tempest_omen: "Sztorm"
 tempest_omen_desc: "Boska furia marszczy wody, rozpętując burzę groźną nawet dla najdzielniejszych żeglarzy."
 lord_of_the_sea_omen: "Pan morza"
 lord_of_the_sea_omen_desc: "Władza nad morzami oznacza dominację nad światem."
 protector_of_horses_omen: "Obrońca koni"
 protector_of_horses_omen_desc: "Ciesząc się przychylnością boskiego ojca wszystkich koni, nasze konie będą pełne życia i siły."
 wielder_of_the_trident_omen: "Noszący trójząb"
 wielder_of_the_trident_omen_desc: "Nie ma bardziej ikonicznej broni niż ta boga mórz. Udowadnia, że najlepszy jest atak wielopunktowy."
 earth_shaker_omen: "Wstrząs ziemi"
 earth_shaker_omen_desc: "Tak jak uderzył w ziemię, by stworzyć źródło, tak samo zostaną uderzeni wrogowie, którzy wkroczą na nasze terytorium."
 leader_of_the_nymphs_omen: "Lider nimf"
 leader_of_the_nymphs_omen_desc: "Łaska, którą obdarza [ShowGodName('poseidon_god')], niesie ze sobą także przychylność jego nimf, które błogosławią wszystkie nasze wody i źródła."
 the_watcher_omen: "Stróż"
 the_watcher_omen_desc: "[ShowGodName('poseidon_god')] widzi wszystko, w każdym zakamarku mórz i innych wód, i nic nie umknie jego uwadze."
 the_graceful_omen: "Pełnia wdzięku"
 the_graceful_omen_desc: "W morzu i falach tkwi piękno, a ich rozważna kontemplacja napełnia serce blaskiem."
 master_of_the_waves_omen: "Władca fal"
 master_of_the_waves_omen_desc: "Nikt nie wypłynie w morze, jeśli [ShowGodName('poseidon_god')] się na to nie zgodzi."
 dark_blue_haired_omen: "Ciemnoniebieskie włosy"
 dark_blue_haired_omen_desc: "Fale są niczym niebieskie włosy samego boga, a nasze statki będą po nich płynąć szybciej dzięki jego łasce."
 #Hermes
 messenger_omen: "Posłaniec"
 messenger_omen_desc: "Skrzydlate buty zawsze szybko i bezpiecznie dostarczają każdą wiadomość."
 golden_wand_omen: "Złota laska"
 golden_wand_omen_desc: "Kaduceusz służył do rozdzielania dwóch węży, ale to, co rozdziela, jednocześnie łączy."
 god_of_travelers_omen: "Bóg podróżników"
 god_of_travelers_omen_desc: "Wszyscy podróżnicy i wędrowni kupcy proszą, by [ShowGodName('hermes_god')] otoczył ich swą opieką."
 protector_of_merchants_omen: "Obrońca kupców"
 protector_of_merchants_omen_desc: "[ShowGodName('hermes_god')] zapewnia kupcom bezpieczną podróż z drogim ładunkiem."
 wing_footed_omen: "Skrzydlate stopy"
 wing_footed_omen_desc: "[ShowGodName('hermes_god')] otacza nas łaską, pozwalając naszym wojskom poruszać się równie szybko, co on sam."
 trickster_omen: "Oszust"
 trickster_omen_desc: "Zmiana wiatru pokazuje, że nawet [ShowGodName('hermes_god')] ma kapryśny charakter, a wszystko podlega przemianom i zwodom."
 patron_of_thieves_omen: "Patron złodziei"
 patron_of_thieves_omen_desc: "Zwinność może być wykorzystana zarówno w dobrym, jak i w złym celu, ale taką cechę zawsze warto posiadać."
 president_of_games_omen: "Przewodniczący zawodów"
 president_of_games_omen_desc: "[ShowGodName('hermes_god')] otacza swą łaską zawody sportowe, które zapewniają nam zarówno rozrywkę, jak i zdrową aktywność."
 guardian_of_the_gates_omen: "Stróż bram"
 guardian_of_the_gates_omen_desc: "Wszystkie drogi i podróżni prędzej czy później natrafiają na bramę, która albo pozwoli iść dalej, albo zablokuje przejście."
 giver_of_wealth_omen: "Dawca bogactwa"
 giver_of_wealth_omen_desc: "[ShowGodName('hermes_god')] roztacza patronat nad handlem, dzięki czemu nie ogranicza się on tylko do przepływu towarów, lecz przynosi bogactwo."
 #Ares
 throng_of_battle_omen: "Tłum w bitwie"
 throng_of_battle_omen_desc: "[ShowGodName('ares_god')] jest obecny przy każdym konflikcie, w każdej walce, a jego wola decyduje o wyniku."
 insatiable_at_war_omen: "Nienasycenie wojną"
 insatiable_at_war_omen_desc: "[ShowGodName('ares_god')] rozkoszuje się walką, a im jest dłuższa i krwawsza, tym większe są szanse na zdobycie jego przychylności."
 slayer_of_men_omen: "Pogromca ludzi"
 slayer_of_men_omen_desc: "[ShowGodName('ares_god')] przekaże naszym żołnierzom swą furię, a jego potęga będzie ich bronią."
 plague_of_mankind_omen: "Zguba ludzkości"
 plague_of_mankind_omen_desc: "Kto ośmieli się stawić czoła bogu wojny, nie może liczyć na to, że przeżyje kolejny dzień."
 warrior_omen: "Wojownik"
 warrior_omen_desc: "Zwykła rzeź nie wystarczy, by zadowolić boga wojny – potrzebna jest chwalebna walka."
 audacious_omen: "Śmiałość"
 audacious_omen_desc: "Ruszając do walki, by zadać ciosy naszym wrogom, możemy liczyć na to, że [ShowGodName('ares_god')] okaże nam przychylność i łaskę."
 blood_soaked_omen: "Krwawa łaźnia"
 blood_soaked_omen_desc: "Krew naszych wrogów zostanie przelana i złożona w ofierze bogu, który tego żąda." #Blood for the Blood God!
 malignant_omen: "Złośliwość"
 malignant_omen_desc: "Żadna strategia nie jest zbyt podstępna, jeśli ma doprowadzić do zniszczenia naszych wrogów."
 indestructible_omen: "Niezniszczalność"
 indestructible_omen_desc: "[ShowGodName('ares_god')] dzierży nie tylko włócznię, by atakować wroga, ale także tarczę, by się chronić."
 fickle_lord_of_war_omen: "Kapryśny władca wojny"
 fickle_lord_of_war_omen_desc: "Wojna i bitwy mogą przybrać nieoczekiwany obrót w każdej chwili, lecz łaska, jaką obdarza nas [ShowGodName('ares_god')] sprawi, wynik będzie dla nas korzystny."
 #Athena
 unseen_hand_omen: "Niewidzialna dłoń"
 unseen_hand_omen_desc: "Żaden plan nie kończy się niepowodzeniem wyłącznie przez przypadek; siły wyższe skłaniają przywódców najeźdźców do podejmowania błędnych decyzji. Patrole wpadają w zasadzki, linie zaopatrzeniowe zostają przerwane, a dowódcy są wprowadzani w błąd."
 unwavering_omen: "Niezłomność"
 unwavering_omen_desc: "[ShowGodName('athena_god')] stoi dumna i niewzruszona, zatem i my pozostaniemy niezłomni wobec wszelkich niewygód."
 she_who_fights_in_front_omen: "Ta, która walczy na pierwszej linii"
 she_who_fights_in_front_omen_desc: "Najszybszym sposobem na pokonanie wroga jest natychmiastowe ruszenie na niego i stawienie mu czoła."
 the_industrious_omen: "Pracowitość"
 the_industrious_omen_desc: "Staranna i sumienna praca to najlepszy sposób na osiągnięcie zysków i pozytywnych wyników."
 the_judge_omen: "Osąd"
 the_judge_omen_desc: "Czujna i mądra [ShowGodName('athena_god')] nie pozwoli, by jakakolwiek zbrodnia pozostała bezkarna, a niewinni byli niesprawiedliwie krzywdzeni."
 the_chieftain_of_war_omen: "Wojenne przywództwo"
 the_chieftain_of_war_omen_desc: "Tak jak mrówki błąkają się bez celu, nie mając wyznaczonej trasy, którą mogłyby podążać, tak samo armie rozpadną się bez odpowiedniego dowództwa i wytycznych."
 teacher_of_the_waves_omen: "Nauczycielka fal"
 teacher_of_the_waves_omen_desc: "[ShowGodName('poseidon_god')] może władać falami, ale [ShowGodName('athena_god')] okiełznała je dzięki okrętom."
 protector_of_the_anchorage_omen: "Obrończyni floty"
 protector_of_the_anchorage_omen_desc: "[ShowGodName('athena_god')] otoczy nasze okręty swą opieką, ponieważ jesteśmy mistrzami szkutnictwa."
 the_bright_eyed_omen: "Jasnooka"
 the_bright_eyed_omen_desc: "Symbol sowy oznacza, że jesteśmy obdarzeni łaską i mądrością, którymi dysponuje [ShowGodName('athena_god')]."
 the_armed_one_omen: "Uzbrojona"
 the_armed_one_omen_desc: "Uzbrojona od dnia narodzin [ShowGodName('athena_god')] pokazuje nam, że najlepszą strategią jest ciągła gotowość do walki."
 hellenism_religion.1.title: "[target_god.GetNameWithNoTooltip] uśmiecha się do nas"
 hellenism_religion.1.desc: "W te spokojne dni bogowie nie odwracają od nas swojego spojrzenia. Znaki pojawiają się w dziwnych zbiegach okoliczności, w nagłych łaskach losu oraz w codzienności, która rozciąga się na [ROOT.GetCountry.GetGovernment.GetCourtTitle].\n\nKapłani głoszą, że [target_god.GetName] sprzyja naszemu krajowi, a [target_character.GetNameWithNoTooltip] otrzymuje specjalne łaski. Rzeczywiście, wygląda na to, że zaznaliśmy szczęścia, a złożone przez nas ofiary w końcu wpłynęły na nasz los!"
 hellenism_religion.1.a: "Przyjmujemy to błogosławieństwo."
 fertile_ruler_and_family_tt: "[target_character.GetName] i [consort|el] będą mieć zwiększoną [fertility|el]."
 hellenism_religion.2.title: "[target_character.GetNameWithNoTooltip] jest orłem"
 hellenism_religion.2.desc: "Cóż można rzec? [target_character.GetName] wyróżnia się taktycznym geniuszem, którego nie powstydziliby się nasi przodkowie kultywujący wojskowe tradycje. Niewielu może równać się z takimi herosami jak Odyseusz, Jazon czy Ajaks pod względem sprytu, wytrwałości i odwagi.\n\nJednakże [target_character.GetShortNameWithNoTooltip] świeci przykładem jako wybitna postać #L [ShowReligionAdjective('hellenism_religion')|l]ej#! kultury i jest niczym orzeł na polu bitwy."
 hellenism_religion.2.a: "Czy [target_character.GetName] będzie walczyć w cieniu?"
 hellenism_religion.2.b: "Niech [target_character.GetName] naucza w akademii!"
 hellenism_religion.3.title: "Wydział filozofii w mieście [target_location.GetNameWithNoTooltip]"
 hellenism_religion.3.desc: "Skąd wzięła się ludzka dusza? Co czeka nas po śmierci? Czy życie byłoby lepsze, gdybyśmy byli dwunożnymi oskubanymi ptakami? Takie palące pytania zaprzątają przepełnione umysły intelektualistów i filozofów, których gości w swych murach [ShowBuildingTypeName('university')] miasta [target_location.GetName].\n\nW ostatnim czasie wydział znalazł się pod patronatem miejscowego zamożnego mecenasa, który obecnie zabiega o zwiększenie finansowania, argumentując, że placówka ta może rzeczywiście przyczynić się do rozpowszechniania nowatorskich i przełomowych idei."
 hellenism_religion.3.a: "O ile tylko nie uczą o Diogenesie..."
 hellenism_religion.3.b: "Czy nie mogą po prostu wyobrazić sobie, że mają pieniądze?"
 hellenism_religion.4.title: "[target_character_2.GetNameWithNoTooltip] i talizman"
 hellenism_religion.4.desc: "Wrogowie mniejszej i większej prominencji knują dzień i noc, by doprowadzić do naszego upadku. Jednak sukcesja jest bezpieczna, dopóki żyje [target_character_2.GetName]. Przyszłość całego naszego narodu spoczywa w tych delikatnych rękach.\n\n[target_character_2.GetShortNameWithNoTooltip], otrzymując błogosławieństwo bogów Olimpu, zapisze się w historii – tego jesteśmy pewni. Jedna z osób na naszym dworze, która para się mistycyzmem, [target_character_3.GetWomanMan] o imieniu [target_character_3.GetName], zapowiada, że rozstanie się z talizmanem ochronnym. Mówi się, że zawiera on pojedynczą kroplę boskiej esencji zdolnej do odpierania zła, dopóki [target_character_2.GetShortNameWithNoTooltip] nie osiągnie dorosłości."
 hellenism_religion.4.a: "[target_character_3.GetShortNameWithNoTooltip] otrzyma nasze podziękowania."
 hellenism_religion.4.b: "Nie obchodzą nas takie przesądy!"
 talisman_tt: "[target_character_2.GetName] otrzyma talizman, który #italic może#! chronić [target_character_2.GetHerHim] przed [Concept('events','wydarzeniami')|e] związanymi z chorobami oraz przed wypadkami na polowaniu."
 target_character_3_is_declined_tt: "[target_character_3.GetName] usłyszy uprzejmą odmowę."
 hellenism_religion.5.title: "[target_god.GetNameWithNoTooltip] ma własne święto w prowincji [target_province.GetNameWithNoTooltip]"
 hellenism_religion.5.desc: "Radosne wieści napływają z prowincji [target_province.GetName], gdzie mieszkańcy wyszli na ulice, by świętować łaskę, jaką obdarza ich [target_god.GetName]. W bezprecedensowym przejawie pobożności zorganizowali oni festyny, pragnąc podziękować za swoje szczęście.\n\nPrzez jeden dzień nawet ciężar władzy wydaje się lżejszy. Bogowie otrzymują cześć, tłumy głośno świętują, a pobożność rozlewa się po całej prowincji niczym ambrozja na Olimpie."
 hellenism_religion.5.a: "Niech prowincja świętuje."
 every_pop_in_target_province_gains_10_satisfaction_tt: "Nasze [pops|el] w prowincji [target_province.GetName] zyskają [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [Concept('pop_satisfaction','satysfakcji')|e]"
 hellenism_religion.6.title: "Najjaśniejszy dzień"
 hellenism_religion.6.desc: "[target_character.GetName] osiąga niespotykane dotąd wyżyny pod uświęconym przewodnictwem bogów olimpijskich. Dobra polityka, dzielenie się bogactwem oraz stabilny i pokojowy okres rządów to tylko niektóre z dobrodziejstw, jakimi obdarzyli nas bogowie. Zaprawdę, jest to złota epoka, którą cieszy się nasz lud, skandując imię „[target_character.GetShortNameWithNoTooltip]” i uwieczniając [target_character.GetHerHim] podobizny obok innych legendarnych postaci, takich jak Herakles i Perykles."
 hellenism_religion.6.a: "Skupmy nasze wysiłki na administracji!"
 hellenism_religion.6.b: "Niech nasza dyplomatyczna godność rządzi światem."
 hellenism_religion.6.c: "Nasi wrogowie zostaną pokonani!"
 hellenism_religion.7.title: "[ShowGodNameWithNoTooltip('ares_god')] przybiera cielesną postać"
 hellenism_religion.7.desc: "Ogień, siarka i przerażające krzyki słychać wszędzie tam, gdzie zjawia się [target_character.GetName]. Ta heroiczna postać od dzieciństwa wyróżniała się umiejętnością pozbawiania życia swoich wrogów.\n\nDzięki tej reputacji nasi żołnierze uważają, że jest to sam [ShowGodName('ares_god')], który kroczy wśród nich, siejąc zniszczenie w imieniu naszego kraju."
 hellenism_religion.7.a: "[target_character.GetName] wie, że dla zwycięstwa trzeba poświęcić wszystko."
 hellenism_religion.7.b: "Nie możemy ryzykować wyzwolenia tak katastrofalnej potęgi..."
 hellenism_religion.8.title: "Historia [ShowCultureNameWithNoTooltip('greek_culture')|l] w eposach"
 hellenism_religion.8.desc: "Eposy Homera od dawna wyznaczają drogę dla rozwoju kultury i piśmienności, będąc zachowanymi klejnotami naszej tradycji.\n\nW hołdzie tej spuściźnie [target_character.GetName] występuje z propozycją sponsorowania badań i prac dotyczących Iliady i Odysei. Pragnie uczcić naszą chwalebną przeszłość w zamian za zgodę na dokładniejsze zapoznanie się z tymi legendarnymi dziełami."
 hellenism_religion.8.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 hellenism_religion.8.b: "$jurchen_confederation_events.3.b$"
 hellenism_religion.9.title: "[target_province.GetNameWithNoTooltip] to kraina obfitości"
 hellenism_religion.9.desc: "Nie ulega wątpliwości, że [target_province.GetName] to miejsce cieszące się przychylnością bogów, o czym świadczy rosnący dobrobyt w całej prowincji. Niedawno zgłosili się do nas poszukiwacze i miejscowi budowniczy, snujący plany skoncentrowania tego bogactwa w miejskich ośrodkach prowincji, kosztem okolicznych wsi. Takie posunięcie przyspieszyłoby proces urbanizacji, ale pozbawiłoby mieszkańców terenów pozamiejskich dodatkowych zysków."
 hellenism_religion.9.a: "Bogactwo dla ludu!"
 hellenism_religion.9.b: "Skoncentrujmy nasze wysiłki."
 pops_in_aforementioned_provinces_weak_satisfaction_tt: "Nasze [pops|el] we wspomnianych [Concept('provinces','prowincjach')|e] zyskają [ShowNamedValue('pop_satisfaction_weak_bonus')|+=2%] [Concept('pop_satisfaction','satysfakcji')|e]."
 hellenism_religion.10.title: "[ROOT.GetCountry.Custom('GetDemeterMomName')] daje swe błogosławieństwo"
 hellenism_religion.10.desc: "Od dłuższego czasu spichlerze w mieście [target_market.GetName] są pełne. Jest to z pewnością znak, że [ROOT.GetCountry.Custom('GetDemeterMomName')], bogini żniw, nam sprzyja. Nasz nowo odkryty dobrobyt jest kolejnym dowodem boskiej łaski. Miejscowi przybywają, by prosić o rozdział nadwyżek żywności, zaś kapłani sugerują, że należy złożyć dodatkową ofiarę."
 hellenism_religion.10.a: "Rozdajmy zapasy ludziom."
 hellenism_religion.10.b: "Bogowie otrzymają ofiarę."
 Demeter_latin_name: "Ceres"
 Demeter_base_name: "Demeter"
 hellenism_religion.11.title: "[target_god.GetNameWithNoTooltip] wyraża niezadowolenie"
 hellenism_religion.11.desc: "Sądząc po bezlitosnym spojrzeniu boskości, wydaje się, że [target_god.GetName] wyraża swoje wielkie niezadowolenie! W nocy wśród naszego ludu pojawiają się złowieszcze znaki, czai się cień, a w powietrzu unosi się narastające poczucie zbliżającej się zagłady. Nie wiemy, czym zasłużyliśmy na gniew tak potężnego bóstwa, a jedynym sposobem na odzyskanie jego łaski jest pokorne pochylenie głowy w hołdzie boskości."
 hellenism_religion.11.a: "Takie jest życie."
 hellenism_religion.11.b: "Natychmiast zorganizujmy huczne uroczystości przebłagalne."
 hellenism_religion.12.title: "Potworne narodziny"
 hellenism_religion.12.desc: "Na naszym dworze zapadła cisza. W dziecięcych komnatach #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]kiej#! rezydencji narodziło się dziecko. Jego rodzicem jest [target_character_1.GetName]. Po nieprzespanych nocach wypełnionych panicznymi modlitwami doszło do porodu, który sprowadzi na nas zły los.\n\n[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] dopatrują się złego znaku. Słudzy mówią o klątwie. Nasi rywale nazwą to słabością. Jednak [target_character_2.GetShortName] wciąż oddycha, a los tego dziecka może zdecydować o przyszłości naszego rodu..."
 hellenism_religion.12.a: "Głupcy! [target_character_2.GetShortNameWithNoTooltip] to tylko dziecko!"
 hellenism_religion.12.b: "Nie możemy narażać się na boski gniew."
 hellenism_religion.13.title: "Zepsuty kapłan"
 hellenism_religion.13.desc: "Może i bogowie są wieczni, ale ich słudzy są tylko ludźmi. Dotarły do nas doniesienia, że [target_character.GetName] wykorzystuje swoją świętą funkcję jak prywatny interes, zbierając przysługi i pieniądze tam, gdzie powinny trafiać wyłącznie ofiary.\n\nJeśli interweniujemy, [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] będą głośno protestować, czując urazę i upokorzenie. Jeśli odwrócimy wzrok, damy do zrozumienia wszystkim intrygantom w naszym państwie, że boża posługa to tylko zwyczajny zawód, ryzykując tym samym obrażenie samych bogów."
 hellenism_religion.13.a: "Taka chciwość zgubi nas wszystkich!"
 hellenism_religion.13.b: "Odwróćmy wzrok."
 hellenism_religion.14.title: "Prowincja [target_province.GetNameWithNoTooltip] ignoruje to, czego oczekuje [target_god.GetNameWithNoTooltip]"
 hellenism_religion.14.desc: "Doniesienia z prowincji [target_province.GetName] są niepokojące. [target_god.GetNameWithNoTooltip] to bóstwo zasługujące na obrzędy, ale są one zaniedbywane, ofiary się opóźniają, a wierni narzekają, że drzwi świątyni często bywają zamknięte.\n\nNie ma znaczenia, czy wynika to z lenistwa, ubóstwa, czy cichego buntu. Gdy bóstwo jest ignorowane, w każdym nieszczęściu można dopatrywać jego sprawstwa. Kapłani domagają się podjęcia działań, a prowincja [target_province.GetNameWithNoTooltip] oczekuje naszego osądu."
 hellenism_religion.14.a: "Wymuśmy cześć siłą."
 hellenism_religion.14.b: "Nie będziemy rządzić batem."
 pops_in_target_province_mild_pop_satisfaction_malus_tt: "Nasze [pops|el] w prowincji [target_province.GetName] zyskają [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction','satysfakcji')|e]"
 riots_destroy_temple_desc: "Tłum staje się agresywny, a świątynia staje się celem ataku. O świcie pozostają po niej jedynie zgliszcza."
 riots_cause_minimal_damage_desc: "Na ulicach panuje zamieszanie i słychać krzyki, ale udało się uniknąć najgorszego."
 hellenism_religion.15.title: "Kontrowersyjna wróżba"
 hellenism_religion.15.desc: "A niech nas [ShowGodName('zeus_god')] porazi gromem, wróżbici się pokłócili! Dwie różne interpretacje tych samych znaków, dwa diametralnie różne ostrzeżenia, a oba wyrażone z taką samą stanowczością.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] ma teraz dylemat. Co ludzie sobie pomyślą, skoro [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] są tak podzieleni? Czy zboczyliśmy z właściwej drogi? Niezależnie od tego, jak zinterpretujemy te znaki, jedno jest pewne: poniesiemy konsekwencje..."
 hellenism_religion.15.a: "Mamy już dość narzekań starców!"
 hellenism_religion.16.title: "Gniew bogów"
 hellenism_religion.16.desc: "W naszych murach wybuchła kłótnia, a kapłani twierdzą, że bogowie nas obserwują. Wskazują na nasze rozproszone ziemie, słabą kontrolę nad odległymi krainami i szepczą, że pycha sprowadza na nas boską karę.\n\nJeśli bogowie chcą nam przypomnieć o naszej kruchości, nie wyślą nam uprzejmego listu. Ześlą na nas burzę, ogień i przerażenie, i wybiorą miejsce, gdzie zaboli to najbardziej."
 hellenism_religion.16.a: "Oby burza szybko minęła."
 hellenism_religion.17.title: "Puszka Pandory"
 hellenism_religion.17.desc: "Do prowincji [target_province.GetName] dotarła dziwna ciekawostka, przekazywana z rąk do rąk wśród ukradkowych uśmiechów i głupich wyzwań. Niektórzy przysięgają, że to nieszkodliwa zabawka. Inni twierdzą, że przynosi pecha, kusi nieostrożnych i karze zarozumiałych.\n\nNiezależnie od tego, czy rzeczywiście jest to przeklęty przedmiot, czy jedynie pretekst do wywołania paniki, nieszczęście ma to do siebie, że staje się rzeczywistością, gdy tylko wystarczająco wiele osób w nie uwierzy. Niektórzy z miejscowych kapłanów twierdzą nawet, że na skrzyni widnieje dziwny rysunek przypominający twarz, wyrażającą straszliwy ból i pokrytą krwistą czerwienią."
 hellenism_religion.17.a: "Nie obchodzą nas przesądy."
 hellenism_religion.17.b: "Zapłaćmy za ukrycie tej rzeczy."
 locations_and_pops_in_target_province_suffer_minimal_damage_tt: "Prowincji [target_province.GetName] i mieszkańcom nie zagrozi boska kara."
 hellenism_religion.18.title: "W najciemniejszą noc"
 hellenism_religion.18.desc: "Noc wydaje się dłuższa niż powinna. W każdym zakątku naszego kraju ludzie mówią o upadku, głodzie, klęsce i o tym, że bogowie odwracają od nas wzrok. Nie ulega wątpliwości, że [ROOT.GetCountry.GetFlavorRank|l] przeżywa burzliwy okres, czy to z powodu naszych własnych niedociągnięć, czy też przez to, że rozgniewaliśmy bogów Olimpu.\n\n[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] nie może ignorować tych plotek. Kiedy nasze fundamenty się chwieją, nawet najwspanialsza korona wydaje się ciężka."
 hellenism_religion.18.a: "Ogarnia nas rozpacz."
 hellenism_religion.18.b: "Złóżmy ofiarę. Może bogowie nas wysłuchają."
 hellenism_religion.19.title: "Strach i głód"
 hellenism_religion.19.desc: "Panika rozprzestrzenia się szybciej niż jakakolwiek zaraza. Niewielki nieurodzaj tu, dziwny wypadek tam – i nagle każdy sąsiad staje się wróżbitą, który ma do opowiedzenia ponurą historię. Pomimo naszych usilnych starań, by uspokoić mieszkańców, wydaje się, że wystarczy zaledwie kilka dostrzeżonych złych znaków, by całą społeczność ogarnęło przerażenie.\n\nKapłani twierdzą, że strach należy odpowiednio kierować, by nie przerodził się w bunt. Mieszkańcy prowincji [target_province.GetName] oczekują od nas zapewnień, nawet jeśli trzeba za nie zapłacić."
 hellenism_religion.19.a: "Niech ziemia poniesie ten ciężar."
 hellenism_religion.19.b: "Zaproponujmy ustępstwa i złagodźmy skutki."
 sacrifice_to_the_gods: "Przebłaganie bogów"
 hellenism_religion.20.title: "Bogowie nie akceptują wojny"
 hellenism_religion.20.desc: "Nie wszyscy bogowie czerpią radość z rozlewu krwi. W miarę jak konflikt znany jako [target_war.GetName] się przedłuża, kapłani ostrzegają, że niebiosa stają się coraz bardziej obojętne na nasze modły. Może [ShowGodName('ares_god')] jest zadowolony, ale inni bogowie nie akceptują każdego sporu, niezależnie od tego, czy jest on uzasadniony.\n\nŻołnierze mogą wiwatować na cześć naszych sztandarów, ale lud jest zmęczony, a za wszelkie nieszczęścia obwinia się teraz boskie niezadowolenie. W takich czasach nawet zwycięstwo może wydawać się karą, dalekim i niepewnym celem..."
 hellenism_religion.20.a: "Zniesiemy tę niechęć."
 hellenism_religion.21.title: "[target_location.GetNameWithNoTooltip] – zaniedbane obrzędy"
 hellenism_religion.21.desc: "To zrozumiałe, że ludzie zapominają o swoich obowiązkach wobec bogów, zwłaszcza w czasach spokoju i dobrobytu. W lokacji [target_location.GetName] obrzędy stają się coraz rzadsze i wykonywane bez przekonania. Procesje są skromniejsze, ofiar jest mniej, a stare pieśni śpiewa się bez wiary w nie.\n\nKapłani domagają się, byśmy kogoś przykładnie ukarali. Jeśli miasto nie chce czcić bogów z własnej woli, to może strach nauczy je pobożności. Tak czy inaczej, nie możemy pozwolić, by nasza wiara zanikała."
 hellenism_religion.21.a: "Przypomnijmy pospólstwu o obowiązkach."
 hellenism_religion.21.b: "Elity zbytnio się rozleniwiły."
 hellenism_religion.21.c: "Dajmy im spokój i zaryzykujmy."
 pops_go_unpunished_gods_angry_tt: "Brak kary z pewnością rozgniewa bogów"
 hellenism_religion.22.title: "Ornitomancja w stolicy"
 hellenism_religion.22.desc: "[target_character.GetName] jest na językach mieszkańców stolicy. Pomimo ekscentrycznego stroju, szczyci się niezwykłą umiejętnością przewidywania przyszłości. Rzeczywiście, posługując się ptakami, kośćmi i z nieodpartą pewnością, twierdzi [target_character.GetSheHe], że odczytuje wolę bogów – niezależnie, czy jest ona dla nas korzystna.\n\nNiektórzy dworzanie wyśmiewają te słowa. Inni modlą się w milczeniu, mając nadzieję, że [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] może skorzystać nawet z głupiej wróżby, co jest dość ciekawym i nowym zjawiskiem."
 hellenism_religion.22.a: "[target_character.GetShortNameWithNoTooltip] może krakać dalej!"
 hellenism_religion.22.b: "Co za wstyd."
 birds_divinations_come_true_desc: "Znaki sprzyjają, a szczęście nie pozostaje w tyle. [ROOT.GetCountry.GetGovernment.GetCourtTitle] uznaje to za dowód."
 the_divinations_lie_desc: "Nic z tego nie wynika. Ptaki pozostają ptakami, a [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] nadal jest poirytowany."
 hellenism_religion.23.title: "Rozwój obszarów religijnych"
 hellenism_religion.23.desc: "Kapłani przedstawili ambitną propozycję, która zmieniłaby charakter świętej ziemi. Świątynie, takie jak ta w mieście [target_location.GetName], mają zostać rozbudowane, ich sale poszerzone, a dziedzińce upiększone, aby wierni mogli ponownie poczuć wielkość bogów.\n\nJednak kamień sam się nie przesunie, a rzemieślnicy nie pracują wyłącznie za modlitwę. Niezależnie od tego, czy sfinansujemy tę rozbudowę z własnych środków, czy też zmusimy lud do pokrycia kosztów, odczujemy ten wydatek, a bogowie z pewnością dostrzegą sposób zapłaty."
 hellenism_religion.23.a: "Należy odpowiednio sfinansować tę rozbudowę."
 hellenism_religion.23.b: "Niechaj to lud poniesie koszty."
 hellenism_religion.24.title: "Zabobonność"
 hellenism_religion.24.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] ogarnia niepokój, a najbardziej przejmuje się [target_character.GetName]. Drobne znaki przeradzają się w wielkie omeny, sny stają się ostrzeżeniami, a niewinne zbiegi okoliczności traktuje się jako przesłania z góry.\n\nTaki strach może być pożyteczny, gdy skłania do ostrożności, ale może też osłabić chęć do działania. Jeśli [target_character.GetShortNameWithNoTooltip] nie zdoła pozbyć się tych myśli, być może władza wkrótce zacznie kierować się bardziej przesądami niż rozsądkiem."
 hellenism_religion.24.a: "Lepiej dmuchać na zimne."
 hellenism_religion.24.b: "Nie możemy dać się pochłonąć przesądom."
 hellenism_religion.25.title: "Ofiary na rzecz wojny"
 hellenism_religion.25.desc: "Wojna ma to do siebie, że pochłania wszystko, a nawet najbardziej zaprawieni w bojach żołnierze zaczynają spoglądać ku niebu, gdy los staje się niepewny. Kapłani twierdzą, że o wyniku konfliktu znanego jako [target_war.GetName] nie zadecyduje sama stal i że musimy oddawać cześć bogom, jeśli mamy przetrwać to, co nas czeka.\n\nPadła propozycja kosztownej ofiary, która wzbudziłaby podziw bogów i wzmocniła ducha naszego ludu. Jeśli odmówimy, może i zaoszczędzimy pieniądze, ale ryzykujemy, że w szeregach zacznie narastać zwątpienie, a nasze prośby nie trafią do bogów."
 hellenism_religion.25.a: "Nie szczędźmy środków."
 hellenism_religion.25.b: "Wygramy bez tych teatralnych popisów."
 we_will_win_the_ongoing_conflict_without_gods_tt: "Nie będziemy polegać na religijnych przesądach, by zwyciężyć."
 hellenism_religion.26.title: "Niechaj [target_god.GetNameWithNoTooltip] wysłucha naszych próśb"
 hellenism_religion.26.desc: "Zapach kadzidła unosił się w powietrzu, hymny rozbrzmiewały donośnie, a na ołtarzach nie brakowało ofiar. Kapłani twierdzą, że nasze oddanie dotarło do uszu Olimpu i że dzięki tym wysiłkom bogowie są teraz na tyle blisko, by nas wysłuchać.\n\nJednak boskość nigdy nie obdarza łaskami bezwarunkowo. Jeśli prosimy o błogosławieństwo, musimy pogodzić się z tym, że [target_god.GetName] może zażądać zapłaty, a odpowiedź może zmienić nasze [ROOT.GetCountry.GetFlavorRank|l] w sposób, którego nie jesteśmy w stanie przewidzieć."
 hellenism_religion.26.a: "Niech [target_god.GetNameWithNoTooltip] nam odpowie."
 hellenism_religion.26.b: "Nie będziemy się zdawać na boski osąd."
 gods_reward_our_piety_tt: "[target_god.GetName] wynagradza naszą pobożność [Concept('gold','złotem')|e]"
 gods_imbue_stability_tt: "Przychylność, jaką obdarza nas [target_god.GetName], zwiększa naszą [stability|el]"
 gods_sent_capable_character_tt: "[target_god.GetName] objawi się nam jako [target_character_2.GetName]"
 hellenism_religion.27.title: "Paradoks filozofa"
 hellenism_religion.27.desc: "Znana z ciętego języka gwiazda filozofii, [target_character.GetName] przemawia na dworze, zamieniając każdą pewność w wątpliwość. Dworzanie gromadzą się, by słuchać tych rewelacji, na wpół rozbawieni, na wpół zaniepokojeni, gdy nawet najprostsze prawdy są rozplątywane niczym nici.\n\nMądrość może być darem, ale może też stać się utrapieniem, gdy nie chce się podporządkować. Jeśli pozwolimy swobodnie krążyć takim pomysłom, [ROOT.GetCountry.GetGovernment.GetCourtTitle] może stać się mądrzejszy, ale może też wkraść się weń niepokój, gdyż idee mają zwyczaj rozprzestrzeniać się poza mury, w których początkowo się rodzą."
 hellenism_religion.27.a: "Niech dyskurs trwa."
 hellenism_religion.27.b: "Dość zagadek. [target_character.GetName] musi odejść."
 hellenism_religion.28.title: "[ShowGodNameWithNoTooltip('athena_god')] i jej mądrość"
 hellenism_religion.28.desc: "W czasach pokoju ambicje cichną, rozwaga zyskuje na znaczeniu, zaś [ShowGodName('athena_god')] pojawia się często w modłach kapłanów. Twierdzą oni, że mądrość to nie tylko cnota, ale także broń, którą najlepiej wykuwa się wtedy, gdy [ROOT.GetCountry.GetFlavorRank|l] nie musi przejmować się wojną.\n\nOtrzymaliśmy propozycję – kosztowną, ale rozsądną – która obiecuje porządek tam, gdzie panuje marnotrawstwo, i jasność tam, gdzie szerzą się wątpliwości. Jeśli ją odrzucimy, zachowamy wprawdzie pieniądze, ale [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] nie zapomną, że odwróciliśmy się od rady bogini."
 hellenism_religion.28.a: "Zapłaćmy za mądrość."
 hellenism_religion.28.b: "Nie potrzebujemy żadnej bogini, która myślałaby za nas."
 because_athena_omen_active_desc: "Ze względu na to, że [ShowGodName('athena_god')] zesłała nam [omen|el], który jest aktywny i skaluje się wraz z naszą [Concept('religious_unity','jednością religijną')|e]"
 if_athena_omen_was_active_tt: "Gdyby [ShowGodName('athena_god')] zesłała nam aktywny [omen|el], premia za tę [Concept('event_option','opcję wydarzenia')|e] byłaby większa"
 our_denial_angers_the_clergy_tt: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] z pewnością rozgniewają się naszą odmową"
 hellenism_religion.29.title: "[target_god.GetNameWithNoTooltip] wymaga ofiar"
 hellenism_religion.29.desc: "Kapłani przybywają z ponurymi minami i niepokojącymi wieściami, twierdząc, że nad naszym krajem wisi boski gniew. Uważają, że znaki są jasne i jedynie ofiary, których wymaga [target_god.GetName], mogą zapewnić nam łaskę, zanim nieszczęście przerodzi się w katastrofę, która spadnie na nasze [ROOT.GetCountry.GetFlavorRank|l].\n\nZłoto to najprostsza ofiara, którą można złożyć bez wahania, jednak Olimp rzadko zadowala się samą monetą. Jeśli zdecydujemy się na droższy dar, możemy zyskać większą przychylność, ale ziemia na tym ucierpi, a ludzie będą pamiętać, kto za to odpowiada."
 hellenism_religion.29.a: "Złóżmy ofiarę ze złota na ołtarzu."
 hellenism_religion.29.b: "Niech ziemia sama poniesie ten ciężar."
 hellenism_religion.29.c: "Odrzucamy to żądanie."
 hellenism_religion.30.title: "Kult najemnika"
 hellenism_religion.30.desc: "Z prowincji [target_province.GetName] dochodzą dziwne szepty, niesione przez podróżnych i powtarzane przez zaniepokojonych mieszkańców. W cieniu powstała sekta, oddana ideałom najemników, wychwalająca siłę ponad wszystko i gromadząca wyznawców poprzez tajne rytuały i obietnice ochrony. Jedna z czołowych postaci tego zgromadzenia, [target_character.GetName], wychodzi na pierwszy plan, pragnąc wkroczyć na scenę polityczną w naszym państwie i przemawiać w imieniu swych pobratymców jako były mysthios, twierdząc, że przydadzą nam się tak oddani ludzie.\n\nJednak krążące pogłoski mówią o tajnym planie sekty, dotyczącym dominacji oraz nienasyconego pragnienia władzy. Jeśli przyjmiemy kogoś takiego pod nasze skrzydła, możemy zyskać wpływy tam, gdzie wiara jest słaba, ale być może wprowadzimy też zepsucie do serca państwa, na sam [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]."
 hellenism_religion.30.a: "Wpuśćmy ich i uważnie obserwujmy."
 hellenism_religion.30.b: "Przegońmy ich w cień."
 cult_operates_shadows_tt: "Sekta nadal będzie działać w ukryciu..."
 hellenism_religion.empty: ""
 # Neoplatonism Events
 hellenism_religion.32.title: "Źródło wszelkiego istnienia"
 hellenism_religion.32.desc: "Nadworny filozof właśnie kończy niezwykle ambitne dzieło. W wyważonej i nieustępliwej rozprawie [target_character.GetSheHe] dowodzi, że pierwsza zasada – źródło, z którego wypływają wszyscy bogowie i całe stworzenie, niczym światło z niewyczerpanego słońca – nie jest bogiem wśród bogów, lecz samą podstawą boskości. Tradycyjny panteon pozostaje realny, ale każdy bóg jest aspektem, emanacją tego jednego, niepojętego źródła. To porządek płynący w inteligencję, inteligencja w duszę, dusza w materię.\n\nTraktat jest już czytany przez cały [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]. Jego idee są żywe i będą się rozprzestrzeniać, niezależnie od tego, czy podejmiemy działania, czy nie."
 hellenism_religion.32.a: "Zamówmy kopie i rozpowszechnijmy je."
 hellenism_religion.32.b: "Niech ta koncepcja wybroni się sama."
 hellenism_religion.33.title: "Kwestia chrześcijaństwa"
 hellenism_religion.33.desc: "Na [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] przybywa biskup o ogromnej erudycji. Nie niesie ze sobą ni miecza, ni skargi – jedynie pytania. [target_character.GetName] poświęca życie filozofii platońskiej i z cichym przekonaniem twierdzi, że Bóg chrześcijan i pierwsze zasady filozofów to jedno i to samo. Podkreśla też, że Trójca Święta to po prostu triada Jedności, Nous i Duszy, ubrana w inne słowa.\n\nArgument ten nie jest pozbawiony mocy, a [target_character.GetName] przemawia z wyważonym spokojem kogoś, kto słyszał już wszystkie kontrargumenty. Niezależnie od tego, czy poprzemy tę koncepcję, czy ją odrzucimy, zarówno stolica [ROOT.GetCountry.GetCapitalName], jak i reszta ziem na długo zapamiętają tę wizytę."
 hellenism_religion.33.a: "Zachęcajmy do dialogu. Pomysły nie są zaraźliwe."
 hellenism_religion.33.b: "Odrzućmy to twierdzenie. Pierwsze zasady nie są boskością."
 hellenism_religion.34.title: "Dusza świata"
 hellenism_religion.34.desc: "Nadworni filozofowie mówią o Duszy Świata – tej emanacji pierwszych zasad, która przepływa przez całe żywe stworzenie, ożywiając pola i rzeki, ciała i oddech. Twierdzą, że dwóch wielkich bogów najlepiej postrzegać nie jako władców morza i nieba, ale jako dwa powiązane ze sobą aspekty tej Duszy: siłę, która przepływa przez wszelkie istnienie i zawsze powraca do swojego źródła.\n\nW prowincji [target_province.GetName], gdzie pory roku są łaskawe, ludzie wydają się naturalnie odczuwać tę tezę. Ziemia jest hojna, a filozofowie twierdzą, że jest to widzialna Opatrzność – Dusza Świata w harmonii z Jednością."
 hellenism_religion.34.a: "Przekujmy te prawdy w zarządzanie. Dbanie o ziemię jest dbaniem o Duszę."
 hellenism_religion.34.b: "Opublikujmy deklarację teologiczną. Niech doktryna zostanie spisana."
 hellenism_religion_34_work_of_art: "Psyche Kosmou"
 hellenism_religion_34_work_of_art_desc: "Studium teologiczne poświęcone filozofii platońskiej, w którym dowodzi się, że Dusza Świata jest siłą ożywiającą wszelkie żywe istoty, przepływającą przez naturę i powracającą do swojego źródła w Jedności."
 hellenism_religion.35.title: "Wyniesienie duszy"
 hellenism_religion.35.desc: "Na [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] dotarła wiadomość, że [target_character.GetName] – filozoficzny umysł w cichy sposób kształtujący sposób myślenia całego pokolenia swoimi dziełami, właśnie umiera. W ostatnich tygodniach ta wybitna postać ciągle nauczała – nie z książek, lecz poprzez bezpośrednią kontemplację, opisując starannym językiem trzy etapy wyniesienia: najpierw odwrócenie duszy od materii, następnie zharmonizowanie zdolności rozumowych z Nous, a w końcu – i tu głos cichł niemal do zera – moment zjednoczenia z samą Jednością, poza wszelką myślą, poza wszelkim bytem.\n\nNajwyższa władza otrzymała zaproszenie, by ujrzeć ten proces na własne oczy. [target_character.GetName] prosi jedynie, by ta nauka nie zaginęła."
 hellenism_religion.35.a: "Spiszmy i rozpowszechnijmy ostatnie słowa tak wybitnego umysłu."
 hellenism_religion.35.b: "Załóżmy szkołę noszącą imię kogoś tak wyjątkowego."
 target_character_ascends_to_the_one_tt: "[target_character.GetName] odchodzi w spokoju, wypowiedziawszy wszystko, co należy."
 hellenism_religion.36.title: "Olimpijscy odnowiciele"
 hellenism_religion.36.desc: "Nie wszyscy poddani pogodzili się z nową teologią. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] podzielili się na frakcje, a na czele jednej z nich stoi [target_character.GetName], coraz głośniej wyrażając swój sprzeciw. Argument jest prosty i odczuwalny bardziej w sercu niż w umyśle: [ROOT.GetCountry.GetFlavorRank|l] potrzebuje Zeusa, Ateny, Aresa i Posejdona. Nie symboli. Nie emanacji. Nie aspektów niepojętej zasady, której nie można nazwać, o którą nie można prosić ani której nie można zadowolić. Ludzie potrzebują bogów Olimpu z ich twarzami, świątyniami i głodem ofiar.\n\nJak ujął to [target_character.GetName]: „Abstrakcja nie słyszy nas. Starzy bogowie słyszeli”. Otwarcie wnosi o zniesienie doktryny monistycznej i powrót do tradycyjnego kultu."
 hellenism_religion.36.a: "Brońmy doktryny. Uciszymy frakcję."
 hellenism_religion.36.b: "Zezwólmy na formalną dyskusję. Niech obie strony zabiorą głos."
 hellenism_religion.36.c: "Odrzućmy doktrynę monizmu. Powróćmy do wiary olimpijskiej."
