l_polish:
 d009_flavor_iberian_union.1.title: "Proklamuj Monarchię Hiszpańską"
 d009_flavor_iberian_union.1.desc: "Korony naszej unii zrosły się ze sobą tak ściśle, że stanowią jedno królestwo, któremu brak już tylko nazwy. Nasza administracja rządzi całością, nasze prawa i moneta obowiązują od jednego krańca półwyspu po drugi, a mniejsze królestwa stały się prowincjami większej całości.\n\nNadeszła godzina, by odłożyć na bok dawne tytuły i ogłosić przed całym światem jedną, suwerenną monarchię: Hiszpanię."
 d009_flavor_iberian_union.1.a: "Niechaj Monarchia Hiszpańska zostanie proklamowana!"
