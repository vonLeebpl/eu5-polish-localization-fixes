l_polish:
 d009_flavor_religious_orders.1.title: "Zmiana przywództwa"
 d009_flavor_religious_orders.1.entry: "$d009_flavor_religious_orders.1.title$"
 d009_flavor_religious_orders.1.desc: "[old_head_of_order.GetName], [Select_CString(old_head_of_order.IsFemale,'która wiernie wspierała','który wiernie wspierał')] nasz [ROOT.GetCountry.GetGovernment.GetCourtTitle] stojąc na czele [target_order.GetName], nagle zachorował[AddTextIf(old_head_of_order.IsFemale,'a')] i [Select_CString(old_head_of_order.IsFemale,'zrzekła','zrzekł')] się swojego urzędu. Choć wielu znamienitych rycerzy i możnowładców pragnie objąć to stanowisko, jasne jest, że [target_ruler.GetName] ma już kogoś na myśli. [target_character.GetName], to [Select_CString(target_character.IsFemale,'ulubienica','ulubieniec')] naszego władcy i zostanie [Select_CString(target_character.IsFemale,'nową wielką mistrzynią','nowym wielkim mistrzem')] [target_order.GetNameWithNoTooltip]!"
 d009_flavor_religious_orders.1.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 d009_flavor_religious_orders.1.a.entry: "$common_string_ok$"
 d009_flavor_religious_orders.2.title: "[target_character.GetNameWithNoTooltip] poszerza swoje wpływy"
 d009_flavor_religious_orders.2.entry: "Rosnące wpływy wielkiego mistrza"
 d009_flavor_religious_orders.2.desc: "W ostatnich latach majątek i władza [target_character.GetName] znacznie wzrosły. Choć taki wzrost osobistego bogactwa nie jest niczym niezwykłym dla wielkiego mistrza [target_order.GetName], [target_character.GetSheHe] najwyraźniej nabrał również gustu do polityki stolicy. Będąc dawniej ulubieńcem [target_ruler.GetNameWithNoTooltip], [target_character.GetNameWithNoTooltip] obecnie często krytykuje nasz rząd i przywództwo, przez co wielu z [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] wzywa do usunięcia [target_character.GetHerHis] z urzędu wielkiego mistrza."
 d009_flavor_religious_orders.2.a: "[target_character.GetSheHe|U] czyni to, co jest najlepsze dla [ROOT.GetCountry.GetNameWithNoTooltip]."
 d009_flavor_religious_orders.2.a.entry: "Czyni to, co jest najlepsze dla naszego kraju."
 d009_flavor_religious_orders.2.b: "[target_character.GetSheHe|U] przekracza [target_character.GetHisHer] uprawnienia."
 d009_flavor_religious_orders.2.b.entry: "Przekracza swoje uprawnienia."
 d009_flavor_religious_orders.3.title: "Zniesławiony ulubieniec"
 d009_flavor_religious_orders.3.entry: "$d009_flavor_religious_orders.3.title$"
 d009_flavor_religious_orders.3.desc: "Nasz [ROOT.GetCountry.GetGovernment.GetCourtTitle] oraz [target_character.GetName] są w ciągłym napięciu wywołanym przez polityczne manewry [Select_CString(target_character.IsFemale,'tej ostatniej','tego ostatniego')]. Szczególnie jawna krytyka wobec [target_ruler.GetName] oraz [target_ruler.GetHerHis] romansu wyeliminowała [Select_CString(target_character.IsFemale,'niedawną ulubienicę','niedawnego ulubieńca')] z grona ludzi zaufanych. Nasi [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] również są wrogo nastawieni do [target_character.GetName] z powodu [target_character.GetHerHis] błyskawicznego wzrostu znaczenia, dlatego [ROOT.GetCountry.GetName] nie może już dłużej polegać na takiej osobie i nie może być ona [Select_CString(target_character.IsFemale,'wielką mistrzynią','wielkim mistrzem')] zakonu: [target_order.GetName]."
 d009_flavor_religious_orders.3.a: "[target_character.GetSheHe|U] zostanie stracony za zdradę!"
 d009_flavor_religious_orders.3.a.entry: "Zostanie stracony za zdradę!"
 d009_flavor_religious_orders.3.b: "Wygnaj [target_character.GetHerHim] i wyznacz nowego przełożonego [target_order.GetNameWithNoTooltip]."
 d009_flavor_religious_orders.3.b.entry: "Wygnaj go i wyznacz nowego przełożonego zakonu."
 d009_flavor_religious_orders.1.b: "Bracia z [target_order.GetNameWithNoTooltip] sami wybiorą swojego wielkiego mistrza."
 d009_flavor_religious_orders.1.b.entry: "Bracia sami wybiorą swojego wielkiego mistrza."
