l_polish:
 dar_al_tiraz_bureaucracy: "Dār al-Ṭirāz"
 dar_al_tiraz_bureaucracy_desc: "Ozdobne, bogato zdobione szaty pochodzące z Persji od dawna były w świecie islamskim używane jako szaty honorowe, które władca obdarowywał tymi, którym sprzyjał. Dobrze finansowany, królewski warsztat #italic $dar_al_tiraz_bureaucracy$#!, tkający jedwab, brokat i hafty, odzieje dwór w blask i wyśle cenione tkaniny na każdy targ."
 diwan_al_mustakhlas_bureaucracy: "Dīwān al-Mustaḵlaṣ"
 diwan_al_mustakhlas_bureaucracy_desc: "#italic $diwan_al_mustakhlas_bureaucracy$#! zarządza prywatną domeną sułtana - majątkami, młynami i dochodami wydzielonymi ze skarbca publicznego na potrzeby dworu i $alhambra$. Sumienne gospodarowanie utrzymuje koronę bogatą i niezależną od jej majątków, lecz gdy nadzór słabnie, to właśnie zarządzający nim urzędnicy zaczynają odprowadzać jej bogactwa do własnych sakiewek."
 diwan_al_qawafil_bureaucracy: "Dīwān al-Qawāfil"
 diwan_al_qawafil_bureaucracy_desc: "#italic $diwan_al_qawafil_bureaucracy$#! nadzoruje wielkie karawany transsaharyjskiego handlu, szlaki przez Sidżilmasę, którymi na północ wędrują złoto i niewolnicy, a na południe sól i tkaniny. Dobrze zarządzany urząd chroni kupców i ich zwierzęta oraz zwiększa bogactwo przemierzające pustynię, by karawany nie stały się łupem rabusiów, a plemiona piasków nie zwróciły się wrogo przeciw władzy, która nie zapewnia już bezpieczeństwa na szlaku."
 ghuzat_mujahidin_bureaucracy: "Al-Ḡuzāt al-Mujāhidīn"
 ghuzat_mujahidin_bureaucracy_desc: "#italic $ghuzat_mujahidin_bureaucracy$#! to ochotnicy wiary, północnoafrykańska jazda przekraczająca cieśninę, aby prowadzić świętą wojnę na granicy pod własnym $rank_county_arabic_ruler_male$. Ci zapaleni wojownicy walczą z zapałem zrodzonym z pobożności, a ich religijność zagrzewa nasz lud do podążania w ich żarliwym śladzie."
 makhzan_bureaucracy: "Al-Maḵzan"
 makhzan_bureaucracy_desc: "#italic $makhzan_bureaucracy$#! to centralny aparat władzy sułtana, jego poborcy podatków i namiestnicy rozciągają moc tronu. Silny #italic maḵzan#! zaciska uchwyt korony nad dalekimi plemionami i miastami, lecz gdy jego administracja słabnie, kraj naprawdę staje się #italic bilād as-sība#!, ziemią buntu, a odległe prowincje osuwają się w stronę rebelii i niezależności."
 marinid_madaris_bureaucracy: "Ri'āyat al-Madāris"
 marinid_madaris_bureaucracy_desc: "#italic $marinid_madaris_bureaucracy$#! to patronat korony nad madrasami, szkołami kształcącymi prawników, pisarzy i urzędników, od których zależy państwo. Szczodrze uposażone, wypełniają one gabinet uczonymi i wiernymi sługami oraz umacniają formalne prawo szkół."
 qadi_al_jamaa_bureaucracy: "Qāḍī al-Jamā'a"
 qadi_al_jamaa_bureaucracy_desc: "#italic $qadi_al_jamaa_bureaucracy$#! to naczelny sędzia wspólnoty, który przewodniczy sądom $maliki_school$ i wyznacza licznych lokalnych qāḍī w całym państwie. Poważany system sądowniczy rozstrzyga spory na podstawie prawa uznawanego przez wszystkich i nadaje tronowi legitymację płynącą ze sprawiedliwości, umacniając przywiązanie ludu do formalnego prawoznawstwa."
 wulat_al_thughur_bureaucracy: "Wulāt al-Ṯuḡūr"
 wulat_al_thughur_bureaucracy_desc: "#italic $wulat_al_thughur_bureaucracy$#! to strażnicy pogranicznych marchii. Obsadzają graniczne zamki, pilnują przełęczy oraz zarządzają rozejmami i trybutem, które trzymają większe chrześcijańskie królestwa na dystans. Właściwie utrzymana marchia jeży się obrońcami i kupuje państwu czas poprzez wytrawną dyplomację, gdyż zaniedbanie granicy ośmieli naszych sąsiadów, którzy mogą wyczuć słabość i tym mocniej naciskać na swoje roszczenia."
 # Diwan al-Gharb
 diwan_al_gharb_bureaucracy: "Dīwān al-Ḡarb"
 diwan_al_gharb_bureaucracy_desc: "#italic $diwan_al_gharb_bureaucracy$ #! — Urząd Zachodu — to organ administracyjny, który zakładamy w naszych andaluzyjskich prowincjach, aby zarządzać ludnością mówiącą zarabizowaną romańszczyzną tak samo swobodnie jak arabskim i w której parafialne kościoły wciąż przewyższają liczbą nasze meczety. Jego skrybowie zbierają dochody sułtana, wyznaczają qādich do mieszanych sądów i wymuszają asymilację, która zmienia zdobycz w prowincję. Dobrze prowadzony urząd wiąże te zachodnie ziemie z naszym prawem; zaniedbany oddaje rubieże w ręce jakiegokolwiek klanu, który zdoła wymusić własne."
 # Mozabite Bureaucracy
 mozabite_azzaba_bureaucracy: "Rada 'Azzāba"
 mozabite_azzaba_bureaucracy_desc: "#italic ʿAzzāba#! to tajna rada uczonych ibadyckich, stanowiąca prawdziwy rządzący szkielet wspólnot mozabickich doliny Mzāb, obradująca nad prawem religijnym, rozstrzygająca spory i wymuszająca ścisły kodeks moralny, który zachował tożsamość ibadycką przez wieki zewnętrznej presji. Utrzymujemy tę radę jako najwyższego arbitra naszego życia wspólnotowego, finansując jej uczonych i czcząc jej wyroki jako wyraz prawa Bożego. Dobrze wspierana 'Azzāba zjednuje sobie oddanie wiernych i rozciąga zasięg ibadyckiej jurysprudencji na każdy dom; pozbawiona środków, jej władza rozpada się, a nurty heterodoksyjne wypełniają przestrzeń, którą pozostawia jej milczenie."
 # Pre-Formation Iberian Bureaucracies
 nav_diputacion_navarra_bureaucracy: "Diputación de Navarra"
 nav_diputacion_navarra_bureaucracy_desc: "$nav_diputacion_navarra_bureaucracy$ zarządza życiem konstytucyjnym Nawarry między sesjami Kortezów, nadzorując pobór #italic donativo#! i zapewniając skrupulatne przestrzeganie #italic fueros#!, które definiują autonomię nawarryjską. Jej skład czerpie z trzech stanów królestwa, dając szlachcie, duchowieństwu i miastom stały udział instytucjonalny w zarządzaniu ich krajem. Dobrze finansowana Diputación jest gwarantem przestrzegania fueros; bez odpowiednich środków nie ma zdolności, by opierać się presji centralizacyjnej, którą wielkie monarchie nieuchronnie wywierają na swe mniejsze terytoria."
 por_desembargo_do_paco_bureaucracy: "Desembargo do Paço"
 por_desembargo_do_paco_bureaucracy_desc: "$por_desembargo_do_paco_bureaucracy$ to najwyższa rada królewska Portugalii, powołana do przeglądu ustaw, wydawania ułaskawień i nadzorowania nominacji sędziowskich, które dają Koronie zasięg do każdego zakątka królestwa. W odróżnieniu od wykształconych na uniwersytetach prawników obsadzających sądy powszechne, Desembargo korzysta z ludzi łączących prawniczą wiedzę fachową z zaufaniem królewskim, godząc profesjonalną jurysprudencję z bezpośrednią służbą monarsze. Dobrze utrzymane Desembargo przyspiesza cykl administracyjny i zapewnia, że decyzje królewskie są wdrażane z prawną precyzją."
 por_mesa_da_consciencia_e_ordens_bureaucracy: "Mesa da Consciência e Ordens"
 por_mesa_da_consciencia_e_ordens_bureaucracy_desc: "$por_mesa_da_consciencia_e_ordens_bureaucracy$ została ustanowiona, aby regulować zakony rycerskie Portugalii — Zakon Chrystusa, Zakon Santiago i Zakon Avis — których ziemiami, dochodami i władzą duchową Korona zarządza jako Wielki Mistrz. Trybunał rozpatruje petycje o dyspensy religijne, zarządza rozdziałem komandorii wśród klientów królewskich i rozstrzyga na styku prawa kanonicznego i patronatu królewskiego. Jej powstanie przekształciło zakony rycerskie z autonomicznych korporacji kościelnych w instrumenty polityki Korony, ściśle związane z królewskim programem religijnym."
 # Spanish Councils - Regional
 spa_council_of_aragon_bureaucracy: "Consejo de Aragón"
 spa_council_of_aragon_bureaucracy_desc: "Wschodnimi terytoriami [ShowRegionName('iberia_region')] w ramach [ShowScriptedGeographyName('aragon_geography')] zarządzać będzie #italic $spa_council_of_aragon_bureaucracy$#!. Urząd ten zajmuje się głównie utrzymywaniem naszych związków z handlem śródziemnomorskim oraz potrzebami lokalnych fueros."
 spa_council_of_castile_bureaucracy: "Consejo de Castilla"
 spa_council_of_castile_bureaucracy_desc: "#italic $spa_council_of_castile_bureaucracy$#! odpowiada za ziemie [ShowScriptedGeographyName('castile_geography')], zarządzając tymi ogromnymi terytoriami i ich ludnością w naszym imieniu."
 spa_council_of_flanders_bureaucracy: "Consejo de Flandes"
 spa_council_of_flanders_bureaucracy_desc: "Rządząc ziemiami odległymi od naszych tradycyjnych włości, #italic $spa_council_of_flanders_bureaucracy$#! będzie musiał utrzymać silną kontrolę nad [ShowScriptedGeographyName('spanish_netherlands_geography')], by zachować porządek i produktywność regionu."
 spa_council_of_italy_bureaucracy: "Consejo de Italia"
 spa_council_of_italy_bureaucracy_desc: "Wraz z naszą coraz większą obecnością na terenie [ShowRegionName('italy_region')], należy powołać radę mającą na celu zarządzanie naszymi nowymi zdobyczami. Rządzenie tymi ziemiami będzie dla nas wyzwaniem innego rodzaju niż w przypadku naszych włości w [ShowRegionName('iberia_region')]."
 spa_council_of_portugal_bureaucracy: "Conselho de Portugal"
 spa_council_of_portugal_bureaucracy_desc: "Wraz z pozyskaniem kolejnych ziem, powinniśmy powołać osobną radę do zarządzania naszymi posiadłościami w [ShowScriptedGeographyName('portugal_geography')]. Urząd ten będzie zajmował się głównie naszym handlem atlantyckim i sprawami morskimi."
 spa_viceroy_bureaucracy: "Urząd Wicekróla"
 spa_viceroy_bureaucracy_desc: "$spa_council_of_indies_bureaucracy_desc$"
 # Spanish Councils - Statewide
 spa_council_of_crusade_bureaucracy: "Consejo de Cruzada"
 spa_council_of_crusade_bureaucracy_desc: "Ustanowiony zgodnie z wolą [GetUniqueInternationalOrganization('catholic_church').GetName] oraz [pope], #italic $spa_council_of_crusade_bureaucracy$#! będzie kierował naszą ekspansją i wysiłkami mającymi na celu zaniesienie światła wiary #L [ShowReligionAdjective('catholic')|l]kiej#! we wszystkie zakątki świata."
 spa_council_of_finance_bureaucracy: "Consejo de Hacienda"
 spa_council_of_finance_bureaucracy_desc: "Zastępując dwa poprzednie urzędy - Rachunkowości i Głównej Rachunkowości, #italic $spa_council_of_finance_bureaucracy$#! ma wyeliminować tarcia między tymi urzędami i stworzyć jednolite biuro do zarządzania finansami państwa."
 spa_council_of_indies_bureaucracy: "Consejo de las Indias"
 spa_council_of_indies_bureaucracy_desc: "Wszystko, co leży za morzem, podlegać będzie jurysdykcji #italic $spa_council_of_indies_bureaucracy$#!. Będzie on zarządzał całym handlem płynącym z kolonii na nasze ziemie macierzyste oraz naszymi poddanymi na obcych brzegach, zapewniając stały napływ bogactwa do naszego skarbca. Byt i przepisy dotyczące naszych nowo pozyskanych poddanych oraz podział ziemi pod kolonialną eksploatację również będą podlegać tej radzie."
 spa_council_of_inquisition_bureaucracy: "Consejo de la Suprema Inquisición"
 spa_council_of_inquisition_bureaucracy_desc: "#italic $spa_council_of_inquisition_bureaucracy$#!, złożony z kilku inkwizytorów apostolskich i kierowany przez inkwizytora generalnego, czuwa nad prawowiernością religijną i procesami sądowymi w naszym kraju. Będzie on pełnił funkcję najwyższego sądu apelacyjnego zarówno w sprawach kościelnych, jak i świeckich."
 spa_council_of_military_orders_bureaucracy: "Consejo de las Órdenes"
 spa_council_of_military_orders_bureaucracy_desc: "Odpowiedzialna za administrację dawnych ziem zakonnych, instytucja #italic $spa_council_of_military_orders_bureaucracy$#! odegra kluczową rolę w nadawaniu ziem na cele wojskowe, zwiększając naszą pulę rekrutacyjną oraz zapewniając kształcenie i pobór zdolnych oficerów do naszych sił zbrojnych."
 spa_council_of_state_bureaucracy: "Consejo de Estado"
 spa_council_of_state_bureaucracy_desc: "#italic Instytucja $spa_council_of_state_bureaucracy$#! jest kierowana bezpośrednio przez naszego władcę i wspiera go w sprawach zagranicznych bez ingerencji obcych wpływów. Rada złożona jest ze zdolnych przedstawicieli naszej szlachty i duchowieństwa, wykształconych w dyplomacji i stosunkach międzynarodowych, którzy będą zarządzać naszymi ambasadami za granicą oraz doradzać nam w trudnych sprawach międzynarodowych."
 dawa_bureaucracy: "Dīwān al-Daʿwa"
 dawa_bureaucracy_desc: "#italic $dawa_bureaucracy$#! to urząd, przez który władca zarządza wiarą po drugiej stronie oceanu, wysyłając qādich i kaznodziejów do dalekich prowincji, gdzie panowanie wyprzedziło meczet. Jego #italic duʿāt#! niosą wezwanie islamu ludom tamtych brzegów, podczas gdy jego skrybowie wiążą nowe kolonie z prawem ummy. Dobrze utrzymany, zamienia odległe zdobycze w osiadłe prowincje i pomnaża liczbę wiernych pod koroną. Zaniedbany, dalekie stado umyka poza zasięg władcy, a wezwanie milknie tam, gdzie nikomu nie płacą, by je głosił."
