l_polish:
 catholic_monarchs_law: "Katoliccy Monarchowie"
 catholic_monarchs_law_desc: "Małżeństwo, które łączy nasze korony, jest podstawą wszystkiego, co nastąpi. Sposób, w jaki para królewska zdecyduje się panować — jako równi sobie czy z jednym domem dominującym — ukształtuje unię na pokolenia."
 iu_establish_iberian_wedding_succession_tt: "Ustanawia [ShowRelationTypeName('iberian_wedding_pact')] między dwiema koronami i ustala ich [heir_selection|e] na [ShowHeirSelectionName('iberian_union_succession')], wiążąc ich sukcesję, tak by wspólny dziedzic mógł zjednoczyć królestwa"
 composite_monarchy_law: "Composite Monarchy"
 composite_monarchy_law_desc: "Nasze królestwa połączone są pod jednym władcą, lecz każde zachowuje własne prawa i wolności. Musimy zdecydować, czy uszanować #italic fueros#! każdego z królestw, czy też skupić ich rządy w jednym ręku."
 asientos_law: "Asientos"
 asientos_law_desc: "Korona przyznaje #italic asientos#!, wyłączne kontrakty na zaopatrywanie naszych zamorskich posiadłości, a ich posiadacz zbiera bogactwa imperium. Unia musi zdecydować, czy korona przyzna te kontrakty samej sobie, czy też podzieli je między kupców wszystkich swoich królestw."
 religious_authority_law: "Religious Authority"
 religious_authority_law_desc: "Nasze zjednoczone korony muszą zdecydować, jak sprawować władzę wynikającą z wiary. Korona może kierować Kościołem w naszych królestwach poprzez #italic Patronato Real#!, albo obrócić tę zapobiegliwość na zewnątrz jako miecz i tarczę chrześcijaństwa."
 legislative_authority_law: "Władza ustawodawcza"
 legislative_authority_law_desc: "Czyją wolą mają być zarządzane królestwa? Prawo może wypływać z ręki królewskiej poprzez wiążące #italic pragmáticas#!, albo opierać się na zgodzie własnych #italic Cortes#! każdego królestwa."
 crown_settlement_law: "Ugoda koron"
 crown_settlement_law_desc: "Ostateczna forma unii musi zostać ustalona. Jedno prawo i jedna moneta mogą zespolić liczne królestwa w jedną, zjednoczoną monarchię, albo korony mogą przetrwać jako trwały związek równych sobie."
 union_of_arms_law: "Unia Broni"
 union_of_arms_law_desc: "Obrona unii jest obowiązkiem każdego królestwa w niej zawartego. Czy poprzez obowiązkowy kontyngent, czy poprzez dobrowolny wkład, królestwa będą wspólnie dzielić ciężar zbrojeń."
 iu_tanto_monta_policy: "Tanto Monta"
 iu_tanto_monta_policy_desc: "#italic Tanto monta, monta tanto#! — obaj władcy panują jako równi sobie, żaden nie stoi nad drugim. Unia równej godności wiąże królestwa we wzajemnym poszanowaniu i wspólnym froncie dynastycznym."
 iu_dynastic_primacy_policy: "Prymat dynastyczny"
 iu_dynastic_primacy_policy_desc: "Jedna korona zostaje uznana za nadrzędną w unii, a jej dynastia za przewodzącą wśród królestw. Ród panujący czerpie z tego największy prestiż, podczas gdy wszyscy członkowie unii dzielą sławę pewnej siebie monarchii."
 iu_dynastic_primacy_senior_only_tt: "Jeśli jesteśmy [senior_partner|e]:"
 iu_respect_fueros_policy: "Poszanowanie fueros"
 iu_respect_fueros_policy_desc: "Starodawne wolności każdego z królestw zostają potwierdzone i chronione. Mniejsze królestwa rządzą się w pokoju samodzielnie, a starsza korona zyskuje szacunek należny władcy wiernemu tradycjom swych krajów."
 iu_centralized_administration_policy: "Scentralizowana administracja"
 iu_centralized_administration_policy_desc: "Zarząd nad królestwami zostaje skupiony w rękach jednej administracji. Starsza korona rozszerza swoją władzę, a mniejsze królestwa czerpią legitymację z porządku zjednoczonego państwa."
 iu_crown_asientos_policy: "Asientos korony"
 iu_crown_asientos_policy_desc: "Korona sama przyznaje kontrakty na dostawy, skupiając handel i napływające srebro w rękach starszego królestwa. Mniejsze królestwa zyskują na zaopatrywaniu posiadłości, a ich przemysł ożywia rosnący popyt."
 iu_shared_asientos_policy: "Wspólne asientos"
 iu_shared_asientos_policy_desc: "Kontrakty rozdziela się między kupców wszystkich królestw. Mniejsze królestwa zyskują bezpośredni dostęp do lukratywnego handlu dostawami, a starsza korona korzysta z tańszych towarów płynących przez wspólną sieć."
 iu_patronato_real_policy: "Patronato Real"
 iu_patronato_real_policy_desc: "Na mocy #italic Patronato Real#!, korona kieruje Kościołem w naszych królestwach, wyznaczając jego prałatów i czerpiąc z jego dochodów. Wiara zarządzana przez tron jest wiarą związaną z tronem."
 iu_catholic_champion_policy: "Obrońca wiary"
 iu_catholic_champion_policy_desc: "Nasze zjednoczone korony podnoszą sztandar chrześcijaństwa, broniąc wiary zarówno przed niewiernymi, jak i heretykami. Niechaj nasze królestwa znane będą jako miecz i tarcza Kościoła."
 iu_pragmaticas_policy: "Pragmáticas Reales"
 iu_pragmaticas_policy_desc: "Prawo płynie z woli królewskiej. Mocą wiążącego dekretu, #italic pragmáticas#!, władca stanowi prawo dla wszystkich królestw naraz, nie czekając na zgodę żadnego zgromadzenia."
 iu_regional_cortes_policy: "Regionalne Cortes"
 iu_regional_cortes_policy_desc: "Każde królestwo rządzi się za zgodą własnych #italic Cortes#!. Rządy dawnych zgromadzeń nadają legitymację każdej koronie i wiążą unię dobrowolną lojalnością."
 iu_una_ley_una_moneda_policy: "Una Ley, Una Moneda"
 iu_una_ley_una_moneda_policy_desc: "Jedno prawo i jedna moneta dla wszystkich naszych królestw. Taka unifikacja koron zaciera dawne granice, zacieśniając więzi licznych królestw w jedną, zjednoczoną monarchię."
 iu_perpetual_crown_policy: "Wieczysta Korona Federalna"
 iu_perpetual_crown_policy_desc: "Unia zostaje przypieczętowana jako trwały układ koron. Ustalone i długotrwałe partnerstwo nadaje każdemu królestwu legitymację i stabilność, a więź między jego członkami jest najsilniejsza w całej unii."
 iu_proportional_levy_policy: "Proporcjonalny Pobór"
 iu_proportional_levy_policy_desc: "Każde królestwo wystawia swój udział we wspólnym wojsku. Unia zbiera liczniejszą i lepszą armię, a najstarsza korona dowodzi zaciągami skupionymi pod jej władzą."
 iu_negotiated_contribution_policy: "Uzgodniony Wkład"
 iu_negotiated_contribution_policy_desc: "Królestwa wnoszą wkład we wspólną obronę na mocy porozumienia, a nie nakazu. Ciężar ten wydaje się lżejszy, gdy jest dźwigany dobrowolnie, a jego dźwiganie buduje dyscyplinę na polu bitwy i zgodę między członkami unii."
 proclaim_spanish_monarchy: "Proklamuj Monarchię Hiszpańską"
 proclaim_spanish_monarchy_desc: "Ogłoś, że liczne korony naszej unii stanowią jedną, zjednoczoną monarchię, i przyjmij imię oraz godność Hiszpanii."
 proclaim_spanish_monarchy_integration_tt: "Nasza unia musi osiągnąć poziom integracji co najmniej 5"
 diplomatic_status_iberian_wedding_pact_name: "Iberyjski Pakt Małżeński"
