 iberian_union_succession: "Sukcesja unii iberyjskiej"
 iberian_union_succession_desc: "Rodzaj [heir_selection|e] stosowany przez chrześcijańskie monarchie [ShowRegionName('iberia_region')] związane [ShowRelationTypeName('iberian_wedding_pact')]. Jeśli jeden z władców umrze bez własnego prawowitego dziedzica, drugi władca odziedziczy tron po pierwszym, łącząc korony w [union|e]."
 iberian_union_succession_tt: "Utwórz [union|e] na wypadek, gdyby nasz następca nie był dziedzicem naszego poprzedniego władcy"
 iu_dynastic_primacy_seniority_tt: "Gdy powstaje ta [union|e], członek o najwyższej [economical_base|e] zostaje wyznaczony jako [ShowSpecialStatusName('senior_partner')], wprowadzając [ShowPolicyName('union_establish_seniority_policy')] oraz [ShowPolicyName('union_senior_succession_law')] dla całej unii"
 iu_tanto_monta_no_seniority_tt: "Nie wyznaczono w ten sposób żadnego [ShowSpecialStatusName('senior_partner')], a [ShowPolicyName('union_establish_seniority_policy')] i [ShowPolicyName('union_senior_succession_law')] nie zostają wprowadzone dla [union|e]"
