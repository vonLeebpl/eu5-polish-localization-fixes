 iberian_wedding_pact_effect_text_past: "[SCOPE.sCountry('actor').GetName] zawarł Iberyjski Pakt Małżeński z [SCOPE.sCountry('recipient').GetName], wiążąc ze sobą sukcesję ich koron."
 diplomatic_status_iberian_wedding_pact_tooltip: "#T $diplomatic_status_iberian_wedding_pact_name$#!\nTe korony łączy Iberyjski Pakt Małżeński. Jeśli któryś z władców umrze bez własnego następcy, drugi odziedziczy tron po pierwszym, tworząc [union|e] między obydwoma krajami."
