l_polish:
 seven_cities.10.title: "Lśniące miasto w oddali"
 seven_cities.10.desc: "Miejscowi przewodnicy, gdy wino już się leje, a towary handlowe leżą gotowe do prezentacji, chętnie rozmawiają. Tak, słyszeli o krainie, o którą dopytuje się [target_leader.GetName]. Tak, jest tam miasto, za następną sierrą, może dwa tygodnie dalej. Jeden przysięga, że widział z oddali słońce wschodzące nad jego murami, złociste. Drugi mówi, że jego wuj handlował tam przez sezon i wrócił bogaty. Trzeci twierdzi, że to bajka, a tamci dwaj powiedzą wszystko za miarkę brandy. Kronikarz spisuje wszystko skrupulatnie."
 seven_cities.10.a: "Brandy dla mężczyzn z najlepszymi opowieściami."
 seven_cities.10.b: "Pożegnać ich i wyruszyć w drogę."
 seven_cities.10.b.tt: "#italic Żegnamy się z gawędziarzami i ruszamy w drogę, ufając szlakowi bardziej niż kolejnej rundzie niestworzonych historii#!"
 seven_cities.10.historical_info: "Wczesne hiszpańskie, francuskie i angielskie wyprawy w obu Amerykach opierały swój wywiad geograficzny niemal wyłącznie na tubylczych informatorach. Informacje te były często kształtowane przez to, co tubylcy sądzili, że ich rozmówcy chcą usłyszeć, przez to, czego tubylcy chcieli od swych rozmówców (najczęściej: by sobie poszli), a także przez domysły, z jakimi owi rozmówcy przybywali. Efektem była chroniczna pętla sprzężenia zwrotnego, w której europejskie legendy o złotych miastach potwierdzane były przez tubylcze zeznania, które same w sobie zostały dopasowane do europejskich oczekiwań."
 natives_provide_crudely_drawn_map_tt: "#Y Miejscowi dostarczają niedbale narysowaną mapę okolicznych ziem#!"
 expedition_learns_of_potential_dangers: "#Y [expedition|e] dowiaduje się o potencjalnych miejscowych niebezpieczeństwach#!"
 bonding_over_alcohol_locals_migrate_tt: "#Y Wspólna miłość do alkoholu i dobrej rozmowy tworzy braterskie więzi#!"
 improve_root_culture_view_of_location_dominant_culture_tt: "Nasza [cultural_opinion|e] wobec kultury [target_location.GetDominantCulture.GetName] ulegnie poprawie"
 expedition_observes_local_innovations: "#Y Miejscowe innowacje zostają zaobserwowane i skatalogowane#!"
 expedition_receives_artifacts_as_gifts: "#Y Artefakty kulturowe zostaną wręczone w darze po naszym powrocie do [ROOT.GetCountry.GetCapital.GetName]#!"
 should_calamity_occur_chance_to_avoid_tt: "Wrogie miejscowe bandy i dzikie zwierzęta okażą się mniejszym zagrożeniem"
 may_bring_us_closer_to_uncovering_goal_tt: "To może przybliżyć nas do odkrycia tego, czego szukamy"
 expedition_brought_back_riches_tt: "[Concept('expedition','Ekspedycja')|el] przywiozła bogactwa:"
 expedition_brought_back_exotic_goods_tt: "Tragarze i ładunek [expedition|e] przywieźli egzotyczne towary:"
 expedition_brought_back_artifacts_tt: "[expedition|e] przywiozła podarunki i artefakty:"
 expedition_healer_joins_court_tt: "Do naszego dworu dołączy miejscowy uzdrowiciel, gdy [expedition|e] powróci"
 porters_guides_prevent_stalling: "Tragarze i przewodnicy towarzyszący [expedition|e] nie pozwalają jej utknąć w miejscu"
 warned_expedition_avoids_calamity_tt: "Uprzedzona o miejscowych niebezpieczeństwach, [expedition|e] unika nieszczęścia"
 seven_cities.11.title: "Uczta powitalna"
 seven_cities.11.desc: "Miasteczko wychodzi nam na spotkanie, zanim zdążyliśmy rozbić obóz: bębny, zamieciony plac i maty zastawione większą ilością jedzenia, niż ludzie widzieli przez cały miesiąc marszu. [target_leader.GetName] [Select_CString(target_leader.IsFemale,'witana','witany')] jest przez ich wodza z poważną kurtuazją równego sobie, a biesiada trwa już w najlepsze, zanim ktokolwiek pomyśli, by zadać pytanie. Nasi tłumacze szepczą, że tak gorące powitanie nigdy nie jest naprawdę bezinteresowne, a to, co wciska się gościowi w dłoń jednym tchem, w następnym bywa mu policzone. Mimo to otwarty gospodarz i zastawiony stół rozwiązały więcej języków niż jakakolwiek groźba, którą moglibyśmy wypowiedzieć."
 seven_cities.11.a: "Odpowiedzieć na ich powitanie otwartymi dłońmi i otwartą sakiewką."
 seven_cities.11.b: "Nie przepłynęliśmy oceanu, by siedzieć i jeść."
 seven_cities.11.b.tt: "#italic Przyjmujemy poczęstunek, lecz oszczędzamy sakiewkę, i ruszamy dalej, zanim powitanie zamieni się w zobowiązanie#!"
 seven_cities.11.historical_info: "Ceremonialna gościnność stanowiła istotę dyplomacji na znacznej części obu Ameryk, a przybywających Europejczyków często witano ucztami, podarunkami i formalnym powitaniem, zanim jeszcze przeszło się do jakichkolwiek spraw. Kolumnę Coronado zakwaterowały i wyżywiły miasta Pueblo wzdłuż Rio Grande, a wyprawę de Soto gościły wodzostwa Missisipi na południowym wschodzie – w obu przypadkach był to sposób na okiełznanie niebezpiecznych przybyszów, a nie poddanie się im. Europejczycy nosili ze sobą szklane paciorki, jastrzębie dzwonki, sukno i noże właśnie po to, by otwierać takie wymiany. Podarunki kupowały życzliwość i informacje, lecz sama transakcja niemal zawsze była rozumiana zupełnie inaczej przez każdą ze stron."
 expedition_receives_guides_and_porters: "#Y Do wyprawy dołączają przewodnicy i tragarze#!"
 expedition_less_likely_to_stall_tt: "[expedition|e] będzie miała mniejsze szanse utknąć w miejscu"
 expedition_receives_exotic_goods: "#Y [expedition|e] wymienia towary na egzotyczne miejscowe dobra, by zabrać je do domu#!"
 seven_cities.12.title: "Chętny przewodnik"
 seven_cities.12.desc: "To on odnajduje nas, nie my jego: chudy, łatwo uśmiechający się mężczyzna, który zdaje się nosić w sobie odrobinę każdej mowy tego szlaku, i przysięga, z dłonią przyciśniętą do piersi, że własnymi oczami stał przed bramami złotego miasta. Prosi jedynie o zapłatę przewodnika i skromny udział w chwale, byle tylko zaprowadzić nas tam. [target_leader.GetName] słucha z wyćwiczoną nieufnością kogoś, kto słyszał już tę samą obietnicę wcześniej, w innych dolinach, z innych ust. Ludzie jednak już podjęli decyzję, a ich oczy błyszczą równie jasno jak jego."
 seven_cities.12.a: "Fortuna i chwała!"
 seven_cities.12.b: "Precz, [Select_CString(target_character.IsFemale,'podła żebraczko','podły żebraku')]!"
 seven_cities.12.b.tt: "#italic Przepędzamy uśmiechniętego przewodnika i trzymamy się szlaku, który sami potrafimy odczytać#!"
 seven_cities.12.historical_info: "Najsławniejszym przewodnikiem wypraw w Ameryce Północnej był jeniec z Równin, którego Hiszpanie nazywali El Turco; to on opowiedział wyprawie Coronado o Quivirze, królestwie leżącym na północnym wschodzie, rzekomo bogatym w złoto. Prowadził kolumnę przez tygodnie w głąb Wielkich Równin, a później, podczas przesłuchania, przyznał, że celowo prowadził ją w step, licząc, że ludzie i konie zginą tam z wycieńczenia. Quivira, gdy w końcu ją osiągnięto, okazała się skupiskiem wioseczek Wichitów z trawiastymi chatami, bez śladu złota, a El Turco został stracony. Ten epizod był typowy: przewodnicy mieli własne powody, by prowadzić uzbrojonych obcych tam, gdzie ich prowadzili, a powody te rzadko pokrywały się z celami samej wyprawy."
 expedition_uncovers_riches_in_new_waypoint: "#Y Droga przewodnika okazuje się prawdziwa i odkrywa prawdziwe bogactwa#!"
 expedition_led_to_deathly_trap: "#Y Przewodnik prowadzi nas w zasadzkę, a [expedition|e] ginie#!"
 guide_lied_waste_of_time: "#Y Przewodnik wodził nas w kółko, a jego złote miasto było kłamstwem#!"
 target_character_flogged_tt: "Kłamliwego przewodnika chłoszcze się za jego oszustwo"
 seven_cities.13.title: "Znajomy język"
 seven_cities.13.desc: "Gdzieś w trakcie marszu coś się zmieniło u [target_leader.GetName]. Tam, gdzie kiedyś [target_leader.GetSheHe] mówił tylko o mieście, które czeka przed nami, teraz [target_leader.GetSheHe] mówi o tutejszych ludziach: o ich języku, którego [target_leader.GetSheHe] po trosze się nauczył, o dachu, jaki mu zaoferowano, o osiadłym życiu, które czeka, gdyby tylko [target_leader.GetSheHe] zechciał przestać wędrować. Dziś rano [target_leader.GetSheHe|U] powiedział nam wprost, że wyprawa może ruszać dalej, ale że [target_leader.GetSheHe] sam nie pójdzie. Niektórych ludzi pochłania dzicz, a innych, jak widać, ona sobie przywłaszcza."
 seven_cities.13.a: "Niech więc [target_leader.GetHerHim] zostanie, a marzenie niech się tu skończy."
 seven_cities.13.historical_info: "Rozbitkowie lub jeńcy europejscy, którzy przez lata żyli wśród ludów tubylczych, byli cenieni przez późniejsze wyprawy jako tłumacze. Hernando de Soto odnalazł Juana Ortiza, ocalałego z wcześniejszej ekspedycji Narvaeza, żyjącego wśród Uzitów na Florydzie po jedenastu latach, i Ortiz służył mu jako tłumacz aż do własnej śmierci podczas marszu. Gonzalo Guerrero, rozbity u wybrzeży Jukatanu w 1511 roku, poszedł zupełnie inną drogą – ożenił się z kobietą z ludu Majów, odmówił ratunku i podobno zginął w bitwie przeciwko Hiszpanom. Tacy ludzie byli żywymi pomostami między światami, a ich lojalność mogła przechylić się na dowolną stronę."
 seven_cities.14.title: "Fontanna młodości?"
 seven_cities.14.desc: "Opowieść dociera do nas z trzeciej ręki i puchnie z każdym powtórzeniem: gdzieś w tamtejszych wzgórzach ma leżeć źródło, którego wody zamykają stare rany, prostują zgarbione plecy i oddają człowiekowi lata, które zabrał mu marsz. Tubylcy mówią o nim z ostrożną czcią, jaką zachowują dla miejsc świętych, co jest albo dowodem czegoś, albo dowodem niczego. Nasz chirurg przewraca oczami i mamrocze coś o gorączce bagiennej. Połowa obozu już napełnia bukłaki."
 seven_cities.14.a: "Zbadać źródło."
 seven_cities.14.b: "Nie ma czasu na chlapanie się w wodzie!"
 seven_cities.14.b.tt: "#italic Mijamy owiane legendą źródło i zostawiamy jego wody łatwowiernym#!"
 seven_cities.14.historical_info: "Fontanna młodości była realnym elementem geograficznych podań, jakie Europejczycy przynieśli do obu Ameryk, i z czasem została powiązana z wyprawą Juana Ponce de Leóna na Florydę w 1513 roku. Twierdzenie, że wyruszył on specjalnie w poszukiwaniu odmładzających wód, jest w dużej mierze późniejszym upiększeniem, forsowanym najpierw przez jego politycznych wrogów, jednak nawiązywało ono do starszych, powszechnie uznawanych legend Starego Świata o źródłach leczniczych i przedłużających życie. Tubylczy informatorzy na Karaibach i południowym wschodzie rzeczywiście wskazywali Europejczykom święte i lecznicze wody, które były prawdziwym elementem ich własnego krajobrazu obrzędowego. Dystans między tym, co opisywano, a tym, czego szukano, był, jak zwykle, bardzo wielki."
 spend_some_time_recovering: "#Y Żołnierze odpoczywają i przez pewien czas korzystają z wód#!"
 retrieve_some_rejuvenating_water: "#Y Zabrano ze sobą bukłaki z osławioną wodą odmładzającą#!"
 just_water_hole: "#Y Okazuje się, że to zwykłe wodopój...#!"
 seven_cities.15.title: "Błysk w korycie rzeki"
 seven_cities.15.desc: "Jeden z ludzi kuca o zmierzchu nad strumieniem, przesiewając żwir w misce tak, jak nauczyli go starzy wyjadacze, po czym wstaje, klnąc i śmiejąc się zarazem: w mule błysnęło pojedyncze ziarno [target_material.GetName]. A więc w górze rzeki musi być go więcej. Czy to skarb, za którym cały ten pochód gonił przez cały kontynent, czy tylko żyła bezwartościowego blichtru, zdolna omamić chciwych ludzi – dziś nikt tego nie powie, i niewielu chce pytać."
 seven_cities.15.a: "Każdy człowiek nad rzekę z miską."
 seven_cities.15.b: "Ba! Zapewne król pirytu!"
 seven_cities.15.historical_info: "Sierra de la Plata, srebrna góra, była plotką, która od lat 20. XVI wieku wciągała hiszpańskie i portugalskie wyprawy w głąb dorzecza Rio de la Plata, i to właśnie od niej wzięła nazwę zarówno rzeka, jak i w końcu kraj. Plotka nie była bezpodstawna: wskazywała, choć mgliście, na prawdziwe srebrne bogactwa Andów, przede wszystkim na górę Potosí, której odkrycie w 1545 roku miało przekształcić gospodarkę światową. Lecz ludzie, którzy podążali w górę rzeki za pierwszymi doniesieniami, napotykali głównie trudy i wrogi kraj, a nie srebro, a legendarna sierra cofała się przed nimi przez całe pokolenie. Odrobina metalu wypłukana z koryta strumienia była często jedynym namacalnym dowodem, że opowieść nie była czystym wymysłem."
 expedition_brings_back_valuable_materials: "#Y Cenną rudę wydobyto i przewieziono na targ do [ROOT.GetCountry.GetCapital.GetName]#!"
 study_their_technique: "#Y Opanowujemy nowe metody górnicze, obniżając koszt rozbudowy kopalń i wzbogacając nasze najlepsze złoża#!"
 men_are_met_by_hunger_and_false_legends: "#Y Koryto rzeki nie przynosi nic prócz głodu i płonnych nadziei#!"
 expedition_outcome_severely_hindered_tt: "Tracimy jeden z naszych ciężko zdobytych tropów"
 hunt_for_precious_metals_target_mining_location_goes_cold_tt: "Porzucamy poszukiwania metalu i ruszamy dalej"
 seven_cities.16.title: "Gościnność wodza"
 seven_cities.16.desc: "Wioska jest duża i dobrze utrzymana, a jej wódz przyjmuje nas z ostrożną kurtuazją, która najwyraźniej sporo go kosztuje. Jego spichrze są pełne, a jego młodzi mężczyźni znają każdy szlak w głąb lądu. Ma też wszelkie powody, by chcieć, abyśmy do rana zniknęli. Nasi oficerowie patrzą na te spichrze i te bezczynne, silne grzbiety i widzą tragarzy oraz przewodników gotowych do wzięcia. [target_leader.GetName] musi zdecydować, czy to miejsce, w którym warto ubić interes, czy miejsce, w którym należy wziąć, co potrzebne, a rozliczenie zostawić tym, którzy przyjdą po nas."
 seven_cities.16.a: "Pojmać wodza i pognać jego lud pod grotem włóczni."
 seven_cities.16.b: "Wynegocjować chętnych tragarzy i rozstać się w zgodzie."
 seven_cities.16.c: "Nikogo nie niepokoić. Zwinąć obóz i ruszyć dalej."
 the_captive_chief_yields_guides: "#Y Pojmany wódz wyznacza przewodników znających szlaki w głąb lądu#!"
 the_chiefs_hall_is_plundered: "#Y Zanim wyruszymy w dalszy marsz, sala wodza zostaje ogołocona z bogactw#!"
 the_village_empties_before_us: "#Y Przez noc wioska znika w lesie razem z przewodnikami#!"
 coerced_locals_resent_us_tt: "Nasza [cultural_opinion|e] wobec [target_location.GetDominantCulture.GetName] się pogorszy"
 seven_cities.16.historical_info: "Zwyczajową metodą Hernanda de Soto na przemierzanie południowego wschodu było pojmanie na miejscu lokalnego kacyka, czyli naczelnego wodza, i przetrzymywanie go jako zakładnika, by zapewnić sobie żywność, tragarzy i przewodników na kolejny etap marszu. Pojmanego władcę wypuszczano lub wymieniano na granicy jego terytorium na sąsiedniego wodza, po czym proces powtarzano. Taktyka ta sprawdzała się na krótką metę, zostawiając za kolumną ślad złamanych wodzostw, roztrzaskanych sojuszy i trwałej nienawiści. Zależała ona też od missisipijskiej struktury silnych, pojedynczych wodzów, i zawodziła dotkliwie wszędzie tam, gdzie władza była bardziej rozproszona."
 seven_cities.17.title: "Wieści z wybrzeża"
 seven_cities.17.desc: "Ludzie z wybrzeża wypływają nam na spotkanie, zanim jeszcze kotwica dotknie dna, a po południu handlują z nami rybami i świeżymi owocami, wymieniając przy tym plotki szybciej niż towary. Widać, że robili to już nieraz. Za nóż albo kawałek płótna chętnie opowiedzą nam, co kryje się za linią drzew, wskazując wciąż w głąb lądu i dalej. Czy prowadzą nas ku prawdzie, czy jedynie ku swoim sąsiadom, tego z plaży nie sposób odgadnąć."
 seven_cities.17.a: "Wymienić towary za wieści o tym, co leży w głębi lądu."
 seven_cities.17.b: "Odnotować kotwicowisko i dołączyć do marszu."
 seven_cities.17.b.tt: "#italic Odnotowujemy kotwicowisko na naszych mapach i dołączamy do marszu, nie targując się o plotki#!"
 the_shore_folk_point_the_way: "#Y Ludzie z wybrzeża wskazują nam wyraźną drogę ku temu, czego szukamy#!"
 the_shore_market_yields_goods: "#Y Ożywiony handel na piasku napełnia nasze ładownie miejscowymi towarami#!"
 the_shore_folk_send_us_at_their_rivals: "#Y Ich wskazówki wodzą nas w kółko ku jakiejś rywalizującej wiosce#!"
 seven_cities.17.historical_info: "Ludy przybrzeżne były zazwyczaj pierwszymi mieszkańcami Ameryki, jakich napotykała każda wyprawa, i to one stawały się pierwszym źródłem wiedzy o wszystkim, co leżało w głębi lądu. Kontakty Verrazzana i Cartiera wzdłuż wybrzeża północnego Atlantyku, karaibskie lądowania pierwszych hiszpańskich wypraw oraz spotkania Portugalczyków na wybrzeżu Brazylii przebiegały według tego samego schematu: ostrożny handel, wzajemne badanie się i strumień geograficznych plotek płynący od wybrzeża ku wnętrzu lądu. Społeczności przybrzeżne często zachęcały przybyszów, by ruszali dalej w głąb lądu — zarówno po to, by się ich pozbyć, jak i by skierować ich żądania przeciw rywalom. To, co wybrzeże opowiadało o wnętrzu lądu, było więc przesiane przez własne interesy wybrzeża, zanim dotarło do europejskiego ucha."
 seven_cities.18.title: "Przystań ratunku"
 seven_cities.18.desc: "Port jest wszystkim, o co mogłaby się modlić wyczerpana wyprawa. Jest głęboki i dobrze osłonięty, a słodka woda spływa aż do plaży na tyle szerokiej, by można było wyciągnąć na nią statki i oczyścić ich kadłuby z gnilizny. Załogi potrzebują odpoczynku równie mocno, jak deski potrzebują naprawy. Lecz flota wyciągnięta na plażę to flota, która donikąd nie płynie, a bezczynni ludzie w obcym kraju mają talent do wpadania w kłopoty. [target_leader.GetName] waży, ile dni kosztować będzie porządny remont, przeciwstawiając to stanowi statków i nastrojom załóg."
 seven_cities.18.a: "Wyciągnij kadłuby na brzeg i porządnie się zaopatrz."
 seven_cities.18.b: "Odpocząć jedną noc i ruszyć dalej."
 seven_cities.18.b.tt: "#italic Dajemy załogom jedną noc na lądzie, po czym wypływamy w morze, zanim statki zdążą zapuścić korzenie#!"
 the_refit_goes_smoothly: "#Y Remont przebiega bez zakłóceń, a statki lepiej się sprawdzają#!"
 a_wreck_yields_salvage: "#Y Załogi obdzierają wrak gnijący na płyciźnie ze wszystkiego, co się da z niego uratować#!"
 the_crew_falls_to_brawling: "#Y Bezczynne na lądzie załogi wdają się w bójki, a przywracanie porządku kosztuje cenne dni#!"
 seven_cities.18.historical_info: "Osłonięte przystanie były niezbędne dla każdej wyprawy, która choćby częściowo podróżowała drogą morską – dawały miejsce, by położyć statek na burcie i naprawić kadłub, uzupełnić zapasy wody i drewna na opał oraz dać wytchnienie załogom wyczerpanym rejsem. Flota Magellana zimowała przez pięć miesięcy w Puerto San Julián na wybrzeżu Patagonii, gdzie wymuszony postój doprowadził też do buntu, który stłumił z wielkim okrucieństwem. Odkrywcy często spędzali więcej czasu na remontach w takich zatokach niż pod żaglami, a dobra przystań z przyjaźnie lub obojętnie nastawioną ludnością miejscową mogła zadecydować, czy wyprawa będzie kontynuowana, czy się rozpadnie. Wybór miejsca postoju bywał równie doniosły, co wybór kierunku dalszej drogi."
 seven_cities.20.title: "Ta kraina nas nie wyżywi"
 seven_cities.20.desc: "Kraina, którą przemierzamy, jest bardziej sucha i pusta, niż zapewniano nas przed wymarszem. Zwierzęta juczne zaczynają padać. Ludzie od dziesięciu dni żyją na połowie racji. Okoliczne wioski ukryły swoje zapasy lub je spaliły. Świeżą wodę znajdujemy tylko w dwóch na sześć mijanych dolin. [target_leader.GetName] zwołuje oficerów w cieniu ciernistego drzewa i pyta, jak długo jeszcze zdołają iść bez uzupełnienia zaopatrzenia."
 seven_cities.20.a: "Kupić zapasy za każdą cenę."
 seven_cities.20.b: "Zatrzymać się i dać ludziom odpocząć."
 seven_cities.20.historical_info: "Zaopatrzenie było chronicznym ograniczeniem eksploracji w głębi obu Ameryk. Armia Corteza była żywiona głównie dzięki politycznemu załamaniu władzy azteckiej, które pozwoliło Tlaxcalanom i innym sojusznikom go zaopatrywać. Kolumna Coronado zmierzająca na południowy zachód nie miała podobnego wsparcia i stopniowo głodowała, posuwając się na północ. Ten sam schemat powtarzał się od Florydy po Patagonię: wyprawa, która nie potrafiła kupić ani zdobyć żywności w kraju, przez który przechodziła, rozpływała się po drodze, bez względu na to, jakie złoto czekało dalej."
 seven_cities.21.title: "Zasadzka w wąwozie"
 seven_cities.21.desc: "Oddział wmaszerował w wąski przesmyk między dwiema wapiennymi ścianami, a tubylcy zamknęli drogę za nim. Strzały z góry, wojownicy z kamiennymi maczugami na dnie wąwozu, rozpierzchający się tabor juczny. Ludzie robią to, co ludzie w takim położeniu robili zawsze – zwierają szyki jeżem i stają plecami do skały. [target_leader.GetName] naradza się z sierżantami. Wybór stoi między przebiciem się przez wąwóz siłą, kosztem strat, a wycofaniem się tą samą drogą i szukaniem innego przejścia."
 seven_cities.21.a: "Przebić się przez wąwóz stalą i ogniem."
 seven_cities.21.b: "Wycofać się i poszukać innej drogi."
 seven_cities.21.historical_info: "Tubylcza taktyka zasadzek na terenie łatwym do obrony — wąskich kanionach, górskich przełęczach, leśnych szlakach — była najskuteczniejszą formą oporu wobec wczesnych kolonialnych wypraw. Hiszpańskie zbroje, broń palna i konie dawały decydującą przewagę na otwartym terenie, lecz traciły znaczenie w ciasnym, zamkniętym terenie. Mniej więcej połowa marszów Coronado na południowym zachodzie stanowiła wymuszone objazdy wokół terytoriów, których jego kolumna nie mogła bezpiecznie przekroczyć, a ten sam schemat sprawił, że przed XVIII wiekiem długi szereg francuskich i angielskich wypraw w głąb Ameryki Północnej zakończył się niepowodzeniem."
 seven_cities.22.title: "Starożytna ruina"
 seven_cities.22.desc: "Szlak wspina się na grzbiet i roztacza widok na to, co niegdyś było miastem. Mury są kamienne, dachy w większości zapadnięte, ulice zarośnięte drzewami sprzed wieku. Nie ma tu ludzi. Nikogo tu nie było od dawna. Zwiadowcy krążą wokół w bezpiecznej odległości, kronikarz pracuje nad szkicem, a ksiądz zastanawia się, czy wejść do środka, gdyż wiadomo, że umarłe miasta potrafią sprowadzać chorobę na tych, którzy je zbezczeszczą. [target_leader.GetName] daje rysownikowi godzinę."
 seven_cities.22.a: "Skatalogować ruiny, zanim ruszymy dalej."
 seven_cities.22.historical_info: "Ameryka sprzed Kolumba pełna była opuszczonych osad: kopcowych ośrodków kultury missisipijskiej na południowym wschodzie, wielkich domów Pueblo na południowym zachodzie, samego Chaco, basenu Tiwanaku w Andach, miast Majów na południowym Jukatanie. Europejscy odkrywcy XVI wieku, przemierzając te krainy, regularnie natykali się na kamienne budowle, tarasy rolnicze i ośrodki ceremonialne porzucone już wiek lub więcej wcześniej. Uporczywa europejska teoria, jakoby te ruiny musiały być dziełem zaginionej ludności europejskiej lub śródziemnomorskiej — Walijczyków, Fenicjan, Zaginionych Plemion Izraela — krążyła już w obiegu od lat 40. XVI wieku i w niektórych kręgach przetrwała aż do XX stulecia."
 seven_cities.30.title: "Trop się urywa"
 seven_cities.30.desc: "Kolumna dotarła do miejsca spotkania, które przewodnicy opisywali jako bramę do krainy, po którą nas wysłano. Żadnej bramy tu nie ma. Przewodnicy albo skłamali, albo sami dali się zwieść własnym złudzeniom; przegląd okolicznych wzgórz nie ukazuje ani miasta, ani dymu, ani drogi, żadnego znaku, że ktokolwiek tu bywał za pamięci żyjących. [target_leader.GetName] pisze do korony z prośbą o instrukcje, po czym miota list, wiedząc, że nim dotrze on do portu, kolumna i tak podejmie własną decyzję. Są dwie możliwości: iść dalej w głąb tej krainy, licząc na to, że miasto leży o dolinę dalej; albo zawrócić kolumnę i wracać do domu z tym, co już mamy."
 seven_cities.30.a: "Iść dalej w stronę miasta, mimo wszystko."
 seven_cities.30.b: "Zawrócić i uczciwie zdać sprawę."
 seven_cities.30.historical_info: "Typowym końcem nieudanych wypraw nie była dramatyczna rzeź, lecz powolne wygasanie: kolumna z coraz mniejszym zaopatrzeniem, tracąca zwiadowców na choroby i dezercję, odkrywająca, że każdy obiecany punkt orientacyjny był bądź nieporozumieniem, bądź kłamstwem, aż ocaleli oficerowie zawracali ludzi i wiedli ich do domu przez tereny, o których wiedzieli już, że są puste. Wyprawa Coronado, wyprawa Cabrilla, wyprawa De Soto, wyprawa Aguirre w dół Amazonki — wszystkie podążały tą samą krzywą, w takim czy innym stopniu. Udane wyprawy o podobnych ambicjach zdarzały się na tyle rzadko, by pamiętano o nich przez stulecia."
 may_bring_us_closer_and_fill_our_holds_tt: "Może to przybliżyć nas do odkrycia tego, czego szukamy, i napełnić nasze ładownie miejscowymi towarami"
 seven_cities.16.c.tt: "#italic Zostawiamy wodza w spokoju i ruszamy dalej, nie biorąc ani zakładników, ani tragarzy#!"
