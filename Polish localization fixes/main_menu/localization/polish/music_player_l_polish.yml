 Bjorn_Bjerknaes_Jacobsen: "Bjørn Bjerknæs-Jacobsen (flugelhorn)"
 Dan_Cecil_Hill: "Dan Cecil Hill (flety)"
 Dan_Cecil_Hill_facts: "Dan Cecil Hill (Naród Cayuga, Klan Czapli) jest artystą i muzykiem Haudenosaunee (Irokezów), specjalizującym się w tradycyjnym rdzennym płatnerstwie srebrniczym oraz wyrobie fletów. Jako artysta, wykonawca i przywódca kulturowy przez większość swojego życia dążył do zachowania i przekazywania wszystkich aspektów historii swojego ludu, sięgającej czasów sprzed kolonizacji USA i jeszcze wcześniejszych."
 Dietrich_Buxtehude: "Dietrich Buxtehude (1637-1707)"
 Dietrich_Buxtehude_facts: "Urodzony jako Dietrich Hansen Buxtehude w Helsingborgu w prowincji Skania w 1637 roku. Buxtehude uznawany jest za jednego z najważniejszych kompozytorów XVII wieku i wywarł ogromny wpływ na późniejszych twórców, takich jak Bach i Haendel."
 Dohyo_Sol: "Dohyo Sol (lutnia)"
 Emelie_Roos: "Emelie Roos (flet prosty)"
 Emelie_Roos_and_Daniel_Burstedt: "Emelie Roos (flet prosty), Daniel Burstedt (rożek angielski)"
 Emelie_Roos_and_Dohyo_Sol_and_Samuel_Runsteen: "Emelie Roos (flet prosty), Dohyo Sol (lutnia), Samuel Runsteen (viola da gamba)"
 Emelie_Roos_and_Samuel_Runsteen: "Emelie Roos (flet prosty), Samuel Runsteen (viola da gamba)"
 Feras_Charestan: "Feras Charestan (kanun)"
 Feras_Charestan_and_Ilona_Danho: "$Feras_Charestan$, $Ilona_Danho$"
 Feras_Charestan_facts: "Feras Charestan pochodzi z miasta Al-Hasakah w północno-wschodniej Syrii i studiował grę na kanunie w Wyższym Instytucie Muzycznym w Damaszku."
 Gabriel_Asaad: "Gabriel Asaad (1907-1997)"
 Hakan_Glante: "Håkan Glänte"
 Hakan_Glante_and_Bach: "Håkan Glänte, J.S. Bach"
 Ilona_Danho: "Ilona Danho (wokal)"
 Jacob_Regnart: "Jacob Regnart (lata 40. XVI w.-1599)"
 Jacob_Regnart_facts: "Regnart to flamandzki kompozytor epoki renesansu, urodzony w Douai, tworzący zarówno muzykę sakralną, jak i świecką. Przez całe życie działał w Austrii i Czechach, pełniąc między innymi funkcję kapelmistrza na dworze arcyksięcia Ferdynanda w Innsbrucku w latach 80. XVI wieku."
 Joachim_Neander: "Joachim Neander (1650-1680)"
 Joachim_Neander_facts: "Urodzony w Bremie Joachim Neander był reformowanym (kalwińskim) autorem pieśni religijnych, teologiem i nauczycielem. Uważany jest za najwybitniejszego twórcę pieśni Kościoła reformowanego, autora około 60 hymnów."
