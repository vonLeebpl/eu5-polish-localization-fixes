 Martin_Ostergren: "Martin Östergren (organy)"
 Martin_Rinckart: "Martin Rinckart (1586-1649)"
 Martin_Rinckart_facts: "Martin Rinckart był luterańskim duchownym i autorem pieśni religijnych, pełniącym funkcję archidiakona w Eilenburgu w Saksonii Północnej, gdzie się urodził i zmarł."
 MusicPlayer_01_Overture_I_Genesis: "01 - Uwertura I Geneza"
 MusicPlayer_01_Overture_I_Genesis_flavour: "„Świat się budzi, a światło słońca odsłania jego oblicze kawałek po kawałku."
 MusicPlayer_02_Overture_II_The_Odyssey: "02 - Uwertura II Odyseja"
 MusicPlayer_02_Overture_II_The_Odyssey_flavour: "'Uwertura naszej opowieści, w której poznajemy jej charakter i motywy przewodnie.'"
 MusicPlayer_03_Royal_Court_Invitation: "03 - Zaproszenie na dwór królewski"
 MusicPlayer_03_Royal_Court_Invitation_flavour: "Klawesyn, słyszany w tym utworze, to instrument klawiszowy powszechny w muzyce renesansu i baroku. Dźwięk powstaje poprzez mechaniczne szarpanie strun rozpiętych na płycie rezonansowej – naciśnięcie klawisza porusza piórkiem, które szarpie pojedynczą strunę."
 MusicPlayer_04_In_Your_Honor: "04 - Na twoją cześć"
 MusicPlayer_04_In_Your_Honor_flavour: "Rozległy utwór przywodzący na myśl zielone pastwiska oraz zachwyt nad Bogiem i naturą."
 MusicPlayer_05_The_Rise_of_an_Empire: "05 - Wzrost imperium"
 MusicPlayer_05_The_Rise_of_an_Empire_flavour: "Otwierając się głównym motywem Europa Universalis V, ta kompozycja stanowi dynamiczne odzwierciedlenie głównej emocji tego doświadczenia."
 MusicPlayer_06_Pain_is_Salvation: "06 - Ból jest zbawieniem"
 MusicPlayer_06_Pain_is_Salvation_flavour: "Tekst łączy angielski, staroniemiecki i łacinę, mówiąc o cierpieniu na drodze ku zbawieniu."
 MusicPlayer_07_For_the_Lost_Ones: "07 - Dla utraconych"
 MusicPlayer_07_For_the_Lost_Ones_flavour: "Żałobna i falująca kompozycja, nawiązująca do motywów i tematów z innych utworów w Europa Universalis V."
 MusicPlayer_08_No_Fear_No_Mercy: "08 - Bez strachu, bez litości"
 MusicPlayer_08_No_Fear_No_Mercy_flavour: "Triumfalna kompozycja, przywodząca na myśl ciszę przed bitwą i bicie serc walczących w oczekiwaniu na starcie."
 MusicPlayer_09_Libera_me_Domine: "09 - Libera me Domine"
 MusicPlayer_09_Libera_me_Domine_flavour: "Ta kompozycja łączy teksty „Pie Jesu” oraz „Libera me”, powszechnie wykorzystywane w muzyce jako część mszy żałobnej w Kościele katolickim. Proszą one, aby zmarli dostąpili miłosierdzia Jezusa, spoczynku oraz wybawienia w dniu sądu ostatecznego."
 MusicPlayer_10_Gloria_Patri: "10 - Gloria Patri"
 MusicPlayer_10_Gloria_Patri_flavour: "Wokalna wariacja na motywach Suity wiolonczelowej nr 1 G-dur Bacha, BWV 1007: I. Preludium."
 MusicPlayer_11_Maiden_Voyage: "11 - Dziewiczy rejs"
 MusicPlayer_11_Maiden_Voyage_flavour: "Kompozycja w rytmie tanecznym, jak kołysanie fal podczas wypłynięcia na nieznane morza."
 MusicPlayer_12_Jester_Speaks_the_Truth: "12 - Błazen mówi prawdę"
 MusicPlayer_12_Jester_Speaks_the_Truth_flavour: "Kompozycja inspirowana muzyką wczesnego renesansu, oparta na wariacji głównego motywu melodycznego muzyki z Europa Universalis V."
 MusicPlayer_13_Battle_of_Lutzen: "13 - Bitwa pod Lützen"
 MusicPlayer_13_Battle_of_Lutzen_flavour: "Bitwa pod Lützen została stoczona 16 listopada 1632 roku przez armię szwedzką, wspieraną przez oddziały z Saksonii i Hesji-Kassel, przeciwko armii cesarskiej Świętego Cesarstwa Rzymskiego. Jest to jedna z najważniejszych bitew wojny trzydziestoletniej. Po śmierci króla Szwecji Gustawa Adolfa podczas tej bitwy powstała Liga Heilbrońska."
 MusicPlayer_14_Lux_aeterna: "14 - Lux Aeterna"
 MusicPlayer_14_Lux_aeterna_flavour: "Lux aeterna to tekst często wykorzystywany w muzyce jako część mszy żałobnej w Kościele katolickim. Mówi o łasce Bożej i Jego wiecznym świetle, które oświeca zmarłych."
 MusicPlayer_15_A_Bargain_with_Beelzebub: "15 - Pakt z Belzebubem"
 MusicPlayer_15_A_Bargain_with_Beelzebub_flavour: "Religia i wojna, i wojny o religię. Pobożność splatająca się z żądzą krwi. Przedstawione tu stulecia to wieki ostrych kontrastów przetykanych odcieniami szarości."
 MusicPlayer_16_The_Path_to_Potsdam: "16 - Droga do Poczdamu"
 MusicPlayer_16_The_Path_to_Potsdam_flavour: "Miasto Poczdam straciło niemal połowę swojej ludności podczas wojny trzydziestoletniej."
 MusicPlayer_17_The_Coronation_of_a_Naked_Emperor: "17 - Koronacja nagiego cesarza"
 MusicPlayer_17_The_Coronation_of_a_Naked_Emperor_flavour: "Utwór w świeckim stylu barokowym, na instrumenty smyczkowe i klawesyn."
 MusicPlayer_18_Falalalan: "18 - Falalalan"
 MusicPlayer_18_Falalalan_flavour: "Historia zawsze jest obecna w muzyce, czasem na więcej niż jeden sposób."
 MusicPlayer_19_O_quam_gloriosum: "19 - O quam gloriosum"
 MusicPlayer_19_O_quam_gloriosum_flavour: "Ta kompozycja opiera się na tekście napisanym przez Tomása Luisa de Victorię (1548-1611) do jego „Missa O quam gloriosum”."
 MusicPlayer_20_Thirty_Years: "20 - Trzydzieści lat"
 MusicPlayer_20_Thirty_Years_flavour: "Wojna trzydziestoletnia (1618-1648) to jeden z najbardziej wyniszczających konfliktów w historii Europy, w wyniku którego zginęło od 4,5 do 8 milionów ludzi. Wywołała ją XVI-wieczna reformacja, a dodatkowo podsycały ją zewnętrzne konflikty interesów i dawne rywalizacje."
 MusicPlayer_21_Conquer_or_Fall: "21 - Zwyciężyć albo upaść"
 MusicPlayer_21_Conquer_or_Fall_flavour: "Epicka kompozycja z udziałem rogów, instrumentów smyczkowych i chóru. Prezentuje inspirującą wariację jednego z głównych motywów melodycznych muzyki z Europa Universalis V."
 MusicPlayer_22_A_Message_to_The_King: "22 - Wiadomość dla króla"
 MusicPlayer_22_A_Message_to_The_King_flavour: "Kompozycja pełna pośpiechu i żaru, oddająca poczucie, że pośpiech ma najwyższą ważność."
 MusicPlayer_23_The_Flagellant: "23 - Flagelant"
 MusicPlayer_23_The_Flagellant_flavour: "Flagelacja to biczowanie samego siebie jako pokuta za grzechy i uczestnictwo w Męce Pańskiej, obecna w wielu tradycjach chrześcijańskich. Flagelantyzm był XIV-wiecznym ruchem w zachodnim chrześcijaństwie, powstałym jako odpowiedź na wojny, głód i zarazę."
 MusicPlayer_24_The_Black_Death: "24 - Czarna śmierć"
 MusicPlayer_24_The_Black_Death_flavour: "Zdziesiątkowawszy populację XIV-wiecznej Europy o połowę, czarna śmierć jest jedną z najbardziej śmiercionośnych pandemii w historii ludzkości."
 MusicPlayer_25_The_Noble_Art_of_Diplomacy: "25 - Szlachetna sztuka dyplomacji"
 MusicPlayer_25_The_Noble_Art_of_Diplomacy_flavour: "Rodzina lutni ma długą historię w wielu regionach świata i epokach, a europejska lutnia jest dominującym instrumentem w renesansowej muzyce świeckiej Europy."
 MusicPlayer_26_Peace_of_Westphalia: "26 - Pokój westfalski"
 MusicPlayer_26_Peace_of_Westphalia_flavour: "Pokój westfalski to zbiorowa nazwa dwóch odrębnych traktatów pokojowych podpisanych w Osnabrück i Münsterze w 1648 roku, które zakończyły Wojnę Trzydzestoletnią i przyniosły pokój Świętemu Cesarstwu Rzymskiemu."
 MusicPlayer_language_Galician_Portuguese: "Galicyjsko-portugalski"
 MusicPlayer_language_Gnawa: "Język gnawa"
 MusicPlayer_language_Middle_High_German: "Średnio-wysoko-niemiecki"
 MusicPlayer_language_Old_Castilian: "Starokastylijski"
 MusicPlayer_sol_ashanti_Aho: "Ashanti - Aho"
 MusicPlayer_sol_ashanti_Aho_flavour: "Nana Osei Twum Barima jest mistrzem wszystkich instrumentów wykorzystywanych w muzyce i ceremoniach Ashanti, w tym seperewy, tradycyjnych rogów oraz instrumentów perkusyjnych. Jest również następcą cesarza i twórcą Królestwa Ashanti. Tytuł utworu można przetłumaczyć jako „Pieśń wojenna”."
 MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko: "Ashanti - Asanteman Yenim Ko"
 MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko_flavour: "Początek słów tej pieśni można w przybliżeniu przetłumaczyć jako „Aszantowie wiedzą, jak walczyć, lecz nie wiedzą, jak uciekać', a dalej głosi ona wyższość wojowników Aszantów."
 MusicPlayer_sol_ashanti_Seperewa_Akasa: "Ashanti - Seperewa Akasa"
 MusicPlayer_sol_ashanti_Seperewa_Akasa_flavour: "Tytuł utworu tłumaczy się jako „Seperewa przemówiła”. Seperewa to instrument z rodziny harfolutni, ze skrzynkowym rezonatorem i 10-14 strunami przymocowanymi do gryfu poprzez nawinięcie ich bezpośrednio na niego. Pochodzi z Afryki Zachodniej i mówi się, że król Osei Tutu, założyciel imperium Aszanti, tak bardzo go uwielbiał, że kazał wykonać jego złotą replikę do swoich królewskich regaliów."
 MusicPlayer_sol_aztec_Iyac: "Aztec - Iyac"
 MusicPlayer_sol_aztec_Iyac_flavour: "$Pierre_Harmon_facts$. Tytuł utworu tłumaczy się jako „Tradycyjny wojownik”."
