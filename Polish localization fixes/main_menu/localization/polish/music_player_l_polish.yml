 MusicPlayer_sol_deccan_raga_keeravani: "Dekkan - Raga Keeravani"
 MusicPlayer_sol_deccan_raga_keeravani_flavour: "Wykonana w klasycznym, trzyczęściowym stylu karnatyckim. Tytuł utworu oznacza „Raga oddania”"
 MusicPlayer_sol_deccan_raga_nattaikurunji: "Dekkan - Raga Nattaikurunji"
 MusicPlayer_sol_deccan_raga_nattaikurunji_flavour: "Wykonana w klasycznym, trzyczęściowym stylu karnatyckim. Tytuł utworu oznacza „Raga romantyzmu”"
 MusicPlayer_sol_deccan_raga_saraswathi: "Dekkan - Raga Saraswathi"
 MusicPlayer_sol_deccan_raga_saraswathi_flavour: "Wykonana w klasycznym, trzyczęściowym stylu karnatyckim. Tytuł utworu tłumaczy się jako „Raga mistycyzmu”."
 MusicPlayer_sol_iroquois_Akwesasne: "Irokezi – Akwesasne"
 MusicPlayer_sol_iroquois_Akwesasne_flavour: "$Dan_Cecil_Hill_facts$ Tytuł utworu tłumaczy się jako „Ziemia, gdzie bębni kuropatwa”."
 MusicPlayer_sol_iroquois_Haundenosaunee: "Irokezi – Haundenosaunee"
 MusicPlayer_sol_iroquois_Haundenosaunee_flavour: "$Dan_Cecil_Hill_facts$ Tytuł utworu tłumaczy się jako „Irokezi” – tak w języku angielskim nazywa się lud Haundenosaunee."
