 Pierre_Harmon_facts: "Pierre Harmon to znany flecista i uznany ekspert w dziedzinie muzyki prekolumbijskiej. Znany na całym świecie ze swoich cennych badań muzykologicznych, zwłaszcza nad muzyką aztecką, posiada również jedną z największych kolekcji starożytnych instrumentów, których opanowaniu poświęcił całą swoją karierę."
 Pipa_facts: "Chińska pipa to instrument strunowy o gruszkowatym kształcie, na którym gra się paznokciami lub, historycznie, plektronem. Jej korzenie sięgają niemal dwóch tysięcy lat wstecz i jest to jeden z najpopularniejszych chińskich instrumentów."
 Qanun_facts: "Kanun to instrument strunowy z rodziny cytr, prawdopodobnie wywodzący się ze starożytnej Mezopotamii, choć jego pochodzenie nie jest pewne."
