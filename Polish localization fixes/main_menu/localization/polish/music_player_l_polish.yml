 MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos: "Chińska - Zasadzka z dziesięciu stron - Pełny epos"
 MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos_flavour: "Arcydzieło chińskiej muzyki klasycznej, zazwyczaj wykonywane przez wirtuozów. Utrzymane w stylu wojennym, przedstawia bitwę pod Gaixia w 202 r. p.n.e., w której generał Xiang Yu został pokonany przez Liu Banga."
