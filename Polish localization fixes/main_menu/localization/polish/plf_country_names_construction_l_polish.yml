 # --- 2. Uniwersalne Sito Przymiotnikowe (Zabezpieczenie Marchii i Kolonii w .yml) ---
 # Pełna ochrona fleksyjna: Marchie dostają "-ka", a cała reszta dynamicznego świata oraz Polska/Prusy dostają "-kie".
 # Zero zagnieżdżeń, zero mega-zmiennych wewnątrz funkcji – parser Jomini przeczyta to w locie.
 country_name_construction_pol_euro_adjective_monarchy: "[AddTextIf(And(EqualTo_string('Elektorat', '$RANK$'), Not(EqualTo_string('$ADJ$','$NAME$'))), '$PREFIX$ $RANK$ $ADJ$ki')][AddTextIf(And(EqualTo_string('Marchia', '$RANK$'), Not(EqualTo_string('$ADJ$','$NAME$'))), '$PREFIX$ $RANK$ $ADJ$ka')][AddTextIf(And(And(Not(EqualTo_string('Marchia', '$RANK$')), Not(EqualTo_string('Elektorat', '$RANK$'))), Not(EqualTo_string('$ADJ$','$NAME$'))), '$PREFIX$ $RANK$ $ADJ$kie')][AddTextIf(EqualTo_string('$ADJ$','$NAME$'), '$PREFIX$ $RANK$ $NAME$')]"
