l_polish:
 # --- Dedykowany, oryginalny klucz dla Unii Dynastycznych (Koron na szczycie pliku .txt) ---
 country_name_construction_crown: "[AddTextIf(EqualTo_string('Polska', '$NAME$'), '$PREFIX$ $RANK$ Polska')][AddTextIf(EqualTo_string('Kastylia', '$NAME$'), '$PREFIX$ $CAS_LONG$')][AddTextIf(EqualTo_string('Aragon', '$NAME$'), '$PREFIX$ $ARA_LONG$')][AddTextIf(EqualTo_string('Czechy', '$NAME$'), '$PREFIX$ $RANK$ Czech')]"
 country_name_construction_crown_map: "$country_name_construction_crown$"
 country_name_construction_prefix_rank_of_name_but_map_is_just_prefix_rank: "[AddTextIf(EqualTo_string('$NAME$','Wielka Brytania'), '$NAME$')][AddTextIf(EqualTo_string('$NAME$', 'Egipt'), '$PREFIX$ $RANK$ Egipski')][AddTextIf(Or(EqualTo_string('$NAME$', 'Viennois'),EqualTo_string('$NAME$', 'Ren')), '$RANK$ $NAME$')]"
