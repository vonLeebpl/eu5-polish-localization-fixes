l_polish:
 western_schism.1.title: "Schizma w Kościele katolickim"
 western_schism.1.desc: "[ShowReligionName('catholic')] ulega schizmie, a $curia$ podzieliła się na skłócone frakcje!\n\nChoć kościół już wcześniej był podzielony, ta schizma wydaje się inna. Po tym, jak odeszła ostatnia głowa kościoła – [GetInternationalOrganization('catholic_church').GetLeaderTitle] – frakcja #L [ShowCultureGroupName('italian_group')|l]kich#! kardynałów stara się przejąć kontrolę nad tronem piotrowym – duchowni ci pragnęli tego, odkąd papiestwo dostało się pod władzę #L [ShowCultureGroupName('french_group')|l]ką#!. Wroga im frakcja #L [ShowCultureGroupNameWithNoTooltip('french_group')]ka#! walczy o to, by [GetInternationalOrganization('catholic_church').GetLeaderTitle] i powiązane tytuły nadal były pod jej kontrolą. Oczekiwań obu frakcji nie da się pogodzić, a #L [ShowReligionAdjectiveWithNoTooltip('catholic')|l]ki#! świat jest coraz bardziej podzielony, przez co bogobojni #L [ShowReligionAdjectiveWithNoTooltip('catholic')]y#!, nad którymi czuwa [GetInternationalOrganization('catholic_church').GetName], nie mają teraz swoich pasterzy. Dopóki podział będzie trwał, muszą sobie radzić bez wskazówek dotychczasowej władzy i samodzielnie decydować, kto jest prawdziwym wykonawcą boskiej woli."
 western_schism.1.a: "Niedobrze."
 western_schism.3.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] są niezadowoleni ze schizmy"
 western_schism.3.desc: "Nadal nie zajęliśmy stanowiska w kwestii schizmy. Nasi kardynałowie ponaglają nas, abyśmy oficjalnie zdecydowali, czy nasze poparcie otrzyma [target_schism_pope_cardinal.GetName], czy [target_schism_opponent_cardinal.GetName]."
 western_schism.3.a: "Nie spieszy nam się z decyzją..."
 western_schism.4.title: "[jan_hus.GetNameWithNoTooltip]"
 western_schism.4.desc: "[ROOT.GetCountry.GetCapital.GetArea.GetName], a przede wszystkim serce tego obszaru, zapłonęły ogniem herezji podsycanym potężnym wiatrem zmian. [jan_hus.GetName], charyzmatyczny [ShowCultureName('czech')|l]ki ksiądz i uczony, wystąpił przeciw zepsuciu, jakie toczy [GetInternationalOrganization('catholic_church').GetName]. Jego słowa padają na podatny grunt wśród ludu, a nowa wiara [ShowReligionAdjective('hussite')|l]ka zapuszcza korzenie.\n\n[jan_hus.GetNameWithNoTooltip] potępia bogactwo i nadużycia, jakich dopuszcza się [GetInternationalOrganization('catholic_church').GetNameWithNoTooltip], nawołując do prostoty i czystości wczesnych chrześcijan. Jego zwolennicy, zwani husytami, przyjmują jego nauki, a ich żarliwość rośnie z dnia na dzień. Ustalony ład się chwieje, gdyż [jan_hus.GetLastNameWithNoTooltip] swoimi słowami podważa autorytet, jakim cieszy się [GetInternationalOrganization('catholic_church').GetNameWithNoTooltip] oraz [GetInternationalOrganization('hre').GetName]."
 western_schism.4.historical_info: "Jan Hus, znany także jako Johannes Hus, teolog i filozof, był jednym z pierwszych reformatorów katolicyzmu. Był inspiracją dla husytyzmu i prekursorem luteranizmu. Urodził się w ubogiej rodzinie, ale kształcił się na księdza, aby wyjść z biedy. Jako ksiądz sprzeciwiał się wielu aspektom Kościoła katolickiego w Czechach. Gdy Aleksander V został wybrany na papieża, ogłosił bullę papieską i zażądał nałożenia na niego ekskomuniki. Podczas soboru w Konstancji, gdy nastąpiło zakończenie wielkiej schizmy zachodniej, Jan Hus przedstawił swoje poglądy na Kościół, jednak został natychmiast aresztowany i osadzony w więzieniu. Odmówił wyrzeczenia się swoich poglądów i w dniu 16 lipca 1415 r. został spalony na stosie jako heretyk. Jego zwolennicy utworzyli nową religię i walczyli przeciw pięciu różnym wyprawom krzyżowym w ciągu kilku kolejnych dziesięcioleci. Husytyzm utrzymywał się w Czechach przez prawie dwa wieki."
 western_schism.4.a: "Jego nauki są interesujące..."
 western_schism.5.title: "Erozja wiary"
 western_schism.5.desc: "[ROOT.GetCountry.GetFlavorRank] doświadcza problemów ze stabilnością ze względu na zamęt wywołany przez konflikt na linii [target_schism_pope_cardinal.GetName]-[target_schism_opponent_cardinal.GetName]. Niepewność dotycząca przynależności Stolicy Apostolskiej wywołuje wątpliwości w kwestii odpowiedniego prowadzenia nabożeństw i powoli osłabia wiarę ludu."
 western_schism.5.a: "Będziemy modlić się o szybkie zakończenie tego konfliktu."
 western_schism.5.b: "Być może nasz lud powinien poszukać alternatyw."
 western_schism.6.title: "Konflikt na linii [opponent_support_location.GetNameWithNoTooltip]-[pope_support_location.GetNameWithNoTooltip]"
 western_schism.6.desc: "[opponent_support_location.GetName] i tamtejszy lud, którego zagorzałym poparciem cieszy się [target_schism_opponent_cardinal.GetName], starli się ostatnio z mieszkańcami obszaru [pope_support_location.GetName], których wybór stanowi raczej [target_schism_pope_cardinal.GetName]. Obydwie strony pragną teraz, aby [target_ruler.GetName] [Select_CString(target_ruler.IsFemale,'opowiedziała','opowiedział')] się jasno po jednej ze stron."
 western_schism.6.a: "[opponent_support_location.GetNameWithNoTooltip] to strona, która ma rację."
 western_schism.6.b: "[pope_support_location.GetNameWithNoTooltip] ma nasze poparcie."
 western_schism.6.c: "Niech sami rozwiążą swoje błahe problemy."
 western_schism_resolution_impact_positive.tt: "Wybrana strona zyska odrobinę wsparcia $western_schism$"
 western_schism_resolution_impact_negative.tt: "Wybrana strona straci odrobinę wsparcia $western_schism$"
 western_schism.7.title: "[ShowRegionNameWithNoTooltip('italy_region')]: rozkwit handlu"
 western_schism.7.desc: "Dzięki wysiłkom, jakie podejmuje [target_schism_pope_cardinal.GetName], handel w regionie [ShowRegionName('italy_region')] kwitnie. Nasi [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] są niezwykle zadowoleni z tego stanu rzeczy i bezpieczeństwa swoich interesów na tym obszarze."
 western_schism.7.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 italian_trade: "[ShowRegionNameWithNoTooltip('italy_region')] i nasze więzi z nimi"
 western_schism_8_10_common_string: "[GetSituationByKey('western_schism').GetName], a dokładniej pozycja, jaką zajęliśmy w tej kwestii, wywołała spore oburzenie w pewnych częściach kraju. [target_location.GetName] oraz tamtejszy lud zaczęli się nawet zbroić i żądają, abyśmy zamiast tego poparli frakcję, na czele której stoi"
 western_schism.8.title: "[target_schism_opponent_cardinal.GetNameWithNoTooltip]: poparcie społeczne"
 western_schism.8.desc: "$western_schism_8_10_common_string$ [target_schism_opponent_cardinal.GetName]."
 western_schism.8.a: "Nie ulegniemy takim żałosnym żądaniom."
 western_schism.8.b: "[target_schism_opponent_cardinal.GetNameWithNoTooltip] może być dla nas jednak najlepszym wyborem."
 western_schism.9.title: "[target_schism_opponent_cardinal.GetNameWithNoTooltip] nagradza lojalność"
 western_schism.9.desc: "[target_schism_opponent_cardinal.GetName] [Select_CString(target_schism_opponent_cardinal.IsFemale,'jedyna prawdziwa','jedyny prawdziwy')] [GetInternationalOrganization('catholic_church').GetLeaderTitle|l] [Select_CString(target_schism_opponent_cardinal.IsFemale,'nagrodziła','nagrodził')] naszą lojalność specjalnym grantem, który zapewni nam większe uprawnienia, jeśli chodzi o [GetInternationalOrganization('catholic_church').GetName]."
 western_schism.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 western_schism.10.title: "[target_schism_pope_cardinal.GetNameWithNoTooltip]: poparcie społeczne"
 western_schism.10.desc: "$western_schism_8_10_common_string$ [target_schism_pope_cardinal.GetName]."
 western_schism.10.a: "Niech spróbują."
 western_schism.10.b: "To słuszne słowa."
 western_schism_11_12_common_string: "[target_country.GetName] w trwającej walce o przywództwo, gdy [GetInternationalOrganization('catholic_church').GetName] potrzebuje lidera, a my otrzymaliśmy pochwałę od tego kraju! Wytrwałość [ROOT.GetCountry.Custom('C_DOP')] i silna wiara, którą okazujemy w tak niestabilnych czasach, zostały docenione.\n\nChociaż te słodkie słówka są oczywistą próbą przekonania nas do poparcia odpowiedniej kandydatury, nadal możemy czerpać korzyść z tej sytuacji, bez względu na to, czy otwarcie okażemy nasze wsparcie i wskażemy, że naszym kandydatem jest"
 western_schism_11_12_common_string_2: "czy też wykorzystamy pochwałę, by zadbać o nasze własne interesy, a wtedy [GetInternationalOrganization('catholic_church').GetNameWithNoTooltip] będzie po naszej stronie."
 western_schism.11.title: "Państwo [target_country.GetNameWithNoTooltip] pochwala nasze oddanie"
 western_schism.11.desc: "[target_schism_pope_cardinal.GetName] ma mocne poparcie państwa $western_schism_11_12_common_string$ [target_schism_pope_cardinal.GetNameWithNoTooltip], $western_schism_11_12_common_string_2$"
 western_schism.11.a: "[target_schism_pope_cardinal.GetNameWithNoTooltip] to [GetInternationalOrganization('catholic_church').GetLeaderTitle|l]!"
 western_schism.11.b: "Wykorzystajmy tę pochwałę w kościele."
 western_schism.12.desc: "[target_schism_opponent_cardinal.GetName] ma mocne poparcie państwa $western_schism_11_12_common_string$ [target_schism_opponent_cardinal.GetNameWithNoTooltip], $western_schism_11_12_common_string_2$"
 western_schism.12.a: "[target_schism_opponent_cardinal.GetNameWithNoTooltip] to [GetInternationalOrganization('catholic_church').GetLeaderTitle|l]!"
 western_schism_13_14_common_string: "w przeciwieństwie do reszty stanów. Ten wewnętrzny rozłam, z którym zmaga się [GetInternationalOrganization('catholic_church').GetName], grozi rozbiciem naszego kraju na wiele frakcji, jeśli nie będziemy działać ostrożnie."
 western_schism.13.title: "Wbrew wszelkim przeciwnościom"
 western_schism.13.desc: "[target_estate.GetName], dla których [ROOT.GetCountry.GetReligion.GetGodName] jest wyznacznikiem życiowej drogi, wspierają kardynała imieniem [target_schism_pope_cardinal.GetName], $western_schism_13_14_common_string$"
 western_schism.13.a: "[target_estate.GetNameWithNoTooltip] otrzymają nasze wsparcie."
 western_schism.13.b: "Poprzemy większość."
 western_schism.14.desc: "[target_estate.GetName], dla których [ROOT.GetCountry.GetReligion.GetGodName] jest wyznacznikiem życiowej drogi, wspierają kardynała imieniem [target_schism_opponent_cardinal.GetName], $western_schism_13_14_common_string$"
 western_schism.15.title: "Wędrowny kaznodzieja"
 western_schism.15.desc: "[ShowSituationName('western_schism')] wywołała erozję naszej wiary i głęboko nadszarpnęła zaufanie mieszkańców prowincji [unrest_location_scope.GetName]. Tę pustkę zaufania i stabilności wypełnia [target_character.GetName] kazaniami o herezji i oskarżeniami o korupcję. Chociaż twierdzi, że kieruje się prawdziwą wiarą #L [ROOT.GetCountry.GetReligion.GetAdjective|l][Select_CString(Or(EndsWith(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'k'),Or(EndsWith(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'n'),EndsWith(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'ł'))),'ą','ką')]#!, przemowy te zachęciły niektórych mieszkańców obszaru [unrest_location_scope.GetNameWithNoTooltip] do zainteresowania się groźnymi ideami. Musimy szybko działać, aby nie dopuścić do dalszego rozprzestrzeniania się tej herezji."
 western_schism.15.a: "Te pomysły nie są takie złe."
 western_schism.15.b: "[target_character.GetNameWithNoTooltip] nie może dalej działać."
 western_schism.1000.title: "Cena #italic obediencji#!"
 western_schism_action_event_tt: "Poprosimy jednego z kandydatów o pomoc finansową."
 western_schism.1001.desc: "[target.GetName] nagradza naszą lojalność w sposób, który przystoi tak ważnemu i prestiżowemu krajowi jak my. Dzięki naszemu wsparciu wszyscy z pewnością zaakceptują, że [target.GetNameWithNoTooltip] to naprawdę [GetInternationalOrganization('catholic_church').GetLeaderTitle|l]."
 western_schism.1001.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 western_schism.1002.desc: "[target.GetName] gardzi naszym wsparciem i odmawia traktowania nas z należytym szacunkiem. Ten skandaliczny afront nie może zostać bez odpowiedzi i powinniśmy poważnie rozważyć naszą współpracę, ponieważ najwyraźniej nie jesteśmy dostatecznie doceniani."
 western_schism.1002.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 western_schism.1100.title: "Fałszywe wsparcie [target_country.Custom('C_DOP')]"
 western_schism.1100.desc: "Nasze relacje z krajem [target_country.GetName] są napięte i ucierpiały jeszcze bardziej, odkąd trwa [ShowSituationName('western_schism')]. Chociaż [GetInternationalOrganization('catholic_church').GetName] nie jest pod naszym nieograniczonym wpływem, możemy wykorzystać posiadany autorytet, aby przeważyć szalę na naszą stronę."
 western_schism.1100.a: "Będziemy mieć wpływ, na jaki zasługujemy!"
 western_schism.1100.b: "Spróbujmy nie zaogniać stosunków."
 western_schism.1101.title: "Śmiertelna zniewaga"
 western_schism.1101.desc: "Moralnie zdeprawowani dyplomaci z [origin_country.Custom('C_DOP')] pracowali nad tym, aby pozbawić nas wpływów, przez co [GetInternationalOrganization('catholic_church').GetName] może wymknąć się nam spod kontroli. Ta zniewaga nie może ujść im płazem i powinniśmy potraktować to jako pretekst do pokazania im, gdzie ich miejsce."
 western_schism.1101.a: "[ROOT.GetCountry.Custom('common_string_we_must_do_something')]"
 western_schism.1200.title: "Kraj [target_country.GetNameWithNoTooltip] wzbudza podejrzenia"
 western_schism.1200.desc: "Trwająca [ShowSituationName('western_schism')] doprowadziła [GetInternationalOrganization('catholic_church').GetName] na skraj stabilności, a [Select_CString(GetInternationalOrganization('catholic_church').GetLeader.IsFemale,'fałszywa','fałszywy')] [GetInternationalOrganization('catholic_church').GetLeaderTitle|l] budzi nieufność wśród wiernych. Ostatnio [target_ruler.GetName] z [target_country.Custom('C_DOP')] [Select_CString(target_ruler.IsFemale,'zwrociła','zwrócił')] naszą uwagę incydentem dyplomatycznym, w wyniku którego możnaby pomyśleć, że jest [Select_CString(target_ruler.IsFemale,'wierna','wierny')] pretendentowi, a nie nam. Powinniśmy wysłać delegację, która wybada [Select_CString(target_ruler.IsFemale,'jej','jego')] intencje i upewni się, że podąża [Select_CString(target_character.IsFemale,'ona','on')] właściwą ścieżką."
 western_schism.1200.a: "Wyślijmy delegację do [target_country.Custom('C_DOP')]."
 western_schism.1200.b: "Mamy ważniejsze sprawy na głowie."
 western_schism.1201.title: "Delegacja papieska"
 western_schism.1201.desc: "[target_schism_pope_cardinal.GetName] przysyła do nas dyplomatę, a [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] go przyjmie. Chociaż nie jesteśmy jeszcze pewni, jaki jest rzekomy cel tej wizyty, ze względu na fakt, iż to [GetInternationalOrganization('catholic_church').GetLeaderTitle|l] wysyła tych emisariuszy, będą oczekiwać oficjalnego traktowania by sprawdzić, po której stronie stoimy podczas chaosu, jaki wywołała [ShowSituationName('western_schism')]. Chociaż nie możemy ich tak po prostu przepędzić, nie będziemy się wahać, by okazać naszą przynależność."
 western_schism.1201.a: "Oczywiście, że [target_schism_pope_cardinal.GetNameWithNoTooltip] to [GetInternationalOrganization('catholic_church').GetLeaderTitle|l]!"
 western_schism.1201.b: "[target_schism_opponent_cardinal.GetNameWithNoTooltip] może liczyć na naszą lojalność."
 western_schism.1300.title: "Zwołanie soboru"
 western_schism.1300.desc: "Dzięki naszej obecnie korzystnej pozycji w kurii zgromadziliśmy wystarczające poparcie, aby zwołać sobór w mieście [target_location.GetName]. Chociaż zapewne [GetInternationalOrganization('catholic_church').GetName] po części zakwestionuje legalność soboru, zostanie zaakceptowany przez naszych zwolenników, co pokaże zarówno naszą siłę, jak i poparcie większości kardynałów. [ShowSituationName('western_schism')|l] raczej się nie zakończy, ale pokażemy, że [GetInternationalOrganization('catholic_church').GetLeaderTitle] cieszy się autorytetem i zrobimy ważny krok w kierunku rozwiązania tego konfliktu na naszą korzyść."
 western_schism.1300.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 western_schism.1300.a.tt: "Każdy członek, którego wyznaniem jest [THIS.GetReligion.GetName], zmieni opinię na temat [ROOT.GetCountry.Custom('C_DOP')] o [ShowBiasValue('schism_called_council')|+=0]."
 western_schism.1301.title: "Sobór w mieście [target_location.GetNameWithNoTooltip]"
 western_schism.1301.desc: "Dyplomaci z [council_country.Custom('C_DOP')] przybyli na nasz dwór, prosząc, by nasi [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] przybyli na sobór w mieście [target_location.GetName]. Choć ich przeciwnicy kwestionują legalność zgromadzenia, może być to ważny krok, dzięki któremu zakończy się [ShowSituationName('western_schism')|l]."
 western_schism.1301.a: "Okażmy nasze wsparcie na soborze."
 western_schism.1301.b: "Musimy uznać legalność soboru."
 western_schism.1301.c: "Odrzucamy zuchwałość tych fałszywców."
 western_schism.2000.title: "Kościół katolicki ponownie zjednoczony!"
 western_schism.2000.desc: "Dzięki wysiłkom [winner_country.Custom('C_DOP')] podczas soboru kościół został na nowo zjednoczony i włada nim [GetInternationalOrganization('catholic_church').GetLeaderTitle|l]. [GetInternationalOrganization('catholic_church').GetName] pozostaje niezakłóconą jednością, chociaż [GetInternationalOrganization('catholic_church').GetLeaderTitle] nie cieszy się już takim autorytetem jak dawniej. Miejmy nadzieję, że nie zaszkodziło to naszej wierze na stałe, a z odrobiną szczęścia [target_character.GetName] będzie dobrym wyborem."
 western_schism.2000.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 western_schism.2100.title: "Nowa głowa Kościoła – [GetInternationalOrganization('catholic_church').GetLeaderTitle]"
 western_schism.2100.desc.common: "[ShowSituationName('western_schism')] była głównym tematem obrad. Dzięki naszym wysiłkom okazało się, że wysunięta przez nas kandydatura idealnie sprawdzi się jako [GetInternationalOrganization('catholic_church').GetLeaderTitle|l]. Choć niektórzy nadal trzymają stronę heretyckiego pozoranta, zebraliśmy przeważającą większość poparcia, dzięki czemu [ShowSituationName('western_schism')|l] się zakończy."
 western_schism.2100.desc.a: "$western_schism.2100.desc.common$\n\nDzięki zgromadzonemu poparciu łatwo wybierzemy odpowiednią kandydaturę spośród naszych szeregów i przywrócimy władzę papieską w wiecznym mieście [ShowLocationName('rome')]."
 western_schism.2100.desc.b: "$western_schism.2100.desc.common$\n\nDzięki naszym wpływom w kurii będziemy mogli zachować ustanowiony zwyczaj papiestwa w mieście [ShowLocationName('avignon')]."
 western_schism.2100.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 western_schism.20.title: "Dwaj biskupi, jedna diecezja"
 western_schism.20.desc: "Biskupstwo w naszym królestwie zawakowało. Ledwie stolica biskupia się zwolniła, a już dwóch mężczyzn wysunęło do niej roszczenia: jeden nosi pieczęć Rzymu, a drugi pieczęć konkurującego papieża. Każdy nałożył na drugiego #R ekskomunikę#! i każdy domaga się zostania uznanym. Tymczasem diecezja pozostaje bez przywódcy, jej kapłani są zdezorientowani, a wierni pytają [ROOT.GetCountry.GetGovernment.GetRuler.GetName|l], którego pasterza mają słuchać."
 western_schism.20.a: "Diecezja należy do mężczyzny z Rzymu."
 western_schism.20.b: "Diecezja należy do drugiego pretendenta."
 western_schism.20.c: "Niech się kłócą, a dochód będzie nasz."
 western_schism.21.title: "Wypowiedzenie posłuszeństwa"
 western_schism.21.desc: "Nasi juryści i mistrzowie szkół przedstawiają zuchwałe stanowisko: nie jesteśmy winni posłuszeństwa #Y żadnemu#! z pretendentów, dopóki obaj noszą papieską tiarę, więc [ROOT.GetCountry.GetGovernment.GetRuler.GetName] powinien je wstrzymać, aż chrześcijaństwo znów zostanie zjednoczone. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] są zszokowani, a uwolnieni spod papieskich danin skarbnicy po cichu świętują."
 western_schism.21.a: "Nie uznamy żadnego papieża, dopóki Kościół nie stanie się jednością."
 western_schism.21.b: "Pozostańmy lojalni Kościołowi."
 western_schism.22.title: "Rywalizujący poborcy annat"
 western_schism.22.desc: "Dwóch papieskich poborców podatkowych przybyło w tym samym tygodniu. Każdy miał list uwierzytelniający od swego pana i każdy żądał #Y annat#! z beneficjów w naszym królestwie: dochodu z pierwszego roku każdego urzędu kościelnego, który według nich należy się jedynemu prawdziwemu papieżowi. Mierzą się wzrokiem z odrazą po obu stronach naszego dworu i obaj chciwie popatrują na nasz skarbiec."
 western_schism.22.a: "Rzym otrzyma swą należność."
 western_schism.22.b: "Zapłaćmy drugiemu pretendentowi."
 western_schism.22.c: "Odeślijmy obu z kwitkiem. Nie dostaną ani grosza."
 western_schism.23.title: "Ogłoszenie Roku Jubileuszowego"
 western_schism.23.desc: "Jeden z rywalizujących papieży ogłosił #Y Rok Jubileuszowy#!, obiecując pełne odpuszczenie grzechów każdemu pielgrzymowi, który przybędzie, by czcić groby apostołów. Jego rywal potępił całe przedsięwzięcie jako oszustwo wymierzone w wiernych i bezwstydną próbę zdobycia srebra pielgrzymów. Nasi ludzie już pakują kostury i proszą nas o błogosławieństwo na drogę."
 western_schism.23.a: "Pozwólmy wiernym wyruszyć. Niech niebiosa im błogosławią."
 western_schism.23.b: "To jest oszustwo pod pozorem łaski. Zabrońmy tego."
 western_schism.24.title: "Odpustowi kramarze"
 western_schism.24.desc: "Handlarze odpustami tłoczą się na placach targowych, zachwalając odpusty opatrzone pieczęcią jednego lub drugiego papieża i przysięgając, że to właśnie jego pergamin otwiera bramy niebios. Prosty lud opróżnia sakiewki i wraca do domów z ciężkim sercem, mamrocząc, że zbawienie wystawiono na sprzedaż, a Kościół nie może się nawet zgodzić, który klucz pasuje do zamka."
 western_schism.24.a: "Udzielmy im licencji i pobierzmy swoją dolę."
 western_schism.24.b: "Wygońmy tych przekupni z naszych ulic."
 western_schism.25.title: "Kaznodzieja Sądu Ostatecznego"
 western_schism.25.desc: "Wychudzona postać w włosiennicy przemierza drogi naszego królestwa. [apocalyptic_preacher.GetName] gromadzi tłumy w każdej wiosce i obwieszcza, że Kościół z dwoma przywódcami jest znakiem dni ostatecznych i tylko #Y chłosta#! zmyje korupcję duchowieństwa. Chłopi łkają, podążając za [Select_CString(apocalyptic_preacher.IsFemale,'nią','nim')] boso, a [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] patrzą na to z rosnącą trwogą."
 western_schism.25.a: "Niech prawi kazania. W takich czasach ludzie potrzebują nadziei."
 western_schism.25.a.tt: "Niech #Y [apocalyptic_preacher.GetName]#! dalej prawi kazania, choć jego ruch może się wymknąć naszej kontroli."
 western_schism.25.b: "Uciszmy tego szaleńca, nim sprowadzi zgubę na nas wszystkich."
 western_schism.26.title: "Radykalizm biczowników"
 western_schism.26.desc: "Początkowa pokuta zamieniła się bunt. Zwolennicy kaznodziei o imieniu [apocalyptic_preacher.GetName] biczują się do krwi i zawodzą, że każdy kapłan jest sługą Antychrysta, a każdy papież oszustem. Ruch nie słucha już naszych rozkazów, a ulice roją się od pokutników o obłąkanym spojrzeniu wymachujących cepami."
 western_schism.26.a: "Stłumimy ich, choćbyśmy mieli zapłacić za to morzem krwi."
 western_schism.26.b: "Obróćmy ich gniew przeciwko fałszywemu papieżowi."
 western_schism.27.title: "Zawahanie kardynała"
 western_schism.27.desc: "Rywalizująca kuria po cichu nagabuje jednego z naszych kardynałów, kusząc diecezją bogatszą niż te, które możemy mu zaofiarować. Jeszcze nie ogłosił swojej decyzji, choć jego listy brzmią coraz bardziej wymijająco i zdaje się, że lojalność kardynała ma swoją cenę. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] musi zdecydować, czy warto ją zapłacić."
 western_schism.27.a: "Kupmy jego sumienie, zanim zostanie sprzedane."
 western_schism.27.b: "Dajmy mu odejść. Człowiek, którego można przekupić, nie ma żadnej wartości."
 western_schism.28.title: "List świętego"
 western_schism.28.desc: "Święta niewiasta, czczona w całym kraju za swe wizje, przesłała na nasz dwór płomienny list. Błaga w nim, by niewzruszenie stanąć po stronie prawowitego papieża rzymskiego i użyczyć mu głosów naszych kardynałów. Kopie listu przechodzą z rąk do rąk pobożnych, a [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] czekają, aż [ROOT.GetCountry.GetGovernment.GetRuler.GetName] zdecyduje, czy odpowiemy na jej wezwanie."
 western_schism.28.a: "Święta mówi prawdę. Niech cały chrześcijański świat nas usłyszy."
 western_schism.28.b: "Nie będą nami kierowały wizje kobiety."
 western_schism.29.title: "Hojność kurii"
 western_schism.29.desc: "Niepokojąc się o utrzymanie poparcia kardynałów, wybrany przez nas papież obsypał dwór darami: relikwiami w pozłacanych relikwiarzach, hojnymi dyspensami oraz taką ilością monet, że mogłaby zawrócić w głowie każdemu. Jego listy przepełnia w równym stopniu wdzięczność, co oczekiwanie. Przyjęcie darów oznacza zacieśnienie więzów zależności, zaś odrzucenie ich byłoby rzuceniem mu w twarz #R symonią#!."
 western_schism.29.a: "Podziękujmy za podarunki i pogłębmy więź."
 western_schism.29.b: "Nie ma zgody na symonię."
 western_schism.30.title: "Dysputa uczonych"
 western_schism.30.desc: "Mistrzowie teologii na naszym uniwersytecie podzielili się w kwestii równie niebezpiecznej, co doniosłej: czy #Y sobór powszechny#! może sądzić papieża i usunąć go z urzędu dla dobra Kościoła? Młodsi twierdzą, że tylko w ten sposób schizma zostanie zakończona, zaś starsi są zdania, że ta droga prowadzi do zguby. Obie strony czekają, aż [ROOT.GetCountry.GetGovernment.GetRuler.GetName] rozstrzygnie tę sprawę."
 western_schism.30.a: "Sobór może sądzić także papieża."
 western_schism.30.b: "To herezja! Potępmy to z ołtarza."
 western_schism.31.title: "Komu nasi kardynałowie udzielą poparcia?"
 western_schism.31.desc: "Kardynałowie siodłają swoje muły, by wyruszyć na konsystorz. Wcześniej zwrócili się z zapytaniem, co [ROOT.GetCountry.GetGovernment.GetRuler.GetName] im poradzi: komu mają użyczyć ciężaru swych czerwonych kapeluszy? Im dłużej trwa schizma, tym bardziej wzrasta presja, a milczenie zostaje zinterpretowane jako wybór."
 western_schism.31.a: "Opowiedzmy się za Rzymem i stolicą apostolską."
 western_schism.31.b: "Opowiedzmy się za drugim pretendentem i reformą Kościoła."
 western_schism.31.c: "Niech każdy kieruje się swoim sumieniem."
 western_schism.32.title: "Pusty skarbiec Rzymu"
 western_schism.32.desc: "Skarbiec św. Piotra świeci pustkami. Nasi kardynałowie nie dostają wypłat i utyskują na korytarzach, podczas gdy rywalizująca kuria z Awinionu obnosi się dziesięcinami połowy chrześcijan, wydając je na jedwabie i uczty. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] obawia się, że jeśli Rzym nie jest w stanie opłacić swoich sług, nie utrzyma ich przy sobie na długo."
 western_schism.32.a: "Sprzedajmy urzędy. Rzym nie będzie żebrał."
 western_schism.32.b: "Zwrócimy się do lojalnych książąt o subsydium."
 western_schism.33.title: "Rozwścieczony Rzym"
 western_schism.33.desc: "Lud wyszedł na ulice Rzymu i wrzeszczy pod pałacem, aż trzęsą się okna, że papież #Y musi pozostać we Włoszech#!. Grożą kardynałom, że biada im, jeśli spróbują znów przenieść papiestwo do Francji, jak to miało miejsce w czasach Awinionu. Tłum spogląda na kurię z jawną wrogością, więc [ROOT.GetCountry.GetGovernment.GetRuler.GetName] musi zdecydować, czy słuchać rozjuszonego tłumu, czy też bronić honoru Kościoła."
 western_schism.33.a: "Ugnijmy się przed wolą ludu rzymskiego."
 western_schism.33.b: "Zaprowadźmy porządek na ulicach."
 western_schism.34.title: "Wzajemna ekskomunika"
 western_schism.34.desc: "Wieść nadeszła z obu kurii jednocześnie: każdy z papieży uroczyście #R ekskomunikował#! drugiego, a wraz z nim każdego księcia, kapłana oraz chłopa, którzy ośmielą się podążać za niewłaściwym pasterzem. Ludzie żegnają się ze zgrozą, szepcząc, że są potępieni bez względu na to, którą stronę wybiorą, a sakramenty mogą być teraz bezwartościowe w połowie świata chrześcijańskiego."
 western_schism.34.a: "Uspokójmy ich obawy wielką ceremonią wiary."
 western_schism.34.b: "Strach działa na naszą korzyść. Użyjmy go i przejmijmy złoto Kościoła."
 western_schism.35.title: "Relikwia o kwestionowanej autentyczności"
 western_schism.35.desc: "Klasztor na naszych ziemiach ujawnił relikwię, która według ich obietnic pobłogosławi papieża będącego prawdziwym Namiestnikiem Chrystusa. Pielgrzymi już napływają tłumnie do bram klasztoru, a rywalizujący duchowni wykrzykują oskarżenia o #R fałszerstwie#! i żądają jej spalenia. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] musi zdecydować, czy ten cud stanie się znakiem naszej wiary, czy też zostanie rozebrany na części przez beznamiętnych badaczy."
 western_schism.35.a: "Obdarzmy czcią ten dar z niebios."
 western_schism.35.b: "Pozwólmy uczonym bliżej przyjrzeć się temu „cudowi”."
 western_schism.36.title: "Najemnicy dla kurii"
 western_schism.36.desc: "Przybył desperacki list z pieczęcią wybranego przez nas papieża, w którym błaga nas o oręż, mężczyzn i pieniądze, by za pomocą stali odebrać Państwo Kościelne uzurpatorowi, skoro na nic się zdały dotychczasowe starania. Zahartowana kompania uzbrojona w kopie czeka gotowa do wymarszu, jeśli tylko [ROOT.GetCountry.GetGovernment.GetRuler.GetName] opłaci ich złotem ze skarbca."
 western_schism.36.a: "Wyślijmy kompanię. Papież otrzyma żołnierzy."
 western_schism.36.b: "Mamy własne wojny do stoczenia. Niech poczeka."
 western_schism.37.title: "Neutralny książę"
 western_schism.37.desc: "Nasi najbystrzejsi doradcy pochylają się ku nam i szepczą przebiegłą radę: nie wiążmy się z żadnym papieżem, lecz skuśmy ich swą lojalnością, by każdy próbował przelicytować drugiego złotem oraz przywilejami. To rozwiązanie sowicie napełni nasz skarbiec, choć pobożni przestrzegają, iż książę, który nie wzbudza zaufania, nie jest darzony miłością."
 western_schism.37.a: "Obiecajmy każdemu, nie zobowiązujmy się nikomu i czerpmy korzyści z obu."
 western_schism.37.b: "Nie będziemy siedzieć okrakiem na płocie. Zadeklarujmy poparcie dla wybranego papieża."
 western_schism.38.title: "Plotki o soborze"
 western_schism.38.desc: "Śmiała pogłoska przetacza się niczym burza przez cały chrześcijański świat: znużeni skandalem kardynałowie #Y obu#! obediencji chcą zwołać sobór, by osądził rywalizujących papieży i strącił obu jednym ciosem. Dla jednych to jedyna droga do pokoju, a dla innych jawna herezja, bo jakim prawem ktokolwiek ośmiela się stanąć ponad Namiestnikiem Chrystusa? [ROOT.GetCountry.GetGovernment.GetRuler.GetName] jest naciskany, by zająć stanowisko, zanim jeszcze cokolwiek zostanie zwołane."
 western_schism.38.a: "Poprzyjmy zwołanie soboru. Jedynie tak nastanie pokój."
 western_schism.38.b: "Potępmy ten pomysł. Sobór nie ma zwierzchności nad Namiestnikiem Chrystusa."
 western_schism.39.title: "Trzeci pretendent"
 western_schism.39.desc: "Zadziała się rzecz niewyobrażalna. By zakończyć schizmę, zgromadzenie kardynałów ogłosiło odwołanie z urzędu obu papieży i wybrało trzeciego, przez co świat chrześcijański ma teraz trzech nieuznawanych ojców. Żaden z dawnych papieży nie ustąpi z tronu papieskiego, więc dwory w całej Europie muszą na nowo zadać sobie pytanie, gdzie znajduje się dziś prawdziwa siedziba Chrystusa."
 western_schism.39.a: "Sobór przemówił. Uznajmy nowego papieża."
 western_schism.39.b: "Ufajmy poprzedniemu papieżowi."
 western_schism.2200.desc: "Dołożyliśmy starań i znaleźliśmy proste, a jednocześnie eleganckie rozwiązanie problemów, jakie spowodowała [ShowSituationName('western_schism')]. Zmuszając obie strony do porzucenia roszczeń wobec stolicy apostolskiej i przeprowadzając nowe wybory, znajdziemy odpowiedniego kandydata godnego nosić tytuł [GetInternationalOrganization('catholic_church').GetLeaderTitle|l] i będziemy mogli skupić się na naprawieniu szkód wywołanych przez ten konflikt. [GetInternationalOrganization('catholic_church').GetLeaderTitle] z pewnością podoła temu zadaniu, jednocząc skłóconych duchownych i potwierdzając prawdy wiary."
 western_schism.2000.desc.unresolved: "Nie udało się zebrać soboru, który rozstrzygnąłby spór, a rywalizujące roszczenia osłabły z braku poparcia. [ShowSituationName('western_schism')] kończy się bez uznania żadnego kandydata za prawowitego [GetInternationalOrganization('catholic_church').GetLeaderTitle], a [GetInternationalOrganization('catholic_church').GetName] pozostaje z mocno nadszarpniętym autorytetem tego urzędu. Miejmy nadzieję, że nie zaszkodziło to trwale naszej wierze."
 western_schism.2000.title.unresolved: "Schizma wygasa"
