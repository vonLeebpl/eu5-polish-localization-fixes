l_polish:
 culture_greek.1.title: "[target_character.GetNameWithNoTooltip] prowadzi dysputy"
 culture_greek.1.desc: "Choć duma z naszego #L [ROOT.GetCountry.GetReligion.GetAdjective|l][Select_CString(Or5(StringContains(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'wosł'),StringContains(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'sty'),StringContains(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'szaman'),StringContains(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'szinto'),StringContains(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'tonal')),'ego','kiego')]#! wyznania jest jasna dla wielu państw, zdaje się, że w naszym patriarchacie występują pewne wewnętrzne problemy.\n\n[target_character.GetName] zwraca uwagę, że [target_character2.GetName] nie przykłada się do religijnych obowiązków. Wśród zarzutów pojawiają się oskarżenia o to, że [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] są źle traktowani, da się zauważyć podczas uroczystości nieodpowiednie zachowania, a #L [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip|l][Select_CString(Or5(StringContains(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'wosł'),StringContains(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'sty'),StringContains(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'szaman'),StringContains(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'szinto'),StringContains(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'tonal')),'e','kie')]#! tradycje religijne narodu nie otrzymują należnego szacunku.\n\nChociaż wielu uważa te zarzuty za przesadzone, ludzie wciąż doskonale zdają sobie sprawę, że [target_character2.GetNameWithNoTooltip] postępuje lekkomyślnie i stawia się ponad jakąkolwiek instytucję religijną. To właśnie sprawiło, że niektórzy z naszych #L [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip|l][Select_CString(Or5(StringContains(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'wosł'),StringContains(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'sty'),StringContains(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'szaman'),StringContains(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'szinto'),StringContains(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'tonal')),'ych','kich')]#! obywateli uważają, iż [target_character2.GetName] nie ma w sobie dość godności, by nosić miano „[ROOT.GetCountry.GetGovernment.GetRulerTitle|l]”."
 culture_greek.1.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] nie wiedzą, o czym mówią!"
 culture_greek.1.b: "Może da się ograniczyć to, co robi [target_character2.GetNameWithNoTooltip]."
 culture_greek.1.c: "Nikt nie może twierdzić, że [target_character2.GetNameWithNoTooltip] rządzi nieprawomocnie!"
 culture_greek.1.d: "Przemowa z pewnością rozwieje podejrzenia."
 culture_greek.2.title: "[target_character2.GetNameWithNoTooltip] otrzymuje błogosławieństwo patriarchy"
 culture_greek.2.desc: "Elegancja i porządek panujące w państwie [ROOT.GetCountry.GetName] sprawiły, że [target_character.GetName] interesuje się metodami dzierżenia władzy, którą sprawuje [target_character2.GetName]. Po przybyciu do miasta [target_capital.GetName] [target_character.GetName] jest pod wrażeniem tego, jak wiele uwagi poświęcono zachowaniu religijnych filarów państwa [ROOT.GetCountry.GetReligion.GetName]. Klasztory są dobrze utrzymane i ozdobione wszelkimi bogactwami, jakie tylko [ROOT.GetCountry.GetGovernment.GetGovernmentType.GetName] może zgromadzić. Obywatele podziwiają marmurowe kandylakia wzdłuż dróg, upamiętniające utraconych bliskich lub cuda, które pomogły im przetrwać chwile kryzysu.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] recytuje Biblię i modli się przed ikonami samego Mesjasza. Zapach kadzidła wypełnia powietrze, gdy [target_character.GetNameWithNoTooltip] zbliża się do sali, w której [target_character2.GetNameWithNoTooltip] omawia sprawy polityczne."
 culture_greek.2.a: "Błogosławieństwo Patriarchy jest pewne."
 culture_greek.2.b: "Samo błogosławieństwo to za mało. Musimy włożyć więcej wysiłku w utrzymanie miasta [target_capital.GetNameWithNoTooltip]."
 culture_greek.3.title: "Reformacja w państwie [target_country.GetNameWithNoTooltip]"
 culture_greek.3.desc: "[ShowContinentName('europe')] jest teraz miejscem religijnej reformacji, a [target_character.GetName] zaczyna wykazywać zainteresowanie nawiązaniem stosunków dyplomatycznych z krajami reformatorskimi, takimi jak [target_country.GetName], które sprzeciwiają się instytucji papieskiej.\n\nPo krótkiej dyskusji stało się dla nas jasne, że mamy wspólnego wroga: oni również pragną uwolnić się od korupcyjnych praktyk, jakich dopuszcza się stolica apostolska – [papal_capital.GetName] – i odzyskać autonomiczną władzę. Jednak nadal istnieją różnice, których nasz [ROOT.GetCountry.GetGovernment.GetCourtTitle] nie może zaakceptować. To ślady, jakie [ShowReligionName('catholic')|l] pozostawił na ich ziemiach."
 culture_greek.3.a: "Wróg mojego wroga jest moim przyjacielem."
 culture_greek.3.b: "Nie potrzebujemy pomocy heretyków."
 culture_greek.3.c: "[target_character2.GetShortNameWithNoTooltip] robi z nas durniów!"
 culture_greek.4.title: "Kwestia kultury „greckiej”"
 culture_greek.4.desc: "Rozwój absolutyzmu oraz koncepcja państwa i jego obywateli kształtują sposób myślenia współczesnego społeczeństwa. Wcześniej kwestie te nie były przedmiotem otwartej dyskusji, ponieważ kulturę kształtowała przede wszystkim religia. Jednak obecnie, gdy wybitni myśliciele wywodzą się z niższych warstw społecznych, wiele osób w naszych instytucjach edukacyjnych zadaje sobie jedno pytanie: czym jest kultura [ShowCultureNameWithNoTooltip('greek_culture')|l]?\n\nNiektórzy twierdzą, że dyglosja występująca w państwowej mowie utrwala podział, przez który urzędnicy oraz [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] mają całkowicie inne spojrzenie na rzeczywistość niż [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')], ze względu na zupełnie odmienne maniery i posługiwanie się różnymi dialektami.\n\nSytuacja ta stopniowo doprowadziła wielu do radykalizacji poglądów – domagają się oni zmian, które zlikwidowałyby ten podział i naprawdę zjednoczyły naród #L [ROOT.GetCountry.GetAdjective|l]ki#!."
 culture_greek.4.a: "Powoli, ale skutecznie możemy zjednoczyć lud."
 culture_greek.4.b: "Wprowadzenie takich zmian zachwiałoby równowagą naszej obecnej struktury władzy."
 culture_greek.4.c: "Nie ma różnic kulturowych, są tylko różne odmiany tej samej tradycji."
 greek_culture_greek_peasants_will_gain_satisfaction: "Wszystkie [pops|el] należące do [Concept('culture','kultury')|e] greckiej poza [Concept('rural_locations','lokacjami wiejskimi')|e], które należą do stanu [ShowPopTypeName('peasants')] lub [ShowPopTypeName('laborers')], zyskają [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [Concept('pop_satisfaction','satysfakcji')|e]."
 culture_greek.5.title: "[target_character.GetNameWithNoTooltip] zdobywa sławę"
 culture_greek.5.desc: "[target_character.GetNameWithNoTooltip] odnosi wiele zwycięstw w miejscach takich jak [victory_location1.GetName] czy [victory_location2.GetName], więc ludzie doceniają [Select_CString(target_character.IsFemale,'jej','jego')] geniusz strategiczny oraz umiejętne pokonanie wrogów państwa [ROOT.GetCountry.GetName] poprzez przelanie ich krwi, z czego zapewne ucieszy się sam Bóg i [target_character2.GetName].\n\nPo rozmowach z wieloma wpływowymi dworzanami wydaje się, że oni również darzą [Select_CString(target_character.IsFemale,'ją','go')] szacunkiem i są zaintrygowani opowieściami o bitwie stoczonej w miejscu znanym jako [victory_location3.GetName] – wszyscy mówią o tym doniosłym wydarzeniu. [target_character2.GetNameWithNoTooltip] czuje, że ta sława może stanowić zagrożenie, ponieważ [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] coraz bardziej sympatyzuje z bohaterskimi wyczynami, z których słynie [target_character.GetNameWithNoTooltip]. Być może jednak da się wykorzystać tę sytuacje do dalszego wzmocnienia rządów dynastii [target_character2.GetDynasty.GetName] nad państwem [ROOT.GetCountry.GetNameWithNoTooltip]."
 culture_greek.5.a: "Uczcijmy takich bohaterów."
 culture_greek.5.b: "[target_character.GetShortNameWithNoTooltip] nie może mieć tak wielkich wpływów."
 culture_greek.5.c: "[target_character.GetShortNameWithNoTooltip] będzie #italic dostatecznie#! blisko nas, a jednocześnie niech nie miesza się zbytnio do polityki."
 greek_culture_strategos_will_never_be_able_to_influence_politics: "Ponieważ [target_character.GetName] nie może wpływać na [Concept('courtiers','dworzan')|e], nie musimy się obawiać, że w przyszłości spróbuje dokonać przewrotu."
 greek_culture_strategos_will_never_get_the_opportunity_to_coup: "[target_character.GetName] nigdy nie zdoła wpłynąć na [Concept('courtiers','dworzan')|e], co oznacza, że nigdy nie spróbuje obalić naszej władzy."
 culture_greek.6.title: "Strategos ludu"
 culture_greek.6.desc: "Po zdobyciu uznania dzięki swym zdolnościom taktycznym [target_character.GetName] przechadza się ulicami miasta [target_capital.GetName] ze strażą przyboczną, a wokół gromadzą się tłumy ludzi chcących zobaczyć na własne oczy wojskową sławę.\n\n[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')], [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] i [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] z radości głośno wykrzykują: „[target_character.GetShortNameWithNoTooltip]”! W tłumie słychać też cichsze głosy, które twierdzą, że ktoś taki lepiej nadaje się do dzierżenia władzy, gdyż unika korupcji i wsłuchuje się w głos ludu. Szepty te dotarły aż na [ROOT.GetCountry.GetGovernment.GetCourtTitle], co świadczy o tym, jak wielkim poważaniem cieszy się [target_character.GetName]."
 culture_greek.6.a: "Największym strategosom należy się szacunek, nawet od ich rywali."
 culture_greek.6.b: "Spróbujmy uciszyć tłum, zanim ktoś wpadnie na głupi pomysł."
 greek_culture_all_capital_pops_gain_pop_satisfaction: "Wszystkie [pops|el] w mieście [target_capital.GetName] zyskają [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [Concept('pop_satisfaction','satysfakcji')|e]."
 greek_culture_prevent_coup_for_two_year: "Jeśli [target_character.GetName] zamierza dokonać zamachu stanu, wysiłki te opóźnią się o #y 2#! lata"
 culture_greek.7.title: "[target_character.GetNameWithNoTooltip] dokonuje zamachu stanu"
 culture_greek.7.desc: "Po miesiącach intryg, zdobywania poparcia, osłabiania wpływów przeciwników i zbierania wojsk [target_character.GetName] może wreszcie dokonać zamachu stanu i przejąć władzę, którą teraz sprawuje [target_character2.GetName].\n\nUznając, że ma prawo do panowania nad państwem [ROOT.GetCountry.GetName] jako znacznie bardziej dobrotliwa i kompetentna władza, [target_character.GetName] znajduje się obecnie pod miastem [ROOT.GetCountry.GetCapital.GetName] i wywiera naciski, licząc, że [target_character2.GetShortName] dobrowolnie opuści tron państwa [ROOT.GetCountry.GetNameWithNoTooltip]."
 culture_greek.7.a: "Potrzebujemy nowej władzy, która uwolni nas od dekadencji."
 culture_greek.7.b: "[target_character2.GetShortNameWithNoTooltip] nie abdykuje tak łatwo!"
 culture_greek.7.c: "Co [target_character.GetShortNameWithNoTooltip] może wiedzieć o prawie do rządzenia?"
 culture_greek.7.d: "Skażcie [target_character.GetHerHim] na wygnanie za próbę obalenia rządu."
 greek_culture_weaker_due_to_righteous_trait: "[rebels|e] będą znacznie słabsi."
 culture_greek.8.title: "Szpiedzy w regionie [target_location.GetNameWithNoTooltip]"
 culture_greek.8.desc: "Strażnicy z miasta [target_location.GetName] odkryli niedawno grupę szpiegów próbujących zdobyć dostęp do największych tajemnic państwa [ROOT.GetCountry.GetName] – takich jak grecki ogień i inne osiągnięcia technologiczne, które chcieliby wykorzystać w swoim królestwie.\n\nChociaż nie wyznali, dla kogo pracują, powiedzieli nam, że wykonują swoją misję od miesięcy i zaglądają do wszystkich szynków i kościołów, próbując znaleźć jakiekolwiek wskazówki, które pozwoliłyby im poznać nasze tajemnice. Ci szpiedzy mogą się jeszcze do czegoś przydać, zamiast gnić w lochach i czekać, aż ich zleceniodawca dowie się o ich losie. Być może mogliby nam służyć."
 culture_greek.8.a: "Nasz [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] może zrobić użytek z tych szpiegów."
 culture_greek.8.b: "Niech zgniją za kratami. Trzeba ujawnić wszystkie inne siatki szpiegowskie, które oplotły miasto [target_location.GetNameWithNoTooltip]!"
 culture_greek.8.c: "Może pomogą nam namierzyć inne siatki szpiegowskie, jakie oplotły nasze [target_location.GetRank.GetNameWithNoTooltip|l]."
 every_country_with_spy_network_on_us_will_lose_25_network: "Każdy znany [country|el], który posiada [Concept('spy_network','siatkę szpiegowską')|e] o wartości co najmniej #Y 15#! w mieście [target_location.GetRank.GetNameWithNoTooltip] straci #R -25#! wartości [Concept('spy_network','siatki szpiegowskiej')|e]."
 culture_greek.9.title: "Złota bulla z regionu [target_location.GetNameWithNoTooltip]"
 culture_greek.9.desc: "#L [ShowCultureGroupName('italian_group')]kie#! wpływy w mieście [target_location.GetRank.GetName] w regionie [target_location.GetName] zdominowały miejscowy handel. Jedynymi kupcami, z którymi ludzie chcą prowadzić interesy, są ci, których siedzibą są [ShowRegionName('italy_region')], co powoduje, że znaczna część naszych bogactw wymyka się nam z rąk, ponieważ nie potrafimy ich odpowiednio wykorzystać. Ma to jednak pewne zalety – głównie jest to możliwość sprzedaży przez państwo swoich dóbr, choć nie po idealnych cenach. Jednak takie transakcje mogą również prowadzić do spadku autorytetu, jakim cieszy się [target_character.GetName], co może skutkować większym uzależnieniem od kupców włoskich."
 culture_greek.9.a: "Niech cieszą się większymi przywilejami, o ile przynosi nam to korzyści."
 culture_greek.9.b: "Jeśli chcą wyssać bogactwo z miasta [target_location.GetRank.GetNameWithNoTooltip], muszą za to zapłacić."
 culture_greek.9.c: "Dajmy im pewne przywileje – takie, które nie przyniosą żadnych rzeczywistych korzyści."
 culture_greek.9.d: "Jeśli mamy tworzyć przepisy, które mają ich chronić, musimy to robić skutecznie."
 all_italian_pops_become_happier: "Wszystkie włoskie [pops|el] ze stanu [ShowPopTypeName('burghers')|l] zyskają [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [Concept('pop_satisfaction','satysfakcji')|e]."
 all_italian_pops_become_angrier: "Wszystkie włoskie [pops|el] ze stanu [ShowPopTypeName('burghers')|l] utracą [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction','satysfakcji')|e]."
 culture_greek.10.title: "Nowe pokolenie miasta [target_location.GetNameWithNoTooltip]"
 culture_greek.10.desc: "Przy obecnym ugruntowanym systemie biurokratycznym i rosnącej korupcji wśród osób sprawujących władzę pojawia się wielu wybitnych młodych studentów, którzy pragną wyeliminować korupcję poprzez zastąpienie przestarzałych metod starej gwardii bardziej postępowymi rozwiązaniami. Jedną z takich nowych osób jest [Select_CString(target_character.IsFemale,'pochodząca','pochodzący')] z prostej rodziny [target_character.GetName], [Select_CString(target_character.IsFemale,'która przez lata wykazała','który przez lata wykazał')] zdolność usprawnienia naszej biurokracji przy wykorzystaniu radykalnych metod. Te nowe metody mają szansę przekształcić obecnie sztywną biurokrację w strukturę, która przyniesie korzyści państwu oraz jego obywatelom.\n\nChociaż z pewnością poprawiłoby to skuteczność administracji, wiele osób zajmujących stałe stanowiska obawia się zwolnienia i walczy z tym nowym pokoleniem, tłumiąc jego głosy, a nawet przekupując niektórych, by „zamilkli”."
 culture_greek.10.a: "Ci młodzi ludzie to przyszłość."
 culture_greek.10.b: "W tych sprawach podzielamy poglądy starej gwardii."
 culture_greek.11.title: "Obca fraza"
 culture_greek.11.desc: "Chociaż wpływ języka łacińskiego słabnie na wschodnim dworze, staramy się zachować tożsamość dumnego ludu greckiego. Mimo to niektórzy [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] wydają się na tyle wykształceni, że mowa języka #L [ShowLanguageName('latin_language')|l]ego#! nie jest im obca i znają frazy w tym języku.\n\n„Pro bono” – mówi [target_character.GetName] i [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] jest zdziwiony, dopóki nie pozna pochodzenia i znaczenia tych słów. Niektórzy przywiązani do tradycji słuchacze wyśmiewają użycie tak dziwnego języka, jednak inni są szczerze zaciekawieni tym, co [ShowLanguageNameWithNoTooltip('latin_language')|l] ma do zaoferowania. Ci dworzanie wspominają o szerszym przyjęciu tej mowy i wykorzystaniu jej w administracji. Byłby to niejako powrót do starych, rzymskich tradycji, które państwo [ROOT.GetCountry.GetNameWithNoTooltip] może podtrzymywać."
 culture_greek.11.a: "Nie mamy powodów, by porzucać nasz grecki charakter."
 culture_greek.11.b: "Język #L[ShowLanguageName('latin_language')|l]#! będzie promowany."
 culture_greek.11.c: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] musi szanować wszystkie języki."
 culture_greek.12.title: "Widoczna korupcja"
 culture_greek.12.desc: "Chociaż wiele ważnych stanowisk w państwie [ROOT.GetCountry.GetName] zajmują kompetentni ludzie, niektóre elementy tego systemu chyba nie spełniają oczekiwań.\n\nOstatnia kontrola naszej administracji przyniosła dość interesujący wynik: krążą pogłoski, że [target_character.GetName] rozdaje stanowiska krewnym, znajomym, a nawet osobom, które mogą przynieść [Select_CString(target_character.IsFemale,'jej','mu')] bogactwo. Kiedy [ROOT.GetCountry.GetGovernment.GetCourtTitle] i, co ważniejsze, [target_character2.GetName] otrzymali te pogłoski, niektórzy szybko je zlekceważyli jako zwykły spór, który [target_character.GetNameWithNoTooltip] toczy z inspektorami.\n\nByć może potrzebna jest bardziej zdecydowana interwencja, aby pokazać tym, którzy uważają, że nasza administracja jest sposobem na pomnażanie ich majątku, że każde podjęte działanie ma swoje konsekwencje."
 culture_greek.12.a: "Jeśli wyrzucimy wszystkich skorumpowanych, nie zostanie nam już nikt."
 culture_greek.12.b: "[target_character.GetShortNameWithNoTooltip] poniesie konsekwencje własnych wyborów."
 culture_greek.12.c: "Wszelka korupcja zostanie wyeliminowana!"
 culture_greek.12.d: "Być może... da się coś załatwić."
 culture_greek.13.title: "Upadające Kephalē"
 culture_greek.13.desc: "Kephalē w regionie [target_area.GetName] od momentu powstania boryka się z problemami. Jego namiestnik, rezydujący w mieście [target_location.GetName], nie spełnił pokładanych w nim oczekiwań, jednak fakt ten został zignorowany przez wielu członków naszej administracji. Pozwoliło to miejscowej ludności uniknąć płacenia podatków, a niektórym szlachcicom przejąć ziemie w tym regionie, wykorzystując chłopów i ich potencjalne bogactwa. [ROOT.GetCountry.GetGovernment.GetCourtTitle] i [target_character.GetName] już znają te doniesienia, a niektórzy dostojnicy, niczym sępy krążące nad padliną, chce zająć miejsce rzeczonego gubernatora lub obsadzić to stanowisko swoimi pociotkami, twierdząc, że lepiej zadbają o bezpieczeństwo regionu. Choć takie działania wydają się drastyczne, zmiana zarządcy nie wydaje się złym pomysłem. A może to nasza wina, że zaniedbaliśmy lokalnych przywódców i powinniśmy wysłać im więcej zasobów, aby [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] przestali się panoszyć, a dumni plebejusze dali się okiełznać?"
 culture_greek.13.a: "Zastąpmy gubernatora kimś innym."
 culture_greek.13.b: "To nasze niedbalstwo doprowadziło region [target_area.GetNameWithNoTooltip] do tego stanu. Wyślijmy wsparcie."
 culture_greek.13.c: "Tylko czas może zaleczyć te rany. Nie ma potrzeby wprowadzania tam zmian w zarządzaniu."
 all_pops_in_kephale_area_lose_satisfaction: "Wszystkie [pops|el] w regionie [target_area.GetName] stracą [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction','satysfakcji')|e]."
 gain_extra_control_in_the_area: "Każda posiadana przez nas [location|el] w regionie [target_area.GetName] zyska [ShowNamedValue('control_mild_bonus')|+=2%] [Concept('control','kontroli')|e] i [modifier|el] [ShowModifier('increased_kephale_support')] na #Y 10#! lat"
 lose_extra_control_in_the_area: "Każda posiadana przez nas [location|el] w regionie [target_area.GetName] straci [ShowNamedValue('control_mild_penalty')|+=2%] [Concept('control','kontroli')|e]."
 culture_greek.14.title: "Brak purpurowego rodowodu"
 culture_greek.14.desc: "Chociaż [target_character.GetName] zajmuje tron państwa [ROOT.GetCountry.GetName], wiele osób wskazuje, że jest osobą o niedostatecznym prestiżu. Ponieważ [target_character.GetNameWithNoTooltip] nie ma odpowiedniego, „purpurowego” rodowodu, wielu uważa, że ten brak reputacji stawia [ROOT.GetCountry.GetGovernment.GetCourtTitle] w złym świetle. Krążą już plotki o braku godności najwyższej władzy, której usposobienie pasuje raczej do nieokrzesanych zdobywców, niż najwyższych zaszczytów. Niektórzy myślą nawet o planach „przekształcenia” administracji w sposób, który [target_character.GetNameWithNoTooltip] i wielu krewnych może uważać za wyjątkowy luksus."
 culture_greek.14.a: "[target_character.GetNameWithNoTooltip] poprawi swój status, jeśli zainwestujemy trochę pieniędzy."
 culture_greek.14.b: "Czy do rządzenia krajem wystarczy sam prestiż?"
 culture_greek.14.c: "Jeśli ktoś chce poznać, czym jest godność, sam jej doświadczy."
 culture_greek.15.title: "$STATIC_MODIFIER_NAME_despot_modifier$ – spór"
 culture_greek.15.desc: "Chociaż rodzina [target_character.GetDynasty.GetName] zawsze była zjednoczona w dążeniu do sprawowania władzy nad państwem [ROOT.GetCountry.GetName], pojawiły się pewne rozbieżności co do sposobu, w jaki należy realizować ten cel. [target_character.GetName] i [target_character2.GetName] nie zgadzają się co do tego, jak połączyć to, co robi [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] z obowiązkami pełnionymi przez ród. [target_character.GetShortNameWithNoTooltip] woli zbliżyć poddanych do władców, co ułatwiłoby kontrolowanie spraw państwowych. [target_character2.GetShortNameWithNoTooltip] opowiada się za przeciwnym stanowiskiem, twierdząc, że przyznanie autonomii naszym poddanym może umożliwić stworzenie większego królestwa, w którym możemy utrzymać niewielkie obszary wpływów na rozległych terenach."
 culture_greek.15.a: "[target_character.GetShortNameWithNoTooltip] ma dobry pomysł."
 culture_greek.15.b: "[target_character2.GetShortNameWithNoTooltip] wysuwa kuszącą propozycję..."
 culture_greek.15.c: "Przypomnijmy, kto włada państwem [ROOT.GetCountry.GetNameWithNoTooltip]."
 culture_greek.15.d: "[ROOT.GetCountry.GetGovernment.GetRuler.GetShortNameWithNoTooltip] może czegoś nauczyć spierające się strony."
 culture_greek.16.title: "[target_character.GetNameWithNoTooltip] przemawia na dworze."
 culture_greek.16.desc: "[target_character.GetName], dzięki swym wyczynom okrywa się sławą w państwie [ROOT.GetCountry.GetName], a cała stolica – [ROOT.GetCountry.GetCapital.GetName] – aż huczy od plotek. Wielu dworzan pragnie na własne oczy ujrzeć legendę, która zapisała się w historii naszego narodu, i pragnie zaprosić ją na [ROOT.GetCountry.GetGovernment.GetCourtTitle|l], gdzie dojdzie do spotkania z innymi wpływowymi postaciami.\n\nNiektórzy z [target_character.GetHerHis] rywali nie są zbyt zachwyceni tym pomysłem, a niektórzy uważają, że [target_character2.GetName] ma powody do zmartwień, jeśli [target_character.GetName] wpadnie na głupi pomysł i zacznie rościć sobie prawa do władania państwem [ROOT.GetCountry.GetNameWithNoTooltip]."
 culture_greek.16.a: "[target_character.GetName] ma pełne prawo spotkać się z dworem."
 culture_greek.16.b: "Szansa wejścia na [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]? Nic z tego."
 culture_greek.17.title: "Rozwój handlu w regionie [target_location.GetNameWithNoTooltip]"
 culture_greek.17.desc: "Nasze doświadczenie w żegludze morskiej umożliwiło rozwój nowych portów i szlaków handlowych w państwie [ROOT.GetCountry.GetName]. Jeden z tych nowych ośrodków handlu to [target_location.GetRank.GetName] [target_location.GetName] – [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] ściągają tam tłumnie, ponieważ przyznano im przywileje, dzięki którym mogą jeszcze bardziej wzmocnić swoją pozycję.\n\nNowa infrastruktura stworzona przez miejscowych przyciąga coraz więcej ludzi z całego państwa [ROOT.GetCountry.GetNameWithNoTooltip], co prowadzi do jeszcze większego zapotrzebowania na targowiska, statki i domostwa. [target_character.GetName] wie o tych potrzebach, wzywa więc do siebie [ROOT.GetCountry.GetGovernment.GetCourtTitle|l], aby ustalić, jak zaradzić problemom."
 culture_greek.17.a: "Promujmy handel w mieście [target_location.GetNameWithNoTooltip]."
 culture_greek.17.b: "Pomożemy im, o ile potem okażą nam wdzięczność."
 culture_greek.17.c: "Podzielimy się kosztami."
 culture_greek.18.title: "$a_akritai$ zaniedbują obowiązki w miejscowości [target_location.GetNameWithNoTooltip]"
 culture_greek.18.desc: "Posterunek graniczny – [target_location.GetRank.GetName] w regionie [target_location.GetName] – zaniedbuje swoje obowiązki. Dowódcy rozluźnili codzienną musztrę, przez co terytorium jest bardziej narażony na wrogie najazdy i inwazje.\n\nOstatnia inspekcja dostarczyła nam więcej informacji na temat tej sytuacji: tamtejszy dowódca to najwyraźniej przykład nepotyzmu, ponieważ objął stanowisko dzięki powiązaniom rodzinnym, a nie zasługom. Żołnierze sprzeniewierzają fundusze przekazane przez państwo [ROOT.GetCountry.GetName], pijąc i chwaląc się czynami, których nie dokonali. Zamiast akceptować tę sytuację i ryzykować naruszenie granicy regionu [target_area.GetName], musimy egzekwować dyscyplinę, by $a_akritai$ przyłożyli się do pracy. Być może [target_character.GetName] wykaże się większą inicjatywą w tej sprawie?"
 culture_greek.18.a: "Nie mamy na to funduszy."
 culture_greek.18.b: "Ochrona granicy to ich obowiązek i należy im o tym przypomnieć."
 all_pop_in_location_lose_satisfaction: "Wszystkie [pops|el] w regionie [target_location.GetName] stracą [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction','satysfakcji')|e]."
 culture_greek.19.title: "$a_akritai$ z regionu [target_location.GetNameWithNoTooltip] bohaterami opowieści"
 culture_greek.19.desc: "Chociaż $a_akritai$ są bohaterami wielu wyolbrzymionych legend, które mają rozsławić państwo [ROOT.GetCountry.GetName] na całym świecie, znamy też relacje naocznych świadków zamieszkujących miejscowość [target_location.GetName] i strzegących granicy w regionie [target_area.GetName]. Dzięki ich wysiłkom wrogowie trzymają się na dystans, a [target_character.GetName] cieszy się szacunkiem na tych ziemiach. Niektórzy mają wątpliwości co do prawdziwości opowieści, które snują $a_akritai$, ale wśród dworzan są też tacy, którzy pragną im jeszcze bardziej pomóc i wzmocnić już zbudowaną legendę, nawet jeśli ma to służyć wyłącznie chwale państwa [ROOT.GetCountry.GetNameWithNoTooltip]. Być może [target_character.GetNameWithNoTooltip] również udzielić swojej pomocy, tworząc lokalny mit dzielnych mieszkańców, których domem jest [target_location.GetNameWithNoTooltip]."
 culture_greek.19.a: "Jeśli dzięki temu $a_akritai$ zaczną czynić tak, jak mówią legendy, rozgłosimy te opowieści."
 culture_greek.19.b: "Już sama służba jest godna uwiecznienia w legendach."
 culture_greek.20.title: "$a_akritai$ z regionu [target_location.GetNameWithNoTooltip] proszą o pomoc"
 culture_greek.20.desc: "Jako że [ROOT.GetCountry.GetFlavorRank|l] [ROOT.GetCountry.GetName] jest rozległe, w niektórych jego obszarach dochodzi do zaniedbań. Chociaż najczęściej nie wynika to z celowego działania, pozostawia niesmak wśród miejscowej ludności. Te niedopatrzenia sprawiły, że mieszkańcy regionu [target_area.GetName] czują się zagrożeni, ponieważ granica nie jest tak bezpieczna, jak sobie życzą. Poprosili lokalny garnizon w miejscowości [target_location.GetName] o wzmocnienie wysiłków i zwiększenie czujności, ale by właściwie zabezpieczyć się przed najazdem lub inwazją, zwrócili się także z prośbą o wsparcie na [ROOT.GetCountry.GetGovernment.GetCourtTitle|l].\n\nIch posłańcy przybyli do miasta [target_capital.GetName], a [target_character.GetName] może ich wysłuchać. Poprosili nas o przesłanie pieniędzy na sfinansowanie rozbudowy fortyfikacji w regionie [target_location.GetNameWithNoTooltip], a także o więcej ludzi, którzy albo dołączą do garnizonu, albo będą szkolić żołnierzy podczas codziennych ćwiczeń."
 culture_greek.20.a: "Każdy zakątek kraju będzie bezpieczny."
 culture_greek.20.b: "Nie możemy przeznaczyć na to środków."
 culture_greek.21.title: "Zanik handlu śródziemnomorskiego w regionie [target_location.GetNameWithNoTooltip]"
 culture_greek.21.desc: "Odkrycie Nowego Świata doprowadziło do powstania nowych szlaków handlowych. Wiele z nich przyczynia się do spadku znaczenia handlu śródziemnomorskiego, co staraliśmy się wykorzystać na naszą korzyść. Mając już doświadczenie na tym akwenie, [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] uporczywie nie chce zrezygnować ze swoich obecnych szlaków morskich. Uważają oni, że pomoże im nie zmiana tradycji, lecz finansowanie, jakie może przyznać [ROOT.GetCountry.GetGovernment.GetCourtTitle|l], oraz ciągła promocja ich preferowanych ośrodków handlowych.\n\nJednym z ośrodków ubiegających się o taką pomoc jest miasto [target_location.GetRank.GetName] w regionie [target_location.GetName], które odczuwa skutki globalnych zmian w handlu. Otrzymaliśmy prośbę o przyznanie środków finansowych, ułatwiających tamtejszym kupcom import nowych towarów, co pozwoli zwiększyć obroty i potencjalnie przywrócić znaczenie, jakie niegdyś miało to centrum handlu, [target_location.GetNameWithNoTooltip]."
 culture_greek.21.a: "Przyznajmy im te środki."
 culture_greek.21.b: "Jeśli chcą odnieść sukces jako przedsiębiorcy, powinni nauczyć się lepiej zarządzać tym, co już mają."
 culture_greek.21.c: "Wszystko da się rozwiązać odrobiną sprytu."
 burghers_in_location_lose_satisfaction: "Wszystkie [pops|el] typu [ShowPopTypeName('burghers')|l] na obszarze [target_location.GetName] stracą [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] [Concept('pop_satisfaction','satysfakcji')|e]"
 burghers_in_location_gains_satisfaction: "Wszystkie [pops|el] typu [ShowPopTypeName('burghers')|l] na obszarze [target_location.GetName] zyskają [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] [Concept('pop_satisfaction','satysfakcji')|e]"
 culture_greek.22.title: "Święto Theotokos w mieście [target_location.GetNameWithNoTooltip]"
 culture_greek.22.desc: "Narodziny Jezusa są uważane za wydarzenie o ogromnym znaczeniu dla każdego pobożnego #L [ShowReligionAdjective('orthodox')|l]ego#! wyznawcy, dlatego też wielu organizuje uroczystości ku czci Jego matki, Marii, którą często nazywa się #italic Theotokos#!, czyli Matką Boską.\n\nNikt nie świętuje tak gorliwie jak mieszkańcy miejscowości [target_location.GetName]. Organizują oni festiwal w obrębie miasta i poza nim, mając nadzieję, że będą mogli naprawdę odpocząć przez cały dzień i podzielić się swoją radością ze wszystkimi, którzy zechcą do nich dołączyć. Rzeczywiście [Root.GetCountry.GetGovernment.GetCourtTitle|l] wybiera się, aby obejrzeć wielkie widowisko, a bardziej uduchowieni dworzanie pragną również uradować serca miejscowej ludności swoją obecnością."
 culture_greek.22.a: "To naprawdę wspaniała okazja."
 culture_greek.22.b: "Będziemy świętować razem z nimi."
 culture_greek.22.c: "Chociaż nie podzielamy ich wiary, możemy ją uszanować."
 culture_greek.22.d: "Tradcyje #L [ShowReligionAdjectiveWithNoTooltip('orthodox')|l]e#! nie rozprzestrzenią się w mieście [target_location.GetNameWithNoTooltip]."
 all_pops_in_location_gain_satisfaction: "Wszystkie [pops|el] zyskają [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] [Concept('pop_satisfaction','satysfakcji')|e]."
 all_orthodox_pops_in_location_lose_satisfaction: "Wszystkie [pops|el], których wyznaniem jest wiara #L [ShowReligionAdjective('orthodox')]a#!, stracą [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] [Concept('pop_satisfaction','satysfakcji')|e]"
 culture_greek.23.title: "Wpływy miasta [target_location.GetNameWithNoTooltip]"
 culture_greek.23.desc: "Wpływ, jaki miejscowość [target_location.GetName] wywiera na państwo [ROOT.GetCountry.GetName], staje się coraz bardziej widoczny dla wszystkich, zwłaszcza dla urzędników zamieszkujących stolicę – [target_capital.GetName]. Ciekawi ich, dlaczego [target_location.GetRank.GetName] w regionie [target_area.GetName] ma aż takie znaczenie – zapewne głównie dzięki patronatowi, jaki roztacza [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] oraz różni [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]. Zarówno niższej rangi urzędnicy, jak i zamożni [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] czerpią korzyści z możliwości, jakie daje im [target_location.GetRank.GetNameWithNoTooltip], a miejscowi [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] mogą żyć w luksusie. \n\nChociaż ten stan rzeczy prowadzi do ogólnego zadowolenia, region zyskuje coraz większą potęgę, co osłabia pozycję, jaką posiada [target_capital.GetName] oraz inne obszary, zaburzając równowagę sił w całym kraju."
 culture_greek.23.a: "Czemu mielibyśmy karać to miejsce za to, że przyciąga nowych ludzi i bogactwo?"
 culture_greek.23.b: "Inne miasta mają uzasadnione obawy. Miasto [target_location.GetNameWithNoTooltip] powinno ograniczyć rozwój."
 all_pops_with_influential_polis_modifier_lose_satisfaction: "Wszystkie [pops|el] w [Concept('locations','lokacjach')|e] z [Concept('modifier','modyfikatorem')|e] „[ShowModifier('greek_culture_influential_polis')]”, stracą [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] [Concept('pop_satisfaction','satysfakcji')|e]."
 all_pops_in_location_lose_satisfaction: "Wszystkie [pops|el] na obszarze [target_location.GetName] stracą [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] [Concept('pop_satisfaction','satysfakcji')|e]"
 culture_greek.24.title: "Roszczenia Romajów"
 culture_greek.24.desc: "Wpływy Cesarstwa Rzymskiego są nadal odczuwalne na ziemiach państwa [ROOT.GetCountry.GetName]. Chociaż nie możemy rościć sobie praw do tytułu „$BYZ$”, ludność wciąż utożsamia się ze starą potęgą, twierdząc, że [target_character.GetName] musi realizować bardziej agresywną politykę i odbić część ziem Cesarstwa Rzymskiego. [ROOT.GetCountry.GetGovernment.GetCourtTitle] słucha też głosów populistów, którzy uważają, że do odzyskiwania terytoriów powinniśmy zacząć dodać jeszcze stylizowanie najwyższej władzy na dawnych cesarzy. Miasto [target_capital.GetName] powinno również odzwierciedlać ten styl, wykorzystując estetykę, która zapewni nam niezbędną legitymizację i prestiż, abyśmy mogli wysuwać silniejsze roszczenia dotyczące naszych dawnych terytoriów."
 culture_greek.24.a: "Ci „Romajowie” mogą zapomnieć o swoich fantazjach."
 culture_greek.24.b: "Takie działania mogą być korzystne; być może uda nam się je wprowadzić."
 culture_greek.25.title: "Mądrości miasta [ShowLocationNameWithNoTooltip('mystras')]"
 culture_greek.25.desc: "Słynna szkoła filozoficzna w mieście [ShowLocationName('mystras')] wywarła wpływ na regiony [ShowRegionName('balkan_region')], [ShowAreaName('west_anatolia_area')] oraz [ShowRegionName('italy_region')].\n\nAkademicy odwiedzili wiele miejsc, tak ubogich, jak i bogatych. Jedno z nich to [target_location.GetName] w regionie [target_area.GetName]. Młodzi uczeni, którzy wyruszyli odkrywać odległe krainy, zatrzymywali się tam, dzieląc się z mieszkańcami swoimi poglądami filozoficznymi, kulturowymi i retoryką. Wielu miejscowych, zwłaszcza tych lepiej wykształconych, zainteresowało się tymi ideami i chce teraz poszerzać swoje horyzonty. Nauki dotarły również na #L [ROOT.GetCountry.GetAdjective|l]ki#! [Root.GetCountry.GetGovernment.GetCourtTitle|l], który ma bardziej radykalne poglądy na wspomniane kwestie. Niektórzy pragną stłumić wszelkie pomysły i nauki, które mogą wydawać się niebezpieczne, zwłaszcza te, które mogą stanowić zagrożenie dla tożsamości państwa [ROOT.GetCountry.GetNameWithNoTooltip], natomiast osoby o niższym statusie chcą pozwolić na rozprzestrzenianie się tych idei, ponieważ nasz lud może czerpać z nich wiedzę."
 culture_greek.25.a: "Ich nauki nie są niebezpieczne. Niech dzielą się swoją wiedzą."
 culture_greek.25.b: "[target_location.GetNameWithNoTooltip] to potencjalne siedlisko radykalnych idei. Nie ryzykujmy."
 event_will_only_fire_for_locations_within_mystras_scholarship_geography: "Te [event|el] może aktywować się jedynie w [Concept('locations','lokacjach')|e] będących w zasięgu działania „[ShowScriptedGeographyName('mystras_scholarship_geography')]”."
 culture_greek.26.title: "Nowa retoryka #L [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ka#!"
 culture_greek.26.desc: "W epoce rzymskiej powstała niezliczona liczba dzieł, których bazowym językiem był #L [ShowLanguageName('latin_language')|l]#!, a niektórzy obywatele państwa [ROOT.GetCountry.GetName] niechętnie się jej uczą. Skłoniło to naszych bardziej oczytanych uczonych do przetłumaczenia zbiorów na #L [ROOT.GetCountry.GetCommonLanguage.GetName|l]#! język potoczny, którym posługują się zwykli obywatele.\n\nElita jest tym zaniepokojona i obawia się, że niższe warstwy społeczne mogłyby uzyskać dostęp do tych samych tekstów, nad którymi [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] spędzili lata, by je przestudiować. W związku z tym sprawa trafiła na [ROOT.GetCountry.GetGovernment.GetCourtTitle|l], który ma się zająć wprowadzeniem zakazu przetłumaczonej literatury, aby [ROOT.GetCountry.GetFlavorRank|l] i jego elity mogły zachować prestiż."
 culture_greek.26.a: "Pospólstwo też ma prawo do nauki."
 culture_greek.26.b: "Zrobimy wszystko, by [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ka elita zachowała swój wyższy status."
 culture_greek.27.title: "[target_character.GetNameWithNoTooltip] domaga się triumfu"
 culture_greek.27.desc: "[target_character.GetName] powraca po kolejnym wspaniałym zwycięstwie, przemierzając ulice miasta [target_capital.GetName] w otoczeniu wiwatującego tłumu oraz licznej straży złożonej ze swych najbardziej lojalnych żołnierzy, którzy chronią [Select_CString(target_character.IsFemale,'ją','go')] przed wszelkim niebezpieczeństwem.\n\nPo dotarciu na [ROOT.GetCountry.GetGovernment.GetCourtTitle] [target_character.GetName] żąda audiencji, na który władza niechętnie musi się zgodzić. Zebrani na dworze rywale i sojusznicy zostali zignorowani – wzrok gościa pada na tylko jedną osobę. [target_character2.GetName] ma zorganizować uroczystość w starym stylu na cześć wielkiego zwycięstwa. [target_character.GetName] nalega, by wszyscy poznali [target_character.GetHerHis] osiągnięcia, aby podnieść morale i wzbudzić strach u każdego, kto odważyłby się militarnie przeciwstawić państwu [ROOT.GetCountry.GetName]."
 culture_greek.27.a: "Triumf? Za dużo hałasu. Odrzucamy te żądania."
 culture_greek.27.b: "Jeśli jest to uroczystość ku chwale państwa [ROOT.GetCountry.GetNameWithNoTooltip], spełnimy tę prośbę."
 greek_culture_strategos_will_not_use_triumph_for_popularity: "[target_character.GetName] nie otrzyma triumfu, więc nie poczyni postępów w zamachu stanu, jeśli takowy planuje."
 greek_culture_progress_coup_attempt_if_strategos_is_disloyal: "[target_character.GetName] otrzyma triumf, więc może wykorzystać swoją popularność do przyspieszenia zamachu stanu, jeśli takowy planuje."
 culture_greek.28.title: "Ucieczka uczonych"
 culture_greek.28.desc_common: "Niestabilna sytuacja w państwie [ROOT.GetCountry.GetName] sprawiła, że wiele wykształconych osób postanowiło poszukać lepszego życia z dala od kryzysu, w jakim znajduje się nasze [ROOT.GetCountry.GetFlavorRank|l]."
 culture_greek.28.desc.a: "$culture_greek.28.desc_common$\n\n Pragną żyć w spokoju, by realizować swoje idee filozofii, prawa i religii. Takie życie, które nie zostanie im odebrane z dnia na dzień przez wojnę, głód czy śmierć. Dlatego wielu z tęsknotą wspomina o państwie [target_country.GetName] – bardziej prestiżowym i stabilnym kraju, które może zapewnić im upragniony dobrobyt. Dla wielu z nich [target_country.GetFlavorRank|l] [target_destination.GetName] to już cel migracji na stałe, co niepokoi nasz [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]. Uważają oni, że taka ucieczka to cios dla reputacji państwa [ROOT.GetCountry.GetNameWithNoTooltip], ponieważ jest to wyraźny dowód na naszą niezdolność do ochrony cennych obywateli, którzy nie są w stanie przetrwać w obecnych trudnych czasach."
 culture_greek.28.desc.b: "$culture_greek.28.desc_common$\n\n Chociaż nie mogą uciec do naszych najbliższych sąsiadów, opowiadają o wspaniałościach odległych krain, o których czytali: o tym, jak zwykli ludzie w państwie [scholar_country.1.GetName] żyją w luksusie, zamiast zmagać się z biedą jak tutaj. Mówią o władcach kraju [scholar_country2.GetName], którzy nie znęcają się nad swoimi poddanymi, lecz szanują ich prawa i traktują ich jak ludzi. Dodają też, że w państwie [scholar_country3.GetName] to nie tradycja, lecz innowacje napędzają społeczeństwo.\n\nChoć początkowo głosy te wydawały się nieszkodliwe, usłyszało w końcu o nich całe nasze [ROOT.GetCountry.GetFlavorRank|l], a to wywołuje niepokoje społeczne, które niepokoją nasz [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]."
 culture_greek.28.a: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 culture_greek.28.b: "Powstrzymajmy ich, zanim spróbują uciec kolejni."
 culture_greek.28.c: "Ich słowa powodują jeszcze większy niepokój."
 culture_greek.28.d: "Być może warto przeznaczyć część środków na zapobieganie kolejnym niepokojom."
 greek_culture_migration_largely_prevented: "Większość skutków [Concept('migration','migracji')|e] zostanie złagodzona"
 culture_greek.29.title: "[ShowBuildingTypeNameWithNoTooltip('orthodox_monastery')] prosi o pomoc"
 culture_greek.29.desc: "Mieszkańcy miasta [target_location.GetName] kierują się zasadami, na których opiera się [ROOT.GetCountry.GetReligion.GetName|l] i liczą, że [ROOT.GetCountry.GetReligion.GetGodName] wysłucha ich codziennych modlitw. Jednak z powodu braku wsparcia ze strony państwa [ROOT.GetCountry.GetName] i jego rządu, [ShowBuildingTypeName('orthodox_monastery')] w tej miejscowości pilnie potrzebuje nowych ozdób, aby właściwie zaprezentować swój uświęcony status. Z tego powodu tamtejsi księża wysłali wiadomość na nasz [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] i mają nadzieję, że [target_character.GetName] przekaże pieniądze na odpowiednie udekorowanie tego świętego miejsca tak z zewnątrz, jak i wewnątrz. Wyświadczenie takiej przysługi nie pozostanie niezauważone, udowadniając wszystkim, jak bardzo nasze [ROOT.GetCountry.GetFlavorRank|l] jest oddane każdej sprawie #L [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip|l][Select_CString(Or5(StringContains(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'wosł'),StringContains(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'sty'),StringContains(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'szaman'),StringContains(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'szinto'),StringContains(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'tonal')),'ej','kiej')]#!."
 culture_greek.29.a: "Otrzymają złoto na ozdoby."
 culture_greek.29.b: "[target_character.GetNameWithNoTooltip] nie ma pieniędzy na święte miejsce."
 culture_greek.29.c: "Nie będziemy szczędzić funduszy na [ShowReligionNameWithNoTooltip('orthodox')|l]."
 all_orthodox_pops_gain_satisfaction_in_location: "Wszystkie #L [ShowReligionAdjective('orthodox')|l]e#! [pops|el] zyskają [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] [Concept('pop_satisfaction','satysfakcji')|e]."
 culture_greek.30.title: "Dziedzictwo cesarstwa"
 culture_greek.30.desc: "Światło Wschodniego Cesarstwa Rzymskiego zgasło. Mimo to wielu naszych obywateli nazywa siebie Romajami, a [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] zdaje się przejmować zwyczaje dawnego Cesarstwa. To z kolei daje nam pewną legitymację do odzyskania części starożytnego imperium pod pretekstem prawowitego dziedzictwa. Wielu mieszkańców miasta [ROOT.GetCountry.GetCapital.GetName] wie o granicy kraju kończącej się na prowincji [target_province.GetName] i opowiada się za odzyskaniem tych ziem od państwa [target_country.GetName] – tamci ludzie nie mają prawa nazywać się spadkobiercami Rzymu. Wojskowi i [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] najwyraźniej podzielają tę opinię i zachęcają lud do wypowiedzenia wojny i odzyskania tego, co [ROOT.GetCountry.GetName] uważa słusznie za swoje."
 culture_greek.30.a: "Granice Rzymu zostaną odtworzone!"
 culture_greek.30.b: "Wojna jest niepotrzebna."
