l_polish:
 #Loc macros
 bra_hre_hyperlink: "[GetUniqueInternationalOrganization('hre').GetName]"
 bra_hre_hyperlink_no_tt: "[GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip]"
 bra_hre_emperor_hyperlink: "[GetUniqueInternationalOrganization('hre').GetLeaderTitle]"
 bra_hre_emperor_country_hyperlink: "[GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetName]"
 bra_wittelsbach_hyperlink: "[ShowDynastyName('wittelsbach_dynasty')]"
 bra_wittelsbach_hyperlink_no_tt: "[ShowDynastyNameWithNoTooltip('wittelsbach_dynasty')]"
 bra_askanier_hyperlink: "[ShowDynastyName('askanier_dynasty')]"
 bra_askanier_hyperlink_no_tt: "[ShowDynastyNameWithNoTooltip('askanier_dynasty')]"
 bra_variable_counter: "#Y [GetCountry('BRA').MakeScope.GetVariable('bra_wittelsbacher_investment_var').GetValue]#!"
 bra_neglect_variable_counter: "#Y [GetCountry('BRA').MakeScope.GetVariable('bra_wittelsbacher_neglect_var').GetValue]#!"
 bra_wittelsbacher_investment_var: "#Y Inwestycja Wittelsbachów#!"
 bra_wittelsbacher_neglect_var: "#Y Zaniedbanie Wittelsbachów#!"
 bra_change_investment_score_add: "Zyskujemy $VALUE|G0$ $bra_variable_counter$ w $bra_wittelsbacher_investment_var$"
 bra_change_investment_score_subtract: "Tracimy $VALUE|R0$ $bra_variable_counter$ w $bra_wittelsbacher_investment_var$"
 bra_change_neglect_score_add: "Zyskujemy $VALUE|G0$ – $bra_wittelsbacher_neglect_var$ $bra_neglect_variable_counter$"
 bra_change_neglect_score_subtract: "Tracimy $VALUE|R0$ – $bra_wittelsbacher_neglect_var$ $bra_neglect_variable_counter$"
 PRU_DEAL_WITH_ROBBER_BARONS_TOOLTIP_IN_PROGRESS: "Postępy: $PROGRESS$%\n$DAYS$, $DATE$"
 #Events
 turmoil_in_brandenburg.1.title: "[root_dynasty.GetNameWithNoTooltip] państwa [ROOT.GetCountry.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.1.desc.start: "Po tym jak w roku 1320 odszedł [GetCharacter('bra_heinrich_ii_askanier').GetName], ostatni członek rodu $bra_askanier_hyperlink$ państwa [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]kie ziemie przejął [GetCharacter('ubv_ludwig_iv_wittelsbach').GetName], obrany cesarz unii $bra_hre_hyperlink$. By zachować administrację nad północnymi ziemiami, jakie zajmowała grupa [ShowCultureGroupName('german_group')|l], [GetCharacter('ubv_ludwig_iv_wittelsbach').GetShortNameWithNoTooltip] zadbał o to, by marchię [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ką otrzymała osoba z jego rodu: [GetCharacter('bra_ludwig_v_wittelsbach').GetDaughterSon], [GetCharacter('bra_ludwig_v_wittelsbach').GetName]."
 turmoil_in_brandenburg.1.desc: "$turmoil_in_brandenburg.1.desc.start$\n\nTak w państwie [ROOT.GetCountry.GetNameWithNoTooltip] rozpoczęła się era dynastii $bra_wittelsbach_hyperlink$ i czasy problemów, gdy najwyższa władza – [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] – była zbyt młoda po przejęciu tronu, więc [GetCharacter('hnb_berthold_iv_henneberg_schleusingen').GetName] faktycznie sprawował rządy. Raubritterzy, problemy ekonomiczne oraz ogólne niezadowolenie ludności z tego, co czyni [ROOT.GetCountry.GetGovernment.GetRulerTitle|l], sprawiają, że [GetCharacter('bra_ludwig_v_wittelsbach').GetShortNameWithNoTooltip] nie ma łatwego życia, a ród $bra_wittelsbach_hyperlink_no_tt$ wydaje się nie dbać o swoje posiadłości na północy..."
 turmoil_in_brandenburg.1.desc.fallback: "$turmoil_in_brandenburg.1.desc.start$\n\nJednak [GetCharacter('bra_ludwig_v_wittelsbach').GetShortNameWithNoTooltip] krótko sprawował rządy. Teraz to [root_ruler.GetName] ma kontrolę nad państwem [ROOT.GetCountry.GetNameWithNoTooltip]. Ale [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] wciąż musi się martwić problemami gospodarczymi i raubritterami niszczącymi autorytet władzy, a ród $bra_wittelsbach_hyperlink$ wykazują niewielkie zainteresowanie zmianą obecnego statusu słabo rozwiniętej marchii..."
 turmoil_in_brandenburg.1.a: "Państwo [ROOT.GetCountry.GetNameWithNoTooltip] zwycięży!"
 turmoil_in_brandenburg.1.a.at: "[control|eU] nad naszym państwem się zmniejszy!"
 turmoil_in_brandenburg.1.a.bt: "Aby zażegnać tę katastrofę, musimy także rozwiązać kryzys dynastyczny i okiełznać chaos spowodowany działaniami raubritterów."
 turmoil_in_brandenburg.2.title: "Koniec epoki rodu $bra_wittelsbach_hyperlink_no_tt$"
 turmoil_in_brandenburg.2.desc: "Jako że żaden z członków dynastii $bra_wittelsbach_hyperlink$ nie sprawuje monarchistycznej władzy nad państwem [ROOT.GetCountry.GetName], era gospodarczej stagnacji i ciągłych zaniedbań wreszcie dobiegła końca. Teraz to w rękach nowych władców leży przywrócenie dobrobytu naszym obywatelom."
 turmoil_in_brandenburg.2.a: "Oby był to początek złotego wieku."
 turmoil_in_brandenburg.2.a.tt: "„$bra_wittelsbacher_investment_var$” oraz „$bra_wittelsbacher_neglect_var$” będą wyłączone."
 turmoil_in_brandenburg.3.title: "Fałszywy $name_waldemar$"
 turmoil_in_brandenburg.3.entry: "$turmoil_in_brandenburg.3.title$"
 turmoil_in_brandenburg.3.desc: "Z pozoru historia władcy organizującego własny pogrzeb, aby udać się na niezakłóconą pielgrzymkę i wrócić z niej, brzmi wiarygodnie, choć nieco dziwnie. Jednak w trakcie nowej kampanii o zdobycie tronu zaczęły pojawiać się w tej opowieści dziury. Ci, którzy twierdzą, że [GetCharacter('bra_waldemar_askanier').GetName] był im znany przed 1320 rokiem, zauważyli niewytłumaczalne zmiany osobowości...\n\nW końcu jednak, ku szokowi wszystkich, ujawniono, że [target_character.GetName] jest tylko zwykłym oszustem podszywającym się pod szanownego margrabiego!\n\nW jednej chwili predendent stracił wszelkie wsparcie, a [ROOT.GetCountry.GetGovernment.GetRuler.GetName] znów może bezsprzecznie panować."
 turmoil_in_brandenburg.3.a: "Oszust wśród nas... kto by pomyślał?"
 false_waldemar_imposter_protection_tt: "Waldemar gromadzi poparcie"
 turmoil_in_brandenburg.4.title: "Tyrania raubritterów"
 turmoil_in_brandenburg.4.desc: "Chronieni przez status prawny swojego lenna raubritterzy z państwa [ROOT.GetCountry.GetName] to [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], którzy nakładają paraliżujące opłaty i podatki na lokalną ludność. Choć może nimi kierować desperacja, jeśli nie ukrócimy tego procederu, ich działania utrudnią rozwój ziem [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]kich..."
 turmoil_in_brandenburg.4.a: "Trzeba się zająć raubritterami."
 turmoil_in_brandenburg.4.b: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 bra_peasants_revolt: "Rewolta chłopska"
 PRU_robber_barons_active_tt: "Raubritterzy są aktywni"
 turmoil_in_brandenburg.5.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] wszczynają bunt"
 turmoil_in_brandenburg.5.desc: "Przez ekonomiczny upadek kraju [ROOT.GetCountry.GetName] [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] są rozgoryczeni i wściekli. Odmawiają pracy na polach, dopóki ich żądania dotyczące rozprawy z raubritterami nie zostaną spełnione..."
 turmoil_in_brandenburg.5.a: "Poprawmy ich sytuację."
 turmoil_in_brandenburg.5.b: "To tylko chłopi. Nie będą sprawiać kłopotów."
 turmoil_in_brandenburg.6.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] przejmują kontrolę"
 turmoil_in_brandenburg.6.desc: "Chociaż na papierze władza należy do rodu $bra_wittelsbach_hyperlink$, faktyczne rządy sprawują ci, którzy mają poparcie mas. W wiejskich osadach są to [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l]. Jeśli chcemy zachować jakikolwiek autorytet na naszej ziemi, musimy odebrać go duchownym..."
 turmoil_in_brandenburg.6.a: "Pozbawić ich władzy."
 turmoil_in_brandenburg.6.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] nie będą niepokojeni."
 turmoil_in_brandenburg.7.title: "Odmowa płacenia podatków miejskich"
 turmoil_in_brandenburg.7.desc: "[ROOT.GetCountry.GetName|U] jest w kiepskiej kondycji. Ziemie są słabo zaludnione i jeszcze słabiej rozwinięte. Większość [ROOT.GetCountry.GetAdjectiveWithNoTooltip]kich instytucji jest opłacana z podatków nakładanych na miasta i miasteczka. Jednak [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] odmawiają płacenia swojej części naszemu państwu, ponieważ nie widzą powodu, by uznawać ród $bra_wittelsbach_hyperlink$ za suwerena..."
 turmoil_in_brandenburg.7.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] się ukorzą."
 turmoil_in_brandenburg.7.b: "$common_string_leave_them_be$"
 turmoil_in_brandenburg.8.title: "[target_character.GetShortNameWithNoTooltip] i [Select_CString(target_character.IsFemale,'jej','jego')] domena prywatna"
 turmoil_in_brandenburg.8.desc: "Raporty z lokacji [target_location.GetName] donoszą, że [target_character.GetName] rządzi swymi włościami, jakby to było [Select_CString(target_character.IsFemale,'jej','jego')] własne [ROOT.GetCountry.GetFlavorRank|l]. Zamkowe mury rosną coraz wyżej, fosy stają się coraz szersze, a zbrojni odpowiadają tylko przed [Select_CString(target_character.IsFemale,'nią','nim')]. Petycje, które powinny trafiać na [ROOT.GetCountry.GetGovernment.GetCourtTitle|l], są rozpatrywane w [Select_CString(target_character.IsFemale,'jej','jego')] komnatach, a cła i podatki, które niegdyś [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'otrzymywała','otrzymywał')] [ROOT.GetCountry.GetGovernment.GetRulerTitle|l], teraz wypełniają [Select_CString(target_character.IsFemale,'jej','jego')] kufry. Dla wielu różnica pomiędzy ziemiami państwa [ROOT.GetCountry.GetName] a prywatną domeną, gdzie rządzi [target_character.GetShortNameWithNoTooltip], niebezpiecznie się zaciera..."
 turmoil_in_brandenburg.8.a: "Na razie będziemy to tolerować."
 turmoil_in_brandenburg.8.b: "Nikt nie jest ważniejszy niż [ROOT.GetCountry.GetGovernment.GetRulerTitle|l]."
 tib_outcome_8_1_tt: "Nasi agenci sprawią, że [target_character.GetShortNameWithNoTooltip] nie będzie już kłopotem"
 tib_outcome_8_2_tt: "[ShowEstateTypeName('nobles_estate')] z lokacji [target_location.GetName] będą wściekli z powodu naszej interwencji"
 tib_outcome_8_3_tt: "Nasza decyzja zepsuje relacje, jakie mamy my i [ShowEstateTypeName('nobles_estate')|l] z całego królestwa"
 turmoil_in_brandenburg.9.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')], liga i [target_province.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.9.desc: "Kilka możnych rodów z prowincji [target_province.GetName] zawiązało formalną ligę. Poprzysięgli sobie wzajemną ochronę, mają wspólne sądy oraz zgadzają się nie zezwolić na zwiększenie wpływów królewskich urzędników na ich sprawy.\n\nDla tamtejszych mieszkańców jest jasne, że prawdziwą władzę w prowincji [target_province.GetNameWithNoTooltip] sprawują [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], a nie [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] i [ROOT.GetCountry.GetCapital.GetName]. [Root.GetCountry.GetGovernment.GetCourtTitle] szepcze, że tolerowanie takich związków może jedynie przyspieszyć zanik władzy centralnej."
 turmoil_in_brandenburg.9.a: "Uznajmy ich unię i zdobądźmy przychylność."
 turmoil_in_brandenburg.9.b: "Rozbijmy tę klikę i przywróćmy władzę."
 nobles_in_target_province_gain_pop_satisfaction_extreme_bonus_tt: "[pops|e] należące do stanu [ShowEstateTypeName('nobles_estate')|l] pod naszymi rządami w prowincji [target_province.GetName] wielce uraduje nasze uznanie ich ligi i zyskają [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [Concept('pop_satisfaction','satysfakcji społeczności')|e]"
 lower_class_pop_satisfaction_weak_penalty_tt: "[Concept('lower_class','Klasę niższą')|e] prowincji [target_province.GetName] oburzy nieograniczona władza ich panów, tracąc przez to [ShowNamedValue('pop_satisfaction_weak_penalty')|+=2%] [Concept('pop_satisfaction','satysfakcji społeczności')|e]"
 nobles_in_target_province_may_agitate_locals_to_rebel_tt: "Upokorzeni [ShowEstateTypeName('nobles_estate')|l] z prowincji [target_province.GetName] w odpowiedzi na nasze twarde stanowisko mogą chcieć siać ferment wśród sobie poddanych"
 turmoil_in_brandenburg.10.title: "[target_location.GetNameWithNoTooltip] i bezprawne cła"
 turmoil_in_brandenburg.10.desc: "Kupcy narzekają, że drogi i mosty wokół lokacji [target_location.GetName] są pełne nowych rogatek, które przedsiębiorczy [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] stawiają bez królewskiej zgody. Zatrzymują wozy, liczą towary oraz żądają pieniędzy za #italic lokalną ochronę#!.\n\nKażdy wóz obłożony takim podatkiem sprawia, że [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] traci dochody, a [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] wpływy, gdyż prawo zdaje się pochodzić nie ze stolicy, lecz najbliższego zamku."
 turmoil_in_brandenburg.10.a: "Przymknijmy oko na te cła."
 turmoil_in_brandenburg.10.b: "Rozprawmy się z nimi i wymuśmy nasze prawa."
 turmoil_in_brandenburg.11.title: "Ród [target_dynasty_1.GetNameWithNoTooltip] rzuca wyzwanie dynastii [target_dynasty_2.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.11.desc: "Rosną napięcia pomiędzy dynastią [target_dynasty_1.GetName] a naszym własnym rodem [target_dynasty_2.GetName]. W czasie uczt, polowań i obrad ich przywódcy kwestionują osądy oraz linię, z której [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] się wywodzi, sugerując, że ich krew nie gorzej nadaje się do rządzenia państwem [ROOT.GetCountry.GetName].\n\nTo, co zaczęło się jako ciche przytyki, urosło do otwartej rywalizacji o prestiż, klientów i wpływy na dworze. Jeśli jej się nie przeciwstawimy, pomniejsi panowie mogą uznać, że nasza dynastia to tylko jeden z wielu rodów szlacheckich."
 turmoil_in_brandenburg.11.a: "[ROOT.GetCountry.GetGovernment.GetRulerTitle|l] ma nasze pełne poparcie."
 turmoil_in_brandenburg.11.b: "Kupmy pokój ustępstwami wobec dynastii [target_dynasty_1.GetNameWithNoTooltip]."
 target_character_2_will_challenge_the_power_nobles_tt: "[target_character_2.GetName] bezpośrednio zapyta o żądania władzy, jakie wyrażają [ShowEstateTypeName('nobles_estate')|l]."
 turmoil_in_brandenburg.12.title: "[target_location.GetNameWithNoTooltip] i inwestycje"
 turmoil_in_brandenburg.12.desc: "Doradcy przedstawiają plan, w myśl którego [target_location.GetName] i okoliczne ziemie prowincji [target_province.GetName] otrzymają fundusze królewskie. Nowe drogi, rynki oraz urzędy, jakie sfinansuje [ROOT.GetCountry.GetGovernment.GetRulerTitle|l], poniosą [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'jej','jego')] imię w lud, osłabiając kontrolę, jaką mają lokalni magnaci nad handlem i sądami.\n\nJednak sami [ShowEstateTypeName('nobles_estate')|l] twierdzą, że tego typu inwestycje powinny pochodzić z ich rąk, a nie naszych, i ostrzegają, że mieszanie się władz centralnych w ich domeny jedynie wywoła opór."
 turmoil_in_brandenburg.12.a: "Zainwestujmy zasoby korony i wzmocnijmy kontrolę."
 turmoil_in_brandenburg.12.b: "Ta kwestia i tak była nas niegodna."
 turmoil_in_brandenburg.13.title: "[target_location.GetNameWithNoTooltip] – rozwój"
 turmoil_in_brandenburg.13.desc: "Notable z lokacji [target_location.GetName] poprosili [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] o inwestycję. Argumentują, że nowe ulice, siedziby gildii oraz miejsca publiczne zwiążą bliżej prowincję [target_province.GetName] z państwem [ROOT.GetCountry.GetName], kojąc niezadowolenie lokalnych mieszkańców.\n\nNasi skarbnicy ostrzegają jednak, że taki rozmach wstrząśnie budżetem i może być postrzegany jako zbyteczny przez prowincje czekające na swoją kolej."
 turmoil_in_brandenburg.13.a: "Będziemy inwestować w całą prowincję [target_province.GetNameWithNoTooltip]."
 turmoil_in_brandenburg.13.b: "Skoncentrujmy się na lokacji [target_location.GetNameWithNoTooltip]."
 turmoil_in_brandenburg.13.c: "Nie możemy pozwolić sobie na taką hojność."
 every_location_in_target_province_gains_center_of_urbanization_modifier_tt: "Każda [location|el] w prowincji [target_province.GetName] otrzyma [modifier|el] „[GetModifier('center_of_urbanization_modifier').GetNameWithTooltip]” na [ShowNamedValue('modifier_duration_years_very_short')] l."
 every_location_in_target_province_gains_flourishing_capital_modifier: "Każda [location|el] w prowincji [target_province.GetName] otrzyma [modifier|el] „[GetModifier('flourishing_capital_modifier').GetNameWithTooltip]” na [ShowNamedValue('modifier_duration_years_very_short')] l."
 every_location_in_target_province_gains_development_mild_bonus: "Każda [location|el] w prowincji [target_province.GetName] zyska [ShowNamedValue('development_weak_bonus')|+=] [Concept('development','rozwoju')|e]"
 every_location_in_target_province_gains_prosperity_extreme_bonus: "Każda [location|el] w prowincji [target_province.GetName] zyska [ShowNamedValue('prosperity_severe_bonus')|+=2%] [Concept('prosperity','dobrobytu')|e]"
 turmoil_in_brandenburg.100.title: "Dynastia $bra_wittelsbach_hyperlink_no_tt$ ożywia kraj [ROOT.GetCountry.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.100.entry: "$turmoil_in_brandenburg.100.title$"
 turmoil_in_brandenburg.100.desc: "Po latach biedy i zniszczeń, latach autonomicznych posiadłości i tyranii raubritterów, latach wyzwań i pretendentów, ród $bra_wittelsbach_hyperlink$ wreszcie zwyciężył, a [ROOT.GetCountry.GetFlavorRank|l] [ROOT.GetCountry.GetName] to klejnot regionu [ShowRegionName('north_german_region')]. Niech żyje [target_character.GetName]!"
 turmoil_in_brandenburg.100.a: "Państwo [ROOT.GetCountry.GetNameWithNoTooltip] stanie się dumą dynastii $bra_wittelsbach_hyperlink_no_tt$."
 turmoil_in_brandenburg.200.title: "[target_character.GetNameWithNoTooltip] i tajemnice"
 turmoil_in_brandenburg.200.desc: "Ta śmierć była szybka i niespodziewana, ale dziedzictwo nieboszczyka wciąż nawiedza państwo [ROOT.GetCountry.GetName]. [target_character.GetName], rzekomy $bra_askanier_hyperlink$ rządzący krajem [ROOT.GetCountry.GetFlavorRank] do 1320 roku, okazał się najbardziej zwodniczym oszustem i intrygantem w [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]kiej historii!\n\nNa pogrzebie rozkopano stary grób zmarłego, by wreszcie mógł spocząć w pokoju. Jednak ceremonię przerwano, gdy znaleziono szkielet, którym okazał się [GetCharacter('bra_waldemar_askanier').GetName] – #italic $name_waldemar$#!.\n\nBył to wielki wstyd dla państwa [ROOT.GetCountry.GetNameWithNoTooltip], ponieważ jeden zwyczajny człowiek zdołał oszukać cały naród..."
 turmoil_in_brandenburg.200.a: "Jak to się mogło stać? Powinniśmy być mądrzejsi..."
 turmoil_in_brandenburg.300.title: "Kończy się odwieczna wojna"
 turmoil_in_brandenburg.300.entry: "$turmoil_in_brandenburg.300.title$"
 turmoil_in_brandenburg.300.desc: "Nasza wieloletnia walka o ujarzmienie i podporządkowanie państwa [ROOT.GetCountry.GetLongName] dobiegła wreszcie końca. Dynastie rywalizujące o naszą siedzibę zostały pokonane, a ostatnie twierdze raubritterów zrównane z ziemią. Nasze zdecydowane działanie daje nam okazję przekształcenia tego kraju na naszą korzyść i stworzenia administracji, która łatwiej poradzi sobie z takimi nieszczęściami w przyszłości."
 turmoil_in_brandenburg.300.a: "Wreszcie pokój."
 turmoil_in_brandenburg.1000.title: "[target_character.GetNameWithNoTooltip] powraca"
 turmoil_in_brandenburg.1000.entry: "Powrót wskazanej postaci"
 turmoil_in_brandenburg.1000.desc: "Ponieważ żaden cesarz unii $bra_hre_hyperlink$ nie jest już związany z rządzącą dynastią $bra_wittelsbach_hyperlink$, po raz kolejny poddano w wątpliwość prawo do rządzenia, jakie posiada [bra_ruler.GetName]. Ludność kraju [ROOT.GetCountry.GetName] tęskni za epoką władzy rodu $bra_askanier_hyperlink$.\n\nLos chciał, że uznany za zmarłego [target_character.GetName] publicznie zmartwychwstał! Twierdzi, że upozorował własny pogrzeb, by udać się do Ziemi Świętej. [target_character.GetShortNameWithNoTooltip] powrócił, by przejąć #L [ROOT.GetCountry.GetAdjective|l]ki#! tron, na którym zasiada [bra_ruler.GetShortNameWithNoTooltip]."
 turmoil_in_brandenburg.1000.desc.emperor_supports: "$turmoil_in_brandenburg.1000.desc$\n\nNa szczęście [emperor_ruler.GetName] i [bra_ruler.GetShortNameWithNoTooltip] są w życzliwych stosunkach. W związku z tym $bra_hre_emperor_hyperlink$ wspiera ród $bra_wittelsbach_hyperlink_no_tt$, przeciwstawiając się pretendentowi."
 turmoil_in_brandenburg.1000.desc.emperor_rejects: "$flavor_bra_dynasty.1000.desc$\n\nNiestety $bra_hre_emperor_hyperlink$ woli dynastię $bra_askanier_hyperlink_no_tt$ zamiast rodu $bra_wittelsbach_hyperlink_no_tt$. Dlatego [emperor_ruler.GetName] przekazuje prawo do rządzenia państwem [bra_country.GetNameWithNoTooltip] i to [target_character.GetShortNameWithNoTooltip] ma zasiąść na tronie. Jeśli jednak [emperor_ruler.GetNameWithNoTooltip] zawrze z nami układ, [target_character.GetShortNameWithNoTooltip] nie będzie stanowić zagrożenia..."
 turmoil_in_brandenburg.1000.a: "$bra_hre_emperor_hyperlink$ wysłucha naszego poselstwa!"
 turmoil_in_brandenburg.1000.a.at: "Każdy kraj, w którym rządzi członek rodu $bra_wittelsbach_hyperlink$, zyskuje [ShowBiasValue('opinion_support_our_dynasty_member')|+0] [Concept('opinion','opinii')|e] o państwie [ROOT.GetCountry.GetName]"
 turmoil_in_brandenburg.1000.a.tt: "[emperor_country.GetName] otrzyma prośbę o pomoc w rozprawieniu się z pretendentem. Cały proces potrwa #Y 2 lata#! i będziemy zmuszeni spełnić warunki, jakie postawi $bra_hre_emperor_hyperlink$, chyba że ma o nas [Concept('opinion','opinię')|e] przewyższającą #Y 100#! pkt."
 turmoil_in_brandenburg.1000.b: "Sami zabijemy pretendenta!"
 turmoil_in_brandenburg.1000.b.tt: "Postaramy się, by [target_character.GetName] [Select_CString(target_character.IsFemale,'zginęła','zginął')]. Jeśli nam się powiedzie, [bra_ruler.GetName] odzyska prawo do rządzenia, a $bra_variable_counter$ przesunie się o #Y +5#! pkt. w stronę „$bra_wittelsbacher_investment_var$”.\nJeśli nam się nie powiedzie, wybuchnie [civil_war|e]."
 turmoil_in_brandenburg.1000.c: "Abdykujmy na rzecz prawdziwego władcy państwa [ROOT.GetCountry.GetNameWithNoTooltip]."
 turmoil_in_brandenburg.1000.c.at: "Każdy kraj, w którym rządzi członek rodu $bra_wittelsbach_hyperlink$, zyskuje: [ShowBiasValue('opinion_ousted_our_dynasty_member')|+0] [Concept('opinion','opinii')|e] o państwie [ROOT.GetCountry.GetName]"
 turmoil_in_brandenburg.false_waldemar_rebel.tt: "[ShowPopTypeName('nobles')] z maksymalnie #Y 4#! najbardziej zaludnionych posiadanych lokacji otrzymują następujące efekty:\n – tracą [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] [Concept('pop_satisfaction','satysfakcji')|e]\n – dołączają do frakcji, której przewodzi [false_waldemar_rebel.GetName]"
 turmoil_in_brandenburg.1001.title: "[target_character.GetShortNameWithNoTooltip] wywołuje bunt w państwie [bra_country.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.1001.desc.imposter_revealed: "Ambasador z kraju [bra_country.GetName] przybył na nasz wielki dwór, by prosić o wsparcie przeciwko rosnącemu w siłę pretendentowi i rywalowi, z którym zmaga się [bra_ruler.GetName]. Najwyraźniej samozwańczy „[target_character.GetName]” twierdzi, że powrócił z pielgrzymki do Ziemi Świętej, a teraz domaga się tronu [bra_country.GetAdjectiveWithNoTooltip|l]kiego.\n\nJednak dotarły do nas wieści o oszustwie, ponieważ ten „$name_waldemar$” jest zwykłym samozwańcem!"
 turmoil_in_brandenburg.1001.desc: "Ambasador z kraju [bra_country.GetName] przybył na nasz dwór z prośbą o wsparcie w konflikcie dynastycznym. Były władca państwa [bra_country.GetNameWithNoTooltip], [target_character.GetName], powrócił z długiej pielgrzymki do Ziemi Świętej, a teraz ponownie odzyskuje tron #L [bra_country.GetAdjective|l]ki#! dla siebie. [bra_ruler.GetName] znajduje niewielkie poparcie wśród poddanych i zgłasza gotowość do negocjacji z nami w zamian za nasze wsparcie przeciwko pretendentowi."
 turmoil_in_brandenburg.1001.help.tt: "[target_character.GetName] zostanie wygnany z państwa [bra_country.GetName], a [modifier|e] „[ShowModifier('bra_waldemar_rallies_nobility')]” zostanie usunięty."
 turmoil_in_brandenburg.1001.a: "Będziemy wspierać tę sprawę w zamian za złoto."
 turmoil_in_brandenburg.1001.a.tt: "Otrzymamy [ROOT.GetVariable('bra_gold_tooltip_var').GetValue|+=2] [Concept('gold','złota')|e] od państwa [bra_country.GetName] za #Y 1 rok#!"
 turmoil_in_brandenburg.1001.b: "Ręka rękę myje. Pomóżmy im!"
 turmoil_in_brandenburg.1001.b.tt: "[bra_country.GetName] zagłosuje na nas za #Y 1 rok#!"
 turmoil_in_brandenburg.1001.c: "Ród $bra_wittelsbach_hyperlink_no_tt$ otrzyma naszą pomoc w zamian za ich wsparcie polityczne."
 turmoil_in_brandenburg.1001.c.tt: "Za #Y 1 rok#! otrzymamy [ShowBiasValue('opinion_supported_the_wittelsbacher')|+=0] [Concept('opinion','opinii')|e] u wszystkich [Concept('countries','państw')|e], w których rządzi [dynasty|e] $bra_wittelsbach_hyperlink$"
 turmoil_in_brandenburg.1001.d: "Ród $bra_wittelsbach_hyperlink_no_tt$ otrzyma wsparcie."
 turmoil_in_brandenburg.1001.d.tt: "Nie poprosimy o nic w zamian."
 turmoil_in_brandenburg.1001.e: "Nic nie zyskamy, pomagając dynastii $bra_wittelsbach_hyperlink_no_tt$."
 turmoil_in_brandenburg.1001.e.tt: "Odrzucimy poparcie dla rodu $bra_wittelsbach_hyperlink$, obniżając [Concept('opinion','opinię')|e] we wszystkich [Concept('countries','krajach')|e], w których rządzi [dynasty|e] $bra_wittelsbach_hyperlink_no_tt$ o [ShowBiasValue('opinion_rejected_helping_wittelsbacher')|+=0], ale poprawiając opinię wszystkich krajów zrządzonych przez dynastię $bra_askanier_hyperlink$ o [ShowBiasValue('opinion_rejected_helping_wittelsbacher_askanier')|+=0] za #Y 1 rok#!"
 turmoil_in_brandenburg.1001.zzz: "[bra_ruler.GetShortNameWithNoTooltip] może wymierzać sprawiedliwość wedle własnej woli."
 turmoil_in_brandenburg.1001.zzz.tt: "[bra_country.GetName] może zdecydować, z jakimi konsekwencjami zmierzy się [target_character.GetName]"
 turmoil_in_brandenburg.1002.title: "$bra_hre_emperor_hyperlink$ udziela wsparcia"
 turmoil_in_brandenburg.1002.desc: "Na nasz dwór dotarły wspaniałe wieści! $bra_hre_emperor_hyperlink$, [emperor_ruler.GetName] państwa [emperor_country.GetName], szczerze popiera walkę, jaką prowadzi [bra_ruler.GetName], próbując nie dopuścić, by samozwaniec, [target_character.GetName], objął tron!"
 turmoil_in_brandenburg.1002.desc.gold: "$turmoil_in_brandenburg.1002.desc$\n\nOczywiście takie wsparcie nie jest darmowe. [emperor_ruler.GetShortNameWithNoTooltip] podkreśla, jakim obciążeniem byłoby dla cesarskiego skarbca. W tej sytuacji oczekuje [emperor_ruler.GetHeShe] w zamian daniny w wysokości [ROOT.GetVariable('bra_owes_gold').GetValue|V2] szt. złota."
 turmoil_in_brandenburg.1002.desc.loyalty: "$turmoil_in_brandenburg.1002.desc$\n\nTakie wsparcie oczywiście nie jest darmowe. [emperor_ruler.GetShortNameWithNoTooltip] chce zabezpieczyć swoje prawa do sukcesji w państwie $bra_hre_hyperlink$ i oczekuje pełnej lojalności wobec swej dynastii, gdy nadejdzie pora na zajęcie cesarskiego tronu."
 turmoil_in_brandenburg.1002.desc.relations: "$turmoil_in_brandenburg.1002.desc$\n\nTakie wsparcie oczywiście nie jest darmowe. [emperor_ruler.GetShortNameWithNoTooltip] liczy, że będziemy sławić cesarski ród i [emperor_country.GetNameWithNoTooltip] wśród wszystkich członków dynastii $bra_wittelsbach_hyperlink$."
 turmoil_in_brandenburg.1002.desc.free: "$turmoil_in_brandenburg.1002.desc$\n\nKu naszemu zaskoczeniu $bra_hre_emperor_hyperlink$ nie oczekuje niczego w zamian. Udzieli nam pomocy z dobroci serca, nie oczekując niczego w zamian."
 turmoil_in_brandenburg.1002.a: "Wreszcie autorytet rodu $bra_wittelsbach_hyperlink_no_tt$ został odbudowany!"
 turmoil_in_brandenburg.1002.a.tt: "Każdy [country|e], w którym rządzi [dynasty|e] $bra_wittelsbach_hyperlink$, zyskuje [ShowBiasValue('opinion_supported_the_wittelsbacher')|0] [Concept('opinion','opinii')|e] o państwie [emperor_country.GetName]"
 turmoil_in_brandenburg.1003.title: "Cesarz odmawia udzielenia wsparcia"
 turmoil_in_brandenburg.1003.desc.dead: "$bra_hre_emperor_hyperlink$ najwyraźniej podjął decyzję. [emperor_ruler.GetName] zajął wrogą pozycję wobec nas podczas swego panowania, ale jej powody stanowią tajemnicę dla wszystkich prócz niego samego. Tym samym [target_character.GetName] pozostaje [Select_CString(target_character.IsFemale,'niezagrożona','niezagrożony')]..."
 turmoil_in_brandenburg.1003.desc.wittelsbach: "Straszne wieści dotarły na nasz dwór! [target_character.GetName] wciąż sieje chaos, a $bra_hre_emperor_hyperlink$ w końcu zajmuje stanowisko w tej sprawie. Pomimo rodzinnych powiązań z dynastią [emperor_ruler.GetName] nie udzieli wsparcia, którego potrzebuje [bra_ruler.GetName] i otwarcie sprzeciwia się własnemu rodowi!"
 turmoil_in_brandenburg.1003.desc: "Straszne wieści dotarły na nasz dwór! [target_character.GetName] wciąż sieje chaos, a $bra_hre_emperor_hyperlink$ w końcu zajmuje stanowisko w tej sprawie: [emperor_ruler.GetName] nie udzieli wsparcia, którego potrzebuje [bra_ruler.GetName], i otwarcie sprzeciwia się rodowi $bra_wittelsbach_hyperlink_no_tt$!"
 turmoil_in_brandenburg.1003.a: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] jest w sytuacji nie do pozazdroszczenia..."
 turmoil_in_brandenburg.1003.a.tt: "Każdy [country|e], w którym rządzi [dynasty|e] $bra_wittelsbach_hyperlink$, traci [ShowBiasValue('opinion_rejected_helping_wittelsbacher')|+=0] [Concept('opinion','opinii')|e] na temat państwa [emperor_country.GetName], zaś każdy kraj, w którym rządzi dynastia $bra_askanier_hyperlink$, zyskuje [ShowBiasValue('opinion_rejected_helping_wittelsbacher_askanier')|+=0] opinii o tym państwie"
 turmoil_in_brandenburg.1004.title: "$bra_hre_emperor_hyperlink$ udziela bezwarunkowego wsparcia"
 turmoil_in_brandenburg.1004.desc: "Wieści z państwa $bra_hre_emperor_country_hyperlink$ dotarły na nasz dwór. W związku z niehonorowymi działaniami, jakie podejmuje [target_character.GetName], $bra_hre_emperor_hyperlink$ przyznaje nam bezwarunkowe prawo do rozprawienia się z oszustem według własnego uznania."
 turmoil_in_brandenburg.1004.a: "Wypędzić [target_character.GetHimHer|l]."
 turmoil_in_brandenburg.1004.b: "Stracić [target_character.GetHimHer|l]."
 turmoil_in_brandenburg.1004.c: "Właściwie [target_character.GetHisHer|l] umiejętności mogą się nam przydać..."
 turmoil_in_brandenburg.1004.c.tt: "[target_character.GetName] otrzyma drugą szansę i może otrzymać posadę w naszym gabinecie"
 turmoil_in_brandenburg.1005.title: "Wątpliwa autentyczność"
 turmoil_in_brandenburg.1005.desc: "Rządy dynastii $bra_wittelsbach_hyperlink$ zakończyły się, a wspaniały ród $bra_askanier_hyperlink$ wreszcie powraca do państwa [bra_country.GetName]. Jednak mimo koronacji [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] wzbudza podejrzenia. [target_character.GetName] nie pamięta swoich osiągnięć sprzed rzekomo fałszywego pogrzebu. Członkowie rodu $bra_askanier_hyperlink_no_tt$ zauważają niewytłumaczalne zmiany w wyglądzie ukochanego członka rodziny, a nawet styl rządzenia zdecydowanie różni się od poprzedniego. [target_character.GetShortNameWithNoTooltip] obwinia za te niespójności przeżycia podczas swojej pielgrzymki do Ziemi Świętej..."
 turmoil_in_brandenburg.1005.a: "Rozpocznijmy dochodzenie i sprawdźmy, czy mówi prawdę."
 turmoil_in_brandenburg.1005.a.tt: "Rozpoczyna się dochodzenie, które ujawni, czy [target_character.GetName] naprawdę ma związki z dynastią $bra_askanier_hyperlink$..."
 turmoil_in_brandenburg.1005.b: "To tylko niesprawdzone pogłoski..."
 turmoil_in_brandenburg.1006.title: "[target_character.GetShortNameWithNoTooltip] – wynik dochodzenia"
 turmoil_in_brandenburg.1006.desc: "Po dwóch latach badań, śledztw i porównywania dokumentów sprawa autentyczności pochodzenia, którym legitymuje się [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [target_character.GetName], wreszcie znalazła swój koniec."
 turmoil_in_brandenburg.1006.desc.true_askanier: "$turmoil_in_brandenburg.1006.desc$\n\nZgodnie z wynikami dochodzenia [target_character.GetName] rzeczywiście należy do dynastii $bra_askanier_hyperlink$, choć nie jest to prawdziwy [GetCharacter('bra_waldemar_askanier').GetName], za którego się podaje. Rzeczywiście nosi to samo imię, co nasz nieżyjący margrabia, ale okazuje się, że doszło do pomyłki i nie jest to ten sam $name_waldemar$."
 turmoil_in_brandenburg.1006.desc.false_askanier: "$turmoil_in_brandenburg.1006.desc$\n\nPomimo najlepszych starań, by utrzymać tę farsę, kłamstwa wreszcie wyszły na jaw w konfrontacji z faktami. [target_character.GetShortNameWithNoTooltip] to zwykły oszust, który przekonał cały dwór, a nawet członków rodu $bra_askanier_hyperlink$, że [GetCharacter('bra_waldemar_askanier').GetName] wciąż żyje i ma się dobrze. Dwór [bra_country.GetAdjectiveWithNoTooltip|l]ki wyraża głośne oburzenie, a różne organy rządowe domagają się rozwiązania problemu."
 turmoil_in_brandenburg.1006.a: "Podobieństwa były po prostu uderzające!"
 turmoil_in_brandenburg.1006.a.tt: "[target_character.GetName] i każdy potomek zmienią swoją [Concept('dynasty','dynastię')|e] na $bra_askanier_hyperlink$"
 turmoil_in_brandenburg.1006.b: "Przynajmniej nie należy do rodu $bra_wittelsbach_hyperlink_no_tt$..."
 turmoil_in_brandenburg.1006.b.tt: "[target_character.GetName] i każdy potomek zmienią swoją [Concept('dynasty','dynastię')|e] na [target_dynasty.GetName]"
 turmoil_in_brandenburg.1006.c: "Usunąć oszusta!"
 turmoil_in_brandenburg.1007.title: "Fałszywy [target_character.GetNameWithNoTooltip] zostaje stracony"
 turmoil_in_brandenburg.1007.desc.successful_execution: "[target_character.GetName] został schwytany i osadzony w więzieniu przez lojalistów uważających, że władzę prawowicie sprawuje [bra_ruler.GetName]. Ponadto [emperor_ruler.GetName] udzielił nam swego przyzwolenia na wcześniejsze działania, oszczędzając nam surowszych konsekwencji. Jak się okazało, [target_character.GetShortNameWithNoTooltip] nie należy do rodu $bra_askanier_hyperlink$. Nie może nawet się pochwalić tym samym pochodzeniem, co [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]! Oskarżono go o oszustwo, zdradę oraz zagrożenie dla stabilności państwa [bra_country.GetName] i uznano winnym..."
 turmoil_in_brandenburg.1007.desc.failed_execution: "W środku nocy [target_character.GetName] został schwytany i uwięziony w mieście [bra_country.GetCapital.GetName], gdzie miał zostać stracony o świcie. Jednak [target_character.GetShortNameWithNoTooltip] okazał się przebiegły i przewidział nasze ruchy. Po schwytaniu oszusta [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] wkroczyli w wielkiej liczbie do pałacowych lochów, by go uwolnić.\n\nTeraz państwo [bra_country.GetName] stoi w obliczu wojny domowej, której wyniku nie sposób przewidzieć. Słabą pociechą w naszej katastrofalnej sytuacji jest to, że [emperor_ruler.GetName] wyraża pasywne poparcie dla naszej decyzji o straceniu."
 turmoil_in_brandenburg.1007.a: "Kolejny kryzys zażegnany."
 turmoil_in_brandenburg.1007.b: "Do broni!"
 bra_true_waldemar_identity_reveal_tt: "#italic Dowiemy się, kim naprawdę jest [target_character.GetName]...#!"
 turmoil_in_brandenburg.false_waldemar_big_rebel.tt: "[ShowPopTypeName('nobles')] z maksymalnie #Y 12#! najbardziej zaludnionych posiadanych lokacji otrzymują następujące efekty:\n – tracą [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] [Concept('pop_satisfaction','satysfakcji')|e]\n – dołączają do frakcji, której przewodzi [false_waldemar_rebel.GetName]"
 false_waldemar_rebel: "$name_waldemar$ ma wsparcie"
 turmoil_in_brandenburg.1100.title: "Zaniedbania w kraju [root_country.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.1100.entry: "Zaniedbania w kraju"
 turmoil_in_brandenburg.1100.desc: "Ziemie państwa [root_country.GetName] zawsze były raczej słabo rozwinięte. Jednak nawet w najgorszych czasach kraj [root_country.GetNameWithNoTooltip] nigdy nie był tak zniszczony jak pod rządami rodu $bra_wittelsbach_hyperlink$.\n\nWieści o tej kiepskiej sytuacji słyszy nawet $bra_hre_emperor_hyperlink$. Nie wiadomo, jak długo [root_ruler.GetName] będzie jeszcze rządzić tymi włościami..."
 turmoil_in_brandenburg.1100.a: "$bra_hre_emperor_hyperlink$ z pewnością zrozumie nasze położenie."
 turmoil_in_brandenburg.1100.a.tt: "$bra_hre_emperor_hyperlink$ zadecyduje o naszym losie. $bra_hre_emperor_hyperlink$ może mianować nowego władcę z innej dynastii."
 turmoil_in_brandenburg.1101.title: "Ród $bra_wittelsbach_hyperlink_no_tt$ zawiódł $bra_hre_hyperlink_no_tt$"
 turmoil_in_brandenburg.1101.desc: "Państwo jednego z naszych elektorów – [root_country.GetFlavorRank|l] [root_country.GetName] – okazuje się w marnej sytuacji. Ziemiami rządzą lokalni raubritterzy, gospodarka jest w rozsypce, a [root_country.GetGovernment.GetRulerTitle|l], [root_ruler.GetName] dopuszcza się zaniedbań, przez co te ziemie są solą w oku kraju $bra_hre_hyperlink$. Ponieważ to my jako $bra_hre_emperor_hyperlink$ $bra_hre_hyperlink_no_tt$ sprawujemy najwyższą władzę, więc nie możemy dłużej pozwalać na tak słabe rządy."
 turmoil_in_brandenburg.1101.a: "Państwo [root_country.GetFlavorRank] znajdzie się pod naszą bezpośrednią kontrolą."
 turmoil_in_brandenburg.1101.a.tt: "[emperor_ruler.GetName] będzie [Concept('ruler','głową państwa')|e] [root_country.GetName], tworząc z nim [Concept('union','unię')|e]"
 turmoil_in_brandenburg.1101.b: "Niech [dynasty_character.GetNameWithNoTooltip] rządzi krajem [root_country.GetNameWithNoTooltip]."
 turmoil_in_brandenburg.1101.b.tt: "[dynasty_character.GetName] będzie [Concept('ruler','głową państwa')|e] [root_country.GetName]"
 turmoil_in_brandenburg.1101.c: "[cabinet_character.GetNameWithNoTooltip] będzie sprawować władzę w naszym imieniu."
 turmoil_in_brandenburg.1101.c.tt: "[cabinet_character.GetName] będzie [Concept('ruler','głową państwa')|e] [root_country.GetName], co oznacza, że od teraz jest to nasz [ShowSubjectTypeName('vassal')|l], ale spowoduje to wzrost [Concept('antagonism','antagonizmu')|e] członków unii [GetUniqueInternationalOrganization('hre').GetName] o [ShowBiasValue('subjugated_elector_antagonism')|-=0]."
 subjugated_elector_antagonism: "Podporządkowany elektor"
 turmoil_in_brandenburg.1101.d: "Jeden z naszych doradców poprawi sytuację w państwie [root_country.GetAdjectiveWithNoTooltip]kim."
 turmoil_in_brandenburg.1101.d.tt: "Miejscowy doradca z naszego dworu będzie [Concept('ruler','głową państwa')|e] [root_country.GetName]"
 turmoil_in_brandenburg.1101.e: "Dajmy spokój rodowi $bra_wittelsbach_hyperlink_no_tt$, poradzą sobie."
 turmoil_in_brandenburg.1101.e.tt: "Zostawimy dynastię $bra_wittelsbach_hyperlink$ w spokoju, zezwalając jej na dalsze rządy w kraju [root_country.GetName]"
 turmoil_in_brandenburg.1102.title: "$bra_hre_emperor_hyperlink$ wysyła odpowiedź"
 turmoil_in_brandenburg.1102.desc.wittelsbach: "Ambasador z kraju [emperor_country.GetName] przybywa na nasz dwór. Ogłasza, że ziemie państwa [root_country.GetName] zostaną przyłączone do państwa [emperor_country.GetNameWithNoTooltip], a władzę nad nimi otrzyma [emperor_ruler.GetName]."
 turmoil_in_brandenburg.1102.desc: "Ambasador z kraju [emperor_country.GetName] przybywa na nasz dwór. Ogłasza, że ród $bra_wittelsbach_hyperlink$ od dziś już nie sprawuje władzy. [emperor_ruler.GetName] otrzyma pod swoje bezpośrednie rządy ziemie państwa [root_country.GetName], co oznacza, że nasz kraj i [emperor_country.GetNameWithNoTooltip] muszą zawrzeć unię personalną."
 turmoil_in_brandenburg.1102.a: "Niech żyje $bra_hre_emperor_hyperlink$!"
 turmoil_in_brandenburg.1102.b: "Oby tym razem kraj [root_country.GetLongNameWithNoTooltip] dał sobie radę."
 turmoil_in_brandenburg.1103.title: "$turmoil_in_brandenburg.1102.title$"
 turmoil_in_brandenburg.1103.desc.wittelsbach: "Ambasador z kraju [emperor_country.GetName] przybywa na nasz dwór. Ogłasza, że ziemiami państwa [root_country.GetName] będzie rządzić teraz [dynasty_character.GetName]."
 turmoil_in_brandenburg.1103.desc: "Ambasador z kraju [emperor_country.GetName] przybywa na nasz dwór. Ogłasza, że od dziś ród $bra_wittelsbach_hyperlink$ nie sprawuje już władzy. Ziemiami państwa [root_country.GetName] będzie zarządzać osobiście [dynasty_character.GetName]."
 turmoil_in_brandenburg.1103.a: "Niechaj [dynasty_character.GetShortNameWithNoTooltip] rządzi twardą ręką."
 turmoil_in_brandenburg.1103.b: "To chyba nowa szansa dla kraju [root_country.GetLongNameWithNoTooltip]."
 turmoil_in_brandenburg.1104.title: "$turmoil_in_brandenburg.1102.title$"
 turmoil_in_brandenburg.1104.desc.wittelsbach: "Ambasador z kraju [emperor_country.GetName] przybywa na nasz dwór. Ogłasza, że ziemiami będzie zarządzać teraz nowa osoba z rodu $bra_wittelsbach_hyperlink$, która już wcześniej udowodniła swoją wartość. [cabinet_character.GetName] otrzyma państwo [root_country.GetName] we władanie, gdyż wykazuje się wyjątkową lojalnością wobec kraju [emperor_country.GetNameWithNoTooltip]."
 turmoil_in_brandenburg.1104.desc: "Ambasador z kraju [emperor_country.GetName] przybywa na nasz dwór. Ogłasza, że ród $bra_wittelsbach_hyperlink$ od dziś już nie sprawuje władzy. Ziemiami państwa [root_country.GetName] będzie zarządzać osobiście [cabinet_character.GetName], gdyż wykazuje się wyjątkową lojalnością wobec kraju [emperor_country.GetNameWithNoTooltip]."
 turmoil_in_brandenburg.1104.a: "Przynajmniej nie jest to ktoś z rodu $bra_wittelsbach_hyperlink_no_tt$."
 turmoil_in_brandenburg.1104.b: "No świetnie, wróciła dynastia $bra_wittelsbach_hyperlink_no_tt$..."
 turmoil_in_brandenburg.1104.c: "Nie ugniemy kolan przed państwem [emperor_country.GetNameWithNoTooltip]!"
 turmoil_in_brandenburg.1105.title: "$turmoil_in_brandenburg.1102.title$"
 turmoil_in_brandenburg.1105.desc: "Ambasador z kraju [emperor_country.GetName] przybywa na nasz dwór. Ogłasza, że ród $bra_wittelsbach_hyperlink$ od dziś już nie sprawuje władzy. Ziemiami państwa [root_country.GetName] będzie zarządzać osobiście [hohenzollern_character.GetName] ze względu na swoje dobre rady udzielane dynastii $bra_wittelsbach_hyperlink_no_tt$."
 turmoil_in_brandenburg.1105.a: "Niechaj [hohenzollern_character.GetHeShe] rządzi mądrze."
 turmoil_in_brandenburg.1106.title: "$turmoil_in_brandenburg.1102.title$"
 turmoil_in_brandenburg.1106.desc: "Ambasador z kraju [emperor_country.GetName] przybywa na nasz dwór. Ogłasza, że władcy z rodu $bra_wittelsbach_hyperlink$ otrzymują cesarskie ostrzeżenie, ale zachowują prawo do rządzenia państwem [root_country.GetFlavorRank]."
 turmoil_in_brandenburg.1106.a: "Kraj [root_country.GetNameWithNoTooltip] na zawsze pozostanie we władaniu rodu $bra_wittelsbach_hyperlink_no_tt$..."
 turmoil_in_brandenburg.1107.title: "Opór państwa [root_country.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.1107.desc: "Uparte nieudolne państwo [root_country.GetName] odmawia podporządkowania się nam i naszej władzy. Jest więcej niż oczywiste, że jego niekompetentne przywództwo nie ma żadnej wizji, dlatego mamy wystarczające powody, aby ujarzmić je siłą."
 turmoil_in_brandenburg.1107.a: "Nie tolerujemy zdrajców!"
 turmoil_in_brandenburg.1200.title: "Ciężki okres państwa [bra_country.GetAdjectiveWithNoTooltip|l]kiego"
 turmoil_in_brandenburg.1200.desc: "Po latach nieudolnych rządów rodu $bra_wittelsbach_hyperlink$, dynastia [emperor_dynasty.GetName] przejęła kontrolę w państwie [bra_country.GetName]. Choć nasze intencje wobec tych ziem są szczere i dobre, jasne jest, że sami nie zdołamy naprawić szkód, które spowodował ród $bra_wittelsbach_hyperlink_no_tt$.\n\nJedna z najbardziej zaufanych osób wśród naszych doradców – [hohenzollern_character.GetName] – wykazała się wielkimi kompetencjami w kwestiach administracji oraz dyplomacji. Jeśli otrzyma władzę i autonomię, może pomóc stanąć państwu [bra_country.GetNameWithNoTooltip] na nogi."
 turmoil_in_brandenburg.1200.a: "[hohenzollern_character.GetShortNameWithNoTooltip] dostanie od nas [bra_country.GetFlavorRank] we władanie."
 turmoil_in_brandenburg.1200.a.tt: "[hohenzollern_character.GetName] zastąpi [Concept('ruler','głowę państwa')|e] [bra_country.GetName]"
 turmoil_in_brandenburg.1200.b: "Nonsens. Nadal możemy sami władać państwem [bra_country.GetNameWithNoTooltip]."
 turmoil_in_brandenburg.1201.title: "[hohenzollern_character.GetNameWithNoTooltip] – nowa władza w kraju [bra_country.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.1201.desc: "Po latach nieudolnych rządów dynastii $bra_wittelsbach_hyperlink$ arystokraci z państwa [emperor_country.GetName] przejęli kontrolę nad krajem [bra_country.GetName]. Chociaż ich intencje leżą w naszym najlepszym interesie, ich obowiązki wobec kraju $bra_hre_hyperlink$ uniemożliwiły im rządzenie naszymi ziemiami z zaangażowaniem większym od najbardziej entuzjastycznie nastawionego członka rodu $bra_wittelsbach_hyperlink_no_tt$.\n\nNa szczęście dla nas [emperor_ruler.GetName] dobrze zna sytuację, dlatego wysyła do nas nowy zarząd. [hohenzollern_character.GetName] będzie samodzielnie administrować państwem [bra_country.GetNameWithNoTooltip]."
 turmoil_in_brandenburg.1201.a: "Niechaj [hohenzollern_character.GetHeShe] rządzi mądrze i twardą ręką."
 turmoil_in_brandenburg.1300.title: "Narodziny raubritterów"
 turmoil_in_brandenburg.1300.entry: "$turmoil_in_brandenburg.1300.title$"
 turmoil_in_brandenburg.1300.desc: "Słabe rządy, które sprawuje [ROOT.GetCountry.GetGovernment.GetRulerTitle|l], i ogólne bezprawie doprowadziły do narodzin raubritterów – szlachty, która żyje z bezprawia oraz przestępstw. Ich obecność służy jedynie osłabieniu naszej kontroli i podważeniu autorytetu, jaki posiada [target_ruler.GetName]. Obecnie ich władza jest najsilniejsza w regionie [robber_baron_province.GetName]."
 turmoil_in_brandenburg.1300.a: "Zajmiemy się nimi w odpowiednim czasie."
