 turmoil_in_brandenburg.1301.title: "Raubritterzy w regionie [robber_baron_province.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.1301.entry: "Raubritterzy w regionie raubritterów"
 turmoil_in_brandenburg.1301.desc: "Plaga raubritterów rozprzestrzeniła się na prowincję [robber_baron_province.GetName]. Ich niecne występki oraz arogancja są niczym splunięcie w twarz. Czas dać im nauczkę i przywrócić władzę centralną w kraju."
 turmoil_in_brandenburg.1301.a: "Zajmiemy się nimi w odpowiednim czasie."
 turmoil_in_brandenburg.1302.title: "Von Quitzow"
 turmoil_in_brandenburg.1302.entry: "$turmoil_in_brandenburg.1302.title$"
 turmoil_in_brandenburg.1302.desc: "Wśród wszystkich raubritterów niewielu ma wpływy porównywalne z rodziną von Quitzow. Posiadają ogromne majątki w regionie [ShowProvinceDefinitionName('mittelmark_province')] i wielkie posiadłości. Jednak pomimo tego całego bogactwa wciąż skłaniają się ku przestępczości. Uderzymy na nich i zniszczymy ich włości, zanim wywołają kompletny chaos."
 turmoil_in_brandenburg.1302.a: "Musimy się z nimi rozprawić!"
 turmoil_in_brandenburg.1302.b: "Lepiej podejdźmy do tego ostrożnie."
 turmoil_in_brandenburg.1302.historical_info: "Ród von Quitzow był najbardziej wpływową rodziną szlachecką w Brandenburgii na początku XV wieku. Podczas centralizacji marchii przez Fryderyka I Hohenzollerna w latach 1411 – 1415, dwaj słynni bracia raubritterzy, Hans i Dietrich, zostali zaatakowani przez nowego elektora, który zdobył ich zamki i zakończył erę dominacji dynastii von Quitzow w Brandenburgii."
 STATIC_MODIFIER_NAME_PRU_quitzow_modifier: "Wpływ von Quitzow"
 STATIC_MODIFIER_NAME_PRU_quitzow_repressed_modifier: "Represjonowanie von Quitzow"
 bra_quitzow_revolt: "Bunt von Quitzow"
 turmoil_in_brandenburg.1303.title: "Koniec rządów raubritterów"
 turmoil_in_brandenburg.1303.entry: "$turmoil_in_brandenburg.1303.title$"
 turmoil_in_brandenburg.1303.desc: "Choć zajęło nam to wiele lat i kampanii, aroganccy [ShowEstateTypeName('nobles_estate')|l] zostali wreszcie okiełznani. Od teraz wszystkie szlaki handlowe w kraju nie muszą się obawiać arystokratycznych rabusiów i żaden zwykły człowiek więcej nie ucierpi. Co więcej [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] nie będą mogli żądać zapłaty za ochronę od chłopów."
 turmoil_in_brandenburg.1303.a: "[ROOT.GetCountry.GetFlavorRank] znów jest jednością."
 STATIC_MODIFIER_NAME_PRU_end_of_robber_barons: "Koniec epoki raubritterów"
 robber_barons_aftermath_tt: "Rozprawiono się z raubritterami"
 turmoil_in_brandenburg.1304.title: "Ukaranie raubritterów"
 turmoil_in_brandenburg.1304.entry: "$turmoil_in_brandenburg.1304.title$"
 turmoil_in_brandenburg.1304.desc: "Chociaż udało nam się zwyciężyć w walce, jaką prowadzą z nami zbuntowani [ShowEstateTypeName('nobles_estate')|l], niektórzy dworzanie uważają, że samo ich pokonanie nic nie da i [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] musi ich ukarać za zdradę. Chociaż wielu popiera tę inicjatywę, inni są zdania, że dalsze zaognianie relacji nie jest konieczne, zwłaszcza że już odzyskaliśmy kontrolę."
 turmoil_in_brandenburg.1304.a: "Zapłacą za swoją zdradę!"
 turmoil_in_brandenburg.1304.b: "Wymierzmy im lekką karę."
 turmoil_in_brandenburg.1304.c: "Nie ma potrzeby karać ich bardziej."
