l_polish:
 flavor_lat.1.title: "Utworzenie nowej [latin_country.GetAdjectiveWithNoTooltip|l]kiej biurokracji"
 flavor_lat.1.entry: "Nowa biurokracja łacińska"
 flavor_lat.1.desc: "Po przywróceniu naszej władzy nad miastem [constantinople_location.GetName] wielu przedstawicieli elit #L [latin_country.GetAdjective|l]kich#! kładzie obecnie podwaliny pod nową biurokrację, która ma zastąpić zepsuty system [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]ki. Jedną z wad poprzedniej administracji było to, że ówczesne naciski regionalne uniemożliwiły krajowi stworzenie spójnej struktury rządowej.\n\nOdkąd władzę sprawuje [scope_ruler.GetName], [ROOT.GetCountry.GetFlavorRank|l] może obrać inną drogę i stworzyć uporządkowaną biurokrację #L [ROOT.GetCountry.GetCulture.Custom('Culture_adj')|l]ką#!."
 flavor_lat.1.a: "Utwórzmy nową, odrębną biurokrację [ROOT.GetCountry.GetCulture.Custom('Culture_adj')|l]ką."
 flavor_lat.1.a.entry: "Utwórzmy nową, odrębną biurokrację."
 flavor_lat.1.b: "Wzorujmy nową biurokrację na dawnych państwach krzyżowych."
 flavor_lat.1.c: "Przyjmijmy elementy biurokracji [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]kiej."
 flavor_lat.1.c.entry: "Przyjmijmy elementy biurokracji bizantyjskiej."
 flavor_lat.1.d: "Wprowadźmy biurokrację wzorowaną na [ShowCultureNameWithNoTooltip('catalan')|l]kiej."
 flavor_lat.1.e: "Wprowadźmy biurokrację wzorowaną na [ShowCultureNameWithNoTooltip('neapolitan')]kiej."
 flavor_lat.2.title: "Rosnące [ShowCultureNameWithNoTooltip('turkish_culture')|l]kie zagrożenie w regionie [ShowRegionNameWithNoTooltip('anatolia_region')]"
 flavor_lat.2.entry: "Rosnące tureckie zagrożenie w Anatolii"
 flavor_lat.2.desc: "Jeszcze zanim odbiliśmy [constantinople_location.GetName] posiadłości [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]kie w regionie [ShowRegionName('anatolia_region')] były poważnie zagrożone przez mieszkający tam lud #L [ShowCultureName('turkish_culture')|l]ki#!. Wśród tych [ShowCultureNameWithNoTooltip('turkish_culture')|l]kich watażków, [rising_turkish_country_ruler.GetName] okazuje się jedną z najsilniejszych osobowości konsolidujących ziemie regionu [ShowRegionNameWithNoTooltip('anatolia_region')], a wielu #L [ROOT.GetCountry.GetAdjective|l]kich#! dworzan obawia się, że tak niebezpieczni ludzie mogą wykorzystać fakt, iż [constantinople_location.GetNameWithNoTooltip] został odzyskany, aby rozpocząć własną inwazję na region znany jako [ShowScriptedGeographyName('greece_geography')]. Inni doradcy zasugerowali natomiast najwyższej władzy, abyśmy wykorzystali naszą przewagę i rozpoczęli inwazję na region [ShowRegionNameWithNoTooltip('anatolia_region')] by osłabić państwo [ShowCultureNameWithNoTooltip('turkish_culture')|l]kie."
 flavor_lat.2.a: "Odeprzemy Turków!"
 flavor_lat.2.a.entry: "Odeprzemy ten kraj!"
 flavor_lat.2.b: "Powinniśmy zachować ostrożność i przyjąć bardziej defensywne podejście."
 flavor_lat.3.title: "[ROOT.GetCountry.GetLongNameWithNoTooltip] i poważne roszczenia"
 flavor_lat.3.entry: "$flavor_lat.3.title$"
 flavor_lat.3.desc: "Gdy [constantinople_location.GetName] upadł w 1204 roku, dawna elita #L [ROOT.GetCountry.GetAdjective|l]ka#! szybko podjęła działania, by umocnić rządy nad ziemiami #L [GetCountry('BYZ').GetAdjective|l]kimi#! leżącymi na terytoriach znanych jako [ShowScriptedGeographyName('greece_geography')], a także by przejąć [ShowRegionNameWithNoTooltip('balkan_region')]. Jednak w tamtym czasie [serbia_country.GetName] i [bul_country.GetName] okazały się głównymi rywalami [ROOT.GetCountry.Custom('C_DOP')], przy czym [bul_country.GetNameWithNoTooltip] ostatecznie to jeden z głównych winowajców upadku dawnego państwa, przeprowadzając nieustanne kampanie wojskowe na tamtejszych ziemiach. \n\nTeraz, gdy [scope_ruler.GetName] znów włada krajem [ROOT.GetCountry.GetLongNameWithNoTooltip], być może uda nam się przejąć panowanie nad tymi ziemiami i wypełnić misję, której nie podołali nasi poprzednicy."
 flavor_lat.3.a: "Będziemy chcieć rozszerzyć [ROOT.GetCountry.GetFlavorRank|l] na terytoria dawnych rywali."
 flavor_lat.3.a.entry: "Będziemy dążyć do rozszerzenia granic królestwa na terytoria starych rywali."
 flavor_lat.3.b: "Nie powtarzajmy błędów z przeszłości."
 flavor_lat.4.title: "Odtworzenie Patriarchatu Konstantynopolitańskiego"
 flavor_lat.4.entry: "Odtworzenie Patriarchatu Konstantynopolitańskiego"
 flavor_lat.4.desc: "Chociaż [pap_country.GetGovernment.GetRulerTitle] wyraził sprzeciw wobec pierwszego splądrowania miasta [constantinople_location.GetName] w 1204, możliwość przejęcia metropolii przez krzyżowców #L [ShowReligionAdjective('catholic')|l]kich#! pozwoliła na przywrócenie patriarchatu, wzmacniając autorytet #L [pap_country.GetAdjective]ki#!. Jednak gdy w 1261 roku [scope_michael_palaiologos.GetName] odzyskał miasto, tytuł ten ponownie przestał istnieć.\n\nTeraz, gdy rządy #L [ROOT.GetCountry.GetAdjective|l]kie#! zostały przywrócone w Konstantynopolu, [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] nalegają na przywrócenie patriarchatu."
 flavor_lat.4.a: "Zezwólmy na przywrócenie patriarchatu."
 flavor_lat.4.b: "Zobowiązujmy się do zapewnienia ochrony odnowionemu patriarchatowi!"
 flavor_lat.4.c: "Wykorzystajmy odrodzony patriarchat do zdobycia wpływów."
 flavor_lat.4.d: "Odmówmy przywrócenia patriarchatu."
 latin_patriarchate_of_constantinople: "Patriarchat [ShowLocationNameWithNoTooltip('constantinople')]itański"
 flavor_lat.5.title: "Odzyskanie kontroli nad regionem [ShowRegionNameWithNoTooltip('anatolia_region')]"
 flavor_lat.5.entry: "Odzyskanie kontroli nad Anatolią"
 flavor_lat.5.desc: "Choć początkowo wydawało się to trudnym zadaniem dla odrodzonego kraju [ROOT.GetCountry.GetLongName], nasi żołnierze poczynili ogromne postępy w umacnianiu swojej dominacji nad regionem [ShowRegionName('anatolia_region')]. Chociaż nadal pozostało tam kilka państw #L [ShowCultureName('turkish_culture')|l]kich#!, nie powinny one już stanowić poważnego zagrożenia dla naszej państwowości."
 flavor_lat.5.a: "Niech żyje [ROOT.GetCountry.GetLongNameWithNoTooltip]!"
 flavor_lat.5.a.entry: "Chwała nam!"
 flavor_lat_anatolia_secured: "Każda [location|el] w regionie [ShowRegionName('anatolia_region')] posiadana przez kraj [ROOT.GetCountry.GetName] lub naszych [Concept('subjects','poddanych')|e] otrzyma [modifier|el] „[ShowModifier('lat_improved_location_integration')]” [modifier|e] na #Y 15#! lat."
 flavor_lat.6.title: "Udane kampanie przeciwko państwu [target_country.GetAdjectiveWithNoTooltip|l]ku"
 flavor_lat.6.entry: "Bułgaria zmiażdżona"
 flavor_lat.6.desc: "[target_country.GetLongName], dawne zagrożenie dla #L [ROOT.GetCountry.GetAdjective|l]kiej#! potęgi, nie jest już poważnym wyzwaniem, a większość terytoriów tego kraju znalazło się pod #L [ROOT.GetCountry.GetAdjective|l]kim#! panowaniem. Jest mało prawdopodobne, aby elita [target_country.GetAdjectiveWithNoTooltip|l]ka zdołała się odbudować i ponownie rzucić wyzwanie państwu [ROOT.GetCountry.GetLongName]."
 flavor_lat.6.a: "Powinniśmy zintegrować dawne prowincje [target_country.GetAdjectiveWithNoTooltip|l]kie."
 flavor_lat.6.a.entry: "Powinniśmy zintegrować ich dawne prowincje."
 flavor_lat_balkan_rival_lands_secured: "Każda [location|el] w regionie [ShowRegionName('balkan_region')] będąca [Concept('core','główną')|e] lokacją [target_country.Custom('C_DOP')] i posiadana przez kraj [ROOT.GetCountry.GetName] lub naszego [Concept('subjects','poddanego')|e] otrzyma [modifier|el] „[ShowModifier('lat_improved_location_integration')]” na #Y 15#! lat."
 flavor_lat.7.title: "Przekreślone ambicje [target_country.GetAdjectiveWithNoTooltip|l]kie"
 flavor_lat.7.entry: "Przekreślone ambicje Serbii"
 flavor_lat.7.desc: "Chociaż od pewnego czasu kraj ten zyskiwał na znaczeniu, ambicje #L [target_country.GetAdjective|l]kie#! zostały zniweczone przez żołnierzy #L [ROOT.GetCountry.GetAdjective|l]kich#!, a nasze kampanie na tamtejszym terytorium jeszcze bardziej osłabiły te ziemie. Ponieważ status [target_country.GetAdjectiveWithNoTooltip|l]ki w regionie [ShowRegionName('balkan_region')] został zredukowany do rangi kraju drugorzędnego, jego wcześniejsze ambicje nie powinny już nas niepokoić."
 flavor_lat.7.a: "Podejmijmy działania mające na celu szybką stabilizację prowincji odbitych z rąk [target_country.GetAdjectiveWithNoTooltip|l]kich."
 flavor_lat.7.a.entry: "Podejmijmy działania mające na celu szybką stabilizację prowincji odbitych z ich rąk."
 flavor_lat.8.title: "Dawne elity [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]kie"
 flavor_lat.8.entry: "Dawne elity bizantyjskie"
 flavor_lat.8.desc: "Kiedy [constantinople_location.GetName] został ponownie odbity, nadarzyła się okazja nie tylko do odrodzenia [ROOT.GetCountry.Custom('C_DOP')], ale też przekreślone zostały wszelkie nadzieje, że uda się kiedykolwiek odtworzyć [GetCountry('BYZ').GetLongName], a wielu członków [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]kich elit teraz niechętnie przysięga wierność władzy, jaką stanowi [ROOT.GetCountry.GetNameWithNoTooltip].\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle|l] uważa, że [GetCountry('BYZ').GetLongNameWithNoTooltip] to już pieśń przeszłości i nadeszła pora, by to [ROOT.GetCountry.GetLongNameWithNoTooltip] uznano za nową potęgę na arenie światowej, z własną tożsamością."
 flavor_lat.8.a: "Czas pożegnać się z dawną kulturą [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]ką."
 flavor_lat.8.a.entry: "Czas pożegnać się z dawną kulturą bizantyjską."
 flavor_lat.8.b: "Powinniśmy zachować tradycję [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]ką w nowym państwie."
 flavor_lat.8.b.entry: "Powinniśmy zachować tradycję bizantyjską w nowym państwie."
 flavor_lat.9.title: "[pap_country.GetAdjectiveWithNoTooltip]ka prośba o nawrócenie ziem [ShowReligionAdjectiveWithNoTooltip('orthodox')|l]ych"
 flavor_lat.9.entry: "Papieska prośba o nawrócenie ziem bizantyjskich"
 flavor_lat.9.desc: "W zamian za wsparcie #L [pap_country.GetAdjective|l]kie#! w staraniach o odrodzenie potęgi, którą niegdyś znano jako [ROOT.GetCountry.GetLongName], [pap_country.GetGovernment.GetRulerTitle] żąda, aby po ostatecznym odbiciu Konstantynopola nowa elita [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ka wprowadziła politykę osłabiającą wpływy #L [ShowReligionAdjective('orthodox')|l]e#! i wzmacniającą wiarę #L [ShowReligionAdjective('catholic')|l]ką#!. Teraz, gdy [constantinople_location.GetNameWithNoTooltip] znów należy do nas, a [ROOT.GetCountry.GetLongNameWithNoTooltip] istnieje, [scope_pope_ruler.GetName] oczekuje, że dotrzymamy warunków umowy i zaczniemy wprowadzać te rozwiązania."
 flavor_lat.9.a: "Umowa, którą zawarliśmy my i [scope_pope_ruler.GetShortNameWithNoTooltip], zostanie uszanowana."
 flavor_lat.9.a.entry: "Dotrzymajmy naszej umowy."
 flavor_lat.9.b: "Wprowadźmy te zasady, ale nie egzekwujmy ich zbyt mocno."
 flavor_lat.9.c: "Zerwijmy umowę i opowiedz się za polityką tolerancji wobec ludności [ShowReligionAdjectiveWithNoTooltip('orthodox')|l]ej."
 lat_accepted_pope_latin_empire_proposal_tt: "Przyjęto papieską propozycję odtworzenia cesarstwa łacińskiego"
