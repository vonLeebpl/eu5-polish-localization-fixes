l_polish:
 flavor_mfa.1.title: "Tradycje bizantyjskie"
 flavor_mfa.1.entry: "Tradycje bizantyjskie"
 flavor_mfa.1.desc: "[ROOT.GetCountry.GetLongName] stoi na rozdrożu. Zaledwie kilka dekad temu [ROOT.GetCountry.GetFlavorRank|l] było świadkiem wstąpienia na tron [Select_CString(target_character2.IsFemale,'członkini','członka')] dumnego rodu [target_character.GetDynasty.GetName]. Mimo że bycia [ShowModifier('byz_born_in_the_purple_modifier')] [target_character2.GetName] [Select_CString(target_character2.IsFemale,'nawróciła','nawrócił')] się na [ShowReligionName('catholic')|l] i [Select_CString(target_character2.IsFemale,'przyjęła','przyjął')] kulturę #L [ShowCultureAdjective('piedmontese')|l]ką#!, porzucając tym samym #L [target_country.GetAdjective|l]kie#! korzenie.\n\nDziś [ROOT.GetCountry.GetNameWithNoTooltip] jest pod rządami [Select_CString(target_character2.IsFemale,'jej,'jego')] [Select_CString(target_character.IsFemale,'potomkini','potomka')] o imieniu [target_character.GetName], [Select_CString(target_character.IsFemale,'która','który')] teraz zastanawia się, jakie byłoby [target_country.GetLongNameWithNoTooltip], gdyby nie [Select_CString(target_character.IsFemale,'urodziła','urodził')] się w lokacji [target_character.GetLocation.GetName]."
 flavor_mfa.1.a: "[target_character2.GetNameWithNoTooltip] [Select_CString(target_character2.IsFemale,'postąpiła','postąpił')] słusznie, adaptując się."
 flavor_mfa.1.a.entry: "Nasz władca postąpił słusznie, adaptując się."
 flavor_mfa.1.b: "Nie zapomnimy o naszych korzeniach!"
 mfa_extra_information_about_reform: "[modifiers|e] reformy [target_government_reform.GetName] skalują się od negatywnych do pozytywnych na podstawie udziału [Concept('culture','kultury')|e] #L [ShowCultureAdjective('greek_culture')|l]kiej#! i [Concept('religion','religii')|e] #L [ShowReligionAdjective('orthodox')|l]ej#!. Gdy [ROOT.GetCountry.GetName] nawraca się, kary powoli są zmieniane na premie. Modyfikatory skalują się od #N -1#! do #G +1#!"
 mfa_opportunity_for_thessaloniki: "Jeśli przyjęta jest reforma [target_government_reform.GetName] i mamy #W 75%#! udziału [Concept('culture','kultury')|e] #L [ShowCultureAdjective('greek_culture')|l]kiej#! i [Concept('religion','religii')|e] #L [ShowReligionAdjective('orthodox')|l]ej#!, możemy zażądać lenna od [target_country.Custom('C_DOP')] w lokacji [ShowLocationName('thessaloniki')] oraz jego okolicach"
 flavor_mfa.2.title: "[target_character.GetNameWithNoTooltip]"
 flavor_mfa.2.entry: "Facino Cane"
 flavor_mfa.2.desc: "Nasze [ROOT.GetCountry.GetFlavorRank] gości znamienitą postać. Jest nią [target_character.GetName], słynny kondotier pochodzący z [target_character.GetBirthLocation.GetName]. Spędził lata w służbie innym krajom i wyróżnił się jako sprawny dowódca. Na tej podstawie wierzymy, że [target_character.GetName] i jego kompania dobrze się nam przysłużą w wojnach przeciw innym potęgom na tym obszarze."
 flavor_mfa.2.a: "Musimy [Select_CString(target_character.IsFemale,'ją','go')] zatrudnić!"
 flavor_mfa.2.a.entry: "Musimy go zatrudnić."
 flavor_mfa.2.b: "Zaoferujmy [Select_CString(target_character.IsFemale,'jej','mu')] jakieś ziemie w zamian za zatrudnienie."
 flavor_mfa.2.b.entry: "Zaoferujmy mu jakieś ziemie w zamian za zatrudnienie."
 flavor_mfa.2.c: "Fe! Niech ten włóczęga szuka zatrudnienia gdzie indziej."
 mfa_facino_condotierro: "Banda Facino"
 flavor_mfa.3.title: "Ambicje godne cesarza"
 flavor_mfa.3.entry: "$flavor_mfa.3.title$"
 flavor_mfa.3.desc: "[target_character.GetName], może nie posiada statusu [ShowModifier('byz_born_in_the_purple_modifier')], ani nie jest bezpośrednim potomkiem cesarza, lecz w żyłach tej osoby płynie cesarska krew rodu [target_character.GetDynasty.GetName]. Tak znamienita postać ta nie zadowala się byciem spychaną na margines jako jeden z wielu drobnych władców regionu [ShowAreaName('piemonte_area')]. Co więcej, [target_character.GetShortNameWithNoTooltip] zasługuje na władanie czymś znacznie potężniejszym niż [ShowCountryRankName('rank_county')]."
 flavor_mfa.3.a: "[ShowAreaNameWithNoTooltip('piemonte_area')] potrzebuje nowego hegemona."
 flavor_mfa.3.b: "Przez [Select_CString(target_character.IsFemale,'jej','jego')] ambicje inni zwrócą się przeciwko nam."
 flavor_mfa.3.b.entry: "Przez jego ambicje inni zwrócą się przeciwko nam."
 mfa_if_we_conquer_enough_in_20_years: "Jeśli [ROOT.GetCountry.GetName] osiągnie co najmniej #W [DisplayPopulationNumber('(CFixedPoint)500')]#! [population_i|e] [Concept('population','populacji')|e] w ciągu #W 20#! lat, otrzyma [SCOPE.ScriptValue('prestige_mild_bonus')|+=] [prestige_i|e] [Concept('prestige','prestiżu')|e], [modifier|el] [ShowModifier('mfa_elevation_modifier')] na #W 40#! lat i może się wznieść do rangi [ShowCountryRankName('rank_duchy')], jeśli jeszcze nim nie jest.\nJeśli [ROOT.GetCountry.GetName] nie zdoła tego osiągnąć, otrzyma [SCOPE.ScriptValue('prestige_extreme_penalty')|+=] [prestige_i|e] [Concept('prestige','prestiżu')|e], [SCOPE.ScriptValue('stability_weak_penalty')|+=] [stability_i|e] [Concept('stability','stabilności')|e], a wszyscy sąsiedzi otrzymają [casus_belli|el] [ShowCasusBelliName('cb_cut_down_in_size')]."
 flavor_mfa.4.title: "Pośmiewisko na całe [ShowRegionNameWithNoTooltip('italy_region')]"
 flavor_mfa.4.desc: "Lata temu [target_character.GetName] poprzysiągł stać się hegemonem #L [ShowAreaName('piemonte_area')]u#!. Jedynym, co dziś z tego pozostało, są złośliwe drwiny, jakie muszą znosić [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]. Dynastia [target_character.GetDynasty.GetName] z [ROOT.GetCountry.Custom('C_DOP')] nie tylko nie sprostała temu zadaniu, ale przy okazji przysporzyła sobie wielu nowych wrogów. Czy to żałosne [ROOT.GetCountry.GetFlavorRank|l] może jeszcze liczyć na jakiekolwiek współczucie swoich sąsiadów?"
 flavor_mfa.4.a: "Zrobiliśmy, co się dało."
 flavor_mfa.5.title: "Dojrzały owoc"
 flavor_mfa.5.desc: "Przez ostatnie lata [from_country.GetLongName] robiło, co mogło, by skłócić się z sąsiadami. Dziś ich ambicje budzą jedynie śmiech i gniew. My i wielu innych odczuwamy pogardę dla ich żałosnego państwa."
 flavor_mfa.5.a: "Cóż za nieszczęście."
 flavor_mfa.6.title: "Książęta [ShowAreaNameWithNoTooltip('piemonte_area')]u"
 flavor_mfa.6.desc: "Lata temu [target_character.GetName] [Select_CString(target_character.IsFemale,'poprzysięgła','poprzysiągł')], że [Select_CString(target_character.IsFemale,'jej','jego')] ród, #L [ROOT.GetCountry.GetAdjective|l]ka#! dynastia [target_character.GetDynasty.GetName], osiągnie pewnego dnia splendor, na który tak bardzo zasługuje. Dziś wysiłki zostały w końcu uznane, a [ShowAreaName('piemonte_area')] osiągnął rangę [ShowCountryRankName('rank_duchy')]."
 flavor_mfa.6.a: "Być może władcy [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]cy są także godni rodzenia w purpurze?"
 flavor_mfa.6.b: "[ROOT.GetCountry.GetNameWithNoTooltip] będzie wspaniały!"
 mfa_purple_color: "Nasz kolor zmieni się na #W ciemnofioletowy#!"
 flavor_mfa.7.title: "[ShowScriptedGeographyNameWithNoTooltip('claims_of_thessalonica_geography')] muszą być nasze"
 flavor_mfa.7.entry: "$flavor_mfa.7.title$"
 flavor_mfa.7.desc: "[target_character.GetName] [Select_CString(target_character.IsFemale,'należąca','należący')] do rodu [target_character.GetDynasty.GetName], któremu początek dał [target_character2.GetName], utrzymuje, że [target_character.GetHerHis|l] pochodzenie daje [target_character.GetHerHim|l] prawo objąć [target_country.GetLongName]. Wiedzą mniej powszechną jest to, że podobnie traktuje [ShowScriptedGeographyName('claims_of_thessalonica_geography')], gdyż rządził nimi niegdyś [target_character3.GetName] i dynastia [target_character3.GetDynasty.GetName]. Mając wsparcie, jakiego udziela [target_character.GetDynasty.GetNameWithNoTooltip] z miasta [target_country.GetCapital.GetName], [target_character.GetName] wierzy, że może otrzymać lokację [target_location.GetName] i okolice w zamian za nasze przysługi."
 flavor_mfa.7.a: "Wystosujmy roszczenia."
 flavor_mfa.7.b: "Nie będziemy nadużywać ich przychylności."
 MFA_request_thessalonica: "Zażądamy, by [target_country.GetLongName] oddało nam w [ShowSubjectTypeName('fiefdom')|l] ziemie prowincji [ShowProvinceDefinitionName('chalkidiki_province')], [ShowProvinceDefinitionName('lower_macedonia_province')] oraz [ShowProvinceDefinitionName('central_macedonia_province')]"
 flavor_mfa.8.title: "Żądanie od [from_country.Custom('C_DOP')]"
 flavor_mfa.8.desc: "Nasi krewni z dynastii [target_character.GetDynasty.GetName], którzy kontrolują [from_country.GetLongName], utworzyli iście #L [target_country.GetAdjective|l]kie#! państwo w regionie [ShowRegionName('italy_region')]. Jego mieszkańcy są #L [ROOT.GetCountry.GetReligion.GetAdjective|l][Select_CString(Or(EndsWith(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'k'),Or(EndsWith(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'n'),EndsWith(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'ł'))),'i','cy')]#! i #L [ROOT.GetCountry.GetCulture.Custom('Culture_adj')|l]cy#!, nie noszą purpurowych szat i mówią naszym językiem. Biorąc pod uwagę naszą wspólną historię oraz wzajemną współpracę, ich władca [target_character.GetName] żąda lenna w lokacji [target_location.GetName] i okolicach, powołując się na starożytne roszczenia do obszaru [ShowScriptedGeographyName('claims_of_thessalonica_geography')]."
 flavor_mfa.8.a: "Powinien zastanowić się przed cytowaniem [ShowLanguageAdjectiveWithNoTooltip('latin_language')]ego konstruktu."
 flavor_mfa.8.b: "Uszanujemy ich prośbę."
 mfa_make_thessaloniki_subject: "Nasze [locations|el] w prowincjach [ShowProvinceDefinitionName('chalkidiki_province')], [ShowProvinceDefinitionName('lower_macedonia_province')] oraz [ShowProvinceDefinitionName('central_macedonia_province')] będą stanowić [ShowSubjectTypeName('fiefdom')|l] [from_country.Custom('C_DOP')]"
 flavor_mfa.1000.title: "$flavor_mfa.7.title$"
 flavor_mfa.1000.entry: "$flavor_mfa.7.title$"
 flavor_mfa.1000.desc: "Mimo że [target_character.GetName] pochodzi ze wspaniałej dynastii [target_character.GetDynasty.GetName], wysuwa także inne znaczące roszczenie do obszaru [ShowScriptedGeographyName('claims_of_thessalonica_geography')], które niegdyś [target_character3.GetName] [Select_CString(target_character3.IsFemale,'kontrolowała','kontrolował')]. Mimo że roszczenia te nie mają dużej mocy, możemy w tym przypadku liczyć na wsparcie innych krajów, gdyż istnieje spora [ShowCultureGroupName('italian_group')|l] grupa państw, którym marzy się uszczknąć część ziem, z których składa się [target_country.GetLongName], podczas gdy przechodzi swój [ShowDisasterName('byzantine_succession_crisis')]."
 flavor_mfa.1000.a: "Zorganizujmy kampanię."
 flavor_mfa.1000.b: "Bylibyśmy głupcami, dążąc do wojny na podstawie tak niepoważnych roszczeń."
 recipient_agrees_to_join_war: "[recipient.GetName] obieca dołączyć do kraju [actor.GetName] w wojnie przeciwko państwu [GetCountry('BYZ').GetLongName] w ciągu kilku lat"
 MFA_gather_allies: "Kraj [ROOT.GetCountry.GetName] spróbuje pozyskać sojuszników, wykorzystując [country_interaction|e] [ShowCountryInteractionName('mfa_join_against_byz')]\nZa #W 3 lata#! aktywuje się [event|el], który wypowie [Concept('war','wojnę')|e] z pomocą pozyskanych stronników"
 flavor_mfa.1001.title: "Obłaskawienie [from_country.GetAdjectiveWithNoTooltip|l]kich pretendentów"
 flavor_mfa.1001.desc: "Nikczemna #L [from_country.GetAdjective|l]ka#! dynastia [target_character.GetDynasty.GetName] wykorzystuje swoje pochodzenie z rodem [target_character3.GetDynasty.GetName], by móc sięgnąć po [ShowScriptedGeographyName('claims_of_thessalonica_geography')]. Nasi szpiedzy donoszą, że tworzy się liga [ShowCultureGroupName('italian_group')|l], która ma spróbować wydrzeć te ziemie w czasie, gdy przeżywamy [ShowDisasterName('byzantine_succession_crisis')] i jesteśmy osłabieni."
 flavor_mfa.1001.a: "Nie oddamy ani piędzi terytorium tym zdrajcom!"
 flavor_mfa.1001.b: "Zaproponujmy im jakieś symboliczne nadanie."
 flavor_mfa.1001.c: "Jak dla nas mogą sobie zabierać je całe!"
 mfa_offer_few_provinces: "Zaoferujemy państwu [from_country.GetName] [provinces|el] [ShowProvinceDefinitionName('chalkidiki_province')], [ShowProvinceDefinitionName('lower_macedonia_province')] oraz [ShowProvinceDefinitionName('central_macedonia_province')], by je obłaskawić"
 mfa_offer_entire_geography: "Zaoferujemy państwu [from_country.GetName] wszystkie nasze ziemie z obszaru [ShowScriptedGeographyName('claims_of_thessalonica_geography')]"
 flavor_mfa.1002.title: "Dogodna chwila"
 flavor_mfa.1002.desc: "Minęło wiele czasu, odkąd zaczęliśmy gromadzić sojuszników do naszej kampanii wymierzonej w [target_country.GetLongName]. Nasi wrogowie, poważnie osłabieni konfliktem wewnętrznym, pozostają idealnym celem do podboju zbrojnego. Mając tak wielu sprzymierzeńców oddanych naszej sprawie, to chyba najlepszy czas, by udowodnić, która linia dynastii [target_dynasty.GetName] jest lepsza."
 flavor_mfa.1002.a: "Spuścić psy wojny!"
 flavor_mfa.1002.b: "To nie jest dobry czas."
 flavor_mfa.1002.c: "Lepiej porzućmy ten plan."
 flavor_mfa.1003.title: "Uszanowanie porozumienia"
 flavor_mfa.1003.desc: "Wreszcie wybuchła wojna z państwem [target_country.GetLongName] i wzywa się nas do wypełnienia obietnicy złożonej krajowi [from_country.GetName]. Dołączymy do tej wojny domowej dynastii [target_character.GetDynasty.GetName] czy pozostawimy [from_country.GetLongNameWithNoTooltip], by samo poradziło sobie w konflikcie znanym jako [target_war.GetName]?"
 flavor_mfa.1003.a: "Nie porzucimy naszych sojuszników."
 flavor_mfa.1003.b: "Najwłaściwiej będzie obserwować sytuację z boku."
 flavor_mfa.1005.title: "Propozycja [target_country.Custom('C_DOP')]"
 flavor_mfa.1005.desc: "Te tchórze z [target_country.Custom('C_DOP')] w końcu przejrzeli na oczy i zaoferowali nam [ShowScriptedGeographyName('claims_of_thessalonica_geography')]. Powinniśmy starannie rozważyć tę propozycję, ponieważ cała ekspedycja sama w sobie niesie duże ryzyko."
 flavor_mfa.1005.a: "Weźmiemy, co możemy."
 flavor_mfa.1005.b: "Są głupcami, jeśli sądzą, że to nas powstrzyma!"
 mfa_make_thessaloniki_subject_out_of_provinces: "#L [target_country.GetAdjective]kie#! [locations|el] w prowincjach [ShowProvinceDefinitionName('chalkidiki_province')], [ShowProvinceDefinitionName('lower_macedonia_province')] oraz [ShowProvinceDefinitionName('central_macedonia_province')] będą stanowić [ShowSubjectTypeName('fiefdom')|l] [from_country.Custom('C_DOP')]"
 mfa_make_thessaloniki_subject_out_of_geography: "#L [target_country.GetAdjective]kie#! [locations|el] obszaru [ShowScriptedGeographyName('claims_of_thessalonica_geography')] będą stanowić [ShowSubjectTypeName('fiefdom')|l] [from_country.Custom('C_DOP')]"
 flavor_mfa.1006.title: "[from_country.GetLongNameWithNoTooltip] odpowiada"
 flavor_mfa.1006.desc.affirmative: "Wojna domowa dynastii [target_character.GetDynasty.GetName] została zażegnana! Zdaje się, że nikczemna linia #L [from_country.GetAdjective|l]ka#! przejrzała na oczy i zdecydowała zaniechać agresji w zamian za zaproponowane jej przekazanie ziem."
 flavor_mfa.1006.desc.negative: "Nie można ufać nikczemnej, zdradzieckiej #L [from_country.GetAdjective|l]kiej#! linii dynastii [target_character.GetDynasty.GetName]! Odmówili naszej pokornej prośbie pokojowego rozwiązania sytuacji. Zaprawdę te #L [ShowLanguageName('latin_language')|l]e#! diabły służą samemu Lucyferowi!"
 flavor_mfa.1006.affirmative: "Dziś zwycięża pokój."
 flavor_mfa.1006.negative: "Zdrada w rodzinie boli najbardziej."
