l_polish:
 flavor_bos.1.title: "Dążenie do niepodległości"
 flavor_bos.1.entry: "$flavor_bos.1.title$"
 flavor_bos.1.desc: "[hun_robert.GetName] nie żyje, co otwiera przed nami zupełnie nowe możliwości. Ponieważ [GetCountry('HUN').GetName] są osłabione i zajęte innymi sprawami, [target_ruler.GetName] zaczyna sobie wyobrażać kraj [ROOT.GetCountry.GetName] uwolniony spod #L [GetCountry('HUN').GetAdjectiveWithNoTooltip|l]kiej#! władzy. Zamiast rozpoczynać otwarty bunt, możemy po cichu zacząć podważać zwierzchnią władzę i nawiązać stosunki dyplomatyczne z jej wrogami, którzy mogą okazać się przydatni w naszych dążeniach do wolności."
 flavor_bos.1.a: "Wykorzystajmy tę okazję."
 flavor_bos.1.b: "#L [GetCountry('HUN').GetAdjectiveWithNoTooltip]ka#! [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] może liczyć na naszą lojalność."
 flavor_bos.1.b.entry: "Węgierska $crown_estate$ może liczyć na naszą lojalność."
 flavor_bos.1.a.tt: "Ciągłe podważanie władzy #L [GetCountry('HUN').GetAdjectiveWithNoTooltip|l]kiej#!, na przykład poprzez poprawę stosunków z rywalami i obniżanie naszej lojalności, może zmusić państwo [GetCountry('HUN').GetNameWithNoTooltip] do przemyślenia naszego statusu wasala."
 flavor_bos.1.historical_info: "Panowanie Stefana II charakteryzowało się staraniami zmierzającymi do wyzwolenia Bośni spod panowania węgierskiego poprzez rozgrywanie Węgier przeciwko ich rywalom. Po śmierci kluczowych sojuszników Węgier, takich jak król Karol Robert i Mikac ze Slawonii, Stefan zaczął wykorzystywać wojny Węgier z Wenecją, stosując łapówki, odmawiając lojalności, a nawet ujawniając pozycje wojskowe. Działania te przyniosły Stefanowi przydomek „Uczeń diabła” a nowy król Węgier mu nie ufał, ale wyczerpana korona nie miała siły ani woli, by go usunąć. Pod koniec jego panowania władza Węgier nad Bośnią stała się czysto nominalna."
 flavor_bos.2.title: "[GetCountry('SER').GetNameWithNoTooltip] i jej upadek"
 flavor_bos.2.entry: "Upadek Serbii"
 flavor_bos.2.desc: "[ser_dusan.GetName] nie żyje, a państwo [GetCountry('SER').GetName] od lat boryka się z wewnętrznymi problemami. Słabnąca władza sprawiła, że kilku lokalnych zarządców walczy o wpływy, choć żaden z nich nie posiada dynastycznej legitymacji ani autorytetu, by rościć sobie prawa do tronu. Ponieważ nasi władcy mieli dynastyczne powiązania z rządzącym rodem [ser_dusan.GetDynasty.GetName], możemy zgodnie z prawem rościć sobie prawa do ich korony."
 flavor_bos.2.a: "Wykorzystajmy podziały, by poszerzyć nasze wpływy."
 flavor_bos.2.b: "Skupmy się na sprawach wewnętrznych."
 flavor_bos.2.historical_info: "Wraz z wygaśnięciem dynastii Nemaniczów tron serbski pozostał nieobsadzony, a poszczególne lokalne rody sprawowały władzę nad rozdrobnionymi częściami dawnego imperium. Tvrtko I wykorzystał tę próżnię i powołując się na swoje pochodzenie z dynastii Nemaniczów po stronie babki ze strony ojca, zgłosił roszczenia do korony serbskiej oraz dążył do rozszerzenia wpływów Bośni na wschód."
 flavor_bos.3.title: "Pierwszy król państwa [ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_bos.3.entry: "$flavor_bos.3.title$"
 flavor_bos.3.desc: "Po udanej kampanii zagarnęliśmy ogromne obszary dawnych ziem #L [GetCountry('SER').GetAdjective|l]kich#!. Po tym zwycięstwie [target_ruler.GetName] ma dość odwagi, by przedstawić śmiałą propozycję. Pragnie nie tylko oficjalnie objąć tron państwa [GetCountry('SER').GetNameWithNoTooltip], ale także nadać krajowi [ROOT.GetCountry.GetName] status królestwa, stając pierwszym królem w historii naszego kraju."
 flavor_bos.3.a: "Nasz naród potrzebuje króla."
 flavor_bos.3.b: "Korona przynosi więcej problemów niż korzyści."
 flavor_bos.3.historical_info: "Na początku lat 70. XIV wieku dawne Cesarstwo Serbskie uległo rozpadowi i zostało podzielone między wielu lokalnych władców, wśród których był Tvrtko z Bośni. Sytuacja Tvrtko była jednak nieco odmienna. Rządził on już niepodległym państwem, które obejmowało znaczne tereny dawnego Carstwa Serbskiego. Co ważniejsze, twierdził, że wywodzi się z dynastii Nemaniczów, dzięki czemu posiadał prawo do korony, jakiego nie miał żaden inny serbski władca. Dzięki temu jego dwór sformułował podstawy koronacji i prawo do podwójnej korony, a Tvrtko stał się królem Serbów i Bośni jesienią 1377 roku."
 flavor_bos.4.title: "Zgromadzenie rady strojników"
 flavor_bos.4.entry: "$flavor_bos.4.title$"
 flavor_bos.4.desc: "Strojnicy, najstarsi dostojnicy kościoła #L [ROOT.GetCountry.GetAdjective|l]kiego#!, zebrali się, by omówić przyszły kierunek rozwoju naszej wiary. Na zgromadzeniu poruszono kwestie długotrwałych sporów, doktryn i wiele innych spraw."
 flavor_bos.4.a: "Kościół potrzebuje przede wszystkim stabilności."
 flavor_bos.4.b: "Powinniśmy postarać się o większą przejrzystość naszych nauk."
 flavor_bos.4.c: "Skupmy się na sporach wewnętrznych."
 flavor_bos.4.d: "Zajmijmy się utrzymaniem Kościoła."
 flavor_bos.5.title: "Los Kościoła #L [ROOT.GetCountry.GetAdjectiveWithNoTooltip]kiego#!"
 flavor_bos.5.entry: "$flavor_bos.5.title$"
 flavor_bos.5.desc: "Rosnąca presja, jaką wywiera [GetUniqueInternationalOrganization('catholic_church').GetName] na nasze [ROOT.GetCountry.GetFlavorRank|l], staje się coraz trudniejsza do zniesienia. Dotarły do nas doniesienia, że [target_pope.GetName] ponownie rozważa ogłoszenie krucjaty przeciwko państwu [ROOT.GetCountry.GetName], oskarżając nas o szerzenie niebezpiecznych herezji. Od pokoleń walczyliśmy o przetrwanie naszego rodzimego kościoła, ale być może nadszedł czas, aby się podporządkować i zapewnić sobie miejsce wśród narodów #L [ShowReligionAdjective('catholic')|l]kich#!."
 flavor_bos.5.a: "Nasz kościół przetrwa!"
 flavor_bos.5.b: "Dołączmy do świata #L [ShowReligionAdjectiveWithNoTooltip('catholic')|l]kiego#!."
 flavor_bos.5.c: "Postawimy na [ShowLocationNameWithNoTooltip('constantinople')]."
 flavor_bos.5_catholic_unhappy: "Wszystkie #L [ShowReligionAdjective('catholic')|l]kie#! [pops|el] tracą [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'satysfakcji')|e]."
 flavor_bos.5_krstjani_unhappy: "Wszystkie #L [ShowReligionAdjective('bosnian_church')|l]kie#! [pops|el] tracą [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'satysfakcji')|e]."
 flavor_bos.5_orthodox_unhappy: "Wszystkie #L [ShowReligionAdjective('orthodox')|l]e#! [pops|el] tracą [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'satysfakcji')|e]."
 flavor_bos.5.historical_info: "Kościół bośniacki był pod ciągłym ogniem krytyki i interwencji ze strony papiestwa, ponieważ często oskarżano go o szerzenie poglądów heretyckich. W 1203 roku przedstawiciele Kościoła podpisali „Deklarację z Bilina Polja”, w której zgodzili się porzucić praktyki uznane za heretyckie i dostosować się do doktryny katolickiej. Mimo to wielu wiernych nadal potajemnie kultywowało swoje tradycje. W 1337 roku papież Benedykt XII wezwał do kolejnej krucjaty, ale wysiłki te ostatecznie zakończyły się niepowodzeniem. Kościół bośniacki przetrwał aż do momentu przejęcia regionu przez Osmanów."
