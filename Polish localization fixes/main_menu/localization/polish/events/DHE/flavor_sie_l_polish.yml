l_polish:
 unlocked_advance_marble_tradition_tt: "Doszło do [Concept('dynamic_historical_event','dynamicznego historycznego wydarzenia')|e]: $flavor_sie.1.title$"
 flavor_sie.1.title: "Banca Monte dei Paschi"
 flavor_sie.1.entry: "$flavor_sie.1.title$"
 flavor_sie.1.desc: "Banki pobożne, lub #italic Monte di Pietà#!, stają się coraz powszechniejsze w naszym kraju i wokół nas. To instytucje charytatywne, wykorzystujące datki od darczyńców w charakterze nisko oprocentowanych pożyczek dla biednych. Finansowanie jednej z nich w [monte_paschi_bank_hq.GetName] przysłuży się powiększeniu majątku i ogólnego dostatku, jakim cieszy się [ROOT.GetCountry.GetFlavorRank|l], stając się naszym bankiem państwowym."
 flavor_sie.1.a: "Popłyną pieniądze."
 flavor_sie.1.b: "Też mi pobożność!"
 flavor_sie.1.historical_info: "#italic La Banca Monte dei Paschi di Siena#! zrodził się w Rebublice Sieny w 1472 roku i cieszy się statusem najdłużej działającego nieprzerwanie banku na świecie. Zaczął jako bank pobożny i uzyskał swą współczesną formę od Wielkiego Księcia Toskanii, a po zjednoczeniu Włoch rozwinął działalność na cały półwysep."
 flavor_sie.2.title: "$flavor_sie.1.title$"
 flavor_sie.2.desc: "Banki pobożne to instytucje charytatywne mające pomagać biednym. To jednak nie oznacza, że nie możemy skorzystać na ich działaniu i samemu się wzbogacić."
 flavor_sie.2.a: "Pieniądze będą nasze!"
 flavor_sie.3.entry: "$flavor_sie.3.title$"
 flavor_sie.3.title: "[ShowLocationNameWithNoTooltip('siena')] i złoty wiek"
 flavor_sie.3.desc: "Ekspansja #L [ROOT.GetCountry.GetAdjective]kich#! granic zapewnia rozkwit i wieloletni pokój, a [target_location.GetRank.GetName|l] [target_location.GetName] wchodzi w swój złoty wiek. Ulice tętnią życiem i codzienną pracą, co jest gwarancją nieustannego strumienia bogactwa. Nikt nie wyobraża sobie końca tego dobrobytu – niektórzy sądzą wręcz, że ten piękny okres potrwa wiecznie."
 flavor_sie.3.a: "Ta złota epoka będzie trwać wiecznie!"
 sie_gain_modifier_until_the_black_death: "Do czasu rozpoczęcia się nowej [Concept('situation','sytuacji')|e] [ShowSituationNameWithNoTooltip('black_death')], [ShowLocationName('siena')] zyska [Concept('location_modifier','modyfikator')|e] „[ShowModifier('sie_golden_age_of_siena')]”"
 flavor_sie.4.entry: "$flavor_sie.4.title$"
 flavor_sie.4.title: "Lizanie ran, jakie zadała [ShowSituationNameWithNoTooltip('black_death')]"
 flavor_sie.4.desc: "Zaraza, przez którą cierpią [ShowContinentName('europe')] i całe [ShowRegionName('italy_region')], pozostawia po sobie potężne blizny, a najgłębsze rany odnosi [target_location.GetName]. Niegdyś tętniące życiem ulice rozbrzmiewają teraz ponurym przypomnieniem, że śmierć nie ma swoich faworytów, a grzesznicy i święci podlegają równej ocenie, spotykając się ze śmiercią. Zamiast jednak pozwalać na dalsze trwanie tej tragedii, powinniśmy zastanowić się, jakiej pomocy udzieli państwo tak zniszczonemu obszarowi."
 flavor_sie.4.a: "Wykorzystamy skarb państwa, by odbudować [target_location.GetRank.GetNameWithNoTooltip]."
 flavor_sie.4.a.entry: "Wykorzystamy nasze środki, by odbudować tę lokację."
 sie_all_pops_lose_satisfaction: "Wszystkie [pops|el] na obszarze [target_location.GetName] stracą [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] [Concept('pop_satisfaction','satysfakcji')|e]"
 flavor_sie.4.b: "Cykl życia i śmierci jest wieczny i nieunikniony."
 flavor_sie.5.entry: "$flavor_sie.5.title$"
 flavor_sie.5.title: "Utworzenie portu w [ShowLocationNameWithNoTooltip('grosseto')]"
 flavor_sie.5.desc: "Nasza obecność morska u wybrzeży regionu [ShowRegionName('italy_region')] znajduje się wciąż w powijakach. Mimo to liczni [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] domagają się, aby państwo [ROOT.GetCountry.GetName] znacząco rozbudowało swoją flotę. Jedną z pierwszych lokalizacji wyznaczonych pod ten projekt jest niedawno przejęta miejscowość [target_location.GetName].\n\nWielu nowych osadników zamieszkało w granicach obszaru [target_location.GetNameWithNoTooltip] w nadziei, że dostrzeżemy jego ogromny wpływ na nasz kraj, i że dołożymy wszelkich starań, by utworzyć tam port z prawdziwego zdarzenia."
 flavor_sie.5.a: "Będziemy chronić nasz handel morski."
 flavor_sie.5.b: "Powinniśmy raczej skupić się na lądzie."
 flavor_sie.6.entry: "$flavor_sie.6.title$"
 flavor_sie.6.title: "Morskie wpływy w [ShowLocationNameWithNoTooltip('pitigliano')]"
 flavor_sie.6.desc: "Nasi [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] od dawna nie mają wystarczających zasobów, by móc konkurować w handlu morskim, któryms szczycą się [ShowRegionName('italy_region')]. Przede wszystkim, brakuje im sieci własnych portów w mieście [target_location.GetMarket.GetName], ale to nie znaczy, że nie możemy tego zmienić.\n\n[target_location.GetRank.GetName] [target_location.GetName] to miejsce, do którego tłumnie ściągają [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] i namawiają dwór na inwestycję w rozbudowę tego portu, by przekształcić go w centrum handlu dostępne dla każdego."
 flavor_sie.6.a: "Rozbudujmy ten port."
 flavor_sie.6.b: "Nie zamierzamy opróżniać całego naszego skarbca tylko po to, aby spełniać roszczenia, które zgłaszają [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]."
 flavor_sie.6.b.entry: "Nie zamierzamy przeznaczyć całego naszego budżetu na spełnianie życzeń bogaczy."
 flavor_sie.7.entry: "$flavor_sie.7.title$"
 flavor_sie.7.title: "Port [ShowLocationNameWithNoTooltip('piombino')]"
 flavor_sie.7.desc: "Kupcy, [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] oraz [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] ściągają tłumnie do miasta [target_location.GetName], co przyciągnęło uwagę dworu.\n\nPonieważ rozbudowa portu wzmocniłaby nasze morskie szlaki handlowe, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] mają prośbę, której [target_character.GetName] musi wysłuchać. Powinniśmy wykorzystać krajowe funudsze, żeby przekształcić [target_location.GetRank.GetNameWithNoTooltip] w jeden z najważniejszych ośrodków miejskich, z którego będą dumne całe [ShowRegionName('italy_region')]."
 flavor_sie.7.a: "By wzmocnić nasz handel, zbudujemy ten port."
 flavor_sie.7.b: "Nie potrzebujemy kolejnego takiego portu."
 flavor_sie.8.entry: "$flavor_sie.8.title$"
 flavor_sie.8.title: "Powrót z wygnania"
 flavor_sie.8.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], którzy mają wpływ na politykę #L [ROOT.GetCountry.GetAdjective|l]ką#! nie są niczym dziwnym i rzadkim, ale nikomu nie udało się dorównać potędze rodziny [GetDynasty('petrucci').GetName] – przynajmniej do czasu ich wygnania w związku z plotkami o próbie zamachu stanu.\n\nMimo to jedna z osób pochodzących rodu [GetDynasty('petrucci').GetNameWithNoTooltip] powróciła do miejsca narodzin przodków, słynnego miasta [target_capital.GetName]. Wielu maluczkich z radością wita tę znamienitą postać, wychwalając [target_character.GetHerHis] imię i mając nadzieję, że uwolni ich od korupcji, którą przesiąknęli tutejsi [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l]. Inni jednak obawiają się powrotu dawnych ambicji i domagają się, by dwór wygnał ród [GetDynasty('petrucci').GetNameWithNoTooltip], zanim jego członkowie kolejnego zamachu stanu."
 flavor_sie.8.a: "Nie boimy się wpływu pojedynczej osoby."
 flavor_sie.8.b: "Jest mnóstwo świetnych sposobów, by kogoś trzymać w ryzach..."
 flavor_sie.8.c: "Ta rodzina została wygnana nie bez powodu."
 sie_triumphant_return_means_possibility_of_coup: "Kiedy tylko [target_character.GetName] powróci do [ROOT.GetCountry.Custom('C_DOP')], z pewnością spróbuje przejąć pełnię władzy, i rządzić jako [ruler|e]."
 flavor_sie.9.entry: "$flavor_sie.9.title$"
 flavor_sie.9.title: "Zdobycie władzy"
 flavor_sie.9.desc: "Wiele lat temu państwo [ROOT.GetCountry.GetLongName] było podzielone, a różne rodziny zajmowały różne stanowiska. Przez to przywódcy naszego kraju byli podzieleni niemal w każdej sprawie. Jednak odkąd [target_character.GetName] posiada władzę, wiele z tych stanowisk zajęli lojalni zwolennicy – albo poplecznicy, albo członkowie rodziny, którzy w pełni popierają tę zmianę w układzie sił.\n\nPodczas spotkania z dworem nikt nie odważył sprzeciwić się obecnej władzy, bojąc się, że wpływ, jaki posiada [target_character.GetName], wystarczy do uciszenia każdego politycznego przeciwnika. \n\nTa ścisła kontrola nad krajem doprowadziła teraz do dominacji rodu [target_character.GetDynasty.GetName] [ROOT.GetCountry.Custom('C_LOC')]."
 flavor_sie.9.a: "Jedna rodzina, która rządzi wszystkimi."
 flavor_sie.10.entry: "$flavor_sie.10.title$"
 flavor_sie.10.title: "[ShowLocationNameWithNoTooltip('siena')] i styl w sztuce"
 flavor_sie.10.desc: "Obecnie [ShowInstitutionName('renaissance')] silnie zmienia lokalną sztukę. Ten nowy prąd przenika całe [ShowRegionName('italy_region')]. Najciekawsze zjawisko stanowi tutejszy styl #L [ROOT.GetCountry.GetAdjective]ki#!, skupiony na mistycznym i religijnym misterium. Zdecydowanie kontrastuje z tym, co reprezentuje [ShowLocationName('florence')]. Wykorzystując tę sytuację, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] dostrzega szansę na kulturową ekspansję, którą sławiłaby cała [ShowContinentName('europe')]. Pozwoli to zaprezentować nasz ogromny prestiż wszystkim dookoła."
 flavor_sie.10.a: "Sprawimy, że [ShowLocationNameWithNoTooltip('siena')] stanie się najbardziej prestiżowym ze wszystkich miejsc!"
 flavor_sie.10.b: "Nie stać nas na takie ambicje."
 flavor_sie.11.entry: "$flavor_sie.11.title$"
 flavor_sie.11.title: "Rozwój szkoły w mieście [ShowLocationNameWithNoTooltip('siena')]"
 flavor_sie.11.desc: "Szczytowy rozwój nowej epoki, znanej jako [ShowInstitutionName('renaissance')], całkowicie przekształca lokalną tożsamość. Jego wpływy obejmują całe [ShowRegionName('italy_region')], a wiele miast przyjmuje własne style artystyczne. Nasza rodzima tradycja #L [ROOT.GetCountry.GetAdjective]ka#! ma wielkie szczęście. Pojawia się fala nowych twórców chętnych szlifować ten nurt w sztuce.\n\nWśród nich błyszczy [target_character.GetName]. [target_character.GetWomanMan] pragnie dopracować technikę o silnych wpływach religijnych w mieście [ShowLocationName('siena')]."
 flavor_sie.11.a: "Przyjmiemy takich artystów jak [target_character.GetHerHim]."
 flavor_sie.11.a.entry: "Przyjmiemy nowych artystów."
 flavor_sie.11.b: "Zamiast trzymać się naszego obecnego stylu, być może powinniśmy poszukać inspiracji u innych."
 flavor_sie.12.entry: "$flavor_sie.12.title$"
 flavor_sie.12.title: "Święty z miasta [ShowLocationNameWithNoTooltip('siena')]"
 flavor_sie.12.desc: "[target_character.GetName] uważa, że jedynym prawdziwym bóstwem [target_character.GetReligion.GetGodName], a całe miasto [ShowLocationName('siena')] uważa tę światłą osobę za najlepszy wzór pobożności, jaki kiedykolwiek widziały [ShowRegionName('italy_region')], niemal równy papieżowi.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] zauważa tę gorącą wiarę i skupienie na konkretnej religijności. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] uznali to za dobrą okazję do pokazania reszcie #L [ROOT.GetCountry.GetReligion.GetAdjective|l][Select_CString(Or(EndsWith(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'k'),Or(EndsWith(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'n'),EndsWith(ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip, 'ł'))),'ego','kiego')]#! świata naszego religijnego oddania, natomiast [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] uważają tę postać za świętą i przynoszącą im dobrobyt."
 flavor_sie.12.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_sie.12.a.entry: "Świetnie!"
