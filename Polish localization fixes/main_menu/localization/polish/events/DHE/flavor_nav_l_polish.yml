l_polish:
 flavor_nav.1.title: "Wspólne rządy [target_character.GetNameWithNoTooltip] i [target_character_2.GetNameWithNoTooltip]"
 flavor_nav.1.entry: "Wspólne rządy Joanny II i Filipa z Évreux"
 flavor_nav.1.desc: "Following their ascension to the throne of [ROOT.GetCountry.GetName] in 1329, [target_character.GetName] and [target_character_2.GetName] have ruled the [ROOT.GetCountry.GetFlavorRank] closely; however, [target_character_2.GetNameWithNoTooltip]'s possessions in [ShowRegionName('france_region')] are clearly preferred by the joint rulers, who frequently leave [ROOT.GetCountry.GetNameWithNoTooltip] to take up residence in their [ShowCultureGroupNameWithNoTooltip('french_group')] holdings.\n\nAlthough the [ROOT.GetCountry.GetGovernment.GetCourtTitle] has found many capable regents to govern the [ROOT.GetCountry.GetFlavorRank] in the rulers' absence, there have been growing qualms over the past few years, with many [ROOT.GetCountry.GetAdjectiveWithNoTooltip] lords wishing to petition the two rulers to take up more permanent residence in [ROOT.GetCountry.GetCapital.GetName] lest the [ROOT.GetCountry.GetFlavorRank] appear weak in the eyes of covetous foreign powers."
 flavor_nav.1.a: "Nasze posiadłości w [ShowRegionNameWithNoTooltip('france_region')] są dla nas najważniejsze."
 flavor_nav.1.b: "Oba królestwa mają być zarządzane w równym stopniu."
 flavor_nav.1.c: "Ziemie [ROOT.GetCountry.GetNameWithNoTooltip] muszą być naszą główną troską."
 flavor_nav.2.title: "Wstąpienie na tron [target_character.GetNameWithNoTooltip]"
 flavor_nav.2.entry: "Wstąpienie na tron Karola z Nawarry"
 flavor_nav.2.desc: "Śmierć [GetCharacter('nav_jeanne_ii_capet').GetName] sprawiła, że na tron wstąpił(a) ambitny(a) [target_character.GetName]. Po przybyciu do [ROOT.GetCountry.GetCapital.GetName] na ceremonię i koronację [ROOT.GetCountry.GetGovernment.GetAdjective|U] władzy, [target_character.GetSheHe] już teraz okazuje się władcą nietypowym, ukazując [target_character.GetHerselfHimself] jako osobę niekonwencjonalną, gdyż [target_character.GetNameWithNoTooltip] wyraził(a) chęć złożenia przysięgi w dialekcie [ShowDialectName('aragonese_dialect')]. Wywołało to pewną frustrację wśród [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], którzy woleliby, by przysięga została złożona w tradycyjnym języku [ShowLanguageNameWithNoTooltip('latin_language')]."
 flavor_nav.2.a: "Złóż przysięgę w języku romańskim."
 flavor_nav.2.b: "Głupi pomysł: przysięga musi być złożona w [ShowLanguageNameWithNoTooltip('latin_language')]."
 flavor_nav.2.c: "Niech przysięga zostanie złożona zamiast tego w [ShowLanguageNameWithNoTooltip('basque_language')]."
 flavor_nav.3.title: "Posiadłości [target_character.GetNameWithNoTooltip]"
 flavor_nav.3.entry: "Francuskie posiadłości Karola z Nawarry"
 flavor_nav.3.desc: "Having inherited both the lands of [GetCharacter('nav_philip_iii_evreux').GetName] and [GetCharacter('nav_jeanne_ii_capet').GetName], [target_character.GetName] now rules an expansive territory, encompassing [ROOT.GetCountry.GetName] and several holdings within [ShowRegionName('france_region')]. Though [GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip] and [GetCharacter('nav_philip_iii_evreux').GetNameWithNoTooltip] ruled [ROOT.GetCountry.GetNameWithNoTooltip] jointly, they only visited the [ROOT.GetCountry.GetFlavorRank] briefly, preferring to maintain residence in [ShowRegionNameWithNoTooltip('france_region')].\n\nWith [target_character.GetNameWithNoTooltip] ascension, many allies in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have urged [target_character.GetHerHim] to take up a more permanent residence in [ROOT.GetCountry.GetNameWithNoTooltip], although others feel the [ROOT.GetCountry.GetGovernment.GetRulerTitle] may have greater ambitions towards the contested throne of [ShowRegionNameWithNoTooltip('france_region')]."
 flavor_nav.3.a: "Prowadź sprawy [ROOT.GetCountry.GetGovernment.GetCourtTitle] w naszych posiadłościach w [ShowRegionNameWithNoTooltip('france_region')]."
 flavor_nav.3.b: "Ustanówmy główną siedzibę [ROOT.GetCountry.GetGovernment.GetCourtTitle] w [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_nav.3.c: "Skupmy nasze rządy w [evr_country.GetNameWithNoTooltip]."
 flavor_nav.3.c.entry: "Skupmy nasze rządy w Evreux."
 nav_will_be_able_to_rally_other_appanages_tt: "Reaching #G 190#! relations with a Appanage subject of [GetCountry('FRA').GetName] will make them more inclined to support us in a war against [GetCountry('FRA').GetNameWithNoTooltip] to seize the throne"
 flavor_nav.4.title: "Roszczenie rodu [ShowDynastyNameWithNoTooltip('capet_dynasty')]"
 flavor_nav.4.entry: "Roszczenie Kapetyngów"
 flavor_nav.4.desc: "Though many had suspected [target_character.GetName] to be an ambitious [ROOT.GetCountry.GetGovernment.GetRulerTitle], many did not expect to hear [target_character.GetHerHis] desire to claim the throne of [fra_country.GetName] directly. While [target_character.GetNameWithNoTooltip] claim is strong through [GetCharacter('nav_jeanne_ii_capet').GetShortName]'s [ShowDynastyName('capet_dynasty')] blood, one of the conditions of [GetCharacter('nav_jeanne_ii_capet').GetHerHis] inheritance of [ROOT.GetCountry.GetName] was to forfeit the claim to [fra_country.GetNameWithNoTooltip].\n\nWhile many lords of [fra_country.GetNameWithNoTooltip] are also unlikely to fully acknowledge [target_character.GetNameWithNoTooltip]'s claim due to the ancient [ShowHeirSelectionName('salic_law')], some feel [target_character.GetNameWithNoTooltip] should utilize [target_character.GetHerHis] political influence within [fra_country.GetNameWithNoTooltip] to persuade the more powerful lords."
 flavor_nav.4.a: "Tron [fra_country.GetNameWithNoTooltip] słusznie należy się [target_character.GetNameWithNoTooltip]!"
 flavor_nav.4.a.entry: "Tron Francji słusznie należy się Karolowi!"
 flavor_nav.4.b: "Wykorzystajmy te roszczenia dla umocnienia legitymizmu wśród naszych [ShowCultureGroupNameWithNoTooltip('french_group')] poddanych."
 flavor_nav.4.c: "[GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip] już zrzekł się [GetCharacter('nav_jeanne_ii_capet').GetHerHis] roszczenia: skupmy się zamiast tego na rządzeniu [ROOT.GetCountry.GetNameWithNoTooltip]."
 unlocks_enforce_the_capetian_claim_to_france_tt: "Odblokowuje $navarre_charles_ii_claim_to_france.title$ [decision|e]"
 nav_appanage_support_for_french_throne_tt: "If [ROOT.GetCountry.GetNameWithNoTooltip] is an Appanage, reaching #G +190#! relations with other Appanage subjects of [GetCountry('FRA').GetNameWithNoTooltip] will incline them to to support us in a war against [GetCountry('FRA').GetNameWithNoTooltip] to seize the throne"
 flavor_nav.5.title: "Sojusz z [target_character_2.GetNameWithNoTooltip]"
 flavor_nav.5.entry: "Sojusz z Etienne Marcelem"
 flavor_nav.5.desc: "Initially, many of [target_character.GetName]'s efforts to garner support were stalled, with multiple [fra_country.GetAdjectiveWithNoTooltip] lords expressing their loyalty to [fra_ruler.GetName] and rejecting [target_character.GetName]'s claim. But while [target_character.GetNameWithNoTooltip] has managed to sway some lesser [fra_country.GetAdjectiveWithNoTooltip] lords, many of [target_character.GetShortNameWithNoTooltip]'s advisors did not expect to hear that the prominent [target_character_2.GetName] was willing to throw [target_character_2.GetHerHis] support behind [target_character.GetNameWithNoTooltip]. Although a member of the [fra_country.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], [target_character_2.GetNameWithNoTooltip] has long been a thorn in the side of [fra_ruler.GetNameWithNoTooltip], stalling many of [target_character_3.GetHerHis] efforts in the Estates-General. Although [target_character_2.GetNameWithNoTooltip] would prove an invaluable asset, some fear [target_character_2.GetHerHis] ambitions may diverge from those of [target_character.GetNameWithNoTooltip], and therefore [target_character_2.GetSheHe] may prove a liability.\n\nFurthermore, [target_character_2.GetNameWithNoTooltip] has brought news that the lords of [nrm_country.GetName] have grown discontent with [fra_ruler.GetNameWithNoTooltip], and would likely be willing to offer their support to [target_character.GetShortNameWithNoTooltip]."
 flavor_nav.5.a: "[target_character_2.GetNameWithNoTooltip] okaże się bezcennym współpracownikiem."
 flavor_nav.5.a.entry: "Etienne Marcel okaże się bezcennym współpracownikiem."
 flavor_nav.5.b: "Poleć [target_character_2.GetHerHim], aby przekierował dochody z [fra_country.GetNameWithNoTooltip] do naszej skrzyni."
 flavor_nav.5.b.entry: "Poleć mu, aby przekierował dochody z Francji do naszej skrzyni."
 flavor_nav.5.c: "Odrzućmy całkowicie [target_character_2.GetHerHis] pomoc. Zdobędziemy [fra_country.GetNameWithNoTooltip] bez [target_character_2.GetHerHis] intryg."
 flavor_nav.5.c.entry: "Odrzućmy całkowicie jego pomoc. Zdobędziemy Francję bez jego intryg."
 nav_decision_seizure_of_duchy_of_normandy_tt: "Odblokowuje $nav_coercing_of_normandy.title$ [decision|e]"
 flavor_nav.6.title: "Ognisty koniec"
 flavor_nav.6.entry: "Śmierć Karola Nawarry w płomieniach"
 flavor_nav.6.desc: "Although [target_character.GetName]'s health has declined in recent years, the [ROOT.GetCountry.GetGovernment.GetCourtTitle] was still stunned by the news that [target_character.GetSheHe] had died in a fire in [target_character.GetHerHis] chambers the previous night. Rumors swirling in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] whispered that while being treated for [target_character.GetHerHis] illness, a candle fell into [target_character.GetNameWithNoTooltip]'s bed and set it ablaze.\n\n[our_ruler.GetName] now ascends the throne with fewer ambitions than [our_ruler.GetHerHis] predecessor, and many wonder how the scribes of [ROOT.GetCountry.GetName] will remember [target_character.GetNameWithNoTooltip]'s rule."
 flavor_nav.6.a: "[target_character.GetHerHis] reign will be remembered as an ambitious, but terrible one."
 flavor_nav.6.b: "[target_character.GetSheHe] shall be remembered as the Conqueror of [GetCountry('FRA').GetNameWithNoTooltip]!"
 flavor_nav.6.c: "[target_character.GetSheHe] shall be remembered for [target_character.GetHerHis] shift towards [ROOT.GetCountry.GetNameWithNoTooltip], despite [target_character.GetHerHis] [ShowCultureGroupNameWithNoTooltip('french_group')] origins."
 flavor_nav.6.d: "Powinniśmy raczej spoglądać w przyszłość."
 flavor_nav.7.title: "Sporne pogranicza"
 flavor_nav.7.entry: "Podział ziem pogranicznych"
 flavor_nav.7.desc: "Although relations between [ROOT.GetCountry.GetName] and [cas_country.GetName] have been hostile in the past, the rulers of [cas_country.GetNameWithNoTooltip] have never sought a full conquest of the [ROOT.GetCountry.GetFlavorRank]. However, in the borderlands of [ShowProvinceDefinitionName('biscay_province')], [ShowProvinceDefinitionName('gipuzkoa_province')], and [ShowProvinceDefinitionName('alava_province')], tensions have been mounting between the more powerful local families for some time over the region's poorly defined borders.\n\nWhile representatives for [cas_country.GetName] and [our_ruler.GetName] have worked towards resolving the border disputes, the outbreak of the [ShowDisasterName('castilian_civil_war')] in [cas_country.GetNameWithNoTooltip] has greatly stalled further negotiations, resulting in even more strife between the prominent regional dynasties.\n\nWith [cas_country.GetNameWithNoTooltip] now mired in internal conflict, representatives from these local families have petitioned [our_ruler.GetNameWithNoTooltip] to launch an invasion to claim the disputed lands."
 flavor_nav.7.a: "Te spory terytorialne, jeśli nie zostaną rozwiązane, zapewne nadal będą budzić gniew rodów [ROOT.GetCountry.GetAdjectiveWithNoTooltip]."
 flavor_nav.7.b: "Zawieśmy dalsze rozmowy dyplomatyczne: musimy zapewnić, by nasze roszczenie do tego regionu się utrzymało!"
 flavor_nav.8.title: "Próżnia władzy rozlewa się na [ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_nav.8.entry: "Próżnia władzy rozlewa się na Nawarrę"
 flavor_nav.8.desc: "While the [ShowDisasterName('castilian_civil_war')] has ended, the aftermath throughout [ShowRegionName('iberia_region')] are still being felt. With much of the borderlands now less garrisoned, many of the bad blood between families of the region has evolved into open warfare.\n\nDue to the low strength of [cas_country.GetName], the intensity of the conflict of the region would prove a daunting task for the [ROOT.GetCountry.GetGovernment.GetCourtTitle] of [ROOT.GetCountry.GetName] to resolve alone."
 flavor_nav.8.a: "Przed [ROOT.GetCountry.GetNameWithNoTooltip] stoją niebezpieczne czasy."
 nav_end_blood_feud_decision_enabled_tt: "Odblokowuje [decision|e] $nav_end_the_blood_feuds.title$"
 nav_sow_division_in_the_borderlands_enabled_tt: "Odblokowuje [decision|e] $nav_sow_division_in_the_borderlands.title$"
 flavor_nav.9.title: "Rozwiązanie [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')]"
 flavor_nav.9.entry: "Rozwiązanie Biskajii"
 flavor_nav.9.desc: "Though control of [ShowProvinceDefinitionName('biscay_province')] has long been contested by [cas_country.GetName] and [ROOT.GetCountry.GetName], the region has been home to many prominent families, of which the Haro dynasty have served as the most influential and faithful vassals. However, [cas_country.GetName] have taken to directly dissolving titles in the region, and subsequently annexing areas within [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')] that were in dispute.\n\nThese actions by [cas_country.GetNameWithNoTooltip] have greatly enraged the Haro family, who have urged the [ROOT.GetCountry.GetGovernment.GetCourtTitle] to fund the rebels in [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')] as to crack down on those who sided with [cas_country.GetAdjectiveWithNoTooltip]'s annexation of the region."
 flavor_nav.9.a: "Nie możemy przystać na żądania rodu Haro, nie ściągając na siebie gniewu [cas_country.GetAdjectiveWithNoTooltip]."
 flavor_nav.9.a.entry: "Nie możemy przystać na żądania rodu Haro, nie ściągając na siebie gniewu Kastylii."
 flavor_nav.9.b: "Wesprzeć ród Haro w siewie lokalnej anarchii."
 flavor_nav.10.title: "Kościelne powołanie"
 flavor_nav.10.entry: "$flavor_nav.10.title$"
 flavor_nav.10.desc: "[target_character.GetName], pierwsza córka, jakiej [Select_CString(target_ruler.IsFemale,'doczekała','doczekał')] się [ROOT.GetCountry.GetGovernment.GetRuler.GetName], wypatruje przybycia świty mającej jej towarzyszyć w drodze do nowego życia – już niebawem powita ją [ShowLocationName('paris')].\n\nGdy przyszła na świat, wszystkie gwiazdy zdawały się układać pomyślnie. Miała wszak odziedziczyć wszystko, co należało do jej rodziców. Miał ją poślubić [GetCountry('ARA').GetGovernment.GetRuler.GetName], lecz małżeństwo zostało odwołane, a [target_character.GetNameWithNoTooltip] stała się jedynie przeszkodą, jaką miała przezwyciężyć jej młodsza siostra, [target_sister.GetShortName].\n\nTeraz miejsce znajdzie dla niej [ShowLocationNameWithNoTooltip('paris')] i tamtejsi [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l], u boku których [target_character.GetNameWithNoTooltip] będzie sławić imię Pana.\n\nJednak niektórzy wciąż się zastanawiają, czy mogłaby jeszcze się przysłużyć królestwu i odegrać rolę w dyplomatycznych negocjacjach."
 flavor_nav.10.a: "Zostanie zakonnicą."
 flavor_nav.10.a.entry: "Wykorzystać autorytet korony, by zapobiec dalszemu rozlewowi krwi."
 flavor_nav.10.b: "Może się jeszcze przydać."
 flavor_nav.11.title: "Rody wspierane przez [ROOT.GetCountry.GetAdjectiveWithNoTooltip] zdobywają przewagę w regionie [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]"
 flavor_nav.11.entry: "Rody wspierane przez Nawarrę zdobywają przewagę w pogranicznych ziemiach"
 flavor_nav.11.desc: "Although the conflicts between the Pro [ROOT.GetCountry.GetAdjective] and [GetCountry('CAS').GetAdjective] families in the [ShowScriptedGeographyName('nav_contested_basque_borderlands')] has left a devastating effect on the region, [ROOT.GetCountry.GetAdjective] families have managed to do the near impossible, and restore much of [ROOT.GetCountry.GetNameWithNoTooltip]'s influence over the [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]. While [GetCountry('CAS').GetNameWithNoTooltip] may still maneuver to reassert its control over the region, it will undoubtedly prove a costly affair for the [GetCountry('CAS').GetAdjectiveWithNoTooltip] [GetCountry('CAS').GetGovernment.GetCourtTitle]."
 flavor_nav.11.a: "Niech to utoruje drogę ku silniejszej [ROOT.GetCountry.GetNameWithNoTooltip]."
 navarre_gains_castile_basque_lands_tt: "Wszystkie prowincje należące do [GetCountry('CAS').GetName] w regionie [ShowScriptedGeographyName('nav_contested_basque_borderlands')] będą miały wysoką szansę na zmianę przynależności na rzecz [ROOT.GetCountry.GetName], chyba że [GetCountry('CAS').GetNameWithNoTooltip] zdecydują się na drastyczne środki, by zachować kontrolę nad tymi terytoriami"
 flavor_nav.12.title: "Wzmocnienie Hermandades"
 flavor_nav.12.entry: "$flavor_nav.12.title$"
 flavor_nav.12.desc: "Although the Hermandades of [ROOT.GetCountry.GetName] have proven capable allies in the past, the decades of blood feuds between various families of [ROOT.GetCountry.GetAdjectiveWithNoTooltip] has reached a boiling point.\n\nMany members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have contributed funds to sponsor the [ROOT.GetCountry.GetGovernment.GetAdjective|U] branch of the Hermandades. Although an expensive affair, once empowered, the Hermandades will help enforce [our_ruler.GetName]'s authority over the feuding families and help rein them in for good."
 flavor_nav.12.a: "Hermandady w końcu położą kres tym rodowym sporom."
 flavor_nav.13.title: "[target_character.GetNameWithNoTooltip] a wychowanie [scope_our_heir.GetNameWithNoTooltip]"
 flavor_nav.13.entry: "Juan de Beaumont a wychowanie następcy"
 flavor_nav.13.desc: "Choć od pewnego czasu cieszą się wpływami w [ROOT.GetCountry.GetName], propozycja rodu Beaumontów, by osobiście wychowywać [scope_our_heir.GetName], wzbudziła zaskoczenie. Choć [target_character.GetName] cieszy się opinią człowieka honoru, niektórzy doradcy obawiają się, że [target_character.GetHerHis] oferta wychowania może być zabiegiem mającym na celu zjednanie sobie względów [scope_our_heir.GetNameWithNoTooltip], który pewnego dnia będzie rządzić [ROOT.GetCountry.GetAdjectiveWithNoTooltip]."
 flavor_nav.13.a: "[target_character.GetHeShe] would make for an excellent tutor."
 flavor_nav.13.a.entry: "Byłby znakomitym nauczycielem."
 flavor_nav.13.b: "Nie możemy ryzykować, by [target_character.GetHerHim] zyskał wpływ na naszego [scope_our_heir.GetNameWithNoTooltip]."
 flavor_nav.13.b.entry: "Nie możemy ryzykować, by miał wpływ na naszego następcę."
 flavor_nav.14.title: "[scope_our_consort.GetNameWithNoTooltip] i [target_character.GetNameWithNoTooltip]"
 flavor_nav.14.entry: "Wpływy małżonki i Pedro de Peralta"
 flavor_nav.14.desc: "Jeden z czołowych rodów na [ROOT.GetCountry.GetGovernment.GetCourtTitle], Agramontese, zyskuje znaczne wpływy dzięki [target_character.GetName], budując przy tym bliskie porozumienie z [scope_our_consort.GetName]. Choć ich starania przyniosły korzyści [ROOT.GetCountry.GetName], niektórzy obawiają się, że w ich knowaniach mogą kryć się mroczniejsze zamiary."
 flavor_nav.14.a: "Agramontese dobrze nam służyli."
 flavor_nav.14.b: "[target_character.GetHerHis] influence with [scope_our_consort.GetNameWithNoTooltip] is concerning: move to seperate them."
 flavor_nav.14.b.entry: "Jego wpływ na małżonka budzi niepokój: należy ich rozdzielić."
 flavor_nav.15.title: "Nadciągająca uzurpacja [the_legal_heir.GetNameWithNoTooltip]"
 flavor_nav.15.entry: "Nadciągająca uzurpacja spadkobiercy"
 flavor_nav.15.desc: "Though [our_ruler.GetName] has maintained a steady rule, [our_ruler.GetSheHe] has recently become bedridden and ill. Fearing the end of the [ROOT.GetCountry.GetGovernment.GetRulerTitle]'s life is near, Agramontese supporters loyal to [the_consort_usurper.GetName] have quietly crowned [the_consort_usurper.GetHerHim] the new ruler of [ROOT.GetCountry.GetName].\n\nWhile [the_legal_heir.GetNameWithNoTooltip] is away from [ROOT.GetCountry.GetGovernment.GetCourtTitle], some among the Beaumonteses have secretly sent letters to [the_legal_heir.GetNameWithNoTooltip] to inform [the_legal_heir.GetHerHim] of the betrayal, hoping to crush the Agramontese plot before it can come to fruition."
 flavor_nav.15.a: "[the_consort_usurper.GetNameWithNoTooltip] jest bardziej zdatny do rządzenia [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_nav.15.a.entry: "Dwór jest bardziej godny rządzenia Nawarrą."
 flavor_nav.15.b: "Side with [the_legal_heir.GetNameWithNoTooltip], the legal ruler of [ROOT.GetCountry.GetNameWithNoTooltip]!"
 flavor_nav.15.b.entry: "Opowiedz się za naszym spadkobiercą, prawowitym władcą Nawarry!"
 flavor_nav.15.historical_info: "Współwładcy Blanka I i Jan II postanowili, że ich syn Karol, książę Viany, odziedziczy tron Nawarry po śmierci Blanki. Jednak zamiast przekazać tron Karolowi, Jan II postanowił zatrzymać rządy nad ziemiami Nawarry, faktycznie stając się królem i obalając własnego syna. Wspierani odpowiednio przez Beaumontczyków i Agramontczyków, obaj później starli się w nawarryjskiej wojnie domowej, z której ostatecznie zwycięsko wyszedł Jan II, zachowując tron Nawarry."
 flavor_nav.16.title: "Roszczenie [target_country.GetAdjectiveWithNoTooltip]"
 flavor_nav.16.desc: "Zdobywszy znaczne poparcie w całej [ShowRegionName('france_region')], [target_character.GetName] otwarcie ogłosił/a swoje prawa do tronu [ShowRegionNameWithNoTooltip('france_region')] i wysłał/a posłańców po całej [ShowRegionNameWithNoTooltip('france_region')], oferując ostatnią szansę przyłączenia się do [target_character.GetHerHim] w [target_character.GetHerHis] próbie jego przejęcia. Choć [target_character.GetShortNameWithNoTooltip] zaskarbił/a sobie wiele przychylności u naszego [ROOT.GetCountry.GetGovernment.GetCourtTitle], niektórzy członkowie rady obawiają się, że [target_character.GetSheHe] mocno zdestabilizuje [ShowRegionNameWithNoTooltip('france_region')], jeśli [target_character.GetSheHe] odniesie sukces."
 flavor_nav.16.a: "Opowiemy się za [target_character.GetNameWithNoTooltip]."
 flavor_nav.16.b: "Pozostaniemy poza tym konfliktem."
 flavor_nav.16.c: "[target_character.GetSheHe] must be stopped."
 flavor_nav.17.title: "[ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')] w niedoli"
 flavor_nav.17.desc: "Wiele naszych terytoriów wzdłuż [ShowScriptedGeographyName('nav_contested_basque_borderlands')] z [GetCountry('NAV').GetName] zostało opanowanych przez frakcje sprzyjające [GetCountry('NAV').GetAdjectiveWithNoTooltip], a wiele rodzin [ShowCultureName('basque')] wiernych [ROOT.GetCountry.GetName] zostało doszczętnie zrujnowanych. Choć niektórzy z [ROOT.GetCountry.GetGovernment.GetCourtTitle] uważają, że region nie jest jeszcze stracony, trudno będzie odzyskać nad nim władzę, gdy wielu jego mieszkańców jest teraz zależnych od potężnych rodów [GetCountry('NAV').GetAdjectiveWithNoTooltip]."
 flavor_nav.17.a: "Niech pogranicze odłączy się na rzecz [GetCountry('NAV').GetNameWithNoTooltip]."
 flavor_nav.17.b: "Zapamiętamy ten bunt [ShowCultureNameWithNoTooltip('basque')] ludów."
 flavor_nav.17.c: "Ruszamy natychmiast stłumić bunt, bez względu na koszty!"
 flavor_nav.20.title: "San Francisco de Olite"
 flavor_nav.20.entry: "$flavor_nav.20.title$"
 flavor_nav.20.desc: "Jako niezmiernie pobożna osoba, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] nie godzi się z powolnymi postępami prac nad klasztorem św. Franciszka w [ShowLocationName('olite')].\n\nBudowa rozpoczęła się ponad sto lat temu, a do ukończenia jeszcze daleko.\n\nChoć przyspieszenie prac może przetrzebić nasz skarbiec, skorzysta na nim kraj i nasz prestiż."
 flavor_nav.20.a: "Chwalmy Pana!"
 flavor_nav.20.b: "Klasztor tyle już czekał – może jeszcze poczekać."
 flavor_nav.20.historical_info: "Jak głosi legenda, św. Franciszek z Asyżu założył konwent w Olite podczas pielgrzymki do Santiago de Compostela (ok. 1213–1214 r.).\n\nZbudowany przez króla Tybalda II klasztor cieszył się później finansowym i duchowym wsparciem kolejnych władców Nawarry – szczególnie Joanny II i Karola II – co przykładało się do jego rozrostu.\n\nZ czasem klasztor przechodził zmiany – stał się „szkołą apostolską” nauczającą i wysyłającą misjonarzy do Hiszpanii i Ameryki, a także służył jako szpital w trakcie wojny w 1795 r."
 flavor_nav.21.title: "Kościelne powołanie"
 flavor_nav.21.entry: "$flavor_nav.21.title$"
 flavor_nav.21.desc: "[target_character.GetName], pierwsza córka, jakiej [Select_CString(target_ruler.IsFemale,'doczekała','doczekał')] się [ROOT.GetCountry.GetGovernment.GetRuler.GetName], wypatruje przybycia świty mającej jej towarzyszyć w drodze do nowego życia – już niebawem powita ją [ShowLocationName('paris')].\n\nGdy przyszła na świat, wszystkie gwiazdy zdawały się układać pomyślnie. Miała wszak odziedziczyć wszystko, co należało do jej rodziców. Miał ją poślubić [GetCountry('ARA').GetGovernment.GetRuler.GetName], lecz małżeństwo zostało odwołane, a [target_character.GetNameWithNoTooltip] stała się jedynie przeszkodą, jaką miała przezwyciężyć jej młodsza siostra, [target_sister.GetShortName].\n\nTeraz miejsce znajdzie dla niej [ShowLocationNameWithNoTooltip('paris')] i tamtejsi [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l], u boku których [target_character.GetNameWithNoTooltip] będzie sławić imię Pana.\n\nJednak niektórzy wciąż się zastanawiają, czy mogłaby jeszcze się przysłużyć królestwu i odegrać rolę w dyplomatycznych negocjacjach."
 flavor_nav.21.a: "Zostanie zakonnicą."
 flavor_nav.21.b: "Może się jeszcze przydać."
 flavor_nav.21.historical_info: "Despite the fact that Jeanne was betrothed to Peter IV of Aragon, the marriage never happened. Historians propose that she may have suffered a condition or illness that made her unappealing as a spouse. Maria, her younger sister, took her place and married Peter instead.\n\nBecause this marriage happened, Jeanne was forced to renounce her succession rights, and entered the Franciscan Abbey of Longchamp near Paris as a member of the Poor Clares."
 flavor_nav.30.title: "Projekt irygacji w Tudeli"
 flavor_nav.30.entry: "$flavor_nav.30.title$"
 flavor_nav.30.desc: "Nawet jeśli [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] spędza sporo czasu na swych włościach w regionie [ShowRegionName('france_region')], zawsze znajduje czas na pracę nad rozwojem [ROOT.GetCountry.Custom('C_LOC')].\n\nPołudniowe tereny, którymi szczyci się [ROOT.GetCountry.GetFlavorRank], jak choćby [ShowLocationName('tudela')], słyną z żyznych, lecz suchych ziem. Przekop kanałów poprawiłby irygację pól i pozwolił zbierać bardziej obfite plony."
 flavor_nav.30.a: "Ziemia będzie dzięki temu bardziej urodzajna."
 flavor_nav.30.b: "Nie możemy sobie pozwolić na taki wydatek."
 flavor_nav.30.historical_info: "Zarówno Joanna II, jak i Filip III podejmowali w czasie panowania wiele inwestycji rozwojowych w całym Królestwie Nawarry. Jedną z ich była rozbudowa systemu irygacji wokół Tudeli – najistotniejszego miasta na południu królestwa."
 flavor_nav.40.title: "Egzemplarz Nawarskich fueros"
 flavor_nav.40.entry: "$flavor_nav.40.title$"
 flavor_nav.40.desc: "Ponieważ [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] coraz częściej angażuje się w codzienne sprawy królestwa, niezbędne jest sporządzenie dla [Select_CString(CHARACTER.IsFemale,'niej','niego')] egzemplarza #italic Nawarskich fueros#! – kodeksu lokalnych praw.\n\nEgzemplarz będzie bogato zdobiony, oprawiony w najwyższej jakości skórę i spisany przez najwprawniejszych kopistów królestwa. Zgodnie z tradycją, tekst będzie spisany w języku #L [spanish_language.GetName|l]m#!, z dodanymi tu i ówdzie interesującymi #L [basque_language.GetName|l]mi#! adnotacjami.\n\nNiestety, [ROOT.GetCountry.GetGovernment.GetRulerTitle] posługuje się wyłącznie #L [french_language.GetName|l]m#! i nie zna nawarskiej mowy."
 flavor_nav.40.a: "Dołączymy [french_language.GetName|l] przekład."
 flavor_nav.40.a.entry: "Dołączymy #L [french_language.GetName|l]#! przekład."
 flavor_nav.40.b: "Najwyższa pora, by nasi władcy poznali język poddanych."
 flavor_nav.40.c: "Baskijski powinien być państwowym językiem, skoro jest najbardziej powszechny."
 flavor_nav.40.historical_info: "Chociaż ojczystym językiem większości populacji Królestwa Nawarry prawdopodobnie był baskijski (#italic Lingua Navarrorum#!), oficjalne dokumenty królestwa spisywano głównie w nawarsko-aragońskim (#italic Ydiomate Navarre Terrae#!, #italic Ydiomate Navarre#! czy też #italic Lengoage de Navra#!), wypierającym oksytański.\n\nOdkąd do królestwa wkroczyły francuskie dynastie – począwszy od szampańskiej w 1234 roku – powszechne stawały się też odmiany języka francuskiego."
 flavor_nav.50.title: "Oblężenie Algeciras"
 flavor_nav.50.entry: "$flavor_nav.50.title$"
 flavor_nav.50.desc: "Do królestwa dotarła wieść o wojnie na #L [target_country.GetAdjective]kiej#! granicy. Państwo [GetCountry('CAS').GetName] wznowiło krucjatę przeciw nacji [target_country.GetNameWithNoTooltip]. [target_character.GetName] pospiesznie [Select_CString(CHARACTER.IsFemale,'wróciła','wrócił')] do kraju [ROOT.GetCountry.GetName], by wziąć udział w walce.\n\nChociaż pozornie [ROOT.GetCountry.GetFlavorRank] nie uzyska z tego żadnych korzyści, od zawsze żywimy przekonanie, że pomoc sąsiadom w wyplenieniu #L [ShowReligionGroupAdjective('muslim')]kich#! ludów z regionu [ShowRegionName('iberia_region')] jest naszym obowiązkiem."
 flavor_nav.50.a: "[target_character.GetShortNameWithNoTooltip] pokieruje naszymi siłami."
 flavor_nav.50.a.entry: "Postać pokieruje naszymi siłami."
 flavor_nav.50.b: "Należy wysłać naszych ludzi z krucjatą – ale nie [Select_CString(CHARACTER.IsFemale,'powinna','powinien')] się wśród nich znaleźć [target_character.GetShortNameWithNoTooltip]."
 flavor_nav.50.b.entry: "Musimy wysłać ludzi na krucjatę, ale nie jego."
 flavor_nav.50.c: "To nie [Select_CString(CHARACTER.IsFemale,'jej','jego')] sprawa."
 flavor_nav.50.c.entry: "To nie nasza sprawa."
 flavor_nav.50.historical_info: "W 1343 roku król Filip z Nawarry zdecydował się wyruszyć na krucjatę – był bowiem przekonany, że to jego obowiązek jako władcy iberyjskiego królestwa. Jego obecność podczas walk o Albeciras oraz wsparcie z Zatoki Biskajskiej okazały się kluczowe, mimo niewielkiej militarnej siły. Niestety, monarcha zachorował i we wrześniu 1343 roku zmarł. Jego ciało zostało odtransportowane i pochowane w Pampelunie, zaś serce spoczęło w Paryżu. Wdowa po królu, Joanna, otrzymała kondolencje z rąk papieża Klemensa VI. Algeciras ostatecznie padło, zaś Joanna zasiadała na tronie aż do śmierci w 1349 roku. Następnie korona trafiła w ręce ich syna, Karola II."
 flavor_nav.60.title: "Testament królowej"
 flavor_nav.60.entry: "$flavor_nav.60.title$"
 flavor_nav.60.desc: "[target_character.GetName] nie żyje, a jej testament został odczytany. Prosi w nim następcę o dobudowę kaplicy przy kościele Santa Maria la Real w [ShowLocationName('olite')].\n\nWśród dworzan pojawiają się głosy, że kapliczka powinna zostać ofiarowana Poczęciu Najświętszej Maryi Panny. Najwyższa władza – [ROOT.GetCountry.GetGovernment.GetRuler.GetName] – entuzjastycznie zapatruje się na ten pomysł, mając świadomość, jak pobożna była [target_character.GetShortNameWithNoTooltip]."
 flavor_nav.60.a: "Wolę matki należy wypełnić."
 flavor_nav.60.b: "Możemy lepiej spożytkować te pieniądze."
 flavor_nav.60.historical_info: "Kiedy w 1349 roku królowa Joanna II zmarła w epidemii czarnej śmierci, doszło do odczytu jej testamentu, w którym prosiła syna, Karola II, między innymi o sfinansowanie budowy kaplicy przy gotyckim kościele Santa Maria La Real w Olite.\n\nKościół ten służył dynastii Evreux w obrzędach religijnych. Stylem nawiązywał do paryskiej katedry Notre-Dame."
 flavor_nav.70.title: "Cámara de Comptos"
 flavor_nav.70.entry: "$flavor_nav.70.title$"
 flavor_nav.70.desc: "Finanse królestwa to poważna sprawa, a [ROOT.GetCountry.GetGovernment.GetRuler.GetName] jest zdania, że [ROOT.GetCountry.GetLongName] znacznie skorzysta na uformowaniu odpowiadającego za nie stałego organu.\n\nZaczerpnięcie inspiracji z podobnych instytucji działających w kraju [GetCountry('FRA').GetLongName] pozwali nam ustabilizować gospodarkę kraju i przygotować się na ewentualne finansowe trudności, w jakie może nas zepchnąć nasze skomplikowane położenie."
 flavor_nav.70.a: "Utworzymy stały organ tego rodzaju."
 flavor_nav.70.historical_info: "Początków Cámara de Comptos można szukać w osobach #italic oidores#! (od czasownika #italic oir#!, czyli „słyszeć”) – urzędników nadzorujących finanse królestwa od co najmniej 1258 roku, z którego pochodzi pierwsza księga Comptos. Instytucja ta, wyraźnie czerpiąca inspirację z francuskich odpowiedników (jak #italic Chambre des Comptes#! w Paryżu) została formalnie umocowana przez Karola II. Zajmowała się kontrolowaniem finansów królestwa i doradzaniem władcom w sprawach gospodarczych.\n\nUchodzi ona za najstarszą izbę obrachunkową w Hiszpanii i funkcjonuje po dziś dzień, służąc przy parlamencie wspólnoty autonomicznej Nawarry."
 #Decisions
 navarre_charles_ii_claim_to_france.title: "Prawowite roszczenie do [GetCountry('FRA').GetNameWithNoTooltip]"
 navarre_charles_ii_claim_to_france.desc: "Although [GetCharacter('nav_jeanne_ii_capet').GetName] abandoned [GetCharacter('nav_jeanne_ii_capet').GetHerHis] claim to [GetCountry('FRA').GetNameWithNoTooltip], [GetCharacter('nav_charles_ii_evreux').GetName] still maintains a direct blood lineage to the old [GetCharacter('fra_louis_x_capet').GetName]. Even should the [ShowHeirSelectionName('salic_law')] wrongly decree [GetCharacter('nav_charles_ii_evreux').GetNameWithNoTooltip] ineligible, [GetCharacter('nav_charles_ii_evreux').GetName]'s claim is still stronger than that of the current rulers of [GetCountry('FRA').GetNameWithNoTooltip]!"
 navarre_charles_ii_claim_to_france.a: "Nadszedł czas, by dochodzić naszego prawowitego roszczenia do [GetCountry('FRA').GetNameWithNoTooltip]!"
 navarre_charles_ii_claim_to_france.b: "The time has come to launch a civil war to claim the throne!"
 navarre_charles_ii_claim_to_france.c: "No, now is not the time to act."
 nav_appanage_willingness_to_join_tt: "Reaching #G +190#! relations with other Appanage subjects of [GetCountry('FRA').GetNameWithNoTooltip] will make them incline to support us in a war against [GetCountry('FRA').GetNameWithNoTooltip] to seize the throne"
 nav_coercing_of_normandy.title: "Przymuszenie [GetCountry('NRM').GetNameWithNoTooltip]"
 nav_coercing_of_normandy.desc: "Znajdując się na czele [ShowSituationNameWithNoTooltip('hundred_years_war')], wielu panów [GetCountry('NRM').GetName] zaczęło odczuwać niezadowolenie wobec obecnego władcy [GetCountry('FRA').GetName]. Dzięki dziedziczeniu ziem [GetCharacter('nav_philip_iii_evreux').GetName], [GetCharacter('nav_charles_ii_evreux').GetName] utrzymuje bliskie stosunki z ludźmi w [GetCountry('NRM').GetFlavorRank], z których część może być skłonna uznać [GetCharacter('nav_philip_iii_evreux').GetShortNameWithNoTooltip] za swojego nowego zwierzchnika."
 nav_coercing_of_normandy.a: "Przejmij kontrolę nad [GetCountry('NRM').GetNameWithNoTooltip]!"
 nav_end_the_blood_feuds.title: "Zakończenie krwawych waśni"
 nav_end_the_blood_feuds.desc: "Od zakończenia [ShowDisasterName('castilian_civil_war')] znaczna część [GetCountry('NAV').GetName] stała się areną długotrwałych krwawych waśni między rodami, które ośmieliły się wobec osłabionych wpływów regionalnych [GetCountry('CAS').GetAdjectiveWithNoTooltip]. Teraz, gdy wpływy [GetCountry('NAV').GetAdjectiveWithNoTooltip] uległy wzmocnieniu, możemy to wykorzystać i raz na zawsze zakończyć te waśnie."
 nav_end_the_blood_feuds.a: "Przywrócono władzę!"
 nav_sow_division_in_the_borderlands.title: "Sianie niezgody na pograniczu"
 nav_sow_division_in_the_borderlands.desc: "Skoro wpływy [GetCountry('CAS').GetAdjective] w [ShowScriptedGeographyName('nav_contested_basque_borderlands')] stanowią jedynie ułamek dawnej potęgi, trwające waśnie między rodami wiernymi [GetCountry('NAV').GetName] a resztą regionu mogą okazać się przydatne, jeśli zdecydujemy się poprzeć ich otwartą wojnę przeciwko rodom wciąż wiernym [GetCountry('CAS').GetNameWithNoTooltip]. Choć może to okazać się kosztowne przedsięwzięcie, [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')] może ponownie połączyć się z [GetCountry('NAV').GetNameWithNoTooltip]."
 nav_sow_division_in_the_borderlands.a: "Udziel zgody na spustoszenie posiadłości rywalizujących rodów."
 nav_sow_division_in_the_borderlands.b: "Spal obrzeża pogranicza."
 nav_sow_division_in_the_borderlands.c: "Siej niezgodę na ziemiach należących do [GetCountry('CAS').GetAdjectiveWithNoTooltip]."
 nav_sow_division_in_the_borderlands_a_tt: "Każda [location|e] [owned|e] przez [GetCountry('CAS').GetName] w [ShowScriptedGeographyName('nav_contested_basque_borderlands')] zyska [ShowModifier('nav_feud_crossfire')] na 3 lata i straci znaczny [prosperity|e] oraz [pop_satisfaction|e]"
 nav_sow_division_in_the_borderlands_b_tt: "Każda [location|e] [owned|e] przez [GetCountry('CAS').GetName] w [ShowScriptedGeographyName('nav_contested_basque_borderlands')] zyska [ShowModifier('nav_destructive_feuds')] na 3 lata i straci nieznacznie [prosperity|e], [pop_satisfaction|e] oraz [development|e]"
 nav_sow_division_in_the_borderlands_c_tt: "Każda [location|e] [owned|e] przez [GetCountry('CAS').GetName] w [ShowScriptedGeographyName('nav_contested_basque_borderlands')] zyska [ShowModifier('nav_widespread_distrust_caused_by_feuds')] na 3 lata i straci nieznacznie [prosperity|e], [pop_satisfaction|e] oraz [control|e]"
 nav_appanage_ally_join_war_tt: "[ROOT.GetCountry.GetName] przyłączy się do wojny [target_character.GetName] o kontrolę nad [ShowRegionName('france_region')]"
 navarre_charles_ii_claim_to_france_appanage_route.a: "Nadszedł czas, by wywołać wojnę domową i zdobyć tron!"
 navarre_charles_ii_claim_to_france_appanage_route.desc: "$navarre_charles_ii_claim_to_france.desc$"
 navarre_charles_ii_claim_to_france_appanage_route.title: "$navarre_charles_ii_claim_to_france.title$"
