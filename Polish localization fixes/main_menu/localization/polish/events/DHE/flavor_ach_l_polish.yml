l_polish:
 flavor_ach.1.title: "Ucieczka #L [target_country.GetAdjectiveWithNoTooltip|l]kiej#! władzy"
 flavor_ach.1.entry: "Ucieczka epirskiego dziedzica"
 flavor_ach.1.desc: "Po #L [target_country2.GetAdjective|l]kiej#! inwazji na państwo [target_country.GetName] [target_character.GetShortName], [Select_CString(target_character.IsFemale,'prawowita następczyni','prawowity następca')] poprzedniego władcy, znanego jako [target_character.GetFather.GetName], traci tron. [GetCharacter('byz_andronikos_iii_palaiologos').GetName] mianował na to miejsce obecnego #L [target_country2.GetAdjectiveWithNoTooltip|l]kiego#! zarządcę, zwanego [GetCharacter('epi_theodoros_synadenos').GetName]. Na szczęście [target_character.GetShortNameWithNoTooltip] [Select_CString(target_character.IsFemale,'zdołała','zdołał')] uciec z kraju dzięki pomocy przeciwników #L [target_country2.GetAdjectiveWithNoTooltip|l]kiego#! rządu i [target_character2.GetName] może przyjąć [Select_CString(target_character.IsFemale,'ją','go')] na swoim dworze."
 flavor_ach.1.a: "[target_character.GetNameWithNoTooltip] ma prawo rządzić #L [target_country.GetAdjectiveWithNoTooltip]kimi#! ziemiami!"
 flavor_ach.1.a.entry: "Ta domena należy do niego!"
 flavor_ach.1.b: "[target_country.GetNameWithNoTooltip] to przegrana sprawa."
 flavor_ach.1.b.entry: "To przegrana sprawa."
 flavor_ach.2.title: "Wsparcie #L [target_country.GetAdjectiveWithNoTooltip|l]kiego#! pretendenta"
 flavor_ach.2.desc: "Ostatnia łacińska najwyższa władza [target_country.Custom('C_DOP')], [Select_CString(target_character.IsFemale,'młoda','młody')] [target_character.GetName], ucieka z kraju do [target_country3.Custom('C_DOP')], którego [target_country3.GetGovernment.GetRulerTitle|l] stoi po stronie obalonego rządu. Państwo [target_country3.GetLongName] bez wątpienia spróbuje odzyskać tron [Select_CString(target_character.IsFemale,'usuniętej następczyni','usuniętego następcy')].\n\nMusimy przygotować się na inwazję, [target_character2.GetName] może nas zaatakować w chwili naszej słabości."
 flavor_ach.2.a: "Niech no spróbują!"
 flavor_ach.3.title: "Słabnące wpływy łacińskie"
 flavor_ach.3.desc: "Choć nominalnie kraj ten znajduje się pod panowaniem łacińskiej dynastii [target_character.GetDynasty.GetName], wpływ tego rodu od wielu lat nieustannie słabnie. #L [ROOT.GetCountry.GetCulture.Custom('Culture_adj')|l]cy#! [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] często ignorują problemy i są głusi na trudną sytuację #L [ShowCultureName('greek_culture')|l]kich#! poddanych. Zwykli ludzie ze wszystkich warstw społecznych zwrócili się zatem ku innym rządom – [target_character2.GetName] o helleńskim pochodzeniu może wyzwolić państwo [ROOT.GetCountry.GetName] spod jarzma Franków."
 flavor_ach.3.a: "Precz z rodem [target_character.GetDynasty.GetNameWithNoTooltip]!"
 flavor_ach.3.a.entry: "Przecz z dynastią!"
 flavor_ach.3.b: "Zlikwidować ten ruch!"
 flavor_ach.4.title: "Wpływy cesarzowej łacińskiej w Grecji"
 flavor_ach.4.entry: "$flavor_ach.4.title$"
 flavor_ach.4.desc: "Choć państwo znane jako [ShowFormableCountryName('LAT_f')] upadło w 1261 roku, jego dziedzictwo przetrwało dzięki nieprzerwanej linii cesarzy tytularnych, aż po obecną cesarzową, którą jest [target_character.GetName]. Choć jest to tytuł jedynie honorowy, dynastia [target_character.GetDynasty.GetName] nadal cieszy się wielkim szacunkiem wśród państw łacińskich i nadal rządzi państwem [ROOT.GetCountry.GetLongName] – jednym z najpotężniejszych fragmentów dawnego Cesarstwa."
 flavor_ach.4.a: "Państwo [ShowFormableCountryNameWithNoTooltip('LAT_f')] powróci!"
 flavor_ach.5.title: "Tytułowe [GetCountry('LAT').GetFlavorRank|l]"
 flavor_ach.5.entry: "Tytułowe cesarstwo"
 flavor_ach.5.desc: "Zachowując tytuł [GetCountry('LAT').GetAdjectiveWithNoTooltip|l]kiego władcy kraju [GetCountry('LAT').GetLongName], choćby tylko nominalnie, [scope_ruler.GetName] wciąż posiada znaczne wpływy wśród pozostałej elity [GetCountry('LAT').GetAdjectiveWithNoTooltip|l]kiej w regionie znanym jako [ShowScriptedGeographyName('greece_geography')] i wciąż ma swoje kontakty [naples_country.Custom('C_LOC')]. Chociaż intrygi, które snuje [scope_philip_latin_emperor.GetName] miały zebrać siły zdolne do odzyskania Cesarstwa, plany te zostały porzucone po jego śmierci.\n\n [scope_alb_king.GetName] i rząd zawarli umowę dotyczącą prawa do regionu [albania_country.GetName]. Teraz ma je [scope_alb_king.GetShortNameWithNoTooltip], a ziemiami [ROOT.GetCountry.Custom('C_DOP')] włada [ach_heir.GetName], choć [scope_ruler.GetNameWithNoTooltip] nadal oficjalnie kontroluje tę krainę.\n\nW związku z obecnością Kompanii #L [ShowCultureName('catalan')]kiej#! w Atenach oraz plotkami o niestabilności w [byz_country.GetName], doradcy bliscy władzy wskazali, że wkrótce może pojawić się okazja do odrodzenia kraju [GetCountry('LAT').GetLongNameWithNoTooltip], zgodnie z wizją, jaką snuł [scope_philip_latin_emperor.GetShortNameWithNoTooltip]."
 flavor_ach.5.a: "Skupmy się na pozyskaniu lokalnej elity."
 flavor_ach.5.b: "Pozyskajmy wsparcie dyplomatyczne w Grecji."
 flavor_ach.5.c: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] rozpocznie przygotowania do odrodzenia."
 flavor_ach.5.c.entry: "Dwór powinien rozpocząć przygotowania do odrodzenia."
 flavor_ach.6.title: "Więzy z dworem [naples_country.Custom('C_DOP')]"
 flavor_ach.6.entry: "Więzy z dworem neapolitańskim"
 flavor_ach.6.desc: "Chociaż [scope_ruler.GetName] przejmuje obowiązki związane z zarządzaniem krajem [ROOT.GetCountry.GetName], wciąż posiada znaczne wpływy na dworze [naples_country.Custom('C_LOC')], a tamtejsza najwyższa władza – [nap_ruler.GetName] – utrzymuje bliskie relacje. Dążąc do dalszego wzmocnienia rządów dynastii [scope_ruler.GetDynasty.GetName] w Grecji, niektórzy doradcy zasugerowali, aby wykorzystać wspomniane wpływy, by zyskać poparcie wśród zamożnej elity [naples_country.GetAdjectiveWithNoTooltip|l]kiej."
 flavor_ach.6.a: "Niech [scope_ruler.GetShortNameWithNoTooltip] zabiega o przychylność [naples_country.GetAdjectiveWithNoTooltip|l]kiego dworu."
 flavor_ach.6.a.entry: "Niech władza zabiega o przychylność neapolitańskiego dworu."
 flavor_ach.6.b: "Wykorzystajmy wpływy, jakie ma [scope_ruler.GetShortNameWithNoTooltip] do pozyskania wsparcia finansowego."
 flavor_ach.6.b.entry: "Wykorzystajmy jego wpływy, by pozyskać wsparcie finansowe."
 flavor_ach.6.c: "Reputacja, którą szczyci się [scope_ruler.GetShortNameWithNoTooltip], wzmocniłaby lepiej [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ki [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]."
 flavor_ach.6.c.entry: "Jego reputacja przyda się bardziej do wsparcia naszego dworu."
 flavor_ach.7.title: "[nikephoros_ii_orsini.GetNameWithNoTooltip] i [epirus_country.GetLongNameWithNoTooltip]"
 flavor_ach.7.entry: "Secesja w Epirze"
 flavor_ach.7.desc: "Zaszczyczając swą obecnością od czasu wygnania [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] [ROOT.GetCountry.Custom('C_DOP')], [nikephoros_ii_orsini.GetName] okazał się cennym atutem politycznym w walce, jaką toczy [scope_ruler.GetName] z #L [byz_country.GetAdjective|l]ką#! elitą. Jednak na dwór dotarły wieści, że być może nadszedł moment, w którym [nikephoros_ii_orsini.GetLastNameWithNoTooltip] odzyska władzę, ponieważ niektórzy #L [epirus_country.GetAdjective|l]cy#! [epirus_country.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] zgromadzili wystarczające poparcie, by wzniecić powstanie przeciwko [byz_country.GetAdjectiveWithNoTooltip|l]kiemu namiestnikowi.\n\nPostrzegając to jako okazję do zasiania dalszych podziałów w [byz_country.GetNameWithNoTooltip], wielu członków dworu namawia władzę do skorzystania z tej okazji i zezwolenie na to, by [nikephoros_ii_orsini.GetLastNameWithNoTooltip] wrócił do kraju [epirus_country.GetNameWithNoTooltip]."
 flavor_ach.7.a: "[nikephoros_ii_orsini.GetLastNameWithNoTooltip] może wrócić do kraju [epirus_country.GetNameWithNoTooltip] dzięki naszemu wsparciu."
 flavor_ach.7.a.entry: "$Orsini$ może wrócić do kraju $EPI$ dzięki naszemu wsparciu."
 flavor_ach.7.b: "Zamiast tego zaproponujmy, by [nikephoros_ii_orsini.GetShortNameWithNoTooltip] ubiegał się o władzę [epirus_country.Custom('C_LOC')]."
 flavor_ach.7.b.entry: "Zamiast tego zaproponujmy, by $name_nikephoros.greek_language$ ubiegał się o władzę w kraju $EPI$."
 flavor_ach.7.c: "Na razie to zbyt ryzykowne."
 variable_orsini_in_achaea_tt: "Nicefor Orsini bierze na cel Epir"
 nikephoros_ii_orsini_revolt: "Bunt Orsiniego"
 flavor_ach.8.title: "[nikephoros_ii_orsini.GetNameWithNoTooltip] odzyskuje [epirus_country.GetNameWithNoTooltip]!"
 flavor_ach.8.entry: "$name_nikephoros.greek_language$ $Orsini$ odzyskuje $EPI$!"
 flavor_ach.8.desc: "Na #L [ROOT.GetCountry.GetAdjective|l]ki#! [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] dotarła wiadomość, że [nikephoros_ii_orsini.GetLastNameWithNoTooltip] i jego zwolennicy odzyskali [epirus_country.GetName] i skorzystali z okazji, by odłączyć kraj od swego zwierzchnika, którym jest [byz_country.GetName]! Chociaż [scope_ruler.GetName] odnosi wielkie zwycięstwo, osłabiając #L [byz_country.GetAdjectiveWithNoTooltip|l]ki#! rząd, niektórzy dworzanie namawiają najwyższą władzę, by przejęła [epirus_country.GetNameWithNoTooltip], zanim [nikephoros_ii_orsini.GetShortNameWithNoTooltip] zdoła umocnić swoją pozycję."
 flavor_ach.8.a: "Lepiej uczynić [epirus_country.GetNameWithNoTooltip] sojusznikiem."
 flavor_ach.8.a.entry: "Lepiej uczynić $EPI$ sojusznikiem."
 flavor_ach.8.b: "Zadbamy jedynie o to, by [nikephoros_ii_orsini.GetLastNameWithNoTooltip] miał z nami dobre stosunki."
 flavor_ach.8.b.entry: "Zadbamy jedynie o to, by $Orsini$ miał z nami dobre stosunki."
 flavor_ach.8.c: "To dobry moment do ataku!"
 variable_supported_orsini_revolt_tt: "Poparliśmy bunt Orsinich"
 flavor_ach.9.title: "[epirus_country.GetNameWithNoTooltip] – bunt"
 flavor_ach.9.desc: "Straszne wieści! #L [epirus_country.GetAdjective]cy#! [epirus_country.GetGovernment.GetEstateName('nobles_estate')|l], których wspiera [ach_scope_ruler.GetName], rozpoczęli bunt, by [nikephoros_ii_orsini.GetName] mógł przejąć [epirus_country.GetName]. [epi_scope_ruler.GetName] prosi [ROOT.GetCountry.GetName] o natychmiastową interwencję, by powstrzymać powstanie."
 flavor_ach.9.a: "Pomóżmy [epirus_country.GetAdjectiveWithNoTooltip|l]kiemu zarządcy!"
 flavor_ach.9.a.entry: "Pomóżmy epirskiemu zarządcy!"
 flavor_ach.9.b: "To nie nasz problem."
 flavor_ach_9_tt: "Jeśli [nikephoros_ii_orsini.GetName] zwycięży, [epirus_country.GetName] stanie się niepodległym krajem"
 flavor_ach.10.title: "Odzyskanie Peloponezu"
 flavor_ach.10.entry: "$flavor_ach.10.title$"
 flavor_ach.10.desc: "Po sukcesie czwartej krucjaty w 1204 roku [ShowAreaName('morea_area')] stała się jednym z wielu regionów podbitych przez krzyżowców po upadku potęgi znanej jako [byz_country.GetName]. Jednak w ostatnich dziesięcioleciach elita [byz_country.GetAdjectiveWithNoTooltip|l]ka odzyskała część terytorium, choć większość nadal pozostaje pod kontrolą #L [ROOT.GetCountry.GetAdjective|l]ką#!.\n\nW obliczu plotek o niestabilności ogarniającej [byz_country.GetAdjectiveWithNoTooltip|l]ki [ROOT.GetCountry.GetGovernment.GetCourtTitle|l], kilku doradców uważa, że teraz jest odpowiedni moment, aby rozpocząć kampanię mającą na celu odzyskanie utraconych terytoriów i wyparcie wpływów [byz_country.GetAdjectiveWithNoTooltip|l]kich z regionu [ShowAreaNameWithNoTooltip('morea_area')] na dobre."
 flavor_ach.10.a: "Czas wyprzeć [byz_country.GetLongNameWithNoTooltip]!"
 flavor_ach.10.a.entry: "Czas wyprzeć $BYZ$!"
 flavor_ach.10.b: "Zaczekamy i sprawdzimy, czy plotki o [byz_country.GetAdjectiveWithNoTooltip|l]kiej niestabilności dadzą owoce."
 flavor_ach.10.b.entry: "Zaczekamy i sprawdzimy, czy plotki o bizantyjskiej niestabilności dadzą owoce."
 flavor_ach.11.title: "[Country.GetNameWithNoTooltip] – powszechna niestabilność"
 flavor_ach.11.entry: "Wykorzystanie bizantyjskiej wojny domowej"
 flavor_ach.11.desc: "Choć #L [ROOT.GetCountry.GetAdjective|l]cy#! szpiedzy infiltrujący [byz_country.GetAdjectiveWithNoTooltip|l]ki [byz_country.GetGovernment.GetCourtTitle|l] od jakiegoś czasu słyszą pogłoski o politycznej destabilizacji, ostatnie doniesienia sugerują, że [byz_country.GetAdjectiveWithNoTooltip|l]cy [byz_country.GetGovernment.GetEstateName('nobles_estate')|l] są wściekli na panującą dynastę [byz_ruler.GetDynasty.GetName] i planują przewrót.\n\nMoże być to preludium do wojny domowej, więc niektórzy doradcy sugerują, że [scope_ruler.GetName] musi się przygotować i wykorzystać tę sytuację."
 flavor_ach.11.a: "Czas zmiażdżyć feniksa!"
 flavor_ach.11.b: "Nie mieszajmy się w [byz_country.GetAdjectiveWithNoTooltip|l]kie sprawy wewnętrzne."
 flavor_ach.11.b.entry: "Nie mieszajmy się w bizantyjskie sprawy wewnętrzne."
 flavor_ach.12.title: "Obłaskawienie [ShowCultureNameWithNoTooltip('greek_culture')|l]kiej elity"
 flavor_ach.12.entry: "Ludność grecka w Achai"
 flavor_ach.12.desc: "Chociaż panowanie #L [GetCountry('LAT').GetAdjective|l]kie#! nad regionem [ShowScriptedGeographyName('greece_geography')] przyniosło upadek dawnej elity #L [ShowCultureName('greek_culture')|l]kiej#!, na niektórych obszarach [ROOT.GetCountry.Custom('C_DOP')] członkowie starszych rodzin [ShowCultureNameWithNoTooltip('greek_culture')|l]kich utrzymali władzę dzięki temu, że #L [ROOT.GetCountry.GetCulture.Custom('Culture_adj')|l]cy#! [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] poszli na kompromis. Jednak od upadku kraju [GetCountry('LAT').GetLongNameWithNoTooltip] lud [ShowCultureNameWithNoTooltip('greek_culture')|l]ki coraz bardziej opiera się rządom [ROOT.GetCountry.GetCulture.Custom('Culture_adj')|l]kim.\n\nDążąc do większej stabilności, [scope_ruler.GetNameWithNoTooltip] zaprasza członków pozostałych rodzin [ShowCultureNameWithNoTooltip('greek_culture')|l]kich [ROOT.GetCountry.Custom('C_LOC')] na [ROOT.GetCountry.GetGovernment.GetCourtTitle|l], aby wypracować porozumienie. Jednak niektórzy [ROOT.GetCountry.GetCulture.Custom('Culture_adj')|l]cy [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] naciskają na dalsze rozszerzenie swoich praw wobec ludności [ShowCultureNameWithNoTooltip('greek_culture').Custom('Culture_adj')|l]kiej, argumentując, że silniejsza elita [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l] stłumiłaby niepokoje wśród miejscowej ludności."
 flavor_ach.12.a: "Zachowajmy obecny status quo."
 flavor_ach.12.b: "[ROOT.GetCountry.GetCulture.Custom('Culture_adj')]cy [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] mają nasze poparcie."
 flavor_ach.12.b.entry: "Nasi $nobles_estate$ mogą liczyć, że staniemy po ich stronie."
 flavor_ach.12.c: "Pójdźmy na kompromis z rodami [ShowCultureNameWithNoTooltip('greek_culture')|l]kimi."
 flavor_ach.13.title: "[athens_country.GetNameWithNoTooltip] to zagrożenie"
 flavor_ach.13.entry: "Katalońska władza w Atenach"
 flavor_ach.13.desc: "Chociaż wielu #L [GetCountry('LAT').GetAdjective|l]kich#! władców, jakich zrodziła [ShowScriptedGeographyName('greece_geography')], zaoferowało wsparcie dla roszczeń, jakie wysuwa [scope_ruler.GetName] wobec kraju [GetCountry('LAT').GetLongNameWithNoTooltip], państwo zwane [athens_country.GetLongName] w ostatnich latach jest coraz bardziej wrogo nastawione, wzmocnione poparciem Kompanii #L [ShowCultureName('catalan')]kiej#!. Jednak pewni niezadowoleni [athens_country.GetAdjectiveWithNoTooltip|l]cy [athens_country.GetGovernment.GetEstateName('nobles_estate')|l] zwrócili się do #L [ROOT.GetCountry.GetAdjective|l]kiego#! dworu z nadzieją, że [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] udzieli im wsparcia w pozbyciu się Kompanii [ShowCultureNameWithNoTooltip('catalan')]kiej z terytoriów posiadanych przez [athens_country.GetNameWithNoTooltip], a w zamian zaoferowali wierność krajowi [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_ach.13.a: "Zamiast tego [ShowCultureNameWithNoTooltip('catalan')|l]cy [athens_country.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] w Atenach otrzymają nasze poparcie."
 flavor_ach.13.a.entry: "Zamiast tego [ShowCultureNameWithNoTooltip('catalan')|l]cy $nobles_estate$ w Atenach otrzymają nasze poparcie."
 flavor_ach.13.b: "Wysłuchajmy prośby i wypędźmy Kompanię [ShowCultureNameWithNoTooltip('catalan')]ką z miasta [athens_country.GetNameWithNoTooltip]."
 flavor_ach.13.b.entry: "Wysłuchajmy prośby i wypędźmy Kompanię [ShowCultureNameWithNoTooltip('catalan')]ką z miasta $ATH$."
 flavor_ach.13.c: "Zamiast tego, wykorzystajmy okazję, by podbić [athens_country.GetFlavorRank]."
 flavor_ach.13.c.entry: "Zamiast tego, wykorzystajmy okazję, by podbić kraj."
 ach_vassalize_athens_for_reward: "Jeśli podporządkujemy sobie [athens_country.GetName], będziemy mogli posadzić na tronie władzę przychylną krajowi [ROOT.GetCountry.GetName]"
 flavor_ach.14.title: "Kompania [ShowCultureNameWithNoTooltip('catalan')]ka wypędzona z Aten."
 flavor_ach.14.entry: "Francuska władza w Atenach"
 flavor_ach.14.desc: "Po pokonaniu Kompanii #L [ShowCultureName('catalan')]kiej#! i wypędzeniu jej z Aten, wielu członków [athens_country.GetAdjectiveWithNoTooltip|l]kiej elity przysięga wierność nowej władzy, którą sprawuje [scope_ruler.GetName]. Poprzedni rząd Aten znalazł się na wygnaniu, więc [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] sugeruje, że warto przywrócić tron Aten [ShowCultureNameWithNoTooltip('french')|l]kim rodom. Inni sugerują jednak, że powinniśmy wykorzystać tę okazję do nawiązania stosunków z ludnością [ShowCultureNameWithNoTooltip('greek_culture')|l]ką i to miejscowi [athens_country.GetGovernment.GetEstateName('nobles_estate')|l] lepiej poradzą sobie z zarządzaniem."
 flavor_ach.14.a: "[ShowCultureNameWithNoTooltip('french')]cy [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] wyślą kogoś ze swoich struktur jako nową władzę."
 flavor_ach.14.a.entry: "[ShowCultureNameWithNoTooltip('french')]cy $nobles_estate$ wyślą kogoś ze swoich struktur jako nową władzę."
 flavor_ach.14.b: "[ShowCultureNameWithNoTooltip('french')]cy [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] obejmą rządy, ale [ShowCultureNameWithNoTooltip('greek_culture')|l]ka populacja Aten otrzyma przywileje."
 flavor_ach.14.b.entry: "[ShowCultureNameWithNoTooltip('french')]cy $nobles_estate$ obejmą rządy, ale [ShowCultureNameWithNoTooltip('greek_culture')|l]ka populacja Aten otrzyma przywileje."
 flavor_ach.14.c: "W Atenach będą panować [ShowCultureNameWithNoTooltip('greek_culture')|l]cy [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l]."
 flavor_ach.14.c.entry: "W Atenach będą panować [ShowCultureNameWithNoTooltip('greek_culture')|l]cy $nobles_estate$."
 variable_ach_vassalize_athens_for_reward_tt: "Ateny mogą być zwasalizowane w ramach nagrody"
 flavor_ach.15.title: "[scope_ruler.GetNameWithNoTooltip] dochodzi do władzy"
 flavor_ach.15.entry: "Przekazanie łacińskiej korony cesarskiej"
 flavor_ach.15.desc: "Odkąd zmarła [latin_empress_catherine_valois.GetName], to [scope_ruler.GetName] posiada prawa do sprawowania władzy w kraju [GetCountry('LAT').GetLongNameWithNoTooltip] i z tej okazji stolica – [ROOT.GetCountry.GetCapital.GetName] – organizuje uroczystości. Chociaż [latin_empress_catherine_valois.GetShortNameWithNoTooltip] i [scope_philip_latin_emperor.GetName] podjęli znaczące kroki, by wzmocnić rządy, ludność [GetCountry('LAT').GetAdjectiveWithNoTooltip|l]ka w całym regionie [ShowScriptedGeographyName('greece_geography')] odmawia uznania roszczeń rodu [scope_ruler.GetDynasty.GetName] do kraju [GetCountry('LAT').GetLongNameWithNoTooltip].\n\n[scope_ruler.GetNameWithNoTooltip] ma kontynuować dzieło rodziców, więc [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] zwrócił się z prośbą, by zorganizowana uroczystość stała się zalążkiem wysiłków na rzecz odbudowy cesarstwa."
 flavor_ach.15.a: "Koronacja pozostanie tylko ceremoniałem."
 flavor_ach.15.b: "Wykorzystajmy tę uroczystość, by wzmocnić wysiłki na rzecz odbudowy cesarstwa."
 flavor_ach.15.c: "Wykorzystajmy koronację do zdobycia poparcia wśród lojalnych lordów."
 flavor_ach.16.title: "[the_pope.GetNameWithNoTooltip] oferuje wsparcie, by odbudować [GetCountry('LAT').GetLongNameWithNoTooltip]"
 flavor_ach.16.entry: "Papież interesuje się odrodzeniem Cesarstwa Łacińskiego"
 flavor_ach.16.desc: "Po zapoznaniu się z naszymi kampaniami w regionie znanym jako [ShowScriptedGeographyName('greece_geography')], [the_pope.GetName] wysyła posła z ofertą pomocy.\n\nUznając nasze roszczenia do tytułu „[ShowGovernmentReformName('ach_heirs_of_the_latin_empire')]”, [the_pope.GetShortNameWithNoTooltip] zaoferował finansowe i polityczne wsparcie stolicy apostolskiej, jeśli zgodzimy się w zamian pomóc w naprawieniu stosunków między kościołem #L [ShowReligionAdjective('catholic')|l]kim#! i wiarą #L [ShowReligionAdjective('orthodox')|l]ą#!. \n\n[the_pope.GetNameWithNoTooltip] nalega również, aby w przypadku odzyskania miasta [constantinople_location.GetName] nie powtórzyła się tragedia, jaką czwarta krucjata sprowadziła na to [constantinople_location.GetRank.GetName|l]."
 flavor_ach.16.a: "Zgódźmy się na żądania [scope_papal_states.GetAdjectiveWithNoTooltip|l]kiego wysłannika w zamian za wsparcie."
 flavor_ach.16.a.entry: "Zgódźmy się na żądania papieskiego wysłannika w zamian za wsparcie."
 flavor_ach.16.b: "[the_pope.GetShortNameWithNoTooltip] nie jest częścią naszego planu, sami zdobędziemy [constantinople_location.GetNameWithNoTooltip]."
 flavor_ach.16.b.entry: "Nie potrzebujemy go, by odbić [ShowLocationNameWithNoTooltip('constantinople')]."
 lat_aggressive_conversion_policies_tt: "[the_pope.GetName] może zażądać od nas wprowadzenia surowych zasad nawracania, jeśli ustanowimy [GetCountry('LAT').GetLongName], w zamian za swoje poparcie."
 flavor_ach.17.title: "Odzyskano [constantinople_location.GetNameWithNoTooltip]!"
 flavor_ach.17.entry: "Odzyskano Konstantynopol!"
 flavor_ach.17.desc: "To, co niegdyś wydawało się niemożliwym zadaniem, w końcu zostało zrealizowane: [constantinople_location.GetName] został w końcu odbity! Chociaż znaczna część metropolii wciąż nie została odbudowana, [scope_ruler.GetName] wzywa żołnierzy #L [ROOT.GetCountry.GetAdjective|l]kich#! do zachowania ostrożności podczas zajmowania miasta, aby uniknąć dalszego chaosu wśród ludności.\n\nNiemal cała okolica została zabezpieczona, a pałac cesarski w Blachernae stoi opuszczony, [scope_ruler.GetNameWithNoTooltip] zwraca się więc do elity [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]kiej o szybkie proklamowanie odrodzenia kraju [GetCountry('LAT').GetLongName], chociaż ostrożni członkowie dworu naciskają, abyśmy najpierw umocnili naszą pozycję."
 flavor_ach.17.a: "Najwyższy czas, by [constantinople_location.GetNameWithNoTooltip] znów był pod naszymi rządami."
 flavor_ach.17.a.entry: "Najwyższy czas, by [ShowLocationNameWithNoTooltip('constantinople')] znów był pod naszymi rządami."
 flavor_ach.17.b: "Powinniśmy umocnić naszą pozycję, zanim oficjalnie odtworzymy cesarstwo."
 flavor_ach.17.c: "Złupmy [constantinople_location.GetNameWithNoTooltip] i zabierzmy wszystkie pozostałe bogactwa!"
 flavor_ach.17.c.entry: "Złupmy [ShowLocationNameWithNoTooltip('constantinople')] i zabierzmy wszystkie pozostałe bogactwa!"
