 #Ranks
 country_rank_effects_list_title: "[CountryRank.GetNameWithNoTooltip] ma następujące efekty:"
 rank_empire_desc: "To najwyższa [country_rank|el], którą posiadają najbardziej prestiżowe lub najpotężniejsze [Concept('countries','państwa')|e] na świecie."
 rank_kingdom_desc: "[Concept('country_rank','Ranga')|e] reprezentująca większe [countries|el] posiadające wiele [Concept('provinces','prowincji')|e] i zdolne do projekcji sporej siły."
 rank_duchy_desc: "[Concept('country_rank','Ranga')|e] reprezentująca małe i średnie [countries|el], zwykle posiadające jedną [Concept('province','prowincję')|e], ale o większym rozmiarze i populacji niż w przypadku hrabstwa."
 rank_county_desc: "[Concept('country_rank','Ranga')|e] reprezentująca najmniejsze [countries|el], zwykle obejmujące tylko jedną [Concept('location','lokację')|e] bądź będące niewielkim plemieniem."
 government_type_list_title: "[GovernmentType.GetNameWithNoTooltip] odblokowuje następujące możliwości:"
 government_type_list: "[advances|e]: #placeholder XX #!\n[laws|e]: #placeholder XX #!\n[policies|e]: #placeholder XX #!\n[heir_selections|e]: #placeholder XX #!\n[estate_privileges|e]: #placeholder XX #!"
 government_type_list_advances_row: "[advances|e]: $VAL$"
 government_type_list_heir_selection_row: "[heir_selections|e]: $VAL$"
 government_type_list_laws_row: "[laws|e]: $VAL$"
 government_type_list_policies_row: "[policies|e]: $VAL$"
 monarchy_desc: "$monarchy$ to [government_type|el] oparty na zasadzie niepodzielnego zwierzchnictwa jednostki, w którym [ruler|el] jest pierwszym wśród szlachty. [Concept('heir','Dziedzica')|e] wybiera zwykle [dynasty|el] rządząca i zwykle osoba ta sprawuje władzę do końca życia.\n\n$game_concept_monarchs$ może zawrzeć [royal_marriages|el], aby zawiązać [alliances|el], a nawet odziedziczyć obce [countries|el] poprzez [personal_unions|el]. Kwestie dotyczące porządku sukcesji są jednak często problematyczne, dlatego monarchie mogą łatwo dostawać się w ręce [Concept('regencies','regentów')|e] lub pod wpływ obcych dynastii."
 republic_desc: "$republic$ to [government_type|el], w którym [rulers|el] są wybierani na drodze [Concept('election','wyborów')|e] i przez określony czas pełnią rolę reprezentantów społeczeństwa. W zależności od obowiązującego [Concept('heir_selection','porządku sukcesji')|e] władca może należeć do któregokolwiek ze [Concept('estates','stanów')|e].\n\nSiła instytucji politycznych czyni republikę bardziej odporną na problemy z dziedziczeniem, jednakże mniej osobista natura władzy ogranicza dostępne możliwości dyplomatyczne. Z tego względu [dynasties|el] grają tu mniejszą rolę, a ponadto republiki nie odnoszą żadnych korzyści z [Concept('royal_marriages','małżeństw królewskich')|e]."
 theocracy_desc: "$theocracy$ to [government_type|el] oparty za zasadzie boskiego zwierzchnictwa, w którym [Concept('ruler','władca')|e] wywodzi się spośród sług wiary, a kwestie świeckie są podporządkowywane władzy religijnej.\n\nOsoby rządzące są zwykle wybierane na całe życie w pewnego rodzaju [Concept('election','wyborach')|e], co pozwala na mniej problematyczne przeniesienie władzy."
 steppe_horde_desc: "$steppe_horde$ to [government_type|el] oparty na potędze wojskowej jego [Concept('ruler','władcy')|e]. Jego krewni mają większą szansę na zostanie [Concept('heir','dziedzicami')|e], ale znaczenie w tej kwestii mają także starszeństwo oraz [abilities|el] osobiste.\n\nWładcy to zwykle przedstawiciele elity społeczeństwa, którzy cieszą się lojalnością swojego stanu tak długo, jak długo zdolni są do podporządkowywania sobie, najeżdżania i łupienia sąsiednich [Concept('countries','krajów')|e]. Z tego też powodu sukcesja stanowi w przypadku ordy doniosłe wydarzenie, a nawet może doprowadzić do jej upadku, jeśli nowy władca nie będzie w stanie zademonstrować odpowiedniej siły."
 tribe_desc: "$tribe$ to [government_type|el], w którym siła polityczna jest zorganizowana przede wszystkim wokół idei pokrewieństwa – czy to więzów krwi, czy domniemanego pochodzenia.\n\n[dynasties|e] oraz relacje rodzinne są więc najważniejsze, jeśli chodzi o wybór [Concept('heir','dziedzica')|e], który zawsze będzie wywodzić się spośród elitarnych członków społeczeństwa, ale często wysoce poważane są także starszeństwo, [abilities|el] osobiste oraz biegłość w walce."
 estate_privilege_description_tt: "Nie można usunąć ze względu na:\n[UIAction.GetDescription]"
