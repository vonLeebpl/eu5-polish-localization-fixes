 # UniqueContentCategory.GetName dla kategorii typu culture_group zwraca
 # goly rdzen (np. "Iberyjs") - CultureGroup nie ma metody Custom(), wiec
 # nie da sie tego naprawic bez zepsucia setek innych zdan w calym modzie,
 # ktore uzywaja tego samego rdzenia przez ShowCultureGroupName(...)|l]ka.
