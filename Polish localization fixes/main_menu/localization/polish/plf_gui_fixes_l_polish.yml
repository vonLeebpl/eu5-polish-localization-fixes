 ##
 ## Decisions - panel "Tresci gracza" (unique content categories), 1.4
 # UniqueContentCategory.GetName dla kategorii typu culture_group zwraca
 # goly rdzen (np. "Iberyjs") - CultureGroup nie ma metody Custom(), wiec
 # nie da sie tego naprawic bez zepsucia setek innych zdan w calym modzie.
 #
 # POTWIERDZONE OGRANICZENIE SILNIKA (testy w trybie debug, 2026-10-02):
 # [UniqueContentCategory.GetName] dziala poprawnie jako BEZPOSREDNIE
 # podstawienie tekstu (wyswietla "Iberyjs"), ale gdy ta sama zmienna
 # jest argumentem innej funkcji (EndsWith, EqualTo_string) - zawsze
 # zachowuje sie jak pusty/niepasujacy string, niezaleznie od skladni:
 #  - EndsWith(UniqueContentCategory.GetName,'s')          -> nie dziala
 #  - EndsWith([UniqueContentCategory.GetName],'s')         -> nie dziala
 #  - EndsWith(Localize(UniqueContentCategory.GetName),'s') -> nie dziala
 # Test kontrolny z czystym literalem EndsWith('cos','s') DZIALA (dodaje
 # "ka" wszedzie) - wiec AddTextIf/EndsWith/Select_CString same w sobie
 # sa sprawne. To zmienna petli z datamodel (GetUniqueContentCategories)
 # nie daje sie uzyc jako argument funkcji w tym wiazaniu .gui - tylko
 # do bezposredniego wyswietlenia. Temat zamkniety jako ograniczenie
 # silnika (patrz pamiec sesji "culturegroup-no-custom-method"); ponizej
 # zostawiono probe pelnej listy 194 rdzeni (nie dziala, ale jako
 # dokumentacja na wypadek, gdyby Paradox kiedys to naprawil), a aktywny
 # klucz to prosty, uczciwy passthrough.
