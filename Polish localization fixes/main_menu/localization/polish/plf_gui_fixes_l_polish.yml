 #  3) Papua: rdzen+"ska" (jedyny wyjatek od zwyklego "ka")
 #  4) domyslnie dla WSZYSTKICH pozostalych rozpoznanych rdzeni grup
 #     kulturowych (194 wpisy): dokleja "ka" - jeden AddTextIf z
 #     drzewem Or() zamiast 194 osobnych AddTextIf
 # Inne typy kategorii na tej samej liscie (kultura, religia, typ rzadu,
 # kraj osiadly...) nie pasuja do zadnego z powyzszych, wiec przechodza
 # przez punkt (1) bez zmian.
