 hint_town_rights_hint_text_1: "$game_concept_town_rights_desc$"
 # hint_town_rights_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_1! \n@arrow_bonus_tier_1! \n@arrow_bonus_tier_1! "
 hint_town_rights_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Część historycznych praw może być pozytywna, a część negatywna. Prawa można odebrać, ale pamiętaj, że odbywa się to kosztem [Concept('stability_with_icon','stabilności')|e] i poważnego rozgniewania lokalnej [Concept('pops_with_icon','społeczności')|e].\n@hint! Specjalne prawa mające [advance_icon][ShowAdvanceName('town_rights_enable')] mogą poważnie zwiększyć efektywność centrów miejskich i długoterminowo kształtować charakter gospodarki w [Concept('country','kraju')].\n@hint! Prawa produkcyjne najlepiej stosować w miejscach, w których już istnieje naturalna wysoka [production_efficiency_with_icon|el] w danym przemyśle. Przykładowo [ShowBuildingTypeName('cloth_guild')] sprawia, że [ShowGoodsName('wool')|l] jest wydajniej przetwarzana w [ShowGoodsName('cloth')|l], jeśli wełna [Concept('rgo_with_icon','wytwarzana jest')|e] w tej samej [Concept('province_with_icon','prowincji')|e]. W tym miejscu przyznane [ShowTownRightsName('royal_textile_rights')] zdają się pasować idealnie."
 hint_town_rights_diplomatic: "$hint_advisor_salute_diplomatic$"
 hint_town_rights_administrative: "$hint_advisor_salute_administrative$"
 hint_town_rights_military: "$hint_advisor_salute_military$"
 hint_societal_values: "$game_concept_societal_values$"
 hint_societal_values_hint_text: "$hint_societal_values_hint_text_1$\n\n$hint_societal_values_hint_text_2$\n\n$hint_societal_values_hint_text_3$"
 hint_societal_values_hint_text_1: "Nasze [societal_values_with_icon|el] definiują strukturę społeczną oraz polityczną [Concept('country_with_icon','kraju')|e], zwyczaje ludu oraz charakterystykę organów prawnych. Ich efekty mogą mieć ogromny wpływ na sposób rozgrywki danym państwem, głównie dlatego że odblokowują wspomniane [government_reforms_with_icon|el].\n\nKażda wartość społeczna stanowi oś o dwóch skrajnych biegunach, których maksimum wynosi 100. Pozycja kraju na takiej osi zależy głównie od jego [Concept('laws','praw')|e], [Concept('estate_privileges','przywilejów stanowych')|e] oraz [Concept('cabinet_actions','działań gabinetu')|e] i z czasem przesuwa się w stronę jednego z biegunów. Postępy te zatrzymają się jednak na wartości maksymalnej określanej przez sumę czynników, które je tam kierują. Im wyższa wartość społeczna, tym więcej czynników potrzeba, aby zwiększyć ją jeszcze bardziej."
 hint_societal_values_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Sprawdź [societal_values|l] i ich obecny trend w [Link('societal_values', '', '@government_panel! panelu rządu > zakładce wartości')]. Możesz tam sprawdzić także odblokowane przez te wartości społeczne [government_reforms|l], @leftclick! #W klikając#! na ich ikonę.\n@arrow_bonus_tier_2! Główne czynniki, które mają wpływ na [societal_values|l], to [laws_with_icon|el] i [estate_privileges_with_icon|el]. Miej na nie oko.\n@arrow_bonus_tier_1! Jeśli chcesz skupić się na określonej wartości społecznej, możesz poinstruować [cabinet_with_icon|el], by przeprowadził działanie „[ShowCabinetActionName('change_societal_values')]”."
 hint_societal_values_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Pamiętaj, że wartość społeczna może osiągnąć maksymalnie stukrotność obecnej dynamiki. Przykładowo miesięczna dynamika wynosząca #W 0,1#! oznacza, że limit wartości będzie wynosić #W 10#!.\n@hint! Wartości społeczne odgrywają także ważną rolę w [Concept('diplomacy','dyplomacji')|e], gdyż [countries|l] o zbliżonych wartościach społecznych mają skłonność do posiadania wyższych [Concept('opinion','opinii')|e] o sobie nawzajem.\n@hint! Niektóre z najbardziej niepowtarzalnych [Concept('government_reforms','reform rządowych')] w późniejszych [Concept('ages','epokach')|e] wymagają co najmniej jednej [Concept('societal_values','wartości społecznej')|e]. Przykładowo [ShowGovernmentReformName('naval_infrastructure_act')] wymaga co najmniej #W 50#! pkt. w [ShowSocietyDirectionName('naval')]."
 hint_societal_values_diplomatic: "„Przychylność naszych sąsiadów jest warta więcej niż każdy traktat. Wartości, jakie dzielimy, sprawiają, że mamy je za darmo.”"
 hint_societal_values_administrative: "„Bogaty naród jest w stanie przetrwać każdego wroga. Wartości faworyzujące handel zasługą na rozważenie w pierwszej kolejności.”"
 hint_societal_values_military: "„Nasi rywale z każdym rokiem rosną w siłę. Wartości wojskowe utrzymają ich poza naszymi granicami.”"
