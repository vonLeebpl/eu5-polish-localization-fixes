 OPEN_HINTS: "Otwórz wskazówki"
 OPEN_HINT: "Otwórz wskazówkę"
 EXPAND_HINT: "Kliknij, by rozwinąć wskazówkę"
 COLLAPSE_HINT: "Kliknij, by zwinąć wskazówkę"
 EMPTY_HINT_SCREEN_TEXT: "Nasz kraj funkcjonuje bez zarzutu i nie mamy żadnych rad do przekazania!"
 OPEN_HINT_TEXT: "Pokaż wskazówkę @hint!"
 ALERT_HINT: "Otwórz ze wskazówką"
 ALERT_ADVANCES_HINT: "Otwórz panel postępów z podpowiedzią"
 HINT_TITLE: "Wskazówka @hint!"
 RECOMMENDED_ACTIONS_TITLE: "@hint! Zalecane działania"
 SCRIPTABLE_HINT_DEFINITION_TEXT: "$MAIN_HINT$ $CONTEXT_HINT$"
 HINT_DIVIDER: "\n\n---\n\n"
 HINT_SORT_BY_PRIORITY: "Sortuj wg priorytetu"
 hint_advisor_salute_diplomatic: "\n„Witaj, Wasza Wysokość. Jestem [Player.GetGovernment.CalcBestRepresentativeForPlaystyle('diplomatic').GetName], twój doradca polityczny i najpokorniejszy sługa”."
 hint_advisor_salute_administrative: "\n„Noszę imię [Player.GetGovernment.CalcBestRepresentativeForPlaystyle('administrative').GetName], jestem wiernym doradcą Waszej Ekscelencji we wszystkich sprawach związanych z gospodarką”."
 hint_advisor_salute_military: "\n„Jestem [Player.GetGovernment.CalcBestRepresentativeForPlaystyle('military').GetName] i znam się na wojskowości. Do usług”."
 # Hints
 HINTS_AND_SUGGESTIONS: "Wskazówki i podpowiedzi"
 MANPOWER_HINT: "Mało siły żywej!"
 manpower_topbar_hint: "[Concept('manpower_with_icon','Siłę żywą')|e] zyskujemy głównie dzięki wznoszeniu pewnych typów [Concept('building_with_icon','budowli')|e]."
 MANPOWER_HINT_EXTRA: "Możemy wznieść dowolną z wymienionych budowli, aby zyskać więcej [Concept('manpower_with_icon','siły żywej')|e]:"
 MANPOWER_HINT_NONE: "Niestety, nie ma budowli, jakie moglibyśmy wznieść, aby zyskać więcej siły żywej."
 MANPOWER_HINT_BUILDING: "$BULLET_WITH_TAB$[BUILDING_TYPE.GetName]"
 SAILORS_HINT: "Mało marynarzy!"
 sailors_topbar_hint: "[Concept('sailors_with_icon','Marynarzy')|e] zyskujemy głównie dzięki wznoszeniu pewnych typów [Concept('buildings_with_icon','budowli')|e] w [Concept('locations_with_icon','lokacjach')|e] przybrzeżnych."
 SAILOR_HINT_EXTRA: "Możemy wznieść dowolną z wymienionych budowli, aby zyskać więcej marynarzy:"
 SAILOR_HINT_NONE: "Niestety, nie ma budowli, jakie moglibyśmy wznieść, aby zyskać więcej marynarzy."
 SAILOR_HINT_BUILDING: "$BULLET_WITH_TAB$[BUILDING_TYPE.GetName]"
 INVALID_MODIFIER_TYPE: "Szukanie nieprawidłowego typu modyfikatora!"
 EMPTY_RESEARCH_HINT: "Możemy wybrać badania!"
 empty_research_topbar_hint: "@trigger_no! Prowadzenie [Concept('research_with_icon','badań')|e] nie ma żadnych negatywnych skutków, a obecnie tracimy postępy, które moglibyśmy osiągnąć."
 NO_BUILDINGS_WITH_MODIFIER: "Brak"
 GOLD_HINT: "Deficyt budżetowy!"
 gold_topbar_hint: "Kiedy wystąpi deficyt budżetowy, możemy zredukować nasze [expenses_with_icon|el], podnieść [taxes_with_icon|el] lub [Concept('mint_with_icon','wybić')|e] więcej monet. Jeśli skończy nam się [gold_with_icon|el], będziemy zmuszeni do wzięcia [Concept('loans_with_icon','pożyczki')|e], a nawet możemy [Concept('bankrupt_with_icon','zbankrutować')|e]."
 STABILITY_HINT: "Nasz kraj jest niestabilny!"
 stability_topbar_hint: "Działania prowadzące do poprawy stabilności to między innymi:\n$BULLET_WITH_TAB$Zwiększenie liczby poddanych pełniących służbę jako [ShowPopTypeName('clergy')|l] religii #L [GetPlayer.GetReligion.GetAdjective|l][Select_CString(Or(EndsWith(GetPlayer.GetReligion.GetAdjectiveWithNoTooltip, 'k'),Or(EndsWith(GetPlayer.GetReligion.GetAdjectiveWithNoTooltip, 'n'),EndsWith(GetPlayer.GetReligion.GetAdjectiveWithNoTooltip, 'ł'))),'ej','kiej')]#!.\n$BULLET_WITH_TAB$Zwiększenie [Concept('budget_with_icon','budżetu')|e] na wydatki związane ze stabilnością.\n$BULLET_WITH_TAB$Zlecenie [Concept('cabinet_with_icon','gabinetowi')|e] podjęcia działania „[ShowCabinetActionName('stabilize_country')]”."
 LEGITIMACY_HINT: "[Localize( GetPlayer.GetGovernment.GetGovernmentType.GetPowerKey )] spada!"
 legitimacy_topbar_hint: "Istnieje kilka sposobów na poprawienie tej sytuacji:\n$BULLET_WITH_TAB$Zwiększenie [Concept('budget_with_icon','budżetu')|e] na wydatki związane z [Concept('court_maintenance_with_icon','utrzymaniem dworu')|e].\n$BULLET_WITH_TAB$Zlecenie [Concept('cabinet_with_icon','gabinetowi')|e] podjęcia działania „[ShowCabinetActionName('strengthen_government')]”."
 devotion_topbar_hint: "$legitimacy_topbar_hint$"
 republican_tradition_topbar_hint: "$legitimacy_topbar_hint$"
 horde_unity_topbar_hint: "$legitimacy_topbar_hint$"
 tribal_cohesion_topbar_hint: "$legitimacy_topbar_hint$"
 GOLD_VIEW_HINT: "Zobacz poradę dotyczącą deficytu"
 ###
 hint_in_deficit: "Ujemne saldo"
 hint_in_deficit_hint_text: "$hint_in_deficit_hint_text_1$\n\n$hint_in_deficit_hint_text_2$\n\n$hint_in_deficit_hint_text_3$"
 hint_in_deficit_hint_text_1: "Nasze saldo jest ujemne. Jeśli nie będziemy uważać, może się to skończyć długami, a nawet bankructwem."
 hint_in_deficit_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Przejdź do panelu @economy_panel![Link('economy', '', 'lateralview_economy_entry_name')], by sprawdzić [income_with_icon|el] oraz [expenses|l]. Możesz podnieść [taxes_with_icon|el] lub zmniejszyć koszty za pomocą suwaków.\n@arrow_bonus_tier_2! Dopilnuj, by wszystkie [buildings_with_icon|el] były rentowne, lub zbuduj ich więcej, jeśli nas na to stać. Możesz to zrobić w panelu @production_panel![Link('production', '', 'lateralview_production_entry_name')].\n@arrow_bonus_tier_2! Zarządzanie [Concept('estates_with_icon','stanami')|e] i ich wykorzystywanie również może przynieść krótkoterminowe lub długotrwałe skutki. Pamiętaj, że stany mogą posiadać znaczną siłę polityczną, więc nadmierne poleganie na nich bywa ryzykowne. Związane z nimi opcje znajdziesz w panelu @government_panel![Link('government', 'tabcontent = estates', 'lateralview_government_entry_name')]\n@arrow_bonus_tier_1! Także rozpoczęcie opłacalnej wymiany [Concept('trades_with_icon','handowej')|e] jest dobrym źródłem dochodów. Przejrzyj istniejące i potencjalne szlaki handlowe w panelu @economy_panel![Link('trade', '', 'lateralview_trade_entry_name')]."
 hint_in_deficit_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! [laws_with_icon|e], [reforms_with_icon|el], [diplomacy_with_icon|el] i inne opcje również mogą rozwiązać problem ujemnego salda."
 hint_in_deficit_military: "„Wojna może być kosztowna w krótkoterminowej perspektywie, ale jeśli odniesiemy sukces, możemy zmusić naszych wrogów do zapłacenia za nią. Zajęcie terytorium może przynieść nam długotrwałe korzyści, a wymuszenie pieniędzy od naszych wrogów zapewni krótkotrwały napływ bogactwa”."
 hint_in_deficit_explorer: "„Nieznana ziemia z pewnością kryje w sobie bogactwa, gotowe do eksploatacji i grabieży”."
 hint_in_deficit_administrative: "„Ustanowienie dominacji na rynkach krajowych byłoby dobrym sposobem na zwiększenie naszego bogactwa. Jeśli mamy większe ambicje, zdobycie przyczółków na rynkach zagranicznych może jeszcze bardziej przyspieszyć ten wzrost”."
 hint_in_deficit_diplomatic: "„Jak mawia przysłowie, aby zarabiać pieniądze, trzeba je najpierw wydać! Zapewnienie rentowności naszym budowlom i obywatelom to najlepszy sposób na poprawę sytuacji”."
 ###
 hint_cultural_capacity: "Przekroczona chłonność kulturowa"
 hint_cultural_capacity_hint_text: "$hint_cultural_capacity_hint_text_1$\n\n$hint_cultural_capacity_hint_text_2$\n\n$hint_cultural_capacity_hint_text_3$"
 hint_cultural_capacity_hint_text_1: "Chociaż wielokulturowość może przynosić wiele korzyści, kraje, które nie są gotowe na obciążenia administracyjne i nie mają odpowiedniej [Concept('cultural_capacity_with_icon','chłonności kulturowej')|e], odczują konsekwencje. [pops_with_icon|e] należące do [Concept('cultures_with_icon','kultur')|e] innych niż nasza [primary_culture_with_icon|el] zazwyczaj zaczynają jako [Concept('non_accepted_culture_short_with_icon','nieakceptowane')|e], ale za pewną cenę mogą stać się [Concept('tolerated_culture_short_with_icon','tolerowane')|e] lub [Concept('accepted_culture_short_with_icon','akceptowane')|e]."
 hint_cultural_capacity_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Rozważ obniżenie rangi kultury o mniejszym znaczeniu strategicznym, aby zmniejszyć koszty.\n@arrow_bonus_tier_2! [ShowModifierTypeName('cultures_capacity')] ma kilka źródeł, które zwykle da się znaleźć w panelach [government_reforms_with_icon|e] i [advances_with_icon|e]."
 hint_cultural_capacity_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! [assimilation_with_icon|el] również może zmniejszyć liczbę kultur w kraju."
 hint_cultural_capacity_military: "„Wykorzystanie naszych kultur ma kluczowe znaczenie dla tworzenia tradycji i wpływów, co daje nam przewagę w przypadku konfliktów kulturowych. Zwiększenie praw obcych kultur zapewni nam również dodatkowe dochody i żołnierzy”."
 hint_cultural_capacity_administrative: "„Naszą kulturę można również wyrazić poprzez wspaniałe dzieła sztuki tworzone przez krajowych artystów. W końcu czym jest naród, jeśli nie sumą jego wpływu na świat?”"
 hint_cultural_capacity_diplomatic: "„Z czasem obce kultury mogą się zasymilować i zbliżyć do naszej podstawowej kultury [GetPlayer.Custom('C_LOC')]! Kto nie chciałby być taki, jak [GetPlayer.GetCulture.GetNameWithNoTooltip]?”"
 ###
 hint_unhappy_estates: "Niezadowolone stany"
 hint_unhappy_estates_hint_text: "$hint_unhappy_estates_hint_text_1$\n\n$hint_unhappy_estates_hint_text_2$\n\n$hint_unhappy_estates_hint_text_3$"
 hint_unhappy_estates_hint_text_1: "Utrzymanie zadowolenia [Concept('estates_with_icon','stanów')|e] jest ważnym i stałym elementem rządzenia państwem. To one odpowiadają za znaczą część potęgi militarnej i gospodarczej kraju.\n\nKażdy nielojalny stan sprawi, że twój kraj dotkną kary, zaś [pops_with_icon|e], które się na niego składają, z dużym prawdopodobieństwem dołączać będą do [Concept('rebellions_with_icon','buntów')|e]."
 hint_unhappy_estates_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Wydajność i [estate_satisfaction_short_with_icon|e] mogą być kontrolowane poprzez przyznawanie i odbieranie przywilejów w panelu @government_panel![Link('government', 'tabcontent = estates', 'lateralview_government_entry_name')].\n@arrow_bonus_tier_2! Podnoszenie i obniżanie podatków w panelu @economy_panel! [Link('economy', '', 'lateralview_economy_entry_name')] także wpływa na satysfakcję."
 hint_unhappy_estates_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! [parliament_with_icon|e] także można wykorzystać do zarządzania [Concept('estate_satisfaction_with_icon','satysfakcją stanową')|e].\n@hint! Dowiedz się więcej o [Concept('rebel_movements_with_icon','buntownikach')|e]: [Link('hints', 'selected_hint = hint_rebels_growing','podpowiedź dot. buntowników')]."
 hint_unhappy_estates_administrative: "„Stany mają kluczowe znaczenie dla zdrowej potęgi handlowej. Tak, być może w dłuższej perspektywie będziemy musieli zrezygnować z części władzy, ale pomyślmy o gospodarce!”"
 hint_unhappy_estates_diplomatic: "„Nasze stany mogą mieć własne opinie na temat spraw dyplomatycznych. Warto wziąć pod uwagę ich ocenę obcego mocarstwa podczas zawierania sojuszy lub paktów”."
 hint_unhappy_estates_military: "„Nasze stany zapewniają niezbędne dochody, które napędzają ekspansję. Jeśli nie utrzymamy ich po naszej stronie, może zabraknąć nam rekrutów właśnie wtedy, gdy będziemy ich najbardziej potrzebować”."
 ESTATE_CONTEXT_TEXT: "$LIST$ w twoim kraju są niezadowoleni.\n\n$TEXT$"
 HINT_UNHAPPY_ESTATE: "[ESTATE.GetName]"
 ###
 hint_manpower: "Siła żywa"
 hint_manpower_hint_text: "$hint_manpower_hint_text_1$\n\n$hint_manpower_hint_text_2$\n\n$hint_manpower_hint_text_3$"
 hint_manpower_hint_text_1: "Nasza [manpower_with_icon|el] to rezerwa ludzi gotowych do werbunku jako [regulars_with_icon|el] w naszych [Concept('armies_with_icon','armiach')|e]. Oddziały regularne znacznie przewyższają [Concept('levies_with_icon','poborowych')|e] w [Concept('battle_with_icon','bitwach')|e], ale są kosztowne, więc nie każdy [country_with_icon|el] może sobie na nich pozwolić na początku gry."
 hint_manpower_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Jeśli polegamy na [Concept('regulars','odziałach regularnych')] w prowadzeniu wojny, niski poziom [Concept('manpower','siły żywej')] poważnie ogranicza naszą zdolność do uzupełniania [Concept('armies_with_icon','armii')|e], więc lepiej nie wypowiadać [Concept('war_with_icon','wojny')|e], jeśli mamy za mało ludzi.\n@arrow_bonus_tier_2! Jeśli w czasie wojny zaczyna nam brakować siły żywej, warto rozważyć zwiększenie [Concept('levies_with_icon','poboru')|e], zatrudnienie [Concept('mercenaries_with_icon','najemników')|e], a nawet zawarcie [Concept('peace_with_icon','pokoju')|e]."
 hint_manpower_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Możemy rozwinąć maksymalny potencjał siły żywej naszego narodu i zdolność do rekrutacji stałej armii dzięki różnym [Concept('buildings_with_icon','budowlom')|e].\n@hint! [estate_privileges_with_icon|e] i [laws_with_icon|el] również wpływają na potencjalną liczebność siły żywej."
 hint_manpower_diplomatic: "„Elitarna, stała armia złożona z dobrych #L [GetPlayer.GetAdjectiveWithNoTooltip|l]kich#! mężczyzn i chłopców jest prawdopodobnie najskuteczniejszą siłą bojową, jeśli weźmiemy pod uwagę potencjał jednego takiego żołnierza”."
 hint_manpower_military: "„Podbój wymaga wykorzystania wszystkich dostępnych środków. Wszechstronne siły zbrojne powinny korzystać zarówno z najemników, poborowych, jak i stałej armii”."
 hint_manpower_administrative: "„Pamiętaj, że każdy żołnierz, który ginie na polu bitwy, to jeden robotnik mniej do pracy w polu. Wojna jest kosztowna”."
 ###
 hint_low_stability: "Niska stabilność"
 hint_low_stability_hint_text: "$hint_low_stability_hint_text_1$\n\n$hint_low_stability_hint_text_2$\n\n$hint_low_stability_hint_text_3$"
 hint_low_stability_hint_text_1: "Jeśli nasza [stability_with_icon|el] jest niska, ryzykujemy, że [pops_with_icon|el] dołączą do [Concept('rebellion_with_icon','buntu')], niezadowolony [estate_with_icon|e] wywoła [Concept('civil_war_with_icon','wojnę domową')|e], a kraj pogrąży się w chaosie."
 stability_raise_actions: "@arrow_bonus_tier_3! Zwiększenie [Concept('budget_with_icon','budżetu')|e] na wydatki związane ze stabilnością.\n@arrow_bonus_tier_2! Zlecenie [Concept('cabinet_with_icon','gabinetowi')|e] podjęcia działania „[ShowCabinetActionName('stabilize_country')]”.\n@arrow_bonus_tier_1! Zwiększenie liczby poddanych pełniących służbę jako [ShowPopTypeName('clergy')|l] religii #L [GetPlayer.GetReligion.GetAdjective|l][Select_CString(Or(EndsWith(GetPlayer.GetReligion.GetAdjectiveWithNoTooltip, 'k'),Or(EndsWith(GetPlayer.GetReligion.GetAdjectiveWithNoTooltip, 'n'),EndsWith(GetPlayer.GetReligion.GetAdjectiveWithNoTooltip, 'ł'))),'ej','kiej')]#!."
 hint_low_stability_hint_text_2: "#T Zalecane działania:#!\n$stability_raise_actions$"
 hint_low_stability_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Stabilność bierze się także z innych źródeł, takich jak [advances_with_icon|el] lub [policies_with_icon|el].\n@hint! Pamiętaj, że stabilność jest również zużywana przez niektóre ważne działania, takie jak wypowiedzenie [Concept('wars_with_icon','wojny')|e] bez odpowiedniego [casus_belli_with_icon|el] lub zmiana [Concept('law_with_icon','prawa')|e]."
 hint_low_stability_administrative: "„Bardzo stabilny naród to oczywiście naród prosperujący! Gdy zbiory są obfite, do naszych skarbców napływa bogactwo”."
 hint_low_stability_military: "„Naród nie może bezpiecznie dominować nad innymi bez uprzedniego zapewnienia spokoju wśród populacji. Prości ludzie lubią wymachiwać swoimi widłami…”."
 hint_low_stability_diplomatic: "„Nasi sąsiedzi będą bardzo szczęśliwi, gdy doprowadzimy kraj na skraj upadku. Czy moglibyśmy coś z tym zrobić?”"
 ###
 hint_very_low_stability: "Bardzo niska stabilność"
 hint_very_low_stability_hint_text: "$hint_very_low_stability_hint_text_1$\n\n$hint_very_low_stability_hint_text_2$\n\n$hint_very_low_stability_hint_text_3$"
 hint_very_low_stability_hint_text_1: "Jeśli nasza [stability_with_icon|el] jest bardzo niska, istnieje bardzo duże ryzyko, że nasze [pops_with_icon|el] dołączą do [Concept('rebellion_with_icon','buntu')|e], niezadowolony [estate_with_icon|e] wywoła [Concept('civil_war_with_icon','wojnę domową')|e], a nasi wrogowie wykorzystają tę sytuację, by uderzyć na nas, gdy będziemy słabi."
 hint_very_low_stability_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Powinniśmy jak najszybciej podnieść stabilność i unikać wypowiadania kolejnych [Concept('wars_with_icon','wojen')|e] oraz innych działań obniżających stabilność.\n$stability_raise_actions$"
 hint_very_low_stability_hint_text_3: "$hint_low_stability_hint_text_3$"
 hint_very_low_stability_administrative: "„Jak można oczekiwać, że ktoś będzie prowadzić działalność w takiej sytuacji? Proszę, pomóż nam nad tym zapanować, nasze bydło głoduje”."
 hint_very_low_stability_military: "„Każdy wróg [GetPlayer.Custom('C_DOP')] byłby absolutnie zachwycony tym, jak słabi obecnie jesteśmy. Możemy się spodziewać, że nasi rywale i przeciwnicy zaczynają knuć przeciwko nam”."
 hint_very_low_stability_diplomatic: "„W przypadku wysokiej stabilności naród doświadcza doskonałej mobilności społecznej, my natomiast najwyraźniej wynaleźliśmy pewien rodzaj społecznej demobilizacji”."
 ###
 hint_low_legitimacy: "Niska prawomocność rządów"
 hint_low_legitimacy_hint_text: "$hint_low_legitimacy_hint_text_1$\n\n$hint_low_legitimacy_hint_text_2$\n\n$hint_low_legitimacy_hint_text_3$"
 hint_low_legitimacy_hint_text_1: "[legitimacy_with_icon|eU] wskazuje, jak reszta świata postrzega fakt, iż obecna głowa państwa, [GetPlayer.GetGovernment.GetRulerTitle|l], rządzi naszym krajem. Jeśli wartość ta spadnie zbyt nisko, nie tylko utracimy wszelkie korzyści związane z [Concept('crown_power_with_icon','wpływami korony')|e] i zmniejszonym ryzykiem [Concept('rebellion_with_icon','rebelii')|e], ale też otrzymamy kary do satysfakcji [Concept('estate_with_icon','stanowej')|e] oraz [Concept('righteousness_with_icon','prawości')|e]."
 hint_low_legitimacy_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Powinniśmy dążyć do utrzymania jak najwyższego poziomu prawomocności, aby zminimalizować wszelkie potencjalne kary.\n@arrow_bonus_tier_2! Zwiększenie [Concept('court_maintenance_with_icon','kosztów utrzymania dworu')|e] powinno pomóc w utrzymaniu wysokiego poziomu [Concept('legitimacy_with_icon','prawomocności')|e].\n@arrow_bonus_tier_2! [legitimacy_with_icon|e] ma też inne źródła, takie jak [advances_with_icon|el] lub [policies_with_icon|el].\n@arrow_bonus_tier_1! Wybierz [cabinet_action_with_icon|el] o nazwie „[ShowCabinetActionName('strengthen_government')]”."
 hint_low_legitimacy_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Podobnie jak w przypadku innych ważnych wskaźników, stworzenie pozytywnego wizerunku [Concept('dynasty_with_icon','dynastii')|e] wymaga czasu, dlatego należy myśleć długofalowo."
 hint_low_legitimacy_administrative: "„Każdy, kto pozna pochodzenie naszych przodków i wspaniałość naszego dworu, nie będzie mógł zaprzeczyć naszemu prawu do władzy”."
 hint_low_legitimacy_military: "„Jak można oczekiwać, że wrogowie będą się nas bać, jeśli nasi żołnierze wątpią w nasze przywództwo?”"
 hint_low_legitimacy_diplomatic: "„Czasami wewnętrzna siła pochodzi z tego, jak postrzegają nas inni, a nasi sprzymierzeńcy mogą też pomóc nam w kłopotach”."
 ###
 hint_low_republican_tradition: "Niska tradycja republikańska"
 hint_low_republican_tradition_hint_text: "$hint_low_republican_tradition_hint_text_1$\n\n$hint_low_republican_tradition_hint_text_2$\n\n$hint_low_republican_tradition_hint_text_3$"
 hint_low_republican_tradition_hint_text_1: "[republican_tradition_with_icon|e] reprezentuje podejście, jakie ma [GetPlayer.GetGovernment.GetGovernmentType.GetName] do republikanizmu. Jeśli spadnie zbyt nisko, nie tylko stracimy wszelkie korzyści związane z [Concept('legislative_efficiency_with_icon','wydajnością legislacji')|e] i zmniejszonym ryzykiem [Concept('rebellion_with_icon','rebelii')|e], ale zaczniemy też otrzymywać surowe kary do kosztów zwiększania [Concept('stability_with_icon','stabilności')|e]."
 hint_low_republican_tradition_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Powinniśmy dążyć do utrzymania naszych tradycji na jak najwyższym poziomie, aby zminimalizować wszelkie potencjalne kary.\n@arrow_bonus_tier_2! Zwiększenie [Concept('court_maintenance_with_icon','kosztów utrzymania dworu')|e] pomoże utrzymać [Concept('republican_tradition_with_icon','tradycję republikańską')|e]. \n@arrow_bonus_tier_2! Innymi źródłami [Concept('republican_tradition_with_icon','tradycji republikańskiej')|e] są na przykład [advances_with_icon|el] lub [policies_with_icon|el].\n@arrow_bonus_tier_1! Zmiana [Concept('ruler_with_icon','głowy państwa')|e] podczas [Concept('election_with_icon','wyborów')|e] również pomaga w utrzymaniu [Concept('republican_tradition_with_icon','tradycji republikańskiej')|e]."
 hint_low_republican_tradition_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Podobnie jak w przypadku innych ważnych wskaźników, nauczenie społeczeństwa wartości republikańskich wymaga czasu, dlatego należy myśleć z wyprzedzeniem."
 hint_low_republican_tradition_administrative: "„Elekcje to naturalny proces każdej zdrowej republiki”."
 hint_low_republican_tradition_military: "„Nawet najemnicy nie będą chcieli dla nas walczyć, jeśli zdamy się im tyranami”."
 hint_low_republican_tradition_diplomatic: "„Żaden naród, który ceni sobie siłę, nie sprzymierzy się z państwem, które tak otwarcie odrzuca zasady, na których powstawał”."
 ###
 hint_low_devotion: "Małe oddanie"
 hint_low_devotion_hint_text: "$hint_low_devotion_hint_text_1$\n\n$hint_low_devotion_hint_text_2$\n\n$hint_low_devotion_hint_text_3$"
 hint_low_devotion_hint_text_1: "$game_concept_devotion_desc$ Jeśli zbytnio spadnie, nie tylko stracimy korzyści wynikające z [Concept('religious_influence_with_icon','wpływu religijnego')|e] i zmniejszonego ryzyka [Concept('rebellion_with_icon','rebelii')|e], ale zaczniemy też otrzymywać kary do satysfakcji [Concept('estate_with_icon','stanowej')|e]."
 hint_low_devotion_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Powinniśmy dążyć do utrzymania jak najwyższego poziomu oddania, aby zminimalizować wszelkie potencjalne kary.\n@arrow_bonus_tier_2! Zwiększenie [Concept('court_maintenance_with_icon','kosztów utrzymania dworu')|e] powinno pomóc w utrzymaniu wysokiego poziomu [Concept('devotion_with_icon','oddania')|e].\n@arrow_bonus_tier_2! [devotion_with_icon|e] ma też inne źródła, takie jak [advances_with_icon|el] lub [policies_with_icon|el]."
 hint_low_devotion_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Podobnie jak w przypadku innych ważnych wskaźników, promowanie religijnego oddania nie jest zadaniem na jeden dzień, dlatego należy myśleć długofalowo."
 hint_low_devotion_administrative: "„Nie wystarczy reprezentować wiernych i mienić się ich obrońcami, musimy także nimi być”."
 hint_low_devotion_military: "„Jeśli nasze armie mają reprezentować miecz i tarczę wiernych, musimy stać się symbolem, za który walczą”."
 hint_low_devotion_diplomatic: "„Naszym celem powinno być szerzenie wiary jak tylko się da, ale nikt nie da wiary naszym słowom, jeśli nie będziemy pobożni”."
 ###
 hint_low_horde_unity: "Mała jedność ordy"
 hint_low_horde_unity_hint_text: "$hint_low_horde_unity_hint_text_1$\n\n$hint_low_horde_unity_hint_text_2$\n\n$hint_low_horde_unity_hint_text_3$"
 hint_low_horde_unity_hint_text_1: "$game_concept_horde_unity_desc$"
 hint_low_horde_unity_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Najskuteczniejszym sposobem na zjednoczenie ordy jest przepędzenie najbliższych wrogów.\n@arrow_bonus_tier_2! Zwiększenie [Concept('court_maintenance_with_icon','kosztów utrzymania dworu')|e] powinno pomóc w utrzymaniu wysokiego poziomu [Concept('horde_unity_with_icon','jedności ordy')|e].\n@arrow_bonus_tier_2! [horde_unity_with_icon|e] ma także inne źródła, takie jak [advances_with_icon|el] lub [policies_with_icon|el]."
 hint_low_horde_unity_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Zbyt niska jedność może mieć katastrofalne skutki, dlatego lepiej utrzymywać ją na wysokim poziomie."
 hint_low_horde_unity_administrative: "„Dziel i rządź to dobrze znana strategia. Jeśli nie będziemy zjednoczeni, to my zostaniemy podbici”."
 hint_low_horde_unity_military: "„Jak głosi nasze przysłowie: dobre rzeczy przytrafiają się tym, którzy potrafią odebrać je słabszym. Siła nas łączy i dzięki niej będziemy zjednoczeni!”"
 hint_low_horde_unity_diplomatic: "„Nasza waleczność wynika bezpośrednio z jedności naszego ludu. Zwycięstwa w wojnach i podbojach to samospełniająca się przepowiednia”."
 ###
 hint_low_tribal_cohesion: "Mała spójność plemienna"
 hint_low_tribal_cohesion_hint_text: "$hint_low_tribal_cohesion_hint_text_1$\n\n$hint_low_tribal_cohesion_hint_text_2$\n\n$hint_low_tribal_cohesion_hint_text_3$"
 hint_low_tribal_cohesion_hint_text_1: "$game_concept_tribal_cohesion_desc$ W przeciwieństwie do innych [Concept('government_types_with_icon','ustrojów politycznych')|e], ustroje plemienne czerpią korzyści ze zwiększonego poboru wraz ze wzrostem spójności. Jeśli chcemy podejmować skuteczne decyzje wojskowe, musimy utrzymać plemiona w ryzach."
 hint_low_tribal_cohesion_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_2! Zwiększenie [Concept('court_maintenance_with_icon','kosztów utrzymania dworu')|e] powinno pomóc w utrzymaniu wysokiego poziomu [Concept('tribal_cohesion_with_icon','spójności plemiennej')|e].\n@arrow_bonus_tier_2! [tribal_cohesion_with_icon|e] ma także inne źródła, takie jak [advances_with_icon|el] lub [policies_with_icon|el]."
 hint_low_tribal_cohesion_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Zbyt niska spójność może mieć katastrofalne skutki, dlatego lepiej utrzymywać ją na wysokim poziomie."
 hint_low_tribal_cohesion_administrative: "„Jeśli po prostu zignorujemy problem, nasza spójność będzie słabsza. Zarządzanie krajem wymaga dbałości o szczegóły”."
 hint_low_tribal_cohesion_military: "„Słaba spójność plemienna nas osłabia. A słabość powoduje dalsze podziały. Nie idź dalej tą drogą, bo zostaniemy podbici i zniewoleni”."
 hint_low_tribal_cohesion_diplomatic: "„Stany są tak głęboko zakorzenione w wielu aspektach życia kraju, że niemal każde nasze działanie może mieć konsekwencje w przyszłości. Strategia wymaga długoterminowego planowania”."
 ###
 hint_war_exhaustion: "Duże wyczerpanie wojenne"
 hint_war_exhaustion_hint_text: "$hint_war_exhaustion_hint_text_1$\n\n$hint_war_exhaustion_hint_text_2$\n\n$hint_war_exhaustion_hint_text_3$"
 hint_war_exhaustion_hint_text_1: "[war_exhaustion_with_icon|eU] to wartość reprezentująca ogólne zmęczenie ludności spowodowane wojną. Wysoki poziom wyczerpania może być niezwykle niebezpieczny dla dowolnego kraju. Wraz ze wzrostem wyczerpania wojennego zmniejsza się skuteczność bojowa [Concept('army_with_icon','armii')|e] i [Concept('levies_with_icon','poborowych')|e] oraz przyrost [Concept('pops_with_icon','ludności')|e], a nasza gospodarka popada w ruinę."
 hint_war_exhaustion_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Najskuteczniejszą i gwarantowaną metodą jest pokój.\n@arrow_bonus_tier_2! Niektóre [laws_with_icon|el] i [estate_privileges_with_icon|el] mogą pomóc zmniejszyć wyczerpanie wojenne w miarę upływu czasu."
 hint_war_exhaustion_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Powinniśmy rozłożyć nasze podboje w czasie i nie wypowiadać [Concept('wars_with_icon','wojen')|e], jeśli nasze wyczerpanie wojenne jest duże."
 hint_war_exhaustion_administrative: "„Decydujące wojny mogą przynieść korzyści, ale zmęczona wojną ludność ma same minusy. Spada produkcja, spada konsumpcja, szczerze mówiąc – wszystko spada!”"
 hint_war_exhaustion_military: "„Wyczerpanie wojenne może być niebezpieczne, ale wynika przede wszystkim ze złej taktyki. Ogromne straty i wielkie porażki szybko zwrócą nasz lud przeciwko nam”."
 hint_war_exhaustion_diplomatic: "„Przegrana wojna nigdy nie jest czymś dobrym, ale gorzka porażka może również wywołać w naszych poddanych pragnienie zemsty. Rewanżyzm to silny narkotyk”."
 ###
 hint_low_sailors: "Marynarze"
 hint_low_sailors_hint_text: "$hint_low_sailors_hint_text_1$\n\n$hint_low_sailors_hint_text_2$\n\n$hint_low_sailors_hint_text_3$"
 hint_low_sailors_hint_text_1: "$game_concept_sailors_desc$"
 hint_low_sailors_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Jeśli prowadząc wojny, polegamy na [Concept('ships_with_icon','okrętach')|e], mała liczba marynarzy poważnie ogranicza naszą zdolność do uzupełniania [Concept('navies_with_icon','floty')|e], więc wypowiedzenie [Concept('war_with_icon','wojny')|e] jest nierozsądne, gdy mamy mało marynarzy.\n@arrow_bonus_tier_2! [explorations_with_icon|e] również wymagają marynarzy, więc musimy je dobrze zaplanować."
 hint_low_sailors_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Możemy rozwijać szkolenie marynarzy w naszym kraju dzięki różnym [Concept('buildings_with_icon','budowlom')|e].\n@hint! [estate_privileges_with_icon|e] i [laws_with_icon|el] również mogą wpłynąć na potencjalną liczbę marynarzy."
 hint_low_sailors_administrative: "„Kto kontroluje morze, kontroluje bogactwa świata. Silna tradycja morska i żeglarska idzie w parze z dominacją handlową”."
 hint_low_sailors_military: "„Silna marynarka wojenna z odpowiednią liczbą marynarzy umożliwia eksploatację zarówno odległych ziem, jak i terytoriów krajowych. Nawet żołnierze działający za granicą mogą korzystać z chronionych linii zaopatrzeniowych”."
 hint_low_sailors_diplomatic: "„Budowle morskie często mają bezpośredni wpływ na nasz potencjał handlowy. Warto rozważyć synergię między tymi dziedzinami”."
 ###
 hint_low_diplomats: "Mało dyplomatów"
 hint_low_diplomats_hint_text: "$hint_low_diplomats_hint_text_1$\n\n$hint_low_diplomats_hint_text_2$\n\n$hint_low_diplomats_hint_text_3$"
 hint_low_diplomats_hint_text_1: "[diplomats_with_icon|eU] są niezbędni do zarządzania stosunkami dyplomatycznymi z innymi krajami. Wiele działań, takich jak poprawa stosunków, będzie nas z czasem kosztować dyplomatów, podczas gdy działania jednorazowe będą miały raczej stały koszt."
 hint_low_diplomats_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Rezygnacja z poprawy stosunków z niektórymi krajami sprawi, że będziemy mieć więcej dyplomatów do pełnienia innych funkcji, jeśli nie mamy ich wystarczającej liczby.\n@arrow_bonus_tier_2! Możemy również pozyskać więcej dyplomatów z innych źródeł, takich jak [advances_with_icon|el]."
 hint_low_diplomats_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Chociaż dobrze jest utrzymywać rezerwę dyplomatów na potrzeby działań doraźnych, wykorzystanie naszych dyplomatów do realizacji długoterminowych planów również ma kluczowe znaczenie dla osiągnięcia sukcesu."
 hint_low_diplomats_administrative: "„Utrzymanie dobrych stosunków jest podstawą bogatego imperium! Przyjaźń z sąsiadami z pewnością da dostęp do większych i lepszych rynków”."
 hint_low_diplomats_military: "„Dyplomaci mogą być również wykorzystywani do umacniania naszej dominacji nad słabszymi krajami. Im silniejsi jesteśmy, tym większe prawdopodobieństwo, że podporządkujemy sobie innych przyjaźnią lub groźbą”."
 hint_low_diplomats_diplomatic: "„Reformowanie i udoskonalanie naszego rządu to niezawodny sposób na poprawę naszych zdolności dyplomatycznych. Oczywiście niektóre kultury są po prostu bardziej wyczulone na sztukę perswazji niż inne”."
 LOW_DIPLOMATS_HINT: "Mało dyplomatów!"
 ### Low Food in Market
 hint_low_food_in_market: "Mało żywności na rynku"
 hint_low_food_in_market_hint_text: "$hint_low_food_in_market_hint_text_1$\n\n$hint_low_food_in_market_hint_text_2$\n\n$hint_low_food_in_market_hint_text_3$"
 hint_low_food_in_market_hint_text_1: "Rynki wymagają wystarczających zapasów [Concept('food_with_icon','żywności')|e], aby zaspokoić zapotrzebowanie poszczególnych [Concept('provinces_with_icon','prowincji')|e]. W przeciwnym razie w lokacjach w tych prowincjach może zapanować [Concept('starving_with_icon','głód')|e]."
 hint_low_food_in_market_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Ulepszenie [Concept('rgo_with_icon','operacji pozyskiwania surowców')|e] produkujących żywność zwiększy jej zapas.\n@arrow_bonus_tier_2! Możemy [Concept('import_with_icon','importować')|e] żywność, [Concept('trades_with_icon','handlując')|e] [Concept('goods_with_icon','towarami')|e] żywnościowymi."
 hint_low_food_in_market_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Zmniejszenie liczby [Concept('buildings_with_icon','budowli')|e] w [Concept('location_with_icon','lokacji')|e] sprawi, że część [Concept('pops_with_icon','społeczności')|e] wróci do [Concept('subsistence_agriculture_with_icon','rolnictwa samowystarczalnego')|e]."
 HINT_MARKET_ENTRY: "[MARKET.GetName]:"
 HINT_BUILDING_ENTRY: "[BUILDING_TYPE.GetName]"
 LOW_FOOD_CAP_TEXT: "[SelectLocalization( StringIsEmpty( GetListOfAvailableBuildingsWithModifier('merchant_capacity_from_building') ), Localize('LOW_FOOD_NO'), Localize( 'LOW_FOOD_YES' ) )]"
 LOW_FOOD_YES: "\n@arrow_bonus_tier_1! Jeśli nasza [merchant_capacity_with_icon|el] jest wystarczająca, możemy importować żywność z rynku posiadającego odpowiedni zapas.\n\nJeśli brakuje nam wydajności, budowle takie jak [GetListOfAvailableBuildingsWithModifier('merchant_capacity_from_building')] mogą zwiększyć nasz potencjał handlowy."
 LOW_FOOD_NO: "\n\nJeśli nasza [merchant_capacity_with_icon|el] jest wystarczająca, możemy importować żywność z rynku posiadającego odpowiedni zapas."
 LOW_MARKET_FOOD_TEXT: "$LIST$ – zapasy [Concept('food_with_icon','żywności')|e] są na poziomie krytycznym.$LOW_FOOD_CAP_TEXT$"
 LOW_MARKET_FOOD_TEXT_BUILDINGS: "$LIST$ – zapasy [Concept('food_with_icon','żywności')|e] są na poziomie krytycznym.\n\nIstnieje kilka metod postępowania z niedoborem żywności na rynku. Im więcej żywności produkuje dana lokalizacja, tym mniejsze obciążenie stanowi dla prowincji i rynku, do którego należy, a nawet może pomóc innym lokalizacjom, jeśli wygeneruje nadwyżkę.\n\n\n@arrow_bonus_tier_3! [rgo_with_icon|e] to główne źródło [Concept('food','żywności')], zwłaszcza w lokacjach o dużej [Concept('food_productivity_with_icon','efektywności produkcyjnej')|e]. Jeśli na naszym [Concept('market','rynku')|e] brakuje [Concept('food','żywności')], powinniśmy przede wszystkim dążyć do zwiększenia jej produkcji.\n@arrow_bonus_tier_2! [buildings_with_icon|e] takie jak $BUILDING_LIST$ także mogą zwiększyć produkcję żywności, jeśli produkcja [Concept('goods_with_icon','towarów')|e] jest odpowiednia.$LOW_FOOD_CAP_TEXT$"
 hint_low_food_in_market_administrative: "„Rynki z lokacjami specjalizującymi się w produkcji żywności będą oferować zarówno bezpieczeństwo, jak i ogromny potencjał zysków. Jeśli inni będą zmuszeni przybywać do nas, aby przetrwać, da nam to niemal nieograniczoną przewagę”."
 hint_low_food_in_market_military: "„Chociaż nasze możliwości handlowe są ograniczone przez infrastrukturę, gospodarka oparta na imporcie musi być zwykle wspierana przez silną flotę. Bez tego narażamy się na łaskę każdego, kto odważy się zająć nasze szlaki handlowe”."
 hint_low_food_in_market_diplomatic: "„Samowystarczalna gospodarka żywnościowa to szczytny cel, ale prowadzenie gospodarki opartej na imporcie, by wyżywić #L [GetPlayer.GetAdjectiveWithNoTooltip|l]ką#! ludność pozwoli nam skupić się na bardziej dochodowej produkcji”."
 ###
 hint_over_diplo_capacity: "Przekroczono możliwości dyplomatyczne"
 hint_over_diplo_capacity_hint_text: "$hint_over_diplo_capacity_hint_text_1$\n\n$hint_over_diplo_capacity_hint_text_2$\n\n$hint_over_diplo_capacity_hint_text_3$"
 hint_over_diplo_capacity_hint_text_1: "Sojusz ze wszystkimi to sojusz z nikim. [country_with_icon|e], który utrzymuje więcej relacji, niż wskazują jego $game_concept_diplomatic_capacity$, otrzyma karę do [Concept('diplomatic_reputation_with_icon','reputacji dyplomatycznej')|e] oraz [Concept('prestige_with_icon','prestiżu')|e]. Niektóre [subject_types_with_icon|e] posiadają $game_concept_diplomatic_upkeep$, które również zmniejszają dostępne możliwości dyplomatyczne.\n\nPrzynależność do niektórych [Concept('international_organizations_with_icon','organizacji międzynarodowych')|e] zmniejszy nieco możliwości dyplomatyczne, zaś siła [Concept('ally_with_icon','sojusznika')|e] wpływa na koszt [Concept('alliance_with_icon','sojuszu')|e]."
 hint_over_diplo_capacity_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Wstrzymanie poprawy stosunków przez naszych [Concept('diplomats_with_icon','dyplomatów')|e] zwiększy nasze możliwości.\n@arrow_bonus_tier_2! Warto ocenić, czy powinniśmy zakończyć niektóre [alliances_with_icon|el] lub [treaties_with_icon|el].\n@arrow_bonus_tier_1! Opuszczając [Concept('international_organizations_with_icon','organizacje międzynarodowe')|e], do których już nie musimy należeć, również odzyskamy część możliwości dyplomatycznych."
 hint_over_diplo_capacity_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! [estate_privileges_with_icon|e], [laws_with_icon|el] i [advances_with_icon|el] mogą czasem zwiększyć możliwości dyplomatyczne."
 hint_over_diplo_capacity_military: "„Być może powinniśmy traktować sojusze jako środek do osiągnięcia celu, a nie jako trwałą przyjaźń. W końcu nasi sojusznicy z pewnością spojrzeliby na nas głodnymi ślepiami, gdybyśmy okazali słabość…”."
 hint_over_diplo_capacity_administrative: "„Przepracowanie naszych dyplomatów ma niekorzystny skutek uboczny, gdyż wykonują wówczas większość zadań z mniejszą skutecznością. Chociaż ciągłe poganianie ich do roboty może być kuszące, nie jest to dobre rozwiązanie w perspektywie długoterminowej”."
 hint_over_diplo_capacity_diplomatic: "„Jeśli mamy priorytetowo traktować nasz rozwój wewnętrzny, silne sojusze z nawiązką zrekompensują wszelkie postrzegane słabości militarne. Być może powinniśmy najpierw odpuścić sobie inne stosunki?”"
 ###
 hint_rebels_growing: "$game_concept_rebel_movements$"
 hint_rebels_growing_hint_text: "$hint_rebels_growing_hint_text_1$\n\n$hint_rebels_growing_hint_text_2$\n\n$hint_rebels_growing_hint_text_3$"
 hint_rebels_growing_hint_text_1: "Twoje [pops_with_icon|e] dołączą do [Concept('rebel_movements_with_icon','ruchów buntowniczych')|e], kiedy ich [pop_satisfaction_with_icon|el] spadnie poniżej progu, jaki wyznacza [ShowModifierTypeName('pop_join_rebel_threshold')].\n\n[rebel_movements] będą co miesiąc czynić postępy ku otwartej rewolcie zależne od ich poparcia. Kiedy wyniesie ono #W 100%#!, rozpocznie się [revolt_with_icon|el] lub [civil_war_with_icon|el].\n\nNajczęstszymi przyczynami poparcia dla buntowników są niska [stability_with_icon|el], dyskryminowane [cultures_with_icon|el] i [religions_with_icon|el] oraz rozgniewane [estates_with_icon|el]."
 hint_rebels_growing_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Zadbaj, żeby [stability_with_icon|el] i [legitimacy_with_icon|el] były możliwie wysokie.\n@arrow_bonus_tier_2! Użyj [Concept('cabinet_action_with_icon','działania gabinetu')|e] „[ShowCabinetActionName('rebel_crackdown')|l]”, aby powstrzymać postępy zbliżającego się [Concept('rebellion','buntu')].\n@arrow_bonus_tier_1! Przemieść [Concept('army_with_icon','armię')|e] do [Concept('province_with_icon','prowincji')|e] z niezadowolonymi [Concept('pops','społecznościami')]. Obecność żołnierzy uczyni je bardziej... #italic wyrozumiałymi#!.\n\nNajważniejsze jest, mówiąc ogólnie, zwiększenie [pop_satisfaction_icon] satysfakcji buntowniczych [pops|l]:\n@arrow_bonus_tier_2! Zadbaj, aby najliczniejszymi [Concept('cultures','kulturami')] w twoim [Concept('country','kraju')] były [accepted_culture_short_with_icon|el] lub [tolerated_culture_short_with_icon|el].\n@arrow_bonus_tier_1! Zadbaj, aby buntujące się [pops|l] mogły zaspokoić możliwie wiele swoich [Concept('pop_needs_with_icon','potrzeb')|e] dzięki [Concept('market_with_icon','rynkowi')|e].\n@arrow_bonus_tier_3! Dbaj, aby [estate_icon] [estate_satisfaction_with_icon|el] pozostawała wysoka, bo wpływa znacząco na satysfakcję wszystkich powiązanych [pops|l].\n$TAB$@arrow_bonus_tier_2! Daj [privilege_with_icon|el]\n$TAB$@arrow_bonus_tier_2!Przekup [estate|l].\n$TAB$@arrow_bonus_tier_2! Obniż [taxes_with_icon|el]."
 hint_rebels_growing_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! [societal_values_with_icon|e], takie jak [ShowSocietyDirectionName('communalism')|l] i [ShowSocietyDirectionName('decentralization')|l], również mogą wpływać na prawdopodobieństwo buntu.\n@hint! Buntownicze [pops|l] będą dołączać do różnych [Concept('rebel_movements','ruchów buntowniczych')] zależnie od wielu czynników. Na przykład te pochodzące z dyskryminowanej [Concept('culture','kultury')|e] to potencjalni [nationalist_rebels_with_icon|el]."
 hint_rebels_growing_military: "„Mogą wyglądać groźnie, ale prości ludzie zazwyczaj więcej krzyczą niż robią. Jednak swoje braki dyscypliny nadrabiają liczebnością”."
 hint_rebels_growing_administrative: "„Chociaż buntownicy z pewnością szkodzą interesom, zazwyczaj są oni reakcjonistami – jeśli wyeliminujesz przyczyny ich niepokojów, nie tylko uda ci się ich uspokoić, ale także poprawić sytuację w naszym kraju”."
 hint_rebels_growing_diplomatic: "„Nasza ludność ma własną tożsamość i pojęcie lojalności. Podbite narody są znacznie bardziej skłonne do odłączenia się i utworzenia własnego rządu, a nawet do przyłączenia się do obcej potęgi”."
 ###
 hint_call_for_peace: "Wezwanie do pokoju"
 hint_call_for_peace_hint_text: "$hint_call_for_peace_hint_text_1$\n\n$hint_call_for_peace_hint_text_2$\n\n$hint_call_for_peace_hint_text_3$"
 hint_call_for_peace_hint_text_1: "Ten stan może wystąpić, jeśli dana [war_with_icon|el] trwa wystarczająco długo lub jeśli odmówimy podpisania [Concept('peace_treaty_with_icon','traktatu pokojowego')|e] pomimo całkowitego zwycięstwa lub porażki."
 hint_call_for_peace_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Powinniśmy ograniczyć straty i podpisać traktat, zanim nasze [war_exhaustion_with_icon|el] osiągnie krytyczny poziom.\n@arrow_bonus_tier_2! Może to oznaczać zaakceptowanie ustępstw oraz mniejszych zysków od zamierzonych, a nawet przegranie [Concept('war_with_icon','wojny')|e]."
 hint_call_for_peace_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Wszystko, co utraciliśmy w wyniku przedwczesnego zawarcia [Concept('peace_treaty_with_icon','pokoju')|e], możemy odzyskać w przyszłości w kolejnej [Concept('war_with_icon','wojnie')|e]."
 hint_call_for_peace_diplomatic: "„Łamanie zasad wojny może mieć naprawdę katastrofalne skutki dla naszej wewnętrznej stabilności i reputacji za granicą. Dlaczego ktokolwiek miałby słuchać tego, co mamy do powiedzenia, jeśli będziemy nierozsądni?”"
 hint_call_for_peace_military: "„Wojna jest jedynie kontynuacją polityki innymi środkami. Może powinniśmy zapisać tę sentencję, zanim zrobi to ktoś inny?”"
 hint_call_for_peace_administrative: "„Wezwania do pokoju będą stawały się coraz głośniejsze wraz z upływem czasu. Ludzi można udobruchać, ale nie można ich ignorować w nieskończoność”."
 ###
 hint_unprofitable_buildings: "Nierentowne budowle"
 hint_unprofitable_buildings_hint_text: "$hint_unprofitable_buildings_hint_text_1$\n\n$hint_unprofitable_buildings_hint_text_2$\n\n$hint_unprofitable_buildings_hint_text_3$"
 hint_unprofitable_buildings_hint_text_1: "Budowle staną się nierentowne, jeśli łączny koszt wykorzystywanych w nich [Concept('goods_with_icon','towarów')|e] przekroczy wartość [Concept('produced_goods_with_icon','wyrobów')|e]."
 hint_unprofitable_buildings_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Dopilnuj, by wykorzystywane towary były tańsze poprzez zwiększenie produkcji lub [Concept('importing_with_icon','importu')|e], aby zadbać o ich wystarczającą podaż.\n@arrow_bonus_tier_3! Stworzenie lub zabezpieczenie dodatkowego popytu na towary spowoduje wzrost ceny.\n@arrow_bonus_tier_3! [buildings_with_icon|e] można zamknąć @building_open!, a nawet zniszczyć, jeśli już ich nie potrzebujemy.\n@arrow_bonus_tier_3! [market_owner_with_icon|e] może nałożyć embargo na kraje produkujące towary eksportowe, aby podnieść ceny własnego eksportu."
 hint_unprofitable_buildings_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Niektóre budowle mogą otrzymać [Concept('subsidized_with_icon','subwencje')|e]. Taki krok bywa przydatny, jeśli na przykład koszty [Concept('import_with_icon','importu')|e] towarów niezbędnych do zaspokojenia [Concept('pop_needs_with_icon','potrzeb ludności')|e] lub utrzymania armii są wysokie."
 hint_unprofitable_buildings_diplomatic: "„Zarządzanie rentownością całego przemysłu kraju bywa trudne. Jeśli nie chcesz zajmować się szczegółami, możesz skorzystać z pomocy biurokratów!”"
 hint_unprofitable_buildings_military: "„Im silniejsi jesteśmy, tym większa jest nasza zdolność do stosowania protekcjonizmu – w rozsądnym zakresie. Embarga i spory handlowe są zawsze skuteczniejsze, gdy mają oparcie w siłach zbrojnych”."
 hint_unprofitable_buildings_administrative: "„Strategia manipulacji cenami ma wiele aspektów. Jeśli będziemy wystarczająco przebiegli, możemy nie tylko stworzyć popyt na rynku, ale także być tymi, którzy go zaspokoją”."
 NO_HINTS_AVAILABLE: "Brak dostępnych wskazówek!"
 hint_trade: "Handel"
 hint_trade_hint_text: "$hint_trade_hint_text_1$\n\n$hint_trade_hint_text_2$\n\n$hint_trade_hint_text_3$"
 hint_trade_hint_text_1: "[trade_with_icon|e] polega na przemieszczaniu [Concept('goods_with_icon','towarów')|e] pomiędzy [Concept('markets_with_icon','rynkami')|e], jak również kupowaniu i sprzedawaniu ich tam."
 hint_trade_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Stwórz nowe szlaki [Concept('trade_with_icon','handlowe')|e], by pozyskać [goods_with_icon|el].\n@arrow_bonus_tier_2! Zwiększ produkcję [Concept('goods_with_icon','towarów')|e], by handlować ich nadwyżką."
 hint_trade_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Szlak [Concept('trade_with_icon','handlowy')|e] może być rentowny bądź nieopłacalny w zależności od różnicy cen [Concept('export_with_icon','eksportu')|e] (ze źródła) i [Concept('import_with_icon','importu')|e] (do celu) na [Concept('markets_with_icon','rynkach')|e].\n@hint! Każdy [country_with_icon|e] obecny na [Concept('markets_with_icon','rynku')|e] ma ustaloną maksymalną [Concept('merchant_capacity_with_icon','wydajność handlową')|e], którą może wykorzystać do stworzenia szlaków [Concept('trade_with_icon','handlowych')|e], a [merchant_power_with_icon|el] określa priorytet eksportu [Concept('goods_with_icon','towarów')|e] szlakami [Concept('trade_with_icon','handlowymi')|e] w przypadku niedoboru.\n@hint! Handel może być domyślnie zautomatyzowany na każdym indywidualnym [Concept('market_with_icon','rynku')|e] po kliknięciu na odpowiednią zębatkę."
 hint_trade_military: "„Handel jest dla mięczaków. Niemniej, będziemy w stanie kontrolować przepływ towarów, dominując na lądzie i morzu”."
 hint_trade_administrative: "„Podstawą naszej strategii jest przewidywanie kolejnej fali zmian cen poprzez rzut kostką i obserwację gwiazd”."
 hint_trade_diplomatic: "„Handel, jeden z filarów w pełni rozwiniętego imperium, ma potencjał, by wypełniać nasze skarbce szybciej niż cokolwiek innego”."
 ### Unused Trade Capacity
 hint_unused_trade_capacity: "Niewykorzystana wydajność handlowa"
 hint_unused_trade_capacity_hint_text: "$hint_unused_trade_capacity_hint_text_1$\n\n$hint_unused_trade_capacity_hint_text_2$\n\n$hint_unused_trade_capacity_hint_text_3$"
 hint_unused_trade_capacity_hint_text_1: "[merchant_capacity_with_icon|e] jest wykorzystywana do przemieszczania [Concept('goods_with_icon','towarów')|e] pomiędzy [Concept('markets_with_icon','rynkami')|e] z nadzieją na zysk ze sprzedaży. Powinniśmy zawsze w pełni wykorzystywać naszą [Concept('merchant_capacity','wydajność handlową')|e]."
 hint_unused_trade_capacity_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_1! Kliknij powiadomienie, aby zobaczyć rynek, którego dotyczy, w @economy_panel![Link('trade', 'subtab = markets', 'panelu rynków')]. Stamtąd możesz przydzielić wydajność handlową do sugerowanych transakcji.\n@arrow_bonus_tier_1! Możesz też kliknąć nagłówek handlu, by przejść do odpowiedniego panelu, gdzie zobaczysz listę [Concept('goods_with_icon','towarów')|e] istotnych dla tego rynku. Kliknij przyciski importu/eksportu dla każdego z [Concept('good','towarów')], by rozpocząć wymianę handlową.\n@automation! Zalecamy automatyzację handlu na wszystkich rynkach poprzez naciśnięcie przycisku zębatki na karcie rynku. Zawsze możesz ręcznie tworzyć i blokować transakcje, nawet jeśli handel jest zautomatyzowany."
 hint_unused_trade_capacity_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Dochody z [Concept('trade','handlu')|e] są dzielone pomiędzy [estates_with_icon|el] (wlicza się do nich także [ShowEstateTypeName('crown_estate')|l]), zależnie od ich [Concept('estate_power_with_icon','wpływów')|e]."
 hint_unused_trade_capacity_military: "„Jeśli chodzi o możliwość nierozsądnego wykorzystania naszych zasobów, nie popieram tego pomysłu”."
 hint_unused_trade_capacity_administrative: "„Musimy jak najszybciej powrócić do granicy naszej efektywności”."
 hint_unused_trade_capacity_diplomatic: "„Niewykorzystaną wydajność handlową można porównać do ugoru, który już dawno powinien być obsiany”."
 ### Unprofitable Trade Route
 hint_unprofitable_trade_route: "Nierentowny szlak handlowy"
 hint_unprofitable_trade_route_hint_text: "$hint_unprofitable_trade_route_hint_text_1$\n\n$hint_unprofitable_trade_route_hint_text_2$\n\n$hint_unprofitable_trade_route_hint_text_3$"
 hint_unprofitable_trade_route_hint_text_1: "W większości przypadków, jeśli szlak [Concept('trade_with_icon','handlowy')|e] jest nierentowny, najlepiej jest go usunąć i zastąpić bardziej dochodową wymianą, lub włączyć automatyzację dla danego [Concept('market_with_icon','rynku')|e]."
 hint_unprofitable_trade_route_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_1! Czasem utrata pieniędzy ze szlaku [Concept('trade_with_icon','handlowego')|e] ma sens, jeśli transportowane [goods_with_icon|el] mają znaczenie strategiczne.\n@arrow_bonus_tier_1! Przykładem może być przewóz drewna potrzebnego do ukończenia [Concept('building_with_icon','budowli')|e]. Innym przykładem jest zapewnienie pożywienia naszej [Concept('pops_with_icon','ludności')|e]."
 hint_unprofitable_trade_route_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Możesz pośrednio wpłynąć na rentowność istniejącego szlaku [Concept('trade_with_icon','handlowego')|e], modyfikując ceny (a tym samym ich różnicę dla [Concept('good_with_icon','towarów')|e]) na [Concept('markets_with_icon','rynkach')|e] połączonych tym szlakiem. Możesz to zrobić, zmieniając [supply_with_icon|el] i [demand_with_icon|el] na [Concept('good_with_icon','towary')|e]."
 hint_unprofitable_trade_route_military: "„Może powinniśmy odebrać im towary, zamiast za nie płacić?”"
 hint_unprofitable_trade_route_administrative: "„Ogranicz straty tak szybko, jak to możliwe. Handel nie jest działalnością charytatywną”."
 hint_unprofitable_trade_route_diplomatic: "„Niedoskonałość to naturalne zjawisko i to do nas należy jej ograniczenie”."
 hint_market_out_of_supply: "Brak podaży na rynku"
 hint_market_out_of_supply_hint_text: "$hint_market_out_of_supply_hint_text_1$\n\n$hint_market_out_of_supply_hint_text_2$\n\n$hint_market_out_of_supply_hint_text_3$"
 hint_market_out_of_supply_hint_text_1: "Jeśli [market_with_icon|el] ma zbyt wysoki całkowity [demand_with_icon|el] w stosunku do ograniczonej [Concept('supply_with_icon','podaży')|e], możemy nie otrzymać [Concept('goods_with_icon','towarów')|e], które próbujemy [Concept('export_with_icon','eksportować')|e] lub [Concept('import_with_icon','importować')|e], co powoduje ich niedobór."
 hint_market_out_of_supply_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Możemy natychmiast zrezygnować z nierentownych szlaków [Concept('trade_with_icon','handlowych')|e] i wykorzystać wolną [Concept('merchant_capacity_with_icon','wydajność handlową')|e] na inne [goods_with_icon|el].\n@arrow_bonus_tier_1! Zwiększenie naszych [Concept('merchant_power_with_icon','wpływów handlowych')|e] na danym [Concept('market_with_icon','rynku')|e] może nam dać większy dostęp do jego towarów."
 hint_market_out_of_supply_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Możemy pozyskać [Concept('merchant_power_with_icon','wpływy handlowe')|e] z wielu źródeł, takich jak [advances_with_icon|el], [privileges_with_icon|el], [policies_with_icon|el] itd.\n@hint! Możemy również podjąć próbę zwiększenia [Concept('supply_with_icon','podaży')|e], ale nie będzie to łatwe w krótkim czasie i zazwyczaj wymaga długoterminowych działań strategicznych."
 hint_market_out_of_supply_military: "„Od czasu do czasu będzie brakować towarów eksportowych, napędzających naszą machinę wojenną. Trzeba szybko coś z tym zrobić”."
 hint_market_out_of_supply_administrative: "„Rozważ zwiększenie naszej całkowitej przewagi w uczciwym handlu za pomocą wszelkich dostępnych środków”."
 hint_market_out_of_supply_diplomatic: "„Być może powinniśmy zdywersyfikować naszą działalność handlową i odejść od monokultury”."
 hint_increasing_trade_capacity: "Zwiększanie wydajności handlowej"
 hint_increasing_trade_capacity_hint_text: "$hint_increasing_trade_capacity_hint_text_1$\n\n$hint_increasing_trade_capacity_hint_text_2$\n\n$hint_increasing_trade_capacity_hint_text_3$"
 hint_increasing_trade_capacity_hint_text_1: "[merchant_capacity_with_icon|e] określa liczbę [Concept('trade_with_icon','transakcji handlowych')|e], które może przeprowadzić [country_with_icon|el]."
 hint_increasing_trade_capacity_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Postaw więcej [Concept('buildings_with_icon','budowli')|e] zwiększających wydajność, takich jak [ShowBuildingTypeName('marketplace')|l] lub [ShowBuildingTypeName('market_village')|l].\n@arrow_bonus_tier_2! Niektóre [advances_with_icon|el] lub [laws_with_icon|el] również mogą zwiększyć [Concept('merchant_capacity_with_icon','wydajność handlową')|e]."
 hint_increasing_trade_capacity_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Większa [merchant_capacity_with_icon|el] umożliwia handel większą liczbą dóbr, co zwiększa [income_with_icon|el]."
 hint_increasing_trade_capacity_military: "„Wraz z rozrostem naszego imperium zwiększa się nasza wydajność handlowa. To w zasadzie tautologia”."
 hint_increasing_trade_capacity_administrative: "„Rozwiązaniem problemu wydajności handlowej, podobnie jak wszystkich problemów ludzkości, jest posiadanie większej liczby rynków”."
 hint_increasing_trade_capacity_diplomatic: "„Zapewnij wzrost przepływu handlu poprzez tworzenie podstaw dla wymiany handlowej wszędzie tam, gdzie to możliwe”."
 hint_increasing_trade_advantage: "$game_concept_merchant_power$"
 hint_increasing_trade_advantage_hint_text: "$hint_increasing_trade_advantage_hint_text_1$\n\n$hint_increasing_trade_advantage_hint_text_2$\n\n$hint_increasing_trade_advantage_hint_text_3$"
 hint_increasing_trade_advantage_hint_text_1: "[merchant_power_with_icon|e] określa, który [country_with_icon|el] ma dostęp do [Concept('goods_with_icon','towarów')|e] na [Concept('market_with_icon','rynku')|e] dla celów [Concept('trade_with_icon','handlowych')|e] w pierwszej kolejności.\n\nJeśli dwa handlujące [countries|l] próbują kupić [good|l], którego nie wystarcza dla obydwu, jako pierwszy kupi go posiadający większe [merchant_power|l] na tym [Concept('market','rynku')|e].\n\nZwróć uwagę, że [merchant_power|l] dotyczą tylko [Concept('trade','transakcji handlowych')]. [locations_with_icon|e] przy kupowaniu [Concept('goods','towarów')] na [constructions_with_icon|el] lub [pop_needs_with_icon|el] przestrzegają kolejności [Concept('market_access_with_icon','dostępu do rynku')|e]."
 hint_increasing_trade_advantage_hint_text_2: "#T Zalecane działania::#!\n@arrow_bonus_tier_3! Posiadaj więcej [Concept('locations_with_icon','lokacji')|e] należących do tego [Concept('market','rynku')|e].\n@arrow_bonus_tier_2! Zwiększ [Concept('maritime_presence_with_icon','obecność morską')|e] na wodach przybrzeżnych tego [Concept('market','rynku')|e].\n@arrow_bonus_tier_1! Niektóre [buildings_with_icon|el], takie jak [ShowBuildingTypeName('marketplace')|l], również zwiększają [merchant_power]."
 hint_increasing_trade_advantage_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! #italic By dowiedzieć się więcej, sprawdź podpowiedzi: [Link('hints', 'selected_hint = hint_trade', 'Handel')] oraz [Link('hints', 'selected_hint = hint_maritime', 'Obecność morska')]#!"
 hint_increasing_trade_advantage_military: "„Ponieważ handel jest przedsięwzięciem opartym raczej na konkurencji niż współpracy, uzyskanie przewagi w handlu jest naturalnym porządkiem rzeczy”."
 hint_increasing_trade_advantage_administrative: "„Podstawą naszej strategii jest przewidywanie kolejnej fali zmian cen poprzez rzut kostką i obserwację gwiazd”."
 hint_increasing_trade_advantage_diplomatic: "„Handel, jeden z filarów w pełni rozwiniętego imperium, ma potencjał, by wypełniać nasze skarbce szybciej niż cokolwiek innego”."
 ######## ALERT HINTS ########
 ### Pops demanding Goods
 hint_pops_with_needs_yellow: "Społeczność domaga się towarów"
 hint_pops_with_needs_yellow_hint_text: "$hint_pops_with_needs_yellow_hint_text_1$\n\n$hint_pops_with_needs_yellow_hint_text_2$\n\n$hint_pops_with_needs_yellow_hint_text_3$"
 hint_pops_with_needs_yellow_hint_text_1: "[pops_with_icon|e] będą próbować kupić [goods_with_icon|el], potrzebne do codziennego życia, na [Concept('market_with_icon','rynku')|e] w swojej [Concept('location_with_icon','lokacji')|e]. Jeśli [pops|l] nie będą w stanie kupić wszystkich potrzebnych [Concept('goods','towarów')], ich [pop_satisfaction_with_icon|el] odpowiednio spadnie. Jeśli ich [pop_satisfaction|l] spadnie poniżej [ShowModifierTypeName('pop_join_rebel_threshold')], niezależnie od tego, czy będzie to spowodowane brakiem [Concept('goods','towarów')], czy innymi przyczynami, [pops|l] mogą zacząć wspierać [Concept('rebellion_with_icon','rebelię')|e] przeciwko [Concept('government','rządowi')]."
 hint_pops_with_needs_yellow_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Utrzymuj [stability_with_icon|el], [legitimacy_with_icon|el] i [Concept('estate_satisfaction_with_icon','satysfakcję stanową')|e] na wysokim poziomie, by zapobiec [Concept('rebellions','rebeliom')|e].\n@arrow_bonus_tier_1! Zwiększ produkcję pożądanych [Concept('goods_with_icon','towarów')|e], budując [rgo_with_icon|el] i [buildings_with_icon|el] w panelu @production_panel![Link('goods_production', '', 'lateralview_goods_production_entry_name')].\n@arrow_bonus_tier_1! Importuj [goods|l] z innych [Concept('markets','rynków')], wykorzystując [Concept('merchant_capacity_with_icon','wydajność handlową')|e]."
 hint_pops_with_needs_yellow_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Niezaspokojone potrzeby [pops] nie muszą być powodem do niepokoju, o ile nie dochodzi do buntu. Jednak dają one ogólny obraz kondycji [Concept('market','rynku')|e].\n@hint! Potrzeby społeczności są tylko jednym z czynników wpływających na ich [Concept('pop_satisfaction','satysfakcję')]. Nawet jeśli wszystkie potrzeby ludzi zostałyby zaspokojone, nadal mogliby się zbuntować z innych powodów.\n@hint! Dowiedz się więcej o [Concept('rebel_movements_with_icon','ruchach buntowniczych')]: [Link('hints','selected_hint = hint_rebels_growing','podpowiedź dot. buntowników')]."
 hint_pops_with_needs_yellow_military: "„Potężny władca nie powinien przejmować się kaprysami biedoty”."
 hint_pops_with_needs_yellow_administrative: "„Tam, gdzie niewprawne oko widzi zubożałą ludność, ja dostrzegam wspaniałą okazję do zysku”."
 hint_pops_with_needs_yellow_diplomatic: "„Ludzie zawsze będą domagać się więcej, niż im się należy. Ale uważaj. Niekontrolowany niedobór może sprowokować twoich poddanych do buntu”."
 ### Rebelling Pops demanding Goods
 hint_pops_with_needs_red: "Zbuntowana społeczność domaga się towarów"
 hint_pops_with_needs_red_hint_text: "$hint_pops_with_needs_yellow_hint_text_1$\n\n$hint_pops_with_needs_red_hint_text_1$\n\n$hint_pops_with_needs_red_hint_text_2$\n\n$hint_pops_with_needs_red_hint_text_3$"
 hint_pops_with_needs_red_hint_text_1: "Niektóre z naszych [pops|l] dołączają obecnie do [Concept('rebel_movements','ruchów buntowniczych')]. Zwiększenie podaży wymaganych [Concept('goods','towarów')] może przekonać część ludzi do porzucenia [Concept('rebellions','buntowników')]."
 hint_pops_with_needs_red_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Zwiększ [stability_with_icon|el], [legitimacy_with_icon|el] i [Concept('estate_satisfaction_with_icon','satysfakcję stanową')|e].\n@arrow_bonus_tier_1! Zwiększ produkcję wymaganych [Concept('goods_with_icon','towarów')|e], budując [rgo_with_icon|el] oraz [buildings_with_icon|el] w panelu @production_panel! [Link('goods_production', '', 'lateralview_goods_production_entry_name')].\n@arrow_bonus_tier_1! Importuj [goods|l] z innych [Concept('markets','rynków')], wykorzystując [Concept('merchant_capacity_with_icon','wydajność handlową')|e].\n@arrow_bonus_tier_1! Jeśli wszystko inne zawiedzie, nasze [armies_with_icon|el] mogą rozprawić się z powstańcami."
 hint_pops_with_needs_red_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Potrzeby społeczności są tylko jednym z czynników wpływających na ich [Concept('pop_satisfaction','satysfakcję')]. Nawet jeśli wszystkie potrzeby ludzi zostałyby zaspokojone, nadal mogliby się zbuntować z innych powodów.\n@hint! Dowiedz się więcej o [Concept('rebel_movements_with_icon','ruchach buntowniczych')]: [Link('hints','selected_hint = hint_rebels_growing','podpowiedź dot. buntowników')]."
 hint_pops_with_needs_red_diplomatic: "„Zapewnienie dostaw towarów o krytycznym znaczeniu może wystarczyć, aby uciszyć niezadowolone głosy naszego ludu”."
 hint_pops_with_needs_red_administrative: "„Bunt zrujnowałby naszych kupców. Zwiększmy produkcję, zanim nasz lud postanowi chwycić za broń!”"
 hint_pops_with_needs_red_military: "„Głodujący tłum? Nasza armia się tym zajmie”."
 ### Possible Reforms
 hint_has_possible_reform: "Możliwe reformy"
 hint_has_possible_reform_hint_text: "$hint_has_possible_reform_hint_text_1$\n\n$hint_has_possible_reform_hint_text_2$\n\n$hint_has_possible_reform_hint_text_3$"
 hint_has_possible_reform_hint_text_1: "[government_reforms_with_icon|e] to jedne z najbardziej charakterystycznych cech, jakie wykazuje nasz [country_with_icon|e]. Powinniśmy zawsze mieć wdrożone wszelkie dostępne [reforms|l]."
 hint_has_possible_reform_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Wciśnij przycisk plusa pod kartą „[ShowEstateTypeName('crown_estate')|l]” w panelu@government_panel! [Link('government', 'tabcontent = estates', 'lateralview_government_entry_name')], aby wdrożyć nową [Concept('reform','reformę')]."
 hint_has_possible_reform_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! W miarę postępów w grze [advances_with_icon|el] i [events_with_icon|el] zapewnią dostępność kolejnych [Concept('government_reforms','reform rządowych')].\n@hint! Odwołanie [Concept('government_reforms','reform rządowych')] kosztuje [stability_with_icon|el], zaś ich wdrażanie zajmuje dużo czasu. Wybieraj je z rozwagą.\n@hint! Niektóre [government_reforms|l] wymagają, aby twój [country|l] zwrócił się ku konkretnej [Concept('societal_value_with_icon','wartości społecznej')|e]."
 hint_has_possible_reform_diplomatic: "„Dobrze sformowany rząd jest symbolem zdrowej administracji”."
 hint_has_possible_reform_administrative: "„Musimy jasno zdefiniować nasz rząd, aby inne kraje wiedziały, jakim mianem nas określać”."
 hint_has_possible_reform_military: "„Jak możemy się spodziewać, że zdołamy obronić się przed wrogiem, skoro nawet nie wiemy, kim właściwie jesteśmy?”"
 ### Non-integrated Provinces
 hint_has_conquered_provinces: "Niezintegrowane prowincje"
 hint_has_conquered_provinces_hint_text: "$hint_has_conquered_provinces_hint_text_1$\n\n$hint_has_conquered_provinces_hint_text_2$\n\n$hint_has_conquered_provinces_hint_text_3$"
 hint_has_conquered_provinces_hint_text_1: "[Concept('conquered_with_icon','Podbite')|e] [locations_with_icon|el] muszą zostać [Concept('integrated_with_icon','zintegrowane')|e] z naszą administracją, aby przyczyniały się do bogactwa naszego kraju. Powinniśmy możliwie najszybciej [Concept('integrate','zintegrować')|e] nasze [locations_with_icon|el]."
 hint_has_conquered_provinces_hint_text_2: "#T Zalecane działania#!:\n@arrow_bonus_tier_3! Poinstruuj [cabinet_with_icon|el], by wykonał działanie „[ShowCabinetActionName('integrate_province')]” w panelu @government_panel! [Link('government', 'tabcontent = cabinet', 'lateralview_government_entry_name')].\n@arrow_bonus_tier_1! Jeśli nasz [cabinet|l] nie nadąża za podbojami, rozważ stworzenie [Concept('subject_with_icon','poddanego')|el], aby zarządzał podbitą ziemią w twoim imieniu. Służy do tego @diplomacy_panel! [Link('diplomacy', 'relations_tab = current_relations', 'lateralview_diplomacy_entry_name')]."
 hint_has_conquered_provinces_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Integracja to zwykle jeden z najważniejszych obowiązków [Concept('cabinet_with_icon','gabinetu')|e] w [Concept('countries_with_icon','krajach')|e], które stawiają na ekspansję.\n@hint! [pop_satisfaction_with_icon|e] będzie o wiele niższa w [Concept('conquered','podbitych')] [Concept('locations','lokacjach')], co może skutkować [Concept('rebellions_with_icon','buntami')|e].\n@hint! Możesz przyspieszyć integrację, przydzielając bardziej uzdolnione [Concept('characters_with_icon','postacie')|e] jako [Concept('cabinet_members_with_icon','członków gabinetu')|e] oraz zwiększając [cabinet_efficiency_with_icon|el] naszego [Concept('country','kraju')].\n@hint! Integracja przebiegnie o wiele szybciej, jeśli nasza [primary_culture_with_icon|e] jest też [Concept('dominant_culture_with_icon','dominującą')|e] w danej lokacji lub jeśli nasz [cultural_influence_with_icon|el] znajduje się na wyższym poziomie niż [cultural_tradition_with_icon|el] [Concept('dominant_culture','kultury dominującej')]."
 hint_has_conquered_provinces_diplomatic: "„Nowo... #italic pozyskani#! poddani nie poddadzą się natychmiast naszej władzy. Integracja to długi i żmudny proces, który jest jednak kluczowy dla stabilności naszego państwa”."
 hint_has_conquered_provinces_administrative: "„Przedsiębiorstwa nie mogą rozkwitać, kiedy w kraju panuje niepokój. Rządy prawa są podstawą dobrobytu”."
 hint_has_conquered_provinces_military: "„Biurokraci nie zawsze są nieprzydatni. Nie moglibyśmy przeprowadzać poboru wśród ludności, gdyby nie odpowiednia kadra administratorów”."
 ### Possible Cabinet Actions
 hint_has_possible_cabinet_action: "Możliwe działania gabinetu"
 hint_has_possible_cabinet_action_hint_text: "$hint_has_possible_cabinet_action_hint_text_1$\n\n$hint_has_possible_cabinet_action_hint_text_2$\n\n$hint_has_possible_cabinet_action_hint_text_3$"
 hint_has_possible_cabinet_action_hint_text_1: "[cabinet_actions_with_icon|e] to jedne z najpotężniejszych narzędzi, jakimi dysponujemy podczas władania naszym narodem. Powinniśmy w każdej chwili wykorzystywać wszystkie dostępne [cabinet_seats_with_icon|el]."
 hint_has_possible_cabinet_action_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Otwórz @government_panel![Link('government', 'tabcontent = cabinet', 'lateralview_government_entry_name')], aby zobaczyć dostępne dla nas działania gabinetu.\n@arrow_bonus_tier_3! [ShowCabinetActionName('integrate_province')], jeśli mamy nowo [Concept('conquered_with_icon','podbite')|e] terytorium.\n@arrow_bonus_tier_2! [ShowCabinetActionName('stabilize_country')], jeśli [stability_with_icon|el] jest niska.\n@arrow_bonus_tier_2! [ShowCabinetActionName('strengthen_government')], jeśli [legitimacy_with_icon|e] jest niska.\n@arrow_bonus_tier_2! [ShowCabinetActionName('diplomatic_endeavors')] ułatwią [Concept('diplomacy_with_icon','dyplomację')|e].\n@arrow_bonus_tier_1! [ShowCabinetActionName('change_societal_values')] przydaje się, jeśli jest jakaś konkretna [societal_value_with_icon|el], na której ci zależy.\n@arrow_bonus_tier_1! [ShowCabinetActionName('develop_province')] pozwoli zwiększyć [development_with_icon|el] w naszych najcenniejszych [Concept('provinces_with_icon','prowincjach')|e].\n@arrow_bonus_tier_1! [cabinet_actions] mogą zostać również użyte do [Concept('convert_with_icon','nawracania')|e] innych [Concept('religions_with_icon','religii')|e] lub [Concept('assimilate_with_icon','asymilacji')|e] innych [Concept('cultures_with_icon','kultur')|e].\n@automation! Możesz też zautomatyzować działania rady: @automation![Link('automation', '', 'lateralview_automation_entry_name')]."
 hint_has_possible_cabinet_action_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! [characters_with_icon|e] przydzielone do [Concept('cabinet_with_icon','gabinetu')|e] zwiększą [Concept('estate_power_with_icon','wpływy')|e] swojego [Concept('estate_with_icon','stanu')|e].\n@hint! Nowe [cabinet_actions|l] staną się dostępne w późniejszych [Concept('ages_with_icon','epokach')|e]."
 hint_has_possible_cabinet_action_diplomatic: "„Biurokracja jest fundamentem każdego państwa. O ile mądrze się ją wykorzysta”."
 hint_has_possible_cabinet_action_administrative: "„Dzięki gabinetowi państwo ma szanse zmieniać pustkowia w kwitnące metropolie”."
 hint_has_possible_cabinet_action_military: "„Potężny gabinet pozwoli okiełznać nawet najbardziej swarliwych członków naszego społeczeństwa.\nRzuć tylko rozkaz, a będzie zrobione”."
 ### Laws not codified
 hint_has_possible_law: "Prawa nieskodyfikowane"
 hint_has_possible_law_hint_text: "$hint_has_possible_law_hint_text_1$\n\n$hint_has_possible_law_hint_text_2$\n\n$hint_has_possible_law_hint_text_3$"
 hint_has_possible_law_hint_text_1: "Warto zawsze mieć aktywną [Concept('policy_with_icon','politykę')|e] dla każdego z naszych [Concept('laws_with_icon','praw')|e]. W innym wypadku [country_with_icon|el] może nie mieć dostępu do przydatnych benefitów."
 hint_has_possible_law_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Kliknij alert, aby przełączyć się pomiędzy [Concept('laws','prawami')] bez aktywnej [Concept('policy','polityki')] i uważnie wybrać jedną z nich.\n@arrow_bonus_tier_3! @government_panel! [Link('government','tabcontent = politics','lateralview_government_entry_name')] to miejsce, w którym zobaczysz obecne [laws|l].\n@automation! Możesz też zautomatyzować prawa tutaj: @automation! [Link('automation','','lateralview_automation_entry_name')]."
 hint_has_possible_law_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! [policies] mają czas implementacji zależny od naszej [Concept('legislative_efficiency_with_icon','wydajności legislatywy')|e]. Ich pełen efekt nie będzie aktywny natychmiast.\n@hint! Możesz zawsze zmienić [Concept('policy','politykę')] później, wydając na to [gold_with_icon|el] i [stability_with_icon|el]. Koszt będzie zależeć od [Concept('crown_power_with_icon','wpływów korony')|e].\n@hint! Wiele nowych [Concept('laws', 'praw')] oraz [Concept('policies', 'polityk')] odblokowuje się w późniejszych [Concept('ages_with_icon','epokach')|e]."
 hint_has_possible_law_diplomatic: "„Państwo bez praw jest jak budynek bez kolumn lub ciało bez kończyn. Lepiej mieć ich zbyt wiele niż zbyt mało”."
 hint_has_possible_law_administrative: "„Prawa naszego kraju powinny zapewniać rozwój miast, ochronę kupców i wydajne ściąganie podatków”."
 hint_has_possible_law_military: "„Formułowanie praw jest ważne. Ich egzekwowanie – kluczowe”."
 ### Lack of commander
 hint_has_army_without_leader: "Brak dowódcy"
 hint_has_army_without_leader_hint_text: "$hint_has_army_without_leader_hint_text_1$\n\n$hint_has_army_without_leader_hint_text_2$\n\n$hint_has_army_without_leader_hint_text_3$"
 hint_has_army_without_leader_hint_text_1: "Nasze [units_with_icon|el] muszą mieć wyznaczonego [Concept('commander_with_icon','dowódcę')|e], aby radzić sobie w [Concept('battle_with_icon','bitwie')|e]. [generals_with_icon|e] dowodzą [Concept('armies','armiami')], zaś [admirals|l] [Concept('navies','flotami')|e]."
 hint_has_army_without_leader_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Kliknij #W alert#!, aby wybrać odpowiednią [character_with_icon|el] dla swojej [Concept('unit','jednostki')]. Należy generalnie wybierać tych, którzy mają wyższe [abilities_with_icon|el].\n@arrow_bonus_tier_2! Możesz też wybrać swoją [Concept('unit','jednostkę')] z mapy lub #W zarysu#!.\n@arrow_bonus_tier_2! Jeśli nie mamy żadnej dobrej dostępnej [Concept('character','postaci')], spróbuj ją wyszkolić (@military_panel! [Link('unit_overview', '', 'lateralview_unit_overview_entry_name')]).\n@automation! Możesz zautomatyzować wyznaczanie [Concept('generals','generałów')] i [Concept('admirals', 'admirałów')] tutaj: @automation! [Link('automation', '', 'lateralview_automation_entry_name')]."
 hint_has_army_without_leader_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Nie rozpoczynaj [Concept('battle','bitwy')] bez posiadania na czele wojsk zdolnego [Concept('commander_with_icon','dowódcy')|e]!\n@hint! Niektóre [characters_with_icon|el] mają [traits_with_icon|el], które czynią je jeszcze bardziej przydatnymi do konkretnych zadań.\n@hint! Niektóre [Concept('laws_with_icon','prawa')|e] mogą nakładać ograniczenia na to, które [characters_with_icon|el] mogą dowodzić armiami."
 hint_has_army_without_leader_diplomatic: "„Armia zawsze powinna mieć przywódcę. Musimy jednak zachować ostrożność, gdyż oficerowie wykorzystają swoje wpływy, aby poprawić sytuację swojego stanu”."
 hint_has_army_without_leader_administrative: "„Mnie proszę nie pytać. Godne oprychów sprawy wojny pozostawiam mniej... #italic wyrafinowanym#! doradcom”."
 hint_has_army_without_leader_military: "„Atak na wroga bez odpowiednich dowódców jest samobójstwem.\nNie rób tego pod żadnym pozorem”."
 ### Underage Heir
 hint_is_heir_underage: "Niepełnoletni dziedzic"
 hint_is_heir_underage_hint_text: "$hint_is_heir_underage_hint_text_1$\n\n$hint_is_heir_underage_hint_text_2$"
 hint_is_heir_underage_hint_text_1: "Jeśli nasz [ruler_with_icon|el] umrze, zanim [heir_with_icon|el] osiągnie pełnoletniość, w naszym kraju nastanie [regency_with_icon|el]. Zależnie od okoliczności, osoba z najpotężniejszego [Concept('estate_with_icon','stanu')|e] przejmie kontrolę nad rządem, znacząco zwiększając jego [Concept('estate_power_with_icon','wpływy stanowe')|e] na czas interregnum."
 hint_is_heir_underage_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_1! Niewiele więcej można zrobić poza pozwoleniem na upływ czasu i być może unikania ryzykowania życiem [Concept('ruler','osoby rządzącej')] bez potrzeby. O ile oczywiście nie okaże się akurat wyjątkowo niekompetentna..."
 hint_is_heir_underage_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! [regency_with_icon|e] może wcale nie być zła, jeśli sprawuje ją naprawdę dobra [character_with_icon|el]."
 hint_is_heir_underage_diplomatic: "„Zapewnienie sukcesji to zapewnienie przyszłości państwu”."
 hint_is_heir_underage_administrative: "„Mariaże i więzi dynastyczne są najlepszym sposobem na zbliżenie do siebie dwóch państw”."
 hint_is_heir_underage_military: "„To właśnie za młodu można przekuć dziedziców na najlepszych władców”."
 ### Unmarried Ruler
 hint_has_unmarried_adult_ruler: "Głowa państwa bez ślubu"
 hint_has_unmarried_adult_ruler_hint_text: "$hint_has_unmarried_adult_ruler_hint_text_1$\n\n$hint_has_unmarried_adult_ruler_hint_text_2$\n\n$hint_has_unmarried_adult_ruler_hint_text_3$"
 hint_has_unmarried_adult_ruler_hint_text_1: "Powinniśmy spróbować doprowadzić do ślubu [Concept('ruler_with_icon','głowy państwa')|e] z odpowiednią osobą, aby zwiększyć rozmiary oraz potęgę naszej [Concept('dynasty_with_icon','dynastii')|e]. Nie dość, że liczne królewskie potomstwo ułatwi pokojową i stabilną sukcesję, to dodatkowo książęta mogą stanowić cenną rezerwę [Concept('characters_with_icon','postaci')|e] dostępnych do obsadzenia urzędów."
 hint_has_unmarried_adult_ruler_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Kliknij alert, aby wyszukać kandydatów do [Concept('royal_marriage_with_icon','małżeństwa królewskiego')|e]. Monarchie mogą je zawierać w celu poprawiania wzajemnej [Concept('opinion','opinii')] i kłaść w ten sposób podwaliny pod przyszły [Concept('alliance_with_icon','sojusz')|e]. [royal_marriages_with_icon|e] mogą również otworzyć drzwi do potencjalnej [Concept('personal_union_with_icon','unii personalnej')|e].\n@arrow_bonus_tier_2! Możesz wydać [Concept('ruler','głowę państwa')] lub [Concept('heir','dziedzica')] za [character_with_icon|el] na swoim dworze za pomocą działania „[ShowCharacterInteractionName('marry_noble')|l]”, klikając prawym przyciskiem portret postaci.\n@arrow_bonus_tier_1! W razie braku alternatyw zawsze pozostaje opcja „[ShowCharacterInteractionName('marry_lowborn')]”, jak bardzo nie byłaby niepopularna."
 hint_has_unmarried_adult_ruler_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! [characters] z władającej [Concept('dynasty','dynastii')] to [ShowEstateTypeName('crown_estate')|l], więc nie zwiększają możliwości innych [Concept('estates_with_icon','stanów')|e] naszego państwa, kiedy obejmują wpływowe [roles_with_icon|el]."
 hint_has_unmarried_adult_ruler_diplomatic: "„$hint_is_heir_underage_diplomatic$”"
 hint_has_unmarried_adult_ruler_administrative: "„$hint_is_heir_underage_administrative$”"
 hint_has_unmarried_adult_ruler_military: "„Każdy miecz potrzebuje pochwy”."
 ### No current Research
 hint_can_do_more_research: "Badania"
 hint_can_do_more_research_hint_text: "$hint_can_do_more_research_hint_text_1$\n\n$hint_can_do_more_research_hint_text_2$\n\n$hint_can_do_more_research_hint_text_3$"
 hint_can_do_more_research_hint_text_1: "Powinniśmy zadbać, aby nasz [country_with_icon|el] stale badał nowe [advances_with_icon|el]."
 hint_can_do_more_research_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3!Przejdź do okna @advances_panel! [Link('advances', 'subtab = research', 'lateralview_advances_entry_name')] i wybierz postęp, który pasuje do twoich potrzeb.\n@arrow_bonus_tier_2! Możesz też kliknąć ikonkę pustej flaszki w prawej górnej części ekranu, aby otworzyć okno @advances_panel! [Link('technology_view', '', 'lateralview_technology_view_entry_name')] w całości.\n@automation! Jeśli nie czujesz się jeszcze na siłach, żeby wybierać [advances], możesz zautomatyzować badania: @automation! [Link('automation', '', 'lateralview_automation_entry_name')]. Nadal otrzymasz powiadomienie za każdym razem, kiedy odkryty zostanie nowy [advance_with_icon|el]."
 hint_can_do_more_research_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Niewykorzystane punkty badań będą do pewnej liczby magazynowane. Później zaczną przepadać.\n@hint! Możesz zwiększyć szybkość [Concept('research_progress_with_icon','postępów badań')|e], zwiększając przeciętną [literacy_with_icon|el] oraz [Concept('estate_satisfaction_with_icon','satysfakcję stanową')|e], jaką wykazują nasi [ShowEstateTypeName('clergy_estate')|l]."
 hint_can_do_more_research_diplomatic: "„Technologia zapewnia liczne możliwości ułatwienia zarządzania naszymi ziemiami”."
 hint_can_do_more_research_administrative: "„Odpowiednie inwestycje mogą znacząco zwiększyć wydajność naszej gospodarki”."
 hint_can_do_more_research_military: "„Stałe usprawnianie armii zawodowych to rzecz kluczowa, jeśli nie chcemy, aby wrogowie wyprzedzili nas w potędze”."
 ### Cabinet lacks member
 hint_lack_cabinet_for_cabinet_action: "Wakat w gabinecie"
 hint_lack_cabinet_for_cabinet_action_hint_text: "$hint_lack_cabinet_for_cabinet_action_hint_text_1$\n\n$hint_lack_cabinet_for_cabinet_action_hint_text_2$\n\n$hint_lack_cabinet_for_cabinet_action_hint_text_3$"
 hint_lack_cabinet_for_cabinet_action_hint_text_1: "[cabinet_action_with_icon|e] nie będzie bardzo skuteczne, jeśli nie zostanie przydzielona utalentowana [character_with_icon|el]. Zawsze przydzielaj [characters|l] do wszystkich [Concept('cabinet_seats_with_icon','miejsc w gabinecie')|e]."
 hint_lack_cabinet_for_cabinet_action_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Kliknij #W alert#!, aby otworzyć okno „@government_panel![Link('government', 'tabcontent = cabinet', 'lateralview_government_entry_name')]” i wyznaczyć [character_with_icon|el] o najwyższej powiązanej [Concept('ability_with_icon','umiejętności')|e] do zajęcia wolnego [Concept('cabinet_seat','miejsca w gabinecie')].\n@arrow_bonus_tier_1! Rozważ zatrudnienie nowego [Concept('courtier_with_icon','dworzanina')|e], jeśli nie masz dostępnych dobrych [Concept('character','postaci')].\n@automation! Możesz zautomatyzować działania gabinetu tutaj: @automation! [Link('automation', '', 'lateralview_automation_entry_name')]."
 hint_lack_cabinet_for_cabinet_action_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Każde [cabinet_action_with_icon|el] wykorzystuje [abilities_with_icon|el] jednej z trzech postaci, więc musisz uważnie ją wybrać zależnie od tego, jakie zadanie planujesz jej przydzielić.\n@hint! [cabinet_members_with_icon|e] zwiększają [Concept('estate_power_with_icon','wpływy')|e] [Concept('estate_with_icon','stanowe')|e], do którego należą."
 hint_lack_cabinet_for_cabinet_action_diplomatic: "„Najlepsza administracja zawsze składa się z najlepszych ludzi”."
 hint_lack_cabinet_for_cabinet_action_administrative: "„Im lepiej funkcjonuje nasz kraj, tym lepszy będzie nasz wizerunek”."
 hint_lack_cabinet_for_cabinet_action_military: "„Tylko wydajna administracja pozwoli na skuteczną projekcję siły”."
 ### Inflation
 hint_inflation: "Inflacja"
 hint_inflation_hint_text: "$hint_inflation_hint_text_1$\n\n$hint_inflation_hint_text_2$"
 hint_inflation_hint_text_1: "Inflacja zwiększa po prostu wszystkie wydatki naszego [Concept('country_with_icon','kraju')|e], więc zawsze należy jej unikać. Stosunkowo szybko dochodzi do niej wskutek [Concept('minting_with_icon','bicia monet')|e], jednak może być podstępna i trudna do obniżenia."
 hint_inflation_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Jeśli [inflation|l] rośnie, użyj suwaka [Concept('minting','bicia monet')] w panelu @economy_panel! [Link('economy', '', 'lateralview_economy_entry_name')], aby temu zapobiec.\n@arrow_bonus_tier_2! Jeśli już zmagasz się z inflacją, ustawienie suwaka na minimum spowoduje jej spadek."
 hint_inflation_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Możemy zdobyć inne źródła redukcji inflacji, na przykład dzięki [Concept('advances_with_icon','postępom')|e]."
 hint_inflation_diplomatic: "„Oby oszczędzono nam tej niewidzialnej choroby gospodarki”."
 hint_inflation_administrative: "„Bicie monet może i jest kuszącym lekiem dla napiętego budżetu, ale stanowi także źródło przedłużającego się nieszczęścia”."
 hint_inflation_military: "„Inflacja to powolny i zdradziecki zabójca”."
 ### Disloyal Subjects
 hint_has_disloyal_subjects: "Nielojalni poddani"
 hint_has_disloyal_subjects_hint_text: "$hint_has_disloyal_subjects_hint_text_1$\n\n$hint_has_disloyal_subjects_hint_text_2$\n\n$hint_has_disloyal_subjects_hint_text_3$"
 hint_has_disloyal_subjects_hint_text_1: "[subjects_with_icon|e] to [countries_with_icon|el], które są nam podporządkowane w ten czy w inny sposób. Zwykle płacą nam [Concept('subject_taxation_with_icon','podatek')|e] oraz biorą udział w naszych [Concept('wars_with_icon','wojnach')|e].\n\nJeśli ich [Concept('subject_loyalty_with_icon','lojalność')|e] spadnie poniżej #W 50#!, zostaną uznane za nielojalne i przestaną nam pomagać w [Concept('wars','wojnach')]. Nasi nielojalni poddani mogą połączyć siły i stworzyć [GetInternationalOrganizationType('independence_movement').GetName]. Jeśli zaś poczują się wystarczająco silni, są w stanie nawet rozpocząć z nami [Concept('war','wojnę')]."
 hint_has_disloyal_subjects_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Zadbaj, aby [opinion_with_icon|el] poddanego o nas pozostała wysoka. Możesz ją zwiększyć, korzystając z [Concept('diplomatic_action_with_icon', 'działania dyplomatycznego')|e] „$IMPROVE_RELATIONTITLE$”.\n@arrow_bonus_tier_1! Możesz rozważyć [Concept('annexing_with_icon','aneksję')|e] innych lojalnych poddanych. Zwiększenie naszej potęgi w stosunku do wszystkich podporządkowanych nam państw doprowadzi do wzrostu ich lojalności.\n@arrow_bonus_tier_1! Zwiększenie rozmiaru naszych [Concept('armies_with_icon','armii')|e] przestraszy poddanych i zwiększy ich lojalność."
 hint_has_disloyal_subjects_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Możesz sprawdzić ogólne informacje o poddanych w ich panelu, który znajdziesz tutaj: @diplomacy_panel! [Link('diplomacy', 'relations_tab = current_relations', 'lateralview_diplomacy_entry_name')].\n@hint! Im więcej mamy [Concept('subjects','poddanych')] i im potężniejsi są w stosunku do nas, tym trudniejsze będzie zapewnienie ich [Concept('subject_loyalty', 'lojalności')].\n@hint! Różne rodzaje [Concept('subjects','poddanych')] mają różne charakterystyki oraz ograniczenia." ##
 hint_has_disloyal_subjects_diplomatic: "„Powinniśmy stale dbać o dobre stosunki z naszymi poddanymi. Inaczej gotowi są uznać się za panów własnego losu”."
 hint_has_disloyal_subjects_administrative: "„Podwładni to zyskowna dla naszego skarbca rzecz.\nNie pozwól, żeby zdali sobie z tego sprawę”."
 hint_has_disloyal_subjects_military: "„Owieczki odłączają się od stada przy byle okazji. Lepiej zawsze bądźmy gotowi spuścić psy gończe!”"
 ### Imminent independence war
 hint_has_imminent_independence_war: "Nieuchronna wojna o niepodległość"
 hint_has_imminent_independence_war_hint_text: "$hint_has_imminent_independence_war_hint_text_1$\n\n$hint_has_imminent_independence_war_hint_text_2$"
 hint_has_imminent_independence_war_hint_text_1: "Co najmniej jeden z naszych [Concept('subjects_with_icon','poddanych')|e] przewodzi ruchowi [GetInternationalOrganizationType('independence_movement').GetName], którego szacowane szanse zwycięstwa w [Concept('war','wojnie')|e] przeciwko nam osiągnęły próg, w którym [AI] może w dowolnej chwili ogłosić wojnę o niepodległość."
 hint_has_imminent_independence_war_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Wystaw dodatkowe [armies_with_icon|el], by sprowadzić szacowane szanse zwycięstwa poniżej progu.\n@arrow_bonus_tier_3! Rozważ atak wyprzedzający z [casus_belli_with_icon|el] [ShowCasusBelliName('cb_disloyal_subject')], by rozmontować ruch, zanim zacznie się wojna.\n@arrow_bonus_tier_1! Popraw [subject_loyalty_with_icon|el] członków ruchu, by opuścili [Concept('international_organization_with_icon','organizację międzynarodową')|e]."
 ### Buildings missing inputs
 hint_has_buildings_missing_input: "Brakujące materiały w budowlach"
 hint_has_buildings_missing_input_hint_text: "$hint_has_buildings_missing_input_hint_text_1$\n\n$hint_has_buildings_missing_input_hint_text_2$\n\n$hint_has_buildings_missing_input_hint_text_3$"
 hint_has_buildings_missing_input_hint_text_1: "[buildings_with_icon|e] potrzebują do prawidłowego działania dostępu do [Concept('goods_with_icon','towarów')|e] z [Concept('markets','rynków')]. Jeśli nie są w stanie kupić wszystkich potrzebnych [Concept('goods','towarów')], odpowiednio zmniejszy się ich wydajność."
 hint_has_buildings_missing_input_hint_text_2: "#T Zalecane działania:#!\n$hint_address_shortage_text$"
 hint_has_buildings_missing_input_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Nie wszystkie braki materiałów stanowią dla naszego kraju problem krytycznej natury, jednak warto zadbać o właściwe funkcjonowanie niektórych szczególnie ważnych strategicznie łańcuchów produkcyjnych.\n@hint![ShowUnitDefinitionName('a_footmen')] mogą na przykład nie być dostępni do werbunku, jeśli nasza [ShowBuildingTypeName('weapon_guild')|l] nie zostanie odpowiednio zaopatrzona w [ShowGoodsName('lumber')|l] na [Concept('market','rynku')|e]."
 hint_has_buildings_missing_input_diplomatic: "„Niektóre budynki są szczególnie ważne dla prawidłowego funkcjonowania naszego państwa”."
 hint_has_buildings_missing_input_administrative: "„Nasi kupcy powinni starać się zwalczać wszelkie niedobory. Czasem jednak niewidzialna ręka rynku wymaga... odrobiny pomocy”."
 hint_has_buildings_missing_input_military: "„Zanim rozpoczniemy jakąkolwiek operację wojskową, musimy zadbać o stałe zaopatrzenie w broń i inne zapasy”."
 hint_address_shortage_text: "Kliknięcie #W alertu#! wyświetli okno „@production_panel! [Link('goods_production', '', 'lateralview_goods_production_entry_name')]” z odfiltrowanymi brakującymi [Concept('goods','towarami')] na stosownym [Concept('market','rynku')].\nMożesz zwiększyć [Concept('supply_with_icon','podaż')|e] [Concept('good_with_icon','towaru')|e] na [Concept('markets_with_icon','rynkach')|e] na trzy kluczowe sposoby:\n\n@arrow_bonus_tier_3! Kliknij przycisk @rgo! [Concept('rgo','operacji pozyskiwania surowców')|e], aby zobaczyć listę [Concept('locations','lokacji')] na tym [Concept('market','rynku')], które pozyskują stosowny surowiec. Pamiętaj, że [raw_materials_with_icon|el] można pozyskiwać tylko tam.\n@arrow_bonus_tier_2! Kliknij przycisk @building! [Concept('building','budowli')|e], aby zobaczyć listę tych, które są dostępne i które mogą wytwarzać określony [good|l].\n@arrow_bonus_tier_2! Kliknij przycisk @import! [Concept('import','importu')|e], aby importować [good|l] z innego rynku, wykorzystując [Concept('merchant_capacity_with_icon','wydajność handlową')|e].\n@automation! Możesz zautomatyzować konstrukcję [Concept('buildings','budowli')] i [Concept('rgo','operacji pozyskiwania surowców')|e], a także [trade_with_icon|el], w oknie „@automation![Link('automation', '', 'lateralview_automation_entry_name')]”."
 ### Construction missing input
 hint_has_constructions_missing_input: "Brakujące materiały w konstrukcji"
 hint_has_constructions_missing_input_hint_text: "$hint_has_constructions_missing_input_hint_text_1$\n\n$hint_has_constructions_missing_input_hint_text_2$\n\n$hint_has_constructions_missing_input_hint_text_3$"
 hint_has_constructions_missing_input_hint_text_1: "Wszelkie [constructions_with_icon|el] potrzebują dostępu do określonych [Concept('goods_with_icon','towarów')|e] z [Concept('market_with_icon','rynku')|e] danej [Concept('location_with_icon','lokacji')|e]. Jeśli [Concept('goods','towarów')] jest za mało, [construction|l] ulegnie przerwaniu."
 hint_has_constructions_missing_input_hint_text_2: "#T Zalecane działania:#!\n$hint_address_shortage_text$"
 hint_has_constructions_missing_input_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Wszystkie [locations|l] danego [Concept('market','rynku')] uzyskują dostęp do potrzebnych im [Concept('goods','towarów')] w kolejności [Concept('market_access_with_icon','dostępu do rynku')|e] niezależnie od tego, kto je pierwotnie wytworzył.\n@hint! Oznacza to, że [locations|l] będące bliżej [Concept('market_centers_with_icon','ośrodków handlowych')|e] mają łatwiejszy dostęp do potrzebnych im towarów."
 hint_has_constructions_missing_input_diplomatic: "„Dokładna kontrola nad wszelkimi zasobami i potrzebami jest kluczowa dla każdego przedsięwzięcia”."
 hint_has_constructions_missing_input_administrative: "„Dyplomacja i handel zapewnią nam wszystko, czego nie jesteśmy w stanie wyprodukować sami”."
 hint_has_constructions_missing_input_military: "„Musimy być w stanie zaspokajać wszelkie zapotrzebowanie na zaopatrzenie, jeśli nie chcemy, aby inni wykorzystali nasze słabości”."
 ### Construction missing input
 hint_lack_pop_promotion_to_fill_buildings: "Budowle lub [rgo|l] nie mają pracowników"
 hint_lack_pop_promotion_to_fill_buildings_hint_text: "$hint_lack_pop_promotion_to_fill_buildings_hint_text_1$\n\n$hint_lack_pop_promotion_to_fill_buildings_hint_text_2$\n\n$hint_lack_pop_promotion_to_fill_buildings_hint_text_3$"
 hint_lack_pop_promotion_to_fill_buildings_hint_text_1: "Różne [buildings_with_icon|el] zatrudniają inne [pop_types_with_icon|el]. Jeśli jest za mało dostępnych niezatrudnionych [Concept('pops_with_icon','społeczności')|e] danego [Concept('pop_type','typu społeczności')], gdy [building|l] zostanie ukończona, [ShowPopTypeName('peasants')|l] zaczną być [Concept('promote_with_icon','awansowani')|e] w tempie, jakie zapewnia [ShowModifierTypeName('local_pop_promotion_speed')|l] danej [Concept('location_with_icon','lokacji')|e].\n\nBudynki mogą też tracić pracowników, kiedy [Concept('pops','ludność')] wymiera wskutek [Concept('diseases_with_icon','chorób')|e], [Concept('sieges_with_icon','oblężeń')|e] lub [Concept('starvation_with_icon','głodu')|e]."
 hint_lack_pop_promotion_to_fill_buildings_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Nie buduj w [Concept('locations','lokacjach')|e], w których brakuje już zbyt wielu pracowników.\n@arrow_bonus_tier_2! Zwiększ ważne źródła tempa awansów w [Concept('locations','lokacji')|e]: [stability_with_icon|el], [Concept('literacy_with_icon','piśmienność')|e] i [Concept('control_with_icon','kontrolę')|e].\n@arrow_bonus_tier_1! [ShowBuildingTypeName('library')] i [ShowBuildingTypeName('university')|l] w najważniejszych [Concept('locations','lokacjach')] będą bardzo pomocne.\n@arrow_bonus_tier_1! Rozważ zniszczenie mniej przydatnych [Concept('buildings','budowli')|e] w celu zwolnienia nieco siły roboczej."
 hint_lack_pop_promotion_to_fill_buildings_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! [urban_locations_with_icon|e] mają wyższą bazową liczbę dostępnych [pops|l] [Concept('upper_class_with_icon','klasy wyższej')|e].\n@hint! Pamiętaj, że w [Concept('location','lokacji')] muszą być [Concept('available_with_icon','dostępni')|e] [ShowPopTypeName('peasants')|l], aby mogło dojść do [Concept('promotion','awansu')].\n@hint! Możesz sprawdzić, jaka jest [ShowModifierTypeName('local_pop_promotion_speed')|l] w danej [Concept('location','lokacji')] w #W zakładce demografii#! w #W panelu lokacji#!."
 hint_lack_pop_promotion_to_fill_buildings_diplomatic: "„Czymże jest przemysł, jeśli nie ma komu w nim pracować?”"
 hint_lack_pop_promotion_to_fill_buildings_administrative: "„Jeśli nasi ludzie nie będą pracować, inne kraje mogą uznać nas za leni”."
 hint_lack_pop_promotion_to_fill_buildings_military: "„Obowiązkiem ludności jest pracować i zaspokajać potrzeby kraju”."
 ### Casus Belli
 hint_casus_belli: "Casus belli"
 hint_casus_belli_hint_text: "$hint_casus_belli_hint_text_1$\n\n$hint_casus_belli_hint_text_2$\n\n$hint_casus_belli_hint_text_3$"
 hint_casus_belli_hint_text_1: "[casus_belli_with_icon|e] to stosowny powód do rozpoczęcia [Concept('war_with_icon','wojny')|e]. Można ją wszcząć również bez odpowiedniego casus belli, lecz wtedy trudniejsze będzie wymuszenie spełnienia naszych żądań w ramach [Concept('peace_treaty_with_icon','traktatu pokojowego')|e], a sąsiedzi zareagują na podejmowane przez nas działania z większą wrogością."
 hint_casus_belli_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Najlepszym sposobem na zdobycie casus belli jest poproszenie naszego [Concept('parliament_with_icon','parlamentu')|e] o jego stworzenie. Sesję parlamentu możesz zwołać tutaj: @government_panel! [Link('government', 'tabcontent = parliament', 'lateralview_government_entry_name')].\n@arrow_bonus_tier_2! Stworzenie [Concept('spy_network_with_icon','siatki szpiegowskiej')|e] w obcych [Concept('countries','krajach')|e] pozwoli na stworzenie przeciwko nim casus belli, jeśli mamy w ich obrębie [Concept('cores_with_icon','lokacje główne')|e] lub jeśli są naszymi [Concept('rivals_with_icon','rywalami')|e]."
 hint_casus_belli_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Pamiętaj, że nie wszystkie [Concept('war','wojny')] są sprawiedliwe i możemy wszcząć konflikt bez casus belli. To przydatna rzecz, ale bardzo często duży może po prostu więcej.\n@hint! Każdy casus belli ma konkretny [war_goal_with_icon|el]. Realizacja [Concept('war_goal','celu')] podczas [Concept('war','wojny')] zapewni nam [war_score_with_icon|el], który jest kluczowy dla zwycięstwa.\n@hint! [events_with_icon|e] i [situations_with_icon|e] mogą zapewnić specjalny casus belli."
 hint_casus_belli_diplomatic: "„Nawet wojna ma zasady, do których musimy się stosować”."
 hint_casus_belli_administrative: "„Dobry casus belli pozwoli nam wypowiedzieć wojnę bez ściągania na siebie gniewu sąsiadów”."
 hint_casus_belli_military: "„Brak casus belli to najlepszy casus belli”."
 ### Levies
 hint_has_unraised_levies_in_war: "Oddziały poborowe"
 hint_has_unraised_levies_in_war_hint_text: "$hint_has_unraised_levies_in_war_hint_text_1$\n\n$hint_has_unraised_levies_in_war_hint_text_2$\n\n$hint_has_unraised_levies_in_war_hint_text_3$"
 hint_has_unraised_levies_in_war_hint_text_1: "[levies_with_icon|e] to podstawa wojska każdego [Concept('country_with_icon','kraju')|e] w pierwszych stuleciach gry, zanim zastąpią je zawodowi żołnierze, [regulars_with_icon|el]. Do tego czasu zaleca się zawsze werbować [Concept('levies','poborowych')|e] podczas [Concept('war_with_icon','wojen')|e]."
 hint_has_unraised_levies_in_war_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Kiedy zaczyna się wojna, kliknij #W powiadomienie#!, by przejść do #W werbowania poborowych#! w panelu @military_panel! [Link('unit_overview', '', 'lateralview_unit_overview_entry_name')]. Możesz tam zwerbować wszystkie [levies|l] naraz lub wybrać określone [provinces_with_icon|el], w których chcesz przeprowadzić pobór.\n@arrow_bonus_tier_2! Dobrze jest zmniejszać zależność od [Concept('levies','poborowych')|e] i zastępować ich lepszymi, ale droższymi [Concept('regular_regiments','pułkami regularnymi')]. Do tego potrzebny będzie budynek typu [ShowBuildingTypeName('sergeantry')|l].\n@arrow_bonus_tier_1! W razie potrzeby [levies|l] mogą być uzupełnione lub nawet zastąpione [Concept('mercenaries_with_icon','najemnikami')|e], o ile mamy na to fundusze. [Concept('mercenaries','najemników')|U] zatrudnia się w panelu @military_panel! [Link('unit_overview', '', 'lateralview_unit_overview_entry_name')]."
 hint_has_unraised_levies_in_war_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! [levies] tworzone są głównie przez [pops_with_icon|el] twojej [Concept('primary_culture_with_icon','kultury podstawowej')|e] i [Concept('accepted_cultures_with_icon','kultury akceptowanej')|e], a liczba poborowych z każdej [Concept('location','lokacji')|e] będzie zależeć do [Concept('control_with_icon','kontroli')|e] nad nią.\n@hint! Pamiętaj, że dopóki żołnierze nie wrócą do domów, w [Concept('locations','lokacjach')|e], w których dokonano werbunku, spadnie produkcja [Concept('food','żywności')|e] oraz wydajność [Concept('rgo_with_icon','operacji pozyskiwania surowców')|e].\n@hint! Uważaj: każdy włościanin, który ginie w bitwie jest jednym włościaninem mniej do uprawy roli."
 hint_has_unraised_levies_in_war_diplomatic: "„Ludzie muszą pracować, ale muszą też bronić swoich domów w razie ataku”."
 hint_has_unraised_levies_in_war_administrative: "„Gdy ludzie będą nam ufać, przybędą też z pomocą na wezwanie”."
 hint_has_unraised_levies_in_war_military: "„Pole do zaorania nie jest wymówką, gdy czeka wojna”."
 ### No allies
 hint_no_allies: "Brak sojuszników"
 hint_no_allies_hint_text: "$hint_no_allies_hint_text_1$\n\n$hint_no_allies_hint_text_2$\n\n$hint_no_allies_hint_text_3$"
 hint_no_allies_hint_text_1: "[alliance_with_icon|e] to [treaty_with_icon|el] między dwoma [Concept('countries_with_icon','krajami')|e], który pozwala na wspólny udział w [Concept('wars_with_icon','wojnach')|e]. Gdy zostaniemy zaatakowani, nasi [allies|l] otrzymają [Concept('call_to_arms_with_icon','wezwanie do broni')|e], aby stanąć w boju po naszej stronie. Powinniśmy też pamiętać, aby podczas wypowiadania [Concept('war','wojny')] wziąć pod uwagę, z kim sprzymierzony jest wróg, bo jego sojusznicy prawdopodobnie również staną przeciwko nam."
 hint_no_allies_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Przejdź do okna „@diplomacy_panel! [Link('diplomacy_macrobuilder', '', 'lateralview_diplomacy_macrobuilder_entry_name')]” i kliknij „$offer_alliance$” (kategoria #W $CATEGORY_FRIENDLY_ACTIONS$#!). Zobaczysz tam listę wszystkich [Concept('countries','krajów')] gotowych podpisać z nami [alliance_with_icon|el].\n@arrow_bonus_tier_2! Niektóre [countries|l] mogą wymagać odrobiny perswazji. Wykorzystanie [Concept('diplomatic_action_with_icon', 'działania dyplomatycznego ')|e] „#W $IMPROVE_RELATIONTITLE$#!” powoli ich przekonać."
 hint_no_allies_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Uważaj: nasi sojusznicy również mogą nas wezwać na swoją wojnę. Nie sprzymierzaj się z krajami, które wydają się zbyt słabe – możemy skończyć po przegranej stronie niedotyczącej nas wojny.\n@hint! Możesz zawsze odrzucić [call_to_arms|l] sojusznika. Jednak oznaczać to będzie koniec przyjaźni i splami na kolejne lata naszą reputację dyplomatyczną."
 hint_no_allies_diplomatic: "„Nikt nie przetrwa na tym świecie samotnie”."
 hint_no_allies_administrative: "„Nawet jeśli nie planujesz atakować, rozpoczęcie sojuszu z którymś z naszych sąsiadów może zniechęcić przeciwnika do ataku”."
 hint_no_allies_military: "„Silny sojusznik może nam osłaniać tyły, gdy przechodzimy do ofensywy”."
 ##### Situation Hints #####
 ### The Black Death
 hint_black_death: "Czarna śmierć"
 hint_black_death_hint_text: "$hint_black_death_hint_text_1$\n\n$hint_black_death_hint_text_2$\n\n$hint_black_death_hint_text_3$"
 hint_black_death_hint_text_1: "Czarna śmierć to [situation_with_icon|el], która spustoszy Stary Świat, przemieszczając się wzdłuż szlaków handlu i cywilizacji. Najbardziej śmiercionośna będzie w naszych gęsto zaludnionych [Concept('locations_with_icon','lokacjach')|e], zaś wygaśnie, kiedy odpowiednio dużo ocalałych wykształci [disease_resistance_with_icon|el].\n\nNa zarazę umiera ludność z każdego [Concept('pop_type_with_icon','typu społeczności')|e], co sprawia, że nasze [buildings_with_icon|el] opustoszeją do czasu, gdy [Concept('promote_with_icon','awansują')|e] kolejni [ShowPopTypeName('peasants')|l]. Oznacza to też, że [tax_base_with_icon|el] najprawdopodobniej się zmniejszy wraz ze spadkiem wydajności [Concept('buildings','budowli')]. [ShowModifierTypeName('local_pop_promotion_speed')] będzie wówczas bardzo istotna dla odzyskania utraconego [Concept('employment_with_icon','zatrudnienia')|e]."
 hint_black_death_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Postaw [buildings|l] typu [ShowBuildingTypeName('hospital')|l] w naszych największych [Concept('urban_locations_with_icon','lokacjach miejskich')|e], zanim zaraza dotrze do [Concept('country_with_icon','kraju')|e].\n@arrow_bonus_tier_2! Kliknij baner [Concept('situation','sytuacji')|e], aby sprawdzić interakcje specjalne, jakie mamy do dyspozycji. Być może zdołają zmniejszyć rozmiary katastrofy?\n@arrow_bonus_tier_2! Dbaj, aby nasza [stability_with_icon|el] znajdowała się na wysokim poziomie. Nie tylko pomoże to w przypadku [Concept('rebellions_with_icon','buntów')|e], lecz również od niej zależy [ShowModifierTypeName('local_pop_promotion_speed')|l].\n@arrow_bonus_tier_1! Nie stawiaj nowych budowli w [Concept('locations','lokacjach')|e] tracących ludność, gdyż będą mieć problem ze znalezieniem pracowników.\n@arrow_bonus_tier_1! Obserwuj [ShowModifierTypeName('local_pop_promotion_speed')|l], ponieważ w większości naszych [Concept('buildings','budowli')] i [Concept('rgo_with_icon','operacji pozyskiwania surowców')|e] potrzebni są [ShowPopTypeName('peasants')|l] [Concept('promote_with_icon','awansowani')|e] do wyższych [Concept('pop_types','typów społeczności')]."
 hint_black_death_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Może to zająć lata, lecz dopóki nasze [locations|l] mają dość włościan, zostaną ostatecznie [Concept('promote_with_icon','awansowani')|el], aby uzupełnić braki pozostawione po zarazie.\n@hint! Możesz wykorzystać lekcje z tej katastrofy podczas radzenia sobie z innymi problemami w czasie kampanii, takimi jak [starvation_with_icon|el], [diseases_with_icon|el] czy [loot_with_icon|el], ponieważ będą podobnie wpływać na nasze lokacje."
 hint_black_death_diplomatic: "„Nadciąga śmierć. Za nią zaś zniszczenie i niepokój”."
 hint_black_death_administrative: "„Blada śmierć kopniakiem otwiera drzwi do wież królów i chat ubogich”."
 hint_black_death_military: "„Czwarty jeździec apokalipsy nadciąga. Żadna wskazówka nas nie uratuje”."
 ###Fall of Delhi
 hint_fall_of_delhi: "[GetSituationByKey('fall_of_delhi').GetNameWithNoTooltip]"
 hint_fall_of_delhi_hint_text: "$hint_fall_of_delhi_hint_text_1$\n\n$hint_fall_of_delhi_hint_text_2$\n\n$hint_fall_of_delhi_hint_text_3$\n\n$hint_fall_of_delhi_hint_text_4$"
 hint_fall_of_delhi_hint_text_1: "[GetSituationByKey('fall_of_delhi').GetName] to [situation_with_icon|el] która może sprawić, że mimo dawnej wielkości [GetCountry('DLH').GetFlavorRank|l] upadnie. Wokół nadwątlonej granicy gromadzą się sępy i potencjalni najeźdźcy, zaś władza, jaką dzierży [GetCountry('DLH').GetGovernment.GetRulerOrRegent.GetName|l], słabnie..."
 hint_fall_of_delhi_hint_text_2: "#T Zalecane działania jako Delhi:#!\n@arrow_bonus_tier_3! Jako [GetCountry('DLH').GetName] rozważ wykorzystanie wielu nowych dostępnych [Concept('actions_with_icon','działań')|e] jak „[ShowGenericActionName('strengthen_neighbor_relations')|l]” czy „[ShowGenericActionName('fall_of_delhi_appoint_governors')|l]”.\n@arrow_bonus_tier_2! Podczas rozmaitych [Concept('events_with_icon','wydarzeń')|e] związanych z tą [Concept('situation_with_icon','sytuacją')|e] musimy postarać się zwiększyć [share_of_power_gc_with_icon|el] kosztem wrogów albo nasz lud czeka zagłada."
 hint_fall_of_delhi_hint_text_3: "#T Dodatkowe wskazówki dla Delhi:#!\n@hint! Jedną oczywistą przewagą, jaką mamy nad wrogami, jest nasza potężna [army_with_icon|el]. W przeciwieństwie do [Concept('levies_with_icon','oddziałów poborowych')|e] opłacani żołnierze uzupełniają swoje szeregi i są znacznie potężniejsi. To fundament naszej władzy, który pozwala reżimowi pozostawać na szczycie."
 hint_fall_of_delhi_hint_text_4: "#T Zalecane działania jako przeciwnik:#!\n@arrow_bonus_tier_3! Najsilniejszy [country_with_icon|el], jaki znają $india$, będzie na początku [Concept('situation_with_icon','sytuacji')|e] głównym przeciwnikiem, lecz pozycję można też zdobyć, wypowiadając wojnę i ogłaszając swój prymat. Możemy to zrobić, będąc najsilniejszym [Concept('country_with_icon','państwem')|e] w Indiach na początku [Concept('situation_with_icon','sytuacji')|e] lub pokonując obecnego przywódcę i zdobyć prymat poprzez [peace_treaty_with_icon|el] „[ShowPeaceTreatyTypeNameWithNoTooltip('peace_seize_opposition_leadership')]”."
 hint_fall_of_delhi_diplomatic: "„Czy to broniąc tronu [GetCountry('DLH').GetName], czy też stając się jego rywalem, warto dbać o dobre stosunki z sąsiadami. Przyjaźń może nam zapewnić czas, zaś wrogość – usprawiedliwić nowe podboje”."
 hint_fall_of_delhi_administrative: "„Ziemie pozyskane w chaosie to niepewna zdobycz. Rozważ tworzenie [Concept('subjects_with_icon','poddanych')|e] lub zwiększanie [Concept('control_with_icon','kontroli')|e], kiedy to tylko możliwe, aby nowo zdobyte terytoria nie wymknęły ci się z rąk równie szybko, jak w nie wpadły”."
 hint_fall_of_delhi_military: "„To walka, w której wiele do powiedzenia ma miecz. Silna [army_with_icon|el] może obronić Delhi przed upadkiem lub pozwolić przeciwnikom powalić kolosa. Nawet zwycięstwo jest jednak ryzykiem! Strzeż się buntów i zbyt łakomych kąsków”."
 ###Rise of the Turks
 hint_rise_of_the_ottomans: "[GetSituationByKey('rise_of_the_ottomans').GetNameWithNoTooltip] – podpowiedzi"
 hint_rise_of_the_ottomans_hint_text: "$hint_rise_of_the_ottomans_hint_text_1$\n\n$hint_rise_of_the_ottomans_hint_text_2$"
 hint_rise_of_the_ottomans_hint_text_1: "Ta [situation_with_icon|el] dotyczy wyłonienia się #italic najsilniejszego bejlika#!. Tego, którego przeznaczeniem będzie stworzyć jedno z największych imperiów w historii. Dzięki wyjątkowym [Concept('events_with_icon','wydarzeniom')|e] i [Concept('actions_with_icon','działaniom')|e] musimy zapewnić sobie dominację nad innymi bejlikami, przekroczyć [ShowProvinceDefinitionName('marmara_sea_province')] oraz zdobyć bogactwa, jakie kryje [ShowLocationName('constantinople')]. Czeka nas wieczna chwała!"
 hint_rise_of_the_ottomans_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_2! Nadszedł czas naszego wywyższenia. Dzięki potężnym [Concept('actions_with_icon','działaniom')|e], jak [ShowGenericActionName('press_claims')|l], i [Concept('events_with_icon','wydarzeniom')|e], które przyspieszają [Concept('integration_with_icon','integrację')|e] nasze państwo zapisze się na kartach dziejów.\n@arrow_bonus_tier_1! Jeśli utrzymamy #Y 120#! [Concept('locations_with_icon','lokacji')|e] i zabezpieczymy sobie przyczółek na obszarze [ShowRegionName('balkan_region')], możemy rozszerzyć [action_with_icon|el] „[ShowGenericActionNameWithNoTooltip('press_claims')|l]” również na tamten [region_with_icon|el]."
 hint_rise_of_the_ottomans_diplomatic: "„Na początku tej [Concept('situation_with_icon','sytuacji')|e] mądrze jest wykorzystać zapewnione [actions_with_icon|el] jak „[ShowGenericActionName('seek_relations_with_the_byzantines')|l]”. Wykorzystując ich gasnący prestiż jako ostatni bastion Rzymu, zbudujemy własne dziedzictwo”."
 hint_rise_of_the_ottomans_administrative: "„Choć z pewnością doskonale poradzimy sobie w podbojach, musimy pamiętać też o sprawach wewnętrznych i głównych terenach naszego państwa. Nie zaniedbuj ich w pogoni za zagraniczną chwałą!”"
 hint_rise_of_the_ottomans_military: "„Musimy starać się podbijać [towns_and_cities_with_icon|el] naszych wrogów. Kampanie te będą stanowić podstawę pokoleniowej potęgi”."
 ####Council of Trent
 hint_council_of_trent: "[GetSituationByKey('council_of_trent').GetNameWithNoTooltip]"
 hint_council_of_trent_hint_text: "$hint_council_of_trent_hint_text_1$\n\n$hint_council_of_trent_hint_text_2$"
 hint_council_of_trent_hint_text_1: "Kiedy trwa [ShowSituationName('council_of_trent')], [GetUniqueInternationalOrganization('catholic_church').GetName], może zmieniać obecne [laws_with_icon|el] i wprowadzać nowe [policies_with_icon|el] do [Concept('international_organization_with_icon','organizacji międzynarodowej')|e]."
 hint_council_of_trent_hint_text_2: "#T Możliwe interakcje:#!\n@arrow_bonus_tier_3! [GetUniqueInternationalOrganization('catholic_church').GetName]: jako [member_with_icon|el] możesz proponować [ShowResolutionName('policy_vote')|l], wykorzystując listę [Concept('laws','praw')] w panelu doktryn, jakie wyznaje [GetUniqueInternationalOrganization('catholic_church').GetName].\n@arrow_bonus_tier_2! [GetUniqueInternationalOrganization('catholic_church').GetName]: jako [member_with_icon|el], możesz głosować, kiedy zaproponowane zostanie określone [ShowResolutionName('policy_vote')|l]."
 hint_council_of_trent_diplomatic: "$hint_advisor_salute_diplomatic$"
 hint_council_of_trent_administrative: "$hint_advisor_salute_administrative$"
 hint_council_of_trent_military: "$hint_advisor_salute_military$"
 ###Golden Age of Piracy
 hint_golden_age_of_piracy: "[GetSituationByKey('golden_age_of_piracy').GetNameWithNoTooltip]"
 hint_golden_age_of_piracy_hint_text: "$hint_golden_age_of_piracy_hint_text_1$\n\n$hint_golden_age_of_piracy_hint_text_2$\n\n$hint_golden_age_of_piracy_hint_text_3$\n\n$hint_golden_age_of_piracy_hint_text_4$"
 hint_golden_age_of_piracy_hint_text_1: "[GetSituationByKey('golden_age_of_piracy').GetName] to [situation_with_icon|el], która może spowodować pojawienie się nowych piratów. Wolni ludzie, niezadowoleni żeglarze i ci, którzy sprzeciwiają się scentralizowanej władzy, stanowią siłę czarnych żagli, pod którymi prowadzą nielegalną działalność."
 hint_golden_age_of_piracy_hint_text_2: "#T Zalecane działania w walce z piratami:#!\n@arrow_bonus_tier_3! Rozważ zlikwidowanie wszelkich piratów przy naszym brzegu. Nie możemy pozwolić im krążyć po naszych morzach.\n@arrow_bonus_tier_2! Każde [event_with_icon|el] związane z tą [Concept('situation_with_icon','sytuacją')|e] może wieszczyć powstanie nowej republiki pirackiej."
 hint_golden_age_of_piracy_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Możemy zdołać wykorzystać w tej [Concept('situation_with_icon','sytuacji')|e] nowe [actions_with_icon|el], niezależnie od tego, czy pływamy pod czarną flagą, czy nie."
 hint_golden_age_of_piracy_hint_text_4: "#T Zalecane działania jako piraci:#!\n@arrow_bonus_tier_3! Mądrze jest zabezpieczyć wybrzeże i zbudować potężną [Concept('navy_with_icon','flotę')|e]. Wykorzystując [actions_with_icon|el], takie jak „[ShowGenericActionName('attract_sailors')]” lub „[ShowGenericActionName('migrate_to_new_waters')]”, możemy utrzymać wszechstronną flotę i obecność na morzach."
 hint_golden_age_of_piracy_diplomatic: "„Uśmiechy i rum sprawdzają się lepiej niż groźby, przynajmniej dopóki nie odezwą się działa. Może dobrze byłoby utrzymywać dobre stosunki z tymi morskimi łachudrami. Nie każdy skarb ma postać srebra czy złota”."
 hint_golden_age_of_piracy_administrative: "„Zarządzanie naszym morskim dobytkiem to w epoce piractwa delikatna rzecz. Zarówno obrona przed nimi, jak i konkurowanie wymagają niezwykle sprawnej administracji!”"
 hint_golden_age_of_piracy_military: "„Piraci nie uznają żadnych krajów – zaprzedali w końcu własny. I ponieważ wiedzą, że schwytani – zawisną, nie mają skrupułów. Mordują i niszczą wszystko, jeśli ich żądania nie zostaną spełnione”."
 ###Hundred Years War
 hint_hundred_years_war: "[GetSituationByKey('hundred_years_war').GetNameWithNoTooltip]"
 hint_hundred_years_war_hint_text: "$hint_hundred_years_war_hint_text_1$\n\n$hint_hundred_years_war_hint_text_2$\n\n$hint_hundred_years_war_hint_text_3$\n\n$hint_hundred_years_war_hint_text_4$"
 hint_hundred_years_war_hint_text_1: "[GetSituationByKey('hundred_years_war').GetName] sprawia, że [ShowSubContinentName('western_europe')] pogrąża się w niepokojach! Okres ten sprawdzi trwałość sojuszy, z gruzów zaś z pewnością wyłonią się nowe potęgi."
 hint_hundred_years_war_hint_text_2: "#T Zalecane działania#!\n@arrow_bonus_tier_3! Zarówno [GetCountry('FRA').GetName], jak i [GetCountry('ENG').GetName] mają dostęp do akcji „[ShowGenericActionName('request_war_entry')]”, „[ShowGenericActionName('hyw_sign_truce')]” i „[ShowGenericActionName('request_papal_delegates')]”. To wyjątkowe sposoby na manipulowanie statusem quo konfliktu lub nawet przechylenie szali na korzyść któregoś z krajów."
 hint_hundred_years_war_hint_text_3: "#T Dodatkowe podpowiedzi:#!\n@hint! Jako uczestnicy konfliktu możemy zdobyć ziemię lub potężne sojusze."
 hint_hundred_years_war_hint_text_4: "#T Zalecane działania jako [subject_with_icon|el] kraju [GetCountry('FRA').GetName]:#!\n@arrow_bonus_tier_3! Mądrze będzie przeprowadzić działanie „[ShowGenericActionName('demand_autonomy')|l]”. Każdy [ShowSubjectTypeName('appanage')|l] może zażądać pewnego stopnia niezależności i bardzo na tym skorzystać dzięki swojemu znaczeniu w obronie [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]kiej korony."
 hint_hundred_years_war_hint_text_5: "#T Zdrada wasala#!\n@hint! Nielojalni poddani z państw [GetCountry('FRA').GetName] lub [GetCountry('ENG').GetName] mogą porzucić swoich suwerenów i dołączyć do przeciwnej korony, odmieniając obraz wojny. Zdrady stają się bardziej prawdopodobne w czasie aktywnej wojny. Podczas pokoju stronę zmienią tylko głęboko nielojalni poddani. Poddany z tą samą dynastią co suweren nie może zdradzić bez względu na to, jak bardzo nielojalny się stanie.\n@hint! Jako suweren obserwuj bacznie [subject_loyalty_with_icon|el] poddanych bez więzi wspólnej dynastii. Wykorzystaj działanie „[ShowGenericActionName('fra_diplomacy_with_subjects')]”, by wspierać wahających się poddanych lub wzmocnij ich lojalność poprzez dary, zanim wybuchnie wojna. Jako rywal bierz na cel poddanych rządzonych przez inne dynastie, erodując z czasem ich lojalność."
 hint_hundred_years_war_diplomatic: "„Dajmy wojnie szansę!”"
 hint_hundred_years_war_administrative: "„Terytoria zamorskie najpewniej ucierpią pod kątem [Concept('control_with_icon','kontroli')|e]. Pamiętaj o [Concept('proximity_with_icon','bliskości')|e] każdej nowo podbitej lokacji do naszej [Concept('capital_with_icon','stolicy')|e]”."
 hint_hundred_years_war_military: "„Wojna z naszymi wrogami na południu, czy to jako [GetCountry('FRA').GetName], czy [GetCountry('ENG').GetName]? Warto rozważyć [action_with_icon|el] „[ShowGenericActionName('hyw_sign_truce')]” z innym potężnym sąsiadem”."
 ###Hussite Wars
 hint_hussite_wars: "[GetSituationByKey('hussite_wars').GetNameWithNoTooltip]"
 hint_hussite_wars_hint_text: "$hint_hussite_wars_hint_text_1$\n\n$hint_hussite_wars_hint_text_2$\n\n$hint_hussite_wars_hint_text_3$\n\n$hint_hussite_wars_hint_text_4$"
 hint_hussite_wars_hint_text_1: "[GetSituationByKey('hussite_wars').GetName] niosą głęboki rozpad, jeśli chodzi o [GetReligionByKey('catholic').GetName]. Wielu #L [GetReligionByKey('catholic').GetAdjective|l]ich#! monarchów obawia się, że jeśli herezja ta nie zostanie szybko zduszona, może zostać nimi ogarnięta [ShowContinentName('europe')] w swoich dużych częściach. Zagroziłoby to duchowej władzy, jaką sprawuje [GetCountry('PAP').GetGovernment.GetRulerTitle|l]."
 hint_hussite_wars_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3![GetCountry('PAP').GetGovernment.GetRulerTitle] zechce toczyć [Concept('war_with_icon','wojnę')|e] – [GetCountry('BOH').GetName] stanie się wrogiem. Sąsiadujące #L [ShowReligionGroupAdjective('christian')|l]ie#! kraje mogą zechcieć dołączyć do dowolnej ze stron, decydując w ten sposób o losie całego [Concept('continent_with_icon','kontynentu')|e]."
 hint_hussite_wars_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! [GetCountry('BOH').GetName] to kraj z dostępem do rozmaitych wyjątkowych [Concept('actions_with_icon','działań')|e], jak na przykład „[ShowGenericActionName('convert_heretics_hw_action')]” czy „[ShowGenericActionName('prepare_defenses_hw_action')]”."
 hint_hussite_wars_hint_text_4: "#T Zalecane działania jako [GetCountry('PAP').GetName]:#!\n@arrow_bonus_tier_3! Dobre stosunki z innymi [countries_with_icon|e] #L [GetReligionByKey('catholic').GetAdjective|l]imi#! mogą pozwolić nam na wezwanie ich na pomoc. Podczas [Concept('situation_with_icon','sytuacji')|e] dostępny jest wyjątkowy [peace_treaty_with_icon|el] „[ShowPeaceTreatyTypeName('supress_hussite_faith')|l]”. Zmniejszy on koszt użycia [Concept('peace_treaty_with_icon','traktatu pokojowego')|e] #Y Wymuszenie nawrócenia#!.\n@arrow_bonus_tier_2! [countries_with_icon|eU] #L [GetReligionByKey('catholic').GetAdjective|l]ie#! toczące [Concept('war_with_icon','wojnę')|e] z państwem [GetCountry('BOH').GetName] zyskają dostęp do unikatowego [Concept('action_with_icon','działania')|e] [Concept('unit_with_icon','jednostki')|e] [ShowUnitAbilityName('hussite_tribunal')]. To pozwoli im siłą [Concept('convert_with_icon','nawracać')|e] [pops_with_icon|el] #L [GetReligionByKey('hussite').GetAdjective|l]ie#! i zabijać opornych w kontrolowanych przez nie [Concept('province_capitals_with_icon','stolicach prowincji')|e]."
 hint_hussite_wars_diplomatic: "„Wiara powinna motywować nas do poszukiwania podobnie myślących sojuszników, dzięki czemu przetrwamy ten burzliwy okres”."
 hint_hussite_wars_administrative: "„Powinniśmy pamiętać o utrzymywaniu [Concept('religious_unity_with_icon','jedności religijnej')|e]”."
 hint_hussite_wars_military: "„Będziemy musieli najpewniej bronić naszej wiary przemocą”."
 ###Italian Wars
 hint_italian_wars: "[GetSituationByKey('italian_wars').GetNameWithNoTooltip]"
 hint_italian_wars_hint_text: "$hint_italian_wars_hint_text_1$\n\n$hint_italian_wars_hint_text_2$\n\n$hint_italian_wars_hint_text_3$\n\n$hint_italian_wars_hint_text_4$"
 hint_italian_wars_hint_text_1: "[GetSituationByKey('italian_wars').GetName] to konflikt, którymi ogarnięty jest region [ShowRegionName('italy_region')]. [countries_with_icon|e] z zewnątrz próbują najechać region, zaś formacja Lig Włoskich zwiastuje nadejście epoki podziałów i oporu, walki w obronie dobrobytu tej okolicy."
 hint_italian_wars_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Przywódcy każdej z lig mogą zaprosić inne [countries_with_icon|el], aby wzmocnić swoje wpływy w regionie [ShowRegionName('italy_region')]."
 hint_italian_wars_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Rywale lub wrogowie przywódców lig mogą wykorzystywać działanie „[ShowGenericActionName('iw_send_aid')|l]” i decydować o losach ważnych wojen."
 hint_italian_wars_hint_text_4: "#T Zalecane działania jako przywódca Lig Włoskich:#!\n@arrow_bonus_tier_3! Dobre stosunki z sąsiadami sprawią, że nasza [international_organization_with_icon|el] będzie rosnąć w siłę."
 hint_italian_wars_diplomatic: "„[ShowRegionName('italy_region')] to region, który musimy kontrolować my i nasi podobnie myślący sojusznicy”."
 hint_italian_wars_administrative: "„Tworzenie [Concept('subjects_with_icon','poddanych')|e] w regionie [ShowRegionName('italy_region')] rozszerzy nasze wpływy w [Concept('region','regionie')|e]”."
 hint_italian_wars_military: "„Musimy zmiażdżyć konkurencję. Gra toczy się o zbyt wielkie bogactwo i władzę”."
 ###Little Ice Age
 hint_little_ice_age: "[GetSituationByKey('little_ice_age').GetNameWithNoTooltip]"
 hint_little_ice_age_hint_text: "$hint_little_ice_age_hint_text_1$\n\n$hint_little_ice_age_hint_text_2$\n\n$hint_little_ice_age_hint_text_3$"
 hint_little_ice_age_hint_text_1: "Nadeszła [GetSituationByKey('little_ice_age').GetName]! Ziemie pokryły się szronem. Musimy robić, co w naszej mocy, żeby chronić plony i zwierzęta, zapewnić naszemu ludowi przetrwanie!"
 hint_little_ice_age_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Rozważ rozwój [Concept('buildings_with_icon','budowli')|e], które wytwarzają [food_with_icon|el] lub zwiększają jej produkcję."
 hint_little_ice_age_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Możemy wykorzystać wiele wyjątkowych [Concept('actions_with_icon','działań')|e], aby zwiększyć zapasy i usprawnić redystrybucję [Concept('food_with_icon','żywności')|e] w naszych [Concept('provinces_with_icon','prowincji')|e]."
 hint_little_ice_age_diplomatic: "„Nadciąga zima”."
 hint_little_ice_age_administrative: "„Właściwa produkcja i dystrybucja [Concept('food_with_icon','żywności')|e] ochroni nasze [pops_with_icon|el] przed przedwczesnymi odwiedzinami ponurego żniwiarza”."
 hint_little_ice_age_military: "„Zamarznięte akweny mogą stać się chwilowo przekraczalne, lecz [Concept('armies_with_icon','armie')|e] uwięzione w górach zimą mogą utknąć tam na bardzo długo”."
 ###Revolution
 hint_the_revolution: "[GetSituationByKey('the_revolution').GetNameWithNoTooltip]"
 hint_the_revolution_hint_text: "$hint_the_revolution_hint_text_1$\n\n$hint_the_revolution_hint_text_2$\n\n$hint_the_revolution_hint_text_3$"
 hint_the_revolution_hint_text_1: "Wybuchła [GetSituationByKey('the_revolution').GetName|l]! Monarchie drżą, słysząc o szerzących się niczym pożar ideach wolności, równości i braterstwa. Czy pogodzimy się z wiejącym wiatrem zmian? A może staniemy w obronie starego porządku?"
 hint_the_revolution_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Kiedy wybuchnie [disaster_with_icon|el] „[ShowDisasterName('revolution_disaster')|l]”, możemy się sprzymierzyć z [Concept('revolutionary_with_icon','rewolucjonistami')|e].\n@arrow_bonus_tier_2! [situation|e] umożliwia #Y 2#! wyjątkowe [Concept('peace_treaties_with_icon','traktaty pokojowe')|e]: „[ShowPeaceTreatyTypeName('reinstate_the_monarchy')]” i „[ShowPeaceTreatyTypeNameWithNoTooltip('force_revolution')]”.\n@arrow_bonus_tier_1! [situation|e] zapewnia dostęp do nowych [Concept('actions_with_icon','działań')|e], takich jak „[ShowGenericActionName('suppress_foreign_revolutionaries')|l]” czy „[ShowGenericActionName('assist_foreign_revolutionaries')|l]”."
 hint_the_revolution_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Najsilniejsze państwo rewolucyjne może stać się [Concept('revolutionary_target_with_icon','celem rewolucyjnym')|e] poprzez posiadanie najwyższej [Concept('great_power_score_with_icon','oceny w rankingu wielkich mocarstw')|e]."
 hint_the_revolution_diplomatic: "„Wygląda na to, że w obecnym krajobrazie politycznym wielu monarchów potraciło głowy, starając się za wszelką cenę zgnieść te rewolucje”."
 hint_the_revolution_administrative: "„Mądrze będzie wybrać stronę i to jak najszybciej. Przetrwanie naszego państwa zależy od szybkiego podejmowania decyzji. Bądźmy gotowi, kiedy rewolucja zapuka do naszych drzwi”."
 hint_the_revolution_military: "„Czy zdusimy sentymenty rewolucyjne, czy też je podsycimy – nasz wpływ musi rozciągnąć się poza nasze granice”."
 ###Western Schism
 hint_western_schism: "[GetSituationByKey('western_schism').GetNameWithNoTooltip]"
 hint_western_schism_hint_text: "$hint_western_schism_text_1$\n\n$hint_western_schism_text_2$\n\n$hint_western_schism_text_3$\n\n$hint_western_schism_text_4$"
 hint_western_schism_text_1: "Podczas [Concept('situation','sytuacji')|e] „[ShowSituationNameWithNoTooltip('western_schism')|l]” [international_organization_with_icon|el] – [GetUniqueInternationalOrganization('catholic_church').GetName] – dzieli się między dwie papieskie kandydatury, co uniemożliwia wszelkie interakcje z kurią.\n\nAby wpłynąć na wynik [Concept('situation','sytuacji')|e], można podjąć następujące kroki w zależności od twojej roli w Kościele:"
 hint_western_schism_text_2: "#T [countries] posiadające [Concept('cardinal_with_icon','kardynała')|e]:#!\n@arrow_bonus_tier_3! Zagłosować na jednego z kandydatów."
 hint_western_schism_text_3: "#T [countries] nieposiadające [Concept('cardinal_with_icon','kardynała')|e]:#!\n@arrow_bonus_tier_3! Podjąć [action|el] z [Concept('situation','sytuacji')|e] „#V $schism_show_support_for_one_pope$#!”, aby zapewnić wybranemu kandydatowi postęp.\n@arrow_bonus_tier_2! Użyć [Concept('action','działania')] religijnego „$request_cardinal_seat$”, aby zdobyć [Concept('cardinal','kardynała')].\n@arrow_bonus_tier_1! Podjąć [action|l] z [Concept('situation','sytuacji')|e] „#V $schism_demand_support_from_one_pope$#!”, aby wyciągnąć z niej korzyści."
 hint_western_schism_text_4: "Podczas [Concept('situation','sytuacji')|e] herezje będą szerzyć się w świecie katolickim.\n\n#T Zalecane działania:#!\n@arrow_bonus_tier_3! Rozważ wykorzystanie [Concept('action','działania')] z [Concept('situation','sytuacji')|e] „#V $schism_show_unity_of_faith$#!”, aby utrzymać wysoką [Concept('religious_unity_with_icon','jedność religijną')|e]."
 ###Reformation
 hint_reformation: "[GetSituationByKey('reformation').GetNameWithNoTooltip]"
 hint_reformation_hint_text: "$hint_reformation_hint_text_1$\n\n$hint_reformation_hint_text_2$\n\n$hint_reformation_hint_text_3$"
 hint_reformation_hint_text_1: "Podczas [Concept('situation','sytuacji')|e] „[ShowSituationNameWithNoTooltip('reformation')|l]” [ShowBuildingTypeName('lutheran_preachers')|l] i [ShowBuildingTypeName('calvinist_preachers')|l] będą szerzyć nowe [Concept('religions_with_icon','religie')|e] w świecie #L [ShowReligionGroupAdjective('christian')|l]im#!."
 hint_reformation_hint_text_2: "#T Walka z reformatorami:#!\n@arrow_bonus_tier_3! Mając wybraną politykę „[ShowPolicyName('jesuits_allowed')]”, usuwaj [buildings_with_icon|el] [ShowBuildingTypeName('lutheran_preachers')] i [ShowBuildingTypeName('calvinist_preachers')] kosztem [Concept('stability_with_icon','stabilności')].\n@arrow_bonus_tier_3! Po aktywacji zbuduj i utrzymuj [ShowBuildingTypeName('jesuit_college')], który nie pozwoli, aby [ShowReligionName('lutheran')|l] i [ShowReligionName('calvinist')|l] swobodnie się szerzyły."
 hint_reformation_hint_text_3: "#T Dołączenie do reformatorów:#!\n@arrow_bonus_tier_3! Kiedy jedno z nowych wyznań pojawi się w twoim kraju, przyjmij je i nawróć się na nie za pomocą działania „#V $embrace_the_reformation$#!”.\n@arrow_bonus_tier_2! Użyj @religion_panel! [Link('country_religion','','@society_panel! zakładki religii')], aby nawrócić się na nową [Concept('religion','religię')]."
 hint_reformation_diplomatic: "$hint_advisor_salute_diplomatic$"
 hint_reformation_administrative: "$hint_advisor_salute_administrative$"
 hint_reformation_military: "$hint_advisor_salute_military$"
 ###Treaty of Tordesillas
 hint_treaty_of_tordesillas: "[GetSituationByKey('treaty_of_tordesillas').GetNameWithNoTooltip]"
 hint_treaty_of_tordesillas_hint_text: "$hint_treaty_of_tordesillas_hint_text_1$\n\n$hint_treaty_of_tordesillas_hint_text_2$"
 hint_treaty_of_tordesillas_hint_text_1: "[GetSituationByKey('treaty_of_tordesillas').GetName] zaczyna nabierać kształtów! [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_west_country').GetCountry.GetName] i [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_east_country').GetCountry.GetName] pragną podzielić między siebie nowy świat!"
 hint_treaty_of_tordesillas_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Możemy wykorzystać dowolne z wyjątkowych [Concept('actions_with_icon','działań')|e] z panelu [Concept('situation','sytuacji')|e], aby ukształtować nasze ambicje kolonialne.\n@arrow_bonus_tier_2! [situation|e] wejdzie ostatecznie w #Y drugą#! fazę, kiedy traktat zostanie ratyfikowany. Gdy to nastąpi, będą mogły przystąpić do niego kolejne [countries_with_icon|el], aby wysunąć własne roszczenia."
 hint_treaty_of_tordesillas_diplomatic: "„To dobra okazja, żeby zdobyć dla siebie część nowo odkrytych ziem. Pod przykrywką autorytetu religii i władzy”."
 hint_treaty_of_tordesillas_administrative: "„Nowy świat niesie nam wiele możliwości handlowych. Wykorzystajmy je dobrze”."
 hint_treaty_of_tordesillas_military: "„Nie możemy pozwolić, żeby wróg przejął te ziemie przed nami!”"
 ###Great Pestilence
 hint_great_pestilence: "[GetSituationByKey('great_pestilence').GetNameWithNoTooltip]"
 hint_great_pestilence_hint_text: "$hint_black_death_hint_text_2$\n\n$hint_black_death_hint_text_3$"
 hint_great_pestilence_diplomatic: "„Sojusznicy nas opuścili. Przywódcy – zdradzili. Porzucić stanowiska! Uciekajcie! Ratujcie życie!”"
 hint_great_pestilence_administrative: "„Nie traćmy nadziei. Wiele jest sposobów na uniknięcie zgonów, jak bardzo nie byłyby nieskuteczne...”"
 hint_great_pestilence_military: "„Zachowaj ostrożność w zakresie przemieszczania naszych [Concept('armies_with_icon','armii')|e] w [Concept('locations_with_icon','lokacjach')|e] dotkniętych chorobą. Nie możemy sobie pozwolić na utratę żołnierzy”."
 ###Columbian Exchange
 hint_columbian_exchange: "[GetSituationByKey('columbian_exchange').GetNameWithNoTooltip]"
 hint_columbian_exchange_hint_text: "$hint_columbian_exchange_hint_text_1$\n\n$hint_columbian_exchange_hint_text_2$"
 hint_columbian_exchange_hint_text_1: "Rozpoczęła się [GetSituationByKey('columbian_exchange').GetName]! [trade_with_icon|e] i [goods_with_icon|el] łączą Stary Świat z Nowym!"
 hint_columbian_exchange_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Możemy wykorzystać dowolne z wyjątkowych [Concept('actions_with_icon','działań')|e] w panelu [Concept('situation_with_icon','sytuacji')|e], aby zwiększyć nasze zyski poprzez wprowadzenie nowych towarów na nasz [market_with_icon|el]."
 hint_columbian_exchange_diplomatic: "„Zyski z handlu rządzą światem!”"
 hint_columbian_exchange_administrative: "$hint_treaty_of_tordesillas_administrative$"
 hint_columbian_exchange_military: "„Musimy zrobić, co się da, żeby zapewnić sobie dochodowe źródła nowych towarów. Zanim zrobi to konkurencja!”"
 ###War of Religions
 hint_war_of_religions: "[GetSituationByKey('war_of_religions').GetNameWithNoTooltip]"
 hint_war_of_religions_hint_text: "$hint_war_of_religions_hint_text_1$\n\n$hint_war_of_religions_hint_text_2$\n\n$hint_war_of_religions_hint_text_3$\n\n$hint_war_of_religions_hint_text_4$"
 hint_war_of_religions_hint_text_1: "Podczas [Concept('situation','sytuacji')|e] „[ShowSituationNameWithNoTooltip('war_of_religions')|l]” dwie [international_organizations_with_icon|el] starają się zapewnić sobie przetrwanie ich [Concept('religions_with_icon','religii')|e]. Miejscem zmagań jest [GetUniqueInternationalOrganization('hre').GetName]. [GetUniqueInternationalOrganization('protestant_union').GetName] i [GetUniqueInternationalOrganization('catholic_league').GetName] zaoferują ochronę [Concept('countries_with_icon','państwom')|e] cesarstwa. Rosnące napięcia pozwolą obu z nich spróbować osiągnąć religijną dominację, zmieniając wedle własnych preferencji [laws_with_icon|el] Świętego Cesarstwa Rzymskiego."
 hint_war_of_religions_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Dołącz do [Concept('international_organization','organizacji międzynarodowej')], którą chcesz poprzeć.\n@arrow_bonus_tier_2! Szukaj nowych [Concept('alliances_with_icon','sojuszy')|e] z krajami z zewnątrz.\n@arrow_bonus_tier_2! Jako [country|l] nienależący do związku [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip] szukaj [Concept('alliance','przymierza')] z przywódcą wybranej ligi religijnej"
 hint_war_of_religions_hint_text_3: "#T Jeśli stoisz na czele ligi religijnej:#!\n@arrow_bonus_tier_3! Wykorzystaj [Concept('action','działanie')|e] z [Concept('situation','sytuacji')|e] „#V $prepare_military_escalation$#!”, aby zapewnić sobie casus belli „[ShowCasusBelliName('cb_religious_superiority')|l]”\n@hint! Po użyciu go możesz wymusić [ShowPeaceTreatyTypeName('religious_supremacy')|l] i żądania twojej frakcji.\n@arrow_bonus_tier_2! Użyj [Concept('action','działania')] z [Concept('situation','sytuacji')|e] „#V $demand_member_removal$#!”, aby usunąć niebezpieczne państwa z wrogiej [Concept('international_organization','organizacji międzynarodowej')], zanim wybuchnie [war|l]."
 hint_war_of_religions_hint_text_4: "#T Dodatkowe wskazówki:#!\n@hint! Podczas [Concept('war','wojny')], w której casus belli to [ShowCasusBelliName('cb_religious_superiority')|l], [countries|l] będą cierpieć na [war_exhaustion|l].\n@hint! Jeśli #Y 80%#! wszystkich uczestników zapragnie [Concept('peace_with_icon','pokoju')|e], osiągnięty zostanie zamiast tego #Y pokój westfalski#!.\n@hint! Wymusi to zakończenie [Concept('war','wojny')] i pozwoli sprawić, że [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip] znów będzie cieszyć się pokojem religijnym."
 hint_war_of_religions_diplomatic: "$hint_advisor_salute_diplomatic$"
 hint_war_of_religions_administrative: "$hint_advisor_salute_administrative$"
 hint_war_of_religions_military: "$hint_advisor_salute_military$"
 ###Guelphs and Ghibellines
 hint_guelphs_and_ghibellines: "[GetSituationByKey('guelphs_and_ghibellines').GetNameWithNoTooltip]"
 hint_guelphs_and_ghibellines_hint_text: "$hint_guelphs_and_ghibellines_hint_text_1$\n\n$hint_guelphs_and_ghibellines_hint_text_2$"
 hint_guelphs_and_ghibellines_hint_text_1: "Podczas [Concept('situation','sytuacji')|e] [ShowSituationNameWithNoTooltip('guelphs_and_ghibellines')|l] [international_organizations_with_icon|e], [GetUniqueInternationalOrganization('guelphs_io').GetName|l] i [GetUniqueInternationalOrganization('ghibellines_io').GetName|l], walczą o wpływy w [Concept('region','regionie')|e] znanym jako [ShowRegionName('italy_region')]. [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle] to władza, w imieniu której walczą [GetUniqueInternationalOrganization('guelphs_io').GetName|l], [GetUniqueInternationalOrganization('ghibellines_io').GetName|l] zaś mają nadzieję, że większe wpływy osiągnie [GetUniqueInternationalOrganization('hre').GetLeaderTitle|l]."
 hint_guelphs_and_ghibellines_hint_text_2: "#T Jeśli stoisz po którejkolwiek ze stron:#!\n@arrow_bonus_tier_3! Zmuś [country_with_icon|el], aby dołączył do twojej frakcji, wykorzystując [casus_belli_with_icon|el] „[ShowCasusBelliName('cb_gag_force_country_into_faction')]”.\n@arrow_bonus_tier_2! Wspomóż członków swojej frakcji, aby kontrolować ich [tax_base_with_icon|el] poprzez stosunki dyplomatyczne, takie jak [alliances_with_icon|el] czy [guarantee_with_icon|el].\n@arrow_bonus_tier_2! Zwiększ [tax_base_with_icon|el] swojego [Concept('country','kraju')|e]."
 hint_guelphs_and_ghibellines_hint_text_3: "#T Potencjalne rozstrzygnięcia sytuacji:#!\n@hint! W przypadku zwycięstwa frakcji [GetUniqueInternationalOrganization('guelphs_io').GetName|l] wszystkie państwa w regionie Cesarskie [ShowRegionName('italy_region')] będą zmuszone opuścić [GetUniqueInternationalOrganization('hre').GetName] bez prawa powrotu do niego przez 50 lat.\nDodatkowo przywódca stronnictwa [GetUniqueInternationalOrganization('guelphs_io').GetName|l] będzie w stanie sformować $ITA_f$ bez wymogu posiadania określonych [Concept('locations','lokacji')|e] przez 200 lat.\n@hint! W przypadku zwycięstwa frakcji [GetUniqueInternationalOrganization('ghibellines_io').GetName|l] wszystkie państwa w regionie Cesarskie [ShowRegionName('italy_region')] będą zmuszone dołączyć do organizacji [GetUniqueInternationalOrganization('hre').GetName].\nDodatkowo przywódca stronnictwa [GetUniqueInternationalOrganization('ghibellines_io').GetName|l] będzie w stanie zażądać, by [hre_emperor|l] nadał mu tytuł króla Włoch ze znacznie złagodzonymi wymogami przez 200 lat, awansując [country_rank|el] kraju."
 hint_guelphs_and_ghibellines_diplomatic: "$hint_advisor_salute_diplomatic$"
 hint_guelphs_and_ghibellines_administrative: "$hint_advisor_salute_administrative$"
 hint_guelphs_and_ghibellines_military: "$hint_advisor_salute_military$"
 ###Colonial Revolution
 hint_colonial_revolution: "[GetSituationByKey('colonial_revolution').GetNameWithNoTooltip]"
 hint_colonial_revolution_hint_text: "$hint_colonial_revolution_hint_text_1$\n\n$hint_colonial_revolution_text_2$\n\n$hint_colonial_revolution_text_3$"
 hint_colonial_revolution_hint_text_1: "Gdy trwa [situation|el] „[ShowSituationNameWithNoTooltip('colonial_revolution')|l]”, [subjects_with_icon|el] kolonialni na świecie walczą o swoją niepodległość od [Concept('overlords_with_icon','suwerenów')|e]."
 hint_colonial_revolution_text_2: "#T Jeśli jesteś państwem kolonialnym:#!\n@arrow_bonus_tier_3! Stwórz [Concept('international_organization','organizację międzynarodową')|e]: federację kolonialną.\n@arrow_bonus_tier_2! Wykorzystaj [Concept('action','działanie')|e] z [Concept('situation','sytuacji')] „#V $seek_alliance_with_overlord_rival$#!”, aby otrzymać pomoc innych [Concept('countries_with_icon','państw')|e].\n@arrow_bonus_tier_1! Jeśli istnieje już federacja kolonialna, rozważ dołączenie do niej."
 hint_colonial_revolution_text_3: "#T Jeśli jesteś [Concept('overlord','suwerenem')|e]:#!\n@arrow_bonus_tier_3! Wykorzystaj [Concept('action','działanie')] z [Concept('situation','sytuacji')|e] „#V $establish_goods_act$#!”, aby zdobyć dodatkowe fundusze\n@arrow_bonus_tier_2! Rozważ wykorzystanie [Concept('action','działania')] z [Concept('situation','sytuacji')|e] #V $give_colony_representation$#!, jeśli kolonia stanie się nielojalna."
 hint_colonial_revolution_diplomatic: "$hint_advisor_salute_diplomatic$"
 hint_colonial_revolution_administrative: "$hint_advisor_salute_administrative$"
 hint_colonial_revolution_military: "$hint_advisor_salute_military$"
 ###Red Turban Rebellion
 hint_red_turban_rebellions: "[GetSituationByKey('red_turban_rebellions').GetNameWithNoTooltip]"
 hint_red_turban_rebellions_hint_text: "$hint_red_turban_rebellions_hint_text_1$\n\n$hint_red_turban_rebellions_hint_text_2$\n\n$hint_red_turban_rebellions_hint_text_3$"
 hint_red_turban_rebellions_hint_text_1: "[GetSituationByKey('red_turban_rebellions').GetName] pochłania całe $china$! [GetCountry('CHI').GetName] tracą przychylność niebios i niestabilność obejmuje ich [GetCountry('CHI').GetFlavorRank|l]!"
 hint_red_turban_rebellions_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! [GetCountry('CHI').GetName] muszą starać się wymusić [ShowPeaceTreatyTypeName('rtr_rein_in_rebellion')|l] na tych, którzy chcą wyrwać się spod ich władzy.\n@arrow_bonus_tier_2! [GetInternationalOrganizationType('red_turban_rebels').GetName] może wystosować [ShowPeaceTreatyTypeName('rtr_demand_occupied_territories')|l] wobec Chin.\n@arrow_bonus_tier_1! [GetCountry('CHI').GetLongName] doświadczy wielu [Concept('events_with_icon','wydarzeń')|e] związanych z potencjalnymi zdobywcami, którzy uzurpują sobie prawa do chińskich ziem."
 hint_red_turban_rebellions_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Możemy wykorzystać wiele wyjątkowych [Concept('actions_with_icon','działań')|e] w panelu [Concept('situation_with_icon','sytuacji')|e], aby pomóc w [Concept('integrate_with_icon','zintegrowaniu')|e] podbojów i zachowaniu wysokiej [Concept('control_with_icon','kontroli')|e].\n@hint!Jeśli zwyciężymy w sytuacji i utworzymy [GetFormableCountry('CHI').GetName], całe $china$ staną się naszymi [Concept('cores','lokacjami głównymi')|e]."
 hint_red_turban_rebellions_diplomatic: "„Ciągłe walki nie zostawiają miejsca na pogaduszki i dyplomację...”"
 hint_red_turban_rebellions_administrative: "„Mądrze byłby wykorzystać działania właściwe dla sytuacji. To cenne narzędzia, które pomogą nam odnieść zwycięstwo.”"
 hint_red_turban_rebellions_military: "„Teraz całe $china$ wiedzą, że tu jesteśmy!”"
 ###Rise of Timur
 hint_rise_of_timur: "[GetSituationByKey('rise_of_timur').GetNameWithNoTooltip]"
 hint_rise_of_timur_hint_text: "$hint_rise_of_timur_hint_text_1$\n\n$hint_rise_of_timur_hint_text_2$\n\n$hint_rise_of_timur_hint_text_3$"
 hint_rise_of_timur_hint_text_1: "Z głębi ziem znanych jako [ShowSubContinentName('central_asia')] przybywa blade widmo śmierci, którym jest [GetCharacter('chg_timur_lame_borjigin').GetName] i [GetCharacter('chg_timur_lame_borjigin').GetHerHis] [GetCountry('TIM').GetFlavorRank|l]. Biada tym, którzy staną mu na drodze!"
 hint_rise_of_timur_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Tak długo, jak żyje [GetCharacter('chg_timur_lame_borjigin').GetName], [GetCharacter('chg_timur_lame_borjigin').GetHerHis] [GetCountry('TIM').GetFlavorRank|l] korzysta z [Concept('modifier_with_icon','modyfikatora')|e] „[ShowModifier('timmy_wants_to_play')]”.\n@arrow_bonus_tier_2! Wspomniany [modifier_with_icon|el] sprawia, że [GetCharacter('chg_timur_lame_borjigin').GetShortNameWithNoTooltip] dokonuje automatycznej aneksji obleganych [Concept('locations_with_icon','lokacji')|e].\n@arrow_bonus_tier_1! [GetCountry('TIM').GetLongName] zyskuje dostęp do wyjątkowego [casus_belli_with_icon|el]."
 hint_rise_of_timur_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! [GetCountry('TIM').GetName] może wykorzystać wiele potężnych [Concept('actions_with_icon','działań')|e] w panelu [Concept('situation_with_icon','sytuacji')|e]."
 hint_rise_of_timur_diplomatic: "„Może da się porozumieć z hordą?”"
 hint_rise_of_timur_administrative: "„Rozważmy zbudowanie fortyfikacji w celu obrony naszych granic”."
 hint_rise_of_timur_military: "\"[GetCountry('TIM').GetName] zależy od potężnych piekielnych jeźdźców, historii podbojów i głodu, by rozewrzeć szczęki tak szeroko, by zmieściła się w nich cała [ShowContinentName('asia')]!\""
 ### Nanbokuchou
 hint_nanbokuchou: "[GetSituationByKey('nanbokuchou').GetNameWithNoTooltip]"
 hint_nanbokuchou_hint_text: "$hint_nanbokuchou_hint_text_1$\n\n$hint_nanbokuchou_hint_text_2$\n\n$hint_nanbokuchou_hint_text_3$"
 hint_nanbokuchou_hint_text_1: "[GetSituationByKey('nanbokuchou').GetName] to [situation_with_icon|el], która dzieli cały region [ShowRegionName('japan_region')] na szukające legitymizacji, rywalizujące dwory cesarskie – północny i południowy. Klany muszą wybierać strony, a konflikt na nowo ukształtuje cały wyspiarski naród."
 hint_nanbokuchou_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Wykorzystaj unikatowy [casus_belli_with_icon|e] „[ShowCasusBelliName('cb_nanbokuchou')]” do wszczęcia wojny w imieniu wybranego następcy cesarza.\n@arrow_bonus_tier_2! Możesz zmusić dwór przeciwnika do abdykacji, korzystając z [Concept('peace_treaty','traktatu pokojowego')|e] „[ShowPeaceTreatyTypeName('peace_nanbokuchou_force_imperial_abdication')]” i zapewnić dominację wybranemu przez siebie cesarzowi.\n@arrow_bonus_tier_2! Użyj [Concept('unit_abilities','umiejętności')|e] „[ShowUnitAbilityName('raid_clan_holdings')]” i „[ShowUnitAbilityName('raid_imperial_family_holdings')]”, by zwiększyć [war_score|e]\n@arrow_bonus_tier_1! Zwiększ wpływy swojego klanu za pomocą traktatu „[ShowPeaceTreatyTypeName('peace_expand_clan_influence')]”, aby przejąć wrogie [locations_with_icon|e]."
 hint_nanbokuchou_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Kluczowe jest wyczucie czasu. Mniejsze klany mogą wykorzystać konflikt do zdobycia przewagi nad rywalami.\n@hint! Rozważ równowagę sił przed dołączeniem do którejś ze stron."
 hint_nanbokuchou_diplomatic: "„To coś więcej niż wojna na miecze. Nasz wybór następcy określi nasze dziedzictwo.”"
 hint_nanbokuchou_administrative: "„Zachowanie porządku przy sprzymierzeniu się z jednym lub drugim dworem jest wyzwaniem, ale da nam niezrównane wpływy nad instytucją cesarstwa”."
 hint_nanbokuchou_military: "„Uderzaj bez wahania i uzyskaj legitymizację, zanim nasi rywale zdołają skonsolidować swoją władzę”."
 ### Sengoku
 hint_sengoku: "[GetSituationByKey('sengoku').GetNameWithNoTooltip]"
 hint_sengoku_hint_text: "$hint_sengoku_hint_text_1$\n\n$hint_sengoku_hint_text_2$\n\n$hint_sengoku_hint_text_3$"
 hint_sengoku_hint_text_1: "[GetSituationByKey('sengoku').GetName] to [situation_with_icon|el], w której cała [ShowRegionName('japan_region')] pogrążona jest w niemal nieustającej wojnie. Klany walczą o pierwszeństwo, podczas gdy $JAPANESE_SHOGUNATE_LEADER_MALE$ stara się zachować kontrolę nad krajem."
 hint_sengoku_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Tocz wojnę z unikatowym [casus_belli_with_icon|el] „[ShowCasusBelliName('cb_sengoku')]”, by rozwinąć swój klan.\n@arrow_bonus_tier_2! Jako $JAPANESE_SHOGUNATE_LEADER_MALE$ wykorzystaj działanie „[ShowGenericActionName('sengoku_revoke_clans_land')]” do osłabienia przerośniętych klanów oraz „[ShowGenericActionName('sengoku_limit_clans_autonomy')]”, by zmienić je w klany [Concept('building_based_with_icon','oparte na budowli')|e].\n@arrow_bonus_tier_1! Jeśli jesteś jednym z nich, możesz ogłosić niepodległość i stać się klanem [Concept('location_based_with_icon','opartym na lokacji')|e], używając działania „[ShowGenericActionName('sengoku_proclaim_clan_independence')]”."
 hint_sengoku_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Równowaga sił cały czas ulega zmianie. Wypatruj okazji do ataku osłabionych klanów.\n@hint! Jako $JAPANESE_SHOGUNATE_LEADER_MALE$ wczesne skonsolidowanie władzy znacząco ułatwi zjednoczenie regionu [ShowRegionName('japan_region')].\n@hint! Małe klany mogą skorzystać na rozgrywaniu większych rywali przeciw nim samym, aż do chwili, gdy możliwe stanie się uwolnienie od nich."
 hint_sengoku_diplomatic: "„Sojusze szybko się zmienią. Uważnie wybieraj przyjaciół, gdyż jutro mogą być wrogami.”"
 hint_sengoku_administrative: "„Trzeba silnego rządu, by kraj nie popadł w chaos”."
 hint_sengoku_military: "„Trwa era miecza. Atakuj szybko i mocno albo pochłoną cię inni.”"
 ##### Disaster Hints #####
 swift_end_string: "Jak w przypadku każdej katastrofy, pożądane jest szybkie zakończenie – długotrwale niepozałatwiane sprawy mogą przynieść niefortunne skutki."
 disaster_war_hint: "Dobrze jest pamiętać, że niektórzy z naszych sąsiadów nie życzą sobie w tych niespokojnych czasach rozejmów czy sojuszy – chcą bowiem realizować naszym kosztem swoje ekspansjonistyczne ambicje."
 ###Coup
 hint_coup_attempt: "$coup_attempt$ – wskazówki"
 hint_coup_attempt_hint_text: "$hint_coup_attempt_hint_text_1$\n\n$hint_coup_attempt_hint_text_2$\n\n$hint_coup_attempt_hint_text_3$"
 hint_coup_attempt_hint_text_1: "Ambitni członkowie naszego [Concept('court_with_icon','dworu')|e], zarówno mężczyźni, jak i kobiety, pragną niedostępnej dla siebie władzy. Wykorzystują podłe sztuczki, aby wynosić na tron swoje marionetki, dyktować [laws_with_icon|el] oraz zapewniać sobie [privileges_with_icon|el]. Ta [disaster_with_icon|el] będzie trwać, dopóki spiskowcy nie znikną, a ich przywódca nie przejmie władzy lub nie osiągniemy wystarczającej [Concept('legitimacy_with_icon','prawomocności')|e]. $swift_end_string$"
 hint_coup_attempt_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Możemy rozważyć „[ShowGenericActionName('conduct_investigation')]”. Zajmie to nieco czasu, ale zdekonspiruje część ze spiskowców, co ułatwi nam ich przetrzebienie.\n@arrow_bonus_tier_2! Zadbajmy o wysoką [stability_with_icon|el]. Im będzie wyższa, tym niższy stanie się próg [Concept('legitimacy_with_icon','prawomocności')|e] niezbędnej do zakończenia tej [Concept('disaster_with_icon','katastrofy')|e].\n@arrow_bonus_tier_1! Jeśli sytuacja zmieni się w bardziej desperacką, możemy zdecydować się na [ShowGenericActionName('call_private_council')|l] lub [ShowGenericActionName('execute_court_member')|l]. To pierwsze pozwoli nam zlecić [Concept('estates_with_icon','stanom')|e] wykrycie spiskowców w zamian za [privileges_with_icon|el] lub [gold_with_icon|el]. To drugie [action_with_icon|el] pozwoli stracić dowolną [character_with_icon|el] na naszym [Concept('court_with_icon','dworze')|e], jeśli zaczniemy podejrzewać ją o członkostwo w spisku."
 hint_coup_attempt_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Podczas tej [Concept('disaster_with_icon','katastrofy')|e] może dojść do losowych [Concept('events_with_icon','wydarzeń')|e], które ujawnią potencjalnych spiskowców. Mądrze będzie zwrócić na nie szczególną uwagę, by podjąć dobrze rozważoną decyzję. Nie byłoby optymalnym rozwiązaniem pozbawienie głowy najlepszego [Concept('cabinet_member_with_icon','członka gabinetu')|e] bez powodu."
 hint_coup_attempt_diplomatic: "„Nadszedł czas na potwierdzenie naszych stosunków z sąsiednimi [Concept('countries_with_icon','krajami')|e] i stworzenie silnych granic. Ostatnim, czego potrzebujemy, jest zagrożenie zarówno z wewnątrz, jak i z zewnątrz”."
 hint_coup_attempt_administrative: "„Ktoś z pozostałych doradców może być spiskowcem. Kto wie?”"
 hint_coup_attempt_military: "„$disaster_war_hint$ Pamiętaj, że działania wyprzedzające to po prostu #italic zawarcie pokoju z zaskoczenia#!. Dokonywane z użyciem dużej siły”."
 ###Crisis of the Chinese Dynasty
 hint_crisis_of_the_chinese_dynasty: "$crisis_of_the_chinese_dynasty$ – wskazówki"
 hint_crisis_of_the_chinese_dynasty_hint_text: "$hint_crisis_of_the_chinese_dynasty_hint_text_1$\n\n$hint_crisis_of_the_chinese_dynasty_hint_text_2$"
 hint_crisis_of_the_chinese_dynasty_hint_text_1: "Niebiosa obdarowywały nas niegdyś światłem i dostatkiem. Niedawne wydarzenia, głód oraz zniszczenie sprawiły, że $china$ i nasza władza wkroczyły w mroczną epokę. [disaster_with_icon|e] ta będzie trwać, dopóki nie wydźwigniemy się z niej poprzez skuteczną reformę naszej administracji lub dopóki [GetUniqueInternationalOrganization('middle_kingdom').GetName] nie przejdzie w inne ręce. $swift_end_string$"
 hint_crisis_of_the_chinese_dynasty_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! [ShowCabinetActionName('reform_taxation_system')] w wykonaniu naszego [Concept('cabinet_with_icon','gabinetu')|e] to jedno z rozwiązań. Zajmie nieco czasu, jednak skieruje nas na drogę ku zakończeniu [Concept('disaster_with_icon','katastrofy')|e].\n@arrow_bonus_tier_2! Dbaj, aby [celestial_authority_gc_with_icon|el] pozostawała na wysokim poziomie. Jeśli osiągnie wartość #G 90#! lub wyższą, [disaster_with_icon|el] zakończy się pokojowo.\n@arrow_bonus_tier_1! [disaster_with_icon|e] odblokowuje wiele nowych [Concept('actions_with_icon','działań')|e], takich jak [ShowGenericActionName('cmd_reform_the_cabinet')|l], [ShowGenericActionName('cmd_restore_stability')|l] czy [ShowGenericActionName('cmd_strengthen_crown')|l]. Wszystkie stanowią alternatywny sposób na pozytywne zakończenie tego niespokojnego okresu w razie, gdybyśmy nie zdołali odpowiednio ponieść naszej [Concept('celestial_authority_gc_with_icon','niebiańskiej władzy')|e]."
 hint_crisis_of_the_chinese_dynasty_diplomatic: "„Nadszedł czas na potwierdzenie naszych stosunków z [Concept('countries_with_icon','krajami')|e], z których składa się [GetUniqueInternationalOrganization('middle_kingdom').GetName], żeby zapewnić tej wspaniałej instytucji dalsze istnienie.\n\nGdy zabraknie wzajemnego szacunku, cóż odróżnia ludzi od bestii?”"
 hint_crisis_of_the_chinese_dynasty_administrative: "„Jeśli zechcemy zakończyć tę [Concept('disaster_with_icon','katastrofę')|e] poprzez reformę naszej administracji, mądrze będzie przydzielić te niezwykle trudne zadania uzdolnionym [Concept('cabinet_members_with_icon','członkom gabinetu')|e].\n\nStoimy na rozdrożu. Nasz wybór sprowadza się do wybrania ekonomii albo agonii”."
 hint_crisis_of_the_chinese_dynasty_military: "„$disaster_war_hint$\n\nChaos stanowi nieraz również szansę!”"
 hint_turmoil_in_brandenburg: "$turmoil_in_brandenburg$"
 hint_turmoil_in_brandenburg_hint_text: "$hint_turmoil_in_brandenburg_hint_text_1$\n\n$hint_turmoil_in_brandenburg_hint_text_2$\n\n$hint_turmoil_in_brandenburg_hint_text_3$"
 hint_turmoil_in_brandenburg_hint_text_1: "Katastrofa „$turmoil_in_brandenburg$” stawia przed nami dwa zadania. Najpierw musimy skonsolidować naszą dynastię rządzącą, zwiększając wynik zaangażowania do 100 lub występując do Cesarza o intronizowanie nowej dynastii w przypadku, gdy osiągnięte zostanie 100 pkt. zaniedbania. Po roku 1365 w naszych [Concept('provinces','prowincjach')|e] zaczną pojawiać się niszczący kraj raubritterzy. Katastrofa będzie mogła dobiec końca, gdy wystarczająca część naszego kraju (75% posiadanych [Concept('provinces','prowincji')]) zostanie uwolniona spod terroru raubritterów wskutek [Concept('cabinet_action','działania gabinetu')|e] „$pru_deal_with_robber_barons$”."
 hint_turmoil_in_brandenburg_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_1! Zwiększ wyniki zaangażowania lub zaniedbania poprzez zdarzenia powiązane z katastrofą\n@arrow_bonus_tier_1! Rozważnie powiększaj swoje terytorium, by nie dać raubritterom nowych krain do zajmowania"
 hint_turmoil_in_brandenburg_hint_text_3: "#T Dodatkowe wskazówki:#! Odzyskaj utraconą [Concept('control','kontrolę')] stosownym [Concept('cabinet_action','działaniem gabinetu')|e]\n@hint! Zawiązuj [Concept('alliances','sojusze')|e] zdolne pomóc podczas potencjalnej [Concept('civil_war','wojny domowej')|e]"
 hint_turmoil_in_brandenburg_hint_text_4: "#T Jak osiągnąć różne wyniki dynastyczne:#!\n@hint! Utrzymasz przy władzy dynastię panującą, osiągając 100 punktów wskaźnika „$bra_wittelsbacher_investment_var$”\n@hint! Będziesz w stanie wprowadzić dynastię Hohenzollernów, mając -100 wskaźnika „$bra_wittelsbacher_neglect_var$”, jeśli cesarz ma dorosłego dziedzica lub dziedziczkę. Kiedy ta osoba będzie rządzić obydwoma państwami jako cesarz rzymski, będzie w stanie osadzić członka dynastii Hohenzollernów na twoim tronie."
 ### Construction missing input
 hint_war: "Wojna"
 hint_war_hint_text: "$hint_war_hint_text_1$\n\n$hint_war_hint_text_2$\n\n$hint_war_hint_text_3$"
 hint_war_hint_text_1: "[war_with_icon|e] rozpoczyna się, kiedy dany [country_with_icon|el] ją wypowie, zaś kończy się, gdy obie strony zawrą [peace_treaty_with_icon|el]. Każda [war|l] ma dwóch [Concept('war_leaders_with_icon','przywódców wojennych')|e], ale mogą brać w niej udział również inni [Concept('war_allies_with_icon','sojusznicy wojenni')|e]. [war] dobiegnie końca, kiedy [war_leaders|l] podpiszą [peace_treaty|l]. Pozostali uczestnicy mogą podpisać odrębne [peace_treaties|l] z wrogim [Concept('war_leader','przywódcą wojennym')]."
 hint_war_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Rozważ zdobycie [casus_belli_with_icon|el], zanim wypowiesz [Concept('war','wojnę')]. Możemy o niego poprosić podczas sesji [Concept('parliament_with_icon','parlamentu')|e] lub go sfałszować przeciwko [Concept('rivals_with_icon','rywalom')|e].\n@arrow_bonus_tier_3! Kiedy rozpocznie się [war|l], zwróć uwagę na [casus_belli|l] i [war_goal_with_icon|el], ponieważ są kluczowe do zdobycia [Concept('war_score_with_icon','wyniku wojennego')|e] oraz zapewnienia, że zawrzesz korzystny [peace_treaty_with_icon|el].\n@arrow_bonus_tier_3! Zależnie od casus belli będziemy zdobywać [war_score_with_icon|e] na różne sposoby. Oto najpospolitsze źródła [Concept('war_score','wyniku wojennego')]:\n @arrow_bonus_tier_1! Zajęcie wrogiej [Concept('capital_with_icon','stolicy')|e].\n @arrow_bonus_tier_1! Kontrola [Concept('locations_with_icon','lokacji')|e], do której wysunęliśmy roszczenia.\n @arrow_bonus_tier_1! Zajęcie wrogich [Concept('forts_with_icon','fortów')|e].\n @arrow_bonus_tier_1! Pokonywanie w [Concept('battle','bitwie')|e] wrogich [Concept('armies_with_icon','armii')|e].\n @arrow_bonus_tier_1! [blockade_with_icon|e] wrogich [Concept('ports_with_icon','portów')|e].\n@arrow_bonus_tier_3! Zwracaj uwagę na [war_exhaustion_with_icon|e], bowiem może znacząco osłabić zarówno naszą gospodarkę, jak i zdolność do prowadzenia wojen."
 hint_war_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Podczas [Concept('war','wojny')|e] obie strony mogą [Concept('occupy_with_icon','okupować')|e] wrogie [locations_with_icon|el], jednak terytoria nie zmieniają tak naprawdę właściciela aż do zawarcia [Concept('peace_treaty_with_icon','traktatu pokojowego')|e], który ratyfikuje podboje.\n@hint! Im dłużej ciągnie się wojna, tym bardziej jej uczestnicy będą skłonni do zaakceptowania propozycji pokoju."
 hint_war_diplomatic: "„Wojna może być niezwykle dochodowym przedsięwzięciem, lecz także szybką drogą ku katastrofie”."
 hint_war_administrative: "„Kiedy handel nie jest w stanie zaspokoić zapotrzebowania na kluczowe zasoby, wojna staje się właściwie nieunikniona”."
 hint_war_military: "„Jedyną gwarancją naszego bezpieczeństwa jest rozrastanie się szybciej niż sąsiedzi”."
 ### Construction missing input
 hint_battle: "Bitwy"
 hint_battle_hint_text: "$hint_battle_hint_text_1$\n\n$hint_battle_hint_text_2$\n\n$hint_battle_hint_text_3$"
 hint_battle_hint_text_1: "Kiedy [army_with_icon|el] znajdzie się w tej samej [Concept('location_with_icon','lokacji')|e], co wroga [army|l], rozpocznie się [battle_with_icon|el]. Ta z nich, która była w danym miejscu pierwsza, zostanie [Concept('defender_with_icon','obrońcą')|e] i zdobędzie korzyści z modyfikatorów terenu. Bitwa dobiega końca, gdy jedna ze stron straci całe [morale_with_icon|el] lub wszystkie [regiments_with_icon|el] – cokolwiek nastąpi pierwsze."
 hint_battle_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Możesz sprowadzać sąsiadujące armie, aby wzmacniać siły toczące obecnie bitwę. Jeśli dotrą na czas, dołączą do walki jako świeże odwody.\n@arrow_bonus_tier_2! Upewnij się, że twoje [armies_with_icon|el] mają dobrego [Concept('commander_with_icon', 'dowódcę')|e], zanim poślesz je do [Concept('battle','bitwy')].\n@arrow_bonus_tier_2! Zawsze miej na uwadze teren w danej [Concept('location','lokacji')]. [attacker_with_icon|e] otrzymuje kary do rzutów kostką zależne od topografii oraz roślinności w danej lokacji. Uważnie dobieraj pola bitew!\n@arrow_bonus_tier_1! Czasem mądrze jest w porę dokonać [Concept('retreat_with_icon','odwrotu')|e], zanim wojska zostaną doszczętnie rozbite przez przeważające siły wroga."
 hint_battle_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Przegrana bitwa niekoniecznie oznacza koniec [Concept('war_with_icon','wojny')|e]. Po porażce możesz dokonać [Concept('retreat','odwrotu')] w bezpieczne miejsce, by odbudować morale i być może zatrudnić najemników, po czym spróbować ponownie w bardziej dogodnych warunkach (dotyczy to również wroga! Nie świętuj przedwcześnie zwycięstwa).\n@hint! Jeśli [location|l] posiada [fort_with_icon|el], strona go kontrolująca zawsze będzie w niej [Concept('defender','obrońcą')] niezależnie od tego, kto przybył pierwszy."
 hint_battle_diplomatic: "„Niech nasi wrogowie zginą wskutek osłabienia i głodu, zanim ich zaatakujemy”."
 hint_battle_administrative: "„Szybkie zwycięstwo na polu bitwy pozwoli przejść do ofensywy bez wystawiania naszych miast i miasteczek na ryzyko złupienia”."
 hint_battle_military: "„Dobry generał może zdecydować o wyniku bitwy”."
 ### Construction missing input
 hint_siege_and_occupation: "Okupacja i oblężenie"
 hint_siege_and_occupation_hint_text: "$hint_siege_and_occupation_hint_text_1$\n\n$hint_siege_and_occupation_hint_text_2$\n\n$hint_siege_and_occupation_hint_text_3$"
 hint_siege_and_occupation_hint_text_1: "Kiedy [army_with_icon|el] wkracza do [Concept('enemy_with_icon','wrogiej')|e] [Concept('location_with_icon','lokacji')|e], podejmie próbę jej [Concept('occupy_with_icon','okupacji')|e]. Jeśli nie ma tam [Concept('fort_with_icon','fortu')|e], zajmie to kilka dni, ale jeśli jest obecny, rozpocznie się [siege_with_icon|el].\n\nOblężenia mogą trwać miesiącami, a nawet latami. Zależy to od wielu czynników jak poziom fortyfikacji, obecność artylerii, [ability_with_icon|el] prowadzącego oblężenie [Concept('general_with_icon','generała')|e] i nie tylko.\n\nKiedy garnizon się podda, [location|l] stanie się [Concept('occupied','okupowana')], zaś [fort|l] przejdzie pod kontrolę zwycięzcy.\n\nOkupowane lokacje są pokazane na mapie przecinającymi się pasami i nie są własnością okupującego, dopóki podbój nie zostanie ratyfikowany w ramach traktatu pokojowego."
 hint_siege_and_occupation_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Dopilnuj, by [army_with_icon|el] mogła przetrwać oblężenie, zanim je rozpoczniesz.\n@arrow_bonus_tier_1! Nie miej oporów przed wycofaniem się z oblężenia, jeśli zbliża się niebezpieczna armia wroga."
 hint_siege_and_occupation_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Miej oko na swoje armie podczas oblężenia, nawet jeśli obecnie nie ma w pobliżu żadnych wojsk wroga."
 hint_siege_and_occupation_diplomatic: "„Przedłużające się oblężenie może okazać się zgubne dla miejscowej ludności i dobrobytu okolicy”."
 hint_siege_and_occupation_administrative: "„Powinniśmy rozmieszczać nasze forty w sposób, który zabezpieczy nasze główne miasta przed najeźdźcami, a jednocześnie pozwoli szybko je wyzwolić w razie oblężenia”."
 hint_siege_and_occupation_military: "„Obleganie i obrona kluczowych pozycji, takich jak wąskie gardła na terenach górskich, mogą zdecydować o wyniku wojny”."
 ### Construction missing input
 hint_lacks_of_rivals: "Potencjalni rywale"
 hint_lacks_of_rivals_hint_text: "$hint_lacks_of_rivals_hint_text_1$\n\n$hint_lacks_of_rivals_hint_text_2$\n\n$hint_lacks_of_rivals_hint_text_3$"
 hint_lacks_of_rivals_hint_text_1: "[rivals_with_icon|e] to [countries_with_icon|el], które publicznie uznaliśmy za wrogie wobec naszych interesów. Cel takiego aktu jest dwojaki: stanowi narzędzie dyplomatyczne, ponieważ zbliża nas to do ich własnych wrogów. Jest też narzędziem ofensywnym, bowiem pozwala na fałszowanie [casus_belli_with_icon|el] przeciw [Concept('rivals','rywalom')] oraz interwencję w toczonej przeciwko nim [Concept('war_with_icon','wojnie')|e]."
 hint_lacks_of_rivals_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Przyjrzyj się rywalizacjom i [Concept('alliances_with_icon','sojuszom')|e] naszych sąsiadów, po czym wybierz takich samych rywali jak kraj, z którym chcesz się sprzymierzyć. Uważaj jednak, aby nie zdobyć przy okazji zbyt potężnych wrogów.\n@arrow_bonus_tier_2! Przed wykonaniem własnego ruchu możesz poczekać, aż inne [Concept('countries','kraje')] zadeklarują swoich [Concept('rivals','rywali')]. Pozwoli to na uniknięcie rozzłoszczenia niewłaściwych [Concept('countries','państw')].\n@arrow_bonus_tier_2! Zbuduj [Concept('spy_network_with_icon','siatkę szpiegowską')|e] u [Concept('rivals','rywali')], aby sfabrykować [casus_belli_with_icon|el] przeciwko nim."
 hint_lacks_of_rivals_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Nie musisz deklarować maksymalnej liczby rywali. Pamiętaj, że możesz kliknąć prawym przyciskiem myszy #W alert#!, aby go odrzucić.\n@hint! Posiadanie rywali pozwoli też na wzywanie cię na ich wojny po stronie przeciwnika. Jednak uważaj: nasi [rival_enemies_with_icon|el] będą mogli z kolei interweniować w naszych."
 hint_lacks_of_rivals_diplomatic: "„Nigdy nie jest mądrze robić sobie wrogów bez potrzeby, lecz wybieranie tych samych rywali, co sąsiedzi, może nam pomóc w stworzeniu z nimi sojuszu”."
 hint_lacks_of_rivals_administrative: "„Wrogowie naszych rywali powinni być naszymi przyjaciółmi”."
 hint_lacks_of_rivals_military: "„Wybór odpowiednich rywali zapewnia szerokie możliwości tym, którym starcza odwagi, by z nich skorzystać”."
 ### Construction missing input
 hint_control: "Bliskość i kontrola"
 hint_control_hint_text: "$hint_control_hint_text_1$\n\n$hint_control_hint_text_2$\n\n$hint_control_hint_text_3$"
 hint_control_hint_text_1: "[control_with_icon|e] to jeden z najważniejszych atrybutów, jakie posiadają nasze [locations_with_icon|el]. Reprezentuje ona zasięg władzy centralnej i decyduje, w jakim stopniu [taxes_with_icon|el] uszczuplą [wealth_with_icon|el], które generuje dana [location]. Wszelkie [wealth] znajdujące się poza obszarem, jaki obejmuje [control], trafia bezpośrednio do zasobów, którymi dysponują [estates_with_icon|e], całkowicie omijając [taxes]. Parametr [control] określa również, jak liczne [levies_with_icon|el] może wystawić dana [location].\n\nKontrola lokacji zmienia się co miesiąc, dążąc do wartości, której docelowym pułapem jest [max_control_with_icon|e]. [siege_with_icon|el] lub inne wydarzenia mogą ją tymczasowo obniżyć, jednak z czasem lokacja powróci do swojego maksymalnego poziomu.\n\nGłówne źródło, z którego bierze się [max_control], to [proximity_icon] [proximity|el]. Nasza [capital_icon] [capital|el] zawsze zachowa bliskość na poziomie #W 100%#!, a wszystkie pozostałe lokacje obliczają swoją własną bliskość na podstawie odległości od stolicy. Bliskość rozprzestrzenia się drogą lądową i morską, przy czym o wiele wydajniej następuje to poprzez [road_icon] [roads_with_icon|le], otwarty teren oraz [seazones_icon] [seazones|el], w których panuje wysoka [maritime_presence_icon] [maritime_presence|el], z kolei proces ten utrudniają góry, lasy i obszary takie jak [seazones], gdzie grasują [pirates_with_icon|el]. Istnieją również inne czynniki mające wpływ na maksymalną kontrolę, a są to na przykład [pop_satisfaction_with_icon|el], [integration_status_with_icon|el] czy też niektóre specjalne [buildings].\n\nNie tylko [capital] zapewnia wspomnianą bliskość. Źródłem, z którego promieniuje [proximity], może być również specjalna [building|el] – [ShowBuildingTypeName('local_governor')]."
 hint_control_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Skup wysiłki budowlane na [Concept('capital','stolicy')] i otaczające ją [Concept('locations','lokacje')|e], ponieważ w naturalny sposób będą od początku gry cieszyć się najwyższą [Concept('control','kontrolą')].\n@arrow_bonus_tier_2! Buduj [road_icon] [roads|el] z poziomu #W panelu lokacji#!, aby połączyć [Concept('capital','stolicę')] z najbogatszymi miastami.\n@arrow_bonus_tier_2! Dobrą inwestycją w regionach o dużym [Concept('wealth','bogactwie')] i niskiej [Concept('control','kontroli')] może być [ShowBuildingTypeName('local_governor')]. Miejscem dla tego urzędu może być jedynie [ShowLocationRankName('city')] połączone [Concept('road','drogą')] z twoją [Concept('capital','stolicą')] i będzie służyć za drugą stolicę. Utrzymanie takiej instytucji jest dość kosztowne, więc upewnij się, że korzyści uzasadniają taki wydatek!\n@arrow_bonus_tier_2! Lokacje, w których znajduje się [port_icon] [port|el], mogą mieć łatwiejszy dostęp do [Concept('capital','stolicy')] drogą morską, zwłaszcza jeśli mają wysoką [harbor_capacity_with_icon|el]. Możesz ją zwiększyć w kluczowych [Concept('locations','lokacjach')] na wybrzeżu za pomocą [Concept('building','budowli')|e], takich jak [ShowBuildingTypeName('wharf')|l] czy [ShowBuildingTypeName('dock')|l].\n@arrow_bonus_tier_1! Nowo [Concept('conquered_with_icon','podbite')|e] [locations|l] będą mieć na początku #W 0%#! [Concept('control','kontroli')], a osiągnięcie przez nie maksymalnej wartości może zająć wiele czasu. Przyspieszysz ten proces, umieszczając w [Concept('location','lokacji')] [Concept('army_with_icon','armię')|e] lub wykorzystując [cabinet_action_icon] [cabinet_action|el] „[ShowCabinetActionName('increase_control_province')|l]”."
 hint_control_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Średnia kontrola, jaką dysponuje [country], ma ogromny wpływ na poziom [Concept('crown_power_with_icon','wpływów korony')|e]. Rozległy [Concept('country','kraj')] o niskiej [Concept('control','kontroli')] napotka trudności i nie zdoła skutecznie zarządzać swoimi zasobami oraz usatysfakcjonować [estates], zaśg małe, lecz scentralizowane państwo potrafi zdziałać więcej, niż wskazywałby na to jego rozmiar. Warto pamiętać, że bezmyślna ekspansja może zrujnować [country]! Mechanikę [Concept('crown_power','wpływów korony')] opisują dokładniej [Link('hints', 'selected_hint = hint_crown_power', 'wskazówki co do wpływów korony')].\n@hint!Pamiętaj też, że [location] z poziomem #W 0%#! [Concept('control','kontroli')] nie wygeneruje przychodu, na który składają się [taxes], ale zamieszkujące tam [estates] nadal będą czerpać zyski. Bogate i zadowolone [estates] potrafią zresztą samodzielnie rozwijać naszą gospodarkę.\n@hint!Sieć drogową należy planować ostrożnie, ponieważ pojedyncza, dobrze usytuowana [road] przecinająca łańcuch górski potrafi poprawić [proximity] dla wielu oddalonych [Concept('locations','lokacji')] po drugiej stronie.\n@hint!Niektóre [government_reforms_with_icon|e], jak na przykład [ShowGovernmentReformName('harbor_administration')], pozwalają zbudować na zamorskim terytorium urząd zwany [ShowBuildingTypeName('naval_governor')]. Tacy gubernatorzy działają jak pomocnicze [capitals] i pomagają rozprzestrzeniać [proximity] na odległe krainy. Gubernatorzy morscy mogą powstać wyłącznie tam, gdzie znajduje się nadmorskie [ShowLocationRankName('city')], które nie ma połączenia lądowego ze [Concept('capital','stolicą')].\n@hint!Więcej informacji na temat tego, jak [proximity] zależy od [Concept('maritime_presence_with_icon','obecności morskiej')|e], oferuje [Link('hints', 'selected_hint = hint_maritime', 'wskazówka dotycząca obecności morskiej')].#!"
 hint_control_diplomatic: "„Wysoka kontrola pozwala na nawracanie i asymilację najbardziej... #italic niesfornych#! członków naszego społeczeństwa”."
 hint_control_administrative: "„Lokacja poza naszą kontrolą nie będzie przynosić nam zbytnio podatków”."
 hint_control_military: "„Musimy kontrolować nasze ziemie, jeśli chcemy przeprowadzać pobór wśród ludności”."
 ### Crown Power
 hint_crown_power: "Wpływy korony"
 hint_crown_power_hint_text: "$hint_crown_power_hint_text_1$\n\n$hint_crown_power_hint_text_2$\n\n$hint_crown_power_hint_text_3$"
 hint_crown_power_hint_text_1: "Nasze [crown_power_with_icon|el] reprezentują wpływy rządu w posiadanych granicach. Jako [ShowEstateTypeName('crown_estate')|l] wykorzystujemy, podobnie jak inne [estates_with_icon|e], zasoby naszego kraju – interesy pozostałych grup mogą pozostawać w sprzeczności z naszymi.\n\nWyższe wpływy korony sprawią, że łatwiej będzie nam wprowadzać nowe [laws_with_icon|el], [cabinet_with_icon|el] będzie wydajniejszy, zaś podstawowe poparcie, jakiego udziela nam [parliament_with_icon|el], będzie wyższe. Co jednak najważniejsze, wpływy korony decydują, w jakim stopniu państwo dzieli się ze [Concept('estates','stanami')|e] zyskami oraz kosztami, jakie niosą ze sobą [trade_with_icon|el] i [food_with_icon|el].\n\nWpływy korony zależą przede wszystkim od liczby [Concept('privileges_with_icon','przywilejów')|e] nadanych [Concept('estates','stanom')|e]. Ważna jest też [control_with_icon|e], jaką mają najgęściej zaludnione [locations_with_icon|e]."
 hint_crown_power_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Zwiększaj kontrolę w [Concept('locations','lokacjach')|e], budując [roads_with_icon|el], z których korzystać będzie [capital_with_icon|e]. \n@arrow_bonus_tier_2! Wycofaj [privileges|l] naszych najpotężniejszych [Concept('estates','stanów')], kiedy [stability_with_icon|el] znajdzie się na wysokim poziomie, jednak uważaj na ich [Concept('estate_satisfaction','satysfakcję stanową')|e]. Rozgniewany [estate|l] może w przyszłości narobić problemów.\n@arrow_bonus_tier_1! [cabinet_action_with_icon|e] „[ShowCabinetActionName('strengthen_government')|l]” sprawi, że [Localize(Player.GetGovernment.GetGovernmentType.GetPowerConcept)|l] wzrośnie.\n@arrow_bonus_tier_1! Zadbaj, aby w [Concept('capital','stolicy')|e] powstały [ShowBuildingTypeName('royal_court')|l] lub [ShowBuildingTypeName('sergeantry')|l]."
 hint_crown_power_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Przy 50% wpływów korony połowę kosztów i zysków, jakie niosą ze sobą [trade|l] i [food|l], przejmować będzie [treasury_with_icon|el], zaś reszta zostanie rozdzielona między [estates|l] – o proporcjach zdecydują odpowiednie dla nich [estate_power_with_icon|el].\n@hint! Wpływy korony są zwykle bardzo niskie na początku gry, zwłaszcza w przypadku większych [Concept('countries','krajów')].\n@hint! Przyszłe [advances_with_icon|el] odblokują dodatkowe [buildings|l] i inne premie do [Concept('crown_power','wpływów korony')]."
 hint_crown_power_diplomatic: "„Gdy wpływy korony są niskie, jesteśmy zdani na łaskę i niełaskę stanów”."
 hint_crown_power_administrative: "„Zwiększenie wpływów korony pomoże nam czerpać korzyści z handlu”."
 hint_crown_power_military: "„Scentralizowane państwo może realizować o wiele większe zamiary”."
 ### Estates
 hint_estates: "Stany"
 hint_estates_hint_text: "$hint_estates_hint_text_1$\n\n$hint_estates_hint_text_2$\n\n$hint_estates_hint_text_3$"
 hint_estates_hint_text_1: "Stany reprezentują partykularne interesy grup społecznych w obrębie naszych granic. Każdy stan ma wyrażone procentowo [estate_power_with_icon|el], które mierzą jego siłę w porównaniu z tą, jaką dysponują pozostałe stany oraz [ShowEstateTypeName('crown_estate')|l] w dystrybucji sumy zerowej.\n\nStany wywodzą swoje wpływy głównie z [Concept('population_with_icon','populacji')|e] – każdy [pop_type_with_icon|el] popiera jeden konkretny [estate|l]. Wpływy stanowe modyfikują ponadto istniejące [laws_with_icon|el] i [privileges_with_icon|el].\n\nWpływy danego stanu określają, jaką ma władzę w [Concept('parliament_with_icon','parlamencie')|e], wpływa na możliwość jego [Concept('tax_with_icon','opodatkowania')|e] oraz decyduje o dystrybucji zysków oraz kosztów, jakie niosą [trade_with_icon|el] i [food_with_icon|el].\n\nStany mają też poziom [Concept('estate_satisfaction_with_icon','satysfakcji')|e], który mierzy ich posłuszeństwo rządowi. Każdy stan zapewnia inny korzystny modyfikator, jeśli jego satysfakcja znajduje się na wysokim poziomie, lub karę, jeśli wynosi poniżej #W 50%#!. Kiedy [estate_satisfaction|l] stanu jest zbyt niska, jego [pops_with_icon|el] mogą zacząć szykować [Concept('rebellions_with_icon','bunty')|e]. Co najbardziej niepokojące, stan mający mniej niż #W 25%#! satysfakcji przestanie zapewniać [Concept('levies_with_icon','poborowych')|e]."
 hint_estates_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Dla większości [Concept('countries','krajów')] głównym źródłem [Concept('income_with_icon','dochodów')|e] są ściągane od [Concept('estates','stanów')] [taxes_with_icon|el]. Możesz ustalić wysokość podatków lub je zautomatyzować w @economy_panel! #W panelu budżetu#!.\n@arrow_bonus_tier_2! Wszelkie wpływy, jakie posiadają stany, zmniejszają [crown_power_with_icon|el]. Możesz osłabić ich władzę, odbierając im [privileges_with_icon|el] w @government_panel! #W zakładce stanów#!.\n@arrow_bonus_tier_1! Buntowniczy stan można obłaskawić, obniżając [taxes|l], zapewniając mu [privilege|l] lub przekupując w @government_panel! #W zakładce stanów#!."
 hint_estates_hint_text_3: "#T Dodatkowe podpowiedzi:#!\n@hint! To do stanów trafia [tax_base_with_icon|el] z naszych [Concept('locations_with_icon','lokacji')|e]. My dostajemy tylko tyle, ile zdołamy od nich ściągnąć w formie [Concept('tax','podatków')|e].\n@hint! [countries] w początkowej fazie gry są silnie uzależnione podczas [Concept('wars_with_icon','wojen')|e] od [Concept('levies_with_icon','poborowych')|e], które są zapewniane przez [estates|l]. Jest tak aż do czasu, kiedy pojawią się nowocześniejsze [regular_regiments_with_icon|el]."
 hint_estates_diplomatic: "„Silne duchowieństwo zwiększa stabilność państwa”."
 hint_estates_administrative: "„Silne mieszczaństwo zwiększa bogactwo naszego kraju oraz skalę handlu”."
 hint_estates_military: "„Silna arystokracja zwiększa rozmiary i potęgę naszych armii”."
 ### Markets
 hint_markets: "Rynki"
 hint_markets_hint_text: "$hint_markets_hint_text_1$\n\n$hint_markets_hint_text_2$\n\n$hint_markets_hint_text_3$"
 hint_markets_hint_text_1: "[markets_with_icon|e] to serce gospodarki w grze #italic Europa Universalis V#!. Wszelkie lokacje należą do jednego z rynków, gdzie sprzedają i kupują towary, które zaspokajają [pop_needs_with_icon|el] oraz zaopatrują [buildings_with_icon|el] i [constructions_with_icon|el]. Sprzedając towar na swoim rynku, lokacja generuje [Concept('tax_base_with_icon','podstawę opodatkowania')|e] dla [Concept('estates_with_icon','stanów')|e]. Rząd następnie pobiera część w formie [Concept('taxes_with_icon','podatków')|e]."
 hint_markets_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! @economy_panel! [Link('trade', 'subtab = markets', 'Panel rynków')] pozwala przeglądać istotne dla nas rynki. Te, które mają #G zielony#! nagłówek, są przez nas [Concept('owned_with_icon','posiadane')|e], zaś te z nagłówkiem niebieskim to takie, w których mamy [Concept('merchant_capacity_with_icon','wydajność handlową')|e], lecz nie [Concept('own','posiadamy')] żadnej [Concept('location','lokacji')].\n@arrow_bonus_tier_3! Zaleca się automatyzację każdego [Concept('market','rynku')] osobno poprzez kliknięcie @automation! #W ikony trybu#!. Dzięki temu nasza [merchant_capacity_with_icon|el] będzie stale wykorzystywana na najbardziej interesujących [Concept('merchants_with_icon','kupców')|e].\n@arrow_bonus_tier_2! Stawiaj [buildings_with_icon|el], takie jak [ShowBuildingTypeName('marketplace')|l] czy [ShowBuildingTypeName('trade_office')|l], aby zwiększyć naszą [Concept('merchant_capacity_with_icon','wydajność handlową')|e] na danym rynku."
 hint_markets_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! Granice rynków są dynamiczne: [locations|l] znajdą się pod kontrolą [Concept('market','rynku')|e] o najwyższej [Concept('market_attraction_with_icon','atrakcyjności')|e] na swoim terytorium, nawet jeśli będzie poza granicami państwa. [market_attraction] zagranicznych rynków może zanegować [protectionism_with_icon|el]."
 hint_markets_diplomatic: "„Ręka rynku to mądry pan. Czasem jednak warto nim pokierować”."
 hint_markets_administrative: "„Gospodarka, głupcze!”"
 hint_markets_military: "„Rozwój naszych rynków to wspaniała rzecz.\nPodbijanie rynków sąsiednich? Jeszcze wspanialsza”."
 ### Food
 hint_food: "Żywność"
 hint_food_hint_text: "$hint_food_hint_text_1$\n\n$hint_food_hint_text_2$\n\n$hint_food_hint_text_3$"
 hint_food_hint_text_1: "[pops_with_icon|e] potrzebują [Concept('food_with_icon','żywności')|e], by żyć, zaś [Concept('armies_with_icon','armiom')|e] [food|l] jest niezbędna, by mogły maszerować. Jedna i druga grupa pozyskuje ją z zapasów, jakie posiada [province_with_icon|el], gdzie się znajdują (nie zaś z [Concept('locations','lokacji')]!). Jeśli jest jej za mało, [pops|l] zaczną cierpieć na [starvation_with_icon|el], zaś [armies|l] dotknie [attrition_with_icon|el].\n\nIstnieją 3 warstwy procesu produkcji i dystrybucji żywności:\n\n@location! [local_food_with_icon|e]:\n$game_concept_food$ jest produkowana przede wszystkim w [Concept('locations_with_icon','lokacjach')|e] mających [food_raw_materials_with_icon|el] jako swój [Concept('rgo_with_icon','pozyskiwany surowiec')|e], np. [ShowGoodsName('livestock')|l]. Wszelkie nadmiary lub niedobory, jakie może wykazywać [location|l], są dodawane do żywności prowincji.\n\n@province! [provincial_food|e]:\nObszar najważniejszy. Jeśli [province_with_icon|el] nie produkuje wystarczająco dużo żywności dla swoich lokacji, jest pobierana z jej magazynu, w rezultacie czego zapasy ulegają zmniejszeniu. Jeśli zostaną całkowicie zużyte, we wszystkich lokacjach w prowincji zacznie panować [starvation_with_icon|el]. Zanim jednak do tego dojdzie, prowincja będzie próbować [Concept('buy_food_with_icon','kupić żywność')|e] na rynku.\n\n@market! [market_food|e]:\nWszystkie prowincje obecne na [Concept('market_with_icon','rynku')|e] będą starać się [Concept('sell_food_with_icon','sprzedawać żywność')|e], kiedy magazyny ulegną wypełnieniu, oraz ją [Concept('buy_food','kupować')], gdy będzie jej brakować. Tak długo, jak na rynku jest dostępna odpowiednia ilość żywności, nigdzie nie zapanuje głód."
 hint_food_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! @economy_panel! [Link('trade', 'subtab = markets', 'Panel rynków')] pozwoli ci przeglądać powiązane z nami rynki. Te, które mają #G zielony#! nagłówek, obejmują [Concept('owned_with_icon','posiadane')|e] przez nas [locations|l], więc musimy dbać, aby ich bilans [Concept('food','żywności')] pozostawał dodatni. Jeśli na jakimkolwiek z naszych rynków ilość żywności gwałtownie spada, pojawi się żółty baner. Jeśli jakieś [locations|l] głodują, baner stanie się czerwony.\n@arrow_bonus_tier_3! Aby zwiększyć produkcję żywności na jakimkolwiek z naszych rynków, kliknij jej przycisk. Otworzy się @production_panel! [Link('food_production', '', 'lateralview_food_production_entry_name')]. Pozwoli ci to sprawdzić, które z naszych [Concept('provinces','prowincji')|e] są zagrożone [Concept('starvation','głodem')|e], i rozwinąć ich [rgo|l].\n@arrow_bonus_tier_3! Rozwijaj [rgo_with_icon|e] w lokacjach, gdzie znajdują się najlepsze [food_raw_materials|l], jak [ShowGoodsName('rice')|l] czy [ShowGoodsName('wheat')|l], oraz które posiadają wysoką [food_productivity_with_icon|el].\n@arrow_bonus_tier_1! Możemy też wykorzystać [merchant_capacity_with_icon|el], aby importować [food_raw_materials_with_icon|el] z innych [Concept('markets','rynków')], co doprowadzi również do przeniesienia odpowiedniej ilości [Concept('food','żywności')]. Pozwoli ci na to @economy_panel! [Link('trade', 'subtab = trades', 'lateralview_trade_entry_name')]."
 hint_food_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! [winter_with_icon|e] to okres, w którym produkcja żywności spada. Nie wpadaj w panikę, jeśli przez kilka miesięcy będziesz widzieć na wszystkich rynkach ujemne wartości.\n@hint! Deficytowe [provinces|l] będą kupować nadmiary z tych najbardziej produktywnych tak długo, jak długo przynależą do tego samego rynku. Dlatego też najlepiej jest rozwijać produkcję żywności w [Concept('locations','lokacjach')] o największej [Concept('food_productivity','efektywności produkcji żywności')].\n@hint! [Concept('town_or_city_with_icon','Miasteczka lub miasta')|e] są zwykle mniej wydajne niż [rural_locations_with_icon|el] w zakresie produkcji [Concept('food','żywności')]."
 hint_food_diplomatic: "„Przedłużający się głód może oznaczać zniszczenie naszej ludności i upadek naszego państwa”."
 hint_food_administrative: "„Głód to głównie kwestia perspektywy. Nie jest taki zły, jeśli to ty sprzedajesz żywność”."
 hint_food_military: "„Paliwem maszerującej armii jest wyżywienie”."
 ### Maritime Presence
 hint_maritime: "Obecność morska"
 hint_maritime_hint_text: "$hint_maritime_hint_text_1$\n\n$hint_maritime_hint_text_2$\n\n$hint_maritime_hint_text_3$"
 hint_maritime_hint_text_1: "[maritime_presence_with_icon|e] to bardzo ważny wskaźnik, którym charakteryzują się przybrzeżne [seazones_with_icon|el]. Pomaga zwiększać [proximity_with_icon|el] wzdłuż naszych wybrzeży lub wysp.\n\nZapewnia ponadto [merchant_power_with_icon|el] [Concept('market_with_icon','rynku')|e], do którego należą dane [seazones|l].\n\n[maritime_presence] można zdobywać pasywnie dzięki budynkom i poprzez obecność [Concept('navy_with_icon','floty')|e]. Jej efekt z czasem spada. Może też zostać utracona ze względu na działalność [Concept('privateers_with_icon','korsarzy')|e] lub przez [Concept('blockade_with_icon','blokadę')|e]."
 hint_maritime_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Twórz wyspecjalizowane [navies|l] z okrętami zapewniający wysoki przyrost [Concept('maritime_presence','obecności morskiej')|e]. Możesz je następnie umieścić na jednej ze swoich przybrzeżnych [Concept('seazones','stref morskich')].\n@arrow_bonus_tier_3! Możesz też umieścić je na [Concept('military_objective_with_icon','celu wojskowym')|e] i wydać rozkaz „#V $MILITARY_OBJECTIVE_TYPE_NAME_patrol_the_seas$#!”, co zapewni ten efekt, lecz w razie potrzeby będzie też wysyłać w razie potrzeby jednostki na naprawy.\n@arrow_bonus_tier_2! Skup się na [Concept('societal_value','wartości społecznej')|e]: „[ShowSocietyDirectionName('naval')]”.\n@arrow_bonus_tier_1! [ShowBuildingTypeName('coastal_fort')] to niezwykle przydatna budowla!"
 hint_maritime_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! [maritime_presence] wzrasta tylko w [Concept('province','prowincji')|e], w której znajdują się jednostki, nawet jeśli celem jest więcej niż jedna [province]. #V $MILITARY_OBJECTIVE_TYPE_NAME_patrol_the_seas$#! sprawi, że [navy] wykona ruch, jeśli lokacja [Concept('seazone','morska')] osiągnie #W 100%#! [Concept('maritime_presence','obecności morskiej')].\n@hint! [privateers] kradną bogactwo innych [Concept('countries','krajów')], obniżając jednocześnie ich [Concept('maritime_presence','obecność morską')]. W przeciwieństwie do [Concept('maritime_presence','obecności morskiej')], [privateers] działają na całym [Concept('area_with_icon','obszarze')], co oznacza, że wszystkie [provinces] na danym obszarze odczują skutki działalności [Concept('privateers','korsarzy')].\n@hint! Niektóre [government_reforms_with_icon|e], na przykład [ShowGovernmentReformName('harbor_administration')], umożliwiają utworzenie zamorskiego urzędu o nazwie [ShowBuildingTypeName('naval_governor')]. Gubernatorzy pełnią rolę dodatkowych [Concept('capitals','stolic')], które rozprzestrzeniają [proximity] na odległych terytoriach. Jedynym miejscem, w którym mogą urzędować gubernatorzy morscy, jest przybrzeżne [ShowLocationRankName('city')], które nie jest połączone z twoją [Concept('capital','stolicą')]."
 hint_maritime_diplomatic: "„Musimy dobrze wykorzystać nasze wybrzeże i usprawnić handel”."
 hint_maritime_administrative: "„Im bezpieczniejsze podróże morskie, tym lepsza komunikacja z naszą ludnością”."
 hint_maritime_military: "„Obecność silnej floty sprawi, że piraci nie ośmielą się choćby tknąć naszych szlaków handlowych”."
 hint_slaves: "Niewolnicy"
 hint_slaves_hint_text: "$hint_slaves_hint_text_1$\n\n$hint_slaves_hint_text_2$\n\n$hint_slaves_hint_text_3$"
 hint_slaves_hint_text_1: "@slaves_goods! [ShowGoodsName('slaves_goods')] to [good_with_icon|el] najbardziej niezwykły. Kupuje się ich i sprzedaje na [Concept('markets_with_icon','rynkach')|e] jak każdy inny [good|l], a ich cena zależy od [Concept('supply_with_icon','podaży')|e] i [Concept('demand_with_icon','popytu')|e]. W przeciwieństwie do innych [Concept('good','towarów')] ten reprezentuje faktyczne [pops_with_icon|el], które są przemieszczane tam, gdzie odbywa się handel [Concept('good','towarem')].\n\n[pop_type_with_icon|el] @slaves! [ShowPopTypeName('slaves')|l] może być wykorzystywana jako siła robocza w [Concept('rgo_with_icon','operacjach pozyskiwania surowców')|e] oraz niewolniczych [Concept('buildings_with_icon','budynkach')|e] typu [ShowBuildingTypeName('sugar_plantation')|l].\n\n[buildings], takie jak [ShowBuildingTypeName('slave_market')|l], potrafią sprawić, że istniejący @slaves! [ShowPopTypeName('slaves')] mogą zmienić się w [goods] @slaves_goods! [ShowGoodsName('slaves_goods')], który z kolei można sprzedać na [Concept('market','rynku')|e]. [good] jest traktowany jak każdy inny [good|l], więc [buildings|l] mogą potrzebować go jako materiału. Kiedy tak się dzieje, @slaves! [ShowPopTypeName('slaves')|l] są przenoszeni do [Concept('location','lokacji')|e] do pracy w [Concept('building','budowli')|e]."
 hint_slaves_hint_text_2: "#T Zalecane działania:#! \n@arrow_bonus_tier_3! Tworząc [colonies_with_icon|el] na innych [Concept('continent_with_icon','kontynentach')|e], możesz [Concept('trade_with_icon','handlować')|e] niewolnikami na [Concept('markets','rynkach')] kolonialnych do pracy na plantacjach.\n@arrow_bonus_tier_2! Możesz postawić [buildings|l] typu [ShowBuildingTypeName('slave_center')] w obcych [Concept('locations','lokacjach')|e] w twoim [Concept('trade_range_with_icon','zasięgu handlowym')|e], by zapewnić sobie stałe dostawy niewolników na sprzedaż."
 hint_slaves_hint_text_3: "#T Dodatkowe wskazówki:#!\n@hint! [pops_with_icon|e] są zwykle niewolone przez [buildings|l] typu [ShowBuildingTypeName('slave_market')], ale niektóre [countries|l] dysponują specjalną mechaniką, która pozwala im na zniewalanie [pops] podczas [Concept('war_with_icon','wojny')|e].\n@hint! [ShowReligionGroupName('christian')] zezwala tylko na niewolników w [Concept('buildings','budowlach')|e] plantacji, które odblokowują się w #V Epoce odkryć#! i mogą być budowane tylko za morzami."
 hint_slaves_diplomatic: "„Wszyscy ludzie są stworzeni równymi sobie oprócz niektórzy”."
 hint_slaves_administrative: "„Nic wartego wzmianki nie zostało nigdy osiągnięte bez poświecenia wielu ludzi”."
 hint_slaves_military: "„Jeśli brakuje darmowej pracy, bezbożni ją dostarczą”."
 #### ECO tutorial
 hint_eco: "Zaawansowane wskazówki gospodarcze"
 hint_eco_hint_text: "$hint_eco_hint_text_1$\n\n$hint_eco_hint_text_2$\n\n$hint_eco_hint_text_3$"
 hint_eco_hint_text_1: "Nawet jeśli zautomatyzujesz wiele aspektów swojej gospodarki, będą istnieć działania, które trzeba zrobić samodzielnie, by pchnąć [country|l] do przodu."
 hint_eco_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Najlepszą radą jest podejmowanie stałych prób obniżania [Concept('expenses_with_icon','wydatków')|e].\n\n@arrow_bonus_tier_3! Jako gracz skup się na planowaniu budowy [Concept('towns_and_cities_with_icon','miast i miasteczek')|e] oraz [Concept('roads_with_icon','dróg')|e].\n    Ponieważ [towns_and_cities_with_icon|e] sprawiają, że [rgo_with_icon|el] mogą być używane w mniejszych ilościach, najlepiej jest urbanizować najmniej cenne [rural_locations|l]. Są to zazwyczaj:\n@sand![ShowGoodsName('sand')|l], @clay![ShowGoodsName('clay')|l], @horses![ShowGoodsName('horses')|l], @medicaments![ShowGoodsName('medicaments')|l], @wine![ShowGoodsName('wine')|l], @olives![ShowGoodsName('olives')|l], @millet![ShowGoodsName('millet')|l], @legumes![ShowGoodsName('legumes')|l], @fruit![ShowGoodsName('fruit')|l], @wild_game![ShowGoodsName('wild_game')|l], @beeswax![ShowGoodsName('beeswax')|l] \n\n@arrow_bonus_tier_3! [subjects_with_icon|e] uwalniani na ziemiach, na których masz niską [Concept('control_with_icon','kontrolę')|e], będą propagować własną.\n    [Concept('annex_with_icon','Anektuj')|e] poddanych, kiedy odpowiednio rozbudujesz lokalną infrastrukturę.\n    Szybkość [Concept('annexation_with_icon','aneksji')|e] jest skalowana względem relatywnego rozmiaru kraju oraz [Concept('cultural_influence_with_icon','wpływu kulturowego')|e].\n\n@arrow_bonus_tier_2! [rgo_with_icon|e] dla cennych surowców to bardzo dobra inwestycja, szczególnie jeśli rozwiniesz też [Concept('merchant_capacity_with_icon','wydajność handlową')|e] i rozpoczniesz [export_with_icon|el].\n@goods_gold![ShowGoodsName('goods_gold')|l], @silver![ShowGoodsName('silver')|l], @gems![ShowGoodsName('gems')|l], @pearls![ShowGoodsName('pearls')|l], @amber![ShowGoodsName('amber')|l], @ivory![ShowGoodsName('ivory')|l], @pepper![ShowGoodsName('pepper')|l], @saffron![ShowGoodsName('saffron')|l], @chili![ShowGoodsName('chili')|l].\n\n@arrow_bonus_tier_2! [trade_income_with_icon|e] skaluje się wraz z [Link('hints', 'selected_hint = hint_crown_power', '@hint! wpływami korony')] i zawsze dobrze go zwiększać poprzez zwiększanie [Link('hints', 'selected_hint = hint_increasing_trade_capacity', '@hint! wydajności handlowej')], która w przeciwieństwie do [Concept('tax_base','podstawy opodatkowania')] nie skaluje się wraz z [Concept('control','kontrolą')].\n\n@arrow_bonus_tier_1! Dbaj o niskie ceny towarów przemysłowych! Zwiększy to zyskowność miast i miasteczek oraz uczyni [buildings_with_icon|el] tańsze w utrzymaniu.\n@lumber! [ShowGoodsName('lumber')|l], @masonry![ShowGoodsName('masonry')|l], @glass![ShowGoodsName('glass')|l], @iron![ShowGoodsName('iron')|l], @mercury![ShowGoodsName('mercury')|l], @steel![ShowGoodsName('steel')|l].\n\n@arrow_bonus_tier_1! $game_concept_buildings$ bez [Concept('production_method_with_icon','metody produkcji')|e] kosztują [maintenance_with_icon|el], co zmieniać się zależnie od ceny towarów wejściowych. Pamiętaj, że [demand_with_icon|el], jaki generują [buildings|l], również stymuluje rozwój gospodarki!"
 hint_eco_hint_text_3: "#T Dodatkowe wskazówki:#!\n[Link('hints', 'selected_hint = hint_inflation', '@hint! Obniżanie inflacji')]\n[Link('hints', 'selected_hint = hint_increasing_trade_capacity', '@hint! Zwiększanie wydajności handlowej')]\n[Link('hints', 'selected_hint = hint_control', '@hint! Zwiększanie kontroli')]"
 hint_eco_diplomatic: "„Pieniądz stanowi czasem najlepsze narzędzie wpływu”."
 hint_eco_administrative: "„Złoto jest krwią narodów”."
 hint_eco_military: "„Najlepszy zysk to taki, który zabierasz innym”."
 #### POL tutorial
 hint_pol: "Zaawansowane porady polityczne"
 hint_pol_hint_text: "$hint_pol_hint_text_1$\n\n$hint_pol_hint_text_2$\n\n$hint_pol_hint_text_3$"
 hint_pol_hint_text_1: "Wszystkie [countries_with_icon|el] zaczynają grę z jakimiś słabymi stronami. Pamiętaj, że [Link('government', 'tabcontent = estates', '@government_panel! $lateralview_government_entry_name$')] to miejsce, w którym wymienione są [privileges_with_icon|el] i [laws_with_icon|el]. Makrozmiany mogą być na dłuższą metę niezwykle pomocne.\n\nNie bój się ich dokonywać!"
 hint_pol_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Zadbaj, żeby [estate_satisfaction_equilibrium_with_icon|el] była wystarczająca, by [ShowEstateTypeName('burghers_estate')|l] i [ShowEstateTypeName('peasants_estate')|l] godzili się na [Concept('tax_with_icon','podatki')|e] na poziomie maksymalnym bez jej spadnięcia poniżej #W 50%#!.\n\n@arrow_bonus_tier_3! Sprawdź w menu [Link('societal_values', '', '@government_panel! panel rządu > wartości')], aby dowiedzieć się, jakie [societal_values_with_icon|el] są godne uwagi. Ogólnie rzecz biorąc, najbardziej korzystne są:\n$BULLET_WITH_TAB$[ShowSocietyDirectionName('capital_economy')]\n$BULLET_WITH_TAB$[ShowSocietyDirectionName('centralization')]\n\n@arrow_bonus_tier_3! Przeglądaj [laws_with_icon|el], aby dowiedzieć się, jakie należy zmienić.\n    [parliament_with_icon|e] pozwoli na łatwą zmianę praw – we wczesnej fazie gry powinno to być twoim priorytetem.\n    $game_concept_laws$, na które warto zwrócić uwagę na początku:\n    $BULLET_WITH_TAB$[ShowLawName('mining_law')]\n    $BULLET_WITH_TAB$[ShowLawName('precious_metal_distribution_law')]\n    $BULLET_WITH_TAB$[ShowLawName('distribution_of_power_law')]\n    $BULLET_WITH_TAB$[ShowLawName('administrative_system')]\n\n@arrow_bonus_tier_3! Przeglądaj przydzielone i dostępne [privileges_with_icon|el], jakie może otrzymać każdy [estate_with_icon|el]. Stanowią narzędzie pozwalające na modyfikowanie równowagi satysfakcji stanowej oraz zmian wartości społecznych.\n   [ShowEstateTypeName('nobles_estate')] powinni dostawać tylko tyle, ile trzeba, aby pozostali lojalni. Odbieranie im wpływów jest na dłuższą metę korzystne.\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('nobles_land_rights')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('nobility_council')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('noble_serfdom_rights')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('noble_sponsored_navy')]\n\n   [ShowEstateTypeName('clergy_estate')] powinni otrzymywać wszystkie pozytywne przywileje, nawet jeśli nie można ich opodatkować – każdy punkt satysfakcji stanowej powyżej #W 50%#! zapewnia premię do [Concept('research_progress_with_icon','postępu badań')|e].\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('embellish_great_works_of_faith')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('clergy_in_administration')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('clergy_religious_state')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('clerical_advisory_council')]\n\n   [ShowEstateTypeName('burghers_estate')] powinni mieć aktywnie przydzielaną maksymalną możliwą liczbę pozytywnych przywilejów. Zwykle są korzystne, zaś zwiększanie [Concept('estate_power_with_icon','wpływów stanowych')|e], jakimi dysponują mieszczanie, zmniejsza je dla innych stanów. Co więcej, każdy punkt satysfakcji sprawia, że rośnie [production_efficiency_with_icon|el].\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('building_roads_rights')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('market_fairs')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('building_rights')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('allow_trade_center_sponsorship')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('commercial_advisory_council')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('control_over_the_coinage')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('guild_investments')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('land_of_commerce')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('urban_development_grants')]\n\n   [ShowEstateTypeName('peasants_estate')] powinni otrzymywać przywileje w takiej ilości, żeby ich równowaga satysfakcji pozwalała na maksymalne opodatkowanie. Warto pamiętać o ich dążeniu do [ShowSocietyDirectionName('decentralization')|l], które nie jest idealne. W każdym razie wpływy stanowe pospólstwa pozostają w trakcie gry niskie, więc koszt cofnięcia przywilejów będzie niski w porównaniu do innych stanów.\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('peasants_allowed_weapons_privilege')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('allow_hunting')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('no_labor_sunday')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('peasants_represented_in_parliament')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('peasants_fewer_levies')]\n\n@arrow_bonus_tier_2! Szukaj [Concept('government_reforms_with_icon','reform rządowych')|e], które pasują do pożądanych przez ciebie wartości społecznych. Pamiętaj, że niektóre premie jak [diplomatic_capacity_with_icon|el] sprawiają, że może spaść [diplomatic_maintenance_with_icon|el].\n\n@arrow_bonus_tier_2! Niektóre [cabinet_actions_with_icon|el], jak [ShowCabinetActionName('stabilize_country')|l] czy [ShowCabinetActionName('strengthen_government')|l], mogą obniżyć wydatki, co zwiększy przychód!"
 hint_pol_hint_text_3: "#T Dodatkowe wskazówki:#!\n[Link('hints', 'selected_hint = hint_crown_power', '@hint! Wpływy korony')]\n[Link('hints', 'selected_hint = hint_estates', '@hint! Stany')]"
 hint_pol_diplomatic: "„Sprytny władca dobrze wykorzysta każdą dostępną możliwość”."
 hint_pol_administrative: "„Dochodowa polityka to dochodowe przedsiębiorstwa”."
 hint_pol_military: "„Nasze stany bywają gorsze niż nasi wrogowie”."
 #### MIL tutorial
 hint_mil: "Zaawansowane porady dot. ekspansji"
 hint_mil_hint_text: "$hint_mil_hint_text_1$\n\n$hint_mil_hint_text_2$\n\n$hint_mil_hint_text_3$"
 hint_mil_hint_text_1: "Dwie rady ogólne: zawodowe [armies_with_icon|el] (w tym [mercenaries_with_icon|el]) zawsze pokonają podobnych rozmiarów [levies_with_icon|el], zaś najlepszym sposobem na rozwój armii jest rozwijanie gospodarki."
 hint_mil_hint_text_2: "#T Zalecane działania:#!\n@arrow_bonus_tier_3! Zdobądź [Concept('institution','instytucję')|e] „[ShowInstitutionName('professional_armies')|l]” tak szybko, jak to możliwe: szybko zdobyta [ShowAdvanceName('armory_advance')|l] sprawi, że niemożliwe dotąd do wygrania [wars_with_icon|el] będą w zasięgu.\n\n@arrow_bonus_tier_3! [war_score_with_icon|e] z [Concept('battles_with_icon','bitew')|e] skaluje się w dół wraz z upływem [Concept('ages_with_icon','epok')|e]. Na początku wynosi do #W 50%#!, dzięki czemu łatwo jest wygrywać [wars_with_icon|el] tylko dzięki bitwom!\n\n@arrow_bonus_tier_3! Pamiętaj, aby zapewnić sobie dostęp do strategicznych [Concept('goods_with_icon','towarów')|e]. Nie są niezbędne w dużych ilościach, ale potrzebujesz ich, aby rozbudowywać [Concept('army_with_icon','armię')|e] i [Concept('navy_with_icon','flotę')|e]: @tin![ShowGoodsName('tin')|l], @lead![ShowGoodsName('lead')|l], @copper![ShowGoodsName('copper')|l].\n\n@arrow_bonus_tier_3! $game_concept_armies$ [Concept('reinforce_with_icon','wzmacniają')|e] się tylko na terytorium sojuszniczym.\n\n@arrow_bonus_tier_3! [ShowUnitCategoryName('army_heavy_infantry')] tworzy główną linię [Concept('battle_with_icon','bitwy')|e]. Jest tania i skuteczna w pochłanianiu [Concept('damage_taken','otrzymywanych obrażeń')|e], podczas gdy [ShowUnitCategoryName('army_artillery')|l] powoduje duże szkody na froncie. Ważne jest, aby front przetrwał [Concept('bombard_phase_with_icon','fazę bombardowania')|e].\n\n@arrow_bonus_tier_2! Stworzenie sprawnej linii logistycznej, z której będą korzystać twoje armie na terytorium [Concept('enemy_with_icon','wroga')|e], jest kluczowe. Jeśli zostanie przecięta, cała armia może zniknąć ze względu na [attrition|el]. Możesz wykorzystać [ShowUnitCategoryName('army_auxiliary')|l] do transportowania [Concept('food_with_icon','żywności')|e] na front lub rozmieścić [supply_depots_with_icon|el], które wspomogą logistykę.\n\n@arrow_bonus_tier_1! [buildings|e] zapewniające [Concept('manpower_with_icon','siłę żywą')|e] są w grze najdroższe w [Concept('maintenance_with_icon','utrzymaniu')|e], więc najlepiej je budować w [Concept('locations_with_icon','lokacjach')|e] o wysokim poziomie [Concept('control_with_icon','kontroli')|e].\n\n@arrow_bonus_tier_1!$game_concept_battles$ trwają zwykle tylko kilka dni, więc zanim zaczniesz daleko nacierać, upewnij się, że zdołasz wzmocnić swoje wojska na czas."
 hint_mil_hint_text_3: "#T Dodatkowe wskazówki:#!\n[Link('hints', 'selected_hint = hint_manpower', '@hint! Siła żywa')]\n[Link('hints', 'selected_hint = hint_sailors', '@hint! Marynarze')]\n[Link('hints', 'selected_hint = hint_war', '@hint! Wojna')]\n[Link('hints', 'selected_hint = hint_battle', '@hint! Bitwy')]\n[Link('hints', 'selected_hint = hint_siege_and_occupation', '@hint! Okupacja i oblężenia')]"
 hint_mil_diplomatic: "„Działaj tak, aby inne państwa wygrywały twoje wojny”."
 hint_mil_administrative: "„Osłabienie może zdziesiątkować każdą armię”."
 hint_mil_military: "„Nie przychodź na strzelaninę z nożem”."
 hint_holland: "Rady początkowe dla Holandii"
 hint_holland_hint_text: "Wysoce zurbanizowane [locations|l] Niderlandów sprawiają, że [Player.GetLongName] to doskonały kandydat na potęgę handlową Europy Północnej.\n\n@hint! #T [ShowBuildingTypeName('marketplace')] to coś, na czym skorzysta każde [ShowLocationRankName('town')|l]#!\nAutomatyzacja handlu sprawi, że ich [merchant_capacity_with_icon|el] umożliwi [import_with_icon|el] [Concept('raw_materials_with_icon','surowców')|e], których nie posiada [market_icon][Player.GetCapital.GetMarket.GetName], a także [export_with_icon|el] [Concept('produced_goods_with_icon','wytworzonych towarów')|e] z naszych miast.\n\n@hint! #T Rozwijaj przemysł tekstylny#!\nMożesz wiele zarobić, eksportując [ShowGoodsName('fine_cloth')|l]. Przydatne budowle to [ShowBuildingTypeName('cloth_guild')] i [ShowBuildingTypeName('fine_cloth_guild')]. W razie potrzeby dobrym surowcem importowym będzie [ShowGoodsName('wool')|l], którą sprzedaje [ShowLocationName('london')].\n\n@hint! #T Zwiększ nasze [crown_power|l]#!\n[trade_income_with_icon|e] dzielą między sobą [ShowEstateTypeName('crown_estate')|l] i [estates_with_icon|el] zgodnie ze stosunkiem ich wpływów. Jeśli [crown_power_with_icon|el] pozostają wysokie, [trade_income|l] trafia w dużej mierze do [Concept('treasury_with_icon','skarbca')|e]. O [Concept('crown_power','wpływach korony')] dowiesz się więcej ze [Link('hints', 'selected_hint = hint_crown_power', 'wskazówek dotyczących wpływów korony')].\n\n@hint! #T Dbaj o zapas [Concept('food','żywności')]#!\n[urban_locations_with_icon|e] wytwarzają mniej [Concept('food_with_icon','żywności')|e] niż [rural_locations_with_icon|el]. Miej na oku [food_stockpile_with_icon|el], jakie posiada rynek [Player.GetCapital.GetMarket.GetName], i postaraj się, aby [ShowGoodsName('fish')|l] i [ShowGoodsName('livestock')|l] były pozyskiwane ([rgo_with_icon|el]) w większej ilości. Nasz [budget|l] ucierpi, jeśli [food|l] stanie się zbyt droga.\n\n@hint! #T Udobruchaj sąsiadów#!\nMoże i jesteśmy bogaci, ale nasze skromne rozmiary czynią nas odsłoniętymi na cudzą agresję. [diplomatic_action_with_icon|e] „$IMPROVE_RELATIONTITLE$” uspokoi naszych najgroźniejszych sąsiadów (są to zwłaszcza [GetCountry('FRA').GetName] i [GetCountry('ENG').GetName])."
 hint_holland_diplomatic: "$hint_advisor_salute_diplomatic$"
 hint_holland_administrative: "$hint_advisor_salute_administrative$"
 hint_holland_military: "$hint_advisor_salute_military$"
 hint_hungary: "Rady początkowe dla Węgier"
 hint_hungary_hint_text: "[Player.GetLongName] zaczynają w uprzywilejowanej pozycji jako jedna z głównych potęg [Concept('region','regionu')|e]. Mamy [alliance_with_icon|el] z #W Polską#!. #W Bośnia#! to nasz [subject_with_icon|el]. Zaś z #W Chorwacją#! łączy nas [personal_union_with_icon|el], jako że rządzi nami ten sam [ruler_with_icon|el] [Player.GetGovernment.GetRuler.GetName]. Oznacza to, że możemy rozwijać [country_with_icon|el] bez obaw o zagrożenia zewnętrzne – przynajmniej na razie.\n\n@hint! #T Buduj [roads|l] do swoich kopalni#!\n[capital_icon] [Player.GetCapital.GetName] ma na północy regiony, gdzie obficie występują [ShowGoodsName('goods_gold')|l] i [ShowGoodsName('silver')|l]. Są jednak niewystarczająco rozwinięte, a [locations|l] cechuje tam niska [control_with_icon|e]. Powinniśmy rozbudowywać [roads_with_icon|el], aby połączyć [Player.GetCapital.GetNameWithNoTooltip] z tymi cennymi kopalniami. Wzrośnie dzięki temu [proximity_with_icon|el], w konsekwencji czego zwiększy się także [control|l].\n\n@hint! #T Buduj gildie jubilerów wokół swojej [Concept('capital','stolicy')|e]#!\n[ShowGoodsNameWithNoTooltip('goods_gold')] i [ShowGoodsNameWithNoTooltip('silver')|l] mają na rynku [market_icon] [Player.GetCapital.GetMarket.GetName] niezwykle niską cenę ze względu na wysoką podaż. [ShowBuildingTypeName('jewelry_guild')] wykorzysta te surowce – powstanie niezwykle dochodowa [ShowGoodsName('jewelry')|l], co jeszcze bardziej zwiększy rentowność naszych kopalni.\n\n@hint! #T Zbuduj [ShowBuildingTypeName('marketplace')|l], aby eksportować nadwyżki#!\nZautomatyzowany [trade_with_icon|el] pozwoli na [export_with_icon|el] – nadmiarowe [goods_with_icon|el], takie jak [ShowGoodsNameWithNoTooltip('jewelry')], trafią na inne [markets_with_icon|el], co zapewni [trade_income_with_icon|el] oraz uczyni cały łańcuch produkcji dochodowym.\n\n@hint! #T Cofnij [ShowPolicyName('gold_export_ban')|l]#!\nEuropa patrzy łakomie na nasze [ShowGoodsNameWithNoTooltip('goods_gold')|l]. Jego bezpośredni eksport byłby niezwykle dochodowy, lecz obecne [law_with_icon|el], [ShowLawName('precious_metal_distribution_law')|l], na to nie pozwala. Rozważ zmianę tej [Concept('policy','polityki')|e] podczas kolejnej sesji [Concept('parliament_with_icon','parlamentu')|e].\n\n@hint! #T Stwórz urząd: [ShowBuildingTypeName('local_governor')]#!\nWschód naszego [Concept('country','kraju')|e] jest bogaty, ale mamy niewielką [Concept('control','kontrolę')|e] nad jego zasobam. W dłuższej perspektywie powinniśmy zbudować tam [ShowLocationRankName('city')|l], gdzie administrację przejmie [ShowBuildingTypeName('local_governor')|l]. Będzie pełnić rolę drugiej [Concept('capital','stolicy')|e], zapewniając [Concept('proximity','bliskość')|e] okolicznym [Concept('locations','lokacjom')|e]. Pamiętaj, że jedynym miejscem, w którym mogą działać lokalni gubernatorzy, jest [ShowLocationRankName('city')]. Urząd ten jest drogi w utrzymaniu i wymaga bezpośredniego połączenia [Concept('road','drogowego')|e] z naszą [Concept('capital','stolicą')|e]."
 hint_hungary_diplomatic: "$hint_advisor_salute_diplomatic$"
 hint_hungary_administrative: "$hint_advisor_salute_administrative$"
 hint_hungary_military: "$hint_advisor_salute_military$"
 hint_norway: "Rady początkowe dla Norwegii"
 hint_norway_hint_text: "[Player.GetLongName] to rozległy [country_with_icon|el], lecz nasza [control_with_icon|el] poza [Concept('capital_with_icon','stolicą')|e] pozostaje co najwyżej teoretyczna. Powinniśmy rozbudować infrastrukturę, zarówno morską, jak i lądową, aby zwiększyć [proximity_with_icon|el] oraz wydobyć północne zasoby.\n\n@hint! #T Buduj [roads|l] biegnące ze [Concept('capital','stolicy')|e]#!\nPowinniśmy starać się budować [roads_with_icon|el], których punktem początkowym jest [capital_icon] [Player.GetCapital.GetName], aby połączyć każde pobliskie [ShowLocationRankName('town')|l] oraz [Concept('rgo_with_icon','miejsca pozyskiwania surowców')|e], dzięki czemu wzrosną [proximity_with_icon|el] i [control_with_icon|el]. Kopalnie, gdzie wydobywane jest [ShowGoodsName('silver')|l] (na zachód od miasta [Player.GetCapital.GetNameWithNoTooltip]), powinny być po odpowiednim doinwestowaniu szczególnie dochodowe. Korzystaj często z trybu mapy, który przedstawia [proximity|l]!\n\n@hint! #T Zwiększ [Concept('maritime_presence','obecność morską')]#!\nTworzenie [Concept('roads','dróg')] pokonujących górzyste serce [country_with_icon|e] może się okazać próżnym i drogim przedsięwzięciem. [maritime_presence_with_icon|e] wzdłuż wybrzeża sprawi, że [proximity|l] będzie ulegać o wiele skuteczniejszej propagacji przez morze. [ShowBuildingTypeName('wharf')] i [ShowBuildingTypeName('dock')|l], budowane w naszych miasteczkach, oraz każdy [ShowUnitCategoryName('navy_light_ship')|l] we flocie to coś, do czego musisz dążyć, kiedy odkryjesz odpowiedni [advance_with_icon|el].\n\n@hint! #T Zakładaj miasteczka w dobrych portach blisko [Concept('capital','stolicy')|e]#!\n[proximity] przybrzeżnych [Concept('locations','lokacji')|e] poprawia znacząco [natural_harbor_suitability_with_icon|e]. Sprawdź odpowiedni tryb mapy, aby poszukać najlepszych naturalnych portów.\n\n@hint! #T Rozwijaj przemysł#!\n[ShowBuildingTypeName('fine_cloth_guild')], [ShowBuildingTypeName('furniture_guild')|l] i [ShowBuildingTypeName('scriptorium')|l] w naszych miasteczkach pozwolą przetwarzać zasoby naturalne, zaś [ShowBuildingTypeName('marketplace')|l] umożliwi ich [export_with_icon|el] na inne [markets_with_icon|el].\n\n@hint! #T Wzmocnij unię ze Szwecją#!\n [personal_union_with_icon|e], którą [GetCountry('SWE').GetName] jest z nami połączona, zapewnia pokój na granicy. Możemy dążyć do pogłębionej integracji z tym krajem, wprowadzając wspólne [laws|l] w panelu [Concept('international_organization','organizacji międzynarodowej')|e]."
 hint_norway_diplomatic: "$hint_advisor_salute_diplomatic$"
 hint_norway_administrative: "$hint_advisor_salute_administrative$"
 hint_norway_military: "$hint_advisor_salute_military$"
 hint_naples: "Rady początkowe dla Neapolu"
 hint_naples_hint_text: "[Player.GetLongName] to największa siła [Concept('region_with_icon','regionu')|e]. Ma szanse zdominować włoski handel i politykę, podczas gdy nasi [subjects_with_icon|el] w Grecji stanowią wygodny przyczółek dla ekspansji zewnętrznej.\n\n@hint! #T Buduj [roads|l] wiodące ze [Concept('capital','stolicy')|e]#!\nPowinniśmy starać się tworzyć [roads_with_icon|el], których punktem startowym jest [capital_icon] [Player.GetCapital.GetName], aby połączyć każde pobliskie [ShowLocationRankName('town')|l] oraz [Concept('rgo_with_icon','miejsca pozyskiwania surowców')|e], zwiększając naszą [proximity_with_icon|el], a tym samym [Concept('control_with_icon', 'kontrolę')|e].\n\n@hint! #T Zwiększaj wydobycie [Concept('raw_materials','surowców')]#!\nNasz [country|l] posiada w dużej ilości cenne [raw_materials_with_icon|el]. [ShowGoodsName('wool')|l], [ShowGoodsName('fiber_crops')|l] i [ShowGoodsName('silk')|l] są bardzo cenne nie tylko same w sobie, lecz mogą być też wykorzystywane przez nasz przemysł tekstylny w [Concept('urban_locations_with_icon','lokacjach miejskich')]. Rozwiń te [Concept('rgo_with_icon','miejsca pozyskiwania surowców')|e] tak szybko, jak to możliwe. Priorytetowo potraktuj zwiększenie w nich [Concept('control','kontroli')|e].\n\n@hint! #T Rozwijaj przemysł tekstylny#!\n[ShowBuildingTypeName('cloth_guild')] i [ShowBuildingTypeName('fine_cloth_guild')|l] to [buildings|l], które przydadzą się w [Concept('urban_locations','lokacjach miejskich')]. Wykorzystają nasze [raw_materials|l] – powstaną drogie [produced_goods_with_icon|el], zaś zwiększony popyt uczyni [rgo|l] jeszcze bardziej dochodowymi.\n\n@hint! #T Zbuduj [ShowBuildingTypeName('marketplace')|l], aby eksportować nadwyżki#!\nZautomatyzowany [trade_with_icon|el] pozwoli na [export_with_icon|el] – nadmiarowe [goods_with_icon|el], takie jak [ShowGoodsNameWithNoTooltip('fine_cloth')], trafią na inne [markets_with_icon|el], co zapewni [trade_income_with_icon|el] oraz uczyni cały łańcuch produkcji dochodowym."
 hint_naples_diplomatic: "$hint_advisor_salute_diplomatic$"
 hint_naples_administrative: "$hint_advisor_salute_administrative$"
 hint_naples_military: "$hint_advisor_salute_military$"
 hint_castile: "Rady początkowe dla Kastylii"
 hint_castile_hint_text: "[Player.GetLongName] to dominująca siła [Concept('region_with_icon','regionu')|e]. Posiada uprzywilejowaną pozycję państwa, które zjednoczyło Iberię pod rządami jednego tronu. Nasza administracja jednak nie daje sobie zbyt dobrze rady, zaś [control|l] na południu jest tak niska, że ledwo mamy stamtąd jakiekolwiek wpływy do [Concept('budget_with_icon','budżetu')|e]. Mądrze byłoby skonsolidować [Concept('control','kontrolę')] nad obecnym terytorium, zanim rozpoczniemy dalsze podboje.\n\n@hint! #T Buduj [roads|l] wiodące ze [Concept('capital','stolicy')]#!\n[locations] bez [Concept('control_with_icon','kontroli')|e] są dla naszej administracji właściwie bezużyteczne. Wszystkie [roads_with_icon|e] i [buildings|l] typu [ShowBuildingTypeName('bridge_infrastructure')], które wiodą do naszej [Concept('capital_with_icon','stolicy')], zwiększają [proximity_with_icon|el], a więc i naszą [Concept('control','kontrolę')]. Sprawdzaj często mapę w trybie [Concept('proximity','bliskości')]!\n\n@hint! #T Stwórz urząd: [ShowBuildingTypeName('local_governor')]#!\nPołudnie naszego [Concept('country','kraju')|e] jest bogate i zurbanizowane, ale nie mamy zbyt dużej [Concept('control','kontroli')|e] nad tamtejszą populacją. Rozwiązaniem może być [ShowBuildingTypeName('local_governor')] w mieście [ShowLocationName('sevilla')]. Będzie pełnić rolę drugiej [Concept('capital','stolicy')|e], zapewniając [Concept('proximity','bliskość')|e] okolicznym [Concept('locations','lokacjom')|e]. Pamiętaj, że jedynym miejscem, w którym mogą działać lokalni gubernatorzy, jest [ShowLocationRankName('city')]. Urząd ten jest drogi w utrzymaniu i wymaga bezpośredniego połączenia [Concept('road','drogowego')|e] z naszą [Concept('capital','stolicą')|e].\n\n@hint! #T [GetCountry('GRA').GetName] czeka na podporządkowanie#!\nChoć nie mamy dużych możliwości, aby [Concept('own_with_icon','posiąść')|e] ich ziemie, [GetCountry('GRA').GetName] jest doskonałym kandydatem na naszego [Concept('subject_with_icon','poddanego')|l]. Mogą władać swoim terenem w naszym imieniu i wpłacać co miesiąc do [Concept('treasury','skarbca')] daninę. Warto rozważyć ich [Concept('annexing_with_icon','aneksję')|e], gdy nasza infrastruktura oraz technologia rozwiną się na tyle, by umożliwić bezpośrednie posiadanie ziemi. Aby [Concept('annex','dokonać aneksji')] [Concept('subject','poddanego')], musimy władać nim przez ponad #Y 10#! lat i mieć z nim dobre stosunki.\n\n@hint! #T Zadanie z gwiazdką#!\n[explorers_with_icon|e] opowiadają o niezmierzonym bogactwie, jakie widzieli podczas ekspedycji do Indii. Jednakże jeśli najnowocześniejsze [advances_with_icon|el] znajdują się poza naszym zasięgiem, przedsięwzięcia takie mogą się okazać absurdalnie drogie."
 hint_castile_diplomatic: "$hint_advisor_salute_diplomatic$"
 hint_castile_administrative: "$hint_advisor_salute_administrative$"
 hint_castile_military: "$hint_advisor_salute_military$"
 hint_ottomans: "Rady początkowe dla Osmanów"
 hint_ottomans_hint_text: "Zbliżająca się [situation_with_icon|el] „Rozkwit narodu tureckiego” zapewni wyjątkową okazję do gwałtownego rozwoju na terenie Grecji i Anatolii. Użyj [Concept('actions_with_icon', 'akcji')|e] sytuacji, aby uzyskać [casus_belli_with_icon|el] przeciw naszym sąsiadom i nasłać na nich naszą potęgę.\n\n@hint! #T Zintegruj podboje #!\nNowo [Concept('conquered_with_icon','podbite')|e] [locations|l] muszą zostać [Concept('integrated_with_icon','zintegrowane')|e] z naszą administracją poprzez [cabinet_with_icon|el], zanim będziemy mogli w pełni zbierać owoce tych podbojów.\n\n@hint! #T Buduj [roads|l] wiodące ze [Concept('capital','stolicy')]#!\n[locations] bez [Concept('control_with_icon','kontroli')|e] są dla naszej administracji właściwie bezużyteczne. Wszystkie [roads_with_icon|e] wiodące do naszej [Concept('capital_with_icon','stolicy')|e] zwiększają [proximity_with_icon|el], a więc i naszą [Concept('control','kontrolę')]. Sprawdzaj często mapę w tym trybie!\n\n@hint! #T Twórz [Concept('subjects','wasali')], aby rządzili podbitą ziemią#!\nW miarę, jak będziesz się rozwijać, podbijesz terytoria leżące daleko poza naszą [Concept('proximity','bliskością')]. Zaleca się tworzenie [Concept('subjects_with_icon','wasali')|e], aby władali ziemią w twoim imieniu, dopóki nie stanie się możliwe zarządzanie nią bezpośrednio.\n\n@hint! #T Anektuj naszych [Concept('subjects','wasali')] w miarę wzrostu [Concept('proximity','bliskości')]#!\nRozwój infrastruktury oraz wzrost [Concept('proximity','bliskości')] uczyni puste dla nas niegdyś ziemie wartymi bezpośredniego posiadania. Aby [Concept('annex_with_icon','anektować')|e] ziemie [Concept('subject','wasala')], musimy władać nimi przez ponad #Y 10#! lat i mieć z nim dobre stosunki.\n\n@hint! #T Zwiększ [Concept('maritime_presence','obecność morską')]#!\nTrudny teren Grecji i Anatolii sprawia, że projekcja [Concept('proximity','bliskości')] drogą lądową jest trudna. Dobra [maritime_presence_with_icon|el] wzdłuż wybrzeży pozwoli na o wiele skuteczniejszą jej propagację drogą morską. [ShowBuildingTypeName('wharf')] i [ShowBuildingTypeName('dock')|l] w miastach oraz [navies_with_icon|el], które patrolują wybrzeże, powinny to umożliwić. Szczególnie przyda się to, jeśli naszą [Concept('capital','stolicą')] stanie się [ShowLocationName('constantinople')]...\n\n@hint! #T Stwórz urząd: [ShowBuildingTypeName('local_governor')]#!\nJeśli zamierzamy bezpośrednio zarządzać ziemiami położonymi daleko od naszej [Concept('capital','stolicy')|e], najlepszym rozwiązaniem będzie [ShowBuildingTypeName('local_governor')]. Będzie pełnić rolę drugiej [Concept('capital','stolicy')|e], zapewniając [Concept('proximity','bliskość')|e] okolicznym [Concept('locations','lokacjom')|e]. Pamiętaj, że jedynym miejscem, w którym mogą działać lokalni gubernatorzy, jest [ShowLocationRankName('city')]. Urząd ten jest drogi w utrzymaniu i wymaga bezpośredniego połączenia [Concept('road','drogowego')|e] z naszą [Concept('capital','stolicą')|e]."
 hint_ottomans_diplomatic: "$hint_advisor_salute_diplomatic$"
 hint_ottomans_administrative: "$hint_advisor_salute_administrative$"
 hint_ottomans_military: "$hint_advisor_salute_military$"
 hint_hre: "Wskazówka dla Świętego Cesarstwa Rzymskiego"
 hint_hre_hint_text: "$hint_hre_hint_text_1$\n\n$hint_hre_hint_text_2$\n\n$hint_hre_hint_text_3$\n\n$hint_hre_hint_text_4$\n\n$hint_hre_hint_text_5$\n\n$hint_hre_hint_text_6$"
 hint_hre_hint_text_1: "[GetInternationalOrganizationType('hre').GetName] to duża [international_organization_with_icon|el] w Europie Środkowej. Członkostwo w [Concept('international_organization','organizacji międzynarodowej')] wpływa na grę każdym państwem."
 hint_hre_hint_text_2: "[hre_emperor_icon] #T Cesarz:#!\n[GetInternationalOrganization('hre').GetNameWithNoTooltip] rządzone jest przez [Concept('hre_emperor_with_icon','świętego cesarza rzymskiego')|e]. [ShowSpecialStatusNameWithNoTooltip('emperor')] ma obowiązek chronić członków Cesarstwa przed zagrożeniami zewnętrznymi, zachowywać wewnętrzne pokój oraz stabilność, a także dbać o jedność religijną w Europie.\n@arrow_bonus_tier_3![ShowSpecialStatusNameWithNoTooltip('emperor')] może wykorzystać #Y $imperial_authority$#!, by proponować [policies_with_icon|el] i [parliament_issues_with_icon|el].\n@arrow_bonus_tier_2! Wykorzystuj różne [diplomatic_actions_with_icon|el], by pokierować innych członków w stronę dogodnej sytuacji politycznej w Cesarstwie.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('enforce_landfriede')] – Wymuś [white_peace|el] na członku.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('enforce_religious_unity')] – Wymuś religię cesarską na członku.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('demand_unlawful_territory')] – Zażądaj zwrotu podbitej [Concept('location','lokacji')|e] poprzedniemu właścicielowi. Jeśli żądanie zostanie odrzucone, przyznany zostanie [casus_belli|el], który to wymusi.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('ask_to_vote_for_me_as_emperor')] – Kosztem [Concept('favors','przysług')|e] możesz zażądać, by [country|l] głosował na ciebie jako cesarza. Żądanie pozostanie w mocy do następnych wyborów.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('bolster_imperial_army')] – Zażądaj, by [country|l] dołączył do jednej z twoich wojen. Otrzyma on zapłatę ze skarbca cesarskiego.\n@arrow_bonus_tier_1! Nadaj [special_status|el] – Każdy [special_status|l] oprócz statusu „[ShowSpecialStatusName('imperial_peasant_republic')]” może być przyznany członkowi Cesarstwa.\n@arrow_bonus_tier_1!Odbierz [special_status|el] – [special_status|l] oprócz statusu „[ShowSpecialStatusName('imperial_peasant_republic')]” może być odebrany członkowi Cesarstwa."
 hint_hre_hint_text_3: "[elector_icon] #T Elektorzy:#!\n[hre_electoral_college_with_icon|e] tworzą [ShowSpecialStatusNamePlural('elector')|l] i [ShowSpecialStatusNamePlural('archbishop_elector')|l]. Ich głos decyduje, kim będzie nowy [ShowSpecialStatusName('emperor')|l], gdy umiera obecna [Concept('ruler','głowa')] [Concept('country','państwa')].\n@arrow_bonus_tier_1! Elekcja jest ważna, gdy na ten sam [country|l] zagłosuje co najmniej połowa obecnych elektorów. Jeśli nie ma większości, w Cesarstwie dochodzi do walki o władzę.\n$BULLET_WITH_TAB$ Walka o władzę jest okresem, kiedy [ShowSpecialStatusName('emperor')|l] nie jest wybrany, a przywileje i powinności cesarza nie są realizowane przez żaden [country|l]. [hre_electoral_college] będzie próbować rozstrzygnąć walkę o władzę poprzez konsolidację głosów. Po 10 latach walka o władzę kończy się przymusowo, a [country|l] z najwyższą [Concept('great_power_score_with_icon','oceną w rankingu mocarstw')|e] otrzymuje status [ShowSpecialStatusName('emperor')|l]."
 hint_hre_hint_text_4: "[hre_law_level_icon] #T Prawa cesarskie:#!\nKonstytucja cesarska określa zasady, których będą przestrzegać Cesarstwo wraz z jego członkami. Opodatkowanie członków w [Concept('gold','złocie')|e] i [Concept('manpower','sile żywej')|e] oraz liczba elektorów i unifikacja Cesarstwa będą określone przez obecnie aktywne [policies|l].\n@arrow_bonus_tier_3! Cesarstwo zaczyna bez [Concept('policy','polityki')] „[ShowPolicyName('golden_bull_policy')]”. [policy|U] „[ShowPolicyName('golden_bull_policy')]” będzie musiała być przedłożona i przegłosowana, zanim będzie możliwe wprowadzenie pozostałych [Concept('policy','polityk')].\n@arrow_bonus_tier_3! Kiedy [policy] „[ShowPolicyName('golden_bull_policy')]” jest w mocy, Cesarstwo ma ustalone podstawowe polityki we wszystkich kategoriach. Wtedy [ShowSpecialStatusName('emperor')|l] ma przywilej wyboru dowolnej [Concept('policy','polityki')] pod głosowanie w Sejmie Rzeszy, jeśli [ShowSpecialStatusName('emperor')|l] ma #Y $imperial_authority$#! do zapłacenia za zmianę [Concept('policy','polityki')].\n@arrow_bonus_tier_2! Każda [policy|l] oznaczona jako „polityka korzystna dla cesarza” przesunie cesarstwo w kierunku zjednoczenia w jedno [Concept('country','państwo')|e], którym władać będzie [ShowSpecialStatusName('emperor')|l].\n@arrow_bonus_tier_1! Unifikacja to nie jedyny cel końcowy cesarstwa. [ShowSpecialStatusName('emperor')] lub określeni członkowie Cesarstwa mogą czerpać korzyści z wielu [Concept('policies','polityk')] bez przyczyniania się do unifikacji."
 hint_hre_hint_text_5: "[parliament_icon] #T Sejm Rzeszy:#!\n Sejm Rzeszy aktywuje się przy dwóch okazjach:\n$TAB$@arrow_bonus_tier_1! Kiedy [ShowSpecialStatusName('emperor')|l] zgłasza nową [Concept('policy','politykę')].\n$TAB$@arrow_bonus_tier_1! Kiedy [ShowSpecialStatusName('emperor')|l] zgłasza [Concept('parliament_issue','kwestię parlamentarną')] wpływającą na wszystkich członków Cesarstwa.\n@arrow_bonus_tier_3! Gdy trwa sesja Sejmu Rzeszy, każdy członek może głosować w obecnej kwestii. Siłę głosu poszczególnych [Concept('country','krajów')|e] określają [special_status_power|l] ich [Concept('special_status','statusu specjalnego')]. Aby zwiększyć siłę głosu, możesz zażądać, by [ShowSpecialStatusName('emperor')|l] nadał ci nowy [special_status|l].\n$BULLET_WITH_TAB$Ogólnie [countries|l] mające [special_status|l] [Concept('hre_electoral_college','kolegium elektorskiego')|e] będą mieć największe [special_status_power|l], a po nich będą [countries|l] w [Concept('country_rank','randze')] „[ShowCountryRankName('rank_kingdom')]” bez miejsca w [Concept('hre_electoral_college','kolegium elektorskim')].\n$BULLET_WITH_TAB$[special_status_power|U] są także określane przez określone [policies|l] w Cesarstwie.\n@arrow_bonus_tier_2! [ShowSpecialStatusName('emperor')|U] może wykorzystać [parliament_agendas|l], by przeciągnąć na swoją stronę kraje o określonym [Concept('special_status','statusie specjalnym')].\n@arrow_bonus_tier_2! [ShowSpecialStatusName('emperor')|U] może użyć [Concept('diplomatic_action','działania dyplomatycznego')] „[ShowCountryInteractionName('bribe_voter_for_policy')]” do przekupienia dowolnego głosującego."
 hint_hre_hint_text_6: "[hre_icon] #T Członkowie:#!\nKażdy [country|l] w [Concept('international_organization','organizacji międzynarodowej')], jeśli nie ma obecnie statusu „[ShowSpecialStatusName('emperor')]”, jest uznawany za jej członka. Jednak ich znaczenie w cesarstwie określają [special_status_power|l].\n@arrow_bonus_tier_3! Zażądaj [Concept('special_status','statusu specjalnego')], który przyznaje [ShowSpecialStatusName('emperor')|l] – Każdy członek może zażądać [Concept('special_status','statusu specjalnego')], o ile spełnia warunki.\n@arrow_bonus_tier_3! [ShowCountryInteractionName('ask_for_dukedom')] – Każdy członek może zażądać awansu [Concept('country_rank','rangi kraju')|e] do poziomu „[ShowCountryRankName('rank_duchy')]”, o ile spełnia warunki. Zmianę [Concept('country_rank','rangi kraju')|e] potwierdza [ShowSpecialStatusName('emperor')|l].\n@arrow_bonus_tier_1! [ShowCountryInteractionName('request_county_privileges')] – Można użyć prośby, by uzyskać dostęp do [Concept('government_reforms','reform rządowych')|e] „[ShowGovernmentReformName('margraviate')]” i „[ShowGovernmentReformName('landgraviate')]”."
 hint_hre_diplomatic: "$hint_advisor_salute_diplomatic$"
 hint_hre_administrative: "$hint_advisor_salute_administrative$"
 hint_hre_military: "$hint_advisor_salute_military$"
 hint_eastern_roman_empire: "Rady początkowe dla [Player.Custom('C_DOP')]"
 hint_eastern_roman_empire_hint_text: "$hint_eastern_roman_empire_text_1$\n\n$hint_eastern_roman_empire_text_2$\n\n$hint_eastern_roman_empire_text_3$\n\n$hint_eastern_roman_empire_text_4$"
 hint_eastern_roman_empire_text_1: "W [Player.Custom('C_DOP')] panuje chaos, a sytuacja wkrótce się pogorszy.\n[ShowRegionName('anatolia_region')] bejliki anatolijskie umocniły swoją pozycję, a państwo [GetCountry('TUR').GetName] niedawno podbiło nasze tereny w lokacjach [ShowLocationName('bursa')] i [ShowLocationName('izmit')]. \n[ShowScriptedGeographyName('greece_geography')] powoli znów trafia w nasze ręce, gdyż zdołaliśmy odzyskać prowincję [ShowProvinceDefinitionName('thessaly_province')] i okolice pasma górskiego Pindos, ale państwa frankijskie nadal sprawują tam władzę.\nNa północy [GetCountry('SER').GetName] i [GetCountry('BUL').GetName] czają się na nasze ziemie niczym sępy.\n#italic Być może podżeganie do walki o wolność w kraju [GetCountry('SMC').GetName] da nam nowego sojusznika#!."
 hint_eastern_roman_empire_text_2: "@hint! #T Zarządzanie stanami#!\nWewnętrznie nasze stany uległy znacznej korupcji, czego dowodem są cztery przywileje: [ShowEstatePrivilegeName('consolidated_corruption_of_the_nobles')], [ShowEstatePrivilegeName('consolidated_corruption_of_the_clergy')], [ShowEstatePrivilegeName('consolidated_corruption_of_the_burghers')] oraz [ShowEstatePrivilegeName('consolidated_corruption_of_the_peasants')] rujnujące nasz naród. Niezwykle ważne jest, abyśmy jak najszybciej się ich pozbyli.\n\n[societal_value|e] znana jako [ShowSocietyDirectionName('communalism')|l] to świetny początek tego przedsięwzięcia.\n[estate_privileges_with_icon|E] rozdawane stanom może pomóc nam utrzymać je w ryzach, gdy zaczną się na nas gniewać. Pamiętaj jednak, że nasza [legitimacy_with_icon|E] ma ogromne znaczenie dla naszego narodu."
 hint_eastern_roman_empire_text_3: "@hint! #T Kierunki rozwoju gospodarczego#!\nNasze prowincje [ShowProvinceDefinitionName('constantinople_province')] i [ShowProvinceDefinitionName('edirne_province')] stanowią doskonały punkt wyjścia do ożywienia naszej gospodarki. [Player.GetLongName] może odnieść ogromne korzyści z produkcji dóbr takich jak [ShowGoodsName('fine_cloth')|l], jednocześnie rozwijając przemysł oparty o [ShowGoodsName('silk')|l]. [ShowProvinceDefinitionName('edirne_province')] może stać się naszą kluczową prowincją, w której powstają [ShowGoodsName('tools')|l] i [ShowGoodsName('firearms')|l].\n\n[ShowProvinceDefinitionName('chalkidiki_province')] jest również bogata w zasoby naturalne, a [ShowLocationRankName('city')] w [ShowLocationName('thessaloniki')] jest najlepszym miejscem, w którym może powstać [ShowGoodsName('jewelry')|l]. Być może, jeśli znajdą się tam [market_with_icon|el] i [ShowBuildingTypeName('local_governor')], moglibyśmy sporo zarobić.\n\nNasze ostatnie podboje w regionach [ShowProvinceDefinitionName('thessaly_province')] i [ShowAreaName('morea_area')] będą wymagać sporo czasu, zanim staną się integralną częścią imperium i dopiero potem zaczną przynosić zyski.\n#italic Być może rozsądnym posunięciem byłoby utworzenie kilku urzędów [ShowSubjectTypeName('pronoia')] w tych prowincjach#!."
 hint_eastern_roman_empire_text_4: "@hint! #T Sprawy zewnętrzne#!\nNic innego nie będzie mieć znaczenia, jeśli nie zdołamy przetrwać naporu obcych sił, które dążą do naszego upadku. Powinniśmy postarać się ustabilizować sytuację wewnętrzną, rozwiązać wszelkie problemy, jakie niesie ze sobą [ShowDisasterName('byzantine_succession_crisis')] oraz stworzyć zdrową gospodarkę, która będzie w stanie sfinansować naszą armię. Wtedy będziemy mogli odzyskać nasze ziemie, a nawet wszystkie [ShowScriptedGeographyName('roman_borders_geography')].\n\nMoglibyśmy również natychmiast przejść do ofensywy, odzyskując lokacje [ShowLocationName('bursa')] i [ShowLocationName('izmit')], które posiada państwo [GetCountry('TUR').GetName], a następnie resztę regionu [ShowScriptedGeographyName('byzantine_aegean_coastline')]. To rozwiązanie będzie trudniejsze, ponieważ wymaga od nas jednoczesnego radzenia sobie z problemami wewnętrznymi i zewnętrznymi, co mocno wpłynie na naszą stabilność i ożywienie gospodarcze.\n\nJednak każde działanie obarczone wysokim ryzykiem przynosi wielkie korzyści. Powinniśmy być ambitni i sami kierować naszym losem, zamiast czekać, co nam przyniesie."
 hint_eastern_roman_empire_diplomatic: "$hint_advisor_salute_diplomatic$"
 hint_eastern_roman_empire_administrative: "$hint_advisor_salute_administrative$"
 hint_eastern_roman_empire_militrary: "$hint_advisor_salute_military$"
