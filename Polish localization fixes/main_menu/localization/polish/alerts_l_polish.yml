 ALERT_BEING_ANNEXED_LOYAL: "#T Aneksja#!\nNasz [overlord|el], $OVERLORD$, rozpoczął dyplomatyczną [Concept('annex','aneksję')|e] naszego kraju.\n\nJako że nie jesteśmy [Concept('disloyal_subject','nielojalnym poddanym')|e], proces ten będzie co miesiąc postępował i zakończy się sukcesem około $TIME$.\n\nJeśli zostaniemy zaanektowani, to koniec!\n\nMożemy spowolnić ich postępy, korzystając z [Concept('cabinet_actions','działań gabinetu')|e] „[ShowCabinetActionName('frustrate_annexation')]”, bądź też wypowiedzieć im [Concept('war','wojnę')|e], wykorzystując [casus_belli|el] „[ShowCasusBelliName('cb_resist_annexation')]”!\n\n"
