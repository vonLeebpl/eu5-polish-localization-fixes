l_polish:
 lutheranism_movement: "Luteranizm"
 lutheranism_movement_desc: "Reformacja protestancka przetacza się przez świat chrześcijański. Nauki Marcina Lutra rozpaliły religijny przewrót, który zagraża władzy Kościoła Katolickiego i gwałtownie szerzy się w niezadowolonych społecznościach."
 lutheranism_movement_location_modifier: "$lutheranism_movement$ – modyfikator"
 calvinism_movement: "Kalwinizm"
 calvinism_movement_desc: "Ruch inspirowany zreformowaną teologią Jana Kalwina. Szerzy surowszą i bardziej usystematyzowaną formę doktryny protestanckiej, która przemawia głównie do klas kupieckich i społeczności miejskich Europy."
 calvinism_movement_location_modifier: "$calvinism_movement$ – modyfikator"
 roman_culture_movement: "Odrodzenie latynizmu"
 hellenism_religion_movement: "Odrodzenie platonizmu"
 hellenism_religion_movement_allow_tt: "[GetCountry('BYZ').GetName] musi to zrobić poprzez działanie „[ShowGenericActionName('reestablish_hellenism')]” lub [events|el] Gemista-Pletona."
 roman_culture_movement_allow_tt: "[GetCountry('BYZ').GetName] musi skłaniać się ku postawie [ShowSocietyDirectionName('latinization')] i posiadać [Concept('urban_location','lokację miejską')|e] z [Concept('dominant_language','dominującym językiem')|e] romańskim i [Concept('average_satisfaction','przeciętną satysfakcją')|e] ponad 50%"
 hellenism_religion_movement_desc: "Wśród greckich i rzymskich społeczności chrześcijańskich narasta pragnienie powrotu do dawnych zwyczajów i mądrości ich helleńskich przodków."
 hellenism_religion_movement_location_modifier: "$hellenism_religion_movement$ – modyfikator"
 roman_culture_movement_desc: "Odrodzenie tradycji łacińskich w odrodzonym Cesarstwie Rzymskim."
