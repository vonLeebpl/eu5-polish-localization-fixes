 steppe_group: "Grupa stepowa"
 steppe_group_cadj: "Grupa stepowa"
 steppe_group_desc: "Grupę stepową tworzą różne kultury należące do grup mongolskiej i tatarskiej, które żyją na stepach Eurazji."
 rhaetian_group: "Retyjs"
 rhaetian_group_cadj: "Retyjs"
 rhaetian_group_desc: "Ludy grupy retyjskiej to etnolingwistyczna grupa złożona z trzech głównych społeczności alpejskich: Romanszów, Ladynów i Furlan. Mimo że nie tworzą jednego bytu politycznego, jednoczą je pochodzenie od powszechnej zbarbaryzowanej łaciny z naleciałościami starożytnego retyjskiego oraz wpływami celtyckimi."
 hmong_mien_group: "Hmong-Mien"
 hmong_mien_group_cadj: "Hmong-Mien"
 hmong_mien_group_desc: "Ludy Hmong-Mien zamieszkują wyżyny południowych Chin i Południowowschodniej Azji. Mówią językami niezależnej rodziny Hmong-Mien, niespokrewnionej z żadną z sąsiednich. Znani są z barwnych tradycji tekstylnych oraz zaciekłej niezależności. Historycznie stawiali opór asymilacji w otaczające je imperia nizinne."
 papuan_group: "Papua"
 papuan_group_cadj: "Papua"
 papuan_group_desc: "Ludy Papua to rdzenni mieszkańcy Nowej Gwinei i sąsiednich wysp. Mówią setkami języków z różnych, zwykle niespokrewnionych rodzin językowych znanych łącznie jako papuaskie. Ich nadzwyczajna językowa i kulturowa różnorodność odzwierciedla tysiące lat odrębnego rozwoju w surowym terenie wyspy."
 atlantic_group: "Atlantyc"
 atlantic_group_cadj: "Atlantyc"
 atlantic_group_desc: "Atlantyckie ludy Afryki Zachodniej zamieszkują wybrzeża i sawanny od Senegambii po Sierra Leone. Mówią językami atlantyckiej gałęzi rodziny nigero-kongijskiej. Wśród nich znaleźć można wspaniałych jeźdźców i kupców z wybrzeża Senegambii, jak również żyjące w lasach ludy Mel z głębi Sierra Leone."
 kru_group: "Kru"
 kru_group_cadj: "Krus"
 kru_group_desc: "Ludy Kru z wybrzeży Liberii i Wybrzeża Kości Słoniowej mówią językami gałęzi kru rodziny nigero-kongijskiej. Słyną ze swych talentów żeglarskich oraz zaciekłego oporu wobec zniewolenia. Ich morskie tradycje przez stulecia czyniły ich wartościowymi żeglarzami wybrzeża Afryki Zachodniej."
 kwa_group: "Kwa"
 kwa_group_cadj: "Kwas"
 kwa_group_desc: "Ludy Kwa z afrykańskiego Złotego Wybrzeża i Zatoki Beninu mówią językami gałęzi kwa rodziny nigero-kongijskiej, obejmującej państwa Akan głębi lądu i przybrzeżne kraje Ewe oraz Fonów. Ich społeczeństwa charakteryzują się dziedziczeniem matrylinearnym wśród Akan oraz silną tradycją religijną Vodun u Ewe i Fonów."
 volta_niger_group: "Woltańsko-nigeryjs"
 volta_niger_group_cadj: "Woltańsko-nigeryjs"
 volta_niger_group_desc: "Ludy woltańsko-nigeryjskie Nigerii mówią językami gałęzi woltańsko-nigeryskiej rodziny nigero-kongijskiej. To jedne z najliczniejszych i politycznie rozwiniętych społeczności Afryki Zachodniej. Miasta-państwa Jorubów, wiejskie republiki Ibów i Królestwo Beninu należą do najbardziej doświadczonych ustrojów politycznych kontynentu."
 bantu_group: "Bantus"
 bantu_group_cadj: "Bantus"
 bantu_group_desc: "Ludy Bantu to największa gromada językowa Afryki subsaharyjskiej, która przez trzy tysiąclecia niosła języki bantu oraz praktyki rolnicze z ojczyzny w pobliżu granicy Kamerunu i Nigerii przez Afrykę Środkową, Wschodnią i Południową. Dziś ludy mówiące bantu zajmują niemal całą południową połowę kontynentu."
 central_african_group: "Środkowoafrykańs"
 central_african_group_cadj: "Środkowoafrykańs"
 central_african_group_desc: "Ludy Afryki Środkowej zajmują rozległą Kotlinę Konga i otaczające ją wyżyny. Mówią językami z rodzin adamawa, ubangijskiej i pokrewnych. Ich kultury są tak różne jak lasy deszczowe, sawanny czy rzeki, które zwą swymi domami, począwszy od zamieszkującego lasy Baka po trybutariuszy rzecznych z wielkich dopływów Konga."
 nilotic_group: "Nilotyc"
 nilotic_group_cadj: "Nilotyc"
 nilotic_group_desc: "Ludy nilotyckie to społeczności pasterskie i półpasterskie doliny Nilu oraz równin wschodnioafrykańskich. Mówią językami gałęzi nilotyckiej rodziny nilo-saharyskiej. Od hodujących bydło Masajów do rybaków Suddu, łączą je struktury społeczne oparte na wieku i głębokiej zależności od żywego inwentarza."
 nilosahelian_group: "Nilo-saharyjs"
 nilosahelian_group_cadj: "Nilo-saharyjs"
 nilosahelian_group_desc: "Ludy nilo-saharyjskie zamieszkują szeroki pas, który rozciąga się od Sahary po wyżyny Etiopii. Mówią językami różnorodnej rodziny nilo-saharyjskiej. Zawierają rolników z Gór Nubijskich, kupców sułtanatów Darfuru i nomadów pogranicza saharyjskiego."
 cushitic_group: "Kuszyc"
 cushitic_group_cadj: "Kuszyc"
 cushitic_group_desc: "Ludy kuszyckie Rogu Afryki i Doliny Nilu mówią językami kuszyckiej gałęzi rodziny afro-azjatyckiej. Mieszczą wielbłądzich nomadów Somalii i Ogadenu, wyżynnych rolników etiopskiego Wielkiego Rowu oraz starożytnych Beja z wybrzeża Morza Czerwonego."
 khoisan_group: "Khoisan"
 khoisan_group_cadj: "Khoisan"
 khoisan_group_desc: "Ludy Khoisan południowej i wschodniej Afryki należą do najstarszych istniejących społeczności na Ziemi. Mówią językami, które wyróżniają się charakterystycznymi mlaskami. Zawierają łowiecko-zbierackich San z Kalahari i pasterzy Khoikhoi z Przylądka, czyli ludy zamieszkujące południową Afrykę na długo przed ekspansją Bantu."
 permic_group: "Permijs"
 permic_group_cadj: "Permijs"
 permic_group_desc: "Ludy grupy permijskiej z regionu Uralu mówią językami permijskimi rodziny uralskiej, blisko spokrewnionymi z fińskim i estońskim. Ludy Komi oraz Udmurt od dawna zamieszkiwały lasy pomiędzy Wołgą a Uralem, handlując futrami ze swymi słowiańskimi i tatarskimi sąsiadami."
 mordvinic_group: "Mordwińs"
 mordvinic_group_cadj: "Mordwińs"
 mordvinic_group_desc: "Ludy mordwińskie regionu środkowej Wołgi mówią językami mordwińskimi z rodziny uralskiej, tworząc jedną z największych jednorodnych grup w europejskiej części Rosji. Moksza i Erzja są blisko spokrewnione, ale mówią różnymi językami oraz zachowują odrębne tożsamości kulturowe."
 pama_nyungan_group: "Pama-nyungańs"
 pama_nyungan_group_cadj: "Pama-nyungańs"
 pama_nyungan_group_desc: "Ludy pama-nyungańskie zamieszkują większość kontynentu australijskiego. Mówią językami rodziny pama-nyungańskiej, która pokrywa z grubsza 80% lądu Australii. Pomimo ogromnego zróżnicowania tej rodziny ludy dzielą wzorce kulturowe, w tym złożone systemy pokrewieństwa, kosmologię czasu snu i utrzymywanie się z łowiectwa-zbieractwa."
 australian_group: "Australijs"
 australian_group_cadj: "Australijs"
 australian_group_desc: "Aborygeńskie ludy Australii należą do najstarszych istniejących kultur na Ziemi. Zamieszkują kontynent od co najmniej 65 tys. lat. Ich głęboki związek z ziemią wyrażony ideą Marzenia, jak również zaawansowana świadomość ekologiczna sprawiają, że stanowią jedne z najbardziej niepowtarzalnych ludów na świecie."
 east_african_coast_group: "Wybrzeże Swahili"
 east_african_coast_group_cadj: "Wybrzeże Swahili"
 east_african_coast_group_desc: "Ludy Wybrzeża Swahili wykształciły wyróżniającą się morską cywilizację wzdłuż wybrzeży Oceanu Indyjskiego w Afryce Wschodniej, która łączy rolnicze tradycje Bantu z merkantylną kulturą kupców arabskich i perskich. Ich koralowe miasta-państwa od Mogadiszu po Kilwę tworzyły port przeładunkowy dla wielkiej sieci handlowej Oceanu Indyjskiego."
 great_lakes_kingdoms_group: "Królestwa Wielkich Jezior"
 great_lakes_kingdoms_group_cadj: "Królestwa Wielkich Jezior"
 great_lakes_kingdoms_group_desc: "Ludy Wielkich Jezior Afrykańskich wytworzyły niektóre z najbardziej zawansowanych struktur państwowych w Afryce subsaharyjskiej z hierarchicznymi krajami opartymi na bogactwie bydła i dziedzicznymi królestwami. Od królestwa Bugandy na południowym brzegu Jeziora Wiktorii po wzgórza tarasowe Rwandy – ludy zamieszkujące tereny pomiędzy jeziorami mają wspólną kulturę danin, dworów królewskich i organizacji klanowych."
 east_african_nomad_group: "Wschodnioafrykańska pasters"
 east_african_nomad_group_cadj: "Wschodnioafrykańska pasters"
 east_african_nomad_group_desc: "Pasterskie ludy pasma Afryki Wschodniej rozciągają się na wielkich sawannach i półpustynnych równinach od wyżyn Etiopii po stepy Tanzanii, wypasając bydło, wielbłądy oraz kozy na sezonowych pastwiskach. Zorganizowane w systemie opartym na wieku wojowników i pozbawione trwałych państw terytorialnych, tworzą wielojęzykowy świat obejmujący języki nilotyckie, kuszyckie i inne."
 nguni_group: "Nguni"
 nguni_group_cadj: "Ngunis"
 nguni_group_desc: "Ludy Nguni południowowschodniej Afryki mówią gromadą blisko spokrewnionych języków Bantu, które wyróżniają się bogatym systemem mlasków zapożyczonym od sąsiednich ludów Khoisan. Zorganizowani według posiadanego bydła, wieku oraz potężnych wodzostw, Naguni zdołali powstać przeciwko wielkim nacjom Zulu i Khosa, które dominowały na wschodnim wybrzeżu południowej Afryki."
 sotho_tswana_group: "Sotho-Tswanas"
 sotho_tswana_group_cadj: "Sotho-Tswanas"
 sotho_tswana_group_desc: "Ludy Sotho-Tswana południowoafrykańskiego Wielkiego Weldu mówią blisko spokrewnionymi językami sotho i tswana. Dzielą dziedzictwo życia wiejskiego, majątku opartego na bydle oraz zaawansowanego wytwórstwa żelaza. Ich duże miasta pośrodku płaskowyżu należały do najliczniejszych osad w przedkolonialnej Afryce Południowej."
 shona_group: "Szona"
 shona_group_cadj: "Szonas"
 shona_group_desc: "Mówiące językiem shona ludy z płaskowyżu Zimbabwe i doliny Limpopo zbudowały jedną z najbardziej wyjątkowych cywilizacji przedkolonialnych wokół Domu z Kamieni Wielkiego Zimbabwe i jego państw spadkobierców. Dzięki kontrolowaniu szlaku handlu złotem przez wybrzeże Oceanu Indyjskiego osiągnęli wpływy handlowe rozciągające się nawet na Chiny i Persję."
 kongo_group: "Kongo"
 kongo_group_cadj: "Kongo"
 kongo_group_desc: "Ludy Kongo dolnego biegu rzeki Kongo i wybrzeża Atlantyku utworzyły jedno z najbardziej scentralizowanych państw Afryki subsaharyjskiej o nazwie Królestwo Kongo, które posiada zaawansowaną biurokracje, gubernatorów prowincji i system monetarny wykorzystujący muszle nzimbu. Jego wczesny kontakt z kupcami portugalskimi pod koniec XV wieku sprawił, że Królestwo Kongo było pierwszy afrykańskim ustrojem politycznym, który nawiązał równe stosunki z potęgami europejskimi."
 luba_group: "Luba"
 luba_group_cadj: "Lubas"
 luba_group_desc: "Ludy Luba i Lunda płaskowyżu Katanga i dorzecza Kasai stworzyły powiązaną sieć imperiów trybutarnych, które przez stulecia dominowały w sercu Afryki. Królestwo Luba wprowadziło do Afryki Środkowej wywodzący się znad Nilu model boskiego królestwa, a podboje Lunda zaniosły ich polityczny system mianowanych gubernatorów na rozległe połacie kontynentu od Angoli po Zambię."
 chokwe_group: "Chokwe"
 chokwe_group_cadj: "Chokwes"
 chokwe_group_desc: "Ludy Chokwe z płaskowyżu Angolii słyną z nadzwyczajnych tradycji artystycznych, zwłaszcza masek i rzeźb z drewna, oraz roli w rozległych sieciach handlowych łączących wybrzeże Atlantyku z głębią lądu Afryki Środkowej. Pierwotnie byli poddanymi królestwa Lunda, ale dynamicznie się rozwinęli w XIX stuleciu, by stać się jednym z dominujących ludów w regionie."
