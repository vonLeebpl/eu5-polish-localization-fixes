l_polish:
 sponsor_a_cathedral_decision.title: "Ufundowanie katedry"
 sponsor_a_cathedral_decision.desc: "Naszemu krajowi wciąż brakuje miejsc do oddawania czci i praktykowania naszej wiary. Powinniśmy ufundować budowę nowej [ShowBuildingTypeName('cathedral')], aby zaspokoić potrzeby naszego ludu."
 sponsor_a_cathedral_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 sponsor_a_cathedral_decision.a.entry: "$common_string_brilliant$"
 sponsor_a_cathedral_decision.b: "This is not the right time."
 sponsor_a_cathedral_cooldown_tt: "Nie skorzystano jeszcze z tej [decision|e] podczas panowania obecnego władcy"
 sponsor_a_great_madrasa_decision.title: "Ufundowanie wielkiej medresy"
 sponsor_a_great_madrasa_decision.desc: "Choć nasz kraj ma już wiele miejsc kultu, zwykłe [ShowBuildingTypeName('temple')] i [ShowBuildingTypeName('madrasa')] nie wystarczają, by zaspokoić wielkie umysły naszych uczonych. Powinniśmy zainwestować w nową [ShowBuildingTypeName('great_madrasa')], aby zapewnić im odpowiednie warunki do nauki i szerzenia wiedzy."
 sponsor_a_great_madrasa_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 sponsor_a_great_madrasa_decision.a.entry: "$common_string_brilliant$"
 sponsor_a_great_madrasa_decision.b: "This is not the right time."
 sponsor_a_great_madrasa_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 construct_a_grand_palace_decision.title: "Zlecenie budowy nowego pałacu"
 construct_a_grand_palace_decision.desc: "Naszemu dworowi oraz rodzinie naszego władcy brakuje siedziby godnej ich prestiżu. Powinniśmy zatrudnić architekta, który zaplanuje budowę nowego, wielkiego pałacu."
 construct_a_grand_palace_decision.a: "To będzie odpowiednia siedziba."
 strive_towards_thalassocracy_decision.title: "Ustanowienie talasokracji"
 strive_towards_thalassocracy_decision.desc: "Rozległe morza mogłyby stać się istotną częścią naszego kraju i jego ekonomicznej ekspansji, gdybyśmy tylko potrafili odpowiednio zapanować nad wodami wzdłuż naszego wybrzeża. Zainwestowanie znacznych zasobów w rozbudowę naszej floty pozwoliłoby dostosować naszą infrastrukturę do nowego nastawienia na zamorskie ambicje."
 strive_towards_thalassocracy_decision.a: "Zwróćmy się ku morzu."
 strive_towards_thalassocracy_decision.a.tt: "Będziemy mieli 20 lat na zbudowanie silnej floty"
 strive_thalassocracy_coastal_markets_tt: "Posiada przynajmniej jeden nadmorski [market_center|e]"
 abandon_thalassocracy_decision.title: "Porzucenie talasokracji"
 abandon_thalassocracy_decision.desc: "Rządzenie poprzez dominację nad morzami nie odpowiada już naszym własnym ambicjom. Powinniśmy skierować nasze wysiłki ku ziemi, na której żyjemy."
 abandon_thalassocracy_decision.a: "Wróćmy na pewniejszy grunt."
 found_trade_company_india_decision.title: "Wsparcie naszych azjatyckich szlaków handlowych"
 found_trade_company_india_decision.desc: "Zamożne wybrzeża [ShowSubContinentName('south_asia')] i [ShowSubContinentName('south_east_asia')] obiecują nam wielkie zyski. Choć nasze obecne wysiłki handlowe prowadzone są głównie przez pojedynczych kupców, jest to wyraźnie niewystarczające dla kraju naszej rangi. Powinniśmy wykorzystać narzędzia naszego państwa, aby ustanowić większe misje handlowe między tymi zagranicznymi rynkami a naszym własnym."
 found_trade_company_india_decision.a: "Zainwestuj w Kompanię Handlową Indii."
 invite_foreign_advisor_decision.title: "Zakup zagranicznych innowacji"
 invite_foreign_advisor_decision.desc: "Nasz kraj poważnie ustępuje innym wielkim mocarstwom świata. Nie możemy siedzieć bezczynnie, gdy inne kraje wyprzedzają nas w dziedzinie technologii i innowacji. Oferując hojną pensję osobie z jednego z tych krajów, możemy spróbować nadrobić dystans do innych i nie pozostać jeszcze bardziej w tyle w dążeniu do modernizacji."
 invite_foreign_advisor_decision.a: "Powitaj zagranicznego uczonego."
 invite_foreign_advisor_decision.a.tt: "Uczony z obcego [Concept('country','kraju')|e] dołączy do naszego [Concept('court','Dworu')|e]"
 invite_foreign_advisor_decision.b: "Nasi własni doradcy wystarczą."
 invite_foreign_advisor_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 disempower_the_parliament_decision: "Challenge the Rights of the Parliament"
 disempower_the_parliament_decision_desc: "Over the last centuries our parliament has acquired certain rights that limit our government in its own freedom. We should look towards those with entrenched seats in the parliament and revoke their rights!"
 disempower_the_parliament_decision.a: "Musimy ograniczyć władzę parlamentu."
 disempower_the_parliament_decision.b: "To nie jest właściwy moment, by rzucić wyzwanie parlamentowi."
 abolish_serfdom_decision.title: "Zniesienie pańszczyzny"
 abolish_serfdom_decision.desc: "Praktyka pańszczyzny, stosowana w naszym kraju od dawna, stała się przeszkodą dla naszych celów gospodarczych. Biorąc pod uwagę niestabilny klimat polityczny naszych czasów, rozsądnym rozwiązaniem mogłoby być zniesienie jej mocą dekretu, aby zadowolić naszą rosnącą klasę średnią i ulżyć w cierpieniach tym, którzy żyją pod batem."
 abolish_serfdom_decision.a: "Podpisać dekret."
 abolish_serfdom_decision.b: "Byłoby to zbyt destabilizujące."
 abandon_absolutism_decision.title: "Odejście od absolutyzmu"
 abandon_absolutism_decision.desc: "Absolutystyczny rząd naszego władcy staje się coraz większym zagrożeniem dla wewnętrznej stabilności naszego kraju. Pogłoski o buncie stają się coraz częstsze, a tłumienie przeciwników naszego reżimu nie jest łatwym zadaniem. Może nadszedł czas, aby odwrócić się od starych ideałów absolutyzmu i przyjąć bardziej liberalną formę rządu dla naszego kraju?"
 abandon_absolutism_decision.a: "Absolutyzm nie jest już dla nas odpowiedni."
 abandon_absolutism_decision.b: "Nasza władza jest najwyższa!"
 construct_a_grand_palace_decision.a_tt: "Zatrudniony [ShowArtistTypeName('architect')] dołączy do naszego [Concept('court','Dworu')|e]"
 disempower_the_parliament_decision.a_building_tt: "Usuniemy [ShowBuildingTypeName('urban_parliament_seat')] w jednej z naszych [locations|e]"
 disempower_the_parliament_decision.a_tt: "Każda [pop|e] w [location|e] straci [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [pop_satisfaction|e]"
 disempower_the_parliament_decision.desc: "W ciągu ostatnich wieków nasz parlament zdobył pewne prawa, które ograniczają swobodę działania naszego rządu. Powinniśmy zwrócić się przeciw tym, którzy zasiadają w nim na trwałe, i odebrać im ich prawa!"
 disempower_the_parliament_decision.title: "Podważenie praw parlamentu"
 disempower_the_parliament_decision_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 jewish_expulsion_threat.a: "Postawić ultimatum."
 jewish_expulsion_threat_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 STATIC_MODIFIER_NAME_jewish_expulsion_threat: "Groźba wydalenia"
 jewish_expulsion_threat.desc: "Korona wystosowuje formalne ultimatum: społeczności żydowskie mają płacić podatek nadzwyczajny albo stawić czoła wygnaniu. Groźba natychmiast zapewnia przypływ gotówki od przestraszonej ludności, ale atmosfera niepewności zakłóca sieci handlowe od dawna zarządzane przez pośredników żydowskich."
 jewish_expulsion_threat.title: "Groźba wydalenia"
 jews_may_choose_to_leave_tt: "Większość naszych #L [ShowReligionAdjective('judaism')|l]ich#! [pops|e] migruje do sąsiednich [Concept('countries','państw')|e]\n\nKażda [location|el], którą opuszczą, straci modyfikator [ShowModifier('jewish_expulsion_threat')] skalowany do udziału [Concept('pops','społeczności')] [ShowReligionAdjectiveWithNoTooltip('judaism')|l]iej"
